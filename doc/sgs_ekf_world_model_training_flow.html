lf._get_seg_id()\n        seg_image = torch.stack(self.camera_sensor_dict[\"forward_seg\"]).to(self.device).clone()\n        forward_mask = (seg_image == seg_id)\n      \n        forward_mask_image = forward_mask.float()\n  \n        forward_mask_image[forward_mask_image > 0.5] = 1.\n        forward_mask_image[forward_mask_image <= 0.5] = 0.\n        \n        depth_image = torch.stack(self.camera_sensor_dict[\"forward_depth\"]).to(self.device).clone()\n        \n        depth_image[depth_image < -2] = -2\n        depth_image[depth_image > -self.depth_clip_lower] = 0\n        if self.depth_random:\n            depth_image = self.depth_transform(depth_image)\n            \n        depth_image *= -1\n        normalized_depth = (depth_image - 0.) / (2. - 0.)\n        \n        \n        forward_seg_depth = normalized_depth * forward_mask_image\n        \n        return normalized_depth.flatten(start_dim=1), \\\n            forward_mask_image.flatten(start_dim=1), \\\n            forward_seg_depth.flatten(start_dim=1)\n\n    def check_termination(self):\n        \"\"\"\n        Add early stop to prevent the agent from gaining too much useless data\n        \"\"\"\n        base_quat = self._robot_root_states[:, 3:7]\n        r, p, _ = euler_from_quat(base_quat)\n        z = self._robot_root_states[:, 2]\n        \n        r_term = torch.abs(r) > 0.8 ## prevent roll too big\n        p_term = torch.abs(p) > 0.8 ## prevent picth too big\n        z_term = z < 0.1\n        self.timeout_buf = self.progress_buf >= self.max_episode_length\n\n        curr_ee_pos_local = quat_rotate_inverse(self._robot_root_states[:, 3:7], self.ee_pos - self.arm_base)\n        ik_fail = (self.curr_ee_goal_cart[:, -1:] - curr_ee_pos_local[:, -1:]).norm(dim=-1) > 0.2 ## 防止机械臂末端的z和ee目标的z差值太大，比如机械臂再重力作用下夹爪被迫朝上了，超过阈值就reset\n        # ik_fail &= (torch.div(self.curr_ee_goal_cart[:, -1], curr_ee_pos_local[:, -1]) < 0)\n        # print(\"ikfail\", ik_fail[0], self.curr_ee_goal_cart[0, -1:], curr_ee_pos_local[0, -1:])\n        \n        # curr_to_goal = self.curr_ee_goal_cart - curr_ee_pos_local\n        # curr_ee_vel_unorm = curr_ee_pos_local - self.last_ee_pos\n        # ik_fail = (torch.nn.CosineSimilarity(dim=1, eps=1e-6)(curr_to_goal, curr_ee_vel_unorm) <= 0) & (torch.norm(curr_ee_vel, dim=-1) > 0.02)\n        self._terminate_buf[:] = r_term | p_term | z_term | ik_fail\n        self.reset_buf[:] = self.timeout_buf | self._terminate_buf.bool()\n        \n        self.last_ee_pos = curr_ee_pos_local\n\n    def _prepare_reward_function(self):\n        # Keep disabled terms visible as zero contributions without evaluating\n        # their reward functions, which may have environment side effects.\n        self.reward_component_names = tuple(self.reward_scales)\n        for key in list(self.reward_scales.keys()):\n            scale = self.reward_scales[key]\n            if scale == 0:\n                self.reward_scales.pop(key)\n        \n        self.reward_functions, self.reward_names = [], []\n        for name, scale in self.reward_scales.items():\n            if name == \"termination\":\n                continue\n            self.reward_names.append(name)\n            name = \"_reward_\" + name\n            self.reward_functions.append(getattr(self, name))\n        \n        self.episode_sums = {name: torch.zeros(self.num_envs, dtype=torch.float, device=self.device, requires_grad=False)\n                             for name in self.reward_scales.keys()}\n        self.episode_metric_sums = {name: torch.zeros(self.num_envs, dtype=torch.float, device=self.device, requires_grad=False)\n                                    for name in list(self.reward_scales.keys()) + list(self.reward_scales.keys())}\n    \n    def compute_reward(self):\n        self.rew_buf[:] = 0.0\n        tsil_enabled = getattr(self, \"tsil_enabled\", False)\n        if tsil_enabled:\n            self.tsil_reward_fixed.zero_()\n            self.tsil_reward_command_raw.zero_()\n        reward_components = dict.fromkeys(\n            self.reward_component_names, self.rew_buf.new_zeros(()))\n        \n        for i in range(len(self.reward_functions)):\n            name = self.reward_names[i]\n            rew, metric = self.reward_functions[i]()    \n            rew *= self.reward_scales[name]    \n            self.rew_buf += rew\n            if tsil_enabled and name not in (\"pick_up\", \"command_reward\"):\n                self.tsil_reward_fixed += rew\n            self.episode_sums[name] += rew\n            self.episode_metric_sums[name] += metric\n            reward_components[name] = torch.as_tensor(\n                rew, device=self.rew_buf.device, dtype=self.rew_buf.dtype).detach().mean()\n        if self.cfg[\"reward\"][\"only_positive_rewards\"]:\n            # Account for clipping so the logged contributions still add up\n            # to the total reward. Termination is added after this adjustment.\n            reward_components[\"positive_clipping_adjustment\"] = (\n                torch.clamp(-self.rew_buf, min=0.0).detach().mean())\n            self.rew_buf[:] = torch.clip(self.rew_buf, min=0.0)\n        \n        if \"termination\" in self.reward_scales:\n            rew, metric = self._reward_termination()\n            rew *= self.reward_scales[\"termination\"]\n            self.rew_buf += rew\n            if tsil_enabled:\n                self.tsil_reward_fixed += rew\n            self.episode_sums[\"termination\"] += rew   \n            self.episode_metric_sums[\"termination\"] += metric\n            reward_components[\"termination\"] = torch.as_tensor(\n                rew, device=self.rew_buf.device, dtype=self.rew_buf.dtype).detach().mean()\n\n        # Scalar tensors stay on the simulation device until the logger batches\n        # their transfer. These are per-step values, not episode snapshots.\n        self.extras[\"reward_components\"] = reward_components\n            \n    def get_walking_cmd_mask(self, env_ids=None, return_all=False):\n        if env_ids is None:\n            env_ids = torch.arange(self.num_envs, device=self.device)\n        walking_mask0 = torch.abs(self.commands[env_ids, 0]) > LIN_VEL_X_CLIP\n        walking_mask1 = torch.abs(self.commands[env_ids, 1]) > ANG_VEL_PITCH_CLIP\n        walking_mask2 = torch.abs(self.commands[env_ids, 2]) > ANG_VEL_YAW_CLIP\n        walking_mask = walking_mask0 | walking_mask1 | walking_mask2\n        if return_all:\n            return walking_mask0, walking_mask1, walking_mask2, walking_mask\n        return walking_mask\n            \n    def _step_contact_targets(self):\n        if self.observe_gait_commands:\n            frequencies = 2\n            phases = 0.5\n            offsets = 0\n            bounds = 0\n            durations = 0.5\n            self.gait_indices = torch.remainder(self.gait_indices + self.dt * frequencies, 1.0)\n            \n            is_walking = self.get_walking_cmd_mask()\n            \n            # suddenly want to stop\n            suddenstop_indices = ((self.gait_wait_timer > 0) | ((~is_walking) & (self.is_walking))).bool()\n            if len(self.gait_indices[suddenstop_indices]) > 0:     \n                self.gait_indices[suddenstop_indices] += 1\n            overdue_indices = self.gait_wait_timer >= GAIT_WAIT_TIME\n            if len(self.gait_indices[overdue_indices]) > 0:\n                self.gait_indices[overdue_indices] = torch.zeros(self.num_envs, dtype=torch.float, \n                                                                                    device=self.device, requires_grad=False) \n                self.gait_wait_timer[overdue_indices] = 0\n            # command to stop, last status is stop\n            elseindices = (self.gait_wait_timer == 0) & ((~is_walking) & (~self.is_walking))\n            elseindices = elseindices.to(torch.bool)\n            if len(self.gait_indices[elseindices]) > 0:\n                self.gait_wait_timer[elseindices] = 0\n                self.gait_indices[elseindices] = 0\n\n            self.is_walking = is_walking\n\n            foot_indices = [self.gait_indices + phases + offsets + bounds,\n                            self.gait_indices + offsets,\n                            self.gait_indices + bounds,\n                            self.gait_indices + phases]\n\n            self.clock_inputs[:, 0] = torch.sin(2 * np.pi * foot_indices[0])\n            self.clock_inputs[:, 1] = torch.sin(2 * np.pi * foot_indices[1])\n            self.clock_inputs[:, 2] = torch.sin(2 * np.pi * foot_indices[2])\n            self.clock_inputs[:, 3] = torch.sin(2 * np.pi * foot_indices[3])\n    \n    \n    def get_all_pos_targets(self, ee_goal_cart, ee_goal_orn_quat):\n        dpos = ee_goal_cart - self.ee_pos\n        drot = orientation_error(ee_goal_orn_quat, self.ee_orn / torch.norm(self.ee_orn, dim=-1).unsqueeze(-1))\n        dpose = torch.cat([dpos, drot], dim=-1).unsqueeze(-1)\n        arm_pos_targets = self.control_ik(dpose) + self._dof_pos[:, -(6 + self.num_gripper_joints):-self.num_gripper_joints]\n        all_pos_targets = torch.zeros_like(self._dof_pos)\n        all_pos_targets[:, -(6 + self.num_gripper_joints):-self.num_gripper_joints] = arm_pos_targets\n        all_pos_targets[:, -self.num_gripper_joints:] = self.gripper_dof_pos\n        \n        return all_pos_targets\n    \n    def get_torques(self):\n        self.torques = self._compute_torques(self.last_low_actions)\n        \n        return self.torques\n    \n    def floating_base_control(self):\n        actor_root_state_copy = self._root_states.clone()\n        x_vel_local = self.commands[:, 0]\n        vel_global = quat_apply(self._robot_root_states[:, 3:7], torch.cat([x_vel_local.unsqueeze(-1), torch.zeros_like(x_vel_local.unsqueeze(-1)), torch.zeros_like(x_vel_local.unsqueeze(-1))], dim=-1))\n        yaw_vel_local = self.commands[:, 2]\n        yaw_vel_global = quat_apply(self._robot_root_states[:, 3:7], torch.cat([torch.zeros_like(yaw_vel_local.unsqueeze(-1)), torch.zeros_like(yaw_vel_local.unsqueeze(-1)), yaw_vel_local.unsqueeze(-1)], dim=-1))\n        actor_root_state_copy[self._robot_actor_ids, 7:10] = vel_global.squeeze(-1)\n        actor_root_state_copy[self._robot_actor_ids, 9] = self.commands[:, 1]\n        actor_root_state_copy[self._robot_actor_ids, 12] = yaw_vel_global[:, -1]\n        actor_root_state_copy[self._robot_actor_ids, 2] = torch.clip(actor_root_state_copy[self._robot_actor_ids, 2], 0.4, 0.66)\n        self.gym.set_actor_root_state_tensor_indexed(self.sim, gymtorch.unwrap_tensor(actor_root_state_copy),\n                                                        gymtorch.unwrap_tensor(self._robot_actor_ids), self.num_envs)\n        \n    def compute_table_command_level_00(self): ## static\n        self.num_steps_to_change_mode[...] += 1\n        mask_step_change = (self.num_steps_to_change_mode % (self.rand_change_step*6*self.increase_to_change_step)==0)\n        self.increase_to_change_step[mask_step_change]+=1\n        self.mask_step_change = mask_step_change\n        true_count = mask_step_change.sum().item()\n        self.rand_change_step[mask_step_change] = torch.randint(low=40, high=60, size=(true_count,), device=self.device)\n        self.table_commands[:,0] = 0\n        self.table_commands[:,1] = 0\n        self.table_commands[self.lin_circle_select,5] = 0\n        self.table_commands[~self.lin_circle_select,5] = 0\n        self.table_commands[:,2] = 0\n\n\n    def compute_table_command_level_01(self): ## straight-line translation at 0--0.15m/s along y, without rotation\n        self.num_steps_to_change_mode[...] += 1\n        mask_step_change = (self.num_steps_to_change_mode % (self.rand_change_step*6*self.increase_to_change_step)==0)\n        self.increase_to_change_step[mask_step_change]+=1\n        self.mask_step_change = mask_step_change\n        true_count = mask_step_change.sum().item()\n        self.rand_change_step[mask_step_change] = torch.randint(low=40, high=60, size=(true_count,), device=self.device)\n\n        self.table_commands[:,0] = 0\n        self.table_commands[:,1] = self.vel_line_forward_y\n        self.table_commands[:,5] = 0\n        self.table_commands[:,2] = 0\n        \n    def compute_table_command_level_02(self): ## fixed 0.15--0.30m/s in y direction or cicle_trajectory movement\n        self.num_steps_to_change_mode[...] += 1\n        mask_step_change = (self.num_steps_to_change_mode % (self.rand_change_step*6*self.increase_to_change_step)==0)\n        self.increase_to_change_step[mask_step_change]+=1\n        self.mask_step_change = mask_step_change\n        true_count = mask_step_change.sum().item()\n        self.rand_change_step[mask_step_change] = torch.randint(low=40, high=60, size=(true_count,), device=self.device)\n        self.table_commands[:,0] = 0\n        self.table_commands[:,1] = self.vel_line_forward_y_level02\n        self.table_commands[self.lin_circle_select,5] = self.vel_angular_yaw[self.lin_circle_select]\n        self.table_commands[~self.lin_circle_select,5] = 0\n        self.table_commands[:,2] = 0\n        \n    # def compute_table_command_level_03(self): ## low-speed random two-dimensional trajectory\n    #     self.num_steps_to_change_mode[...] += 1\n    #     # print(f\"num_steps_to_change_mode is {self.num_steps_to_change_mode[0]}\")\n    #     # print(\"self.num_steps_to_change_mode[0] is \",self.num_steps_to_change_mode[0])\n    #     mask_step_change = (self.num_steps_to_change_mode % (self.rand_change_step*6*self.increase_to_change_step)==0)\n    #     # print(f\"self.num_steps_to_change_mode is {self.num_steps_to_change_mode} ; mask_step_change is {mask_step_change} ; self.rand_change_step*6 is {self.rand_change_step*6*self.increase_to_change_step}\")\n    #     self.increase_to_change_step[mask_step_change]+=1\n    #     self.mask_step_change = mask_step_change\n    #     true_count = mask_step_change.sum().item()\n    #     self.rand_change_step[mask_step_change] = torch.randint(low=40, high=60, size=(true_count,), device=self.device)\n        \n    #     self.vel_line_forward_y[mask_step_change] = torch.rand(true_count,device=self.device) *(-0.1-0.1) + 0.1\n    #     self.vel_line_forward_x[mask_step_change] = torch.rand(true_count,device=self.device) *(-0.1-0.1) + 0.1\n    #     self.vel_angular_yaw[mask_step_change] = torch.rand(true_count,device=self.device) *(-0.2-0.2) + 0.2\n    #     self.vel_line_z[mask_step_change] = torch.rand(true_count,device=self.device) *-0.0008/7*8 + 0.0004/7*8\n    #     # self.table_commands[:,0] = self.vel_line_forward_x\n    #     # self.table_commands[:,1] = self.vel_line_forward_y\n    #     # self.table_commands[:,5] = self.vel_angular_yaw\n    #     # self.table_commands[:,2] = self.vel_line_z\n    #     # self.vel_line_z = torch.where(self.vel_line_z>0.15, self.vel_line_z, torch.zeros_like(self.vel_line_z,device=self.device))\n    #     self.table_commands[:,0] = self.vel_line_forward_x\n    #     self.table_commands[:,1] = self.vel_line_forward_y\n    #     self.table_commands[:,5] = self.vel_angular_yaw\n    #     self.table_commands[:,2] = 0\n        \n    def compute_table_command_level_03(self): ## High-speed random two-dimensional trajectory\n        self.num_steps_to_change_mode[...] += 1\n        mask_step_change = (self.num_steps_to_change_mode % (self.rand_change_step*6*self.increase_to_change_step)==0)\n        self.increase_to_change_step[mask_step_change]+=1\n        self.mask_step_change = mask_step_change\n        true_count = mask_step_change.sum().item()\n        self.rand_change_step[mask_step_change] = torch.randint(low=40, high=60, size=(true_count,), device=self.device)\n        \n        self.vel_line_forward_y_level03[mask_step_change] = torch.rand(true_count,device=self.device) *(-0.212-0.212) + 0.212\n        self.vel_line_forward_x[mask_step_change] = torch.rand(true_count,device=self.device) *(-0.212-0.212) + 0.212\n        self.vel_angular_yaw[mask_step_change] = torch.rand(true_count,device=self.device) *(-0.3-0.3) + 0.3\n        self.vel_line_z[mask_step_change] = torch.rand(true_count,device=self.device) *-0.0008/7*8 + 0.0004/7*8\n        self.table_commands[:,0] = self.vel_line_forward_x\n        self.table_commands[:,1] = self.vel_line_forward_y_level03\n        self.table_commands[:,5] = self.vel_angular_yaw\n        self.table_commands[:,2] = 0\n    \n    def compute_table_command_level_04(self): \n        self.num_steps_to_change_mode[...] += 1\n        mask_step_change = (self.num_steps_to_change_mode % (self.rand_change_step*6*self.increase_to_change_step)==0)\n        self.increase_to_change_step[mask_step_change]+=1\n        self.mask_step_change = mask_step_change\n        true_count = mask_step_change.sum().item()\n        self.rand_change_step[mask_step_change] = torch.randint(low=40, high=60, size=(true_count,), device=self.device)\n        \n        # self.vel_line_forward_y_level03[mask_step_change] = torch.rand(true_count,device=self.device) *(-0.212-0.212) + 0.212\n        # self.vel_line_forward_x[mask_step_change] = torch.rand(true_count,device=self.device) *(-0.212-0.212) + 0.212\n        # self.vel_angular_yaw[mask_step_change] = torch.rand(true_count,device=self.device) *(-0.3-0.3) + 0.3\n        self.vel_line_forward_y_level03[mask_step_change] = torch.rand(true_count,device=self.device) *(-0.2-0.2) + 0.2\n        self.vel_line_forward_x[mask_step_change] = torch.rand(true_count,device=self.device) *(-0.2-0.2) + 0.2\n        self.vel_angular_yaw[mask_step_change] = torch.rand(true_count,device=self.device) *(-0.3-0.3) + 0.3\n        self.vel_line_z[mask_step_change] = torch.rand(true_count,device=self.device) *-0.0008/7*8 + 0.0004/7*8\n        self.table_commands[:,0] = self.vel_line_forward_x\n        self.table_commands[:,1] = self.vel_line_forward_y_level03\n        self.table_commands[:,5] = self.vel_angular_yaw\n        self.table_commands[:,2] = self.vel_line_z\n \n    def compute_table_command_level_05(self):   ## vertical movement\n        self.num_steps_to_change_mode[...] += 1\n        mask_step_change = (self.num_steps_to_change_mode % (self.rand_change_step*6*self.increase_to_change_step)==0)\n        self.increase_to_change_step[mask_step_change]+=1\n        self.mask_step_change = mask_step_change\n        true_count = mask_step_change.sum().item()\n        self.rand_change_step[mask_step_change] = torch.randint(low=40, high=60, size=(true_count,), device=self.device)\n        \n        self.vel_line_forward_y[mask_step_change] = torch.rand(true_count,device=self.device) *(-0.2-0.2) + 0.2\n        self.vel_line_forward_x[mask_step_change] = torch.rand(true_count,device=self.device) *(-0.2-0.2) + 0.2\n        self.vel_angular_yaw[mask_step_change] = torch.rand(true_count,device=self.device) *(-0.3-0.3) + 0.3\n        self.vel_line_z_fix[mask_step_change] = -self.vel_line_z_fix[mask_step_change]\n        self.table_commands[:,0] = 0\n        self.table_commands[:,1] = 0\n        self.table_commands[:,5] = 0\n        self.table_commands[:,2] = self.vel_line_z_fix\n\n    def floating_table_control(self):\n        if self.table_level == \"Level01\":\n            self.compute_table_command_level_01()\n        elif self.table_level == \"Level02\":\n            self.compute_table_command_level_02()\n        elif self.table_level == \"Level03\":\n            self.compute_table_command_level_03()\n        elif self.table_level == \"Level04\":\n            self.compute_table_command_level_04()\n        elif self.table_level == \"Level05\":\n            self.compute_table_command_level_05()\n        elif self.table_level == \"Level00\":\n            self.compute_table_command_level_00()\n        else:\n            raise ValueError(f\"table_level {self.table_level} is not supported\")\n        actor_root_state_copy = self._root_states.clone()\n        table_root_pos = self._root_states[self._table_actor_ids, :2]\n        table_root_quat = self._root_states[self._table_actor_ids, 3:7]\n        if self.table_level == \"Level01\":\n            # Keep the heading fixed so contact-induced rotation cannot curve the path.\n            table_root_quat = torch.zeros_like(table_root_quat)\n            table_root_quat[:, 3] = 1.0\n            actor_root_state_copy[self._table_actor_ids, 3:7] = table_root_quat\n        #  [v_x, v_y, 0]\n        v_local = torch.zeros((self.num_envs, 3), device=self._root_states.device, dtype=self._root_states.dtype)\n        v_local[:, 0] = self.table_commands[:, 0]  \n        v_local[:, 1] = self.table_commands[:, 1]  \n        # Local line velocity to global line velocity\n        v_global = quat_rotate(table_root_quat, v_local)  # [num_envs, 3]\n        actor_root_state_copy[self._table_actor_ids, 7] = v_global[:, 0]  # global vx\n        actor_root_state_copy[self._table_actor_ids, 8] = v_global[:, 1]  # global vy\n        actor_root_state_copy[self._table_actor_ids, 9] = 0 ## set z_vel to zero, this is nessesary!\n        # self.table_commands[:, 4] = self.table_commands[:, 4]\n        self.table_commands[:, 4] = self.table_commands[:, 4]+self.table_commands[:,2]\n        self.table_commands[:, 4] = torch.clamp(self.table_commands[:, 4],max=self.table_z_upper-self.table_dimz / 2.0, min=self.table_z_lower-self.table_dimz / 2.0)\n        self.table_heights = self.table_commands[:,4] + self.table_dimz / 2.0\n        actor_root_state_copy[self._table_actor_ids, 2] = self.table_commands[:, 4]\n        actor_root_state_copy[self._table_actor_ids, 12] = self.table_commands[:,5]                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   \n        actor_root_state_copy[self._table_actor_ids, 3:5]=0.0\n        actor_root_state_copy[self._table_actor_ids, 10:12]=0.0\n        _table_actor_ids32 = self._table_actor_ids.to(torch.int32)\n        if getattr(self, \"_sgs_has_pending_reset\", False):\n            reset_ids = self._sgs_pending_reset.nonzero(as_tuple=False).flatten()\n            robot_ids32 = self._robot_actor_ids[reset_ids].to(torch.int32)\n            self.gym.set_dof_state_tensor_indexed(\n                self.sim, gymtorch.unwrap_tensor(self._dof_state),\n                gymtorch.unwrap_tensor(robot_ids32), len(robot_ids32))\n            _table_actor_ids32 = torch.cat((\n                _table_actor_ids32, robot_ids32,\n                self._cube_actor_ids[reset_ids].to(torch.int32)))\n            self._sgs_pending_reset.zero_()\n            self._sgs_has_pending_reset = False\n        self.gym.set_actor_root_state_tensor_indexed(self.sim, gymtorch.unwrap_tensor(actor_root_state_copy),\n                                                        gymtorch.unwrap_tensor(_table_actor_ids32), len(_table_actor_ids32))\n\n\n    def step(self, actions: torch.Tensor) -> Tuple[Dict[str, torch.Tensor], torch.Tensor, torch.Tensor, Dict[str, Any]]:\n        \"\"\"Step the physics of the environment.\n\n        Args:\n            actions: actions to apply\n        Returns:\n            Observations, rewards, resets, info\n            Observations are dict of observations (currently only one member called 'obs')\n        \"\"\"\n        \n        if self.pred_success:\n            if actions.shape[-1] == (self.action_space.shape[-1]+1):\n                actions, _ = actions[...,:-1], actions[...,-1]\n                \n        if self.rand_control:\n            self.control_freq_low = random.randint(self.control_freq_low_init-1, self.control_freq_low_init) \n        \n        # randomize actions\n        if self.dr_randomizations.get('actions', None):\n            actions = self.dr_randomizations['actions']['noise_lambda'](actions)\n\n        action_tensor = torch.clamp(actions, -self.clip_actions, self.clip_actions)\n        \n        # apply actions\n        ee_goal_cart, ee_goal_orn_quat = self.pre_physics_step(action_tensor)\n        \n        img_delay_frame = self.img_delay_frame\n        if self.img_delay_frame >= 1:\n            img_delay_frame = random.randint(self.img_delay_frame-1, self.img_delay_frame) # random the delay\n        # front_img_delay_frame = random.randint(self.img_delay_frame-1, self.img_delay_frame+1) \n        # wrist_img_delay_frame = random.randint(front_img_delay_frame, self.img_delay_frame+1)\n\n        # -------------------------query low level and simulate--------------------------\n        # Within a single high-level cycle, the physical simulation is executed a total of 8 * 4 = 32 times, or 7 * 4 = 28 steps.\n        time1 = time.time()\n        for low_step in range(self.control_freq_low):\n            if not self.floating_base:\n                self._compute_low_level_observations()\n                with torch.no_grad():\n                    low_actions = self.low_level_policy(self.low_obs_buf.detach(), hist_encoding=True)\n                low_actions = reindex_all(low_actions)\n            \n                self.last_low_actions[:] = low_actions[:]\n            \n            if self.floating_base:\n                all_pos_targets = self.get_all_pos_targets(ee_goal_cart, ee_goal_orn_quat)\n                self.gym.set_dof_position_target_tensor(self.sim, gymtorch.unwrap_tensor(all_pos_targets))\n                self.floating_base_control()\n                \n            # step physics and render each frame\n            for i in range(self.control_freq_inv):\n                if self.floating_base:\n                    pass\n                    # self.floating_base_control()\n                else:\n                    env_torques = self.get_torques() # This is the chassis of the robotic dog, excluding the torque of the robotic arm (all degrees of freedom are set to 0), which is the final output given to the robot.\n                    all_pos_targets = self.get_all_pos_targets(ee_goal_cart, ee_goal_orn_quat) # Obtain the target motors (degrees of freedom) on the robotic arm, excluding the chassis robot dog.\n                    ## DQ add ##\n                    self.floating_table_control()\n                    self.table_heights = self.table_commands[:,4] + self.table_dimz / 2.0\n                    ## DQ add ##\n                    self.gym.set_dof_position_target_tensor(self.sim, gymtorch.unwrap_tensor(all_pos_targets))\n                    self.gym.set_dof_actuation_force_tensor(self.sim, gymtorch.unwrap_tensor(env_torques))\n                    \n                self.gym.simulate(self.sim)\n                self._refresh_sim_tensors()\n\n            if not self.headless:\n                self.render()\n            \n            if self.enable_camera or self.camera_test:\n                if ((self.control_freq_low - low_step - 1) == img_delay_frame): # simulate the real delay, 0.1s\n                    self.obtain_imgs()\n                    # self.obtain_front_imgs() # original one\n                    \n        \n        self.one_epoch_step+=1\n        if self.device == 'cpu':\n            self.gym.fetch_results(self.sim, True)\n\n        # compute observations, rewards, resets, ...\n        ################ !!!!!!!!!!!!!!!!!!!!!!!! IMPORTANT !!!!!!!!!!!!!!!!!!!!!!! ########################\n        self.post_physics_step()\n        #### obs , rew , reset and so on all can find in this func\n\n        # check_termination already distinguishes the actual time limit from\n        # task success and other early resets; preserve that classification.\n        # randomize observations\n        if self.dr_randomizations.get('observations', None):\n            self.obs_buf = self.dr_randomizations['observations']['noise_lambda'](self.obs_buf)\n\n        self.extras[\"time_outs\"] = self.timeout_buf.to(self.rl_device)\n\n        self.obs_dict[\"obs\"] = torch.clamp(self.obs_buf, -self.clip_obs, self.clip_obs).to(self.rl_device)\n\n        # asymmetric actor-critic\n        if self.num_states > 0:\n            self.obs_dict[\"states\"] = self.get_state()\n\n        return self.obs_dict, self.rew_buf.to(self.rl_device), self.reset_buf.to(self.rl_device), self.extras\n    \n    def pre_physics_step(self, action_tensor):\n        if self.continuous_gripper:\n            # Normalize external/probe inputs too; history and replay store the\n            # same opening that is executed. PPO already returns bounded values.\n            action_tensor = torch.cat((action_tensor[:, :6], action_tensor[:, 6:7].clamp(0., 1.),\n                                       action_tensor[:, 7:]), dim=-1)\n        if (not self.stu_distill) and self.global_step_counter <= (self.total_timesteps/5):\n            action_delay = 0\n        else:\n            action_delay = 0 \n            \n        # -------------------------receive commands----------------------------\n        self.action_history_buf = torch.cat([self.action_history_buf[:, 1:], action_tensor[:, None, :]], dim=1)\n        action_tensor = self.action_history_buf[:, -action_delay - 1]\n        if self.arm_delay and (action_delay > 0):\n            action_tensor[:, :7] =  self.action_history_buf[:, -action_delay - 2, :7] # Arm uses one more step delay\n        self.actions[:] = action_tensor[:]\n        # -------------------------delta based on current ee pos----------------------------\n        # arm_base_local = torch.tensor([0.3, 0.0, 0.09], device=self.device).repeat(self.num_envs, 1)\n        # arm_base = quat_apply(self._robot_root_states[:, 3:7], arm_base_local) + self._robot_root_states[:, :3]\n        # ee_cart = quat_rotate_inverse(self._robot_root_states[:, 3:7], self.ee_pos - arm_base)\n        # ee_goal_cart_local = ee_cart + torch.clip(actions[:, :3], -0.1, 0.1)\n        # ee_goal_cart = quat_apply(self._robot_root_states[:, 3:7], ee_goal_cart_local) + arm_base\n        # self.curr_ee_goal_cart[:] = ee_goal_cart\n        \n        # ee_goal_orn_delta_rpy = torch.clip(actions[:, 3:6], -0.5, 0.5)\n        # ee_local_orn = quat_mul(quat_conjugate(self._robot_root_states[:, 3:7]), self.ee_orn)\n        # ee_local_orn_rpy = torch.stack(euler_from_quat(ee_local_orn), dim=-1)\n        # ee_goal_orn_rpy_local = ee_local_orn_rpy + ee_goal_orn_delta_rpy\n        # ee_goal_orn_quat_local = quat_from_euler_xyz(ee_goal_orn_rpy_local[:, 0], ee_goal_orn_rpy_local[:, 1], ee_goal_orn_rpy_local[:, 2])\n        # ee_goal_orn_quat = quat_mul(self._robot_root_states[:, 3:7], ee_goal_orn_quat_local)\n        # -------------------------delta based on current ee pos----------------------------\n        \n        # -------------------------delta based on current ee goal----------------------------\n        if False: # self.cfg[\"env\"].get(\"lastCommands\", False) and (self.global_step_counter > 50000 or self.enable_camera):\n            if self.cfg[\"env\"][\"useTanh\"]:\n                self.delta_goal_cart = self.actions[:, :3] * 0.015\n            else:\n                self.delta_goal_cart = torch.clip(self.actions[:, :3], -0.015, 0.015)\n        else:\n            if self.cfg[\"env\"][\"useTanh\"]: #### 特别注意好像high预测出来的pos只是一个delta_pos值，下面代码找到的目标pos值是用现在的pos加上delta_pos\n                self.delta_goal_cart = self.actions[:, :3] * 0.02 #my change 0.02->0,03# \n            else:\n                self.delta_goal_cart = torch.clip(self.actions[:, :3], -0.02, 0.02)\n        self.curr_ee_goal_cart[:] = self.curr_ee_goal_cart + self.delta_goal_cart\n        # self.curr_ee_goal_cart[:, 0] = torch.clip(self.curr_ee_goal_cart[:, 0], 0.0, 0.9)\n\n        self.curr_ee_goal_cart[:, 0] = torch.clip(self.curr_ee_goal_cart[:, 0], 0., 0.7)\n        self.curr_ee_goal_cart[:, 1] = torch.clip(self.curr_ee_goal_cart[:, 1], -0.7, 0.7)\n        self.curr_ee_goal_cart[:, 2] = torch.clip(self.curr_ee_goal_cart[:, 2], -0.6, 0.6)\n        ee_goal_cart = quat_apply(self._robot_root_states[:, 3:7], self.curr_ee_goal_cart) + self.arm_base\n        self.ee_goal_global_cart = ee_goal_cart.clone()\n\n        \n        if self.cfg[\"env\"][\"useTanh\"]:\n            self.delta_goal_orn = self.actions[:, 3:6] * 0.06 #my change 0.06->0.08# \n        else:\n            self.delta_goal_orn = torch.clip(self.actions[:, 3:6], -0.06, 0.06)\n        self.curr_ee_goal_orn_rpy[:] = self.curr_ee_goal_orn_rpy + self.delta_goal_orn\n        # self.curr_ee_goal_orn_rpy[:] = self.curr_ee_goal_orn_rpy + torch.clip(actions[:, 3:6], -0.04, 0.04)\n        # self.curr_ee_goal_orn_rpy[:] = self.curr_ee_goal_orn_rpy + torch.clip(actions[:, 3:6], -0.02, 0.02)\n        ee_goal_local_orn = quat_from_euler_xyz(self.curr_ee_goal_orn_rpy[:, 0], self.curr_ee_goal_orn_rpy[:, 1], self.curr_ee_goal_orn_rpy[:, 2])\n        ee_goal_orn_quat = quat_mul(self._robot_root_states[:, 3:7], ee_goal_local_orn)\n        self.ee_goal_global_orn_quat = ee_goal_orn_quat.clone()\n        # -------------------------delta based on current ee goal----------------------------\n        self.set_gripper()\n        self.clip_commands()\n        if (not self.pitch_control) and (not self.floating_base):\n            self.commands[:, 1] = 0\n        if self.pitch_control:\n            if self.cfg[\"env\"][\"useTanh\"]:\n                self.commands[:, 1] = self.actions[:, 9] * 0.6\n            else:\n                self.commands[:, 1] = torch.clip(self.actions[:, 9], -0.6, 0.6)\n        \n        if self.floating_base:\n            if self.cfg[\"env\"][\"useTanh\"]:\n                self.commands[:, 1] = self.actions[:, 9] * 0.3\n            else:\n                self.commands[:, 1] = torch.clip(self.actions[:, 9], -0.3, 0.3)\n        \n        if self.cfg[\"env\"][\"useTanh\"]:\n            self.commands[:, 2] = self.actions[:, 8] * 0.6\n        else:\n            self.commands[:, 2] = torch.clip(self.actions[:, 8], -0.6, 0.6)\n        # set small commands to zero\n        if self.cfg[\"env\"].get(\"smallValueSetZero\", False):\n            self.commands[:, :] *= (torch.logical_or(torch.abs(self.commands[:, 0]) > LIN_VEL_X_CLIP, torch.abs(self.commands[:, 2]) > ANG_VEL_YAW_CLIP)).unsqueeze(1)\n        # -------------------------receive commands----------------------------\n        self.clipped_actions[:, :3] = self.delta_goal_cart[:].clone()\n        self.clipped_actions[:, 3:6] = self.delta_goal_orn[:].clone()\n        self.clipped_actions[:, 6] = self.actions[:,6].clone()\n        if self.pitch_control:\n            self.clipped_actions[:, 7:] = self.commands[:].clone()\n        else:\n            self.clipped_actions[:, 7] = self.commands[:,0].clone()\n            self.clipped_actions[:, 8] = self.commands[:,2].clone()\n        self.command_history_buf = torch.cat([self.command_history_buf[:, 1:], self.clipped_actions[:, None, :]], dim=1)\n        \n        if self.stop_pick:\n            closing = (closing_command(self.actions[:, 6]) if self.continuous_gripper\n                       else self.actions[:, 6] < 0)\n            self.commands = torch.where(closing.unsqueeze(-1), torch.zeros_like(self.commands), self.commands)\n        \n        if self.rand_depth_clip:\n            self.depth_clip_lower = torch_rand_float(self.depth_clip_rand_range[0], self.depth_clip_rand_range[1], (self.num_envs,1), device=self.device).unsqueeze(-1)\n\n        return ee_goal_cart, ee_goal_orn_quat\n    \n    def set_gripper(self):\n        u_gripper = self.actions[:, 6].unsqueeze(-1)\n        if self.continuous_gripper:\n            if self.num_gripper_dof not in (1, 2):\n                raise NotImplementedError\n            self.gripper_dof_pos[:] = opening_to_joint(\n                u_gripper, self.dof_limits_upper[-self.num_gripper_dof:],\n                self.dof_limits_lower[-self.num_gripper_dof:])\n            return\n        if self.num_gripper_dof == 1:\n            self.gripper_dof_pos[:] = torch.where(u_gripper >= 0, self.dof_limits_lower[-1].item(), self.dof_limits_upper[-1].item()) # >= 0 open    \n        elif self.num_gripper_dof == 2:\n            # TODO: May check this; dof limits lower or higher corresponds to gripper open or close\n            self.gripper_dof_pos[:, -2] = torch.where(u_gripper >= 0, self.dof_limits_lower[-2].item(), self.dof_limits_upper[-2].item())\n            self.gripper_dof_pos[:, -1] = torch.where(u_gripper >= 0, self.dof_limits_lower[-1].item(), self.dof_limits_upper[-1].item())\n        else:\n            raise NotImplementedError\n    \n    # For random gripper kp\n    def clip_commands(self):\n        if not self.commands_curriculum:\n            if self.cfg[\"env\"][\"useTanh\"]:\n                self.commands[:, 0] = self.actions[:, 7] * 0.4\n            else:\n                self.commands[:, 0] = torch.clip(self.actions[:, 7], -0.4, 0.4)\n            return\n\n        if self.cfg[\"env\"][\"useTanh\"]:\n            if (self.global_step_counter > (self.total_timesteps/5 * 3)) or self.stu_distill:\n                self.commands[:, 0] = self.actions[:, 7] * 0.45 # my change #\n            elif self.global_step_counter > (self.total_timesteps/2):\n                self.commands[:, 0] = self.actions[:, 7] * 0.45 # my change #\n            elif self.global_step_counter > (self.total_timesteps/5):\n                self.commands[:, 0] = self.actions[:, 7] * 0.45 # my change #\n            else:\n                self.commands[:, 0] = self.actions[:, 7] * 0.45 # my change #\n        else:\n            if (self.global_step_counter > (self.total_timesteps/5 * 3)) or self.stu_distill:\n                self.commands[:, 0] = torch.clip(self.actions[:, 7], -0.45, 0.45)\n            elif self.global_step_counter > (self.total_timesteps/2):\n                self.commands[:, 0] = torch.clip(self.actions[:, 7], -0.45, 0.45)\n            elif self.global_step_counter > (self.total_timesteps/5):\n                self.commands[:, 0] = torch.clip(self.actions[:, 7], -0.45, 0.45)\n            else:\n                self.commands[:, 0] = torch.clip(self.actions[:, 7], -0.45, 0.45)\n    \n    def _compute_states_buf(self): # if enabled_camera is true, then this function will be called\n        teacher_only_tail = (self.num_actions + 180 + self.num_velocity_obs + self.num_future_pose_obs\n                             + getattr(self, \"num_tsil_obs\", 0))\n        self.states_buf[:] = torch.cat([self.camera_history_buf.view(self.num_envs, -1), self.obs_buf[:, (self.num_features + 6):-teacher_only_tail], self.obs_buf[:, -self.num_actions:]], dim=-1)\n        # self.states_buf[:] = torch.cat([self.camera_history_buf.view(self.num_envs, -1), self.obs_buf[:, (self.num_features + 12):-(self.num_actions + 3)], self.obs_buf[:, -self.num_actions:]], dim=-1) # my change\n        \n    def update_roboinfo(self):\n        # Arm base\n        base_quat = self._robot_root_states[:, 3:7]\n        arm_base_local = torch.tensor([0.3, 0.0, 0.09], device=self.device).repeat(self.num_envs, 1)\n        self.arm_base = quat_apply(base_quat, arm_base_local) + self._robot_root_states[:, :3]\n        \n    def obtain_imgs(self):\n        self.gym.fetch_results(self.sim, True)\n        self.gym.step_graphics(self.sim)\n        self.gym.render_all_camera_sensors(self.sim)\n        self.gym.start_access_image_tensors(self.sim)\n        self.depth_image_flat, self.wrist_depth_image_flat, self.forward_mask, self.wrist_mask, self.forward_depth_seg, self.wrist_depth_seg = self._get_camera_obs()\n        if self.camera_test==True:\n            _,_,_ = self.get_fix_camera_obs()\n        self.gym.end_access_image_tensors(self.sim)\n        \n    def make_img_obs(self):\n        if self.camera_mode == \"full\" or self.camera_mode == \"seperate\":\n            tensor_obs = torch.cat([self.forward_mask, self.wrist_mask, self.forward_depth_seg, self.wrist_depth_seg], dim=-1)\n        elif self.camera_mode == \"wrist_seg\":\n            tensor_obs = torch.cat([self.forward_mask, self.wrist_mask, self.forward_depth_seg], dim=-1)\n        elif self.camera_mode == \"front_only\":\n            tensor_obs = torch.cat([self.forward_mask, self.forward_depth_seg], dim=-1)\n        self.camera_history_buf = torch.where(\n            (self.progress_buf <= 1)[:, None, None],\n            torch.stack([tensor_obs] * self.camera_history_len, dim=1),\n            self.camera_history_buf\n        )\n        self.camera_history_buf = torch.cat([\n            self.camera_history_buf[:, 1:],\n            tensor_obs.unsqueeze(1)\n        ], dim=1)\n        \n    def obtain_front_imgs(self):\n        self.gym.fetch_results(self.sim, True)\n        self.gym.step_graphics(self.sim)\n        self.gym.render_all_camera_sensors(self.sim)\n        self.gym.start_access_image_tensors(self.sim)\n        self.depth_image_flat, self.forward_mask, self.forward_depth_seg = self._get_front_camera_obs()\n        self.gym.end_access_image_tensors(self.sim)\n    \n    def obtain_wrist_imgs(self):\n        self.gym.fetch_results(self.sim, True)\n        self.gym.step_graphics(self.sim)\n        self.gym.render_all_camera_sensors(self.sim)\n        self.gym.start_access_image_tensors(self.sim)\n        self.wrist_depth_image_flat, self.wrist_mask, self.wrist_depth_seg = self._get_wrist_camera_obs()\n        self.gym.end_access_image_tensors(self.sim)\n    \n    def _update_object_pose_prediction(self):\n        \"\"\"Optional task hook: one prediction update per high-level physics step.\"\"\"\n        pass\n\n    def post_physics_step(self):\n        self.progress_buf += 1\n        if getattr(self, \"tsil_enabled\", False):\n            # rand_control chooses 7 or 8 low-level cycles for this action.\n            # Count the actual duration before success reward and next obs.\n            self.tsil_elapsed += self.control_freq_low * self.dt\n        self.global_step_counter += 1\n        self.local_step_counter += 1\n        self._refresh_sim_tensors()\n        self.update_roboinfo()\n        self._update_object_pose_prediction()\n        self.check_termination()\n        self.compute_reward()\n        self.last_actions[:] = self.actions[:]\n        self._compute_observations()\n        if self.enable_camera: \n            # self.obtain_imgs() # We do not obtain here, to simulate the camera delay\n            # self.obtain_wrist_imgs()\n            self.make_img_obs() # Here, we stitch together the observations from all the cameras to obtain a single image tensor.\n            self._compute_states_buf()\n        \n        if self.debug_vis:\n            env_id = 0\n            if self.enable_camera or self.camera_test:\n                forward_depth_window_name = \"Forward Depth Image\"\n                wrist_depth_window_name = \"Wrist Depth Image\"\n                forward_mask_window_name = \"Forward Mask Image\"\n                wrist_mask_window_name = \"Wrist Mask Image\"\n                forward_depth_seg_window_name = \"Forward Depth Seg Image\"\n                wrist_depth_seg_window_name = \"Wrist Depth Seg Image\"\n                cv2.namedWindow(forward_depth_window_name, cv2.WINDOW_NORMAL)\n                cv2.namedWindow(wrist_depth_window_name, cv2.WINDOW_NORMAL)\n                cv2.namedWindow(forward_mask_window_name, cv2.WINDOW_NORMAL)\n                cv2.namedWindow(wrist_mask_window_name, cv2.WINDOW_NORMAL)\n                cv2.namedWindow(forward_depth_seg_window_name, cv2.WINDOW_NORMAL)\n                cv2.namedWindow(wrist_depth_seg_window_name, cv2.WINDOW_NORMAL)\n                forward_depth, wrist_depth, forward_mask, wrist_mask, forward_depth_seg, wrist_depth_seg = self.depth_image_flat, self.wrist_depth_image_flat, self.forward_mask, self.wrist_mask, self.forward_depth_seg, self.wrist_depth_seg\n                # forward_depth, wrist_depth, forward_mask, wrist_mask, forward_depth_seg, wrist_depth_seg = self._get_camera_obs()\n                img_width = self.cfg[\"sensor\"][\"resized_resolution\"][0]\n                img_height = self.cfg[\"sensor\"][\"resized_resolution\"][1]\n                forward_depth_image = forward_depth[env_id].reshape(img_height, img_width)\n                self.forward_depth_image_head = forward_depth.view(-1,img_height, img_width)\n                wrist_depth_image = wrist_depth[env_id].reshape(img_height, img_width)\n                self.wrist_depth_image_wirst = wrist_depth.view(-1,img_height, img_width)\n                forward_mask_image = forward_mask[env_id].reshape(img_height, img_width)\n                wrist_mask_image = wrist_mask[env_id].reshape(img_height, img_width)\n                forward_depth_seg_image = forward_depth_seg[env_id].reshape(img_height, img_width)\n                wrist_depth_seg_image = wrist_depth_seg[env_id].reshape(img_height, img_width)\n                \n                cv2.imshow(\"Forward Depth Image\", forward_depth_image.cpu().numpy())\n                cv2.imshow(\"Wrist Depth Image\", wrist_depth_image.cpu().numpy())\n                cv2.imshow(\"Forward Mask Image\", forward_mask_image.cpu().numpy())\n                cv2.imshow(\"Wrist Mask Image\", wrist_mask_image.cpu().numpy())\n                cv2.imshow(\"Forward Depth Seg Image\", forward_depth_seg_image.cpu().numpy())\n                cv2.imshow(\"Wrist Depth Seg Image\", wrist_depth_seg_image.cpu().numpy())\n                cv2.waitKey(1)\n                \n                # self._draw_ee_goal_target()\n            else:\n                self._draw_camera_sensors()\n                # self._draw_ee_goal_target()\n        \n        self.extras[\"terminate\"] = self._terminate_buf.to(self.rl_device)\n        return\n    \n@torch.jit.script\ndef reindex_all(vec):\n    # type: (Tensor) -> Tensor\n    return torch.hstack((vec[:, [3, 4, 5, 0, 1, 2, 9, 10, 11, 6, 7, 8]], vec[:, 12:]))\n\n@torch.jit.script\ndef reindex_feet(vec):\n    return vec[:, [1, 0, 3, 2]]\n","sha256":"a78fefa90fd836c72513358b024233df84347e2bf8bb6bde02491a994ee1e549"},"DQ_high-level/utils/wrapper.py":{"text":"# modified wrapper from skrl\nfrom typing import Union, Tuple, Any, Optional\n\nimport gym\nimport gymnasium\nimport collections\nimport numpy as np\nfrom packaging import version\n\nimport torch\n\nfrom skrl import logger\n\n__all__ = [\"wrap_env\"]\n\n\nclass Wrapper(object):\n    def __init__(self, env: Any) -> None:\n        \"\"\"Base wrapper class for RL environments\n\n        :param env: The environment to wrap\n        :type env: Any supported RL environment\n        \"\"\"\n        self._env = env\n\n        # device (faster than @property)\n        if hasattr(self._env, \"device\"):\n            self.device = torch.device(self._env.device)\n        else:\n            self.device = torch.device(\"cuda:0\" if torch.cuda.is_available() else \"cpu\")\n\n    def __getattr__(self, key: str) -> Any:\n        \"\"\"Get an attribute from the wrapped environment\n\n        :param key: The attribute name\n        :type key: str\n\n        :raises AttributeError: If the attribute does not exist\n\n        :return: The attribute value\n        :rtype: Any\n        \"\"\"\n        if hasattr(self._env, key):\n            return getattr(self._env, key)\n        raise AttributeError(\"Wrapped environment ({}) does not have attribute '{}'\" \\\n            .format(self._env.__class__.__name__, key))\n\n    def reset(self) -> Tuple[torch.Tensor, Any]:\n        \"\"\"Reset the environment\n\n        :raises NotImplementedError: Not implemented\n\n        :return: Observation, info\n        :rtype: torch.Tensor and any other info\n        \"\"\"\n        raise NotImplementedError\n\n    def step(self, actions: torch.Tensor) -> Tuple[torch.Tensor, torch.Tensor, torch.Tensor, torch.Tensor, Any]:\n        \"\"\"Perform a step in the environment\n\n        :param actions: The actions to perform\n        :type actions: torch.Tensor\n\n        :raises NotImplementedError: Not implemented\n\n        :return: Observation, reward, terminated, truncated, info\n        :rtype: tuple of torch.Tensor and any other info\n        \"\"\"\n        raise NotImplementedError\n\n    def render(self, *args, **kwargs) -> None:\n        \"\"\"Render the environment\n\n        :raises NotImplementedError: Not implemented\n        \"\"\"\n        raise NotImplementedError\n\n    def close(self) -> None:\n        \"\"\"Close the environment\n\n        :raises NotImplementedError: Not implemented\n        \"\"\"\n        raise NotImplementedError\n\n    @property\n    def num_envs(self) -> int:\n        \"\"\"Number of environments\n\n        If the wrapped environment does not have the ``num_envs`` property, it will be set to 1\n        \"\"\"\n        return self._env.num_envs if hasattr(self._env, \"num_envs\") else 1\n\n    @property\n    def state_space(self) -> gym.Space:\n        \"\"\"State space\n\n        If the wrapped environment does not have the ``state_space`` property,\n        the value of the ``observation_space`` property will be used\n        \"\"\"\n        return self._env.state_space if hasattr(self._env, \"state_space\") else self._env.observation_space\n\n    @property\n    def observation_space(self) -> gym.Space:\n        \"\"\"Observation space\n        \"\"\"\n        return self._env.observation_space\n\n    @property\n    def action_space(self) -> gym.Space:\n        \"\"\"Action space\n        \"\"\"\n        return self._env.action_space\n\n\nclass IsaacGymPreview3Wrapper(Wrapper):\n    def __init__(self, env: Any) -> None:\n        \"\"\"Isaac Gym environment (preview 3) wrapper\n\n        :param env: The environment to wrap\n        :type env: Any supported Isaac Gym environment (preview 3) environment\n        \"\"\"\n        super().__init__(env)\n\n        self._reset_once = True\n        self._obs_dict = None\n        self._world_model_episodes = None\n\n    def step(self, actions: torch.Tensor) -> Tuple[torch.Tensor, torch.Tensor, torch.Tensor, torch.Tensor, Any]:\n        \"\"\"Perform a step in the environment\n\n        :param actions: The actions to perform\n        :type actions: torch.Tensor\n\n        :return: Observation, reward, terminated, truncated, info\n        :rtype: tuple of torch.Tensor and any other info\n        \"\"\"\n        adapter = getattr(self._env, \"world_model_adapter\", None)\n        if adapter is not None:\n            ids = self._env.world_model_env_ids\n            state, context = adapter.capture(ids)\n            if self._world_model_episodes is None:\n                self._world_model_episodes = torch.zeros(self.num_envs, dtype=torch.long, device=self.device)\n            bank = getattr(self._env, \"sgs_bank\", None)\n            family = (bank.tensors[\"family_id\"][self._env.active_config_id[ids]].clone()\n                      if bank is not None else torch.zeros_like(ids))\n            episode = self._world_model_episodes[ids].clone()\n        self._obs_dict, reward, terminated, info = self._env.step(actions)\n        if adapter is not None:\n            next_state, _ = adapter.capture(ids)\n            executed = self._env.actions[ids].detach().clone()\n            outcome = adapter.task_outcome(state, next_state, executed, context)\n            timeout = outcome[\"timeout\"]\n            done = terminated[ids].bool()\n            info = dict(info)\n            info[\"world_model\"] = dict(\n                state=state, context=context, next_state=next_state, actions=executed,\n                dt=state.new_full((len(ids), 1), self._env.control_freq_low * self._env.dt),\n                reward=reward[ids].detach().clone(),\n                terminated=done & ~timeout, truncated=done & timeout,\n                success=self._env.pick_success[ids].detach().clone(),\n                family=family, episode_id=episode)\n        truncated = torch.zeros_like(terminated)\n        if self.num_states:\n            return self._obs_dict, reward.view(-1, 1), terminated.view(-1, 1), truncated.view(-1, 1), info\n        return self._obs_dict[\"obs\"], reward.view(-1, 1), terminated.view(-1, 1), truncated.view(-1, 1), info\n\n    def reset(self) -> Tuple[torch.Tensor, Any]:\n        \"\"\"Reset the environment\n\n        :return: Observation, info\n        :rtype: torch.Tensor and any other info\n        \"\"\"\n        # if self._reset_once:\n        #     self._obs_dict = self._env.reset()\n        #     self._reset_once = False\n        # return self._obs_dict[\"obs\"], {}\n        if getattr(self._env, \"world_model_adapter\", None) is not None:\n            if self._world_model_episodes is None:\n                self._world_model_episodes = torch.zeros(self.num_envs, dtype=torch.long, device=self.device)\n            self._world_model_episodes.add_(self._env.reset_buf.bool().long())\n        self._obs_dict = self._env.reset()\n        if self.num_states:\n            return self._obs_dict, {}\n        return self._obs_dict[\"obs\"], {}\n\n    def render(self, *args, **kwargs) -> None:\n        \"\"\"Render the environment\n            change here\n        \"\"\"\n        return self._env.render(*args, **kwargs)\n\n    def close(self) -> None:\n        \"\"\"Close the environment\n        \"\"\"\n        pass\n    \nclass RSLWrapper(Wrapper):\n    def __init__(self, env: Any) -> None:\n        \"\"\"Isaac Gym environment (preview 3) wrapper\n\n        :param env: The environment to wrap\n        :type env: Any supported Isaac Gym environment (preview 3) environment\n        \"\"\"\n        super().__init__(env)\n\n        self._reset_once = True\n        self._obs_dict = None\n\n    def step(self, actions: torch.Tensor) -> Tuple[torch.Tensor, torch.Tensor, torch.Tensor, torch.Tensor, Any]:\n        \"\"\"Perform a step in the environment\n\n        :param actions: The actions to perform\n        :type actions: torch.Tensor\n\n        :return: Observation, reward, terminated, truncated, info\n        :rtype: tuple of torch.Tensor and any other info\n        \"\"\"\n        self._obs_dict, reward, terminated, info = self._env.step(actions)\n        truncated = torch.zeros_like(terminated)\n        if self.num_states:\n            return self._obs_dict, reward, terminated, truncated, info\n        return self._obs_dict[\"obs\"], reward, terminated, truncated, info\n\n    def reset(self) -> Tuple[torch.Tensor, Any]:\n        \"\"\"Reset the environment\n\n        :return: Observation, info\n        :rtype: torch.Tensor and any other info\n        \"\"\"\n        self._obs_dict = self._env.reset()\n        if self.num_states:\n            return self._obs_dict, {}\n        return self._obs_dict[\"obs\"], {}\n\n    def render(self, *args, **kwargs) -> None:\n        \"\"\"Render the environment\n            change here\n        \"\"\"\n        return self._env.render(*args, **kwargs)\n\n    def close(self) -> None:\n        \"\"\"Close the environment\n        \"\"\"\n        pass\n","sha256":"3a3f3c28253d1cfe1dc3e5b368efd9d4d53477bed93b479c24f3c64328fb149f"},"DQ_high-level/utils/wm_ppo.py":{"text":"\"\"\"Real PPO with separately fitted GPU dynamics and validated-snapshot BPTT.\n\nThe candidate world model keeps learning from real transitions. Actor BPTT\nuses a different, fixed model instance, activated only by a matching isolated\nIsaac Gym action-effect report. Improving a prediction loss does not certify\nthe derivative of a contact model. Real PPO and SGS keep their original data\nand update rules; imagined transitions never enter PPO memory or SGS results.\n\"\"\"\n\nfrom copy import deepcopy\nimport json\nimport math\nimport os\nfrom pathlib import Path\nimport tempfile\nimport time\n\nimport torch\nfrom skrl.agents.torch.ppo import PPO\n\nfrom utils.wm_env import TeacherWorldModelAdapter\nfrom utils.world_model import (ResidualDynamics, TransitionReplay,\n                               WMTrainerConfig, WorldModelTrainer)\nfrom utils.world_model.imagination import ImaginationConfig, ImaginationTrainer\nfrom utils.world_model.probes import (configuration_fingerprint, load_verified_report,\n                                     model_fingerprint)\n\n\nDEFAULT_WORLD_MODEL_CONFIG = {\n    \"mode\": \"fit\",                 # fit | hybrid (hybrid still requires a passed probe)\n    \"replay_envs\": 128,\n    \"replay_capacity\": 256,\n    \"window\": 3,\n    \"batch_size\": 128,\n    \"batches_per_update\": 2,\n    \"hidden\": [512, 512, 512],\n    \"term_hidden\": [64, 64],\n    \"learning_rate\": 2e-4,\n    \"model_grad_clip\": 1.0,\n    \"termination_weight\": 0.1,\n    \"warmup_steps\": 96,\n    \"horizon\": 3,\n    \"imagination_batch\": 128,\n    \"actor_learning_rate\": 1e-5,\n    \"auxiliary_strength\": 0.05,\n    \"max_kl\": 0.005,\n    \"max_grad_norm\": 0.5,\n    \"max_validation_error\": 0.25,\n    \"max_start_error\": 0.25,\n    \"holdout_fraction\": 0.1,\n    \"recent_fraction\": 0.5,\n    \"recent_steps\": 32,\n    \"validation_batch_size\": 128,\n    \"use_tail_value\": True,\n    \"probe_interval\": 0,           # 0 means explicit external/manual validation\n    \"report_max_age_seconds\": None,\n    \"candidate_checkpoint\": \"\",\n    \"validated_checkpoint\": \"\",\n    \"probe_report\": \"\",\n}\n\nCANDIDATE_SCHEMA = \"dq-world-model-candidate-v1\"\nTRAINING_SCHEMA = \"dq-world-model-training-v1\"\n\n\ndef _cloned_state(module):\n    return {name: value.detach().clone() for name, value in module.state_dict().items()}\n\n\nclass _SnapshotWeights:\n    \"\"\"Allow fingerprinting checkpoint weights without mutating the active model.\"\"\"\n\n    def __init__(self, weights):\n        self.weights = weights\n\n    def state_dict(self):\n        return self.weights\n\n\nclass _TrainingCheckpoint:\n    def __init__(self, agent):\n        self.agent = agent\n\n    def state_dict(self):\n        agent = self.agent\n        return {\n            \"schema\": TRAINING_SCHEMA,\n            \"metadata\": deepcopy(agent.wm_metadata),\n            \"config\": deepcopy(agent.wm_config),\n            \"candidate\": agent.wm_trainer.state_dict(),\n            \"validated_model\": (_cloned_state(agent.wm_validated)\n                                if agent.wm_has_validated_snapshot else None),\n            \"validated_report\": deepcopy(agent.wm_validated_report),\n            \"imagination\": agent.wm_imagination.state_dict(),\n            \"ppo_updates\": agent.wm_ppo_updates,\n        }\n\n    def load_state_dict(self, state):\n        agent = self.agent\n        if state.get(\"schema\") != TRAINING_SCHEMA:\n            raise ValueError(\"Unsupported world-model training checkpoint schema\")\n        agent._check_metadata(state.get(\"metadata\"))\n        agent.wm_trainer.load_state_dict(state[\"candidate\"])\n        agent.wm_imagination.load_state_dict(state[\"imagination\"])\n        agent.wm_ppo_updates = int(state.get(\"ppo_updates\", 0))\n        agent.wm_has_validated_snapshot = False\n        agent.wm_validated_report = None\n        agent.wm_validated_fingerprint = None\n        if state.get(\"validated_model\") is not None:\n            payload = {\"schema\": CANDIDATE_SCHEMA, \"metadata\": state[\"metadata\"],\n                       \"model\": state[\"validated_model\"]}\n            agent.activate_validated(payload, state.get(\"validated_report\"))\n        # Replay is deliberately not checkpointed. New on-policy interaction\n        # must rebuild a held-out set and warmup before any resumed BPTT.\n        agent.wm_replay.valid.zero_()\n        agent.wm_replay.stamp.fill_(-1)\n        agent.wm_replay._episodes.zero_()\n        agent.wm_replay.steps = 0\n        agent._last_probe_step = 0\n        agent.wm_status = \"warming_up_after_resume\"\n\n\nclass WorldModelPPO(PPO):\n    \"\"\"Preserve real PPO, then fit the candidate and optionally improve Actor.\n\n    ``infos['world_model']`` contains selected-environment tensors captured by\n    the simulator wrapper before automatic reset. Its required fields are\n    ``state, context, next_state, actions, dt, reward, terminated, truncated,\n    success, family, episode_id``. The first ``min(replay_envs, num_envs)`` slots\n    are selected once; context keeps their original simulator lookup IDs.\n\n    ``maybe_validate`` is an optional callback installed by the launcher. It\n    receives this agent after fitting, at ``probe_interval`` vector steps, and\n    may call ``save_candidate`` and ``activate_validated``. It must use isolated\n    simulators. No callback or passing report means ordinary PPO plus fitting.\n    \"\"\"\n\n    def __init__(self, *args, wm_env, wm_config=None, maybe_validate=None, **kwargs):\n        super().__init__(*args, **kwargs)\n        self.wm_env = wm_env\n        self.wm_config = deepcopy(DEFAULT_WORLD_MODEL_CONFIG)\n        self.wm_config.update(wm_config or {})\n        self.maybe_validate = maybe_validate\n        config = self.wm_config\n        if config[\"mode\"] not in (\"fit\", \"hybrid\"):\n            raise ValueError(\"world-model mode must be fit or hybrid\")\n        positive = (\"replay_envs\", \"replay_capacity\", \"window\", \"batch_size\",\n                    \"batches_per_update\", \"horizon\", \"imagination_batch\",\n                    \"validation_batch_size\", \"max_validation_error\", \"max_start_error\")\n        if any(not math.isfinite(float(config[key])) or float(config[key]) <= 0 for key in positive):\n            raise ValueError(\"World-model dimensions and error thresholds must be positive\")\n        if config[\"warmup_steps\"] < 0 or config[\"probe_interval\"] < 0:\n            raise ValueError(\"World-model warmup/probe intervals must be nonnegative\")\n        if not 0 < config[\"holdout_fraction\"] < 1:\n            raise ValueError(\"World-model validation requires holdout_fraction in (0, 1)\")\n        if max(config[\"window\"], config[\"horizon\"]) > config[\"replay_capacity\"]:\n            raise ValueError(\"Replay capacity must cover model and imagination windows\")\n        if self.policy is self.value:\n            raise ValueError(\"World-model BPTT requires independent Actor and Critic\")\n        if self._rewards_shaper is not None:\n            raise ValueError(\"World-model rewards must use the same raw task units as real PPO\")\n        environment_device = torch.empty(0, device=wm_env.device).device\n        learner_device = torch.empty(0, device=self.device).device\n        if environment_device != learner_device:\n            raise ValueError(\"World-model training requires simulator and learner on the same device\")\n        self.wm_adapter = TeacherWorldModelAdapter(wm_env)\n        self.wm_metadata = self._adapter_metadata()\n        selected = min(int(config[\"replay_envs\"]), int(wm_env.num_envs))\n        self.wm_env_ids = torch.arange(selected, device=learner_device)\n        # The external collector uses the exact adapter and selected slots.\n        wm_env.world_model_adapter = self.wm_adapter\n        wm_env.world_model_env_ids = self.wm_env_ids\n        self.wm_candidate = ResidualDynamics(self.wm_adapter, hidden=config[\"hidden\"],\n                                             term_hidden=config[\"term_hidden\"], device=learner_device)\n        self.wm_validated = ResidualDynamics(self.wm_adapter, hidden=config[\"hidden\"],\n                                             term_hidden=config[\"term_hidden\"], device=learner_device)\n        self.wm_validated.requires_grad_(False)\n        self.wm_validated.eval()\n        self.wm_replay = TransitionReplay(selected, config[\"replay_capacity\"],\n                                          self.wm_adapter.state_dim, self.wm_adapter.action_dim,\n                                          self.wm_adapter.context_dim, learner_device,\n                                          holdout_fraction=config[\"holdout_fraction\"])\n        self.wm_trainer = WorldModelTrainer(self.wm_candidate, WMTrainerConfig(\n            window=config[\"window\"], batches_per_update=config[\"batches_per_update\"],\n            batch_size=config[\"batch_size\"], learning_rate=config[\"learning_rate\"],\n            grad_clip=config[\"model_grad_clip\"], termination_weight=config[\"termination_weight\"],\n            recent_fraction=config[\"recent_fraction\"], recent_steps=config[\"recent_steps\"],\n            validation_batch_size=config[\"validation_batch_size\"]))\n        self.wm_imagination = ImaginationTrainer(\n            self.wm_validated, self.wm_adapter, self.policy, self.value,\n            ImaginationConfig(horizon=config[\"horizon\"], gamma=self._discount_factor,\n                              lr=config[\"actor_learning_rate\"], strength=config[\"auxiliary_strength\"],\n                              max_grad_norm=config[\"max_grad_norm\"], max_kl=config[\"max_kl\"],\n                              use_tail_value=config[\"use_tail_value\"]),\n            state_preprocessor=self._state_preprocessor,\n            value_preprocessor=self._value_preprocessor)\n        self.wm_has_validated_snapshot = False\n        self.wm_validated_report = None\n        self.wm_validated_fingerprint = None\n        self.wm_probe_rejection_reasons = []\n        self.wm_ppo_updates = 0\n        self._last_probe_step = 0\n        self.wm_status = \"collecting\"\n        self.last_world_model_metrics = {}\n        self.checkpoint_modules[\"world_model_training\"] = _TrainingCheckpoint(self)\n        if config[\"candidate_checkpoint\"]:\n            self.load_candidate(config[\"candidate_checkpoint\"])\n        if bool(config[\"validated_checkpoint\"]) != bool(config[\"probe_report\"]):\n            raise ValueError(\"validated_checkpoint and probe_report must be provided together\")\n        if config[\"validated_checkpoint\"]:\n            self.activate_validated(self._read_candidate(config[\"validated_checkpoint\"]),\n                                    config[\"probe_report\"])\n\n    def _adapter_metadata(self):\n        metadata = getattr(self.wm_adapter, \"metadata\", None)\n        if callable(metadata):\n            return metadata()\n        # Compatible with tensor-only adapter fixtures. Production supplies a\n        # detailed task/geometry contract through TeacherWorldModelAdapter.\n        return {\"schema\": \"dq-teacher-state-v1\", \"state_dim\": self.wm_adapter.state_dim,\n                \"delta_dim\": self.wm_adapter.delta_dim, \"context_dim\": self.wm_adapter.context_dim,\n                \"context_feature_dim\": self.wm_adapter.context_feature_dim,\n                \"slices\": {key: [value.start, value.stop]\n                           for key, value in self.wm_adapter.slices.items()}}\n\n    def _check_metadata(self, metadata):\n        if metadata is None or configuration_fingerprint(metadata) != configuration_fingerprint(self.wm_metadata):\n            raise ValueError(\"World-model checkpoint does not match this state schema/task contract\")\n\n    def candidate_payload(self):\n        teacher = {\"policy\": self.policy, \"value\": self.value,\n                   \"state_preprocessor\": self._state_preprocessor,\n                   \"value_preprocessor\": self._value_preprocessor}\n        return {\"schema\": CANDIDATE_SCHEMA, \"metadata\": deepcopy(self.wm_metadata),\n                \"config\": deepcopy(self.wm_config), \"model\": _cloned_state(self.wm_candidate),\n                \"updates\": self.wm_trainer.updates, \"collected_steps\": self.wm_replay.steps,\n                \"teacher\": {name: _cloned_state(module) if hasattr(module, \"state_dict\") else None\n                            for name, module in teacher.items()},\n                \"teacher_config\": deepcopy(getattr(self, \"wm_teacher_config\", self.wm_env.cfg)),\n                \"teacher_arguments\": deepcopy(dict(getattr(self, \"wm_teacher_arguments\", {}))),\n                \"global_step\": int(getattr(self.wm_env, \"global_step_counter\", self.wm_replay.steps)),\n                \"sgs_bank_fingerprint\": getattr(getattr(self.wm_env, \"sgs_bank\", None), \"fingerprint\", None)}\n\n    def save_candidate(self, path):\n        \"\"\"Write a probe-ready immutable snapshot; return its in-memory payload.\"\"\"\n        destination = Path(path)\n        destination.parent.mkdir(parents=True, exist_ok=True)\n        payload = self.candidate_payload()\n        temporary = None\n        try:\n            with tempfile.NamedTemporaryFile(dir=str(destination.parent),\n                                             prefix=destination.name + \".\", suffix=\".tmp\",\n                                             delete=False) as handle:\n                temporary = handle.name\n            torch.save(payload, temporary)\n            os.replace(temporary, destination)\n        finally:\n            if temporary is not None and os.path.exists(temporary):\n                os.unlink(temporary)\n        return payload\n\n    def _read_candidate(self, path):\n        payload = torch.load(path, map_location=self.device, weights_only=False)\n        if \"world_model_training\" in payload:\n            training = payload[\"world_model_training\"]\n            payload = {\"schema\": CANDIDATE_SCHEMA, \"metadata\": training[\"metadata\"],\n                       \"model\": training[\"candidate\"][\"model\"],\n                       \"updates\": training[\"candidate\"].get(\"updates\", 0)}\n        if payload.get(\"schema\") != CANDIDATE_SCHEMA:\n            raise ValueError(\"Expected a DQ world-model candidate or full teacher checkpoint\")\n        self._check_metadata(payload.get(\"metadata\"))\n        return payload\n\n    def load_candidate(self, path):\n        payload = self._read_candidate(path)\n        self.wm_candidate.load_state_dict(payload[\"model\"])\n        self.wm_trainer.updates = int(payload.get(\"updates\", 0))\n\n    def _verify_report(self, report, fingerprint):\n        options = dict(model_sha256=fingerprint, configuration=self.wm_metadata,\n                       max_age_seconds=self.wm_config[\"report_max_age_seconds\"])\n        if isinstance(report, dict):\n            # Full teacher checkpoints carry the report itself rather than a\n            # path whose file might disappear or be replaced after resumption.\n            # This low-frequency compatibility path reuses the exact verifier.\n            with tempfile.TemporaryDirectory(prefix=\"dq-wm-report-\") as directory:\n                path = Path(directory) / \"report.json\"\n                path.write_text(json.dumps(report, ensure_ascii=False, allow_nan=False), encoding=\"utf-8\")\n                return load_verified_report(str(path), **options)\n        if not report:\n            return False, [\"missing_action_effect_report\"], None\n        return load_verified_report(str(report), **options)\n\n    def activate_validated(self, payload, report):\n        \"\"\"Promote exactly the snapshot covered by a passing real action probe.\n\n        Returns False with ``wm_probe_rejection_reasons`` on failed evidence.\n        An existing approved snapshot stays active if a new candidate fails.\n        Payloads with an incompatible state/task schema raise immediately.\n        \"\"\"\n        if isinstance(payload, (str, Path)):\n            payload = self._read_candidate(payload)\n        self._check_metadata(payload.get(\"metadata\"))\n        expected = self.wm_validated.state_dict()\n        incoming = payload[\"model\"]\n        if set(incoming) != set(expected) or any(\n                incoming[key].shape != value.shape or incoming[key].dtype != value.dtype\n                for key, value in expected.items()):\n            raise ValueError(\"Validated snapshot architecture/dtype differs from the active world model\")\n        fingerprint = model_fingerprint(_SnapshotWeights(payload[\"model\"]))\n        accepted, reasons, verified = self._verify_report(report, fingerprint)\n        self.wm_probe_rejection_reasons = list(reasons)\n        if not accepted:\n            return False\n        # Validation happens before replacing the live imagination snapshot.\n        self.wm_validated.load_state_dict(payload[\"model\"])\n        self.wm_validated.requires_grad_(False)\n        self.wm_validated.eval()\n        self.wm_validated_report = deepcopy(verified)\n        self.wm_validated_fingerprint = fingerprint\n        self.wm_has_validated_snapshot = True\n        return True\n\n    def record_transition(self, states, actions, rewards, next_states, terminated,\n                          truncated, infos, timestep, timesteps):\n        super().record_transition(states, actions, rewards, next_states, terminated,\n                                  truncated, infos, timestep, timesteps)\n        if not isinstance(infos, dict) or \"world_model\" not in infos:\n            raise RuntimeError(\"WorldModelPPO requires pre-reset infos['world_model'] from the environment collector\")\n        transition = infos[\"world_model\"]\n        required = (\"state\", \"context\", \"next_state\", \"actions\", \"dt\", \"reward\",\n                    \"terminated\", \"truncated\", \"success\", \"family\", \"episode_id\")\n        missing = set(required).difference(transition)\n        if missing:\n            raise ValueError(\"World-model transition is missing {}\".format(sorted(missing)))\n        for key in required:\n            value = transition[key]\n            if not torch.is_tensor(value) or value.device != self.wm_replay.device:\n                raise ValueError(\"World-model {} must be a tensor on the simulator/learner device\".format(key))\n            if value.shape[0] != len(self.wm_env_ids):\n                raise ValueError(\"World-model collector must use the fixed selected environment IDs\")\n        self.wm_replay.add(transition[\"state\"], transition[\"actions\"], transition[\"next_state\"],\n                           transition[\"context\"], transition[\"dt\"], transition[\"reward\"],\n                           transition[\"terminated\"], transition[\"truncated\"], transition[\"family\"],\n                           episode_ids=transition[\"episode_id\"], valid=transition.get(\"valid\"),\n                           success=transition[\"success\"])\n\n    @torch.no_grad()\n    def _prediction_errors(self, predicted, target):\n        physical = self.wm_validated.normalized_sq_error(predicted, target)\n        result = {\"nse\": physical, \"confidence_error\": physical}\n        relative_loss = getattr(self.wm_adapter, \"auxiliary_loss\", None)\n        if relative_loss is not None:\n            relative = relative_loss(predicted, target)\n            result[\"relative_error\"] = relative\n            # The default .25 threshold applies to the MAXIMUM of normalized\n            # physical and task-relative error for each sample, not their sum.\n            # Take the maximum before any batch averaging: physical error in\n            # one sample must not hide relative error in another sample.\n            result[\"confidence_error\"] = torch.maximum(physical, relative)\n        return result\n\n    @torch.no_grad()\n    def _validated_errors(self):\n        window = max(self.wm_config[\"window\"], self.wm_config[\"horizon\"])\n        if not self.wm_replay.can_sample(window, \"validation\"):\n            return None\n        batch = self.wm_replay.sample_windows(self.wm_config[\"validation_batch_size\"],\n                                              window, split=\"validation\", balance_families=True)\n        predicted = batch.states[0]\n        errors = {}\n        for step in range(window):\n            predicted = self.wm_validated(predicted, batch.actions[step],\n                                           batch.context[step], batch.dt[step])\n            for name, value in self._prediction_errors(predicted, batch.states[step + 1]).items():\n                errors.setdefault(name, []).append(value)\n        # Gate every rollout step on its mean per-sample confidence score.\n        return {name: torch.stack(values).mean(-1) for name, values in errors.items()}\n\n    @torch.no_grad()\n    def _anchor_observations(self, starts):\n        observations = self.wm_adapter.observation(starts.state, starts.context)\n        if self.memory is not None:\n            real = self.memory.get_tensor_by_name(\"states\").reshape(-1, observations.shape[-1])\n            if len(real):\n                index = torch.randint(len(real), (len(starts.state),), device=real.device)\n                observations = torch.cat((observations, real[index]), 0)\n        return observations.detach()\n\n    def _update_world_model(self):\n        \"\"\"Run after a completed real PPO update, using separate optimizers.\"\"\"\n        config = self.wm_config\n        self.wm_ppo_updates += 1\n        metrics = {\"candidate/\" + key: value\n                   for key, value in self.wm_trainer.update(self.wm_replay).items()}\n        metrics.update({\"replay_steps\": float(self.wm_replay.steps),\n                        \"replay_memory_mib\": self.wm_replay.memory_bytes / 2 ** 20,\n                        \"on_gpu\": float(self.wm_replay.device.type == \"cuda\")})\n        interval = int(config[\"probe_interval\"])\n        if (config[\"mode\"] == \"hybrid\" and self.maybe_validate is not None and interval > 0\n                and self.wm_replay.steps >= config[\"warmup_steps\"]\n                and self.wm_replay.steps - self._last_probe_step >= interval):\n            self.maybe_validate(self)\n            self._last_probe_step = self.wm_replay.steps\n        max_age = config[\"report_max_age_seconds\"]\n        if self.wm_has_validated_snapshot and max_age is not None:\n            age = time.time() - float(self.wm_validated_report.get(\"created_unix\", 0))\n            if age > float(max_age) or age < -60:\n                self.wm_has_validated_snapshot = False\n                self.wm_probe_rejection_reasons = [\"report_expired_or_future_dated\"]\n        if config[\"mode\"] == \"fit\":\n            self.wm_status = \"fit_only\"\n        elif self.wm_replay.steps < config[\"warmup_steps\"]:\n            self.wm_status = \"warming_up\"\n        elif not self.wm_has_validated_snapshot:\n            self.wm_status = \"waiting_for_probe\"\n        else:\n            errors = self._validated_errors()\n            if errors is not None:\n                for name, values in errors.items():\n                    metrics[\"validated/\" + name + \"_1step\"] = float(values[0])\n                    metrics[\"validated/\" + name + \"_kstep\"] = float(values[-1])\n                    metrics[\"validated/\" + name + \"_max\"] = float(values.max())\n            if errors is None:\n                self.wm_status = \"waiting_for_heldout_windows\"\n            elif (not bool(torch.isfinite(errors[\"confidence_error\"]).all())\n                  or float(errors[\"confidence_error\"].max()) > config[\"max_validation_error\"]):\n                self.wm_status = \"heldout_error_rejected\"\n            elif not self.wm_replay.can_sample(1, \"train\"):\n                self.wm_status = \"waiting_for_train_starts\"\n            else:\n                starts = self.wm_replay.sample_starts(config[\"imagination_batch\"], split=\"train\",\n                                                      balance_families=True,\n                                                      recent_fraction=config[\"recent_fraction\"],\n                                                      recent_steps=config[\"recent_steps\"])\n                with torch.no_grad():\n                    next_state = self.wm_validated(starts.state, starts.action, starts.context, starts.dt)\n                    start_errors = self._prediction_errors(next_state, starts.next_state)\n                    error = start_errors[\"confidence_erro
