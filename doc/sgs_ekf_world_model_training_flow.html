object features and lastCommands=False\")\n        self.pose_prediction_horizons = self.pose_prediction_cfg.get(\"horizons\", [0.30, 0.60])\n        self.num_future_pose_obs = 6 * len(self.pose_prediction_horizons) + 1 if prediction_enabled else 0\n        self.num_velocity_obs = 0 if self.cfg[\"env\"].get(\"noVelocityObs\", False) else 5\n        removed_velocity_dim = 5 - self.num_velocity_obs\n        # Student states already exclude both velocities, so their size stays fixed.\n        super()._setup_obs_and_action_info(\n            removed_dim=9+30*6+2-removed_velocity_dim+self.num_future_pose_obs+self.num_tsil_obs,\n            num_action=9,\n            num_obs=38+30*6+2+self.num_features-1-removed_velocity_dim+self.num_future_pose_obs+self.num_tsil_obs,\n        )\n        \n        \n    def _extra_env_settings(self):\n        self.multi_obj = self.cfg[\"env\"][\"asset\"][\"asset_multi\"]  #the cfg here refer to the b1z1_pickmulti.yaml\n        self.obj_list = list(self.multi_obj.keys())\n        self.obj_height = [self.multi_obj[obj][\"height\"] for obj in self.obj_list]\n        self.obj_orn = [self.multi_obj[obj][\"orientation\"] for obj in self.obj_list]\n        self.obj_scale = [self.multi_obj[obj][\"scale\"] for obj in self.obj_list]\n        obj_dir = os.path.join(self.cfg[\"env\"][\"asset\"][\"assetRoot\"], self.cfg[\"env\"][\"asset\"][\"assetFileObj\"])\n        if not self.no_feature:\n            features = []\n            for obj_name in self.obj_list:\n                feature_path = os.path.join(obj_dir, obj_name, \"features.npy\")\n                feature = np.load(feature_path, allow_pickle=True)\n                features.append(feature)\n            assert len(features) == len(self.obj_list)\n            self.features = np.concatenate(features, axis=0) \n            self.num_features = self.features.shape[1]\n        else:\n            self.num_features = 0\n\n    def _init_tensors(self):\n        \"\"\"Add extra tensors for cube and table\n        \"\"\"\n        super()._init_tensors()\n        if self.tsil_enabled:\n            self.tsil_time_reference = float(\n                self.max_episode_length * self.control_freq_low_init * self.dt)\n            self.tsil_elapsed = torch.zeros(self.num_envs, device=self.device)\n            self.tsil_episode_D = torch.full_like(self.tsil_elapsed, self.tsil_time_reference)\n            self.tsil_episode_id = torch.full((self.num_envs,), -1, dtype=torch.long, device=self.device)\n            # Per-reset diagnostics are ephemeral; querying never mutates the\n            # checkpoint's targets, descriptors, or success flags.\n            self.tsil_lookup_status = torch.full_like(self.tsil_episode_id, -1)\n            self.tsil_reward_fixed = torch.zeros_like(self.tsil_elapsed)\n            self.tsil_reward_command_raw = torch.zeros_like(self.tsil_elapsed)\n        \n        self._table_root_states = self._root_states.view(self.num_envs, self.num_actors, self._actor_root_state.shape[-1])[..., 1, :]\n        self._initial_table_root_states = self._table_root_states.clone()\n        self._initial_table_root_states[:, 7:13] = 0.0\n        \n        self._cube_root_states = self._root_states.view(self.num_envs, self.num_actors, self._actor_root_state.shape[-1])[..., 2, :]\n        self._initial_cube_root_states = self._cube_root_states.clone()\n        self._initial_cube_root_states[:, 7:13] = 0.0\n\n        self.object_pose_predictor = None\n        self.future_object_obs = torch.zeros((self.num_envs, self.num_future_pose_obs), device=self.device)\n        if self.num_future_pose_obs:\n            self.object_pose_predictor = RollingSE3Predictor(\n                self.num_envs, self.device,\n                history=self.pose_prediction_cfg.get(\"history\", 5),\n                horizons=self.pose_prediction_horizons,\n                q_scale=self.pose_prediction_cfg.get(\"qScale\", 1.0),\n                r_scale=self.pose_prediction_cfg.get(\"rScale\", 0.01),\n            )\n        \n        self._table_actor_ids = self.num_actors * torch.arange(self.num_envs, device=self.device, dtype=torch.long) + 1\n        self._cube_actor_ids = self.num_actors * torch.arange(self.num_envs, device=self.device, dtype=torch.long) + 2\n        \n        self.table_idx = self.gym.find_actor_rigid_body_index(self.envs[0], self.table_handles[0], \"box\", gymapi.DOMAIN_ENV)\n        \n        self.lifted_success_threshold = self.cfg[\"env\"][\"liftedSuccessThreshold\"]\n        self.lifted_init_threshold = self.cfg[\"env\"][\"liftedInitThreshold\"]\n        self.base_object_distace_threshold = self.cfg[\"env\"][\"baseObjectDisThreshold\"] # default 0.6\n        self.lifted_object = torch.zeros(self.num_envs, device=self.device, dtype=torch.bool)\n        self.pick_success = torch.zeros_like(self.lifted_object)\n        self.pick_success_recorded = torch.zeros_like(self.lifted_object)\n        self.pick_hold_progress = torch.zeros_like(self.lifted_object)\n        self.best_pick_counter = torch.zeros_like(self.pick_counter)\n        self.success_window = RollingEpisodeSuccess(window_size=1000)\n        self.episode_outcome_recorded = torch.zeros_like(self.lifted_object)\n        \n        self.highest_object = -torch.ones(self.num_envs, device=self.device, dtype=torch.float)\n        self.curr_height = torch.zeros(self.num_envs, device=self.device, dtype=torch.float)\n        \n        self.random_angle = torch.as_tensor(np.array([0, 1.5708, -1.5708]), device=self.device, dtype=torch.float)\n        self.lifted_now = torch.zeros(self.num_envs, device=self.device, dtype=torch.bool)\n\n        if self.pred_success:\n            self.predlift_success_counter = torch.zeros(self.num_envs, device=self.device, dtype=torch.long)\n        # SGS and evaluation read the same latched outcome as the original task.\n        self.episode_success = self.pick_success_recorded\n\n        \n\n    def _create_extra(self, env_i):\n        self.env_ptr = self.envs[env_i]\n        col_group = env_i\n        col_filter = 0\n        i = env_i\n\n        obj_idx = i % len(self.obj_list)\n        obj_asset = self.ycb_asset_list[obj_idx]\n        obj_height = self.obj_height[obj_idx]\n\n        table_pos = [0.0, 2.0, self.table_dims.z / 2]\n        self.table_heights[i] = table_pos[-1] + self.table_dims.z / 2\n\n        table_start_pose = gymapi.Transform()\n        table_start_pose.p = gymapi.Vec3(*table_pos)\n        table_start_pose.r = gymapi.Quat(0, 0, 0, 1)\n        self.table_start_pose = table_start_pose\n        self.table_handle = self.gym.create_actor(self.env_ptr, self.table_asset, table_start_pose, \"table\", col_group, col_filter, 1)\n\n        pose = gymapi.Transform()\n        pose.p = gymapi.Vec3(0.0, 2.0, 0.5)  # initial position\n        pose.r = gymapi.Quat(0, 0, 0.7071, -0.7071)  # initial orientation\n\n        self.cube_start_pose = gymapi.Transform()\n        self.cube_start_pose.p.x = table_start_pose.p.x \n        self.cube_start_pose.p.y = table_start_pose.p.y \n        self.cube_start_pose.p.z = self.table_heights[i] + obj_height  \n\n        self.cube_handle = self.gym.create_actor(self.env_ptr, obj_asset, self.cube_start_pose, \"cube\", col_group, col_filter, 2)\n\n        self.cube_indices[i] = self.gym.get_actor_index(self.env_ptr, self.cube_handle, gymapi.DOMAIN_SIM)\n\n        self.cube_handles.append(self.cube_handle)\n        self.table_handles.append(self.table_handle)\n\n        if not self.no_feature:\n            self.feature_obs[i, :] = self.features[obj_idx, :]\n        self.init_height[i] = obj_height\n        self.init_quat[i, :] = torch.tensor(self.obj_orn[obj_idx], device=self.device)\n\n        ## create camera fixed in the floating table ## just when self.camera_test is True to debug  or to catch the image for grasp point prediction \n        if self.camera_test:\n            fix_camera_handle = self._create_fix_cameras(self.env_ptr,self.table_handle,i)\n            self.fix_camera_handles.append(fix_camera_handle)\n\n            \n\n\n    def _create_envs(self):\n        asset_root = self.cfg[\"env\"][\"asset\"][\"assetRoot\"]\n        asset_file_ycb = self.cfg[\"env\"][\"asset\"][\"assetFileObj\"]\n\n        self.table_heights = torch.zeros(self.num_envs, device=self.device, dtype=torch.float)\n        # table\n        self.table_dimz = 0.1\n        self.table_dims = gymapi.Vec3(0.2, 0.2, self.table_dimz)\n        table_options = gymapi.AssetOptions()\n        table_options.fix_base_link = False\n        table_options.density = 50000\n        self.table_asset = self.gym.create_box(self.sim, self.table_dims.x, self.table_dims.y, self.table_dims.z, table_options)\n        table_rigid_shape_props = self.gym.get_asset_rigid_shape_properties(self.table_asset)\n        table_rigid_shape_props[0].friction = 2.0\n        self.gym.set_asset_rigid_shape_properties(self.table_asset, table_rigid_shape_props)\n\n\n        # cube \n        ycb_opts = gymapi.AssetOptions()\n        ycb_opts.use_mesh_materials = True\n        ycb_opts.vhacd_enabled = True\n        ycb_opts.override_inertia = True\n        ycb_opts.override_com = False\n        ycb_opts.mesh_normal_mode = gymapi.COMPUTE_PER_VERTEX\n        ycb_opts.disable_gravity = False  \n        ycb_opts.fix_base_link = False    \n\n        self.ycb_asset_list = []\n        cprint(f\"############## len(self.obj_list) is {len(self.obj_list)} ################\" ,\"yellow\")\n        for i in range(len(self.obj_list)):\n            file_path = asset_file_ycb + self.obj_list[i] + \"/model.urdf\"\n            ycb_asset = self.gym.load_asset(self.sim, asset_root, file_path, ycb_opts)\n\n            ycb_asset_props = self.gym.get_asset_rigid_shape_properties(ycb_asset)\n            ######## important: because that cube's ycb_asset_props's obj(index) don't just have one ,you may look up to the .obj not just .urdf ######\n            for i in range(len(ycb_asset_props)):\n                ycb_asset_props[i].friction = 2.0\n\n            self.gym.set_asset_rigid_shape_properties(ycb_asset, ycb_asset_props)\n            self.ycb_asset_list.append(ycb_asset)\n\n        self.table_handles, self.cube_handles = [], []\n        self.cube_positions = np.zeros((self.num_envs, 2))  # store cube position\n        self.cube_angles = np.zeros(self.num_envs)  # store cube angle\n        self.cube_speeds = np.zeros(self.num_envs)    \n\n        self.cube_indices = torch.zeros(self.num_envs, dtype=torch.int32, device=self.device)\n\n        if not self.no_feature:\n            self.feature_obs = torch.zeros(self.num_envs, self.num_features, device=self.device, dtype=torch.float)\n            self.features = torch.tensor(self.features, device=self.device, dtype=torch.float)\n        \n        self.init_height = torch.zeros(self.num_envs, device=self.device, dtype=torch.float)\n        self.init_quat = torch.zeros(self.num_envs, 4, device=self.device, dtype=torch.float)\n        \n\n        super()._create_envs()\n        \n\n\n            \n    def _record_episode_outcomes(self):\n        \"\"\"Publish the last 1000 complete-task outcomes before step returns infos.\n\n        A reset is not itself an outcome. Only actual terminal steps enter the\n        window, once per episode, including failures and timeouts. Simultaneous\n        completions have no temporal order; ascending env ID breaks that tie.\n        SGS contributes only full_task starts; ordinary resets all qualify.\n        \"\"\"\n        finished = (self.reset_buf.bool() & ~self.episode_outcome_recorded\n                    & (self.progress_buf > 0))\n        env_ids = finished.nonzero(as_tuple=False).flatten()\n        if env_ids.numel() == 0:\n            return\n        # All terminal episodes have been handled, even when their starting\n        # configuration excludes them from the baseline comparison metric.\n        self.episode_outcome_recorded[env_ids] = True\n        sgs_enabled = getattr(self, \"sgs_enabled\", False)\n        if sgs_enabled:\n            config_ids = self.active_config_id[env_ids]\n            family_ids = self.sgs_bank.tensors[\"family_id\"]\n            valid = (config_ids >= 0) & (config_ids < family_ids.numel())\n            env_ids = env_ids[valid]\n            full_task_id = self.sgs_bank.family_names.index(\"full_task\")\n            env_ids = env_ids[family_ids[config_ids[valid]] == full_task_id]\n        outcomes = torch.stack((env_ids % len(self.obj_list),\n                                self.pick_success_recorded[env_ids].long()), dim=1)\n        self.success_window.extend(outcomes.cpu().tolist())\n        # Replace the snapshot so object-specific rates disappear when their\n        # last sample leaves the global window. Logging is independent of W&B.\n        metrics = self.success_window.metrics(self.obj_list)\n        self.extras[\"success_rate\"] = metrics\n        print({\"success_rate\": metrics, \"window_size\": self.success_window.window_size,\n               \"scope\": \"full_task\" if sgs_enabled else \"ordinary_reset\"})\n\n    def compute_reward(self):\n        super().compute_reward()\n        # Some optional rewards can also terminate an episode. Record the final\n        # done state, after all rewards, and before the trainer receives infos.\n        self._record_episode_outcomes()\n\n    def _reset_envs(self, env_ids):\n        if getattr(self, \"sgs_enabled\", False):\n            self._reset_sgs_envs(env_ids)\n            return\n        super()._reset_envs(env_ids)\n        if len(env_ids) > 0:\n            self.episode_step_sum[env_ids] += self.one_epoch_step[env_ids]\n            self.one_epoch_step[env_ids] = 0.0\n                \n\n                \n    def _reset_objs(self, env_ids):\n        if len(env_ids)==0:\n            return\n        \n        self._cube_root_states[env_ids] = self._initial_cube_root_states[env_ids]\n        self._cube_root_states[env_ids,0] = self.cube_start_pose.p.x\n        self._cube_root_states[env_ids,1] = self.cube_start_pose.p.y\n        self._cube_root_states[env_ids,3] = self.cube_start_pose.r.x\n        self._cube_root_states[env_ids,4] = self.cube_start_pose.r.y\n        self._cube_root_states[env_ids,5] = self.cube_start_pose.r.z\n        self._cube_root_states[env_ids,6] = self.cube_start_pose.r.w\n        self._cube_root_states[env_ids,7:13] = 0.0\n        self._cube_root_states[env_ids,2] = self.table_heights[env_ids] + self.init_height[env_ids]\n        \n        yaw_limit = np.pi / 12.0  # World-z yaw offset in [-15, 15] degrees.\n        rand_yaw_box = torch_rand_float(-yaw_limit, yaw_limit, (len(env_ids), 1), device=self.device).squeeze(1)\n        zero = torch.zeros_like(rand_yaw_box)\n        # Left multiplication rotates about world z, preserving the object's support face.\n        self._cube_root_states[env_ids, 3:7] = quat_mul(\n            quat_from_euler_xyz(zero, zero, rand_yaw_box), self.init_quat[env_ids])\n        self._cube_root_states[env_ids, 7:13] = 0.\n        \n    def _reset_table(self, env_ids):\n        if len(env_ids)==0:\n            return\n        \n        self._table_root_states[env_ids] = self._initial_table_root_states[env_ids]\n        self._table_root_states[env_ids,0] = self.table_start_pose.p.x\n        self._table_root_states[env_ids,1] = self.table_start_pose.p.y\n        self._table_root_states[env_ids,3] = self.table_start_pose.r.x\n        self._table_root_states[env_ids,4] = self.table_start_pose.r.y\n        self._table_root_states[env_ids,5] = self.table_start_pose.r.z\n        self._table_root_states[env_ids,6] = self.table_start_pose.r.w\n        # if self.table_heights_fix is None:\n        #     rand_heights = torch_rand_float(0.5, 0.8, (len(env_ids), 1), device=self.device)\n        # else:\n        #     rand_heights = torch.ones((len(env_ids), 1), device=self.device, dtype=torch.float)*self.table_heights_fix - self.table_dimz / 2\n        \n        self.table_commands[env_ids,4] = torch_rand_float(0.5, 0.6, (len(env_ids), 1), device=self.device).squeeze(1) - self.table_dimz / 2.0\n        self._table_root_states[env_ids, 2] = self.table_commands[env_ids,4]\n\n        self.table_heights[env_ids] = self.table_commands[env_ids,4] + self.table_dimz / 2.0\n\n    \n    def _reset_actors(self, env_ids):\n        self._reset_table(env_ids)\n        self._reset_objs(env_ids)\n        super()._reset_actors(env_ids)\n\n        return\n    \n    def _reset_pick_state(self, env_ids):\n        \"\"\"Reset task progress identically for ordinary and bank initial states.\"\"\"\n        self.lifted_object[env_ids] = 0\n        self.lifted_now[env_ids] = False\n        self.pick_success[env_ids] = False\n        self.pick_success_recorded[env_ids] = False\n        self.episode_outcome_recorded[env_ids] = False\n        self.pick_hold_progress[env_ids] = False\n        self.best_pick_counter[env_ids] = 0\n        self.curr_height[env_ids] = 0.\n        self.highest_object[env_ids] = -1.\n\n    def _reset_env_tensors(self, env_ids):\n        super()._reset_env_tensors(env_ids)\n\n        robot_ids_int64 = self._robot_actor_ids[env_ids]\n        table_ids_int64 = self._table_actor_ids[env_ids]\n        cube_ids_int64 = self._cube_actor_ids[env_ids]\n        multi_ids_int64 = torch.cat([robot_ids_int64, table_ids_int64, cube_ids_int64], dim=0)\n        multi_ids_int32 = multi_ids_int64.to(torch.int32)\n        robot_ids_int32 = robot_ids_int64.to(torch.int32)\n        \n        self.gym.set_dof_state_tensor_indexed(self.sim, gymtorch.unwrap_tensor(self._dof_state),\n                                                    gymtorch.unwrap_tensor(robot_ids_int32), len(robot_ids_int64))\n        self.gym.set_actor_root_state_tensor_indexed(self.sim, gymtorch.unwrap_tensor(self._root_states),\n                                                        gymtorch.unwrap_tensor(multi_ids_int32), len(multi_ids_int64))\n        self.gym.simulate(self.sim)\n        self._refresh_sim_tensors()\n        self.render()\n\n        self._reset_pick_state(env_ids)\n        if self.object_pose_predictor is not None:\n            # super()._reset_envs computes observations immediately after this\n            # method. Clear old history BEFORE that first new-episode observation.\n            self.object_pose_predictor.reset(env_ids)\n            self.object_pose_predictor.push(\n                self._cube_root_states[env_ids, :7], self.gym.get_sim_time(self.sim), env_ids)\n        if getattr(self, \"tsil_enabled\", False):\n            self._reset_tsil_state(env_ids)\n        return\n    \n    def _refresh_sim_tensors(self):\n        super()._refresh_sim_tensors()\n        self._update_curr_dist()\n    \n    def _update_curr_dist(self):\n        # d_s = self.ee_pos - self._cube_root_states[:, :3]\n        d = torch.norm(self.ee_pos - self._cube_root_states[:, :3], dim=-1)\n        self.curr_dist[:] = d\n        self.closest_dist = torch.where(self.closest_dist < 0, self.curr_dist, self.closest_dist)\n        \n        self.curr_height[:] = self._cube_root_states[:, 2] - self.table_heights - self.init_height\n        self.highest_object = torch.where(self.highest_object < 0, self.curr_height, self.highest_object)\n\n    def _update_object_pose_prediction(self):\n        if self.object_pose_predictor is not None:\n            self.object_pose_predictor.push(self._cube_root_states[:, :7], self.gym.get_sim_time(self.sim))\n            self.object_pose_predictor.predict()\n\n    def _future_object_observations(self, env_ids, current_object_obs):\n        if self.object_pose_predictor is None:\n            return self.future_object_obs[env_ids]\n        horizons = len(self.pose_prediction_horizons)\n        future = self.object_pose_predictor.future_poses[env_ids]\n        # Compute directly from current robot state, including on reset when\n        # update_roboinfo() has not run yet. All horizons share this reference.\n        robot = self._robot_root_states[env_ids]\n        offset = torch.tensor([0.3, 0., 0.09], device=self.device).expand(len(env_ids), -1)\n        arm_base = quat_apply(robot[:, 3:7], offset) + robot[:, :3]\n        encoded = object_pose_in_teacher_frame(\n            future[..., :3].reshape(-1, 3), future[..., 3:7].reshape(-1, 4),\n            arm_base[:, None, :].expand(-1, horizons, -1).reshape(-1, 3),\n            self.base_yaw_quat[env_ids, None, :].expand(-1, horizons, -1).reshape(-1, 4),\n        ).reshape(-1, horizons, 6)\n        valid = self.object_pose_predictor.valid[env_ids]\n        encoded = torch.where(valid[:, None, None], encoded, current_object_obs[:, None, :])\n        self.future_object_obs[env_ids] = torch.cat((encoded.flatten(1), valid[:, None].to(encoded.dtype)), dim=-1)\n        return self.future_object_obs[env_ids]\n\n    def _compute_observations(self, env_ids=None):\n        if env_ids is None:\n            env_ids = to_torch(np.arange(self.num_envs), device=self.device, dtype=torch.long)\n            \n        obs = super()._compute_observations(env_ids)\n        \n        if not self.no_feature:\n            if self.cfg[\"env\"].get(\"lastCommands\", False):\n                self.obs_buf[env_ids] = torch.cat([self.feature_obs[env_ids, :], obs, self.command_history_buf[env_ids, -1]], dim=-1)\n            else:\n                ####### grasp predict #######\n                grasp_predict_world_pos,grasp_predict_world_rpy = self.get_grasp_world(obs[...,-6:], env_ids)\n\n                ####### related pose ########\n                grasp_global_rot = quat_from_euler_xyz(grasp_predict_world_rpy[...,0],grasp_predict_world_rpy[...,1],grasp_predict_world_rpy[...,2])\n                base_quat = self._robot_root_states[env_ids, 3:7]  # [num_envs, 4], base quaternion\n                base_quat = base_quat.unsqueeze(1).repeat(1, grasp_global_rot.shape[1], 1)  # [num_env, n, 4] ， base quaternion\n                base_quat_conj = quat_conjugate(base_quat)   # Inverse of base quaternion\n                #  Compute local quaternion: q_local = q_base^(-1) * q_global\n                ee_grasp_local_orn_quat = quat_mul(base_quat_conj, grasp_global_rot)\n                grasp_predict_local_rpy = quat_to_euler_zyx(ee_grasp_local_orn_quat)\n                ####### related pose ########\n\n                ####### related orientation ########\n                # base_quat = self._robot_root_states[env_ids, 3:7]  # [num_envs, 4], base quaternion\n                arm_base = self.arm_base[env_ids].unsqueeze(1).repeat(1, grasp_global_rot.shape[1], 1)\n                relative_pos = grasp_predict_world_pos - arm_base\n                grasp_predict_local_pos = quat_rotate_inverse_batched(base_quat, relative_pos)\n                grasp_predict_local_pos[..., 2] = torch.clip(grasp_predict_local_pos[..., 2], -0.6, 0.6)\n                ####### related orientation ########\n\n                ####### grasp predict #######\n\n                grasp_predict_world_pos_flat = grasp_predict_local_pos.view(grasp_predict_local_pos.shape[0], -1) ## [num_env,3*object_num]\n                grasp_predict_world_rpy_flat = grasp_predict_local_rpy.view(grasp_predict_local_rpy.shape[0], -1) ## [num_env,3*object_num]\n                future_obs = self._future_object_observations(env_ids, obs[:, :6])\n                temporal_obs = self._tsil_observations(env_ids)\n                obs_new = torch.cat([obs[...,:-6],future_obs,temporal_obs,grasp_predict_world_pos_flat,grasp_predict_world_rpy_flat],dim = -1)\n\n                self.obs_buf[env_ids] = torch.cat([self.feature_obs[env_ids, :], obs_new, self.action_history_buf[env_ids, -1]], dim=-1) # self.action_history_buf: [num_env,3,9], obs: [num_env, 61]\n\n        else:\n            if self.cfg[\"env\"].get(\"lastCommands\", False):\n                self.obs_buf[env_ids] = torch.cat([obs, self.command_history_buf[env_ids, -1]], dim=-1)\n            else:\n                self.obs_buf[env_ids] = torch.cat([obs, self.action_history_buf[env_ids, -1]], dim=-1)\n    \n    def _compute_robot_obs(self, env_ids=None):\n        if env_ids is None:\n            robot_root_state = self._robot_root_states\n            table_root_state = self._table_root_states\n            cube_root_state = self._cube_root_states\n            body_pos = self._rigid_body_pos\n            body_rot = self._rigid_body_rot\n            body_vel = self._rigid_body_vel\n            body_ang_vel = self._rigid_body_ang_vel\n            dof_pos = self._dof_pos\n            dof_vel = self._dof_vel\n            commands = self.commands\n            table_dim = torch.tensor([0.6, 1.0, self.table_dimz]).repeat(self.num_envs, 1).to(self.device)\n            base_quat_yaw = self.base_yaw_quat\n            spherical_center = self.get_ee_goal_spherical_center()\n            ee_goal_cart = self.curr_ee_goal_cart\n            ee_goal_orn_rpy = self.curr_ee_goal_orn_rpy\n        else:\n            robot_root_state = self._robot_root_states[env_ids] \n            table_root_state = self._table_root_states[env_ids] \n            cube_root_state = self._cube_root_states[env_ids] \n            body_pos = self._rigid_body_pos[env_ids]\n            body_rot = self._rigid_body_rot[env_ids]\n            body_vel = self._rigid_body_vel[env_ids]\n            body_ang_vel = self._rigid_body_ang_vel[env_ids]\n            dof_pos = self._dof_pos[env_ids]\n            dof_vel = self._dof_vel[env_ids]\n            commands = self.commands[env_ids]\n            # table_dim = torch.tensor([0.6, 1.0, self.table_dimz]).repeat(len(env_ids), 1).to(self.device)\n            table_dim = torch.tensor([self.table_dims.x, self.table_dims.y, self.table_dims.z]).repeat(len(env_ids), 1).to(self.device) ## my change _table_dim\n            base_quat_yaw = self.base_yaw_quat[env_ids]\n            spherical_center = self.get_ee_goal_spherical_center()[env_ids]\n            ee_goal_cart = self.curr_ee_goal_cart[env_ids]\n            ee_goal_orn_rpy = self.curr_ee_goal_orn_rpy[env_ids]\n            cube_vel = cube_root_state[:, 7:10]\n            cube_angular = cube_root_state[:, 10:]\n            cube_vel_local = quat_rotate_inverse(base_quat_yaw, cube_vel)\n            cube_angular_local = quat_rotate_inverse(base_quat_yaw, cube_angular)\n            ee_goal_global_cart = self.ee_goal_global_cart[env_ids]\n            ee_goal_orn_quat = self.ee_goal_global_orn_quat[env_ids]\n        \n        obs = compute_robot_observations(robot_root_state, table_root_state, cube_root_state, body_pos,\n                                         body_rot, body_vel, body_ang_vel, dof_pos, dof_vel, base_quat_yaw, spherical_center, commands, self.gripper_idx, table_dim,\n                                         ee_goal_cart, ee_goal_orn_rpy, ee_goal_global_cart, ee_goal_orn_quat, self.use_roboinfo, self.floating_base)\n        if self.num_velocity_obs == 0:\n            # Tail: robot velocity (3), relative object velocity (2), world pose (6).\n            # Keep the world pose for get_grasp_world; remove velocities, not zero them.\n            obs = torch.cat([obs[..., :-11], obs[..., -6:]], dim=-1)\n        \n        return obs\n    \n    def step(self, actions: torch.Tensor) -> Tuple[Dict[str, torch.Tensor], torch.Tensor, torch.Tensor, Dict[str, Any]]:\n        \"\"\"Step the physics of the environment.\n\n        Args:\n            actions: actions to apply\n        Returns:\n            Observations, rewards, resets, info\n            Observations are dict of observations (currently only one member called 'obs')\n        \"\"\"\n        cmd_dim = 2\n        pred_dim = 1 if self.pred_success else 0\n        if self.near_goal_stop:\n            self.extras[\"replaced_action\"] = torch.clone(actions)\n            ############### when the end-effector and the object 's distance is lower than 0.6m , the action will not to be applied. ############\n            self.extras[\"replaced_action\"][self.base_obj_dis < 0.6, -(cmd_dim+pred_dim):-pred_dim] = 0.0 # enforced these cmd to be 0\n            # if not self.enable_camera:\n            actions = self.extras[\"replaced_action\"]\n        \n        # Randomly change the object position in a small probability (like 0.1)\n        obj_move_prob = torch_rand_float(0, 1, (self.num_envs, 1), device=self.device).squeeze()\n        changed_env_ids = torch.range(0, self.num_envs-1, dtype=int, device=self.device)[obj_move_prob < self.obj_move_prob] # This is a tensor with the length of env_nums\n        self.now_env_ids = changed_env_ids\n        self._reset_objs(changed_env_ids)\n\n        self.extras[\"lifted_now\"] = self.lifted_now.unsqueeze(-1)*2-1 # This is for the lifted results from the last step, exactly what we want. Lifted = 1, unlifted = -1\n        res = super().step(actions)\n        if getattr(self, \"tsil_enabled\", False):\n            self._record_tsil_transition()\n        if getattr(self, \"sgs_enabled\", False):\n            self._sgs_pending_done.copy_(self.reset_buf.bool())\n            self._print_sgs_success_rates()\n\n        pred_lift = actions[...,-1] > 0\n        if self.pred_success and (actions.shape[-1] == (self.action_space.shape[-1]+1)):\n            pred_true = (self.lifted_now == pred_lift)\n            self.predlift_success_counter = torch.where(pred_true, self.predlift_success_counter + 1, self.predlift_success_counter)\n\n        ####### obeserve the velocity ###############\n        # _rb_states = self.gym.acquire_rigid_body_state_tensor(self.sim)\n        # rb_states = gymtorch.wrap_tensor(_rb_states)\n        ####################################################\n        \n        return res\n    \n    def check_termination(self):\n        super().check_termination()\n\n        # One grasp/lift definition for shaping, holding and evaluation.\n        cube_height = self._cube_root_states[:, 2]\n        box_pos = self._cube_root_states[:, :3]\n        d1 = torch.norm(box_pos - self.ee_pos, dim=-1)\n        self.lifted_now[:] = lifted_grasp_mask(\n            cube_height, self.table_heights, self.init_height, d1,\n            (self.actions[:, 6] if self.continuous_gripper else\n             (self.actions[:, 6] >= 0).to(self.actions.dtype)), self.lifted_success_threshold)\n        self.lifted_object[:] = self.lifted_now\n\n        z_cube = self._cube_root_states[:, 2]\n        # cube_falls = (z_cube < (self.table_heights + 0.03 / 2 - 0.05))\n        cube_falls = z_cube+0.015 < self.table_heights # Fall or model glitch\n        self._terminate_buf[:] |= cube_falls\n        \n        if self.enable_camera and self.cfg[\"env\"].get(\"cameraVisibilityReset\", True):\n            robot_head_dir = quat_apply(self.base_yaw_quat, torch.tensor([1., 0., 0.], device=self.device).repeat(self.num_envs, 1))\n            cube_dir = self._cube_root_states[:, :3] - self._robot_root_states[:, :3]\n            cube_dir[:, 2] = 0\n            cube_dir = cube_dir / torch.norm(cube_dir, dim=-1).unsqueeze(-1)\n            # check if dot product is negative\n            deviate_much = torch.sum(robot_head_dir * cube_dir, dim=-1) < 0. \n            fov_camera_pos = self._robot_root_states[:, :3] + quat_apply(self._robot_root_states[:, 3:7], torch.tensor(self.cfg[\"sensor\"][\"onboard_camera\"][\"position\"], device=self.device).repeat(self.num_envs, 1))\n            too_close_table = (fov_camera_pos[:, 0] > 0.)\n            \n            self._terminate_buf[:] |= deviate_much | too_close_table\n\n        # Resolve hard failures before awarding success, including the yaw limit.\n        self._terminate_buf[:] |= self._yaw_deviation() > np.deg2rad(70.0)\n        self.reset_buf[:] |= self._terminate_buf\n        count, best_count, progress, success = advance_pick_hold(\n            self.lifted_object, self._terminate_buf.bool(), self.pick_counter,\n            self.best_pick_counter, self.pick_success_recorded, self.hold_steps)\n        self.pick_counter[:] = count\n        self.best_pick_counter[:] = best_count\n        self.pick_hold_progress[:] = progress\n        self.pick_success[:] = success\n        self.pick_success_recorded |= success\n        self.success_counter[success] += 1\n        self.success_onetime_counter[success & self.surpass_dist_flag] += 1\n        self.reset_buf[:] |= self.pick_success_recorded\n        # The last allowed step may complete the task. Hard failures still win.\n        self.timeout_buf[:] &= ~(self.pick_success_recorded | self._terminate_buf.bool())\n\n    # --------------------------------- reward functions ---------------------------------\n    \n    def _yaw_deviation(self):\n        yaw = euler_from_quat(self._robot_root_states[:, 3:7])[2]\n        return torch.abs(yaw - self.initial_yaw_z)\n\n    def _reward_limit_yaw_rotation_penalty(self):\n        delta_yaw = self._yaw_deviation()\n        reward = torch.where(delta_yaw > np.deg2rad(60.0),\n                             -torch.tanh(delta_yaw), torch.zeros_like(delta_yaw))\n        return reward, reward\n\n    # def _reward_gripper_grasp_expect_reward(self):\n    #     reward = torch.zeros(self.num_envs, device=self.device, dtype=torch.float)\n    #     mask = self.curr_dist < 0.1\n    #     torch.abs(self._cube_root_states[:, 8]) > 0.1\n    #     return reward,reward\n\n    # def _reward_standpick(self):    # for when the ee approach the cube and encourage the robot to stand statically to grasp, but may not be suitable for aynamic grasping\n    #     reward = torch.zeros(self.num_envs, device=self.device, dtype=torch.float)\n    #     reward[(self.base_obj_dis < self.base_object_distace_threshold) & (self.commands[:, 0] < LIN_VEL_X_CLIP)] = 1.0\n    #     if self.global_step_counter < self.train_reward_strict:\n    #         reward = 0.\n    #     return reward, reward\n    \n    def _reward_grasp_base_height(self):\n        reward, _ = self._reward_base_height()\n        # Repeating an interrupted hold must not earn its shaping reward again.\n        reward *= self.pick_hold_progress\n        \n        return reward, reward\n    \n    def _reward_approaching(self):\n        \"\"\"Reward approaching until the object is grasped at the target height.\"\"\"\n        reward, _ = super()._reward_approaching()\n        reward *= ~self.lifted_object\n        return reward, reward\n    \n    def _reward_base_approaching(self):\n        rew, _ = super()._reward_base_approaching(self._cube_root_states[:, :3])\n        return rew, rew\n    \n    def _reward_command_reward(self):\n        rew, _ = super()._reward_command_reward(self._cube_root_states[:, :3])\n        return rew, rew\n    \n    # def _reward_command_penalty(self):\n    #     rew, _ = super()._reward_command_penalty(self._cube_root_states[:, :3])\n    #     return rew, rew\n    \n    def _reward_ee_orn(self):\n        rew, _ = super()._reward_ee_orn(self._cube_root_states[:, :3])\n        return rew, rew\n    \n    def _reward_base_dir(self):\n        rew, _ = super()._reward_base_dir(self._cube_root_states[:, :3])\n        return rew, rew\n    \n    # --------------------------------- reward functions ---------------------------------\n    \n\n\n# --------------------------------- jit functions ---------------------------------\n\n@torch.jit.script\ndef compute_robot_observations(robot_root_state, table_root_state, cube_root_state, body_pos, \n                               body_rot, body_vel, body_ang_vel, dof_pos, dof_vel, base_quat_yaw, spherical_center, commands, gripper_idx, table_dim, \n                               ee_goal_cart, ee_goal_orn_rpy, ee_goal_global_cart, ee_goal_orn_quat, use_roboinfo, floating_base) :\n    # type: (Tensor, Tensor, Tensor, Tensor, Tensor, Tensor, Tensor, Tensor, Tensor, Tensor, Tensor, Tensor, int, Tensor, Tensor, Tensor, Tensor, Tensor,bool, bool) ->  torch.Tensor\n    cube_pos = cube_root_state[:, :3]\n    cube_orn = cube_root_state[:, 3:7]\n    cube_rpy = torch.stack(euler_from_quat(cube_orn), dim=-1) # rot-squen: x-y-z\n    cube_vel = cube_root_state[:, 7:10]\n    cube_angular = cube_root_state[:, 10:]\n    car_mainbody_vel = table_root_state[:, 7:10]\n    car_mainbody_angular = table_root_state[:, 10:]\n    \n    ee_pos = body_pos[..., gripper_idx, :]\n    ee_rot = body_rot[..., gripper_idx, :]\n    ee_vel = body_vel[..., gripper_idx, :]\n    ee_ang_vel = body_ang_vel[..., gripper_idx, :]\n    # box pos and orientation  3+4=7\n    # dof pos + vel  6+6=12\n    # ee state  13\n    if use_roboinfo:\n        dof_pos = dof_pos[..., :]\n        dof_vel = dof_vel[..., :-1] * 0.05\n        if not floating_base:\n            dof_pos = reindex_all(dof_pos)\n            dof_vel = reindex_all(dof_vel)\n    else:\n        dof_pos = dof_pos[..., 12:-1] # arm_dof_pos\n        dof_vel = dof_vel[..., 12:-1] # arm_dof_vel\n    \n    base_quat = robot_root_state[:, 3:7]\n    arm_base_local = torch.tensor([0.3, 0.0, 0.09], device=robot_root_state.device).repeat(robot_root_state.shape[0], 1) ## have to change if change robot model\n    arm_base = quat_apply(base_quat, arm_base_local) + robot_root_state[:, :3]\n    \n    object_pose_obs = object_pose_in_teacher_frame(cube_pos, cube_orn, arm_base, base_quat_yaw)\n    cube_pos_local = object_pose_obs[:, :3]\n    cube_orn_local_rpy = object_pose_obs[:, 3:]\n    cube_vel_local = quat_rotate_inverse(base_quat_yaw, cube_vel)\n    cube_angular_local = quat_rotate_inverse(base_quat_yaw, cube_angular) \n    car_mainbody_vel_local = quat_rotate_inverse(base_quat_yaw, car_mainbody_vel)\n    car_mainbody_angular_local = quat_rotate_inverse(base_quat_yaw, car_mainbody_angular)\n    car_mainbody_vel_local[...,0] = -car_mainbody_vel[...,1]\n    car_mainbody_vel_local[...,1] = car_mainbody_vel[...,0]\n    car_mainbody_angular_local[...,0] = -car_mainbody_angular[...,1]\n    car_mainbody_angular_local[...,0] = car_mainbody_angular[...,0]\n    \n    table_pos_local = quat_rotate_inverse(base_quat_yaw, table_root_state[:, :3] - spherical_center)\n    table_orn_local = quat_mul(quat_conjugate(base_quat_yaw), table_root_state[:, 3:7])\n    table_dim_local = quat_rotate_inverse(base_quat_yaw, table_dim)\n\n    ee_pos_local = quat_rotate_inverse(base_quat, ee_pos - arm_base)\n    ee_rot_local = quat_mul(quat_conjugate(base_quat), ee_rot)\n    ee_rot_local_rpy = torch.stack(euler_from_quat(ee_rot_local), dim=-1)\n    \n    robot_vel_local = quat_rotate_inverse(base_quat_yaw, robot_root_state[:, 7:10])\n    cube_vel_local = cube_vel_local - robot_vel_local\n    cube_vel_local = cube_vel_local[...,:2]\n    \n    obs = torch.cat((cube_pos_local, cube_orn_local_rpy, ee_pos_local, ee_rot_local_rpy, dof_pos, dof_vel,\n                     commands, ee_goal_cart, ee_goal_orn_rpy, robot_vel_local ,cube_vel_local ,cube_pos, cube_rpy), dim=-1) ## 61 + 6\n    obs_have_cube_vel = torch.cat((cube_pos_local, cube_orn_local_rpy, car_mainbody_vel_local, car_mainbody_angular_local, ee_pos_local, ee_rot_local_rpy, dof_pos, dof_vel,\n                     commands, ee_goal_cart, ee_goal_orn_rpy, robot_vel_local), dim=-1) # if have robo_info: have total 67 dim, if not, have 67-24 dim\n\n    return obs\n","sha256":"8217dab4fd291efdc6910927575497563216439aaac91fbf9527c19127feab90"},"DQ_high-level/train_multistate_DQ_teacher.py":{"text":"from isaacgym import gymapi\nfrom isaacgym import gymtorch\nfrom isaacgym.torch_utils import *\n\nimport numpy as np\nfrom copy import deepcopy\nimport torch\nimport os\nimport json\nimport re\nfrom pathlib import Path\nfrom termcolor import cprint\nimport torch.nn as nn\nfrom skrl.models.torch import Model, DeterministicMixin\nfrom skrl.memories.torch import RandomMemory\nfrom skrl.agents.torch.ppo import PPO, PPO_DEFAULT_CONFIG\nfrom skrl.resources.preprocessors.torch import RunningStandardScaler\nfrom skrl.resources.schedulers.torch import KLAdaptiveRL\nfrom skrl.trainers.torch import SequentialTrainer\nfrom skrl.utils import set_seed\n\nfrom envs import *    #import b1z1_pickmulti.py\nfrom PredictPiontTransform.predictpoint_mul import PredictPoint\nfrom utils.config import (load_cfg, get_params, copy_cfg, configure_teacher_experiment,\n                          teacher_run_end, apply_pose_prediction_config)\nimport utils.wrapper as wrapper\nimport time\nfrom legged_gym.envs.manip_loco.b1z1_config import B1Z1RoughCfg\nfrom modules.predictattention import PredictAttentionSelector\nfrom utils.tsil_checkpoint import (TemporalCheckpointMetadata, read_temporal_checkpoint,\n                                   restore_temporal_arguments)\nfrom utils.gripper_policy import ContinuousGripperGaussianMixin\nfrom utils.gripper_control import GRIPPER_ACTION_MODE\n\n\ndef checkpoint_step(path, required=False):\n    match = re.search(r\"_(\\d+)\\.pt$\", str(path))\n    if match:\n        return int(match.group(1))\n    if required:\n        raise ValueError(\"Training resume requires a numbered agent_<step>.pt checkpoint\")\n    return 0\n\n\ndef restore_eval_arguments(args):\n    \"\"\"Use the saved observation/control flags when evaluating a new-format run.\"\"\"\n    run_dir = Path(args.checkpoint).resolve().parent.parent\n    metadata_path = run_dir / \"teacher_run.json\"\n    if not metadata_path.is_file():\n        return\n    with metadata_path.open() as stream:\n        metadata = json.load(stream)\n    saved = metadata.get(\"arguments\", {})\n    for name in (\"roboinfo\", \"observe_gait_commands\", \"small_value_set_zero\", \"no_feature\",\n                 \"mask_arm\", \"pitch_control\", \"rand_control\", \"arm_delay\", \"rand_cmd_scale\",\n                 \"rand_depth_clip\", \"stop_pick\", \"use_tanh\", \"last_commands\", \"no_velocity_obs\"):\n        if name in saved:\n            setattr(args, name, saved[name])\n\n\ndef teacher_config_path(args, is_eval=False, strict_eval=False):\n    if args.cfg_file:\n        return args.cfg_file\n    if is_eval and args.checkpoint:\n        run_dir = Path(args.checkpoint).resolve().parent.parent\n        metadata_path = run_dir / \"teacher_run.json\"\n        if metadata_path.is_file():\n            with metadata_path.open() as stream:\n                config_name = json.load(stream).get(\"config_file\", \"DQ_teacher.yaml\")\n            candidate = run_dir / Path(config_name).name\n            if candidate.is_file():\n                return str(candidate)\n        candidate = run_dir / \"DQ_teacher.yaml\"\n        if candidate.is_file():\n            return str(candidate)\n    if strict_eval:\n        raise ValueError(\"No saved teacher YAML found beside the checkpoint; specify --cfg_file explicitly\")\n    return \"data/cfg/DQ_teacher.yaml\"\n\ndef create_env(cfg, args, camera_6p_tensor, grasp_cv_tensor, cube_init_tensor ):\n    apply_pose_prediction_config(cfg, args)\n    cfg[\"env\"][\"gripperActionMode\"] = GRIPPER_ACTION_MODE\n    cfg_terrain = B1Z1RoughCfg()\n\n    cfg[\"env\"][\"enableDebugVis\"] = args.debugvis\n    cfg[\"env\"][\"cameraMode\"] = \"full\"\n    cfg[\"env\"][\"smallValueSetZero\"] = args.small_value_set_zero\n    if args.last_commands:\n        cfg[\"env\"][\"lastCommands\"] = True\n    if args.record_video:\n        cfg[\"record_video\"] = True\n    if args.control_freq is not None:\n        cfg[\"env\"][\"controlFrequencyLow\"] = int(args.control_freq)\n    robot_start_pose = (-2.00, 0, 0.55)\n    if args.eval:\n        robot_start_pose = (-0.85, 0, 0.55)\n    # _env is actually an instance of an environment class, the name of which is determined by args.task.\n    # _env is the entity of the B1Z1Pickmulti \n    _env = eval(args.task)(cfg=cfg, rl_device=args.rl_device, sim_device=args.sim_device, \n                         graphics_device_id=args.graphics_device_id, headless=args.headless, \n                         use_roboinfo=args.roboinfo, observe_gait_commands=args.observe_gait_commands, no_feature=args.no_feature, mask_arm=args.mask_arm, pitch_control=args.pitch_control,\n                         rand_control=args.rand_control, arm_delay=args.arm_delay, robot_start_pose=robot_start_pose,\n                         rand_cmd_scale=args.rand_cmd_scale, rand_depth_clip=args.rand_depth_clip, stop_pick=args.stop_pick, table_height=args.table_height, eval=args.eval,\n                         camera_6p_tensor=camera_6p_tensor, grasp_cv_tensor=grasp_cv_tensor, cube_init_tensor=cube_init_tensor, cfg_terrain = cfg_terrain)\n    # the step under is just to add some property to _env , just a small extension of _env(B1Z1PickMulti class)\n    wrapped_env = wrapper.IsaacGymPreview3Wrapper(_env)\n    return wrapped_env\n\n# define models (stochastic and deterministic models) using mixins\nclass Policy(ContinuousGripperGaussianMixin, Model, PredictAttentionSelector):\n    def __init__(self, observation_space, action_space, device, num_features, encode_dim, camera_6p_tensor, grasp_cv_tensor, cube_init_tensor,\n                  use_tanh=False, clip_actions=False,\n                 clip_log_std=True, min_log_std=-20, max_log_std=2, reduction=\"sum\", deterministic=False):\n        Model.__init__(self, observation_space, action_space, device)\n        # The selector initializes nn.Module again. Construct it before the\n        # policy mixin registers checkpoint/entropy buffers, or they are lost.\n        PredictAttentionSelector.__init__(self, d_model=64)\n        transform_func = torch.distributions.transforms.TanhTransform() if use_tanh else None\n        ContinuousGripperGaussianMixin.__init__(self, clip_actions, clip_log_std, min_log_std, max_log_std, reduction, transform_func=transform_func, deterministic=deterministic)\n\n        self.to(device)\n        self.num_features = num_features # 1024\n        self.encode_dim = encode_dim # 128\n        self.cube_object_num = 30  # Candidate grasps per object, not the number of object assets.\n        self.notrain_obs_num = 3*self.cube_object_num + 3*self.cube_object_num # 30 cube's pos + rpy feature_num\n        \n        if num_features > 0:\n            self.feature_encoder = nn.Sequential(nn.Linear(self.num_features, 512), # input : (envs,1024), output : (envs,512)\n                                                  nn.ELU(),\n                                                  nn.Linear(512, self.encode_dim),) # input : (envs,512), output : (envs,128)\n        self.net = nn.Sequential(nn.Linear(self.num_observations - self.num_features + self.encode_dim - self.notrain_obs_num + 6, 512), \n                            nn.ELU(),\n                            nn.Linear(512, 256),\n                            nn.ELU(),\n                            nn.Linear(256, 128),\n                            nn.ELU(),\n                            nn.Linear(128, self.num_actions)\n                            )\n        cprint(f\"self.num_observations is {self.num_observations}\", \"yellow\")\n\n        self.log_std_parameter = nn.Parameter(torch.zeros(self.num_actions))\n\n    def compute(self, inputs, role):\n        grasp_predict_local_pos_flat = inputs[\"states\"][...,-6*self.cube_object_num-9:-3*self.cube_object_num-9]\n        grasp_predict_local_rpy_flat = inputs[\"states\"][...,-3*self.cube_object_num-9:-9]\n        grasp_predict_local_pos = grasp_predict_local_pos_flat.view(-1, self.cube_object_num, 3)\n        grasp_predict_local_rpy = grasp_predict_local_rpy_flat.view(-1, self.cube_object_num, 3)\n        grasp_predict_local = torch.cat([grasp_predict_local_pos,grasp_predict_local_rpy],dim=-1)\n        cube_local_pos_rpy = inputs[\"states\"][...,self.num_features:self.num_features+6]\n        last_action = inputs[\"states\"][...,-9:]\n\n        if self.num_features > 0:\n            features_encode = self.feature_encoder(inputs[\"states\"][..., :self.num_features]) # input : (envs,1024), output : (envs,128)\n            right_predict_point = self.attention_forward(grasps=grasp_predict_local,obj_feat=features_encode,pose=cube_local_pos_rpy)\n            actions = self.net(torch.cat([inputs[\"states\"][..., self.num_features:-self.notrain_obs_num-9],last_action , features_encode,right_predict_point], dim=-1)) # dim = 70+128? 意思就是先提取点云特征的encoder维度，然后再和后面70维度的其他本体观察值合并\n        else:\n            actions = self.net(inputs[\"states\"])\n        return actions, self.log_std_parameter, {}\n\nclass Value(DeterministicMixin, Model, PredictAttentionSelector):\n    def __init__(self, observation_space, action_space, device, num_features, encode_dim, camera_6p_tensor, grasp_cv_tensor, cube_init_tensor):\n        Model.__init__(self, observation_space, action_space, device)\n        DeterministicMixin.__init__(self)\n        PredictAttentionSelector.__init__(self, d_model=64)\n\n        self.to(device)\n\n        self.num_features = num_features # 1024\n        self.encode_dim = encode_dim # 128\n        self.cube_object_num = 30  # Candidate grasps per object, not the number of object assets.\n        self.notrain_obs_num = 3*self.cube_object_num + 3*self.cube_object_num # 30 cube's pos + rpy feature_num\n        \n        if num_features > 0:\n            self.feature_encoder = nn.Sequential(nn.Linear(self.num_features, 512), # input : (envs,1024), output : (envs,512)\n                                                  nn.ELU(),\n                                                  nn.Linear(512, self.encode_dim),) # input : (envs,512), output : (envs,128)\n        self.net = nn.Sequential(nn.Linear(self.num_observations - self.num_features + self.encode_dim - self.notrain_obs_num + 6, 512), # self.num_observations = 1094\n                            nn.ELU(),\n                            nn.Linear(512, 256),\n                            nn.ELU(),\n                            nn.Linear(256, 128),\n                            nn.ELU(),\n                            nn.Linear(128, 1))\n        \n\n        self.log_std_parameter = nn.Parameter(torch.zeros(self.num_actions))\n\n    def compute(self, inputs, role):\n        grasp_predict_local_pos_flat = inputs[\"states\"][...,-6*self.cube_object_num-9:-3*self.cube_object_num-9]\n        grasp_predict_local_rpy_flat = inputs[\"states\"][...,-3*self.cube_object_num-9:-9]\n        grasp_predict_local_pos = grasp_predict_local_pos_flat.view(-1, self.cube_object_num, 3)\n        grasp_predict_local_rpy = grasp_predict_local_rpy_flat.view(-1, self.cube_object_num, 3)\n        grasp_predict_local = torch.cat([grasp_predict_local_pos,grasp_predict_local_rpy],dim=-1)\n        cube_local_pos_rpy = inputs[\"states\"][...,self.num_features:self.num_features+6]\n        last_action = inputs[\"states\"][...,-9:]\n\n        if self.num_features > 0:\n            features_encode = self.feature_encoder(inputs[\"states\"][..., :self.num_features]) # input : (envs,1024), output : (envs,128)\n            right_predict_point = self.attention_forward(grasps=grasp_predict_local,obj_feat=features_encode,pose=cube_local_pos_rpy)\n            actions = self.net(torch.cat([inputs[\"states\"][..., self.num_features:-self.notrain_obs_num-9],last_action , features_encode,right_predict_point], dim=-1)) \n            return actions, {}        \n        else:\n            return self.net(inputs[\"states\"]), {}\n\n\ndef get_predict_point(camera_6p_info=None, cube_predict_info_path=None, cube_root_states_info_path=None, num_env=None, intervel=None, delta_height=None, object_indices=None):\n    import json\n    import os\n    import torch\n    import numpy as np\n    from scipy.spatial.transform import Rotation as R\n\n    curr_dir = os.getcwd()\n    data_dir = os.path.join(curr_dir,\"PredictPiontTransform\" , \"transform_info\")\n    cube_root_states_info_path = os.path.join(data_dir, cube_root_states_info_path)\n\n    # load cubes's states（position + quaternion + velocity...）\n    cube_states = torch.load(cube_root_states_info_path, map_location=\"cpu\")[0]\n    if object_indices is None:\n        object_indices = list(range(cube_states.shape[0]))\n    if not object_indices or any(i < 0 or i >= cube_states.shape[0] for i in object_indices):\n        raise ValueError(f\"Object dict_idx values must be in [0, {cube_states.shape[0] - 1}]\")\n    # Keep initial poses and grasp predictions in the same order as asset_multi.\n    cube_states = cube_states[object_indices]\n    cprint(f\"cube_states.shape is {cube_states.shape}\", \"yellow\")\n\n    cube_pos = cube_states[:, :3]\n    cube_quat = cube_states[:, 3:7]\n    cube_rpy = torch.tensor(R.from_quat(cube_quat.numpy()).as_euler('xyz'))  # turn to RPY\n    cube_init_tensor = torch.cat([cube_pos, cube_rpy], dim=1)\n    cube_init_tensor = cube_init_tensor.to(torch.float32)\n\n    base_n = cube_init_tensor.shape[0]  \n    T_grasp_cv_all = []\n\n    # read base_num sample's all transform\n    for i in object_indices:\n        sample_dir = os.path.join(data_dir, cube_predict_info_path)\n        json_path = os.path.join(sample_dir, f\"predictions_image_{(i):02d}.json\")\n        with open(json_path, 'r') as f:\n            data = json.load(f)\n        grasp_matrices = np.array(data['transform'])  \n        T_grasp_cv_all.append(grasp_matrices)\n\n    # Shape: [number of selected objects, candidate grasps per object, 4, 4].\n    T_grasp_cv_all = np.stack(T_grasp_cv_all, axis=0)\n    n_grasps = T_grasp_cv_all.shape[1]  # get n\n    T_grasp_cv_all = torch.tensor(T_grasp_cv_all, dtype=torch.float32)\n\n    # extent to num_env\n    T_grasp_cv_list = [T_grasp_cv_all[i % base_n] for i in range(num_env)]\n    grasp_cv_tensor = torch.stack(T_grasp_cv_list, dim=0)  # 形状 [num_env, n, 4, 4]\n\n    camera_tensor = []\n    cube_init_list = []\n    cube_init_ori_list = []\n\n    for i in range(num_env):\n        base_idx = i % base_n\n        height_offset = (delta_height / intervel) * ((i % intervel) + 1)\n\n        # the initial pose of the camera, x,y is related to the initial pose of the float base \n        camera_x = -0.3\n        camera_y = 2.0\n        camera_z = 0.80 + height_offset\n        camera_info = [camera_x, camera_y, camera_z, 0.0, 0.70, 0.0]\n        camera_tensor.append([camera_info] * n_grasps)\n\n        cube_init = cube_init_tensor[base_idx].clone()\n        cube_init[2] += height_offset \n        cube_init_list.append([cube_init] * n_grasps)\n        cube_init_ori_list.append(cube_init)\n\n    camera_tensor = torch.tensor(camera_tensor, dtype=torch.float32)  # [num_env, n, 6]\n    cube_init_tensor = torch.stack([torch.stack(cube_init, dim=0) for cube_init in cube_init_list], dim=0)  # [num_env, n, 6]\n    return camera_tensor, grasp_cv_tensor, cube_init_tensor\n\ndef get_trainer(is_eval=False, strict_eval=False, *, enable_logging=True):\n    \"\"\"Build the teacher; probes can disable logging without changing task mode.\n\n    A probe may live inside a training run's directory. It must not create\n    TensorBoard event files there: W&B can treat them as a continuation of\n    the main event stream and stop following the still-active training file.\n    \"\"\"\n    args = get_params()\n    args.eval = is_eval\n    if strict_eval:\n        if not args.checkpoint or args.resume:\n            raise ValueError(\"Strict evaluation requires --checkpoint and does not accept --resume\")\n        restore_eval_arguments(args)\n    temporal_metadata = None\n    if is_eval and args.checkpoint:\n        temporal_metadata = read_temporal_checkpoint(args.checkpoint)\n        if temporal_metadata is not None:\n            restore_temporal_arguments(args, temporal_metadata)\n    set_seed(args.seed)\n    args.wandb = args.wandb and (not args.eval) and (not args.debug) and enable_logging\n    if not is_eval and args.sgs_mode in (\"uniform\", \"sgs\") and (args.resume or args.checkpoint):\n        raise ValueError(\"SGS/uniform-bank training starts from scratch; sampler resume is not implemented\")\n    embedded_config = temporal_metadata is not None and args.cfg_file is None\n    file_path = (\"data/cfg/DQ_teacher.yaml\" if embedded_config else\n                 teacher_config_path(args, is_eval=is_eval, strict_eval=strict_eval))\n    cfg_file = Path(file_path).name\n    \n    if args.resume:\n        experiment_dir = os.path.join(args.experiment_dir, args.wandb_name)\n        checkpoint_dir = os.path.join(experiment_dir, \"checkpoints\")\n        pt_files = os.listdir(checkpoint_dir)\n        pt_files = [file for file in pt_files if file.endswith(\".pt\") and (not file.startswith(\"best\"))]\n        # Find the latest checkpoint\n        checkpoint_steps = 0\n        if len(pt_files) > 0:\n            args.checkpoint = os.path.join(checkpoint_dir, sorted(pt_files, key=lambda x: int(x.split(\"_\")[-1].split(\".\")[0]))[-1])\n            checkpoint_steps = int(args.checkpoint.split(\"_\")[-1].split(\".\")[0])\n        cfg_files = os.listdir(experiment_dir)\n        cfg_files = [file for file in cfg_files if file.endswith(\".yaml\")]\n        if len(cfg_files) > 0 and args.cfg_file is None:\n            cfg_file = cfg_files[0]\n            file_path = os.path.join(experiment_dir, cfg_file)\n        \n        print(\"Find the latest checkpoint: \", args.checkpoint)\n    cprint(f\"Training script: {os.path.realpath(__file__)}\", \"yellow\")\n    cprint(f\"Using config file: {os.path.realpath(file_path)}\", \"red\")\n        \n    cfg = deepcopy(temporal_metadata[\"config\"]) if embedded_config else load_cfg(file_path)\n    configure_teacher_experiment(cfg, args, is_eval=is_eval, strict_eval=strict_eval)\n    if is_eval and cfg[\"env\"][\"tsil\"][\"enabled\"] and temporal_metadata is None:\n        raise ValueError(\"TSIL evaluation requires a checkpoint with matching temporal state and normalization\")\n    prediction_cfg = apply_pose_prediction_config(cfg, args)\n    cprint(f\"Teacher future pose observations: {prediction_cfg}\", \"yellow\")\n    if args.no_velocity_obs:\n        cfg[\"env\"][\"noVelocityObs\"] = True\n    cprint(f\"Teacher velocity observations: {'disabled' if cfg['env'].get('noVelocityObs', False) else 'enabled'}\", \"yellow\")\n    multi_obj = cfg[\"env\"][\"asset\"][\"asset_multi\"]\n    if args.object_name is not None:\n        if args.object_name not in multi_obj:\n            raise ValueError(f\"Unknown --object_name {args.object_name!r}. Available objects: {', '.join(multi_obj)}\")\n        multi_obj = {args.object_name: multi_obj[args.object_name]}\n        cfg[\"env\"][\"asset\"][\"asset_multi\"] = multi_obj\n    object_indices = [obj[\"dict_idx\"] for obj in multi_obj.values()]\n    cprint(f\"Using {len(multi_obj)} object asset(s): {', '.join(multi_obj)}\", \"yellow\")\n    cfg['env']['wandb'] = args.wandb\n    cfg['env'][\"useTanh\"] = args.use_tanh\n    cfg['env'][\"near_goal_stop\"] = args.near_goal_stop\n    cfg['env'][\"obj_move_prob\"] = args.obj_move_prob\n    if args.debug:\n        cfg['env']['numEnvs'] = 34\n        \n    if args.eval:\n        cfg['env']['numEnvs'] = 800 # 34\n        cfg[\"env\"][\"maxEpisodeLength\"] = 100\n        if args.checkpoint:\n            checkpoint_steps = checkpoint_step(args.checkpoint)\n            cfg[\"env\"][\"globalStepCounter\"] = checkpoint_steps\n\n    # Allow the command line to override both the YAML value and the\n    # evaluation default above (800 environments).\n    if args.num_envs is not None:\n        if args.num_envs <= 0:\n            raise ValueError(\"--num_envs must be a positive integer\")\n        cfg[\"env\"][\"numEnvs\"] = args.num_envs\n    if strict_eval:\n        cfg[\"env\"][\"numEnvs\"] = min(cfg[\"env\"][\"numEnvs\"], args.eval_episodes)\n\n    \"\"\"\n    To clarify, when capturing images of each object, the images were taken from a car. \n    The z-height of each environment's car was determined by the intervel. \n    To ensure correct camera pose for each cube,\n    the intervel needed to be aligned here. This is a legacy issue and will not be used further.\n    Since we no longer use the car as a moving base, this intervel has no effect in the subsequent training code; \n    it is only used when initializing the camera pose.\n    \"\"\"\n\n    intervel = 23\n    args.intervel = intervel\n    cube_predict_info_path = \"contact_grasp_info_mul\"\n    cube_root_states_info_path = \"30all_nomove_cube_root_states5.pt\"\n    camera_6p_tensor, grasp_cv_tensor, cube_init_tensor = get_predict_point(cube_predict_info_path=cube_predict_info_path\n                                                                            ,cube_root_states_info_path=cube_root_states_info_path,num_env=cfg['env']['numEnvs'],\n                                                                            intervel=intervel,delta_height=0.1,object_indices=object_indices)\n    env_num = cfg['env']['numEnvs']\n    cprint(f\"env_num is {env_num}\", \"yellow\")\n    # Save the selected assets and overrides before the environment mutates cfg.\n    experiment_cfg = deepcopy(cfg)\n    env = create_env(cfg=cfg, args=args, camera_6p_tensor=camera_6p_tensor, grasp_cv_tensor=grasp_cv_tensor, cube_init_tensor=cube_init_tensor)\n    device = env.rl_device\n    memory = None if is_eval else RandomMemory(memory_size=24, num_envs=env.num_envs, device=device)\n    \n    num_features = 0 if args.no_feature else 1024\n    encode_dim = 0 if args.no_feature else 128\n    models_ppo = {}\n    models_ppo[\"policy\"] = Policy(env.observation_space, env.action_space, device, num_features, encode_dim, camera_6p_tensor, grasp_cv_tensor, cube_init_tensor, use_tanh=args.use_tanh, clip_actions=args.use_tanh, deterministic=args.eval)\n    models_ppo[\"value\"] = Value(env.observation_space, env.action_space, device, num_features, encode_dim, camera_6p_tensor, grasp_cv_tensor, cube_init_tensor)\n    \n    cfg_ppo = deepcopy(PPO_DEFAULT_CONFIG)\n    cfg_ppo[\"rollouts\"] = 24  # memory_size\n    cfg_ppo[\"learning_epochs\"] = 5\n    cfg_ppo[\"mini_batches\"] = 6  # 24 * 8192 / 32768\n    cfg_ppo[\"discount_factor\"] = 0.99\n    cfg_ppo[\"lambda\"] = 0.95\n    cfg_ppo[\"learning_rate\"] = 4.2e-4 ## my change ##\n    cfg_ppo[\"learning_rate_scheduler\"] = KLAdaptiveRL\n    cfg_ppo[\"learning_rate_scheduler_kwargs\"] = {\"kl_threshold\": 0.008}\n    cfg_ppo[\"random_timesteps\"] = 0\n    cfg_ppo[\"learning_starts\"] = 0\n    cfg_ppo[\"grad_norm_clip\"] = 1.0\n    cfg_ppo[\"ratio_clip\"] = 0.2\n    cfg_ppo[\"value_clip\"] = 0.2\n    cfg_ppo[\"clip_predicted_values\"] = True\n    cfg_ppo[\"value_loss_scale\"] = 1.0\n    cfg_ppo[\"kl_threshold\"] = 0\n    cfg_ppo[\"rewards_shaper\"] = None\n    cfg_ppo[\"state_preprocessor\"] = RunningStandardScaler\n    cfg_ppo[\"state_preprocessor_kwargs\"] = {\"size\": env.observation_space, \"device\": device}\n    cfg_ppo[\"value_preprocessor\"] = RunningStandardScaler\n    cfg_ppo[\"value_preprocessor_kwargs\"] = {\"size\": 1, \"device\": device}\n    cfg_ppo[\"tsil\"] = deepcopy(cfg[\"env\"][\"tsil\"])\n    # Log to TensorBoard/W&B every 10 PPO iterations (one rollout per iteration).\n    cfg_ppo[\"experiment\"][\"write_interval\"] = 10 * cfg_ppo[\"rollouts\"]\n    cfg_ppo[\"experiment\"][\"steps_per_iteration\"] = cfg_ppo[\"rollouts\"]\n    env._env.sgs_log_interval = cfg_ppo[\"experiment\"][\"write_interval\"]\n    cfg_ppo[\"experiment\"][\"checkpoint_interval\"] = 5000 ## my change\n    if is_eval or not enable_logging:\n        cfg_ppo[\"experiment\"][\"write_interval\"] = 0\n        cfg_ppo[\"experiment\"][\"checkpoint_interval\"] = 0\n    cfg_ppo[\"experiment\"][\"directory\"] = args.experiment_dir\n    cfg_ppo[\"experiment\"][\"experiment_name\"] = args.wandb_name\n    cfg_ppo[\"experiment\"][\"wandb\"] = args.wandb\n    if args.wandb:\n        cfg_ppo[\"experiment\"][\"wandb_kwargs\"] = {\"project\": args.wandb_project, \"sync_tensorboard\": True, \"name\": args.wandb_name}\n        # cfg_ppo[\"experiment\"][\"wandb_kwargs\"][\"resume\"] = True\n        \n    agent_class, agent_kwargs = PPO, {}\n    if cfg[\"env\"][\"tsil\"][\"enabled\"]:\n        from utils.tsil_ppo import TSILPPO\n        agent_class, agent_kwargs = TSILPPO, {\"tsil_env\": env._env}\n    elif not is_eval and cfg[\"env\"][\"world_model\"][\"mode\"] != \"off\":\n        from utils.wm_ppo import WorldModelPPO\n        agent_class, agent_kwargs = WorldModelPPO, {\n            \"wm_env\": env._env, \"wm_config\": cfg[\"env\"][\"world_model\"]}\n    agent = agent_class(models=models_ppo,\n            memory=memory,\n            cfg=cfg_ppo,\n            observation_space=env.observation_space,\n            action_space=env.action_space,\n            device=device, **agent_kwargs)\n    if hasattr(agent, \"wm_candidate\"):\n        from utils.wm_entry import install_probe_callback\n        agent.wm_teacher_config = deepcopy(experiment_cfg)\n        agent.wm_teacher_arguments = dict(vars(args))\n        install_probe_callback(agent, Path(args.experiment_dir) / args.wandb_name, args.seed)\n        cprint(\"World model: {} on {}, state={}, replay={:.1f} MiB\".format(\n            agent.wm_config[\"mode\"], agent.device, agent.wm_adapter.state_dim,\n            agent.wm_replay.memory_bytes / 2**20), \"yellow\")\n    if cfg[\"env\"][\"tsil\"][\"enabled\"]:\n        agent.checkpoint_modules[\"tsil_metadata\"] = TemporalCheckpointMetadata(\n            experiment_cfg, args, env.observation_space.shape[0], env.tsil_time_reference)\n    \n    # Keep the trainer's rendering setting consistent with the environment.\n    # When --headless is omitted, SKRL must call env.render() so the Isaac Gym\n    # viewer remains visible and responsive during evaluation.\n    cfg_trainer = {\"timesteps\": args.timesteps, \"headless\": args.headless}\n    if args.checkpoint:\n        print(\"Loading checkpoint: \", args.checkpoint)\n        agent.load(args.checkpoint)\n        checkpoint_steps = checkpoint_step(args.checkpoint, required=not is_eval)\n        if args.record_video:\n            experiment_dir = args.checkpoint.split(\"/\")[0]\n            wandb_name = args.checkpoint.split(\"/\")[1]\n            cfg_trainer[\"video_name\"] = wandb_name +\"-\"+str(checkpoint_steps)\n            cfg_trainer[\"log_dir\"] = experiment_dir\n            cfg_trainer[\"record_video\"] = True\n        if not args.eval:\n            cfg_trainer[\"initial_timestep\"] = checkpoint_steps\n            agent.set_running_mode(\"eval\")\n    if not is_eval:\n        cfg_trainer[\"timesteps\"] = teacher_run_end(\n            args.timesteps, cfg_trainer.get(\"initial_timestep\", 0), args.stop_after)\n    \n    trainer = SequentialTrainer(cfg=cfg_trainer, env=env, agents=agent)\n    trainer.teacher_args = args\n    trainer.teacher_config = experiment_cfg\n    if args.wandb:\n        import wandb\n        wandb.save(file_path, policy=\"now\")\n        wandb.save(\"envs/b1z1_\" + args.task[4:].lower() + \".py\", policy=\"now\")\n        wandb.save(\"train_multistate_DQ_teacher.py\", policy=\"now\")\n    if not args.eval:\n        if not os.path.exists(os.path.join(args.experiment_dir, args.wandb_name, cfg_file)):\n            copy_cfg(file_path, os.path.join(args.experiment_dir, args.wandb_name), cfg=experiment_cfg)\n        metadata_path = Path(args.experiment_dir) / args.wandb_name / \"teacher_run.json\"\n        if not metadata_path.exists():\n            metadata_path.parent.mkdir(parents=True, exist_ok=True)\n            with metadata_path.open(\"w\") as stream:\n                json.dump({\"arguments\": vars(args), \"config_file\": cfg_file,\n                           \"planned_timesteps\": args.timesteps,\n                           \"checkpoint_kind\": (\"temporal_teacher_evaluation\" if\n                                               cfg[\"env\"][\"tsil\"][\"enabled\"] else \"model_only\")},\n                          stream, indent=2)\n        if experiment_cfg[\"env\"][\"sgs\"][\"mode\"] != \"disabled\":\n            bank = env.sgs_bank\n            bank_metadata = {\"fingerprint\": bank.fingerprint, \"num_configs\": bank.num_configs,\n                             \"bank_path\": str(Path(experiment_cfg[\"env\"][\"sgs\"][\"bank_path\"]).resolve()),\n                             \"task_hold_steps\": env.hold_steps,\n                             \"hold_compatibility\": env.sgs_hold_compatibility}\n            (metadata_path.parent / \"bank_metadata.json\").write_text(\n                json.dumps(bank_metadata, indent=2) + \"\\n\")\n    \n    return trainer\n\n\ndef finalize_teacher_logging(trainer):\n    \"\"\"Include final reset outcomes, which arrive after the last agent write.\"\"\"\n    env = trainer.env\n    if not getattr(env, \"sgs_enabled\", False):\n        return\n    env._record_sgs_metrics()\n    env._print_sgs_success_rates(force=True)\n    agent = trainer.agents\n    if agent.write_interval > 0:\n        # The main full_task window is recorded at termination; family\n        # diagnostics settle at reset. Flush both latest snapshots together.\n        snapshots = dict(env.extras.get(\"success_rate\", {}))\n        snapshots.update(env.extras.get(\"scalar_snapshots\", {}))\n        for key, value in snapshots.items():\n            agent.track_data_latest(key, value)\n        agent.write_tracking_data(env.global_step_counter, trainer.timesteps)\n        agent.writer.flush()\n\n\nif __name__ == \"__main__\":\n    trainer = get_trainer()\n    try:\n        trainer.train()\n    except KeyboardInterrupt:\n        # Preserve the partial logging window when training is interrupted,\n        # then propagate the interrupt instead of saving a completed run.\n        finalize_teacher_logging(trainer)\n        from utils.wm_entry import save_world_model_artifacts\n        save_world_model_artifacts(trainer)\n        raise\n    finalize_teacher_logging(trainer)\n    from utils.wm_entry import save_world_model_artifacts\n    save_world_model_artifacts(trainer)\n    run_dir = Path(trainer.teacher_args.experiment_dir) / trainer.teacher_args.wandb_name\n    if trainer.teacher_config[\"env\"][\"sgs\"][\"mode\"] != \"disabled\":\n        # Diagnostic history is not a checkpoint for resuming training.\n        trainer.env.save_sgs_diagnostics(str(run_dir / \"sgs_diagnostics.pt\"))\n    if trainer.teacher_args.stop_after is not None:\n        # This is a model checkpoint for smoke evaluation, not a sampler resume.\n        checkpoint_dir = run_dir / \"checkpoints\"\n        checkpoint_dir.mkdir(parents=True, exist_ok=True)\n        trainer.agents.save(str(checkpoint_dir / f\"agent_{trainer.timesteps}.pt\"))\n    \n","sha256":"d0a6890fbfa281cb6e045dcd36fc48a175843d8d80f513d68e7ae2876b0dc73b"},"DQ_high-level/envs/b1z1_base.py":{"text":"import numpy as np\nimport os\nimport torch\nimport cv2\nimport random\nfrom typing import Dict, Any, Tuple, List, Set\nfrom collections import defaultdict\nfrom termcolor import cprint\n\nfrom .reward_vec_task import RewardVecTask\nfrom utils.low_level_model import ActorCritic\nfrom utils.gripper_control import GRIPPER_ACTION_MODE, opening_to_joint, closing_command\n\nfrom isaacgym import gymapi\nfrom isaacgym import gymtorch\nfrom isaacgym import gymutil\nfrom isaacgym.torch_utils import *\nfrom torch import Tensor\nfrom torchvision import transforms\nimport time\nfrom torchvision.utils import save_image\nfrom legged_gym.envs.manip_loco.b1z1_config import B1Z1RoughCfg\nfrom legged_gym.utils.terrain import Terrain, Terrain_Perlin\nfrom .visual_perb import perturb_depth_with_seg,sample_perturbation_params\n\n# LIN_VEL_X_CLIP = 0.15\nLIN_VEL_X_CLIP = 0.15\nANG_VEL_YAW_CLIP = 0.35\nANG_VEL_PITCH_CLIP = 0.35\nGAIT_WAIT_TIME = 35\n\n@torch.jit.script\ndef torch_rand_int(lower, upper, shape, device):\n    # type: (int, int, Tuple[int, int], str) -> Tensor\n    return torch.randint(lower, upper, shape, device=device)\n\nclass AddGaussianNoise(object):\n    def __init__(self, mean=0., std=1.):\n        self.std = std\n        self.mean = mean\n        \n    def __call__(self, tensor):\n        return tensor + torch.randn(tensor.size(), device=tensor.device) * self.std + self.mean\n    \n    def __repr__(self):\n        return self.__class__.__name__ + '(mean={0}, std={1})'.format(self.mean, self.std)\n\nclass B1Z1Base(RewardVecTask):\n    def __init__(self, cfg, rl_device, sim_device, graphics_device_id, headless, \n                 virtual_screen_capture: bool = False, force_render: bool = False, \n                 use_roboinfo: bool = True, observe_gait_commands: bool = True, \n                 no_feature: bool = False, mask_arm: bool = False, depth_random=False,\n                 robot_start_pose: tuple =(-2.00, 0.0, 0.66), stu_distill=False, \n                 commands_curriculum=True, pitch_control=False, pred_success=False,\n                 rand_control=False, arm_delay=False, num_gripper_dof=1, rand_cmd_scale=False,\n                 rand_depth_clip=False, stop_pick=False, eval=False,\n                 *args, **kwargs\n                ):\n        self.cfg = cfg\n        self.floating_base = self.cfg[\"env\"].get(\"floatingBase\", False)\n        self.use_roboinfo = use_roboinfo\n        self.observe_gait_commands = observe_gait_commands and (not self.floating_base)\n        self.no_feature = no_feature\n        self.mask_arm = mask_arm\n        self.num_features = 0\n        self.num_velocity_obs = 5\n        self.num_future_pose_obs = 0\n        self.depth_random = depth_random\n        self.stu_distill = stu_distill\n        self.commands_curriculum = commands_curriculum\n        self.pitch_control = pitch_control\n        self.pred_success = pred_success\n        self.rand_control = rand_control\n        self.arm_delay = arm_delay\n        self.num_gripper_dof = num_gripper_dof\n        self.continuous_gripper = self.cfg[\"env\"].get(\"gripperActionMode\") == GRIPPER_ACTION_MODE\n        self.rand_cmd_scale = rand_cmd_scale\n        self.rand_depth_clip = rand_depth_clip\n        self.stop_pick = stop_pick\n        self.eval = eval\n        ##### my add #####\n        self.camera_test = False\n        self.one_img_features = self.cfg[\"sensor\"][\"onboard_camera\"][\"resolution\"][1] * self.cfg[\"sensor\"][\"onboard_camera\"][\"resolution\"][0] * 4\n        self.one_img_features_1_ch = self.cfg[\"sensor\"][\"onboard_camera\"][\"resolution\"][1] * self.cfg[\"sensor\"][\"onboard_camera\"][\"resolution\"][0] \n        self.two_img_features = self.cfg[\"sensor\"][\"onboard_camera\"][\"resolution\"][1] * self.cfg[\"sensor\"][\"onboard_camera\"][\"resolution\"][0] * 8\n        self.car_dofs_num = 4\n        self.i=0\n        self.k = 0\n        self.collect_dataset_flag=0\n        self.data_all_step_num = 2000\n        self.step_forward_record_num = 0\n        self.all_steps_data = []\n        self.frame_list = []\n        self.cube_root_states_list = []\n        self.wrist_depth_img_buf_list = []\n        self.wrist_seg_img_buf_list = []\n        self.action_data_history_buf_list = []\n        self.states_history_buf_list = []\n        self.last_table_x_lin_pose = 0\n        self.camera_history_len = 3\n        self.table_level = \"Level01\"\n        self.table_level = self.cfg[\"env\"][\"D1_bench_task_level\"]\n        cprint(f\"[ DQ_Bench ] Task_Level : {self.table_level} !\", \"red\")\n        self.random_forces_value_max = 7.2\n        self.random_forces_value_min = 3.6\n        self.forces_xyz_index = 1\n\n        self.num_torques = 18\n        if sim_device == \"cpu\":\n            self.sim_id = 0\n        else:\n            self.sim_id = int(sim_device.split(\":\")[1])\n            self.graph_device = 5\n        \n        self.debug_vis = self.cfg[\"env\"][\"enableDebugVis\"]\n        self.camera_mode = self.cfg[\"env\"][\"cameraMode\"]\n        print(\"camera mode is\", self.camera_mode)\n        self.plane_static_friction = self.cfg[\"env\"][\"plane\"][\"staticFriction\"]\n        self.plane_dynamic_friction = self.cfg[\"env\"][\"plane\"][\"dynamicFriction\"]\n        self.plane_restitution = self.cfg[\"env\"][\"plane\"][\"restitution\"]\n        self.max_episode_length = self.cfg[\"env\"][\"maxEpisodeLength\"]\n        self.control_freq_low_init = self.cfg[\"env\"].get(\"controlFrequencyLow\", 7)\n        self.control_freq_low = self.control_freq_low_init\n        self.hold_steps = self.cfg[\"env\"].get(\"holdSteps\", 10)\n        if isinstance(self.hold_steps, bool) or not isinstance(self.hold_steps, int) or self.hold_steps < 1:\n            raise ValueError(\"holdSteps must be a positive integer\")\n        self.success_mode = self.cfg[\"env\"].get(\"successMode\", \"legacy\")\n        if self.success_mode not in (\"legacy\", \"hold\"):\n            raise ValueError(\"successMode must be legacy or hold\")\n        self.img_delay_frame = self.cfg[\"env\"].get(\"imgDelayFrame\", 5) # 0.08s5\n        self.enable_camera = self.cfg[\"sensor\"].get(\"enableCamera\", False)\n        self.depth_clip_lower = self.cfg[\"sensor\"].get(\"depth_clip_lower\", 0.15)\n        self.depth_clip_rand_range = self.cfg[\"sensor\"].get(\"depth_clip_rand_range\", [0.18, 0.25])\n        \n\n        if (self.enable_camera or self.camera_test) and self.img_delay_frame:\n            assert self.img_delay_frame <= self.control_freq_low, \"control_freq_low < img_delay_frame, may have bug when get imgs\"\n        if self.enable_camera or self.camera_test:\n            self.resize_transform = transforms.Resize((self.cfg[\"sensor\"][\"resized_resolution\"][1], self.cfg[\"sensor\"][\"resized_resolution\"][0]))\n        if (self.enable_camera or self.camera_test) and self.cfg[\"env\"][\"numEnvs\"] > 40:\n            self.cfg[\"env\"][\"numEnvs\"] = self.cfg[\"env\"][\"numEnvs\"]\n            if self.depth_random:\n                self.cfg[\"env\"][\"numEnvs\"] = 300\n            if self.camera_mode == \"seperate\":\n                self.cfg[\"env\"][\"numEnvs\"] = 240\n            print(\"camera_num_envs is\",cfg[\"env\"][\"numEnvs\"])\n            \n        self.robot_start_pose = robot_start_pose\n        self.robot_start_distance_range = self.cfg[\"env\"].get(\"robotStartDistanceRange\")\n\n        self._extra_env_settings()\n        \n        self._setup_obs_and_action_info()\n        \n        self.reward_scales = self.cfg[\"reward\"][\"scales\"]\n        \n        self.randomize = False\n        \n        super().__init__(cfg, rl_device, sim_device, graphics_device_id, headless, virtual_screen_capture=virtual_screen_capture, force_render=force_render, *args, **kwargs)\n        \n        if not self.floating_base:\n            self.low_level_policy = self._load_low_level_model()\n        else:\n            self.num_gripper_joints = 1\n        \n        self._prepare_reward_function()\n        \n        self.dt = self.control_freq_inv * self.sim_params.dt\n        \n        self._init_tensors()\n        self.global_step_counter = cfg[\"env\"].get(\"globalStepCounter\", 0)\n        self.local_step_counter = 0\n        \n        if self.viewer is not None:\n            self._init_camera()\n        \n        self.depth_transform = None\n        if self.depth_random:\n            # Random Erase + Gaussian Blur + Gaussian Noise + Random Rotation\n            from torchvision.transforms import v2\n            self.depth_transform = v2.Compose([\n                # v2.RandomAffine(translate=(10,10)),\n                v2.RandomErasing(p=0.4, scale=(0.02, 0.1), ratio=(0.3, 3.3), value=-2, inplace=False),\n                v2.RandomErasing(p=0.4, scale=(0.02, 0.1), ratio=(0.3, 3.3), value=0, inplace=False),\n                v2.GaussianBlur(kernel_size=5, sigma=(0.01, 0.1)),\n                AddGaussianNoise(mean=0, std=0.005),\n                v2.RandomRotation(degrees=5)\n            ])\n            self.mask_transform = v2.Compose([\n                v2.GaussianBlur(kernel_size=5, sigma=(0.01, 0.1)),\n                AddGaussianNoise(mean=0, std=0.01),\n                v2.RandomRotation(degrees=5)\n            ])\n            \n    def render_record(self, mode=\"rgb_array\"):\n        self.gym.step_graphics(self.sim)\n        self.gym.render_all_camera_sensors(self.sim)\n        imgs = []\n        for i in range(self.num_envs):\n            cam = self._rendering_camera_handles[i]\n            root_pos = self._robot_root_states[i, :3].cpu().numpy()\n            cam_pos = root_pos + np.array([0, 2, 0.3
