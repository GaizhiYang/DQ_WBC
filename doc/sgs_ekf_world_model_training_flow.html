构，形状相同不意味着权重共享。\n输出：Actor 的128维对象码与 Critic 的另一份128维对象码，分别进入各自注意力和最终融合。\n抓取例子：Actor 可学习哪些几何信息有助于选接近方向；Critic 可学习哪些信息与后续回报有关。\n注意：真实 PPO 分别更新两套编码权重；BPTT 只更新 Actor 那一套，Critic 编码器冻结。","refs":[["DQ_high-level/train_multistate_DQ_teacher.py",127,130],["DQ_high-level/train_multistate_DQ_teacher.py",173,176],["DQ_high-level/envs/b1z1_pickmulti.py",413,421]],"paper":[["DQ-Net · p4–5 教师 / p11 抓取融合",11,"继承对象编码与抓取注意力；214维、EKF和当前高斯网络设置以源码为准。","dq"]],"branch":"policy","status":"trainable","x":720,"y":0,"formula":"","caution":""},{"id":"p_attention","title":"4. 两套抓取注意力","subtitle":"每个网络独立聚合30个候选","shapes":["Q:134→64","K,V:30×6→30×64","softmax →64→6"],"note":"结果是可微6维表示，不是硬挑一个候选。","detail":"一句话理解：注意力根据对象编码与当前位姿，为30个抓取候选分配权重，生成6维抓取表示。\n输入：各自对象编码128与当前物体位姿6拼成134；候选张量为30×6。\n处理：Q=Linear(134,64)，K/V分别Linear(6,64)；计算 softmax(QKᵀ/√64)，加权汇总 V，再经Linear(64,6)。Actor和Critic各自拥有全部投影参数。\n输出：各自6维 selected_grasp 表示，与其他特征拼接。\n抓取例子：机器人从侧面靠近时，可提高侧向候选的权重，使最终动作更适合当前相对姿态。\n注意：这不是 argmax 后的真实候选姿态，也没有把180维候选直接送进后面的 MLP；名称 selected_grasp 不代表离散选择。","refs":[["DQ_high-level/modules/predictattention.py",6,24],["DQ_high-level/train_multistate_DQ_teacher.py",143,155],["DQ_high-level/train_multistate_DQ_teacher.py",188,200]],"paper":[["DQ-Net · p4–5 教师 / p11 抓取融合",11,"继承对象编码与抓取注意力；214维、EKF和当前高斯网络设置以源码为准。","dq"]],"branch":"policy","status":"trainable","x":1080,"y":0,"formula":"softmax(QKᵀ/√64)V → Linear(64,6)","caution":""},{"id":"p_fusion","title":"5. 各自拼接214维输入","subtitle":"数值布局相同，表示权重独立","shapes":["58 +13 +9 +128 +6","融合向量:214"],"note":"候选180维已通过注意力压缩。","detail":"一句话理解：对象编码和抓取表示与当前状态拼接，形成决策与价值网络真正读取的向量。\n输入：当前状态58、EKF预测13、上一动作9，加上相应网络自己的对象码128和注意力输出6。\n处理：按照代码切片抽出非候选部分，连接上一动作、对象码与选出的抓取表示；总维度为214。Actor和Critic各执行一次，因此其中学得的特征一般不同。\n输出：送给 Actor MLP 的214维向量与送给 Critic MLP 的另一份214维向量。\n抓取例子：注意力给出的抓取偏好，会与手臂当前姿态和先前动作共同决定下一次控制。\n注意：不能画成两网络共享一个已编码向量；共享的是原始输入格式，编码与注意力参数不共享。","refs":[["DQ_high-level/train_multistate_DQ_teacher.py",131,137],["DQ_high-level/train_multistate_DQ_teacher.py",152,155],["DQ_high-level/train_multis ollout","title":"8. 24步真实 rollout","subtitle":"全4096环境 · 当前策略采样","shapes":["98,304 transitions","旧logπ · 真实r · V · done"],"note":"世界模型生成的数据不进入此处。","detail":"一句话理解：PPO 保存短段真实经验，把“执行时的概率”与后续重新计算的概率作比较。\n输入：原始观测、采样动作、旧 logπ、真实奖励、价值估计和结束标记。\n处理：24步乘4096环境形成98,304条转移；存储在学习设备上。Actor的旧概率固定为本轮采样时的记录，避免把更新后的概率错当成原策略。\n输出：GAE和PPO损失所需的当前rollout，并可向BPTT提供真实观测作为KL检查锚点。\n抓取例子：真实抓取中闭爪早了导致物体被推走，这段回报和当时动作概率共同决定后续调整。\n注意：这是24步 rollout，不是32768容量的模型replay；两者的用途与抽样规则不同。","refs":[["DQ_high-level/train_multistate_DQ_teacher.py",387,399],["third_party/skrl/skrl/agents/torch/ppo/ppo.py",260,290],["DQ_high-level/utils/wm_ppo.py",380,388]],"paper":[],"branch":"data","status":"data","x":1080,"y":300,"formula":"","caution":""},{"id":"p_gae","title":"9. GAE 与回报目标","subtitle":"真实 reward + Critic bootstrap","shapes":["γ=0.99 · λ=0.95","A标准化 · R=A_raw+V"],"note":"终止标记截断当前任务的bootstrap。","detail":"一句话理解：GAE 把真实奖励与 Critic 的误差积累成动作优势，告诉 PPO 哪些动作比预期更好。\n输入：24步真实奖励、价值、结束标记，以及rollout末端的价值估计。\n处理：倒序累计TD残差，使用γ=0.99与λ=0.95；回报由未标准化优势加原价值得到，再将优势标准化。value scaler 更新后，把旧价值与回报转换到其训练尺度。\n输出：Actor 的优势 A，以及 Critic 的回报监督 R。\n抓取例子：最后成功抬起物体的真实收益可以通过优势估计影响之前几步接近与闭爪动作。\n注意：当前有限任务的时限也按结束处理；没有用世界模型预测奖励或成功标签替换这些真实训练目标。","refs":[["DQ_high-level/train_multistate_DQ_teacher.py",399,400],["third_party/skrl/skrl/agents/torch/ppo/ppo.py",321,379],["DQ_high-level/utils/wrapper.py",153,165]],"paper":[],"branch":"data","status":"fixed","x":0,"y":600,"formula":"δₜ=rₜ+γ(1−doneₜ)Vₜ₊₁−Vₜ；GAE(A) → R","caution":""},{"id":"p_loss","title":"10. PPO Actor / Value 损失","subtitle":"概率比裁剪与真实回报回归","shapes":["ratio clip=0.2","value clip=0.2 · entropy=0"],"note":"当前默认没有额外熵奖励项。","detail":"一句话理解：Actor 根据真实优势改变动作概率，Critic 根据真实回报修正价值估计。\n输入：当前网络重新计算的 logπ 和 V，rollout 固定旧 logπ / V，以及GAE优势与回报。\n处理：ρ=exp(logπ_new−logπ_old)；策略损失取未裁剪和[0.8,1.2]裁剪代理目标的较小值。价值预测相对旧值裁剪±0.2后与归一化回报作MSE。默认熵系数0。\n输出：合计真实 PPO loss，用同一次反向传播更新独立Actor和Critic参数。\n抓取例子：优势为正的有效闭爪动作会增加概率，但概率比裁剪限制单轮改变。\n注意：此处没有世界模型预测loss，也没有BPTT想象loss；不同训练路径保留各自数据和优化器。","refs":[["DQ_high-level/train_multistat 录动作和四个状态；未来x₁…x₃只是监督目标。\n抓取例子：从手爪靠近糖盒开始，学习三次已执行命令如何改变手、盒子与底盘。\n注意：这里不重新调用Actor选动作，也不把复位后的新起点当作上一回合终态。","refs":[["DQ_high-level/utils/world_model/replay.py",158,233],["DQ_high-level/utils/wm_ppo.py",324,346]],"paper":[],"branch":"data","status":"data","x":0,"y":0,"formula":"","caution":""},{"id":"wm_state","title":"2. 完整递归状态 x","subtitle":"914 = 学习848 + 解析66","shapes":["4刚体52 · 关节57","低层历史710 · 控制记忆29"],"note":"状态含低层记忆，保证短期递归所需信息。","detail":"一句话理解：世界模型要记住足够多的身体、物体和控制历史，才能预测下一次高层决策的结果。\n输入：机器人根、物体、台面、末端各13维；19关节的位置、速度和上次速度57维；低层10×71历史710维；低层动作、步态和足接触29维。\n处理：另保留目标／命令／上次高层动作18维、EKF历史41维、任务计数及台面高度7维，共914维。\n输出：848维被学习的物理／低层记忆，66维用已知规则递归更新。\n抓取例子：盒子同样贴近夹爪，低层控制器仍在迈步或已站稳，会产生不同后果。\n注意：这是完整状态，不是Actor观测；XY以固定环境原点平移，不能称为全部机器人局部坐标。","refs":[["DQ_high-level/utils/wm_env.py",232,295],["DQ_high-level/utils/wm_env.py",307,356]],"paper":[],"branch":"data","status":"data","x":360,"y":0,"formula":"","caution":""},{"id":"wm_context","title":"3. 条件与GPU查表","subtitle":"动态26维记录 + 固定物理参数","shapes":["c原始:26 → c模型:C","C = 25 + 物理参数维 + 物体数"],"note":"删除环境槽编号；物理条件不加入Actor。","detail":"一句话理解：相同动作在不同摩擦、质量和驱动强度下会有不同结果，模型需要知道这些条件。\n输入：原始context含槽编号、初始航向、静置高度、奖励阶段开关、18电机强度、命令缩放和3维台面运动条件。\n处理：槽编号只查GPU表；去掉它后拼接质量／质心、控制增益、各机器人碰撞shape摩擦以及物体one-hot。\n输出：归一化C维条件，与状态、有效动作和dt一起进入MLP。\n抓取例子：同样前进命令遇到较低足部摩擦，模型可预测不同底盘响应。\n注意：1024维物体特征和抓取模板用于观测重建，不输入动力学MLP；C由当前资产推导，不应固定写成另一配置的数字。","refs":[["DQ_high-level/utils/wm_env.py",255,272],["DQ_high-level/utils/wm_env.py",343,364]],"paper":[],"branch":"data","status":"fixed","x":720,"y":0,"formula":"","caution":""},{"id":"wm_action","title":"4. 真实有效动作编码","subtitle":"把执行限幅写在MLP之外","shapes":["执行9 → 有效9","ΔEE xyz/rpy · opening · vₓ/ωz"],"note":"开度与真实控制一致；不使用sign或固定模式。","detail":"一句话理解：模型学习真实执行命令的后果，夹爪条件现在是连续开度。\n输入：记录中的9维执行动作与当前目标/命令状态；夹爪维度已经是[0,1]开度。\n处理：复现末端增量限幅、工作空间约束、底盘死区和可选stop_pick；开度限制在[0,1]后直接送入MLP，不转成±1。\n输出：9维有效物理动作；执行动作另用于prev_action与动作变化奖励。\n抓取例子：opening从0.5变为0.4将改变夹爪关节目标，模型需学习这个变化对物体和机器人后续状态的影响。\n注意：适配契约已升级schema3，旧符号动作模型与新开度模型语义不兼容。连续开度并不消除物理接触非光滑性。","refs":[["DQ_high-level/utils/wm_env.py",366,375],["DQ_high-level/utils/wm_env.py",588,603],["DQ_high-level/utils/gripper_control.py",1,14]],"paper":[],"branch":"data","status":"fixed","x":1080,"y":0,"formula":"","caution":""},{"id":"wm_inputs","title":"5. 归一化与输入掩码","subtitle":"914槽位保留859个物理／控制分量","shapes":["914 + 9 + C + 1","Δt / 0.15"],"note":"历史奖励和EKF不伪造物理梯度。","detail":"一句话理解：完整状态便于递归，但只有能影响当前物理执行的字段进入动力学预测。\n输入：914维状态、9维有效动作、C维条件和实际控制周期。\n处理：缩放状态；保留848维学习字段及目标／命令9、步数1、台高1，共859个分量，其余55个槽位置零。最后拼接有效动作、条件和dt/0.15。\n输出：宽度914+9+C+1的网络输入。\n抓取例子：累计最高抬升高度影响奖励，却不会直接给盒子施力，因此它不应提供一条虚假的物理作用路径。\n注意：被掩码的prev_action、EKF和任务历史仍保留在完整状态中，用于后续Actor观测与奖励，未被整个系统删除。","refs":[["DQ_high-level/utils/wm_env.py",273,295],["DQ_high-level/utils/wm_env.py",358,364],["DQ_high-level/utils/world_model/dynamics.py",57,74]],"paper":[],"branch":"wm","status":"fixed","x":0,"y":300,"formula":"","caution":""},{"id":"wm_mlp","title":"6. 候选动力学 Fω","subtitle":"三层512宽SiLU残差MLP","shapes":["输入 → 512 → 512 → 512","末层Linear → 844"],"note":"末层零初始化；本支路更新ω。","detail":"一句话理解：这是真正需要从抓取数据中学习的状态转移网络。\n输入：归一化状态特征、有效动作、物理条件与dt的拼接。\n处理：三组Linear＋SiLU隐藏层，每层宽512；最后一个Linear输出844个残差，末层权重和偏置初始化为零。\n输出：四个刚体各12维速度／旋转／位置修正，以及关节和低层记忆残差；交给显式积分器生成状态。\n抓取例子：夹爪闭合并上抬后，网络需学出盒子是否随末端运动，以及底盘是否发生反作用扰动。\n注意：这是闭环高层动力学；不把冻结低层策略再展开为待训练网络。零残差仍有已有速度的积分，不等于所有状态完全静止。","refs":[["DQ_high-level/utils/world_model/dynamics.py",13,55],["DQ_high-level/utils/wm_env.py",626,654]],"paper":[["SuperMimic p5 · §3.2 多步动力学拟合",5,"借鉴连续真实动作上的自回归监督；这里的状态、维数、损失和三步窗口由当前 DQ 实现决定。","sm"]],"branch":"wm","status":"trainable","x":360,"y":300,"formula":"","caution":""},{"id":"wm_integrate","title":"7. 几何与物理积分","subtitle":"844残差 → 848物理／记忆字段","shapes":["p′=p+Δt·v′+δp","q′=normalize(δq ⊗ q)"],"note":"旋转用三维增量；四元数保持归一化。","detail":"一句话理解：网络给出修正量，再由已知几何规则把它们变成下一状态。\n输入：844维残差、上一状态、动作、context和dt。\n处理：各刚体更新线／角速度，以新速度推进位置，旋转增量左乘四元数并归一化；关节用新速度积分并加修正；其余低层历史与步态等做缩放残差更新。\n输出：机器人、物体、台面、末端及低层记忆的下一预测值。\n抓取例子：盒子的上升速度和旋转变化共同决定下一帧位姿，而不把四元数四个分量当成独立角度。\n注意：末端和关节当前分别预测，未强制FK一致；台面也是学习字段；没有显式手爪接触力输出头。","refs" = −mean[w·return] / H"],"note":"梯度沿三步状态链回到所有Actor调用。","detail":"一句话理解：让本次可信起点上的短期预测收益和后续价值一起增大。\n输入：每步解析奖励、软存活权重、末端Critic值，以及detach的可信权重w。\n处理：对t=0至2累加γᵗcₜr̂ₜ，再加γ³c₃Vψ(ô₃)；每条轨迹乘固定w，对batch取均值，以负值除H作损失。\n输出：一个标量，反向经过奖励／终止、Critic、EKF、观测归一化和各步冻结模型，汇总到共享Actor均值参数θ，标准差不参与这条梯度链。\n抓取例子：短期抬升更多却使底盘失稳，低尾值或高终止概率会抵消眼前收益。\n注意：自然终止采用软概率存活，解析成功不会直接硬停；这是均值动作轨迹目标，不是随机PPO策略期望回报的无偏梯度；默认超时不自举；w不除以其和，因此低可信样本占比增大会缩小平均更新信号。","refs":[["DQ_high-level/utils/world_model/imagination.py",53,74],["DQ_high-level/utils/world_model/imagination.py",286,297]],"paper":[["SuperMimic p5 · §3.3 想象轨迹与策略优化",5,"借鉴通过可微世界模型展开策略和回报、沿时间更新策略；这里保留真实 PPO，并采用短三步与额外可靠性门控。","sm"]],"branch":"loss","status":"loss","x":360,"y":600,"formula":"","caution":""},{"id":"im_update","title":"11. Actor辅助Adam提议","subtitle":"独立于真实PPO优化器","shapes":["lr = 1e−5 × .05 = 5e−7","Actor梯度范数裁剪0.5"],"note":"仅更新均值网络；logσ.grad=None，保留旧参数组兼容。","detail":"一句话理解：把想象得到的动作改进方向转成一次小幅Actor参数更新。\n输入：BPTT目标对Actor的梯度；当前Actor和辅助Adam状态。\n处理：检查loss和梯度有限性，裁剪范数至0.5；保存Actor与Adam完整状态，然后按有效学习率5e−7执行一次均值网络更新提议。保留原Adam参数组以兼容旧检查点，logσ.grad=None使标准差及其旧动量在本步不step。\n输出：待KL检查的新Actor及可完整恢复的备份。\n抓取例子：一次辅助步轻微改变靠近物体时的末端指令倾向，随后还要在真实观测上检查分布是否变化过大。\n注意：强度.05直接缩放Adam学习率；仅缩放loss会被Adam自适应归一化抵消大部分效果。模型与Critic不在这个优化器中；没有永久关闭logσ的requires_grad，真实PPO仍能更新它。","refs":[["DQ_high-level/utils/world_model/imagination.py",143,151],["DQ_high-level/utils/world_model/imagination.py",286,308]],"paper":[],"branch":"policy","status":"trainable","x":720,"y":600,"formula":"","caution":""},{"id":"im_kl","title":"12. 全动作KL与完整回滚","subtitle":"真实起点＋当前PPO观测作为锚点","shapes":["KL(old || new) 全9维","均值 ≤ .005 才接受"],"note":"拒绝恢复Actor及辅助Adam的权重、动量与步数。","detail":"一句话理解：辅助更新先提出改动，再检查它是否让真实观测上的动作分布偏移过大。\n输入：更新前／后Actor在真实起点观测及PPO memory抽样观测上的latentlatent高斯均值与方差；本次辅助步标准差相同。\n处理：计算全部9维latent Gaussian的KL(old||new)，先对动作维求和再对batch取均值；超过.005或非有限则恢复Actor和辅助Adam完整状态，否则接受。\n输出：用于下一轮真实PPO采样的Actor；接受／拒绝及KL日志。\n抓取例子：全部9维均值都可直接改变，检查夹爪开度与末端、底盘命令的联合分布偏移。\n注意：该KL不是直接与本轮PPO更新前的旧策略比较，而是辅助步前后比较；未通过只回滚辅助步，不撤销已完成的真实PPO更新。\n边界：共同sigmoid变换在精确实数下保留KL；数值端点保护与执行饱和不在该精确等价条件内。","refs":[["DQ_high-level/utils/wm_ppo.py",380,388],["DQ_high-level/utils/world_model/imagination.py",77,81],["DQ_high-level/utils/world_model/imagination.py",279,318]],"paper":[],"branch":"policy","status":"fixed","x":1080,"y":600,"formula":"","caution":""}],"edges":[{"from":"im_start","to":"im_step0","label":"固定x₀／context","kind":"data"},{"from":"im_start","to":"im_random","label":"参考展开起点","kind":"data"},{"from":"im_step0","to":"im_step1","label":"x̂₁不detach","kind":"data"},{"from":"im_step1","to":"im_step2","label":"x̂₂不detach","kind":"data"},{"from":"im_step2","to":"im_tail","label":"最终x̂₃","kind":"data"},{"from":"im_frozen","to":"im_tail","label":"冻结Critic与scalers","kind":"shared"},{"from":"im_start","to":"im_objective","label":"detach可信权重w","kind":"condition"},{"from":"im_tail","to":"im_objective","label":"γ³c₃Vψ","kind":"data"},{"from":"im_terms","to":"im_objective","label":"r̂与存活c","kind":"data"},{"from":"im_objective","to":"im_update","label":"Laux提议","kind":"data"},{"from":"im_update","to":"im_kl","label":"新Actor＋可回滚备份","kind":"data"},{"from":"im_kl","to":"im_actor","label":"通过保留／否则完整恢复","kind":"update"},{"from":"im_actor","to":"im_step0","label":"共享Actor θ","kind":"shared"},{"from":"im_frozen","to":"im_step0","label":"三步共用Fω*／观测scaler","kind":"shared"},{"from":"im_random","to":"im_step0","label":"逐步dt固定；开度由Actor重算","kind":"condition"},{"from":"im_step0","to":"im_terms","label":"该步奖励／终止","kind":"data"},{"from":"im_terms","to":"im_step0","label":"∂r与∂d保留输入梯度","kind":"gradient"},{"from":"im_step0","to":"im_actor","label":"该步共享θ梯度","kind":"gradient"},{"from":"im_actor","to":"im_step1","label":"共享Actor θ","kind":"shared"},{"from":"im_step1","to":"im_terms","label":"该步奖励／终止","kind":"data"},{"from":"im_terms","to":"im_step1","label":"∂r与∂d保留输入梯度","kind":"gradient"},{"from":"im_step1","to":"im_actor","label":"该步共享θ梯度","kind":"gradient"},{"from":"im_actor","to":"im_step2","label":"共享Actor θ","kind":"shared"},{"from":"im_step2","to fix8（自动）","可用 --wm_probe_device cuda:1"],"note":"主训练同步等待；不回滚主 PhysX 场景。","detail":"一句话理解：独立新建环境验证动作效果，避免污染正在训练的场景。\n输入：相同任务、随机种子、SGS bank 与候选 bundle。\n处理：plan 生成固定动作前缀，再依次启动 base/plus/minus/repeat 新进程，使用相同初态及前缀。\n输出：四条末步动作分支的真实奖励及模型预测奖励。\n抓取例子：同一接近糖盒状态，比较末端轻微向左或向右的后果。\n注意：默认三类 SGS 初态均衡，不等于实际接触模式均衡。探针保持训练物理模式，但关闭 W&B、TensorBoard writer 和周期 checkpoint。","refs":[["DQ_high-level/probe_teacher_world_model.py",256,276],["DQ_high-level/probe_teacher_world_model.py",116,117]],"branch":"sim","status":"inference","x":730,"y":0,"paper":[],"formula":"","caution":""},{"id":"perturb","title":"4. 四分支有限扰动","subtitle":"基准、正负扰动、重复基准","shapes":["a / a＋δ / a−δ / repeat","扰动全部9维，含开度"],"note":"9维动作语义与报告版本必须匹配。","detail":"一句话理解：在相同真实起点比较9维动作扰动的后果，包括连续夹爪开度。\n输入：相同状态、物理条件与动作时长。\n处理：最后一步对全部9维施加有限扰动，夹爪开度扰动遵守[0,1]范围；重复基准用于估计数值噪声。\n输出：Δr_real=r(a+δ)−r(a−δ)及模型预测差值，并记录9维扰动覆盖。\n抓取例子：微调开度与末端命令后，比较真实一步奖励变化方向是否与模型一致。\n注意：新版报告覆盖连续开度，旧8维固定夹爪报告不能放行。它仍只验证一步有限奖励效应，不证明完整BPTT梯度或长期成功率。","refs":[["DQ_high-level/utils/world_model/probes.py",129,181],["DQ_high-level/probe_teacher_world_model.py",210,232]],"branch":"data","status":"fixed","x":1095,"y":0,"paper":[],"formula":"","caution":""},{"id":"stats","title":"5. 真实效果统计门","subtitle":"重复性、方向、相关性与收益","shapes":["有效pairs≥64 · informative≥32","sign≥.70 · corr≥.25 · LCB95>0"],"note":"收益95%下界必须严格大于0；门限是融合实现选择。","detail":"一句话理解：只有可信、足量且支持正向动作选择的证据才允许采用候选。\n输入：真实与模型奖励差、重复误差、family 标签。\n处理：先排除起点／条件／dt不一致、前缀已结束和噪声过大的样本；在有效效果样本上计算符号一致率、相关性和模型选优动作的真实收益。\n输出：passed 或明确失败原因。\n抓取例子：模型偏好的扰动在真实物理中需要有正的平均收益置信下界。\n注意：每族只要求可复现样本覆盖；统计阈值基于汇总有效样本。没有验证 Critic 输入导数或最终完整任务成功率。","refs":[["DQ_high-level/utils/world_model/probes.py",366,425]],"branch":"data","status":"fixed","x":1095,"y":305,"paper":[],"formula":"","caution":""},{"id":"activate","title":"6. 激活固定模型 ω★","subtitle":"验证权重与任务指纹一致","shapes":["candidate ≠ validated 实例","新候选失败→保留旧 ω★"],"note":"持续拟合的 candidate 不直接用于 BPTT。","detail":"一句话理解：验证报告只能给它实际覆盖的模型权重提供证据。\n输入：candidate、真实 probe 报告与当前任务元数据。\n处理：检查报告内容、模拟器协议、权重与配置指纹，之后才复制到冻结 validated 实例。\n输出：Fω★ 与其报告。\n抓取例子：候选又拟合两次以后，旧报告仍只对应原来的固定模型，不能用于给新权重直接放行。\n注意：新候选未通过时旧快照可保留，但随后仍受当前留出误差门约束。","refs":[["DQ_high-level/utils/wm_ppo.py",294,325],["DQ_high-level/utils/world_model/probes.py",475,506]],"branch":"wm","status":"frozen","x":730,"y":305,"paper":[],"formula":"","caution":""},{"id":"heldout","title":"7. 当前留出预测检查","subtitle":"整回合分割的验证窗口","shapes":["eᵢ=max(ephysical, erelative)","maxₖ meanᵢ(eᵢ,ₖ) ≤ .25"],"note":"先逐样本取两种误差最大值，再对 batch 求均值。","detail":"一句话理解：已经验证过动作效果的快照，也可能跟不上当前策略访问的新状态。\n输入：固定 Fω★、当前 replay 中10%留出回合的连续窗口。\n处理：沿真实动作预测 max(K,H)=3步，各步计算物理与相对几何误差的置信分数。\n输出：每个预测步的均值都≤0.25才继续。\n抓取例子：物体和末端各错向6厘米可能让物理均值不大，但相对误差能阻止误用这个模型。\n注意：不是要求所有单样本误差都≤0.25；也不是以所有914个数的未归一化均方误差判断。","refs":[["DQ_high-level/utils/wm_ppo.py",349,381]],"branch":"data","status":"fixed","x":365,"y":305,"paper":[],"formula":"","caution":""},{"id":"trust","title":"8. 起点权重与冻结条件","subtitle":"真实一步误差决定可信程度","shapes":["wᵢ=detach(clamp(1−eᵢ/.25,0,1))","start/context/dt/grip：固定"],"note":"权重为0不贡献本次目标；Actor不能优化权重取巧。","detail":"一句话理解：从真实回放中抽到的每个起点，按局部模型误差获得不同权重。\n输入：起点的真实一步转移与 Fω★ 预测。\n处理：计算相同置信误差；低误差赋较大权重，高误差或非有限赋0。起点、条件和权重均 detach。\n输出：用于闭环三步想象的固定起点与权重。\n抓取例子：模型较熟悉的接近状态可以参与，暂时预测不准的滑落状态可先留给真实 PPO 与模型拟合。\n注意：权重是条件，不是一个让 Actor 学会提高的奖励。","refs":[["DQ_high-level/utils/wm_ppo.py",432,460]],"branch":"data","status":"data","x":0,"y":305,"paper":[],"formula":"","caution":""},{"id":"aux","title":"9. 三步 BPTT 提议","subtitle":"冻结 ω★、ψ；更新 θ","shapes":["H3 · γ=.99 · lr5e−7","9维均值→连续开度；σ仅PPO更新"],"note":"同一个 Actor 闭环动作；只有 θ 接受辅助梯度。","detail":"一句话理解：符合门控条件后才真正计算一次模型辅助策略更新。\n输入：可信起点、固定物理条件、已验证世界模型、当前 Actor 和真实 Critic。\n处理：三步可微观测、动作与模型递归，累计奖励并加入终点价值；单独 Adam 提议更新 Actor 均值网络，标准差不参与辅助更新。\n输出：候选 Actor 参数，等待 KL 检查。\n抓取例子：物体未来相对末端位置通过模型影响回报，再影响连续动作均值。\n注意：冻结权重仍保留输入导数。PPO优化器和辅助Adam是两个优化器，不共享动量。","refs":[["DQ_high-level/utils/world_model/imagination.py",265,317]],"branch":"loss","status":"trainable","x":0,"y":610,"paper":[["SuperMimic · p4–5 Fig.2 / §3",5,"借鉴真实采样、多步动力学拟合和冻结模型的 BPTT；本任务保留真实 PPO 与真实 Critic。","sm"]],"formula":"","caution":""},{"id":"kl","title":"10. KL 接受或完整回滚","subtitle":"真实锚点＋全9维动作分布","shapes":["mean KL(old∥new) ≤ .005","超限：θ＋Adam 状态恢复"],"note":"检查的是动作分布改变程度，不是成功率。","detail":"一句话理解：小幅可信的辅助方向也需要限制单次策略偏移。\n输入：更新前后 Actor，在起点观测和真实 PPO rollout 抽样观测上的latent高斯分布；标准差在辅助步前后相同。\n处理：9维 KL 求和后对样本平均；非有限或超过0.005就恢复更新前 Actor 权重和辅助Adam的动量及步数。\n输出：hybrid_updated 或 bptt_rejected，随后继续真实交互。\n抓取例子：夹爪已直接参与BPTT，须同时约束它与其余8维动作的分布变化。\n注意：没有以短期想象回报变高作为接受更新的唯一证据。\n边界：共同sigmoid变换在精确实数下保留KL；数值端点保护与执行饱和不在该精确等价条件内。","refs":[["DQ_high-level/utils/world_model/imagination.py",305,322],["DQ_high-level/utils/wm_ppo.py",381,390]],"branch":"loss","status":"fixed","x":365,"y":610,"paper":[],"formula":"","caution":""},{"id":"device","title":"11. GPU 与进程分工","subtitle":"张量留在学习／模拟同一卡","shapes":["训练：sim=rl=cuda:i","probe：cuda:i 或另一张卡"],"note":"同卡也是独立场景；CPU只做调度、保存与日志。","detail":"一句话理解：真实采样、GPU replay、模型拟合和 BPTT 共享训练设备。\n输入：RL_DEVICE／SIM_DEVICE 与可选 wm_probe_device。\n处理：主入口检查模拟器与学习器在同一 CUDA；probe 在独立进程重新创建 GPU 场景。主训练等待报告完成再继续。\n输出：同卡或双卡均可运行的真实验证流程。\n抓取例子：GPU0负责4096环境训练，GPU1临时创建128环境做效果验证。\n注意：图不是多GPU并行训练或异步数据管线；切到第二张卡不消除同步等待。实际显存需求受环境数量和场景影响。","refs":[["DQ_high-level/utils/wm_entry.py",71,88],["DQ_high-level/utils/wm_entry.py",155,166]],"branch":"data","status":"fixed","x":730,"y":610,"paper":[],"formula":"","caution":""},{"id":"logging","title":"12. 状态与证据文件","subtitle":"保留报告，隔离探针日志","shapes":["status / probe JSON / checkpoint","probe 不创建 TensorBoard writer"],"note":"当前工作区已包含2026-11-04探针日志隔离修复。","detail":"一句话理解：读日志可判断当前是在拟合、等待证据还是接受辅助步。\n输入：误差指标、probe结论、BPTT与KL结果。\n处理：主运行统一记录 World model / 指标；探针保存独立JSON/文本日志，关闭W&B、TensorBoard和周期checkpoint。\n输出：waiting_for_probe、heldout_error_rejected、hybrid_updated、bptt_rejected等状态与证据。\n抓取例子：长时间 waiting_for_probe 应检查具体探针原因，而不是误以为 BPTT 已经工作。\n注意：本图已于2026-11-05同步均值BPTT动作路径，既有训练日志不是本次图形制作重新运行的结果。","refs":[["DQ_high-level/probe_teacher_world_model.py",116,117],["DQ_high-level/train_multistate_DQ_teacher.py",423,427],["DQ_high-level/utils/wm_entry.py",226,242]],"branch":"data"," bes (manual reports only)\n  --wm_config PATH            Optional YAML overrides\n  --dry-run                   Print the resolved training command\n\nEnvironment: PYTHON_BIN, NUM_ENVS (4096), RL_DEVICE (cuda:0), SIM_DEVICE,\nTIMESTEPS (120000), SEED (43), RUN_NAME, EXPERIMENT_DIR, SGS_BANK,\nWORLD_MODEL_MODE (hybrid), WM_PROBE_INTERVAL (2400).\n\nDetails: doc/SuperMimic_SGS_EKF_implementation.md\nEOF\n        exit 0\n    fi\ndone\nscript_dir=\"$(cd -- \"$(dirname -- \"${BASH_SOURCE[0]}\")\" && pwd)\"\nexport EXPERIMENT_DIR=\"${EXPERIMENT_DIR:-DQ_teacher/b1-pick-sugar-box-sgs-ekf-world-model}\"\nexport RUN_NAME=\"${RUN_NAME:-sgs_ekf_wm_seed${SEED:-43}_$(TZ=Asia/Shanghai date +%Y%m%d_%H%M%S)}\"\nexec bash \"$script_dir/train_teacher_sgs_ekf.sh\" \\\n    --world_model \"${WORLD_MODEL_MODE:-hybrid}\" \\\n    --wm_probe_interval \"${WM_PROBE_INTERVAL:-2400}\" \"$@\"\n","sha256":"2ce0576637b995e41e8a26d80366965f6e06e3814a941b6ad65213815974461c"},"DQ_high-level/train_teacher_sgs_ekf.sh":{"text":"#!/usr/bin/env bash\n# Run from any directory after activating the dqwbc environment.\nset -euo pipefail\n\nusage() {\n    cat <<'EOF'\nUsage: bash DQ_high-level/train_teacher_sgs_ekf.sh [--dry-run] [--no-wandb] [teacher arguments...]\n\nTrain the sugar_box teacher with both SGS and EKF future-pose observations.\nDefaults: 8192 environments, 120000 steps, seed 43, CUDA 0, headless, W&B enabled.\nEKF: horizons 0.60/0.90 seconds, history 5, Q scale 1.0, R scale 0.01.\n\nEnvironment overrides:\n  PYTHON_BIN       Python from the activated dqwbc environment (default: python)\n  NUM_ENVS         Parallel environments (default: 8192)\n  TIMESTEPS        Planned training steps (default: 120000)\n  SEED             Random seed (default: 43)\n  RL_DEVICE        Policy device (default: cuda:0)\n  SIM_DEVICE       Simulation device (default: same as RL_DEVICE)\n  SGS_BANK         Bank path, relative to DQ_high-level or absolute\n                   (default: data/sgs/sugar_box_v10.pt)\n  EXPERIMENT_DIR   Output directory, relative to DQ_high-level or absolute\n                   (default: DQ_teacher/b1-pick-sugar-box-sgs-ekf)\n  RUN_NAME         W&B/run directory name (default: timestamped name)\n  WANDB_PROJECT    W&B project (default: isaacgym)\n\nExamples:\n  bash DQ_high-level/train_teacher_sgs_ekf.sh\n  bash DQ_high-level/train_teacher_sgs_ekf.sh --dry-run\n  NUM_ENVS=64 RUN_NAME=sgs_ekf_smoke bash DQ_high-level/train_teacher_sgs_ekf.sh --no-wandb --stop_after 48\n\nExtra arguments are passed to train_multistate_DQ_teacher.py after the defaults.\nSGS training starts from scratch; --resume and --checkpoint are not supported.\nEOF\n}\n\ndry_run=false\nuse_wandb=true\nteacher_args=()\nfor arg in \"$@\"; do\n    case \"$arg\" in\n        --help|-h) usage; exit 0 ;;\n        --dry-run) dry_run=true ;;\n        --no-wandb) use_wandb=false ;;\n        *) teacher_args+=(\"$arg\") ;;\n    esac\ndone\n\nscript_dir=\"$(cd -- \"$(dirname -- \"${BASH_SOURCE[0]}\")\" && pwd)\"\ncd -- \"$script_dir\"\n\npython_bin=\"${PYTHON_BIN:-python}\"\nseed=\"${SEED:-43}\"\nrl_device=\"${RL_DEVICE:-cuda:0}\"\nbank_path=\"${SGS_BANK:-data/sgs/sugar_box_v10.pt}\"\nrun_name=\"${RUN_NAME:-sgs_ekf_sugar_box_seed${seed}_$(TZ=Asia/Shanghai date +%Y%m%d_%H%M%S)}\"\n\nif [[ ! -f \"$bank_path\" ]]; then\n    printf 'SGS bank not found: %s\\nSet SGS_BANK to an existing validated bank.\\n' \"$bank_path\" >&2\n    exit 1\nfi\n\ncmd=(\n    \"$python_bin\" train_multistate_DQ_teacher.py\n    --cfg_file data/cfg/DQ_teacher.yaml\n    --task B1Z1PickMulti --object_name sugar_box\n    --rl_device \"$rl_device\" --sim_device \"${SIM_DEVICE:-$rl_device}\"\n    --num_envs \"${NUM_ENVS:-4096}\" --timesteps \"${TIMESTEPS:-120000}\"\n    --roboinfo --observe_gait_commands --small_value_set_zero\n    --rand_control --no_velocity_obs\n    --sgs_mode sgs --sgs_bank \"$bank_path\" --success_mode hold\n    --future_pose_obs --future_pose_horizons 0.60 0.90\n    --ekf_history 5 --ekf_q_scale 1.0 --ekf_r_scale 0.01\n    --experiment_dir \"${EXPERIMENT_DIR:-DQ_teacher/b1-pick-sugar-box-sgs-ekf}\"\n    --wandb_project \"${WANDB_PROJECT:-isaacgym}\" --wandb_name \"$run_name\"\n    --seed \"$seed\" --headless\n)\n\nif \"$use_wandb\"; then\n    cmd+=(--wandb)\nfi\n\ncmd+=(\"${teacher_args[@]}\")\n\nprintf 'Working directory: %s\\nCommand: ' \"$script_dir\"\nprintf '%q ' \"${cmd[@]}\"\nprintf '\\n'\nif \"$dry_run\"; then\n    exit 0\nfi\nexec \"${cmd[@]}\"\n","sha256":"dec85c9f46d6d796bc632c69e1b42df0e9bee9b12aeec80202a288432e7185a5"},"DQ_high-level/utils/sgs.py":{"text":"\"\"\"Success-guided reset sampling, independent of Isaac Gym.\n\nThe kernel follows SGS equations (1)--(2), including Appendix B.2's weight\nfloor and minimum temperature. Empty histories use the project's explicit\n``p_init=0`` convention; they are not observations of failure.\n\"\"\"\n\nimport hashlib\nimport json\nimport math\nimport os\nfrom pathlib import Path\nimport tempfile\n\nimport torch\n\n\nRESET_FAMILIES = (\"full_task\", \"pregrasp\", \"at_grasp\")\nNEAR_GOAL_FAMILIES = RESET_FAMILIES + (\"near_goal\",)\n# Current construction profile. Keep legacy tuples intact: saved family IDs\n# must retain their original meaning when inspecting an older immutable bank.\nACTIVE_RESET_FAMILIES = (\"full_task\", \"pregrasp\", \"near_goal\")\nSUPPORTED_FAMILY_PROFILES = {\n    \"geometry_v1\": RESET_FAMILIES,\n    \"geometry_grasp_v2\": NEAR_GOAL_FAMILIES,\n    \"geometry_grasp_v3\": ACTIVE_RESET_FAMILIES,\n}\n\n\ndef validate_task_hold_steps(metadata, hold_steps):\n    \"\"\"Keep task compatibility explicit without rewriting immutable bank evidence.\n\n    Geometry banks validate initial physical states; the builder only records\n    the task's hold_steps in metadata and does not use it in its physics checks.\n    Permit the known 15-to-10-step task alignment for those validated profiles.\n    This does not certify policy success under the new task definition.\n    \"\"\"\n    source_steps = metadata.get(\"hold_steps\")\n    if (type(source_steps) is not int or source_steps < 1\n            or type(hold_steps) is not int or hold_steps < 1):\n        raise ValueError(\"bank and task hold_steps must be positive integers\")\n    if source_steps == hold_steps:\n        return \"exact\"\n    physical = metadata.get(\"physical_validation\", {})\n    if (source_steps == 15 and hold_steps == 10\n            and physical.get(\"passed\") is True\n            and physical.get(\"validation_profile\") in SUPPORTED_FAMILY_PROFILES):\n        return \"geometry_bank_15_to_10\"\n    raise ValueError(\"bank metadata mismatch: hold_steps; rebuild the bank for this task\")\n\n\ndef _mode(value):\n    if value == \"uniform_bank\":\n        value = \"uniform\"\n    if value not in (\"uniform\", \"sgs\"):\n        raise ValueError(\"sampler mode must be 'uniform' or 'sgs'\")\n    return value\n\n\ndef _integer_vector(value, device, name):\n    result = torch.as_tensor(value, device=device)\n    if result.ndim != 1:\n        raise ValueError(\"{} must be a one-dimensional tensor\".format(name))\n    if result.numel() and result.dtype not in (\n            torch.int8, torch.int16, torch.int32, torch.int64, torch.uint8):\n        raise ValueError(\"{} must contain integer IDs\".format(name))\n    return result.to(dtype=torch.long)\n\n\ndef _assert_device(condition, message):\n    # Unlike bool(cuda_tensor), this does not copy a scalar to the host on every\n    # reset. An invalid CUDA input is a programming error and may poison its\n    # CUDA context, just like an invalid gather index.\n    torch._assert_async(condition, message)\n\n\ndef _validate_metadata_subset(actual, expected, prefix=\"\"):\n    for name, value in expected.items():\n        key = \"{}.{}\".format(prefix, name) if prefix else name\n        if name not in actual:\n            raise ValueError(\"bank metadata mismatch: \" + key)\n        if isinstance(value, dict):\n            if not isinstance(actual[name], dict):\n                raise ValueError(\"bank metadata mismatch: \" + key)\n            _validate_metadata_subset(actual[name], value, key)\n        elif actual[name] != value:\n            raise ValueError(\"bank metadata mismatch: \" + key)\n\n\nclass SGSSampler:\n    \"\"\"Maintain per-configuration rolling outcomes and sample reset IDs.\n\n    ``observe`` preserves the input event order within each configuration.\n    Callers must submit each completed episode exactly once, before replacing\n    its active configuration ID. All regular update/sampling work stays on the\n    chosen device, including batches with repeated IDs or more than H outcomes\n    for one configuration.\n    \"\"\"\n\n    STATE_VERSION = 1\n    _TENSOR_STATE = (\n        \"history\", \"count\", \"head\", \"success_sum\", \"visits_total\", \"last_seen\",\n    )\n\n    def __init__(self, num_configs, history_size=100, target_success_rate=0.5,\n                 concentration=1.0, temperature=2.0, epsilon=1e-4, p_init=0.0,\n                 device=\"cpu\", seed=43, mode=\"sgs\"):\n        if isinstance(num_configs, bool) or int(num_configs) != num_configs or num_configs <= 0:\n            raise ValueError(\"num_configs must be a positive integer\")\n        if isinstance(history_size, bool) or int(history_size) != history_size or history_size <= 0:\n            raise ValueError(\"history_size must be a positive integer\")\n        values = (target_success_rate, concentration, temperature, epsilon, p_init)\n        if not all(math.isfinite(float(value)) for value in values):\n            raise ValueError(\"sampler parameters must be finite\")\n        if not 0 <= target_success_rate <= 1 or not 0 <= p_init <= 1:\n            raise ValueError(\"success probabilities must be in [0, 1]\")\n        if concentration < 0 or temperature <= 0 or epsilon <= 0:\n            raise ValueError(\"concentration must be nonnegative; temperature/epsilon positive\")\n        self.num_configs = int(num_configs)\n        self.history_size = int(history_size)\n        self.target_success_rate = float(target_success_rate)\n        self.concentration = float(concentration)\n        self.temperature = float(temperature)\n        self.epsilon = float(epsilon)\n        self.p_init = float(p_init)\n        self.device = torch.device(device)\n        self.mode = _mode(mode)\n        self.generator = torch.Generator(device=self.device)\n        self.generator.manual_seed(int(seed))\n        self.history = torch.zeros(\n            self.num_configs, self.history_size, dtype=torch.bool, device=self.device)\n        self.count = torch.zeros(self.num_configs, dtype=torch.long, device=self.device)\n        self.head = torch.zeros_like(self.count)\n        self.success_sum = torch.zeros_like(self.count)\n        self.visits_total = torch.zeros_like(self.count)\n        self.last_seen = torch.full_like(self.count, -1)\n\n    @property\n    def valid_count(self):\n        return self.count\n\n    @property\n    def write_ptr(self):\n        return self.head\n\n    def _config_ids(self, value):\n        ids = _integer_vector(value, self.device, \"config_ids\")\n        if ids.numel():\n            _assert_device(((ids >= 0) & (ids < self.num_configs)).all(),\n                           \"configuration ID outside the fixed bank\")\n        return ids\n\n    @torch.no_grad()\n    def observe(self, config_ids, successes, step=0):\n        \"\"\"Append a batch of valid episode outcomes in their supplied order.\"\"\"\n        ids = self._config_ids(config_ids)\n        outcomes = torch.as_tensor(successes, device=self.device)\n        if outcomes.ndim != 1 or outcomes.shape != ids.shape:\n            raise ValueError(\"successes must have the same one-dimensional shape as config_ids\")\n        if int(step) != step or step < 0:\n            raise ValueError(\"step must be a nonnegative integer\")\n        if not ids.numel():\n            return\n        _assert_device(((outcomes == 0) | (outcomes == 1)).all(),\n                       \"episode outcomes must be Boolean or 0/1\")\n        outcomes = outcomes.to(torch.bool)\n\n        # Stable sort gives each configuration contiguous events while retaining\n        # their original order. No per-configuration Python loop is necessary.\n        order = torch.argsort(ids, stable=True)\n        sorted_ids = ids[order]\n        sorted_outcomes = outcomes[order]\n        positions = torch.arange(ids.numel(), device=self.device)\n        starts = torch.ones_like(sorted_ids, dtype=torch.bool)\n        starts[1:] = sorted_ids[1:] != sorted_ids[:-1]\n        group_start = torch.cummax(\n            torch.where(starts, positions, torch.zeros_like(positions)), dim=0).values\n        rank = positions - group_start\n        additions = torch.zeros_like(self.count)\n        additions.scatter_add_(0, sorted_ids, torch.ones_like(sorted_ids))\n\n        # Only the final H outcomes of an oversized group survive. Their slot\n        # indices include the skipped prefix, matching a sequential ring write.\n        keep = rank >= (additions[sorted_ids] - self.history_size)\n        kept_ids = sorted_ids[keep]\n        slots = (self.head[kept_ids] + rank[keep]) % self.history_size\n        new_values = sorted_outcomes[keep]\n        old_values = self.history[kept_ids, slots]\n        delta = torch.zeros_like(self.success_sum)\n        delta.scatter_add_(0, kept_ids, new_values.long() - old_values.long())\n        self.history[kept_ids, slots] = new_values\n        self.success_sum.add_(delta)\n        self.count.copy_(torch.clamp(self.count + additions, max=self.history_size))\n        self.head.copy_((self.head + additions) % self.history_size)\n        self.visits_total.add_(additions)\n        self.last_seen.copy_(torch.where(additions > 0, int(step), self.last_seen))\n\n    def record(self, config_ids, outcomes, env_ids=None, global_step=0):\n        \"\"\"Compatibility wrapper; event order is the supplied order, not env_id.\"\"\"\n        self.observe(config_ids, outcomes, step=global_step)\n\n    @torch.no_grad()\n    def success_rates(self):\n        rates = self.success_sum.to(torch.float32) / self.count.clamp_min(1)\n        return torch.where(self.count > 0, rates, self.p_init)\n\n    @torch.no_grad()\n    def probabilities(self, mode=None):\n        if _mode(self.mode if mode is None else mode) == \"uniform\":\n            return torch.full(\n                (self.num_configs,), 1.0 / self.num_configs,\n                dtype=torch.float32, device=self.device)\n        rates = self.success_rates()\n        log_weight = (\n            self.concentration * self.target_success_rate * torch.log(rates + self.epsilon)\n            + self.concentration * (1.0 - self.target_success_rate)\n            * torch.log(1.0 - rates + self.epsilon)\n        )\n        log_epsilon = torch.full_like(log_weight, math.log(self.epsilon))\n        logits = torch.logaddexp(torch.maximum(log_weight, log_epsilon), log_epsilon)\n        return torch.softmax(logits / max(self.temperature, 1.0), dim=0)\n\n    @torch.no_grad()\n    def sample(self, num_resets, mode=None):\n        if isinstance(num_resets, bool) or int(num_resets) != num_resets or num_resets < 0:\n            raise ValueError(\"num_resets must be a nonnegative integer\")\n        if num_resets == 0:\n            return torch.empty(0, dtype=torch.long, device=self.device)\n        return torch.multinomial(self.probabilities(mode), int(num_resets),\n                                 replacement=True, generator=self.generator)\n\n    @torch.no_grad()\n    def metrics(self, step=0, family_id=None, num_families=3):\n        \"\"\"Return scalar device tensors; logging may transfer them in one batch.\"\"\"\n        probabilities = self.probabilities()\n        visited = self.count > 0\n        num_visited = visited.sum().clamp_min(1)\n        ages = torch.where(visited, (int(step) - self.last_seen).clamp_min(0), 0)\n        rates = self.success_rates()\n        result = {\n            \"visited_fraction\": visited.float().mean(),\n            \"unknown_count\": (~visited).sum(),\n            \"history_count_mean\": self.count.float().mean(),\n            \"history_count_min\": self.count.min(),\n            \"history_count_max\": self.count.max(),\n            \"visits_total\": self.visits_total.sum(),\n            \"success_rate_visited_mean\": (rates * visited).sum() / num_visited,\n            \"history_success_rate\": (\n                self.success_sum.sum().float() / self.count.sum().clamp_min(1)),\n            \"last_visit_age_mean\": ages.sum().float() / num_visited,\n            \"last_visit_age_max\": ages.max(),\n            \"sampling_entropy\": -(probabilities * probabilities.clamp_min(\n                torch.finfo(probabilities.dtype).tiny).log()).sum(),\n            \"effective_configs\": 1.0 / probabilities.square().sum(),\n            \"probability_min\": probabilities.min(),\n            \"probability_max\": probabilities.max(),\n        }\n        if family_id is not None:\n            families = _integer_vector(family_id, self.device, \"family_id\")\n            if families.shape != self.count.shape:\n                raise ValueError(\"family_id must have one entry per configuration\")\n            if type(num_families) is not int or num_families < 1:\n                raise ValueError(\"num_families must be a positive integer\")\n            _assert_device(((families >= 0) & (families < num_families)).all(),\n                           \"family_id outside the supplied family count\")\n            # The count comes from bank metadata, without a GPU scalar read.\n            # This small logging loop does not iterate over reset configurations.\n            for family in range(num_families):\n                mask = families == family\n                result[\"family_{}_probability\".format(family)] = probabilities[mask].sum()\n                result[\"family_{}_visits\".format(family)] = self.visits_total[mask].sum()\n        return result\n\n    def _parameters(self):\n        return {\n            \"num_configs\": self.num_configs, \"history_size\": self.history_size,\n            \"target_success_rate\": self.target_success_rate,\n            \"concentration\": self.concentration, \"temperature\": self.temperature,\n            \"epsilon\": self.epsilon, \"p_init\": self.p_init, \"mode\": self.mode,\n        }\n\n    def state_dict(self):\n        \"\"\"A detached CPU snapshot, including the sampler's own RNG.\"\"\"\n        return {\n            \"state_version\": self.STATE_VERSION,\n            \"parameters\": self._parameters(),\n            \"tensors\": {name: getattr(self, name).detach().cpu().clone()\n                        for name in self._TENSOR_STATE},\n            \"rng_device_type\": self.device.type,\n            \"rng_state\": self.generator.get_state().cpu().clone(),\n        }\n\n    def load_state_dict(self, state):\n        \"\"\"Validate a matching snapshot before replacing any sampler state.\"\"\"\n        if state.get(\"state_version\") != self.STATE_VERSION:\n            raise ValueError(\"unsupported sampler state version\")\n        if state.get(\"parameters\") != self._parameters():\n            raise ValueError(\"sampler checkpoint parameters do not match\")\n        if state.get(\"rng_device_type\") != self.device.type:\n            raise ValueError(\"exact RNG restore requires the same device type (CPU/CUDA)\")\n        loaded = {}\n        for name in self._TENSOR_STATE:\n            value = state.get(\"tensors\", {}).get(name)\n            reference = getattr(self, name)\n            if not isinstance(value, torch.Tensor) or value.shape != reference.shape:\n                raise ValueError(\"invalid sampler checkpoint tensor: \" + name)\n            if value.dtype != reference.dtype:\n                raise ValueError(\"invalid sampler checkpoint dtype: \" + name)\n            loaded[name] = value.detach().cpu().clone()\n        count, head = loaded[\"count\"], loaded[\"head\"]\n        if not bool(((count >= 0) & (count <= self.history_size)).all()):\n            raise ValueError(\"invalid history counts\")\n        if not bool(((head >= 0) & (head < self.history_size)).all()):\n            raise ValueError(\"invalid ring pointers\")\n        if not torch.equal(loaded[\"history\"].sum(dim=1), loaded[\"success_sum\"]):\n            raise ValueError(\"history success sums do not match\")\n        if not bool((loaded[\"success_sum\"] <= count).all()):\n            raise ValueError(\"more successes than valid history outcomes\")\n        if not bool((loaded[\"visits_total\"] >= count).all()):\n            raise ValueError(\"invalid cumulative visit counts\")\n        if not torch.equal(loaded[\"visits_total\"].remainder(self.history_size), head):\n            raise ValueError(\"ring pointers do not match cumulative visit counts\")\n        if not torch.equal(loaded[\"visits_total\"].clamp(max=self.history_size), count):\n            raise ValueError(\"history counts do not match cumulative visit counts\")\n        if not bool(((count == 0) == (loaded[\"last_seen\"] == -1)).all()):\n            raise ValueError(\"last_seen does not match visited configurations\")\n        rng = torch.Generator(device=self.device)\n        rng.set_state(state[\"rng_state\"].cpu())\n        for name, value in loaded.items():\n            getattr(self, name).copy_(value.to(self.device))\n        self.generator.set_state(rng.get_state())\n\n\nclass ConfigurationBank:\n    \"\"\"Versioned, tensor-only physical reset bank.\n\n    Validation checks storage integrity and simple state invariants; it does not\n    replace simulator collision/contact validation. Treat tensors/metadata as\n    immutable after construction so a configuration ID retains its meaning.\n    \"\"\"\n\n    SCHEMA_VERSION = 1\n    REQUIRED_METADATA = (\n        \"object_name\", \"robot_asset\", \"num_dofs\", \"num_bodies\", \"hold_steps\",\n        \"lifted_threshold\", \"version\",\n    )\n    REQUIRED_TENSORS = (\n        \"family_id\", \"robot_root\", \"object_root\", \"table_root\", \"rigid_body_state\",\n        \"ee_jacobian\",\n        \"dof_pos\", \"dof_vel\", \"ee_goal_cart\", \"ee_goal_orn_rpy\",\n        \"gripper_target\", \"table_vy\", \"rotation_enabled\",\n        \"table_yaw_rate\", \"table_height\",\n    )\n\n    def __init__(self, tensors, metadata, device=None):\n        if not isinstance(tensors, dict) or not isinstance(metadata, dict):\n            raise ValueError(\"bank tensors and metadata must be dictionaries\")\n        self.metadata = json.loads(json.dumps(metadata, sort_keys=True, allow_nan=False))\n        self.tensors = {}\n        for name, value in tensors.items():\n            if not isinstance(value, torch.Tensor):\n                raise ValueError(\"bank field must be a tensor: \" + name)\n            self.tensors[name] = value.detach().clone().to(\n                device=device if device is not None else value.device)\n        if \"family_id\" not in self.tensors or self.tensors[\"family_id\"].ndim != 1:\n            raise ValueError(\"family_id must be a one-dimensional tensor\")\n        self.num_configs = self.tensors[\"family_id\"].numel()\n        self.device = self.tensors[\"family_id\"].device\n        self.validate()\n        self.fingerprint = self._fingerprint()\n\n    @property\n    def family_names(self):\n        \"\"\"Legacy generic banks omit names; current physical profiles declare them.\"\"\"\n        return tuple(self.metadata.get(\"family_names\", RESET_FAMILIES))\n\n    def validate(self, expected_metadata=None):\n        missing = set(self.REQUIRED_METADATA) - self.metadata.keys()\n        if missing:\n            raise ValueError(\"missing bank metadata: \" + \", \".join(sorted(missing)))\n        missing = set(self.REQUIRED_TENSORS) - self.tensors.keys()\n        if missing:\n            raise ValueError(\"missing bank tensors: \" + \", \".join(sorted(missing)))\n        if self.num_configs <= 0:\n            raise ValueError(\"configuration bank must not be empty\")\n        for name in (\"object_name\", \"robot_asset\"):\n            if not isinstance(self.metadata[name], str) or not self.metadata[name]:\n                raise ValueError(\"invalid bank metadata: \" + name)\n        for name in (\"num_dofs\", \"num_bodies\", \"hold_steps\"):\n            if type(self.metadata[name]) is not int or self.metadata[name] <= 0:\n                raise ValueError(\"bank metadata must be a positive integer: \" + name)\n        if not self.metadata[\"version\"]:\n            raise ValueError(\"bank version must be nonempty\")\n        threshold = self.metadata[\"lifted_threshold\"]\n        if not isinstance(threshold, (int, float)) or not math.isfinite(threshold) or threshold <= 0:\n            raise ValueError(\"lifted_threshold must be finite and positive\")\n        if expected_metadata:\n            _validate_metadata_subset(self.metadata, expected_metadata)\n        if \"family_names\" in self.metadata:\n            names = self.metadata[\"family_names\"]\n            if (not isinstance(names, list) or not names\n                    or any(not isinstance(name, str) or not name for name in names)\n                    or len(set(names)) != len(names)):\n                raise ValueError(\"family_names must contain distinct nonempty names\")\n\n        shapes = {\n            \"family_id\": (self.num_configs,),\n            \"robot_root\": (self.num_configs, 13),\n            \"object_root\": (self.num_configs, 13),\n            \"table_root\": (self.num_configs, 13),\n            \"rigid_body_state\": (self.num_configs, self.metadata[\"num_bodies\"], 13),\n            \"ee_jacobian\": (self.num_configs, 6, 6),\n            \"dof_pos\": (self.num_configs, self.metadata[\"num_dofs\"]),\n            \"dof_vel\": (self.num_configs, self.metadata[\"num_dofs\"]),\n            \"ee_goal_cart\": (self.num_configs, 3),\n            \"ee_goal_orn_rpy\": (self.num_configs, 3),\n            \"table_vy\": (self.num_configs,),\n            \"rotation_enabled\": (self.num_configs,),\n            \"table_yaw_rate\": (self.num_configs,),\n            \"table_height\": (self.num_configs,),\n            \"table_change_interval\": (self.num_configs,),\n        }\n        for name, value in self.tensors.items():\n            if value.device != self.device:\n                raise ValueError(\"all bank tensors must be on the same device\")\n            if value.ndim == 0 or value.shape[0] != self.num_configs:\n                raise ValueError(\"bank field has inconsistent configuration count: \" + name)\n            if name in shapes and tuple(value.shape) != shapes[name]:\n                raise ValueError(\"invalid bank tensor shape: \" + name)\n            if name in (\"family_id\", \"rotation_enabled\"):\n                expected_dtype = torch.long if name == \"family_id\" else torch.bool\n                if value.dtype != expected_dtype:\n                    raise ValueError(\"invalid bank tensor dtype: \" + name)\n            elif name == \"table_change_interval\":\n                if value.dtype == torch.bool or value.is_complex():\n                    raise ValueError(\"table_change_interval must contain integers in [40, 60)\")\n                valid = (torch.isfinite(value) & (value >= 40) & (value < 60)\n                         & (value == value.long()))\n                if not bool(valid.all()):\n                    raise ValueError(\"table_change_interval must contain integers in [40, 60)\")\n            elif not value.is_floating_point() or not bool(torch.isfinite(value).all()):\n                raise ValueError(\"bank state must contain finite floating values: \" + name)\n        gripper = self.tensors[\"gripper_target\"]\n        if gripper.ndim != 2 or not 0 < gripper.shape[1] <= self.metadata[\"num_dofs\"]:\n            raise ValueError(\"gripper_target must have shape [N, G], with 0 < G <= D\")\n        families = self.tensors[\"family_id\"]\n        if not bool(((families >= 0) & (families < len(self.family_names))).all()):\n            raise ValueError(\"family_id outside the declared family_names\")\n        for name in (\"robot_root\", \"object_root\", \"table_root\", \"rigid_body_state\"):\n            norms = self.tensors[name][..., 3:7].norm(dim=-1)\n            if not bool(torch.isclose(norms, torch.ones_like(norms), atol=1e-3, rtol=1e-3).all()):\n                raise ValueError(\"root quaternion must be normalized: \" + name)\n        physical = self.metadata.get(\"physical_validation\", {})\n        if not isinstance(physical, dict):\n            raise ValueError(\"physical_validation must be a metadata dictionary\")\n        profile = physical.get(\"validation_profile\")\n        geometry_profile = profile in SUPPORTED_FAMILY_PROFILES\n        if geometry_profile:\n            for name, expected in ((\"passed\", True), (\"feet_near_ground\", True),\n                                   (\"collision_checked\", True), (\"object_attachment\", False)):\n                if physical.get(name) is not expected:\n                    raise ValueError(\"invalid \" + profile + \" validation flag: \" + name)\n            if physical.get(\"grounded_initial_states\", False):\n                raise ValueError(profile + \" does not certify stable grounded_initial_states\")\n            if self.metadata.get(\"family_names\") != list(SUPPORTED_FAMILY_PROFILES[profile]):\n                raise ValueError(profile + \" requires family_names \"\n                                 + \"/\".join(SUPPORTED_FAMILY_PROFILES[profile]))\n        if geometry_profile or physical.get(\"grounded_initial_states\", False):\n            from utils.sgs_grounding import (\n                APPROX_GROUND_LIMITS, FOOT_RADIUS, approx_grounded_mask, grounded_mask)\n            grounding = physical.get(\"grounding\", {})\n            if not isinstance(grounding, dict):\n                raise ValueError(\"invalid grounding geometry metadata\")\n            indices = grounding.get(\"foot_body_indices\", [])\n            if (not isinstance(indices, list) or len(indices) != 4\n                    or any(type(i) is not int or not 0 <= i < self.metadata[\"num_bodies\"]\n                           for i in indices) or len(set(indices)) != 4\n                    or grounding.get(\"foot_radius_m\") != FOOT_RADIUS):\n                raise ValueError(\"invalid grounding geometry metadata\")\n            bottom = self.tensors[\"rigid_body_state\"][:, indices, 2] - FOOT_RADIUS\n        if geometry_profile:\n            if grounding.get(\"limits\") != APPROX_GROUND_LIMITS:\n                raise ValueError(\"invalid \" + profile + \" grounding limits\")\n            if not bool(approx_grounded_mask(bottom).all()):\n                raise ValueError(\"bank contains initial feet outside approximate ground limits\")\n        elif physical.get(\"grounded_initial_states\", False):\n            forces = self.tensors.get(\"initial_foot_contact_force\")\n            if forces is None or tuple(forces.shape) != (self.num_configs, 4, 3):\n                raise ValueError(\"grounded bank requires initial foot contact forces\")\n            if not bool(grounded_mask(self.tensors[\"robot_root\"], bottom, forces).all()):\n                raise ValueError(\"bank contains ungrounded or unsettled initial states\")\n        if geometry_profile and \"near_goal\" in self.family_names:\n            self._validate_near_goal()\n        return self\n\n    def _validate_near_goal(self):\n        \"\"\"Validate saved grasp evidence; no contacts are synthesized at reset.\"\"\"\n        physical = self.metadata[\"physical_validation\"]\n        if (physical.get(\"near_goal_grasp_verified\") is not True\n                or physical.get(\"stable_standing_required\") is not False):\n            raise ValueError(\"near_goal requires grasp validation without stable standing\")\n        near = self.tensors[\"family_id\"] == self.family_names.index(\"near_goal\")\n        if not bool(near.any()):\n            raise ValueError(\"near_goal profile requires nonempty near_goal states\")\n        initial_height = self.metadata.get(\"object_init_height_m\")\n        if (type(initial_height) not in (int, float) or not math.isfinite(initial_height)\n                or initial_height <= 0):\n            raise ValueError(\"near_goal requires positive object_init_height_m\")\n        cfg = self.metadata.get(\"construction\", {}).get(\"reset_config\", {}).get(\"near_goal\")\n        if not isinstance(cfg, dict):\n            raise ValueError(\"near_goal requires its effective construction config\")\n        bounds = cfg.get(\"object_lift_height_range_m\")\n        if (not isinstance(bounds, list) or len(bounds) != 2\n                or any(type(v) not in (int, float) or not math.isfinite(v) for v in bounds)\n                or not 0 < bounds[0] <= bounds[1] < self.metadata[\"lifted_threshold\"]):\n            raise ValueError(\"near_goal lift range must be positive and below the task success threshold\")\n        values = {}\n        for name in (\"lift_height\", \"near_goal_relative_slip_m\", \"near_goal_relative_rotation_deg\",\n                     \"near_goal_contact_fraction\", \"near_goal_object_speed_m_s\",\n                     \"near_goal_restore_verified\"):\n            value = self.tensors.get(name)\n            if value is None or value.shape != (self.num_configs,):\n                raise ValueError(\"near_goal requires a per-configuration evidence tensor: \" + name)\n            values[name] = value[near]\n        height = (self.tensors[\"object_root\"][near, 2] - self.tensors[\"table_height\"][near]\n                  - initial_height)\n        if not torch.allclose(height, values[\"lift_height\"], atol=1e-5, rtol=0):\n            raise ValueError(\"near_goal lift_height disagrees with saved object/table geometry\")\n        tolerance = .005 if bounds[0] == bounds[1] else 0.\n        if not bool(((height >= bounds[0] - tolerance - 1e-6)\n                     & (height <= bounds[1] + tolerance + 1e-6)\n                     & (height > 0) & (height < self.metadata[\"lifted_threshold\"])).all()):\n            raise ValueError(\"near_goal actual lift height is outside its range or already successful\")\n        for name, limit_key in ((\"near_goal_relative_slip_m\", \"max_relative_slip_m\"),\n                                (\"near_goal_relative_rotation_deg\", \"max_relative_rotation_deg\"),\n                                (\"near_goal_object_speed_m_s\", \"max_object_speed_m_s\")):\n            limit = cfg.get(limit_key)\n            if type(limit) not in (int, float) or not math.isfinite(limit) or limit <= 0:\n                raise ValueError(\"near_goal requires a positive \" + limit_key)\n            if not bool(((values[name] >= 0) & (values[name] <= limit + 1e-6)).all()):\n                raise ValueError(\"near_goal invalid grasp evidence: \" + name)\n        actual_speed = self.tensors[\"object_root\"][near, 7:10].norm(dim=1)\n        if not bool((actual_speed <= values[\"near_goal_object_speed_m_s\"] + 1e-6).all()):\n            raise ValueError(\"near_goal object speed evidence understates saved object velocity\")\n        contact_min = cfg.get(\"min_contact_fraction\")\n        if (type(contact_min) not in (int, float) or not math.isfinite(contact_min)\n                or not 0 < contact_min <= 1):\n            raise ValueError(\"near_goal requires min_contact_fraction in (0, 1]\")\n        if not bool(((values[\"near_goal_contact_fraction\"] >= contact_min - 1e-6)\n                     & (values[\"near_goal_contact_fraction\"] <= 1)).all()):\n            raise ValueError(\"near_goal insufficient finger contact evidence\")\n        if not bool((values[\"near_goal_restore_verified\"] == 1).all()):\n            raise ValueError(\"near_goal requires successful cold restore verification\")\n        # This profile is specifically for the one-DOF B1Z1 gripper, whose upper\n        # limit (zero) is the closed control target. Actual DOF stays unconstrained:\n        # contact with the object normally prevents it reaching that target.\n        if not bool((self.tensors[\"gripper_target\"][near].abs() < 1e-5).all()):\n            raise ValueError(\"near_goal requires a saved closed gripper target\")\n\n    def _fingerprint(self):\n        digest = hashlib.sha256()\n        digest.update(json.dumps(\n            {\"schema_version\": self.SCHEMA_VERSION, \"metadata\": self.metadata},\n            sort_keys=True, separators=(\",\", \":\"), allow_nan=False).encode(\"utf-8\"))\n        for name in sorted(self.tensors):\n            tensor = self.tensors[name].detach().cpu().contiguous()\n            digest.update(json.dumps(\n                [name, str(tensor.dtype), list(tensor.shape)], separators=(\",\", \":\")).encode(\"utf-8\"))\n            digest.update(tensor.numpy().tobytes())\n        return digest.hexdigest()\n\n    def batch(self, config_ids):\n        ids = _integer_vector(config_ids, self.device, \"config_ids\")\n        if ids.numel():\n            _assert_device(((ids >= 0) & (ids < self.num_configs)).all(),\n                           \"configuration ID outside the fixed bank\")\n        return {name: values[ids] for name, values in self.tensors.items()}\n\n    def state_dict(self):\n        self.validate()\n        fingerprint = self._fingerprint()\n        if fingerprint != self.fingerprint:\n            raise ValueError(\"configuration bank was mutated after construction\")\n        return {\n            \"schema_version\": self.SCHEMA_VERSION,\n            \"metadata\": json.loads(json.dumps(self.metadata)),\n            \"tensors\": {name: values.detach().cpu().clone()\n                        for name, values in self.tensors.items()},\n            \"fingerprint\": fingerprint,\n        }\n\n    def save(self, path):\n        path = Path(path)\n        path.parent.mkdir(parents=True, exist_ok=True)\n        payload = self.state_dict()\n        descriptor, temporary = tempfile.mkstemp(prefix=path.name + \".\", dir=str(path.parent))\n        os.close(descriptor)\n        try:\n            torch.save(payload, temporary)\n            os.replace(temporary, path)\n        finally:\n            if os.path.exists(temporary):\n                os.unlink(temporary)\n\n    @classmethod\n    def load(cls, path, device=\"cpu\", expected_metadata=None):\n        payload = torch.load(path, map_location=\"cpu\", weights_only=True)\n        if not isinstance(payload, dict) or payload.get(\"schema_version\") != cls.SCHEMA_VERSION:\n            raise ValueError(\"unsupported configuration bank schema\")\n        bank = cls(payload[\"tensors\"], payload[\"metadata\"], device=device)\n        if bank.fingerprint != payload.get(\"fingerprint\"):\n            raise ValueError(\"configuration bank fingerprint mismatch\")\n        bank.validate(expected_metadata)\n        return bank\n","sha256":"7ec2423a8366a8f408aac4a664b09e60ef2affa23f81cd49c033d5544fbd2ac1"},"DQ_high-level/envs/b1z1_pickmulti.py":{"text":"import numpy as np\nimport os\nimport torch\nimport cv2\nfrom typing import Dict, Any, Tuple, List, Set\nfrom collections import defaultdict\nimport wandb\nfrom termcolor import cprint    \nfrom tqdm import tqdm\n\nfrom .b1z1_base import B1Z1Base, reindex_all, reindex_feet, LIN_VEL_X_CLIP, ANG_VEL_YAW_CLIP, torch_rand_int\nfrom utils.low_level_model import ActorCritic\nfrom utils.config import load_cfg, get_params, copy_cfg\nfrom utils.pick_success import lifted_grasp_mask, advance_pick_hold, RollingEpisodeSuccess\nfrom modules.pose_prediction import RollingSE3Predictor\nfrom utils.object_pose import object_pose_in_teacher_frame\nfrom PredictPiontTransform.predictpoint_mul import PredictPoint\nimport time\n\nfrom isaacgym import gymapi\nfrom isaacgym import gymtorch\nfrom isaacgym import gymutil\nfrom isaacgym.torch_utils import *\nfrom torch import Tensor\nimport torchvision.transforms as transforms\n\n\nclass B1Z1PickMulti(B1Z1Base,PredictPoint):\n    def __init__(self, cfg_terrain=None, table_height=None,camera_6p_tensor=None, grasp_cv_tensor=None, cube_init_tensor=None, eval=False, *args, **kwargs):\n        self.cfg_terrain = cfg_terrain\n        self.eval = eval\n        self.num_actors = 3\n        cprint(f\"B1Z1PickMulti is called\",\"cyan\")\n\n        B1Z1Base.__init__(self, *args, eval=eval, **kwargs)\n        PredictPoint.__init__(self, camera_6p_tensor, grasp_cv_tensor, cube_init_tensor, device=self.device)\n        # Standalone rollout tools can supply this through cfg without parsing\n        # their own command-line options again as training arguments.\n        total_timesteps = self.cfg[\"env\"].get(\"totalTimesteps\")\n        if total_timesteps is None:\n            total_timesteps = get_params().timesteps\n        self.near_goal_stop = self.cfg[\"env\"].get(\"near_goal_stop\", False)\n        self.obj_move_prob = self.cfg[\"env\"].get(\"obj_move_prob\", 0.0)\n        self.table_heights_fix = table_height\n        self.total_timesteps = total_timesteps\n        self.train_reward_strict = total_timesteps / 2\n        self._init_sgs()\n        self._init_tsil()\n\n    def _init_tsil(self):\n        \"\"\"Persistent TSIL targets follow configurations, never simulator slots.\"\"\"\n        self.tsil_state = None\n        if not self.tsil_enabled:\n            return\n        from utils.tsil import TemporalState, geometry_descriptors, GEOMETRY_DESCRIPTOR_SCHEMA\n\n        if self.cfg[\"reward\"][\"only_positive_rewards\"]:\n            raise ValueError(\"TSIL requires only_positive_rewards=False for exact reward relabeling\")\n        if self.enable_camera or self.floating_base or self.obj_move_prob:\n            raise ValueError(\"TSIL requires the nonvisual walking teacher and obj_move_prob=0\")\n        if not self.sgs_enabled and not self.eval:\n            raise ValueError(\"TSIL training requires the SGS configuration bank\")\n        if self.sgs_enabled:\n            bank = self.sgs_bank\n            descriptors = geometry_descriptors(\n                bank.tensors[\"robot_root\"], bank.tensors[\"object_root\"],\n                bank.tensors[\"table_height\"], bank.tensors[\"dof_pos\"])\n            self.tsil_state = TemporalState(\n                bank.num_configs, self.tsil_time_reference, device=self.device,\n                bank_fingerprint=bank.fingerprint,\n                family_ids=bank.tensors[\"family_id\"], descriptors=descriptors,\n                descriptor_schema=GEOMETRY_DESCRIPTOR_SCHEMA)\n        else:\n            # Strict evaluation loads matching checkpoint targets/descriptors\n            # into this object before its first ordinary, non-SGS reset.\n            self.tsil_state = TemporalState(0, self.tsil_time_reference, device=self.device)\n\n    def _reset_tsil_state(self, env_ids):\n        if not getattr(self, \"tsil_enabled\", False) or len(env_ids) == 0:\n            return\n        self.tsil_elapsed[env_ids] = 0\n        self.tsil_episode_id[env_ids] += 1\n        if getattr(self, \"sgs_enabled\", False):\n            from utils.tsil import LOOKUP_CONFIGURATION\n            self.tsil_episode_D[env_ids] = self.tsil_state.targets[self.active_config_id[env_ids]]\n            self.tsil_lookup_status[env_ids] = LOOKUP_CONFIGURATION\n        else:\n            from utils.tsil import geometry_descriptors\n            descriptor = geometry_descriptors(\n                self._robot_root_states[env_ids], self._cube_root_states[env_ids],\n                self.table_heights[env_ids], self._dof_pos[env_ids])\n            target, status = self.tsil_state.lookup_targets(descriptor, return_status=True)\n            self.tsil_episode_D[env_ids] = target\n            self.tsil_lookup_status[env_ids] = status\n\n    def _tsil_observations(self, env_ids):\n        if not getattr(self, \"tsil_enabled\", False):\n            return self.obs_buf.new_empty((len(env_ids), 0))\n        return torch.stack((self.tsil_elapsed[env_ids], self.tsil_episode_D[env_ids]),\n                           dim=-1) / self.tsil_time_reference\n\n    def _record_tsil_transition(self):\n        \"\"\"Publish owned pre-reset data; replay never reads mutable env buffers.\"\"\"\n        if not getattr(self, \"tsil_enabled\", False):\n            return\n        config_ids = (self.active_config_id if self.sgs_enabled else\n                      torch.full_like(self.tsil_episode_id, -1))\n        step_seconds = self.control_freq_low * self.dt\n        fields = {\n            \"config_id\": config_ids,\n            \"episode_id\": self.tsil_episode_id,\n            \"elapsed\": self.tsil_elapsed,\n            \"elapsed_before\": self.tsil_elapsed - step_seconds,\n            \"success\": self.pick_success,\n            \"reward_fixed\": self.tsil_reward_fixed,\n            \"reward_command_raw\": self.tsil_reward_command_raw,\n            \"episode_D\": self.tsil_episode_D,\n        }\n        self.extras[\"tsil\"] = {name: value.detach().clone() for name, value in fields.items()}\n        self.extras[\"tsil\"][\"command_gate\"] = self.global_step_counter >= self.train_reward_strict\n\n    def _init_sgs(self):\n        \"\"\"Load one immutable bank; all online sampler state stays on the GPU.\"\"\"\n        from utils.sgs import (ConfigurationBank, SGSSampler, SUPPORTED_FAMILY_PROFILES,\n                               validate_task_hold_steps)\n        from utils.episode_statistics import RecentEpisodeStatistics\n\n        cfg = self.cfg[\"env\"].get(\"sgs\", {})\n        self.sgs_enabled = cfg.get(\"mode\", \"disabled\") != \"disabled\"\n        if not self.sgs_enabled:\n            return\n        if len(self.obj_list) != 1 or self.table_level != \"Level02\":\n            raise ValueError(\"SGS requires a single object and Level02\")\n        if self.enable_camera or self.floating_base or self.obj_move_prob:\n            raise ValueError(\"SGS requires the nonvisual walking teacher and obj_move_prob=0\")\n        self.sgs_bank = ConfigurationBank.load(\n            cfg.get(\"bank_path\", \"\"), device=self.device,\n            expected_metadata={\n                \"object_name\": self.obj_list[0],\n                \"robot_asset\": self.cfg[\"env\"][\"asset\"][\"assetFileRobot\"],\n                \"num_dofs\": self.num_dofs,\n                \"num_bodies\": self._rigid_body_pos.shape[1],\n                \"lifted_threshold\": self.lifted_success_threshold,\n                \"table_level\": \"Level02\",\n                \"physical_validation\": {\n                    \"passed\": True,\n                },\n            })\n        self.sgs_hold_compatibility = validate_task_hold_steps(\n            self.sgs_bank.metadata, self.hold_steps)\n        physical = self.sgs_bank.metadata.get(\"physical_validation\", {})\n        profile = physical.get(\"validation_profile\")\n        self.sgs_family_names = self.sgs_bank.family_names\n        if (profile not in SUPPORTED_FAMILY_PROFILES\n                or self.sgs_family_names != SUPPORTED_FAMILY_PROFILES[profile]):\n            raise ValueError(\"SGS requires supported validation profile and family_names\")\n        if \"near_goal\" in self.sgs_family_names and not torch.allclose(\n                self.init_height, torch.full_like(self.init_height,\n                                                 self.sgs_bank.metadata[\"object_init_height_m\"]),\n                atol=1e-6, rtol=0):\n            raise ValueError(\"SGS object_init_height_m does not match the task object\")\n        expected_size = cfg.get(\"bank_size\")\n        if expected_size is not None and (type(expected_size) is not int or expected_size <= 0):\n            raise ValueError(\"SGS bank_size must be null (automatic) or a positive integer\")\n        if expected_size is not None and self.sgs_bank.num_configs != expected_size:\n            raise ValueError(\"SGS bank_size does not match the loaded bank\")\n        num_families = len(self.sgs_family_names)\n        families = torch.bincount(self.sgs_bank.tensors[\"family_id\"], minlength=num_families)\n        if (self.sgs_bank.num_configs % num_families\n                or not bool(((families > 0) & (families == self.sgs_bank.num_configs // num_families)).all())):\n            raise ValueError(\"SGS requires equal nonempty reset families\")\n        self.sgs_sampler = SGSSampler(\n            self.sgs_bank.num_configs, history_size=cfg.get(\"history_size\", 100),\n            target_success_rate=cfg.get(\"target_success\", 0.5),\n            concentration=cfg.get(\"kappa\", 1.0), temperature=cfg.get(\"temperature\", 2.0),\n            epsilon=cfg.get(\"epsilon\", 1e-4), p_init=cfg.get(\"p_init\", 0.0),\n            seed=self.cfg.get(\"seed\", 43), device=self.device, mode=cfg[\"mode\"])\n        self.active_config_id = torch.full((self.num_envs,), -1, dtype=torch.long, device=self.device)\n        self._sgs_pending_done = torch.zeros(self.num_envs, dtype=torch.bool, device=self.device)\n        self._sgs_pending_reset = torch.zeros_like(self._sgs_pending_done)\n        self._sgs_has_pending_reset = False\n        self._sgs_natural_reset = False\n        self.sgs_family_episodes = torch.zeros(num_families, dtype=torch.long, device=self.device)\n        self.sgs_family_successes = torch.zeros(num_families, dtype=torch.long, device=self.device)\n        self.sgs_family_samples = torch.zeros(num_families, dtype=torch.long, device=self.device)\n        # Display-only windows, independent of the per-configuration SGS history.\n        self.recent_episode_stats = RecentEpisodeStatistics(\n            num_families, device=self.device, family_window=100)\n        self.sgs_aborted = torch.zeros((), dtype=torch.long, device=self.device)\n        print(\"SGS bank:\", self.sgs_bank.num_configs, \"configurations;\",\n              self.sgs_bank.fingerprint, \"; device:\", self.device,\n              \"; bank hold_steps:\", self.sgs_bank.metadata[\"hold_steps\"],\n              \"; task hold_steps:\", self.hold_steps,\n              \"; compatibility:\", self.sgs_hold_compatibility)\n\n    def reset(self):\n        # Trainer reset() follows a real terminal transition. Direct reset_idx()\n        # cancels a trial and must not add a fabricated failure to its history.\n        if not getattr(self, \"sgs_enabled\", False):\n            return super().reset()\n        self._sgs_natural_reset = True\n        try:\n            return super().reset()\n        finally:\n            self._sgs_natural_reset = False\n\n    def _reset_sgs_envs(self, env_ids):\n        if len(env_ids) == 0:\n            return\n        old_ids = self.active_config_id[env_ids]\n        started = old_ids >= 0\n        completed = started & self._sgs_pending_done[env_ids] & self._sgs_natural_reset\n        done_envs, done_ids = env_ids[completed], old_ids[completed]\n        successes = self.episode_success[done_envs]\n        self.sgs_sampler.observe(done_ids, successes, step=self.global_step_counter)\n        done_families = self.sgs_bank.tensors[\"family_id\"][done_ids]\n        self.sgs_family_episodes.scatter_add_(0, done_families, torch.ones_like(done_ids))\n        self.sgs_family_successes.scatter_add_(0, done_families, successes.long())\n        # Within each family, same-step completions use env_ids order (normally\n        # ascending environment ID) to break ties at the window boundary.\n        self.recent_episode_stats.record(done_families, successes)\n        self.sgs_aborted += (started & ~completed).sum()\n        # Success counters were already updated by check_termination, exactly\n        # once at completion, independently of the reset sampler.\n        self.episode_counter[env_ids] = self.episode_counter[env_ids].clamp_min(0)\n        self.episode_counter[done_envs] += 1\n        self.episode_step_sum[done_envs] += self.one_epoch_step[done_envs]\n        self.one_epoch_step[env_ids] = 0\n\n        new_ids = self.sgs_sampler.sample(len(env_ids))\n        self.active_config_id[env_ids] = new_ids\n        self._sgs_pending_done[env_ids] = False\n        state = self.sgs_bank.batch(new_ids)\n        self.sgs_family_samples.scatter_add_(0, state[\"family_id\"], torch.ones_like(new_ids))\n\n        # Only clear episode/controller history. Do not invoke the old reset's\n        # global simulate(): an asynchronous reset must not advance other trials.\n        B1Z1Base._reset_env_tensors(self, env_ids)\n        self._reset_pick_state(env_ids)\n        # A bank can jump directly into a grasp. Keep its controller/cache\n        # isolation intact while sharing task progress and success rules.\n        for name in (\"actions\", \"gait_indices\", \"clock_inputs\", \"gait_wait_timer\",\n                     \"is_walking\", \"low_obs_history_buf\", \"action_data_history_buf\",\n                     \"states_history_buf\", \"timeout_buf\", \"foot_contacts_from_sensor\",\n                     \"force_sensor_tensor\", \"_contact_forces\"):\n            value = getattr(self, name, None)\n            if value is not None:\n                value[env_ids] = 0\n        if \"table_change_interval\" in state:\n            self.rand_change_step[env_ids] = state[\"table_change_interval\"].long()\n        else:\n            self.rand_change_step[env_ids] = torch.randint(40, 60, (len(env_ids),), device=self.device)\n        self.surpass_dist_flag[env_ids] = True\n\n        self._robot_root_states[env_ids] = state[\"robot_root\"]\n        self._table_root_states[env_ids] = state[\"table_root\"]\n        self._cube_root_states[env_ids] = state[\"object_root\"]\n        self._dof_pos[env_ids] = state[\"dof_pos\"]\n        self._dof_vel[env_ids] = state[\"dof_vel\"]\n        self._last_dof_vel[env_ids] = state[\"dof_vel\"]\n        self.curr_ee_goal_cart[env_ids] = state[\"ee_goal_cart\"]\n        self.curr_ee_goal_orn_rpy[env_ids] = state[\"ee_goal_orn_rpy\"]\n        self.gripper_dof_pos[env_ids] = state[\"gripper_target\"]\n        self.gripper_dof_vel[env_ids] = 0\n        self.table_heights[env_ids] = state[\"table_height\"]\n        self.table_commands[env_ids] = 0\n        self.table_commands[env_ids, 4] = state[\"table_height\"] - self.table_dimz / 2\n        self.vel_line_forward_y_level02[env_ids] = state[\"table_vy\"]\n        self.lin_circle_select[env_ids] = state[\"rotation_enabled\"]\n        self.vel_angular_yaw[env_ids] = state[\"table_yaw_rate\"]\n        # Isaac Gym GPU permits one call per state setter between simulate()\n        # calls. The next table-control upload commits these roots and DOFs in\n        # one batch; otherwise its table-only upload can discard this reset.\n        self._sgs_pending_reset[env_ids] = True\n        self._sgs_has_pending_reset = True\n        # Isaac Gym updates forward kinematics at simulate(). Restore validated\n        # caches for the first observation and first IK call, without stepping.\n        self._rigid_body_state.view(self.num_envs, -1, 13)[env_ids] = state[\"rigid_body_state\"]\n        self.ee_j_eef[env_ids] = state[\"ee_jacobian\"]\n        self._update_base_yaw_quat()\n        self.update_roboinfo()\n        self.last_ee_pos[env_ids] = quat_rotate_inverse(\n            self._robot_root_states[env_ids, 3:7], self.ee_pos[env_ids] - self.arm_base[env_ids])\n        self.ee_goal_global_cart[env_ids] = quat_apply(\n            self._robot_root_states[env_ids, 3:7], state[\"ee_goal_cart\"]) + self.arm_base[env_ids]\n        local_orn = quat_from_euler_xyz(*state[\"ee_goal_orn_rpy\"].unbind(-1))\n        self.ee_goal_global_orn_quat[env_ids] = quat_mul(\n            self._robot_root_states[env_ids, 3:7], local_orn)\n        # Use the same distance/height history initialization as an ordinary\n        # reset's final refresh, without advancing any environment's physics.\n        self._update_curr_dist()\n        if self.object_pose_predictor is not None:\n            # SGS bypasses the ordinary reset path. Seed the restored bank pose\n            # before observations, without carrying history across episodes.\n            self.object_pose_predictor.reset(env_ids)\n            self.object_pose_predictor.push(\n                self._cube_root_states[env_ids, :7], self.gym.get_sim_time(self.sim), env_ids)\n        if getattr(self, \"tsil_enabled\", False):\n            self._reset_tsil_state(env_ids)\n        self._compute_observations(env_ids)\n        self._record_sgs_metrics()\n\n    def _record_sgs_metrics(self):\n        metrics = self.sgs_sampler.metrics(\n            step=self.global_step_counter, family_id=self.sgs_bank.tensors[\"family_id\"],\n            num_families=len(self.sgs_family_names))\n        recent = self.recent_episode_stats\n        for i, name in enumerate(self.sgs_family_names):\n            metrics[\"success_\" + name] = recent.family_successes[i] / recent.family_count[i].clamp_min(1)\n            metrics[\"successes_\" + name] = recent.family_successes[i]\n            metrics[\"sample_fraction_\" + name] = self.sgs_family_samples[i] / self.sgs_family_samples.sum().clamp_min(1)\n            metrics[\"episodes_\" + name] = recent.family_count[i]\n        metrics[\"aborted\"] = self.sgs_aborted\n        self.extras[\"SGS\"] = metrics\n        # Transfer scalar diagnostics together. Float64 preserves large integer\n        # episode counters when combining them with floating-point diagnostics.\n        values = torch.stack([value.double() for value in metrics.values()]).detach().cpu().tolist()\n        snapshots = {\"SGS / \" + name: value for name, value in zip(metrics, values)}\n        # Keep the old SGS tags, and expose discoverable success-rate curves.\n        # No completed episodes means unknown, not an observed zero success rate.\n        for name in self.sgs_family_names:\n            episodes = snapshots[\"SGS / episodes_\" + name]\n            if episodes > 0:\n                snapshots[\"SuccessRate / \" + name] = snapshots[\"SGS / successes_\" + name] / episodes\n        self.extras.setdefault(\"success_rate\", {}).update(snapshots)\n        # Window counts and ratios use the latest snapshot, rather than the\n        # logger's ordinary mean over the writing window.\n        self.extras[\"scalar_snapshots\"] = snapshots\n        self._print_sgs_success_rates()\n\n    def _print_sgs_success_rates(self, force=False):\n        step = self.global_step_counter\n        last_step = getattr(self, \"_sgs_last_print_step\", None)\n        interval = getattr(self, \"sgs_log_interval\", 24)\n        if not force and last_step is not None and step - last_step < interval:\n            return\n        snapshots = self.extras.get(\"scalar_snapshots\", {})\n        if not snapshots:\n            return\n        parts = []\n        for name in self.sgs_family_names:\n            successes = int(snapshots[\"SGS / successes_\" + name])\n            episodes = int(snapshots[\"SGS / episodes_\" + name])\n            rate = f\"{100. * successes / episodes:.2f}%\" if episodes else \"N/A\"\n            parts.append(f\"{name}={rate} ({successes}/{episodes})\")\n        suffix = \" final\" if force else \"\"\n        tqdm.write(f\"[SGS step={step}{suffix}] SuccessRate (each family last 100): \"\n                   + \" | \".join(parts))\n        self._sgs_last_print_step = step\n\n    def save_sgs_diagnostics(self, path):\n        \"\"\"Export per-configuration statistics; this is not a training resume.\"\"\"\n        if not getattr(self, \"sgs_enabled\", False):\n            return\n        from pathlib import Path\n        output = Path(path)\n        output.parent.mkdir(parents=True, exist_ok=True)\n        torch.save({\n            \"kind\": \"sgs_diagnostics_not_training_resume\",\n            \"global_step\": self.global_step_counter,\n            \"bank_fingerprint\": self.sgs_bank.fingerprint,\n            \"bank_metadata\": self.sgs_bank.metadata,\n            \"task_hold_steps\": self.hold_steps,\n            \"hold_compatibility\": getattr(self, \"sgs_hold_compatibility\", \"exact\"),\n            \"mode\": self.sgs_sampler.mode,\n            \"family_id\": self.sgs_bank.tensors[\"family_id\"].cpu(),\n            \"success_rate\": self.sgs_sampler.success_rates().cpu(),\n            \"history_count\": self.sgs_sampler.count.cpu(),\n            \"visits_total\": self.sgs_sampler.visits_total.cpu(),\n            \"probability\": self.sgs_sampler.probabilities().cpu(),\n            \"family_samples\": self.sgs_family_samples.cpu(),\n            \"family_episodes\": self.sgs_family_episodes.cpu(),\n            \"family_successes\": self.sgs_family_successes.cpu(),\n            \"recent_family_window\": self.recent_episode_stats.family_window,\n            \"recent_family_episodes\": self.recent_episode_stats.family_count.cpu(),\n            \"recent_family_successes\": self.recent_episode_stats.family_successes.cpu(),\n        }, output)\n\n    def update_roboinfo(self):\n        super().update_roboinfo()\n        base_obj_dis = self._cube_root_states[:, :2] - self.arm_base[:, :2]\n        self.base_obj_dis = torch.norm(base_obj_dis, dim=-1)\n        \n    def _setup_obs_and_action_info(self):\n        self.tsil_enabled = self.cfg[\"env\"].get(\"tsil\", {}).get(\"enabled\", False)\n        self.num_tsil_obs = 2 if self.tsil_enabled else 0\n        self.tsil_time_indices = (-191, -190) if self.tsil_enabled else ()\n        if self.tsil_enabled and (self.no_feature or self.cfg[\"env\"].get(\"lastCommands\", False)):\n            raise ValueError(\"TSIL observations require object features and lastCommands=False\")\n        self.pose_prediction_cfg = self.cfg[\"env\"].get(\"posePrediction\", {})\n        prediction_enabled = self.pose_prediction_cfg.get(\"enabled\", False)\n        if prediction_enabled and (self.no_feature or self.cfg[\"env\"].get(\"lastCommands\", False)):\n            raise ValueError(\"Future pose observations require
