r\"]\n                    weights = (1.0 - error / config[\"max_start_error\"]).clamp(0, 1)\n                    weights = torch.where(torch.isfinite(error), weights, torch.zeros_like(weights)).detach()\n                for name, values in start_errors.items():\n                    metrics[\"validated/start_\" + name + \"_mean\"] = float(values.mean())\n                metrics[\"validated/trusted_start_fraction\"] = float((weights > 0).float().mean())\n                if not bool((weights > 0).any()):\n                    self.wm_status = \"start_error_rejected\"\n                else:\n                    durations = torch.stack([self.wm_adapter.sample_dt(len(starts.state))\n                                             for _ in range(config[\"horizon\"])])\n                    result = self.wm_imagination.update(starts.state, starts.context,\n                                                        weights=weights,\n                                                        anchor_observations=self._anchor_observations(starts),\n                                                        dt=durations)\n                    metrics.update({\"bptt/\" + key: value for key, value in result.items()})\n                    self.wm_status = \"hybrid_updated\" if result.get(\"accepted\", 0) else \"bptt_rejected\"\n        metrics[\"waiting_for_probe\"] = float(self.wm_status == \"waiting_for_probe\")\n        metrics[\"validated_snapshot_available\"] = float(self.wm_has_validated_snapshot)\n        self.last_world_model_metrics = metrics\n        for name, value in metrics.items():\n            self.track_data(\"World model / \" + name, value)\n        return metrics\n\n    def _update(self, timestep, timesteps):\n        super()._update(timestep, timesteps)\n        self._update_world_model()\n","sha256":"9df24c2c9d2024068c5b140657119f94ca92aa6faf3c834447ba58533dbcfe35"},"DQ_high-level/utils/world_model/trainer.py":{"text":"\"\"\"Autoregressive fitting on true actions, with episode-held-out validation.\n\nAdapted from SuperMimic-Reproduced ``world_model/wm_trainer.py`` and\n``world_model/world_model.py`` (MIT); see THIRD_PARTY_LICENSES.md. No Actor or\nCritic is part of this optimizer. Predicted states are never teacher-forced\nbetween steps, while true future states are used only as supervised targets.\n\"\"\"\n\nfrom dataclasses import asdict, dataclass\n\nimport torch\nfrom torch.nn import functional as F\n\n\n@dataclass\nclass WMTrainerConfig:\n    window: int = 3\n    batches_per_update: int = 4\n    batch_size: int = 256\n    learning_rate: float = 2e-4\n    grad_clip: float = 1.0\n    weight_decay: float = 0.0\n    termination_weight: float = 0.1\n    auxiliary_weight: float = 1.0\n    recent_fraction: float = 0.5\n    recent_steps: int = 32\n    validation_batch_size: int = 256\n\n\nclass WorldModelTrainer:\n    def __init__(self, model, config=None):\n        self.model = model\n        self.cfg = config or WMTrainerConfig()\n        if min(self.cfg.window, self.cfg.batches_per_update, self.cfg.batch_size,\n               self.cfg.validation_batch_size) < 1:\n            raise ValueError(\"World-model training dimensions must be positive\")\n        if self.cfg.learning_rate <= 0 or self.cfg.grad_clip <= 0:\n            raise ValueError(\"World-model learning rate and grad clip must be positive\")\n        self.optimizer = torch.optim.Adam(model.parameters(),\n                                          lr=self.cfg.learning_rate,\n                                          weight_decay=self.cfg.weight_decay)\n        self.updates = 0\n\n    def loss_on(self, batch):\n        steps = batch.actions.shape[0]\n        predicted = batch.states[0]\n        errors, term_losses, auxiliary, term_accuracy = [], [], [], []\n        extra_loss = getattr(self.model.spec, \"auxiliary_loss\", None)\n        for index in range(steps):\n            predicted = self.model(predicted, batch.actions[index],\n                                   batch.context[index], batch.dt[index])\n            # No detach and no ground-truth replacement here: model fitting\n            # differentiates the whole open-loop multi-step prediction error.\n            errors.append(self.model.normalized_sq_error(predicted,\n                                                          batch.states[index + 1]))\n            if extra_loss is not None:\n                auxiliary.append(extra_loss(predicted, batch.states[index + 1]))\n            if self.model.term_head is not None:\n                logits = self.model.termination_logits(predicted, batch.context[index])\n                labels = batch.terminated[index].float()\n                term_losses.append(F.binary_cross_entropy_with_logits(logits, labels,\n                                                                      reduction=\"none\"))\n                term_accuracy.append(((logits > 0) == labels.bool()).float().detach())\n        error = torch.stack(errors)\n        state_loss = error.mean()\n        term_loss = (torch.stack(term_losses).mean() if term_losses else\n                     state_loss.new_zeros(()))\n        extra = (torch.stack(auxiliary).mean() if auxiliary else state_loss.new_zeros(()))\n        loss = state_loss + self.cfg.termination_weight * term_loss + self.cfg.auxiliary_weight * extra\n        metrics = {\"state_loss\": state_loss.detach(), \"termination_bce\": term_loss.detach(),\n                   \"auxiliary_loss\": extra.detach(), \"nse_1step\": error[0].mean().detach(),\n                   \"nse_kstep\": error[-1].mean().detach(), \"loss\": loss.detach()}\n        if term_accuracy:\n            metrics[\"termination_accuracy\"] = torch.stack(term_accuracy).mean()\n        return loss, metrics\n\n    def update(self, replay):\n        if not replay.can_sample(self.cfg.window, \"train\"):\n            return {\"skipped_no_windows\": 1.0, \"updates\": float(self.updates)}\n        self.model.train()\n        aggregate = {}\n        accepted = 0\n        rejected = 0\n        for _ in range(self.cfg.batches_per_update):\n            batch = replay.sample_windows(self.cfg.batch_size, self.cfg.window,\n                                          split=\"train\", balance_families=True,\n                                          recent_fraction=self.cfg.recent_fraction,\n                                          recent_steps=self.cfg.recent_steps)\n            self.optimizer.zero_grad(set_to_none=True)\n            loss, metrics = self.loss_on(batch)\n            if not bool(torch.isfinite(loss)):\n                rejected += 1\n                continue\n            loss.backward()\n            norm = torch.nn.utils.clip_grad_norm_(self.model.parameters(), self.cfg.grad_clip)\n            if not bool(torch.isfinite(norm)):\n                self.optimizer.zero_grad(set_to_none=True)\n                rejected += 1\n                continue\n            self.optimizer.step()\n            accepted += 1\n            self.updates += 1\n            metrics[\"grad_norm\"] = norm.detach()\n            for key, value in metrics.items():\n                aggregate[key] = aggregate.get(key, 0.0) + value\n        # Logging only: payloads and optimization never leave their device.\n        result = {key: float(value / max(1, accepted)) for key, value in aggregate.items()}\n        result.update(updates=float(self.updates), skipped_nonfinite=float(rejected))\n        result.update(self.validate(replay))\n        return result\n\n    @torch.no_grad()\n    def validate(self, replay):\n        if not replay.can_sample(self.cfg.window, \"validation\"):\n            # Missing validation must not be interpreted as zero model error.\n            return {\"validation_available\": 0.0}\n        was_training = self.model.training\n        self.model.eval()\n        try:\n            batch = replay.sample_windows(self.cfg.validation_batch_size, self.cfg.window,\n                                          split=\"validation\", balance_families=True)\n            _, metrics = self.loss_on(batch)\n            result = {\"validation_\" + key: float(value) for key, value in metrics.items()}\n            result[\"validation_available\"] = 1.0\n            return result\n        finally:\n            self.model.train(was_training)\n\n    @torch.no_grad()\n    def start_error(self, starts):\n        \"\"\"Real one-step prediction error for conservative imagination filtering.\"\"\"\n        predicted = self.model(starts.state, starts.action, starts.context, starts.dt)\n        return self.model.normalized_sq_error(predicted, starts.next_state)\n\n    def state_dict(self):\n        return {\"model\": self.model.state_dict(), \"optimizer\": self.optimizer.state_dict(),\n                \"updates\": self.updates, \"config\": asdict(self.cfg)}\n\n    def load_state_dict(self, state):\n        self.model.load_state_dict(state[\"model\"])\n        self.optimizer.load_state_dict(state[\"optimizer\"])\n        self.updates = int(state.get(\"updates\", 0))\n\n","sha256":"927ca07ad30cbdb9d4f7fcd74d5cea6b7bdeccc3cc571669875196e695532594"},"DQ_high-level/utils/world_model/dynamics.py":{"text":"\"\"\"Residual high-level dynamics with an adapter-owned geometric state layout.\n\nThe MLP and zero-initialized residual head are adapted from\nSuperMimic-Reproduced ``world_model/dynamics.py`` (MIT). Geometry, command\nintegration, causal observation history and input normalization belong to the\nDQ task adapter, not to this generic network. See THIRD_PARTY_LICENSES.md.\n\"\"\"\n\nimport torch\nfrom torch import nn\n\n\nclass MLP(nn.Module):\n    def __init__(self, in_dim, hidden, out_dim, zero_last=False):\n        super().__init__()\n        layers = []\n        width = int(in_dim)\n        for size in hidden:\n            layers.extend((nn.Linear(width, int(size)), nn.SiLU()))\n            width = int(size)\n        last = nn.Linear(width, int(out_dim))\n        if zero_last:\n            nn.init.zeros_(last.weight)\n            nn.init.zeros_(last.bias)\n        layers.append(last)\n        self.net = nn.Sequential(*layers)\n\n    def forward(self, inputs):\n        return self.net(inputs)\n\n\nclass ResidualDynamics(nn.Module):\n    \"\"\"F(state, action, physical context, actual dt) -> next physical state.\n\n    The spec implements ``features``, ``integrate`` and ``error_vector`` and\n    supplies dimensions. Optional ``normalize_context`` may change the context\n    width when ``context_feature_dim`` is specified. A learned termination head\n    is built only if the spec exposes termination features. It models natural\n    task termination, not timeout; timeout is handled by the task clock.\n    \"\"\"\n\n    def __init__(self, spec, hidden=(512, 512, 512), term_hidden=(64, 64),\n                 nominal_dt=0.15, device=None):\n        super().__init__()\n        self.spec = spec\n        self.nominal_dt = float(nominal_dt)\n        if self.nominal_dt <= 0:\n            raise ValueError(\"nominal_dt must be positive\")\n        context_width = getattr(spec, \"context_feature_dim\", spec.context_dim)\n        self.dynamics = MLP(spec.feature_dim + spec.action_dim + context_width + 1,\n                            hidden, spec.delta_dim, zero_last=True)\n        self.term_head = (MLP(spec.termination_feature_dim, term_hidden, 1)\n                          if getattr(spec, \"termination_feature_dim\", 0) else None)\n        if device is not None:\n            self.to(device)\n\n    def forward(self, state, action, context, dt):\n        duration = torch.as_tensor(dt, dtype=state.dtype, device=state.device)\n        if duration.ndim == 0:\n            duration = duration.expand(*state.shape[:-1], 1)\n        elif duration.shape == state.shape[:-1]:\n            duration = duration.unsqueeze(-1)\n        duration = duration.expand(*state.shape[:-1], 1)\n        normalization = getattr(self.spec, \"normalize_context\", None)\n        conditions = normalization(context) if normalization is not None else context\n        features = self.spec.features(state)\n        action_encoder = getattr(self.spec, \"dynamics_action\", None)\n        physical_action = action_encoder(state, action) if action_encoder is not None else action\n        # Known actuator clipping/deadzones belong outside the learned MLP.\n        # A saturated real command must not acquire a fictitious derivative\n        # simply because a neural network sees its unconstrained raw value.\n        inputs = torch.cat((features, physical_action, conditions, duration / self.nominal_dt), -1)\n        delta = self.dynamics(inputs)\n        return self.spec.integrate(state, delta, action, context, duration)\n\n    def step(self, state, action, context, dt):\n        return self(state, action, context, dt)\n\n    def termination_logits(self, next_state, context):\n        if self.term_head is None:\n            raise RuntimeError(\"This state adapter does not define termination features\")\n        return self.term_head(self.spec.termination_features(next_state, context)).squeeze(-1)\n\n    def termination_probability(self, next_state, context):\n        return self.termination_logits(next_state, context).sigmoid()\n\n    def normalized_sq_error(self, predicted, target):\n        return self.spec.error_vector(predicted, target).square().mean(-1)\n","sha256":"3acc666e164f27e369ff949eec4aeed66cafe860d9a68c236ae232051d92a68d"},"DQ_high-level/utils/world_model/probes.py":{"text":"\"\"\"Isolated finite-action-effect validation; never step/restore the PPO simulator.\n\nIsaac Gym exposes root/DOF state setters, but not a complete PhysX contact\nsolver snapshot. Restoring tensors, histories and RNG is therefore NOT a\nreliable same-state branch of the training simulator. This module instead\ncreates a fresh dedicated simulator for each branch and replays an identical\naction prefix with common random numbers. It rejects mismatched start states,\nphysical contexts, durations, and excessive baseline repeatability error.\n\nThe report validates finite short-term reward effects on the probed states.\nIt does not prove long-term success improvement or Critic input-gradient\naccuracy. Reports are bound to model weights and the supplied task contract;\na changed model must be probed again, or BPTT must use the validated snapshot.\n\"\"\"\n\nfrom contextlib import contextmanager\nfrom dataclasses import asdict, dataclass\nimport hashlib\nimport json\nimport math\nimport os\nfrom pathlib import Path\nimport random\nimport tempfile\nimport time\n\nimport numpy as np\nimport torch\n\n\nREPORT_SCHEMA = \"dq-action-effect-probe-v2\"\nCONTINUOUS_INDICES = tuple(range(9))\nACTION_SEMANTICS = \"continuous_opening_v1\"\n\n\n@dataclass\nclass ActionEffectProbeConfig:\n    min_pairs: int = 64\n    min_informative_pairs: int = 32\n    min_effect: float = 1e-5\n    min_model_effect: float = 1e-6\n    min_sign_agreement: float = 0.70\n    min_correlation: float = 0.25\n    min_selected_gain_lcb95: float = 0.0\n    max_start_error: float = 1e-5\n    max_context_error: float = 1e-6\n    max_dt_error: float = 1e-7\n    max_repeat_reward_error: float = 1e-4\n    noise_multiplier: float = 5.0\n\n\n@dataclass\nclass ProbeStep:\n    state: torch.Tensor\n    context: torch.Tensor\n    reward: torch.Tensor\n    dt: torch.Tensor\n    terminated: torch.Tensor\n    executed_action: torch.Tensor = None\n\n\ndef balanced_family_config_ids(family_ids, count, seed):\n    \"\"\"Uniform-within-family reset IDs for a dedicated probe world only.\n\n    No sampler history or training probability is changed. Every nonempty\n    bank family gets a slot when count permits; its deterministic generator\n    does not consume the simulator's global RNG stream.\n    \"\"\"\n    if family_ids.ndim != 1 or count < 0:\n        raise ValueError(\"Expected one-dimensional family IDs and nonnegative count\")\n    if count == 0:\n        return torch.empty(0, device=family_ids.device, dtype=torch.long)\n    families = family_ids.unique(sorted=True)\n    if not len(families):\n        raise ValueError(\"Cannot probe an empty reset bank\")\n    generator = torch.Generator(device=family_ids.device).manual_seed(int(seed))\n    allocation = torch.arange(count, device=family_ids.device) % len(families)\n    result = torch.empty(count, device=family_ids.device, dtype=torch.long)\n    for index, family in enumerate(families):\n        pool = (family_ids == family).nonzero(as_tuple=False).flatten()\n        destinations = (allocation == index).nonzero(as_tuple=False).flatten()\n        choices = torch.randint(len(pool), (len(destinations),), device=family_ids.device, generator=generator)\n        result[destinations] = pool[choices]\n    return result[torch.randperm(count, device=family_ids.device, generator=generator)]\n\n\ndef configuration_fingerprint(configuration):\n    encoded = json.dumps(configuration, sort_keys=True, separators=(\",\", \":\"),\n                         ensure_ascii=False, allow_nan=False).encode(\"utf-8\")\n    return hashlib.sha256(encoded).hexdigest()\n\n\ndef model_fingerprint(model):\n    \"\"\"Hash weights once per validation/checkpoint, outside the training hot path.\"\"\"\n    digest = hashlib.sha256()\n    for name, value in sorted(model.state_dict().items()):\n        digest.update(name.encode(\"utf-8\"))\n        digest.update(str(value.dtype).encode(\"ascii\"))\n        digest.update(str(tuple(value.shape)).encode(\"ascii\"))\n        raw = value.detach().contiguous().reshape(-1).view(torch.uint8).cpu().numpy().tobytes()\n        digest.update(raw)\n    return digest.hexdigest()\n\n\n@contextmanager\ndef preserve_rng():\n    \"\"\"Isolated sessions also leave Python, NumPy and Torch caller RNG intact.\"\"\"\n    python_state, numpy_state = random.getstate(), np.random.get_state()\n    cpu_state = torch.get_rng_state()\n    cuda_states = torch.cuda.get_rng_state_all() if torch.cuda.is_available() else None\n    try:\n        yield\n    finally:\n        random.setstate(python_state)\n        np.random.set_state(numpy_state)\n        torch.set_rng_state(cpu_state)\n        if cuda_states is not None:\n            torch.cuda.set_rng_state_all(cuda_states)\n\n\ndef seed_probe(seed):\n    random.seed(int(seed))\n    np.random.seed(int(seed) % (2 ** 32))\n    torch.manual_seed(int(seed))\n    if torch.cuda.is_available():\n        torch.cuda.manual_seed_all(int(seed))\n\n\ndef random_continuous_directions(base_actions, generator=None, amplitudes=None):\n    \"\"\"Finite perturbations in all nine continuous action coordinates.\n\n    Defaults are action units: 2 mm position increments, 0.01 rad orientation,\n    0.05 gripper opening, and 0.025 base command. These scale a unit random\n    direction; they are maximum coordinate amplitudes, not fixed step sizes.\n    The task's action clipping still applies in both\n    real and model execution; saturated/no-effect samples fail the evidence\n    count instead of being mistaken for correct gradients.\n    \"\"\"\n    if base_actions.ndim != 2 or base_actions.shape[-1] != 9:\n        raise ValueError(\"Expected teacher actions with shape [batch, 9]\")\n    scales = base_actions.new_tensor(amplitudes if amplitudes is not None else\n                                    (.002, .002, .002, .01, .01, .01, .05, .025, .025))\n    if scales.shape != (9,) or not bool(torch.isfinite(scales).all()) or bool((scales < 0).any()):\n        raise ValueError(\"Probe amplitudes must be nine finite nonnegative values\")\n    direction = torch.randn(base_actions.shape, device=base_actions.device,\n                            dtype=base_actions.dtype, generator=generator)\n    direction = direction / direction.norm(dim=-1, keepdim=True).clamp_min(1e-12)\n    return direction * scales\n\n\ndef bounded_probe_action(base_actions, directions=None, multiplier=0.):\n    \"\"\"Perturb executable actions, with gripper opening kept in [0, 1].\n\n    The unperturbed baseline is bounded first, so a saturated opening still\n    permits a finite inward perturbation. Real and model branches use this\n    same action; any additional environment clipping is read back afterward.\n    \"\"\"\n    action = base_actions.clone()\n    action[..., 6] = action[..., 6].clamp(0., 1.)\n    if directions is not None:\n        action = action + multiplier * directions\n        action[..., 6] = action[..., 6].clamp(0., 1.)\n    return action\n\n\ndef _coverage_rejection_reasons(metadata):\n    reasons = []\n    coverage = metadata.get(\"directions_cover\")\n    if (not isinstance(coverage, list) or len(coverage) != len(CONTINUOUS_INDICES)\n            or any(type(index) is not int for index in coverage)\n            or set(coverage) != set(CONTINUOUS_INDICES)):\n        reasons.append(\"incomplete_continuous_action_coverage\")\n    if metadata.get(\"gripper_perturbed\") is not True:\n        reasons.append(\"continuous_gripper_not_probed\")\n    if metadata.get(\"action_semantics\") != ACTION_SEMANTICS:\n        reasons.append(\"gripper_action_semantics_mismatch\")\n    return reasons\n\n\nclass IsaacGymProbeSession:\n    \"\"\"Adapter for a newly constructed, dedicated raw B1Z1PickMulti instance.\n\n    The factory must reproduce task configuration and seed, construct its own\n    simulator/SGS sampler, reset it, and provide its own adapter. Never wrap\n    the environment used by PPO. Running the factory in a separate command\n    also isolates logger side effects from the training process.\n    \"\"\"\n\n    isolated = True\n    simulator_name = \"IsaacGym\"\n\n    def __init__(self, env, adapter, training_env=None):\n        if env is training_env or adapter.env is not env:\n            raise ValueError(\"A probe must own a dedicated simulator and its matching adapter\")\n        self.env, self.adapter = env, adapter\n        self.closed = False\n\n    def capture(self):\n        state, context = self.adapter.capture()\n        return state.detach().clone(), context.detach().clone()\n\n    @torch.no_grad()\n    def step(self, action):\n        result = self.env.step(action.detach().clone())\n        state, context = self.capture()\n        reward = result[1].detach().clone().reshape(-1)\n        terminated = result[2].detach().clone().bool().reshape(-1)\n        dt = torch.full((len(state), 1), self.env.control_freq_low * self.env.dt,\n                        device=state.device, dtype=state.dtype)\n        return ProbeStep(state, context, reward, dt, terminated,\n                         self.env.actions.detach().clone())\n\n    def close(self):\n        if not self.closed:\n            if getattr(self.env, \"viewer\", None) is not None:\n                self.env.gym.destroy_viewer(self.env.viewer)\n            self.env.gym.destroy_sim(self.env.sim)\n            self.closed = True\n\n\ndef _max_row_error(first, second):\n    if first.shape != second.shape:\n        raise ValueError(\"Probe branches changed state/context shape\")\n    return (first - second).abs().flatten(1).amax(-1)\n\n\n@torch.no_grad()\ndef run_action_effect_probe(session_factory, model_factory, prefix_actions,\n                            base_actions, directions, seed, configuration, config=None):\n    \"\"\"Run base/+/-/base-repeat in four fresh, seed-identical simulators.\n\n    ``session_factory(seed)`` creates an isolated, initialized session exposing\n    ``adapter, capture(), step(action), close(), isolated, simulator_name``.\n    ``model_factory(adapter)`` reconstructs the same model weights with *that\n    session's* adapter. This is essential: the context slot indexes physical\n    lookup tables owned by its adapter, not the training environment's tables.\n\n    ``prefix_actions`` is [length, batch, 9], fixed before any branch. No reset\n    is allowed inside it: a terminal prefix invalidates that row. Inference\n    and action-effect comparisons stay on the base_actions device; only final\n    report serialization crosses to CPU.\n    \"\"\"\n    cfg = config or ActionEffectProbeConfig()\n    if (cfg.min_pairs < 1 or cfg.min_informative_pairs < 2 or not 0 <= cfg.min_sign_agreement <= 1\n            or not -1 <= cfg.min_correlation <= 1 or cfg.noise_multiplier < 0):\n        raise ValueError(\"Invalid action-effect validation thresholds\")\n    if base_actions.ndim != 2 or base_actions.shape[-1] != 9 or directions.shape != base_actions.shape:\n        raise ValueError(\"Base actions and directions must both have shape [batch, 9]\")\n    if prefix_actions.ndim != 3 or prefix_actions.shape[1:] != base_actions.shape:\n        raise ValueError(\"Prefix actions must have shape [length, batch, 9]\")\n    if not bool(torch.isfinite(base_actions).all() & torch.isfinite(directions).all() & torch.isfinite(prefix_actions).all()):\n        raise ValueError(\"Probe actions must be finite\")\n    base_actions, directions = base_actions.detach(), directions.detach()\n    batch = base_actions.shape[0]\n    branches = {}\n    reference_hash, simulator = None, None\n    with preserve_rng():\n        for name, multiplier in ((\"base\", 0.), (\"plus\", 1.), (\"minus\", -1.), (\"repeat\", 0.)):\n            seed_probe(seed)\n            session = session_factory(int(seed))\n            try:\n                if not getattr(session, \"isolated\", False):\n                    raise ValueError(\"Probe session must own a fresh isolated simulator\")\n                if simulator is None:\n                    simulator = session.simulator_name\n                elif simulator != session.simulator_name:\n                    raise ValueError(\"Probe branches changed simulator type\")\n                prefix_alive = torch.ones(batch, device=base_actions.device, dtype=torch.bool)\n                prefix_durations = []\n                for action in prefix_actions:\n                    transition = session.step(bounded_probe_action(action))\n                    prefix_alive &= ~transition.terminated\n                    prefix_durations.append(transition.dt)\n                state, context = session.capture()\n                if state.device != base_actions.device or context.device != base_actions.device:\n                    raise ValueError(\"Probe state, actions, context and model must use the same device\")\n                if state.shape[0] != batch:\n                    raise ValueError(\"Probe factory batch size differs from the provided actions\")\n                action = bounded_probe_action(base_actions, directions, multiplier)\n                normalize_context = getattr(session.adapter, \"normalize_context\", None)\n                physical_context = normalize_context(context) if normalize_context is not None else context\n                # Build/evaluate the learned model after the real transition:\n                # model construction can consume RNG and must not alter dt or\n                # other simulator randomness before step(action).\n                transition = session.step(action)\n                executed_action = transition.executed_action if transition.executed_action is not None else action\n                model = model_factory(session.adapter)\n                model.eval()\n                fingerprint = model_fingerprint(model)\n                if reference_hash is None:\n                    reference_hash = fingerprint\n                elif reference_hash != fingerprint:\n                    raise ValueError(\"Model weights changed between probe branches\")\n                predicted = model.step(state, executed_action, context, transition.dt)\n                predicted_reward = session.adapter.reward(state, predicted, executed_action, context).reshape(batch)\n                branches[name] = {\n                    \"start\": state.detach().clone(), \"context\": context.detach().clone(),\n                    \"physical_context\": physical_context.detach().clone(),\n                    \"reward\": transition.reward.detach().clone(), \"dt\": transition.dt.detach().clone(),\n                    \"model_reward\": predicted_reward.detach().clone(), \"alive\": prefix_alive.clone(),\n                    \"actions\": executed_action.detach().clone(),\n                    \"prefix_dt\": (torch.stack(prefix_durations) if prefix_durations else\n                                  torch.empty(0, batch, 1, device=base_actions.device)),\n                }\n                del model\n            finally:\n                session.close()\n    return summarize_replayed_branches(branches, reference_hash, configuration, cfg,\n        metadata={\"simulator\": simulator, \"device\": str(base_actions.device), \"seed\": int(seed),\n                  \"prefix_length\": len(prefix_actions), \"protocol\": \"independent_simulator_prefix_replay\"})\n\n\n@torch.no_grad()\ndef summarize_replayed_branches(branches, model_sha256, configuration, config=None, metadata=None):\n    \"\"\"Aggregate either in-process isolated sessions or separately launched workers.\"\"\"\n    cfg = config or ActionEffectProbeConfig()\n    metadata = dict(metadata or {})\n    baseline = branches[\"base\"]\n    batch = len(baseline[\"reward\"])\n    start_error = torch.zeros(batch, device=baseline[\"reward\"].device)\n    context_error, dt_error = start_error.clone(), start_error.clone()\n    alive = baseline[\"alive\"].clone()\n    for name in (\"plus\", \"minus\", \"repeat\"):\n        branch = branches[name]\n        start_error = torch.maximum(start_error, _max_row_error(baseline[\"start\"], branch[\"start\"]))\n        context_error = torch.maximum(context_error, _max_row_error(baseline[\"context\"], branch[\"context\"]))\n        context_error = torch.maximum(context_error, _max_row_error(baseline[\"physical_context\"], branch[\"physical_context\"]))\n        dt_error = torch.maximum(dt_error, _max_row_error(baseline[\"dt\"], branch[\"dt\"]))\n        if baseline[\"prefix_dt\"].shape[0]:\n            dt_error = torch.maximum(dt_error, (baseline[\"prefix_dt\"] - branch[\"prefix_dt\"]).abs().amax((0, 2)))\n        alive &= branch[\"alive\"]\n        if \"families\" in baseline:\n            if \"families\" not in branch or not torch.equal(baseline[\"families\"], branch[\"families\"]):\n                raise ValueError(\"Reset-family assignments changed between probe branches\")\n    # Coverage comes from actions actually executed after clipping, never\n    # merely from the nominal perturbation or a hardcoded coordinate list.\n    if all(\"actions\" in branches[name] for name in (\"base\", \"plus\", \"minus\", \"repeat\")):\n        for branch in branches.values():\n            action = branch[\"actions\"]\n            if action.shape != (batch, 9) or not bool(torch.isfinite(action).all()):\n                raise ValueError(\"Probe executed actions must be finite with shape [batch, 9]\")\n            if bool(((action[:, 6] < 0) | (action[:, 6] > 1)).any()):\n                raise ValueError(\"Probe executed gripper opening must be in [0, 1]\")\n        effect = (branches[\"plus\"][\"actions\"] - branches[\"minus\"][\"actions\"]).abs().amax(0)\n        covered = [index for index in CONTINUOUS_INDICES if float(effect[index]) > 0.]\n        metadata.update(directions_cover=covered, gripper_perturbed=6 in covered,\n                        action_semantics=ACTION_SEMANTICS,\n                        executed_action_delta_abs_max=effect.cpu().tolist())\n    return analyze_action_effects(\n        branches[\"plus\"][\"reward\"], branches[\"minus\"][\"reward\"], baseline[\"reward\"], branches[\"repeat\"][\"reward\"],\n        branches[\"plus\"][\"model_reward\"], branches[\"minus\"][\"model_reward\"], start_error, context_error, dt_error, alive,\n        model_sha256, configuration, cfg, metadata=metadata, families=baseline.get(\"families\"))\n\n\n@torch.no_grad()\ndef analyze_action_effects(real_plus, real_minus, real_base, real_repeat, predicted_plus, predicted_minus,\n                           start_error, context_error, dt_error, prefix_alive, model_sha256,\n                           configuration, config=None, metadata=None, families=None):\n    \"\"\"Evaluate finite perturbations, including real benefit over the baseline action.\"\"\"\n    cfg = config or ActionEffectProbeConfig()\n    values = [value.reshape(-1) for value in (real_plus, real_minus, real_base, real_repeat,\n                                             predicted_plus, predicted_minus, start_error, context_error, dt_error)]\n    if any(value.shape != values[0].shape for value in values):\n        raise ValueError(\"All action-effect evidence must have the same batch shape\")\n    real_plus, real_minus, real_base, real_repeat, predicted_plus, predicted_minus, start_error, context_error, dt_error = values\n    real_delta, model_delta = real_plus-real_minus, predicted_plus-predicted_minus\n    repeat_error = (real_base-real_repeat).abs()\n    finite = torch.stack(values).isfinite().all(0)\n    valid = (finite & prefix_alive.bool().reshape(-1) & (start_error <= cfg.max_start_error)\n             & (context_error <= cfg.max_context_error) & (dt_error <= cfg.max_dt_error)\n             & (repeat_error <= cfg.max_repeat_reward_error))\n    noise_floor = torch.maximum(torch.full_like(repeat_error, cfg.min_effect), repeat_error * cfg.noise_multiplier)\n    informative = valid & (real_delta.abs() > noise_floor) & (model_delta.abs() > cfg.min_model_effect)\n    selected_reward = torch.where(model_delta > 0, real_plus, real_minus)\n    selected_gain = selected_reward-real_base\n    count = int(informative.sum())\n    valid_count = int(valid.sum())\n    if count:\n        real, prediction, gains = real_delta[informative], model_delta[informative], selected_gain[informative]\n        agreement = float((real.sign() == prediction.sign()).float().mean())\n        real_centered, pred_centered = real-real.mean(), prediction-prediction.mean()\n        denominator = real_centered.norm()*pred_centered.norm()\n        correlation = float((real_centered*pred_centered).sum()/denominator.clamp_min(1e-12))\n        mean_gain = float(gains.mean())\n        stderr = float(gains.std(unbiased=True)/math.sqrt(count)) if count > 1 else float(\"inf\")\n        lcb = mean_gain-1.96*stderr\n    else:\n        agreement = correlation = mean_gain = 0.\n        lcb = float(\"-inf\")\n    reasons = _coverage_rejection_reasons(metadata or {})\n    if valid_count < cfg.min_pairs:\n        reasons.append(\"insufficient_reproducible_pairs\")\n    if count < cfg.min_informative_pairs:\n        reasons.append(\"insufficient_nonzero_action_effects\")\n    if agreement < cfg.min_sign_agreement:\n        reasons.append(\"action_effect_sign_agreement\")\n    if correlation < cfg.min_correlation:\n        reasons.append(\"action_effect_correlation\")\n    if lcb <= cfg.min_selected_gain_lcb95:\n        reasons.append(\"no_positive_real_gain_lower_bound\")\n    family_metrics = {}\n    if families is not None:\n        family_names = (metadata or {}).get(\"family_names\", [])\n        if not family_names:\n            raise ValueError(\"Family-labelled probes require family_names metadata\")\n        if families.shape != valid.shape:\n            raise ValueError(\"Probe family labels do not match the batch\")\n        for family_id, name in enumerate(family_names):\n            members = families == family_id\n            family_metrics[name] = {\"assigned_pairs\": int(members.sum()),\n                                    \"valid_pairs\": int((members & valid).sum()),\n                                    \"informative_pairs\": int((members & informative).sum())}\n            # Coverage only, not a new family-specific statistical threshold:\n            # task reward can legitimately be locally flat in a reset family.\n            if len(valid) >= len(family_names) and not bool((members & valid).any()):\n                reasons.append(\"missing_reproducible_reset_family:\"+name)\n    # Never encode nonstandard JSON Infinity/NaN in a failed report.\n    safe_lcb = lcb if math.isfinite(lcb) else None\n    def finite_summary(value, reduction=\"mean\"):\n        finite_values = value[torch.isfinite(value)]\n        if not finite_values.numel():\n            return None\n        return float(finite_values.max() if reduction == \"max\" else finite_values.mean())\n\n    report = {\n        \"schema\": REPORT_SCHEMA, \"created_unix\": time.time(), \"passed\": not reasons, \"reasons\": reasons,\n        \"model_sha256\": str(model_sha256), \"configuration_sha256\": configuration_fingerprint(configuration),\n        \"configuration\": configuration, \"thresholds\": asdict(cfg), \"metadata\": metadata or {},\n        \"metrics\": {\"pairs\": len(real_delta), \"valid_pairs\": valid_count, \"informative_pairs\": count,\n                    \"sign_agreement\": agreement, \"correlation\": correlation, \"selected_gain_mean\": mean_gain,\n                    \"selected_gain_lcb95\": safe_lcb,\n                    \"real_base_reward_mean\": finite_summary(real_base),\n                    \"real_plus_reward_mean\": finite_summary(real_plus),\n                    \"real_minus_reward_mean\": finite_summary(real_minus),\n                    \"model_plus_reward_mean\": finite_summary(predicted_plus),\n                    \"model_minus_reward_mean\": finite_summary(predicted_minus),\n                    \"real_action_effect_abs_mean\": finite_summary(real_delta.abs()),\n                    \"model_action_effect_abs_mean\": finite_summary(model_delta.abs()),\n                    \"start_error_max\": finite_summary(start_error, \"max\"),\n                    \"context_error_max\": finite_summary(context_error, \"max\"),\n                    \"duration_error_max\": finite_summary(dt_error, \"max\"),\n                    \"repeat_reward_error_max\": finite_summary(repeat_error, \"max\"),\n                    \"reset_families\": family_metrics,\n                    \"rejected_start_or_context\": int(((start_error > cfg.max_start_error) | (context_error > cfg.max_context_error)).sum()),\n                    \"rejected_duration\": int((dt_error > cfg.max_dt_error).sum()),\n                    \"rejected_repeatability\": int((repeat_error > cfg.max_repeat_reward_error).sum()),\n                    \"rejected_terminal_prefix\": int((~prefix_alive.bool()).sum())},\n        \"scope\": \"finite_one_step_reward_effects_on_replayed_real_states\",\n        \"limitations\": [\"Does not validate long-term success gains\", \"Does not validate Critic input gradients\",\n                        \"Mixed-direction coverage does not isolate each coordinate's reward contribution\",\n                        \"Does not establish a classical derivative at contact transitions\",\n                        \"Reset families label initial-state categories, not measured contact modes\",\n                        \"Valid only for the exact model snapshot and recorded task contract\"],\n    }\n    report[\"report_sha256\"] = configuration_fingerprint(report)\n    return report\n\n\ndef write_report(path, report):\n    destination = Path(path)\n    destination.parent.mkdir(parents=True, exist_ok=True)\n    payload = json.dumps(report, ensure_ascii=False, indent=2, allow_nan=False) + \"\\n\"\n    temporary = None\n    try:\n        with tempfile.NamedTemporaryFile(\"w\", encoding=\"utf-8\", dir=str(destination.parent),\n                                         prefix=destination.name+\".\", suffix=\".tmp\", delete=False) as handle:\n            temporary = handle.name\n            handle.write(payload)\n        os.replace(temporary, str(destination))\n    finally:\n        if temporary is not None and os.path.exists(temporary):\n            os.unlink(temporary)\n\n\ndef load_verified_report(path, model_sha256, configuration, max_age_seconds=None,\n                         required_simulator=\"IsaacGym\", now=None):\n    \"\"\"Return (accepted, reasons, report); stale/different weights cannot enable BPTT.\"\"\"\n    with open(path, \"r\", encoding=\"utf-8\") as handle:\n        report = json.load(handle)\n    reasons = []\n    copied = dict(report)\n    checksum = copied.pop(\"report_sha256\", None)\n    if checksum != configuration_fingerprint(copied):\n        reasons.append(\"report_checksum_mismatch\")\n    if report.get(\"schema\") != REPORT_SCHEMA:\n        reasons.append(\"report_schema_mismatch\")\n    if report.get(\"passed\") is not True:\n        reasons.append(\"real_action_effect_validation_failed\")\n        # Keep the numerical gate that failed visible in the trainer's status\n        # file; the generic rejection alone hides actionable probe evidence.\n        reasons.extend(\"probe:\" + reason for reason in report.get(\"reasons\", [])\n                       if isinstance(reason, str))\n    if report.get(\"model_sha256\") != model_sha256:\n        reasons.append(\"model_snapshot_changed\")\n    if report.get(\"configuration_sha256\") != configuration_fingerprint(configuration):\n        reasons.append(\"task_configuration_changed\")\n    if required_simulator is not None and report.get(\"metadata\", {}).get(\"simulator\") != required_simulator:\n        reasons.append(\"wrong_validation_simulator\")\n    if report.get(\"metadata\", {}).get(\"protocol\") != \"independent_simulator_prefix_replay\":\n        reasons.append(\"unsupported_validation_protocol\")\n    reasons.extend(_coverage_rejection_reasons(report.get(\"metadata\", {})))\n    current_time = time.time() if now is None else float(now)\n    age = current_time-float(report.get(\"created_unix\", 0))\n    if age < -60 or (max_age_seconds is not None and age > max_age_seconds):\n        reasons.append(\"report_expired_or_future_dated\")\n    return not reasons, reasons, report\n","sha256":"dfdd0f2d9a698f5b305c8b29eb4b1754d62aba0aa49e27f6112b6255877cfb33"},"DQ_high-level/utils/world_model/imagination.py":{"text":"\"\"\"Short closed-loop BPTT as an auxiliary update of the real PPO Actor.\n\nThe survival-weighted objective and short-horizon rollout follow\nSuperMimic-Reproduced ``imagination/{objective,rollout,policy_trainer}.py``\n(MIT; see THIRD_PARTY_LICENSES.md). This adaptation uses the *real PPO*\nCritic, continuous gripper opening commands, and a separate full-policy KL\naccept/reject check. It does not train the Critic on imagined experience.\nImagined actions use the Actor mean and its differentiable action mapping.\nThe real PPO policy keeps\nsampling Gaussian actions and exclusively learns its action standard deviations.\n\nAll rollout, gradient and optimizer tensors stay on the input CUDA device.\nOnly scalar diagnostics are copied to the host once an update is finished.\n\"\"\"\n\nfrom contextlib import contextmanager\nfrom copy import deepcopy\nfrom dataclasses import dataclass\nimport inspect\n\nimport torch\nfrom torch import nn\n\nfrom .gradients import freeze_parameters\n\n\n@dataclass\nclass ImaginationConfig:\n    horizon: int = 3\n    gamma: float = 0.99\n    lr: float = 1e-5\n    strength: float = 0.05  # Scales the Adam learning rate, not its normalized gradient.\n    max_grad_norm: float = 0.5\n    max_kl: float = 0.005\n    use_tail_value: bool = True\n    bootstrap_timeouts: bool = False  # Match the real teacher's finite-task PPO target.\n    dt: float = 0.15\n    gripper_index: int = 6\n\n\n@dataclass\nclass ImaginedRollout:\n    states: torch.Tensor       # [H+1, batch, state_dim]\n    actions: torch.Tensor      # [H, batch, 9]\n    rewards: torch.Tensor      # [H, batch]\n    termination: torch.Tensor  # [H, batch], natural termination, not timeout\n    survival: torch.Tensor     # [H+1, batch], stops at timeout after its reward\n    timeouts: torch.Tensor     # [H, batch]\n    timeout_values: torch.Tensor  # [H, batch], bootstrap at a time limit\n    tail_values: torch.Tensor  # [batch]\n\n\ndef imagination_objective(rollout, gamma, weights=None):\n    \"\"\"Return weighted mean of short rewards and differentiable bootstraps.\n\n    A terminal transition retains its reward (c_t rather than c_{t+1}).\n    Natural termination and, by default, the finite task's time limit both\n    suppress bootstrap. Explicit bootstrap_timeouts=True instead evaluates\n    its actual endpoint. Neither case continues the episode after a timeout.\n    Trust weights are fixed conditions, not Actor-optimizable rewards.\n    \"\"\"\n    horizon = rollout.rewards.shape[0]\n    discounts = gamma ** torch.arange(horizon, device=rollout.rewards.device,\n                                      dtype=rollout.rewards.dtype)\n    returns = (discounts[:, None] * rollout.survival[:-1]\n               * rollout.rewards).sum(0)\n    timeout_survival = (rollout.survival[:-1]\n                        * (1.0 - rollout.termination) * rollout.timeouts)\n    returns = returns + (gamma * discounts[:, None] * timeout_survival\n                         * rollout.timeout_values).sum(0)\n    returns = returns + gamma ** horizon * rollout.survival[-1] * rollout.tail_values\n    if weights is not None:\n        returns = returns * weights.detach().reshape_as(returns)\n    return returns.mean()\n\n\ndef diagonal_gaussian_kl(old_mean, old_log_std, new_mean, new_log_std):\n    \"\"\"KL(old || new), summed over *all nine* Gaussian action coordinates.\"\"\"\n    variance_ratio = (2.0 * (old_log_std - new_log_std)).exp()\n    mean_term = (old_mean - new_mean).square() * (-2.0 * new_log_std).exp()\n    return (new_log_std - old_log_std + 0.5 * (variance_ratio + mean_term - 1.0)).sum(-1)\n\n\ndef _role_option(module, name, role, default):\n    option = getattr(module, name, default)\n    if isinstance(option, dict):\n        return option.get(role, option.get(\"\", default))\n    return option\n\n\n@contextmanager\ndef _evaluation(module):\n    modes = [(child, child.training) for child in module.modules()]\n    module.eval()\n    try:\n        yield\n    finally:\n        for child, mode in modes:\n            child.training = mode\n\n\nclass ImaginationTrainer:\n    \"\"\"Alternate with PPO; caller controls warmup and model reliability gates.\n\n    ``adapter`` reconstructs causal observations/rewards from complete model\n    states. Optional ``timeout(next_state, context)`` must indicate a time\n    limit only. Learned natural termination belongs to ``model``. No reset\n    state or true future observation enters a predicted rollout.\n\n    Every action coordinate is recomputed from the predicted observation at\n    every step. The Actor's optional ``mean_to_action`` maps its latent Gaussian\n    mean to executed commands, including differentiable gripper opening. No\n    action coordinate is detached or replaced by a reference sequence. The\n    rollout uses no sampled action noise. The KL test covers every latent\n    Gaussian action coordinate, including gripper. Standard\n    deviations are only used as detached values in that check, never to form\n    imagined actions or to receive an auxiliary policy gradient.\n    \"\"\"\n\n    def __init__(self, model, adapter, actor, critic, config=None,\n                 state_preprocessor=None, value_preprocessor=None):\n        self.model, self.adapter = model, adapter\n        self.actor, self.critic = actor, critic\n        self.cfg = config or ImaginationConfig()\n        self.state_preprocessor = state_preprocessor\n        self.value_preprocessor = value_preprocessor\n        self._preprocessor_options = {}\n        cfg = self.cfg\n        if cfg.horizon < 1 or cfg.dt <= 0 or not 0 < cfg.gamma <= 1:\n            raise ValueError(\"BPTT requires a positive horizon/dt and gamma in (0, 1]\")\n        if cfg.lr <= 0 or cfg.strength < 0 or cfg.max_grad_norm <= 0 or cfg.max_kl <= 0:\n            raise ValueError(\"Invalid BPTT optimizer strength, learning rate or limits\")\n        if cfg.gripper_index != 6:\n            raise ValueError(\"The teacher continuous gripper opening action is at index 6\")\n        if getattr(actor, \"transform_func\", None) is not None:\n            raise ValueError(\"BPTT requires no global policy transform; use mean_to_action for coordinate transforms\")\n        if getattr(actor, \"deterministic\", False):\n            raise ValueError(\"The real PPO training Actor must remain stochastic; BPTT uses its means directly\")\n        actor_ids = {id(parameter) for parameter in actor.parameters()}\n        for frozen in (model, critic):\n            if actor_ids.intersection(id(parameter) for parameter in frozen.parameters()):\n                raise ValueError(\"BPTT requires separate Actor, Critic and world-model parameters\")\n        # Scaling a loss by beta alone largely cancels inside Adam's adaptive\n        # normalization. Scale its actual parameter step via learning rate.\n        # Preserve parameter groups for existing auxiliary checkpoints. The\n        # mean-only objective leaves log_std.grad=None; zero_grad(set_to_none=True)\n        # also clears residual PPO gradients. Adam skips these parameters even\n        # if a legacy stochastic-BPTT checkpoint contains nonzero moments.\n        self.optimizer = torch.optim.Adam(actor.parameters(), lr=cfg.lr * cfg.strength)\n        self.accepted_updates = 0\n        self.rejected_updates = 0\n\n    def _preprocess(self, preprocessor, values, inverse=False):\n        if preprocessor is None:\n            return values\n        key = id(preprocessor)\n        if key not in self._preprocessor_options:\n            function = preprocessor.forward if isinstance(preprocessor, nn.Module) else preprocessor\n            parameters = inspect.signature(function).parameters\n            self._preprocessor_options[key] = (\"no_grad\" in parameters or any(\n                parameter.kind == inspect.Parameter.VAR_KEYWORD for parameter in parameters.values()))\n        options = {\"train\": False}\n        if inverse:\n            options[\"inverse\"] = True\n        # Installed skrl defaults to no_grad=True even with train=False.\n        # Both scaler directions must explicitly preserve the input Jacobian.\n        if self._preprocessor_options[key]:\n            options[\"no_grad\"] = False\n        result = preprocessor(values, **options)\n        if torch.is_grad_enabled() and values.requires_grad and not result.requires_grad:\n            raise RuntimeError(\"BPTT preprocessor detached its inputs; enable input gradients without updating statistics\")\n        return result\n\n    def _normalize(self, observations):\n        return self._preprocess(self.state_preprocessor, observations)\n\n    def _policy(self, observations):\n        mean, log_std, _ = self.actor.compute({\"states\": self._normalize(observations)}, role=\"policy\")\n        if mean.shape[-1] != 9:\n            raise ValueError(\"Teacher BPTT requires nine continuous actions with gripper opening at index 6\")\n        if _role_option(self.actor, \"_g_clip_log_std\", \"policy\", True):\n            low = _role_option(self.actor, \"_g_log_std_min\", \"policy\", -20.0)\n            high = _role_option(self.actor, \"_g_log_std_max\", \"policy\", 2.0)\n            log_std = log_std.clamp(low, high)\n        return mean, log_std.detach().expand_as(mean)\n\n    def _value(self, state, context):\n        if not self.cfg.use_tail_value:\n            return torch.zeros(state.shape[0], device=state.device, dtype=state.dtype)\n        observation = self.adapter.observation(state, context)\n        value, _ = self.critic.compute({\"states\": self._normalize(observation)}, role=\"value\")\n        value = self._preprocess(self.value_preprocessor, value, inverse=True)\n        return value.reshape(state.shape[0])\n\n    def _action(self, mean):\n        # The real policy and imagined mean commands share the same mapping.\n        # In the teacher, sigmoid(mean[:, 6]) is the normalized gripper opening;\n        # its derivative remains in the graph just like the other eight actions.\n        mean_to_action = getattr(self.actor, \"mean_to_action\", None)\n        action = mean if mean_to_action is None else mean_to_action(mean)\n        if _role_option(self.actor, \"_g_clip_actions\", \"policy\", False):\n            action = torch.clamp(action, min=self.actor.clip_actions_min,\n                                 max=self.actor.clip_actions_max)\n        # Replay stores env.actions after the outer simulator clamp. Apply the\n        # same execution mapping to the mean commands when clipActions is set.\n        if hasattr(self.adapter, \"clip_actions\"):\n            action = action.clamp(-self.adapter.clip_actions, self.adapter.clip_actions)\n        return action\n\n    @staticmethod\n    def _dt_at(dt, step, horizon, batch_size):\n        if torch.is_tensor(dt) and dt.ndim >= 2 and dt.shape[:2] == (horizon, batch_size):\n            return dt[step]\n        return dt\n\n    @torch.enable_grad()\n    def imagine(self, start_state, context, *, dt=None):\n        \"\"\"Build a closed-loop graph; callers freeze model/Critic parameters.\n\n        Public for diagnostics and tests. ``update`` establishes freezing and\n        preprocessing modes automatically. States before the start are fixed;\n        every subsequent state and reconstructed observation stays connected.\n        All nine mean action coordinates, including gripper opening, remain\n        differentiable through later predicted states and observations.\n        There is no action-noise input: for fixed states, context and dt the\n        teacher's mean-action rollout does not consume the action RNG.\n        \"\"\"\n        state, context = start_state.detach(), context.detach()\n        horizon, batch_size = self.cfg.horizon, state.shape[0]\n        dt = self.cfg.dt if dt is None else dt\n        survival = torch.ones(batch_size, device=state.device, dtype=state.dtype)\n        states, survivals = [state], [survival]\n        actions, rewards, termination, timeouts, timeout_values = [], [], [], [], []\n        timeout_fn = getattr(self.adapter, \"timeout\", getattr(self.adapter, \"timeouts\", None))\n        for step in range(horizon):\n            mean, _ = self._policy(self.adapter.observation(state, context))\n            action = self._action(mean)\n            duration = self._dt_at(dt, step, horizon, batch_size)\n            next_state = self.model.step(state, action, context, duration)\n            reward = self.adapter.reward(state, next_state, action, context).reshape(batch_size)\n            if getattr(self.model, \"term_head\", True) is None:\n                done = torch.zeros_like(survival)\n            else:\n                done = self.model.termination_probability(next_state, context).reshape(batch_size).clamp(0, 1)\n            timeout = (torch.zeros_like(survival) if timeout_fn is None else\n                       timeout_fn(next_state, context).to(dtype=state.dtype).reshape(batch_size).detach())\n            # Evaluate the correct endpoint, not the hypothetical post-reset state.\n            timeout_value = (self._value(next_state, context)\n                             if timeout_fn is not None and self.cfg.bootstrap_timeouts else\n                             torch.zeros_like(survival))\n            survival = survival * (1.0 - done) * (1.0 - timeout)\n            states.append(next_state)\n            actions.append(action)\n            rewards.append(reward)\n            termination.append(done)\n            timeouts.append(timeout)\n            timeout_values.append(timeout_value)\n            survivals.append(survival)\n            state = next_state\n        return ImaginedRollout(torch.stack(states), torch.stack(actions), torch.stack(rewards),\n                               torch.stack(termination), torch.stack(survivals), torch.stack(timeouts),\n                               torch.stack(timeout_values), self._value(state, context))\n\n    @torch.enable_grad()\n    def update(self, start_state, context, weights=None, anchor_observations=None, *, dt=None):\n        \"\"\"One bounded mean-policy Adam update; standard deviations stay PPO-owned.\"\"\"\n        if start_state.ndim != 2 or start_state.shape[0] == 0:\n            raise ValueError(\"BPTT needs a nonempty [batch, state_dim] start tensor\")\n        if weights is not None:\n            weights = weights.detach().to(device=start_state.device, dtype=start_state.dtype).reshape(-1)\n            if weights.shape[0] != start_state.shape[0] or not bool(torch.isfinite(weights).all()) or bool((weights < 0).any()):\n                raise ValueError(\"BPTT trust weights must be finite, nonnegative and match the batch\")\n        if self.cfg.strength == 0 or (weights is not None and not bool((weights > 0).any())):\n            return {\"accepted\": 0.0, \"rollback\": 0.0, \"skipped\": 1.0, \"kl\": 0.0,\n                    \"actor_grad_norm\": 0.0}\n        frozen = [self.model, self.critic]\n        frozen.extend(preprocessor for preprocessor in (self.state_preprocessor, self.value_preprocessor)\n                      if isinstance(preprocessor, nn.Module))\n        with freeze_parameters(*frozen), _evaluation(self.actor):\n            if anchor_observations is None:\n                anchor_observations = self.adapter.observation(start_state.detach(), context.detach())\n            anchor_observations = anchor_observations.detach()\n            with torch.no_grad():\n                old_mean, old_log_std = self._policy(anchor_observations)\n                old_mean, old_log_std = old_mean.clone(), old_log_std.clone()\n            rollout = self.imagine(start_state, context, dt=dt)\n            objective = imagination_objective(rollout, self.cfg.gamma, weights)\n            loss = -objective / self.cfg.horizon\n            self.optimizer.zero_grad(set_to_none=True)\n            if not loss.requires_grad:\n                return {\"accepted\": 0.0, \"rollback\": 0.0, \"skipped\": 1.0,\n                        \"no_gradient\": 1.0, \"kl\": 0.0, \"actor_grad_norm\": 0.0}\n            if not bool(torch.isfinite(loss)):\n                self.rejected_updates += 1\n                return {\"accepted\": 0.0, \"rollback\": 0.0, \"skipped\": 1.0,\n                        \"nonfinite\": 1.0, \"kl\": 0.0, \"actor_grad_norm\": 0.0}\n            loss.backward()\n            grad_norm = torch.nn.utils.clip_grad_norm_(self.actor.parameters(), self.cfg.max_grad_norm)\n            if not bool(torch.isfinite(grad_norm)):\n                self.optimizer.zero_grad(set_to_none=True)\n                self.rejected_updates += 1\n                return {\"accepted\": 0.0, \"rollback\": 0.0, \"skipped\": 1.0,\n                        \"nonfinite\": 1.0, \"kl\": 0.0, \"actor_grad_norm\": float(grad_norm)}\n            # Snapshot on the current GPU; rollback must include Adam moments/step.\n            before_actor = {name: value.detach().clone() for name, value in self.actor.state_dict().items()}\n            before_optimizer = deepcopy(self.optimizer.state_dict())\n            self.optimizer.step()\n            with torch.no_grad():\n                new_mean, new_log_std = self._policy(anchor_observations)\n                kl = diagonal_gaussian_kl(old_mean, old_log_std, new_mean, new_log_std).mean()\n                accepted = bool(torch.isfinite(kl)) and float(kl) <= self.cfg.max_kl\n            if accepted:\n                self.accepted_updates += 1\n            else:\n                self.actor.load_state_dict(before_actor)\n                self.optimizer.load_state_dict(before_optimizer)\n                self.optimizer.zero_grad(set_to_none=True)\n                self.rejected_updates += 1\n            actual_dt = torch.as_tensor(self.cfg.dt if dt is None else dt, device=start_state.device)\n            metrics = {\n                \"accepted\": float(accepted), \"rollback\": float(not accepted), \"skipped\": 0.0,\n                \"kl\": float(kl), \"objective\": float(objective.detach()),\n                \"actor_grad_norm\": float(grad_norm),\n                \"reward_mean\": float(rollout.rewards.detach().mean()),\n                \"survival_H\": float(rollout.survival[-1].detach().mean()),\n                \"tail_value\": float(rollout.tail_values.detach().mean()),\n                \"timeout_fraction\": float(rollout.timeouts.detach().mean()),\n                \"trust_mean\": 1.0 if weights is None else float(weights.mean()),\n                \"dt_mean\": float(actual_dt.float().mean()),\n                \"horizon_seconds_mean\": float(actual_dt.float().mean()) * self.cfg.horizon,\n                \"effective_lr\": float(self.optimizer.param_groups[0][\"lr\"]),\n            }\n        return metrics\n\n    def state_dict(self):\n        return {\"optimizer\": self.optimizer.state_dict(),\n                \"accepted_updates\": self.accepted_updates,\n                \"rejected_updates\": self.rejected_updates}\n\n    def load_state_dict(self, state):\n        self.optimizer.load_state_dict(state[\"optimizer\"])\n        self.accepted_updates = int(state.get(\"accepted_updates\", 0))\n        self.rejected_updates = int(state.get(\"rejected_updates\", 0))\n","sha256":"a1b7c671732d25478d7c1694d8f846b7afa4f4507008af39b8916c9d5a017fb3"},"DQ_high-level/utils/pick_success.py":{"text":"\"\"\"Grasp-and-lift criteria and episode statistics shared by train and eval.\"\"\"\n\nfrom collections import deque\n\nimport torch\nfrom utils.gripper_control import closing_command\n\n\nclass RollingEpisodeSuccess:\n    \"\"\"Keep the most recent completed episodes across all parallel environments.\n\n    Outcomes are (object_index, success) pairs in completion order. The caller\n    breaks simultaneous-completion ties by ascending environment index. Object\n    breakdowns use this SAME global window, not separate per-object histories.\n    \"\"\"\n\n    def __init__(self, window_size=1000):\n        if isinstance(window_size, bool) or not isinstance(window_size, int) or window_size <= 0:\n            raise ValueError(\"window_size must be a positive integer\")\n        self.window_size = window_size\n        self._outcomes = deque(maxlen=window_size)\n\n    def extend(self, outcomes):\n        self._outcomes.extend((int(obj), bool(success)) for obj, success in outcomes)\n\n    def metrics(self, object_names):\n        \"\"\"Return a snapshot; omit undefined rates when there are no samples.\"\"\"\n        completed = len(self._outcomes)\n        successes = sum(success for _, success in self._outcomes)\n        metrics = {\n            \"SuccessWindow / completed\": completed,\n            \"SuccessWindow / successes\": successes,\n        }\n        if not completed:\n            return metrics\n        if len(object_names) == 1:\n            metrics[f\"SuccessRate / {object_names[0]}\"] = successes / completed\n            return metrics\n\n        metrics[\"SuccessRate / total\"] = successes / completed\n        counts = [0] * len(object_names)\n        wins = [0] * len(object_names)\n        for obj, success in self._outcomes:\n            counts[obj] += 1\n            wins[obj] += success\n        for obj, name in enumerate(object_names):\n            metrics[f\"SuccessWindow / {name} / completed\"] = counts[obj]\n            metrics[f\"SuccessWindow / {name} / successes\"] = wins[obj]\n            if counts[obj]:\n                metrics[f\"SuccessRate / {name}\"] = wins[obj] / counts[obj]\n        return metrics\n\n\ndef lifted_grasp_mask(object_height, table_height, rest_height, ee_distance,\n                      gripper_opening, lift_threshold):\n    \"\"\"Measure lift above the object's resting height on the current table.\n\n    A closing-side opening (< 0.5) plus proximity is a grasp proxy, not a\n    contact-force test. Opening is normalized: 0 closed, 1 open.\n    Compare absolute heights to avoid subtractive rounding at the threshold.\n    \"\"\"\n    target_height = table_height + rest_height + lift_threshold\n    return ((object_height >= target_height)\n            & (ee_distance < 0.2)\n            & closing_command(gripper_opening))\n\n\ndef advance_pick_hold(lifted, interrupted, count, best_count, completed, hold_steps):\n    \"\"\"Advance consecutive holding; reward each holding milestone only once.\n\n    The caller latches ``success`` into ``completed`` until the episode resets.\n    Interrupted or incomplete grasps restart the consecutive count at zero.\n    \"\"\"\n    eligible = lifted & ~interrupted & ~completed\n    next_count = torch.where(eligible, count + 1, torch.zeros_like(count))\n    progress = eligible & (next_count > best_count)\n    success = eligible & (next_count >= hold_steps)\n    return next_count, torch.maximum(best_count, next_count), progress, success\n","sha256":"f22724796788d1d46053c60e5747d4101d2f006ca7ad31531cc123331f60a8e7"},"DQ_high-level/data/cfg/DQ_teacher.yaml":{"text":"env:\n  gripperActionMode: continuous_opening_v1  # action[6]: 0 closed, 1 open\n  numEnvs: 4096\n  numAgents: 1\n  envSpacing: 3\n  terrainType: plane # Flat ground; use trimesh to load rough terrain instead\n  enableDebugVis: False\n  isFlagrun: False\n  maxEpisodeLength: 100 \n  pdControl: True\n  powerScale: 1.0\n  controlFrequencyInv: 4\n  controlFrequencyLow: 8\n  imgDelayFrame: 4\n  D1_bench_task_level : \"Level02\"\n  robotStartDistanceRange: [2.0, 2.0] # Horizontal distance from robot base to object [m]\n  cameraVisibilityReset: False # Keep termination rules consistent with visual distillation\n\n  liftedSuccessThreshold: 0.2\n  liftedInitThreshold: 0.05\n  baseObjectDisThreshold: 0.2\n  holdSteps: 10\n  lastCommands: False\n  noVelocityObs: False # Set --no_velocity_obs to remove 3D robot + 2D relative object velocity\n  successMode: hold # legacy/hold are compatibility aliases for the shared training/evaluation rule\n  sgs:\n    mode: disabled # disabled / uniform / sgs; enabled modes require a validated bank\n    bank_path: \"\"\n    bank_size: null # Read the loaded bank size; an explicit integer enforces an exact match\n    history_size: 100\n    target_success: 0.5\n    kappa: 1.0\n    temperature: 2.0\n    epsi
