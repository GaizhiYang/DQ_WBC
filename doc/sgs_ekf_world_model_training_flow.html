entation, linear_velocity, angular_velocity, height\n\n        pred_position, pred_rotation, pred_linear, pred_angular, pred_height = relative(predicted)\n        true_position, true_rotation, true_linear, true_angular, true_height = relative(target)\n        true_rotation = torch.where((pred_rotation*true_rotation).sum(-1, keepdim=True) < 0,\n                                    -true_rotation, true_rotation)\n        errors = ((pred_position-true_position)/.05,\n                  2*(pred_rotation-true_rotation)/.1,\n                  (pred_linear-true_linear)/.5,\n                  pred_angular-true_angular,\n                  (pred_height-true_height)/.05)\n        return torch.stack([error.square().mean(-1) for error in errors], -1).mean(-1)\n\n    def reward_terms(self, previous, state, action, context):\n        \"\"\"Exact default reward equations; no surrogate success reward.\"\"\"\n        action = action.clamp(-self.clip_actions, self.clip_actions)\n        outcome = self.task_outcome(previous, state, action, context)\n        robot, obj, ee, base, angles, heading, arm = self._geometry(state)\n        distance, height = outcome[\"distance\"], outcome[\"height\"]\n        closest = self.get(previous, \"closest\")[:, 0]\n        highest = self.get(previous, \"highest\")[:, 0]\n        closest = torch.where(closest < 0, distance, closest)\n        highest = torch.where(highest < 0, height, highest)\n        base_distance = torch.linalg.vector_norm(obj[:, :2]-arm[:, :2], dim=-1)\n        object_direction = obj[:, :3]-ee[:, :3]\n        ee_x = quat_apply(quat_normalize(ee[:, 3:7]), state.new_tensor([1., 0., 0.]).expand(len(state), -1))\n        orientation = F.cosine_similarity(ee_x, object_direction, dim=-1)\n        orientation = torch.where(distance >= .01, orientation, torch.zeros_like(orientation))\n        base_height = torch.exp(-(robot[:, 2]-self.base_height_target).abs())\n        yaw_deviation = (angles[:, 2]-context[:, 1]).abs()\n        acc = torch.linalg.vector_norm(self.get(state, \"dof_vel\")[:, -7:-1]-self.get(state, \"last_dof_vel\")[:, -7:-1], dim=-1)/self.low_dt\n        commands = self.get(state, \"commands\")\n        terms = {\n            \"approaching\": torch.tanh(10*(closest-distance).clamp(0., 10.)) * ~outcome[\"lifted\"],\n            \"lifting\": torch.tanh(10*(height-highest).clamp(0., 10.)) * ~outcome[\"lifted\"],\n            \"pick_up\": outcome[\"success\"].to(state.dtype),\n            \"acc_penalty\": 1-torch.exp(-acc),\n            \"command_reward\": torch.where(base_distance < .2, torch.exp(-commands[:, 0].abs()), torch.zeros_like(distance))*context[:, 3],\n            \"action_rate\": torch.linalg.vector_norm(action[:, 7:9]-self.get(previous, \"prev_action\")[:, 7:9], dim=-1),\n            \"gripper_rate\": (action[:, 6]-self.get(previous, \"prev_action\")[:, 6]).abs()*context[:, 3],\n            \"action_penalty\": 1-torch.exp(-10*torch.linalg.vector_norm(action, dim=-1)),\n            \"ee_orn\": orientation,\n            # Existing code zeroes XY of the object direction. Its dot product\n            # with the horizontal heading is zero; preserve this baseline.\n            \"base_dir\": torch.zeros_like(distance),\n            \"base_approaching\": torch.tanh(-10*(base_distance-self.base_distance).abs())+1,\n            \"base_height\": base_height,\n            \"grasp_base_height\": base_height*outcome[\"hold_progress\"],\n            \"rad_penalty\": torch.exp(-(torch.linalg.vector_norm(self.get(state, \"goal_pos\"), dim=-1)-.9).abs()/.15),\n            \"base_ang_pen\": torch.linalg.vector_norm(robot[:, 10:13], dim=-1),\n            \"limit_yaw_rotation_penalty\": torch.where(yaw_deviation > math.radians(60), -torch.tanh(yaw_deviation), torch.zeros_like(distance)),\n        }\n        return terms\n\n    def reward(self, previous, state, action, context):\n        terms = self.reward_terms(previous, state, action, context)\n        result = sum(terms[name]*scale for name, scale in self.reward_scales.items())\n        return result.clamp_min(0.) if self.only_positive else result\n\n    def termination_features(self, state, context):\n        robot, obj, ee, base, angles, heading, arm = self._geometry(state)\n        relative_ee = quat_inverse_apply(base, ee[:, :3]-arm)\n        return torch.stack((angles[:, 0]/.8, angles[:, 1]/.8, robot[:, 2]/.1,\n                            (self.get(state, \"goal_pos\")[:, 2]-relative_ee[:, 2]).abs()/.2,\n                            (obj[:, 2]+.015-self.get(state, \"table_height\")[:, 0])/.05,\n                            (angles[:, 2]-context[:, 1]).abs()/math.radians(70),\n                            self.get(state, \"hold\")[:, 0]/self.hold_steps,\n                            self.get(state, \"progress\")[:, 0]/self.max_steps), -1)\n\n    def timeouts(self, state, context=None):\n        return self.get(state, \"progress\")[:, 0] >= self.max_steps\n\n    def sample_dt(self, batch_size):\n        maximum = self.env.control_freq_low_init\n        if self.env.rand_control:\n            cycles = torch.randint(maximum-1, maximum+1, (batch_size, 1), device=self.device)\n            return cycles.to(self.dtype)*self.low_dt\n        return torch.full((batch_size, 1), maximum*self.low_dt, device=self.device, dtype=self.dtype)\n","sha256":"b8b324f4b78c991951745d8c71525d8f2c226e184dd5225f8f992b27ffa019be"},"DQ_high-level/utils/world_model/replay.py":{"text":"\"\"\"Device-resident, episode-safe replay for high-level physical transitions.\n\nAdapted from SuperMimic-Reproduced ``data/replay_buffer.py`` (MIT). See\nTHIRD_PARTY_LICENSES.md. Unlike that implementation, each row explicitly stores\nthe pre-reset next state, so a terminal transition never needs a synthetic row.\nThe replay, sampling probabilities and returned batches stay on the RL device.\n\"\"\"\n\nfrom dataclasses import dataclass\nimport torch\n\n\n@dataclass\nclass WindowBatch:\n    states: torch.Tensor       # [K+1, B, S], predictions must use states[0] only\n    actions: torch.Tensor      # [K, B, A], actually executed high-level actions\n    context: torch.Tensor      # [K, B, C]\n    dt: torch.Tensor           # [K, B, 1], actual duration of each transition\n    rewards: torch.Tensor      # [K, B]\n    terminated: torch.Tensor   # [K, B], natural terminal, including success\n    truncated: torch.Tensor    # [K, B], timeout, distinct from natural terminal\n    success: torch.Tensor      # [K, B], existing task success proxy\n    family: torch.Tensor       # [B], reset family, NOT task execution stage\n    episode_ids: torch.Tensor  # [B]\n    env_ids: torch.Tensor      # [B]\n\n\n@dataclass\nclass StartBatch:\n    state: torch.Tensor\n    action: torch.Tensor\n    next_state: torch.Tensor\n    context: torch.Tensor\n    dt: torch.Tensor\n    rewards: torch.Tensor\n    terminated: torch.Tensor\n    truncated: torch.Tensor\n    success: torch.Tensor\n    family: torch.Tensor\n    episode_ids: torch.Tensor\n    env_ids: torch.Tensor\n\n\nclass TransitionReplay:\n    \"\"\"Synchronous GPU ring, laid out [time, environment, feature].\n\n    ``capacity`` is measured in vectorized environment steps. A monotonically\n    increasing time stamp forbids false windows across a ring overwrite, even\n    inside a very long episode. Train/validation ownership is a deterministic\n    hash of (environment, episode), so overlapping windows cannot leak between\n    the splits. Recorded terminal next states must be captured BEFORE reset.\n    \"\"\"\n\n    def __init__(self, num_envs, capacity, state_dim, action_dim, context_dim,\n                 device, holdout_fraction=0.1, num_families=3):\n        self.num_envs, self.capacity = int(num_envs), int(capacity)\n        self.state_dim, self.action_dim = int(state_dim), int(action_dim)\n        self.context_dim, self.num_families = int(context_dim), int(num_families)\n        self.device = torch.empty(0, device=device).device\n        self.holdout_fraction = float(holdout_fraction)\n        if min(self.num_envs, self.capacity, self.state_dim, self.action_dim,\n               self.num_families) < 1 or self.context_dim < 0:\n            raise ValueError(\"Invalid world-model replay dimensions\")\n        if not 0 <= self.holdout_fraction < 1:\n            raise ValueError(\"holdout_fraction must be in [0, 1)\")\n        shape = (self.capacity, self.num_envs)\n        self.states = torch.empty(*shape, self.state_dim, device=self.device)\n        self.next_states = torch.empty_like(self.states)\n        self.actions = torch.empty(*shape, self.action_dim, device=self.device)\n        self.context = torch.empty(*shape, self.context_dim, device=self.device)\n        self.dt = torch.empty(*shape, 1, device=self.device)\n        self.rewards = torch.empty(*shape, device=self.device)\n        self.terminated = torch.zeros(*shape, device=self.device, dtype=torch.bool)\n        self.truncated = torch.zeros_like(self.terminated)\n        self.success = torch.zeros_like(self.terminated)\n        self.valid = torch.zeros_like(self.terminated)\n        self.holdout = torch.zeros_like(self.terminated)\n        self.family = torch.zeros(*shape, device=self.device, dtype=torch.long)\n        self.episode_ids = torch.full_like(self.family, -1)\n        self.stamp = torch.full_like(self.family, -1)\n        self._episodes = torch.zeros(self.num_envs, device=self.device, dtype=torch.long)\n        self._env_ids = torch.arange(self.num_envs, device=self.device)\n        self.steps = 0\n\n    @property\n    def size(self):\n        \"\"\"Number of valid transitions (a scalar diagnostic synchronizes CUDA).\"\"\"\n        return int(self.valid.sum().item())\n\n    @property\n    def memory_bytes(self):\n        return sum(v.numel() * v.element_size() for v in vars(self).values()\n                   if isinstance(v, torch.Tensor))\n\n    def _tensor(self, value, dtype=torch.float32):\n        return torch.as_tensor(value, device=self.device, dtype=dtype).detach()\n\n    @torch.no_grad()\n    def add(self, states, actions, next_states, context, dt, rewards,\n            terminated, truncated, family, episode_ids=None, valid=None,\n            success=None):\n        \"\"\"Copy one complete vector step without retaining simulator buffers.\n\n        ``valid=False`` excludes a transition with no trustworthy terminal state\n        (or an external reset); any multi-step window containing it is excluded.\n        Passing explicit episode IDs also handles resets outside normal ``done``.\n        \"\"\"\n        row = self.steps % self.capacity\n        states = self._tensor(states).reshape(self.num_envs, self.state_dim)\n        actions = self._tensor(actions).reshape(self.num_envs, self.action_dim)\n        next_states = self._tensor(next_states).reshape(self.num_envs, self.state_dim)\n        context = self._tensor(context).reshape(self.num_envs, self.context_dim)\n        durations = self._tensor(dt).reshape(-1, 1).expand(self.num_envs, 1)\n        rewards = self._tensor(rewards).reshape(self.num_envs)\n        terminated = self._tensor(terminated, torch.bool).reshape(self.num_envs)\n        truncated = self._tensor(truncated, torch.bool).reshape(self.num_envs)\n        family = self._tensor(family, torch.long).reshape(self.num_envs)\n        episodes = (self._episodes if episode_ids is None else\n                    self._tensor(episode_ids, torch.long).reshape(self.num_envs))\n        finite = (torch.isfinite(states).all(-1) & torch.isfinite(next_states).all(-1)\n                  & torch.isfinite(actions).all(-1) & torch.isfinite(context).all(-1)\n                  & torch.isfinite(durations[:, 0]) & (durations[:, 0] > 0)\n                  & torch.isfinite(rewards) & (family >= 0)\n                  & (family < self.num_families) & (episodes >= 0))\n        if valid is not None:\n            finite &= self._tensor(valid, torch.bool).reshape(self.num_envs)\n        self.states[row].copy_(states)\n        self.next_states[row].copy_(next_states)\n        self.actions[row].copy_(actions)\n        self.context[row].copy_(context)\n        self.dt[row].copy_(durations)\n        self.rewards[row].copy_(rewards)\n        self.terminated[row].copy_(terminated)\n        self.truncated[row].copy_(truncated)\n        self.success[row].copy_(torch.zeros_like(terminated) if success is None else\n                                self._tensor(success, torch.bool).reshape(self.num_envs))\n        self.family[row].copy_(family)\n        self.episode_ids[row].copy_(episodes)\n        self.stamp[row].fill_(self.steps)\n        self.valid[row].copy_(finite)\n        # Integer hashing; all transitions of one episode get the same split.\n        hashed = ((episodes * 1103515245 + (self._env_ids + 1) * 12345)\n                  % 2147483647) % 10000\n        self.holdout[row].copy_(hashed < int(self.holdout_fraction * 10000))\n        self._episodes.copy_(episodes + (terminated | truncated).long())\n        self.steps += 1\n\n    def _split_mask(self, split):\n        if split == \"train\":\n            return self.valid & ~self.holdout\n        if split in (\"validation\", \"holdout\"):\n            return self.valid & self.holdout\n        if split == \"all\":\n            return self.valid.clone()\n        raise ValueError(\"split must be train, validation, holdout, or all\")\n\n    @torch.no_grad()\n    def window_mask(self, k, split=\"train\"):\n        k = int(k)\n        if not 1 <= k <= self.capacity:\n            raise ValueError(\"window must be between 1 and replay capacity\")\n        mask = self._split_mask(split)\n        done = self.terminated | self.truncated\n        for offset in range(1, k):\n            mask &= (torch.roll(self.valid, -offset, 0)\n                     & (torch.roll(self.episode_ids, -offset, 0) == self.episode_ids)\n                     & (torch.roll(self.family, -offset, 0) == self.family)\n                     & (torch.roll(self.stamp, -offset, 0) == self.stamp + offset)\n                     & ~torch.roll(done, -(offset - 1), 0))\n        return mask\n\n    def can_sample(self, k=1, split=\"train\"):\n        return bool(self.window_mask(k, split).any())\n\n    @torch.no_grad()\n    def _sample_indices(self, mask, n, balance_families=True,\n                        recent_fraction=0.0, recent_steps=32):\n        if int(n) < 1:\n            raise ValueError(\"sample batch size must be positive\")\n        if not 0 <= float(recent_fraction) <= 1:\n            raise ValueError(\"recent_fraction must be in [0, 1]\")\n        # nonzero is the only dynamic cardinality operation. Payloads never move\n        # to the CPU; the candidate indices and multinomial sampler stay on GPU.\n        indices = mask.reshape(-1).nonzero(as_tuple=False).flatten()\n        if indices.numel() == 0:\n            raise RuntimeError(\"World-model replay has no sampleable windows\")\n        families = self.family.reshape(-1)[indices]\n        weights = torch.ones(indices.numel(), device=self.device)\n        if balance_families:\n            counts = torch.bincount(families, minlength=self.num_families)\n            weights /= counts[families].clamp_min(1)\n        weights /= weights.sum()\n        if recent_fraction > 0:\n            recent = (self.stamp.reshape(-1)[indices] >=\n                      self.steps - max(1, int(recent_steps))).float()\n            if balance_families:\n                counts = torch.zeros(self.num_families, device=self.device)\n                counts.scatter_add_(0, families, recent)\n                recent /= counts[families].clamp_min(1)\n            recent = torch.where(recent.sum() > 0,\n                                 recent / recent.sum().clamp_min(1e-12), weights)\n            weights = (1 - recent_fraction) * weights + recent_fraction * recent\n        sampled = indices[torch.multinomial(weights, int(n), replacement=True)]\n        return sampled // self.num_envs, sampled % self.num_envs\n\n    @torch.no_grad()\n    def sample_windows(self, n, k, split=\"train\", balance_families=True,\n                       recent_fraction=0.0, recent_steps=32):\n        row, env = self._sample_indices(self.window_mask(k, split), n,\n                                       balance_families, recent_fraction, recent_steps)\n        offsets = torch.arange(k, device=self.device)[:, None]\n        rr = (row[None, :] + offsets) % self.capacity\n        ee = env[None, :].expand(k, -1)\n        # Explicit next states retain the final physical state when k ends at a\n        # termination. No reset observation can become a supervised target.\n        states = torch.cat((self.states[row, env][None], self.next_states[rr, ee]), 0)\n        return WindowBatch(states, self.actions[rr, ee], self.context[rr, ee],\n                           self.dt[rr, ee], self.rewards[rr, ee],\n                           self.terminated[rr, ee], self.truncated[rr, ee],\n                           self.success[rr, ee], self.family[row, env],\n                           self.episode_ids[row, env], env)\n\n    @torch.no_grad()\n    def sample_starts(self, n, split=\"train\", balance_families=True,\n                      recent_fraction=0.0, recent_steps=32):\n        row, env = self._sample_indices(self._split_mask(split), n,\n                                       balance_families, recent_fraction, recent_steps)\n        return StartBatch(self.states[row, env], self.actions[row, env],\n                          self.next_states[row, env], self.context[row, env],\n                          self.dt[row, env], self.rewards[row, env],\n                          self.terminated[row, env], self.truncated[row, env],\n                          self.success[row, env], self.family[row, env],\n                          self.episode_ids[row, env], env)\n","sha256":"390c218a7514f4d050e5246127078902b5fe1825db8f3a7a4f1c65423cd79adc"},"third_party/skrl/skrl/resources/preprocessors/torch/running_standard_scaler.py":{"text":"from typing import Optional, Tuple, Union\n\nimport gym\nimport gymnasium\n\nimport numpy as np\nimport torch\nimport torch.nn as nn\n\n\nclass RunningStandardScaler(nn.Module):\n    def __init__(self,\n                 size: Union[int, Tuple[int], gym.Space, gymnasium.Space],\n                 epsilon: float = 1e-8,\n                 clip_threshold: float = 5.0,\n                 device: Optional[Union[str, torch.device]] = None) -> None:\n        \"\"\"Standardize the input data by removing the mean and scaling by the standard deviation\n\n        The implementation is adapted from the rl_games library\n        (https://github.com/Denys88/rl_games/blob/master/rl_games/algos_torch/running_mean_std.py)\n\n        Example::\n\n            >>> running_standard_scaler = RunningStandardScaler(size=2)\n            >>> data = torch.rand(3, 2)  # tensor of shape (N, 2)\n            >>> running_standard_scaler(data)\n            tensor([[0.1954, 0.3356],\n                    [0.9719, 0.4163],\n                    [0.8540, 0.1982]])\n\n        :param size: Size of the input space\n        :type size: int, tuple or list of integers, gym.Space, or gymnasium.Space\n        :param epsilon: Small number to avoid division by zero (default: ``1e-8``)\n        :type epsilon: float\n        :param clip_threshold: Threshold to clip the data (default: ``5.0``)\n        :type clip_threshold: float\n        :param device: Device on which a tensor/array is or will be allocated (default: ``None``).\n                       If None, the device will be either ``\"cuda\"`` if available or ``\"cpu\"``\n        :type device: str or torch.device, optional\n        \"\"\"\n        super().__init__()\n\n        self.epsilon = epsilon\n        self.clip_threshold = clip_threshold\n        if device is None:\n            self.device = torch.device(\"cuda:0\" if torch.cuda.is_available() else \"cpu\")\n        else:\n            self.device = torch.device(device)\n\n        size = self._get_space_size(size)\n\n        self.register_buffer(\"running_mean\", torch.zeros(size, dtype=torch.float64, device=self.device))\n        self.register_buffer(\"running_variance\", torch.ones(size, dtype=torch.float64, device=self.device))\n        self.register_buffer(\"current_count\", torch.ones((), dtype=torch.float64, device=self.device))\n\n    def _get_space_size(self, space: Union[int, Tuple[int], gym.Space, gymnasium.Space]) -> int:\n        \"\"\"Get the size (number of elements) of a space\n\n        :param space: Space or shape from which to obtain the number of elements\n        :type space: int, tuple or list of integers, gym.Space, or gymnasium.Space\n\n        :raises ValueError: If the space is not supported\n\n        :return: Size of the space data\n        :rtype: Space size (number of elements)\n        \"\"\"\n        if type(space) in [int, float]:\n            return int(space)\n        elif type(space) in [tuple, list]:\n            return np.prod(space)\n        elif issubclass(type(space), gym.Space):\n            if issubclass(type(space), gym.spaces.Discrete):\n                return 1\n            elif issubclass(type(space), gym.spaces.Box):\n                return np.prod(space.shape)\n            elif issubclass(type(space), gym.spaces.Dict):\n                return sum([self._get_space_size(space.spaces[key]) for key in space.spaces])\n        elif issubclass(type(space), gymnasium.Space):\n            if issubclass(type(space), gymnasium.spaces.Discrete):\n                return 1\n            elif issubclass(type(space), gymnasium.spaces.Box):\n                return np.prod(space.shape)\n            elif issubclass(type(space), gymnasium.spaces.Dict):\n                return sum([self._get_space_size(space.spaces[key]) for key in space.spaces])\n        raise ValueError(f\"Space type {type(space)} not supported\")\n\n    def _parallel_variance(self, input_mean: torch.Tensor, input_var: torch.Tensor, input_count: int) -> None:\n        \"\"\"Update internal variables using the parallel algorithm for computing variance\n\n        https://en.wikipedia.org/wiki/Algorithms_for_calculating_variance#Parallel_algorithm\n\n        :param input_mean: Mean of the input data\n        :type input_mean: torch.Tensor\n        :param input_var: Variance of the input data\n        :type input_var: torch.Tensor\n        :param input_count: Batch size of the input data\n        :type input_count: int\n        \"\"\"\n        delta = input_mean - self.running_mean\n        total_count = self.current_count + input_count\n        M2 = (self.running_variance * self.current_count) + (input_var * input_count) \\\n            + delta ** 2 * self.current_count * input_count / total_count\n\n        # update internal variables\n        self.running_mean = self.running_mean + delta * input_count / total_count\n        self.running_variance = M2 / total_count\n        self.current_count = total_count\n\n    def _compute(self, x: torch.Tensor, train: bool = False, inverse: bool = False) -> torch.Tensor:\n        \"\"\"Compute the standardization of the input data\n\n        :param x: Input tensor\n        :type x: torch.Tensor\n        :param train: Whether to train the standardizer (default: ``False``)\n        :type train: bool, optional\n        :param inverse: Whether to inverse the standardizer to scale back the data (default: ``False``)\n        :type inverse: bool, optional\n\n        :return: Standardized tensor\n        :rtype: torch.Tensor\n        \"\"\"\n        if train:\n            if x.dim() == 3:\n                self._parallel_variance(torch.mean(x, dim=(0, 1)), torch.var(x, dim=(0, 1)), x.shape[0] * x.shape[1])\n            else:\n                self._parallel_variance(torch.mean(x, dim=0), torch.var(x, dim=0), x.shape[0])\n\n        # scale back the data to the original representation\n        if inverse:\n            return torch.sqrt(self.running_variance.float()) \\\n                * torch.clamp(x, min=-self.clip_threshold, max=self.clip_threshold) + self.running_mean.float()\n        # standardization by centering and scaling\n        return torch.clamp((x - self.running_mean.float()) / (torch.sqrt(self.running_variance.float()) + self.epsilon),\n                           min=-self.clip_threshold,\n                           max=self.clip_threshold)\n\n        # return x\n\n    def forward(self,\n                x: torch.Tensor,\n                train: bool = False,\n                inverse: bool = False,\n                no_grad: bool = True) -> torch.Tensor:\n        \"\"\"Forward pass of the standardizer\n\n        Example::\n\n            >>> x = torch.rand(3, 2, device=\"cuda:0\")\n            >>> running_standard_scaler(x)\n            tensor([[0.6933, 0.1905],\n                    [0.3806, 0.3162],\n                    [0.1140, 0.0272]], device='cuda:0')\n\n            >>> running_standard_scaler(x, train=True)\n            tensor([[ 0.8681, -0.6731],\n                    [ 0.0560, -0.3684],\n                    [-0.6360, -1.0690]], device='cuda:0')\n\n            >>> running_standard_scaler(x, inverse=True)\n            tensor([[0.6260, 0.5468],\n                    [0.5056, 0.5987],\n                    [0.4029, 0.4795]], device='cuda:0')\n\n        :param x: Input tensor\n        :type x: torch.Tensor\n        :param train: Whether to train the standardizer (default: ``False``)\n        :type train: bool, optional\n        :param inverse: Whether to inverse the standardizer to scale back the data (default: ``False``)\n        :type inverse: bool, optional\n        :param no_grad: Whether to disable the gradient computation (default: ``True``)\n        :type no_grad: bool, optional\n\n        :return: Standardized tensor\n        :rtype: torch.Tensor\n        \"\"\"\n        if no_grad:\n            with torch.no_grad():\n                return self._compute(x, train, inverse)\n        return self._compute(x, train, inverse)\n    \n        # if isinstance(x, dict):\n        #     obs = x['obs']\n        # else:\n        #     obs = x\n\n        # if no_grad:\n        #     with torch.no_grad():\n        #         return self._compute(obs, train, inverse)\n        # return self._compute(obs, train, inverse)\n\n","sha256":"0d8c187353010de79e25b2fd0268c7335b2e674d0e0c5191d87ba5907c868715"},"DQ_high-level/modules/predictattention.py":{"text":"import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nimport numpy as np\n\nclass PredictAttentionSelector(nn.Module):\n    def __init__(self, d_model=64):\n        super().__init__()\n        self.key_proj = nn.Linear(6, d_model)\n        self.value_proj = nn.Linear(6, d_model)\n        self.query_proj = nn.Linear(134, d_model)\n        self.output_proj = nn.Linear(d_model, 6)  # 输出最终抓取点\n\n    def attention_forward(self, grasps, obj_feat, pose):\n        B, N, _ = grasps.shape\n        context = torch.cat([obj_feat, pose], dim=-1)  # [B, 134]\n        Q = self.query_proj(context).unsqueeze(1)      # [B, 1, d_model]\n        K = self.key_proj(grasps)                      # [B, N, d_model]\n        V = self.value_proj(grasps)                    # [B, N, d_model]\n\n        attn = torch.softmax((Q @ K.transpose(-2, -1)) / np.sqrt(K.size(-1)), dim=-1)  # [B, 1, N]\n        weighted = attn @ V      # [B, 1, d_model]\n        selected_grasp = self.output_proj(weighted.squeeze(1))  # [B, 6]\n        return selected_grasp\n\n","sha256":"081d59ff03ada4155cc2ed35f14fe819cc84ebfe6f8f59b87b4aa6336e151a16"},"DQ_high-level/utils/world_model/gradients.py":{"text":"\"\"\"Parameter freezing without cutting differentiable model/critic inputs.\"\"\"\n\nfrom contextlib import contextmanager\n\n\n@contextmanager\ndef freeze_parameters(*modules):\n    \"\"\"Keep autograd enabled while temporarily freezing the given parameters.\n\n    ``torch.no_grad`` and detached model outputs are intentionally not used:\n    actor BPTT requires the dynamics and terminal value input Jacobians.\n    Original flags and train/eval modes are restored even if the body raises.\n    \"\"\"\n    parameters = []\n    seen = set()\n    modes = []\n    seen_modules = set()\n    for module in modules:\n        for child in module.modules():\n            if id(child) not in seen_modules:\n                seen_modules.add(id(child))\n                modes.append((child, child.training))\n        for parameter in module.parameters():\n            if id(parameter) not in seen:\n                seen.add(id(parameter))\n                parameters.append((parameter, parameter.requires_grad))\n                parameter.requires_grad_(False)\n        module.eval()\n    try:\n        yield\n    finally:\n        for parameter, requires_grad in parameters:\n            parameter.requires_grad_(requires_grad)\n        for module, training in modes:\n            module.training = training\n","sha256":"844d56eeee041418e6eff087448d0a6f59ce81769e4f41807598424dca508ea8"},"DQ_high-level/probe_teacher_world_model.py":{"text":"#!/usr/bin/env python3\n\"\"\"Validate candidate action effects using independent Isaac Gym worker processes.\n\nExample (activate dqwbc first)::\n\n    python probe_teacher_world_model.py --checkpoint candidate.pt \\\n        --output probe.json --num_envs 128 --prefix_steps 4 --seed 43\n\nThe candidate bundle includes the model, matching teacher/scalers and task\nconfiguration. A fixed deterministic-mean Actor prefix is collected once.\nBase/+/-/base-repeat workers then create fresh simulators and replay that\nprefix with identical seeds. A failed statistical validation still writes an\nhonest report and exits normally; worker/runtime errors exit nonzero.\n\"\"\"\n\nimport argparse\nfrom copy import deepcopy\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport subprocess\nimport sys\nimport time\n\n\nROOT = Path(__file__).resolve().parent\n\n\ndef parser():\n    arguments = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)\n    arguments.add_argument(\"--checkpoint\", required=True, help=\"Single candidate bundle saved by WorldModelPPO.save_candidate\")\n    arguments.add_argument(\"--output\", required=True, help=\"JSON action-effect report\")\n    arguments.add_argument(\"--num_envs\", type=int, default=128)\n    arguments.add_argument(\"--prefix_steps\", type=int, default=4)\n    arguments.add_argument(\"--seed\", type=int, default=43)\n    arguments.add_argument(\"--device\", default=\"cuda:0\")\n    arguments.add_argument(\"--worker_timeout\", type=float, default=600.)\n    arguments.add_argument(\"--min_pairs\", type=int, default=64)\n    arguments.add_argument(\"--min_informative_pairs\", type=int, default=32)\n    arguments.add_argument(\"--family_sampling\", choices=(\"balanced\", \"original\"), default=\"balanced\",\n                           help=\"Sampling only in isolated probe worlds; main SGS remains unchanged\")\n    arguments.add_argument(\"--workdir\", default=None, help=\"Evidence/log directory; defaults to OUTPUT.artifacts\")\n    arguments.add_argument(\"--worker\", choices=(\"plan\", \"base\", \"plus\", \"minus\", \"repeat\"),\n                           default=None, help=argparse.SUPPRESS)\n    arguments.add_argument(\"--bundle_sha256\", default=None, help=argparse.SUPPRESS)\n    return arguments\n\n\ndef _file_sha256(path):\n    digest = hashlib.sha256()\n    with open(path, \"rb\") as stream:\n        for block in iter(lambda: stream.read(1024*1024), b\"\"):\n            digest.update(block)\n    return digest.hexdigest()\n\n\ndef _load_bundle(torch, path):\n    bundle = torch.load(path, map_location=\"cpu\", weights_only=False)\n    if bundle.get(\"schema\") != \"dq-world-model-candidate-v1\":\n        raise ValueError(\"Expected a dq-world-model-candidate-v1 checkpoint\")\n    for name in (\"model\", \"metadata\", \"config\", \"teacher\", \"teacher_config\", \"teacher_arguments\"):\n        if not bundle.get(name):\n            raise ValueError(\"Candidate bundle is missing %s; re-export it with the matching teacher/configuration\" % name)\n    return bundle\n\n\ndef _new_session(cli, bundle, torch):\n    # Isaac Gym must be imported by the worker before PyTorch (see _worker).\n    import yaml\n    import train_multistate_DQ_teacher as teacher\n    from utils.config import get_parser\n    from utils.wm_env import TeacherWorldModelAdapter\n    from utils.world_model.probes import (IsaacGymProbeSession, configuration_fingerprint,\n                                         balanced_family_config_ids)\n\n    args = get_parser().parse_args([])\n    for name, value in bundle[\"teacher_arguments\"].items():\n        if hasattr(args, name):\n            setattr(args, name, value)\n    # These changes affect diagnostics/resources, not the training task.\n    args.num_envs, args.seed = cli.num_envs, cli.seed\n    args.rl_device = args.sim_device = cli.device\n    args.headless, args.debug, args.debugvis = True, False, False\n    args.wandb, args.record_video = False, False\n    args.checkpoint, args.resume, args.eval = \"\", False, False\n    args.tsil = False\n    for name in vars(args):\n        if name.startswith(\"wm_\"):\n            setattr(args, name, None)\n    args.world_model = \"off\"\n    args.experiment_dir = str(Path(cli.workdir)/\"runs\")\n    args.wandb_name = cli.worker\n    args.stop_after = None\n    cfg = deepcopy(bundle[\"teacher_config\"])\n    cfg[\"env\"][\"numEnvs\"] = cli.num_envs\n    cfg[\"env\"][\"totalTimesteps\"] = int(args.timesteps)\n    cfg[\"env\"][\"wandb\"] = False\n    cfg[\"env\"].setdefault(\"tsil\", {})[\"enabled\"] = False\n    cfg[\"env\"].setdefault(\"world_model\", {})[\"mode\"] = \"off\"\n    # Keep reward/curriculum time aligned with the exported training policy.\n    cfg[\"env\"][\"globalStepCounter\"] = int(bundle.get(\"global_step\", bundle.get(\"collected_steps\", 0)))\n    cfg_path = Path(cli.workdir)/(cli.worker+\"_teacher.yaml\")\n    cfg_path.write_text(yaml.safe_dump(cfg, sort_keys=False), encoding=\"utf-8\")\n    args.cfg_file = str(cfg_path)\n    original_get_params = teacher.get_params\n    original_argv = sys.argv\n    try:\n        teacher.get_params = lambda: deepcopy(args)\n        # B1Z1PickMulti separately reads --timesteps during construction.\n        # Do not leak the probe CLI into that legacy parser.\n        sys.argv = [str(ROOT/\"train_multistate_DQ_teacher.py\"), \"--timesteps\", str(args.timesteps)]\n        # Keep training physics/rewards while suppressing all agent loggers.\n        # Disabling W&B alone still creates a SummaryWriter, whose nested\n        # event file can divert the parent run's TensorBoard synchronization.\n        trainer = teacher.get_trainer(is_eval=False, enable_logging=False)\n    finally:\n        teacher.get_params = original_get_params\n        sys.argv = original_argv\n    agent = trainer.agents\n    weights = bundle[\"teacher\"]\n    agent.policy.load_state_dict(weights[\"policy\"])\n    agent.value.load_state_dict(weights[\"value\"])\n    for name, attribute in ((\"state_preprocessor\", \"_state_preprocessor\"),\n                            (\"value_preprocessor\", \"_value_preprocessor\")):\n        if weights.get(name) is not None:\n            getattr(agent, attribute).load_state_dict(weights[name])\n    agent.set_running_mode(\"eval\")\n    adapter = TeacherWorldModelAdapter(trainer.env._env)\n    if hasattr(adapter, \"metadata\"):\n        actual_metadata = adapter.metadata()\n        if configuration_fingerprint(actual_metadata) != configuration_fingerprint(bundle[\"metadata\"]):\n            raise ValueError(\"Probe task/adapter schema does not match candidate metadata\")\n    raw_env = trainer.env._env\n    sgs_enabled = getattr(raw_env, \"sgs_enabled\", False)\n    fingerprint = raw_env.sgs_bank.fingerprint if sgs_enabled else None\n    if \"sgs_bank_fingerprint\" in bundle and bundle[\"sgs_bank_fingerprint\"] != fingerprint:\n        raise ValueError(\"Probe reset bank differs from the exported teacher's bank fingerprint\")\n    if sgs_enabled and cli.family_sampling == \"balanced\":\n        original_sample = raw_env.sgs_sampler.sample\n        try:\n            raw_env.sgs_sampler.sample = lambda count, mode=None: balanced_family_config_ids(\n                raw_env.sgs_bank.tensors[\"family_id\"], count, cli.seed+821)\n            trainer.env.reset()\n        finally:\n            raw_env.sgs_sampler.sample = original_sample\n    else:\n        trainer.env.reset()\n    session = IsaacGymProbeSession(trainer.env._env, adapter)\n    session.trainer = trainer\n    session.probe_families = (raw_env.sgs_bank.tensors[\"family_id\"][raw_env.active_config_id].clone()\n                              if sgs_enabled else torch.zeros(cli.num_envs, device=cli.device, dtype=torch.long))\n    session.probe_family_names = list(raw_env.sgs_family_names) if sgs_enabled else [\"full_task\"]\n    session.bank_fingerprint = fingerprint\n    return session\n\n\ndef _worker(cli):\n    # Import order is required by the installed Isaac Gym extension.\n    from isaacgym import gymapi  # noqa: F401\n    import torch\n    from utils.world_model import ResidualDynamics\n    from utils.world_model.probes import (bounded_probe_action, model_fingerprint,\n                                         random_continuous_directions, seed_probe)\n\n    if not cli.device.startswith(\"cuda\") or not torch.cuda.is_available():\n        raise RuntimeError(\"Real teacher probes require CUDA simulation and CUDA model execution\")\n    torch.set_num_threads(1)\n    seed_probe(cli.seed)\n    if cli.bundle_sha256 is not None and _file_sha256(cli.checkpoint) != cli.bundle_sha256:\n        raise ValueError(\"Candidate bundle changed after probe launch; model and teacher must be one immutable snapshot\")\n    bundle = _load_bundle(torch, cli.checkpoint)\n    session = _new_session(cli, bundle, torch)\n    try:\n        with torch.no_grad():\n            if cli.worker == \"plan\":\n                prefix = []\n                for _ in range(cli.prefix_steps):\n                    raw_obs = session.env.obs_buf.clamp(-session.env.clip_obs, session.env.clip_obs)\n                    obs = session.trainer.agents._state_preprocessor(raw_obs, train=False)\n                    action, _, _ = session.trainer.agents.policy.compute({\"states\": obs}, role=\"policy\")\n                    action = session.trainer.agents.policy.mean_to_action(action)\n                    prefix.append(action.detach().clone())\n                    session.step(action)\n                raw_obs = session.env.obs_buf.clamp(-session.env.clip_obs, session.env.clip_obs)\n                obs = session.trainer.agents._state_preprocessor(raw_obs, train=False)\n                base, _, _ = session.trainer.agents.policy.compute({\"states\": obs}, role=\"policy\")\n                # compute returns a latent Gaussian mean; the environment\n                # consumes sigmoid-transformed continuous gripper opening.\n                base = session.trainer.agents.policy.mean_to_action(base).detach().clone()\n                generator = torch.Generator(device=cli.device).manual_seed(cli.seed+1943)\n                directions = random_continuous_directions(base, generator=generator)\n                state, context = session.capture()\n                plan = {\"prefix\": (torch.stack(prefix) if prefix else\n                                   torch.empty(0, cli.num_envs, 9, device=cli.device)),\n                        \"base\": base, \"directions\": directions, \"start\": state, \"context\": context,\n                        \"families\": session.probe_families}\n                torch.save({key: value.cpu() for key, value in plan.items()}, Path(cli.workdir)/\"plan.pt\")\n                print(\"Recorded fixed mean-policy prefix: %d steps, %d CUDA environments\" % (cli.prefix_steps, cli.num_envs), flush=True)\n                return\n            plan = torch.load(Path(cli.workdir)/\"plan.pt\", map_location=cli.device, weights_only=False)\n            alive = torch.ones(cli.num_envs, device=cli.device, dtype=torch.bool)\n            prefix_dt = []\n            for action in plan[\"prefix\"]:\n                transition = session.step(bounded_probe_action(action))\n                alive &= ~transition.terminated\n                prefix_dt.append(transition.dt)\n            state, context = session.capture()\n            multiplier = {\"base\": 0., \"plus\": 1., \"minus\": -1., \"repeat\": 0.}[cli.worker]\n            action = bounded_probe_action(plan[\"base\"], plan[\"directions\"], multiplier)\n            physical_context = session.adapter.normalize_context(context)\n            transition = session.step(action)\n            action = transition.executed_action\n            config = bundle[\"config\"]\n            model = ResidualDynamics(session.adapter, hidden=tuple(config.get(\"hidden\", (512, 512, 512))),\n                                     term_hidden=tuple(config.get(\"term_hidden\", (64, 64))),\n                                     nominal_dt=float(config.get(\"nominal_dt\", .15)), device=cli.device)\n            model.load_state_dict(bundle[\"model\"])\n            model.eval()\n            predicted = model.step(state, action, context, transition.dt)\n            predicted_reward = session.adapter.reward(state, predicted, action, context).reshape(-1)\n            record = {\"start\": state, \"context\": context, \"physical_context\": physical_context,\n                      \"reward\": transition.reward, \"dt\": transition.dt, \"model_reward\": predicted_reward,\n                      \"alive\": alive, \"prefix_dt\": (torch.stack(prefix_dt) if prefix_dt else\n                                        torch.empty(0, cli.num_envs, 1, device=cli.device)),\n                      \"next_state\": transition.state, \"predicted_state\": predicted,\n                      \"actions\": action, \"families\": session.probe_families}\n            record = {name: value.detach().cpu() for name, value in record.items()}\n            record[\"model_sha256\"] = model_fingerprint(model)\n            record[\"configuration\"] = bundle[\"metadata\"]\n            record[\"family_names\"] = session.probe_family_names\n            record[\"sgs_bank_fingerprint\"] = session.bank_fingerprint\n            torch.save(record, Path(cli.workdir)/(cli.worker+\".pt\"))\n            print(\"%s: real reward mean %.8g; model reward mean %.8g; dt %.4g; device %s\" %\n                  (cli.worker, float(transition.reward.mean()), float(predicted_reward.mean()),\n                   float(transition.dt.mean()), state.device), flush=True)\n    finally:\n        writer = getattr(session.trainer.agents, \"writer\", None)\n        if writer is not None:\n            writer.close()\n        session.close()\n\n\ndef _run(cli):\n    # Parent never creates a simulator. Independent processes also isolate\n    # PhysX lifetime, CUDA extension global state, loggers and SGS statistics.\n    import torch\n    from utils.world_model.probes import (ActionEffectProbeConfig,\n        configuration_fingerprint, summarize_replayed_branches, write_report)\n\n    bundle = _load_bundle(torch, cli.checkpoint)\n    bundle_hash = _file_sha256(cli.checkpoint)\n    directory = Path(cli.workdir)\n    directory.mkdir(parents=True, exist_ok=True)\n    start = time.time()\n    for worker in (\"plan\", \"base\", \"plus\", \"minus\", \"repeat\"):\n        command = [sys.executable, str(Path(__file__).resolve()), \"--checkpoint\", cli.checkpoint,\n                   \"--output\", cli.output, \"--num_envs\", str(cli.num_envs),\n                   \"--prefix_steps\", str(cli.prefix_steps), \"--seed\", str(cli.seed),\n                   \"--device\", cli.device, \"--workdir\", cli.workdir, \"--worker\", worker,\n                   \"--family_sampling\", cli.family_sampling, \"--bundle_sha256\", bundle_hash]\n        logfile = directory/(worker+\".log\")\n        print(\"Launching isolated Isaac Gym %s worker; log: %s\" % (worker, logfile), flush=True)\n        worker_environment = dict(os.environ)\n        worker_environment[\"PATH\"] = str(Path(sys.prefix)/\"bin\") + os.pathsep + worker_environment.get(\"PATH\", \"\")\n        library_directory = str(Path(sys.prefix)/\"lib\")\n        library_path = worker_environment.get(\"LD_LIBRARY_PATH\", \"\")\n        worker_environment[\"LD_LIBRARY_PATH\"] = library_directory + (os.pathsep+library_path if library_path else \"\")\n        with logfile.open(\"w\", encoding=\"utf-8\") as stream:\n            result = subprocess.run(command, cwd=str(ROOT), stdout=stream, stderr=subprocess.STDOUT,\n                                    timeout=cli.worker_timeout, env=worker_environment)\n        if result.returncode:\n            tail = \"\\n\".join(logfile.read_text(encoding=\"utf-8\", errors=\"replace\").splitlines()[-35:])\n            raise RuntimeError(\"Isaac Gym %s worker exited %d\\n%s\" % (worker, result.returncode, tail))\n    branches = {name: torch.load(directory/(name+\".pt\"), map_location=cli.device, weights_only=False)\n                for name in (\"base\", \"plus\", \"minus\", \"repeat\")}\n    hashes = {value.pop(\"model_sha256\") for value in branches.values()}\n    if len(hashes) != 1:\n        raise ValueError(\"Candidate weights changed across independent probe workers\")\n    expected_contract = configuration_fingerprint(bundle[\"metadata\"])\n    family_names = branches[\"base\"][\"family_names\"]\n    bank_fingerprint = branches[\"base\"][\"sgs_bank_fingerprint\"]\n    for branch in branches.values():\n        if configuration_fingerprint(branch.pop(\"configuration\")) != expected_contract:\n            raise ValueError(\"Probe task configuration changed between workers\")\n        if branch.pop(\"family_names\") != family_names or branch.pop(\"sgs_bank_fingerprint\") != bank_fingerprint:\n            raise ValueError(\"Probe reset families/bank changed between workers\")\n    config = ActionEffectProbeConfig(min_pairs=cli.min_pairs,\n                                    min_informative_pairs=cli.min_informative_pairs)\n    report = summarize_replayed_branches(branches, next(iter(hashes)), bundle[\"metadata\"], config,\n        metadata={\"simulator\": \"IsaacGym\", \"device\": cli.device, \"seed\": cli.seed,\n                  \"prefix_length\": cli.prefix_steps, \"protocol\": \"independent_simulator_prefix_replay\",\n                  \"process_isolation\": True, \"candidate\": cli.checkpoint,\n                  \"candidate_bundle_sha256\": bundle_hash,\n                  \"family_names\": family_names, \"family_sampling\": cli.family_sampling,\n                  \"sgs_bank_fingerprint\": bank_fingerprint,\n                  \"evidence_directory\": cli.workdir, \"elapsed_seconds\": time.time()-start})\n    write_report(cli.output, report)\n    print(json.dumps({\"report\": cli.output, \"passed\": report[\"passed\"],\n                      \"reasons\": report[\"reasons\"], \"metrics\": report[\"metrics\"]}, ensure_ascii=False, indent=2))\n\n\ndef main():\n    cli = parser().parse_args()\n    if cli.num_envs < 1 or cli.prefix_steps < 0 or cli.worker_timeout <= 0:\n        raise ValueError(\"Probe batch size/timeout must be positive and prefix_steps nonnegative\")\n    if cli.min_pairs < 1 or cli.min_informative_pairs < 2:\n        raise ValueError(\"Probe requires min_pairs >= 1 and min_informative_pairs >= 2\")\n    cli.checkpoint = str(Path(cli.checkpoint).expanduser().resolve())\n    cli.output = str(Path(cli.output).expanduser().resolve())\n    cli.workdir = str(Path(cli.workdir or (cli.output+\".artifacts\")).expanduser().resolve())\n    Path(cli.workdir).mkdir(parents=True, exist_ok=True)\n    os.chdir(ROOT)\n    if cli.worker is not None:\n        _worker(cli)\n    else:\n        _run(cli)\n\n\nif __name__ == \"__main__\":\n    main()\n","sha256":"847b6f2278cd346e860bbe10d2a6078c02d685a364f86c1a0a2f211fdbecd449"},"DQ_high-level/utils/gripper_policy.py":{"text":"\"\"\"Gaussian teacher policy with a continuous, sigmoid-bounded gripper opening.\n\n``compute`` returns the nine latent Gaussian means and log standard deviations.\nOnly coordinate 6 is transformed: the action stored by PPO and executed by the\nenvironment is ``opening = sigmoid(latent_gripper)``. Its likelihood includes\nthe inverse transform and Jacobian, including when PPO re-evaluates old actions.\nThe other eight coordinates retain the existing Gaussian action semantics.\n\"\"\"\n\nimport math\n\nimport numpy as np\nimport torch\nfrom torch.nn import functional as F\nfrom torch.distributions import Normal\n\nfrom skrl.models.torch import GaussianMixin\n\n\nclass ContinuousGripperGaussianMixin(GaussianMixin):\n    \"\"\"A local skrl extension; no changes to the vendored Gaussian mixin.\n\n    ``distribution()`` retains skrl's latent Normal distribution for diagnostics.\n    Use ``act`` for executed actions and their transformed likelihoods. Entropy\n    is returned per coordinate; the gripper term uses deterministic 64-point\n    Gauss-Hermite quadrature for E[log(sigmoid'(Z))]. This avoids injecting extra\n    sampling noise and includes the transform when entropy regularization is on.\n\n    At floating-point saturation, openings use the same interior endpoint guard\n    as PyTorch's sigmoid transform. Both rollout and replay log probabilities\n    are evaluated from the stored opening, so an unchanged policy has ratio one\n    even when sigmoid inversion loses precision. Endpoint densities are thus a\n    finite-precision approximation to the continuous logistic-normal density.\n    \"\"\"\n\n    gripper_action_semantics = \"continuous_opening_v1\"\n    gripper_index = 6\n\n    def __init__(self, clip_actions=False, clip_log_std=True, min_log_std=-20,\n                 max_log_std=2, reduction=\"sum\", role=\"\", transform_func=None,\n                 deterministic=False):\n        if transform_func is not None:\n            raise ValueError(\"Continuous gripper policy does not support an additional tanh transform\")\n        if clip_actions:\n            raise ValueError(\"Continuous gripper Gaussian likelihood requires clip_actions=False\")\n        if self.num_actions != 9:\n            raise ValueError(\"Continuous gripper teacher policy requires nine action coordinates\")\n        GaussianMixin.__init__(self, clip_actions=False, clip_log_std=clip_log_std,\n                               min_log_std=min_log_std, max_log_std=max_log_std,\n                               reduction=reduction, role=role, transform_func=None,\n                               deterministic=deterministic)\n        if not hasattr(self, \"_gripper_action_semantics_version\"):\n            self.register_buffer(\"_gripper_action_semantics_version\",\n                                 torch.tensor(1, dtype=torch.int64, device=self.device))\n            nodes, weights = np.polynomial.hermite.hermgauss(64)\n            self.register_buffer(\"_gripper_entropy_nodes\",\n                                 torch.as_tensor(nodes, device=self.device), persistent=False)\n            self.register_buffer(\"_gripper_entropy_weights\",\n                                 torch.as_tensor(weights / math.sqrt(math.pi), device=self.device),\n                                 persistent=False)\n\n    @staticmethod\n    def _interior_opening(opening):\n        # Use dtype-specific limits so log/log1p remain finite on CPU and CUDA.\n        limits = torch.finfo(opening.dtype)\n        return opening.clamp(min=limits.tiny, max=1. - limits.eps)\n\n    def mean_to_action(self, mean):\n        \"\"\"Map latent means to deterministic execution, retaining input gradients.\n\n        This is sigmoid(mu), the logistic-normal median, not E[sigmoid(Z)].\n        BPTT intentionally uses this map and never consults standard deviation.\n        \"\"\"\n        opening = self._interior_opening(torch.sigmoid(mean[..., 6:7]))\n        return torch.cat((mean[..., :6], opening, mean[..., 7:]), dim=-1)\n\n    def _role_value(self, name, role):\n        options = getattr(self, name)\n        return options[role] if role in options else options[\"\"]\n\n    def act(self, inputs, role=\"\"):\n        mean, log_std, outputs = self.compute(inputs, role)\n        if self._role_value(\"_g_clip_log_std\", role):\n            log_std = log_std.clamp(self._role_value(\"_g_log_std_min\", role),\n                                    self._role_value(\"_g_log_std_max\", role))\n        self._g_log_std[role] = log_std\n        self._g_num_samples[role] = mean.shape[0]\n        distribution = Normal(mean, log_std.exp(), validate_args=False)\n        self._g_distribution[role] = distribution\n        latent = mean if self.deterministic else distribution.rsample()\n        actions = self.mean_to_action(latent)\n\n        # Always invert the represented action, including during collection.\n        # Using the original sampled latent only in collection would change its\n        # log density when PPO reconstructs the same float32 action later.\n        evaluated = inputs.get(\"taken_actions\", actions)\n        opening = self._interior_opening(evaluated[..., 6:7])\n        log_open = torch.log(opening)\n        log_closed = torch.log1p(-opening)\n        inverse = torch.cat((evaluated[..., :6], log_open - log_closed,\n                             evaluated[..., 7:]), dim=-1)\n        coordinate_log_prob = distribution.log_prob(inverse)\n        coordinate_log_prob = torch.cat((coordinate_log_prob[..., :6],\n            coordinate_log_prob[..., 6:7] - log_open - log_closed,\n            coordinate_log_prob[..., 7:]), dim=-1)\n        reduction = self._role_value(\"_g_reduction\", role)\n        log_prob = (coordinate_log_prob if reduction is None else\n                    reduction(coordinate_log_prob, dim=-1, keepdim=True))\n        outputs = dict(outputs)\n        outputs[\"mean_actions\"] = self.mean_to_action(mean)\n        outputs[\"latent_mean_actions\"] = mean\n        return actions, log_prob, outputs\n\n    def get_entropy(self, role=\"\"):\n        distribution = self._role_value(\"_g_distribution\", role)\n        if distribution is None:\n            return torch.tensor(0., device=self.device)\n        entropy = distribution.entropy()\n        mean = distribution.loc[..., 6:7]\n        scale = distribution.scale[..., 6:7]\n        nodes = self._gripper_entropy_nodes.to(dtype=mean.dtype)\n        weights = self._gripper_entropy_weights.to(dtype=mean.dtype)\n        samples = mean + math.sqrt(2.) * scale * nodes\n        log_jacobian = -F.softplus(-samples) - F.softplus(samples)\n        gripper_entropy = entropy[..., 6:7] + (log_jacobian * weights).sum(-1, keepdim=True)\n        return torch.cat((entropy[..., :6], gripper_entropy, entropy[..., 7:]), dim=-1)\n\n    def _load_from_state_dict(self, state_dict, prefix, local_metadata, strict,\n                              missing_keys, unexpected_keys, error_msgs):\n        # Shapes are unchanged from the old binary policy, so regular strict\n        # shape checks alone cannot detect incompatible action semantics.\n        marker = state_dict.get(prefix + \"_gripper_action_semantics_version\")\n        if not torch.is_tensor(marker) or marker.shape != torch.Size([]) or int(marker.item()) != 1:\n            raise RuntimeError(\"Continuous gripper action semantics require a version-1 policy \"\n                               \"checkpoint; legacy binary gripper policies cannot be loaded implicitly\")\n        super()._load_from_state_dict(state_dict, prefix, local_metadata, strict,\n                                     missing_keys, unexpected_keys, error_msgs)\n","sha256":"7d765ad80396cec6ebcc4db971c3cbe0ade0d4ea66bfdabafd6f865dfc83e0d3"},"DQ_high-level/utils/gripper_control.py":{"text":"\"\"\"Shared normalized gripper control, independent of Isaac Gym.\"\"\"\n\nGRIPPER_ACTION_MODE = \"continuous_opening_v1\"\nCLOSING_OPENING_THRESHOLD = 0.5\n\n\ndef opening_to_joint(opening, closed, opened):\n    \"\"\"0 is closed and 1 is open; preserve gradients inside the valid range.\"\"\"\n    return closed + opening.clamp(0., 1.) * (opened - closed)\n\n\ndef closing_command(opening):\n    \"\"\"Closing-side intent for task bookkeeping, not a contact-force test.\"\"\"\n    return opening < CLOSING_OPENING_THRESHOLD\n","sha256":"b1a415f0a18de176ca535833c83e31ae1ed526b7751632522efa8d8517308c9c"}},"commit":"34fe8f4 · 工作区快照","date":"2026-11-05","paperPanel":"\n<p class=\"pbody\">本图以当前训练启动脚本及其调用代码为主，论文解释方法来源。不是重新画一份原版 SuperMimic。<\/p>\n<h3>三条优化路径<\/h3>\n<table class=\"audit-table\"><tr><th>阶段<\/th><th>数据／目标<\/th><th>更新<\/th><th>固定<\/th><\/tr>\n<tr><td>真实 PPO<\/td><td>真观测、奖励、GAE<\/td><td>Actor均值θ、标准差φ、Criticψ<\/td><td>低层控制器<\/td><\/tr>\n<tr><td>模型拟合<\/td><td>真实动作序列与真状态<\/td><td>候选模型 ω<\/td><td>Actor、Critic<\/td><\/tr>\n<tr><td>三步 BPTT<\/td><td>预测奖励＋真实 Critic 尾值<\/td><td>Actor均值θ<\/td><td>ω★、ψ、标准差φ、scaler统计<\/td><\/tr><\/table>\n<h3>DQ-Net：继承的教师结构<\/h3>\n<p class=\"pbody\">特权教师、物体几何编码、30候选抓取注意力，以及高层策略与冻结低层控制的分层框架来自 DQ-Net。原文教师带物体速度；当前入口使用 no_velocity_obs 并增加 EKF 0.60/0.90秒未来位姿。对象1024特征在当前代码中从文件查表，并非此入口在线训练 PointNet。<\/p>\n<p class=\"paper-ref\"><a href=\"papers/DQ-NET.pdf#page=4\" target=\"_blank\" rel=\"noopener\">PDF p4–5 · Fig.2 / 教师与分层控制 ↗<\/a><br><a href=\"papers/DQ-NET.pdf#page=11\" target=\"_blank\" rel=\"noopener\">PDF p11 · Grasp Fusion Module 的 query/key/value ↗<\/a><\/p>\n<h3>SuperMimic：借鉴的学习机制<\/h3>\n<p class=\"pbody\">真实仿真采样、多步自回归世界模型、冻结模型参数的短期 BPTT，以及短期回报接 Critic 尾值。神经模型提供输入导数，物理仿真器本身无需可微。原文使用 MuJoCo Warp，这不要求当前 DQ 任务更换 Isaac Gym。<\/p>\n<p class=\"paper-ref\"><a href=\"papers/supermimic.pdf#page=4\" target=\"_blank\" rel=\"noopener\">PDF p4–5 · Fig.2 / 式1–3 ↗<\/a><br><a href=\"papers/supermimic.pdf#page=15\" target=\"_blank\" rel=\"noopener\">PDF p15–16 · 网络表与算法／超参数 ↗<\/a><\/p>\n<h3>融合版本的明确改动<\/h3>\n<table class=\"audit-table\"><tr><th>项目<\/th><th>SuperMimic 原文<\/th><th>当前代码<\/th><\/tr>\n<tr><td>Actor更新<\/td><td>模型 BPTT<\/td><td>真实 PPO＋辅助 BPTT<\/td><\/tr>\n<tr><td>Critic目标<\/td><td>想象轨迹 GAE<\/td><td>真实 PPO 回报<\/td><\/tr>\n<tr><td>对象<\/td><td>机器人动作跟踪<\/td><td>四足机械臂＋动态物体抓取<\/td><\/tr>\n<tr><td>模型／想象窗口<\/td><td>K8 / H32，dt=.02s<\/td><td>K3 / H3，dt=.14/.16s<\/td><\/tr>\n<tr><td>动力学隐层<\/td><td>2048×3<\/td><td>512×3<\/td><\/tr>\n<tr><td>动作<\/td><td>想象确定性、真实执行加噪<\/td><td>真实PPO latent高斯采样→sigmoid开度；BPTT全部9维均值，σ仅PPO更新<\/td><\/tr>\n<tr><td>可信性<\/td><td>原文训练流程<\/td><td>candidate/validated 双模型、真实probe、误差和KL门<\/td><\/tr><\/table>\n<h3>连续夹爪接口与兼容性<\/h3><p class=\"pbody\">当前teacher采用continuous_opening_v1，真实PPO随机latent动作经第6维sigmoid成为开度；BPTT全部9维latent均值可导，标准差仅PPO更新。SGS bank的物理关节状态可复用；旧二值Actor checkpoint、旧世界模型契约和旧8维probe报告不可隐式沿用。<\/p><h3>当前实现的边界<\/h3>\n<p class=\"pbody\">914维完整递归状态包含710维低层历史；末端与关节独立预测，未施加FK一致性。台面也是模型状态。没有学习奖励头、手物接触力头或额外的长期成功概率网络。硬成功判定并非处处可微。一步probe不验证长程成功率或Critic输入梯度。SGS family是初态分类，不是接触状态标签。<\/p>\n<h3>本图证据范围<\/h3>\n<p class=\"pbody\">动作路径同步日期2026-11-05；使用当前工作区代码（包括探针日志隔离修改），不只使用Git提交。点击节点可离线阅读内嵌源码与SHA256。本次同步连续夹爪、9维BPTT和探针的节点与源码；历史GPU记录不作为新接口验证，不据此声称训练性能改善。<\/p>\n<a class=\"source-link\" href=\"SuperMimic_SGS_EKF_implementation.md\">打开实现说明 ↗<\/a>\n<h3>连续夹爪GPU机制诊断<\/h3><p class=\"pbody\">2026-11-05：205项相关机制回归通过，另在真实Isaac Gym cuda:1、12环境诊断，4种开度目标误差为0；72条真实转移短拟合16次后，物理状态对夹爪开度与实际Actor夹爪头均有有限非零梯度，标准差保持不变，KL回滚通过。这只检验链路，不是模型可信性放行或抓取收益证据。<\/p><a class=\"source-link\" href=\"SuperMimic_continuous_gripper_gpu_validation.json\">查看本轮GPU诊断 ↗<\/a>","helpPanel":"\n<p class=\"pbody\">按六个页签阅读：全景 → 真实采样 → Teacher与PPO → 世界模型拟合 → 三步BPTT → 验证与GPU。统一例子是四足机械臂接近、闭爪、抬起并保持糖盒。<\/p>\n<h3>操作<\/h3><p class=\"pbody\">点击节点查看输入、步骤、输出、抓取例子、源码行号和论文页码。可拖动卡片重排，拖动空白平移，滚轮或＋−缩放；“适应屏幕”显示全部。搜索跨页签查找术语和维度，节点上下游按钮可沿连线阅读。<\/p>\n<h3>如何读连线<\/h3><p class=\"pbody\">实线是前向数据依赖；虚线是共享参数、条件放行或下一轮关系；红色点线是参数更新。打开“梯度路径”可额外显示 BPTT 穿过固定模块的输入导数。点击节点只高亮它直接相关的连线；边上文字区分更新参数与传递输入梯度。<\/p>\n<h3>冻结与共享<\/h3><p class=\"pbody\">虚线边框表示当前阶段参数冻结，不代表输入梯度断开。各步Actor共享同一个θ；Actor和Critic却是两个独立网络，各有自己的encoder和attention。candidate与validated也为两个实例。网络在不同页签重复出现是为了说明阶段，不代表多创建一个网络。<\/p>\n<h3>记号<\/h3><p class=\"pbody\">x：世界模型完整914维状态；o：Actor/Critic原有1284维观测；a：高层动作9；ξ：物理条件；Δt：真实控制时间；θ/ψ/ω：Actor均值/Critic/世界模型参数；φ为只由PPO更新的logσ，ω★为固定合格快照。帽子表示预测量。N=4096，拟合批量与想象批量均默认128。<\/p>\n<h3>离线与布局<\/h3><p class=\"pbody\">HTML不依赖CDN，源码与节点说明已内嵌。PDF链接使用相邻papers文件夹；在仓库doc目录打开即可跳到对应页。节点位置自动保存在浏览器本地，可导出／导入JSON。“重置布局”恢复该页默认位置。<\/p>\n<h3>制作依据<\/h3><p class=\"pbody\">视觉、画布路由和交互参考 /home/hehui/SuperMimic-Reproduced/docs/supermimic_training_flow.html；图中内容由当前 DQ 教师代码与两篇论文重新核对生成。<\/p>\n","terms":[["Actor θ","同一个latent高斯教师：真实PPO随机采样，第6维sigmoid为开度；BPTT全部9维均值获梯度，标准差仅PPO学习。"],["Critic ψ","估计未来折扣任务回报。当前仅从真实PPO数据学习；在BPTT中冻结参数并保留输入导数。"],["Candidate / Validated","持续拟合候选ω与通过精确权重验证的固定副本ω★，两者是不同网络实例。"],["x 914 与 o 1284","x包含物理真状态、低层记忆、EKF历史和任务进度；o是既有策略输入。两者用途不同，不是同一向量。"],["SGS family","full_task/pregrasp/near_goal是回合起点类型；不等于当前接触模式或执行阶段。"],["GFM / 注意力","128维物体编码与6维位姿构造Query；30个6维抓取候选构造Key/Value，聚合出6维抓取表示。"],["EKF","利用过去物体位姿推断0.60/0.90秒后的位姿。想象中必须由预测轨迹刷新历史，不能读取真实未来。"],["PPO / GAE","真实交互上的裁剪策略优化与广义优势估计；同时训练策略和回报价值。"],["BPTT","将H步模型计算展开，把均值动作轨迹回报对动作/状态的导数沿时间链传回同一Actor均值网络；不更新标准差。"],["自回归拟合","模型连续接收自己的预测状态，但动作固定为记录的真实动作；真未来只作监督目标。"],["固定参数≠no_grad","固定权重不更新，仍可让输出对输入求导；关闭整个计算图会切断辅助Actor的梯度。"],["Detach","固定数值并切断此前计算图。真实起点、可信权重和动作时长使用此边界；夹爪开度不detach；标准差仅以detach值参与KL。"],["有效物理动作","动作经过真实限幅、工作空间和底盘死区后的模型条件；夹爪维度直接是连续开度。执行动作仍用于动作历史与奖励。"],["Survival / 存活权重","累乘1减自然终止概率，并在硬超时后置零；终止步本身仍计入奖励。"],["尾值 / Bootstrap","用真实Critic估计H步以后未展开的任务回报，反归一化后与真实奖励单位对齐。"],["留出与信任权重","回放按整个episode划分10%验证；可信误差=max(物理误差,相对误差)，起点权重不让Actor反向优化。"],["KL回滚","检查全部9维高斯动作分布偏移；超限则恢复Actor参数与辅助Adam完整状态。"],["GPU / 向量步","一次向量步同时推进N个环境。训练模拟和学习在同一CUDA；独立验证可用另一GPU但同步等待。"],["FK一致性","由关节计算末端姿态的几何约束；当前模型独立预测关节与末端，尚未施加该约束。"],["连续夹爪开度","0闭合、1张开；q=q_closed+opening(q_open−q_closed)。PPO先采样latent Gaussian再sigmoid；BPTT用sigmoid(μ6)，不固定夹爪。"]],"mean_action_revision":"2026-11-05: PPO samples latent Gaussian and transforms gripper to opening; BPTT differentiates all nine mean actions; log_std stays PPO-owned","continuous_gripper_revision":"2026-11-05: continuous_opening_v1; adapter schema3; nine-coordinate probes; old binary checkpoints incompatible"}</script><script>

window.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();if(e.key==='0'&&!e.target.matches('input')&&!$('source-dialog').open){fit();save()}});

let resizeTimer;new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(!drag){measureNodes();drawEdges();fit()}},100)}).observe($('stage'));


function switchView(index){if(index<0||index>=DATA.views.length)return;if(NODES[0]?.el)save();closePanel();current=index;const v=DATA.views[index];NODES=v.nodes;EDGES=v.edges;byId=Object.fromEntries(NODES.map(n=>[n.id,n]));STORE='dq-sgs-ekf-world-model-flow-v1-'+v.id;$('nodes').replaceChildren();$('labels').replaceChildren();$('edge-layer').replaceChildren();buildNodes();drawEdges();let restored=false;try{const d=JSON.parse(localStorage.getItem(STORE)||'null');if(d){restore(d);restored=true}}catch{}if(!restored)fit();$('view-desc').textContent=v.desc;$('formula').innerHTML='<div class="ft">'+esc(v.title)+' · 当前教师默认配置</div><div class="fe">'+esc(v.formula)+'</div><small>点击节点查看输入、处理、输出与源码；论文来源和实现边界见“论文对照”</small>';document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('on',+b.dataset.view===index);b.setAttribute('aria-selected',String(+b.dataset.view===index))});$('search-results').hidden=true;}
DATA.views.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v.title;b.dataset.view=i;b.role='tab';b.onclick=()=>switchView(i);$('tabs').append(b)});
$('btn-glossary').onclick=glossary;
$('btn-gradients').onclick=()=>{showGradients=!showGradients;$('btn-gradients').classList.toggle('on',showGradients);$('btn-gradients').setAttribute('aria-pressed',String(showGradients));$('btn-gradients').textContent='梯度路径：'+(showGradients?'开':'关');if(showGradients&&current!==4)switchView(4);else drawEdges();};
$('node-search').oninput=ev=>{const q=ev.target.value.trim().toLowerCase(),box=$('search-results');box.replaceChildren();box.hidden=!q;if(!q)return;const matches=[];DATA.views.forEach((v,i)=>v.nodes.forEach(n=>{const title=n.title.toLowerCase(),extra=(n.subtitle+n.shapes.join(' ')).toLowerCase(),detail=n.detail.toLowerCase();if(title.includes(q)||extra.includes(q)||detail.includes(q))matches.push({v,i,n,score:title.includes(q)?0:extra.includes(q)?1:2})}));matches.sort((a,b)=>a.score-b.score);matches.slice(0,25).forEach(({v,i,n})=>{const b=document.createElement('button');b.textContent=v.title+' · '+n.title;b.onclick=()=>{switchView(i);select(n.id);box.hidden=true;};box.append(b)});if(!matches.length)box.textContent='没有匹配节点；试试“动作”“冻结”“914”“终止”。'};
switchView(0);
window.DQFusionFlow={get nodes(){return NODES},get edges(){return EDGES},views:DATA.views,switchView,getCurrent:()=>current,getView:()=>({...view}),select,fit,glossary,paperPanel,help,getSelected:()=>selected,sourceCommit:DATA.commit};
</script></body></html>
