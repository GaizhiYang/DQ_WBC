function roundedPath(points){const v=[];for(const p of points){if(v.length&&Math.hypot(p.x-v.at(-1).x,p.y-v.at(-1).y)<.1)continue;if(v.length>1){const a=v.at(-2),b=v.at(-1);if(Math.abs((b.x-a.x)*(p.y-b.y)-(b.y-a.y)*(p.x-b.x))<.01)v.pop()}v.push(p)}if(v.length<2)return '';let d=`M${v[0].x},${v[0].y}`;for(let i=1;i<v.length-1;i++){const a=v[i-1],b=v[i],c=v[i+1],l1=Math.hypot(b.x-a.x,b.y-a.y),l2=Math.hypot(c.x-b.x,c.y-b.y),r=Math.min(10,l1/2,l2/2),u={x:b.x+(a.x-b.x)*r/l1,y:b.y+(a.y-b.y)*r/l1},w={x:b.x+(c.x-b.x)*r/l2,y:b.y+(c.y-b.y)*r/l2};d+=`L${u.x},${u.y}Q${b.x},${b.y} ${w.x},${w.y}`}return d+`L${v.at(-1).x},${v.at(-1).y}`}
function collidesRect(x,y,w,h,pad=2){return NODES.some(n=>x<n.x+n.w+pad&&x+w>n.x-pad&&y<n.y+n.h+pad&&y+h>n.y-pad)}
function drawEdges(){const route=createRouter();$('edge-layer').replaceChildren();$('labels').replaceChildren();edgeObjects=[];for(const e of EDGES){const a=byId[e.from],b=byId[e.to],s=e.sides||autoSides(a,b),p=port(a,s[0]),q=port(b,s[1]),p0=outside(p,s[0]),q0=outside(q,s[1]);let points=[p,p0,...route(p0,q0),q0,q],d=roundedPath(points);
const distance=Math.hypot(p.x-q.x,p.y-q.y),bend=Math.min(140,Math.max(36,distance*.42)),c1=outside(p,s[0],bend),c2=outside(q,s[1],bend),curve=[];
for(let j=0;j<=32;j++){const t=j/32,u=1-t;curve.push({x:u*u*u*p.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*q.x,y:u*u*u*p.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*q.y})}
const clear=distance<950&&curve.slice(1,-1).every(z=>NODES.every(n=>z.x<=n.x+1||z.x>=n.x+n.w-1||z.y<=n.y+1||z.y>=n.y+n.h-1));
if(clear){d=`M${p.x},${p.y}C${c1.x},${c1.y} ${c2.x},${c2.y} ${q.x},${q.y}`;points=curve}
const casing=svg('path',{d,class:'edge-case'}),line=svg('path',{d,class:'edge-line'+(e.kind==='condition'||e.kind==='shared'?' dashed':e.kind==='update'?' gradient':''),'data-from':e.from,'data-to':e.to});$('edge-layer').append(casing,line);let label=null;if(e.label){label=document.createElement('div');label.className='edge-label';label.textContent=e.label;$('labels').append(label);const w=label.offsetWidth,h=label.offsetHeight;let found=null;const candidates=[];for(let j=1;j<points.length;j++){const p=points[j-1],q=points[j];const len=Math.hypot(q.x-p.x,q.y-p.y);candidates.push({x:(p.x+q.x)/2,y:(p.y+q.y)/2,len,horizontal:Math.abs(q.y-p.y)<1})}if(clear)candidates.unshift({x:curve[16].x,y:curve[16].y,len:10000,horizontal:true});candidates.sort((a,b)=>(b.horizontal?b.len:0)-(a.horizontal?a.len:0));for(const c of candidates){for(const dy of[-h/2-5,h/2+5])if(!collidesRect(c.x-w/2,c.y+dy-h/2,w,h)){found={x:c.x,y:c.y+dy};break}if(found)break}if(found){label.style.left=found.x+'px';label.style.top=found.y+'px';label.hidden=!labels}else label.hidden=true}edgeObjects.push({e,line,casing,label})}highlight()}
function highlight(){const id=hover||selected,connected=new Set([id]);if(id)for(const e of EDGES){if(e.from===id)connected.add(e.to);if(e.to===id)connected.add(e.from)}for(const n of NODES){n.el.classList.toggle('dim',!!id&&!connected.has(n.id));n.el.classList.toggle('selected',n.id===selected);n.el.setAttribute('aria-pressed',String(n.id===selected))}for(const o of edgeObjects){const touch=o.e.from===id||o.e.to===id;o.line.classList.toggle('active',!!id&&touch);o.line.classList.toggle('dim',!!id&&!touch);o.casing.classList.toggle('dim',!!id&&!touch);o.label?.classList.toggle('dim',!!id&&!touch)}}
function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;$('zoom').textContent=Math.round(view.k*100)+'%'}
function fit(){const pad=28,b={x:Math.min(...NODES.map(n=>n.x))-pad,y:Math.min(...NODES.map(n=>n.y))-pad},right=Math.max(...NODES.map(n=>n.x+n.w))+pad,bottom=Math.max(...NODES.map(n=>n.y+n.h))+pad;const w=right-b.x,h=bottom-b.y,sw=$('stage').clientWidth,sh=$('stage').clientHeight-75;view.k=Math.min(1,sw/w,sh/h);view.x=(sw-w*view.k)/2-b.x*view.k;view.y=(sh-h*view.k)/2-b.y*view.k;applyView()}
function zoom(f,mx=$('stage').clientWidth/2,my=$('stage').clientHeight/2){const k=Math.max(.18,Math.min(2.4,view.k*f));view.x=mx-(mx-view.x)*k/view.k;view.y=my-(my-view.y)*k/view.k;view.k=k;applyView();save()}
function save(){try{localStorage.setItem(STORE,JSON.stringify({version:1,pos:Object.fromEntries(NODES.map(n=>[n.id,[n.x,n.y]])),view,labels}))}catch{}}
function validLayout(d){if(!d||d.version!==1||!d.pos||typeof d.pos!=='object')throw Error('布局格式不匹配');for(const n of NODES){const p=d.pos[n.id];if(!Array.isArray(p)||p.length!==2||p.some(v=>!Number.isFinite(v)||Math.abs(v)>20000))throw Error('节点坐标无效')}if(d.view&&(!Number.isFinite(d.view.x)||!Number.isFinite(d.view.y)||Math.abs(d.view.x)>50000||Math.abs(d.view.y)>50000||!Number.isFinite(d.view.k)||d.view.k<.1||d.view.k>2.4))throw Error('视野坐标无效');return d}
function restore(d){validLayout(d);for(const n of NODES){[n.x,n.y]=d.pos[n.id];n.el.style.left=n.x+'px';n.el.style.top=n.y+'px'}if(d.view)view={...d.view};if(typeof d.labels==='boolean')labels=d.labels;syncLabelButton();drawEdges();applyView()}
function startNodeDrag(e,n){if(e.button!==0)return;e.stopPropagation();n.el.setPointerCapture(e.pointerId);drag={node:n,sx:e.clientX,sy:e.clientY,x:n.x,y:n.y,moved:false};n.el.classList.add('dragging');const move=ev=>{if(!drag)return;drag.moved ||= Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)>4;n.x=drag.x+(ev.clientX-drag.sx)/view.k;n.y=drag.y+(ev.clientY-drag.sy)/view.k;n.el.style.left=n.x+'px';n.el.style.top=n.y+'px';if(!drag.raf)drag.raf=requestAnimationFrame(()=>{if(drag)drag.raf=null;drawEdges()})};const end=()=>{if(!drag)return;const moved=drag.moved;if(drag.raf)cancelAnimationFrame(drag.raf);drag=null;n.el.classList.remove('dragging');n.el.removeEventListener('pointermove',move);n.el.removeEventListener('pointerup',end);n.el.removeEventListener('pointercancel',cancel);drawEdges();save();if(!moved)select(n.id)};const cancel=()=>{if(drag)drag.moved=true;end()};n.el.addEventListener('pointermove',move);n.el.addEventListener('pointerup',end);n.el.addEventListener('pointercancel',cancel)}
$('stage').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.node'))return;const sx=e.clientX,sy=e.clientY,ox=view.x,oy=view.y;closePanel();$('stage').classList.add('panning');$('stage').setPointerCapture(e.pointerId);const move=ev=>{view.x=ox+ev.clientX-sx;view.y=oy+ev.clientY-sy;applyView()};const end=()=>{$('stage').classList.remove('panning');$('stage').removeEventListener('pointermove',move);$('stage').removeEventListener('pointerup',end);$('stage').removeEventListener('pointercancel',end);save()};$('stage').addEventListener('pointermove',move);$('stage').addEventListener('pointerup',end);$('stage').addEventListener('pointercancel',end)});
$('stage').addEventListener('wheel',e=>{e.preventDefault();const r=$('stage').getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0012),e.clientX-r.left,e.clientY-r.top)},{passive:false});
function openPanel(){ $('panel').inert=false;$('panel').classList.add('open') }
function closePanel(){ $('panel').classList.remove('open');$('panel').inert=true;selected=null;hover=null;highlight() }
function renderDetail(value){return value.split(/\n+/).filter(p=>p.trim()).map(p=>{const m=p.match(/^([^：]{1,12})：(.*)$/);return '<p class="pbody detail-p">'+(m?'<strong class="detail-label">'+esc(m[1])+'</strong>'+esc(m[2]):esc(p))+'</p>'}).join('')}
function select(id){const n=byId[id];if(!n)return;selected=id;hover=null;const c=COLORS[n.branch];$('panel-body').style.setProperty('--color',c[0]);$('panel-body').style.setProperty('--tint',c[1]);let h=`<h2>${esc(n.title)}</h2><div class="subtitle">${esc(n.subtitle)}</div><span class="tag">${c[2]} · ${statusName[n.status]}</span><h3>数据形状 · 数字表的大小</h3><div class="shapes">${n.shapes.map(s=>'<span class="shape">'+esc(s)+'</span>').join('')}</div><h3>这个模块做什么</h3>${renderDetail(n.detail)}${n.formula?'<div class="pformula">'+esc(n.formula)+'</div>':''}${n.caution?'<div class="pnote">'+esc(n.caution)+'</div>':''}`;
for(const [title,incoming]of[['输入来自',true],['输出到',false]]){const es=EDGES.filter(e=>incoming?e.to===id:e.from===id);if(es.length){h+='<h3>'+title+'</h3>';for(const e of es){const other=incoming?e.from:e.to;h+=`<button class="connection" data-jump="${other}">${incoming?'←':'→'} ${esc(byId[other].title)}<span>${esc(e.label||'张量依赖')}${e.kind==='shared'?' · 共享参数引用':e.kind==='condition'?' · 条件':e.kind==='update'?' · 更新训练参数':''}</span></button>`}}}
h+='<h3>论文依据</h3>'+n.paper.map(r=>`<p class="paper-ref"><a href="PatchWAM.pdf#page=${r[1]}" target="_blank" rel="noopener">${esc(r[0])} ↗</a><br>${esc(r[2]||'')}</p>`).join('');h+='<h3>源码依据 · 可离线查看</h3>'+n.refs.map((r,i)=>`<button class="source-btn" data-ref="${i}">${esc(r[0])}:${r[1]}–${r[2]} ↗</button>`).join('');$('panel-body').innerHTML=h;openPanel();$('panel').scrollTop=0;$('panel-body').querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>select(b.dataset.jump));$('panel-body').querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>showSource(n.refs[+b.dataset.ref]));highlight()}
function showSource([path,lo,hi]){const f=DATA.files[path];$('source-title').textContent=path+':'+lo+'–'+hi;$('source-meta').textContent='源码快照 '+DATA.commit+' · SHA256 '+f.sha256;$('source-code').innerHTML=f.text.split('\n').map((line,i)=>`<span class="code-line ${i+1>=lo&&i+1<=hi?'mark':''}"><span class="lineno">${i+1}</span>${esc(line)}</span>`).join('');$('source-dialog').showModal();requestAnimationFrame(()=>$('source-code').scrollTop=Math.max(0,(lo-4)*20.125))}
function paperPanel(){selected=null;highlight();$('panel-body').innerHTML=`<h2>论文与源码对照</h2><div class="subtitle">An Action Is Worth One Patch:<br>Unified World–Action Modeling with PatchWAM</div><h3>本图采用的训练设置</h3><p class="pbody">configs/robotwin.yaml：FLUX.2 Klein base 4B，动作H=16、A=14，288×256三视图拼图，文本长度128，shift=5。B代表每进程microbatch，配置为4。</p><h3>对应论文</h3><p class="paper-ref"><a href="PatchWAM.pdf#page=5" target="_blank" rel="noopener">p5 图2：整体架构 ↗</a><br>p6 式6–9：固定动作编码与解码<br>p7 式10–13：加噪与速度损失<br><a href="PatchWAM.pdf#page=26" target="_blank" rel="noopener">p26 图8：token序列与注意力 ↗</a></p><h3>实现差异与边界</h3><p class="pbody">① 论文描述state插在有效文本之后；当前源码追加在完整padded文本之后。本图按实现绘制。</p><p class="pbody">② action padding会被损失屏蔽；image_is_pad未被当前视觉MSE消费。动作patch末尾2个补零通道仍参与监督。</p><p class="pbody">③ 当前基线使用continuous模式归一化w(σ)；matched与Self-Flow配置使用endpoint_1000。</p><p class="pbody">④ 本图是一次训练前向。常规训练不运行Euler解算、不做AP解码，也不反归一化动作。论文评测10步求解，API默认20步，属于推理路径。</p><h3>其他训练配置</h3><p class="pbody">RoboDojo的VL／LoRA／历史与Self-Flow三种变体有独立配置。本图展示共享单一σ的RoboTwin基础训练，扩展不并入主链。</p><h3>核验范围</h3><p class="pbody">模型、数据与损失均对照本地论文和当前源码；4B层数及宽度对照固定FLUX.2依赖。完整GPU训练与闭环成绩需按仓库验证记录另行检验。</p><p class="paper-ref">代码版本 ${DATA.commit} · 论文28页<br>内嵌源码为本次绘图快照；PDF链接需要本文件与PatchWAM.pdf位于同一目录。</p>`;openPanel();$('panel').scrollTop=0}
function help(){selected=null;highlight();$('panel-body').innerHTML=`<h2>如何阅读这张图</h2><p class="pbody">从左侧轨迹样本出发，沿语言、状态、当前图像、未来图像和动作五条路径，看到同一个Transformer如何联合学习世界与动作。</p><div class="help-row"><b>拖动节点</b>：重排卡片，连线自动调整。<br><b>拖动空白</b>：平移整张画布。<br><b>滚轮 / ＋−</b>：缩放；适应屏幕可查看全图。<br><b>悬停 / 点击</b>：高亮相邻路径；点击后查看详情与源码。<br><b>导出 / 导入</b>：保存和恢复JSON布局；浏览器也会自动记住布局。<br><b>键盘</b>：Tab选择卡片，Enter打开，Esc关闭。</div><h3>图例</h3><p class="pbody">实线是数据依赖。虚线是时间条件、注意力约束或参数共享。红色点线表示参数更新。虚线框表示冻结模型；fixed标签表示运算本身无学习参数。</p><h3>符号</h3><p class="pbody">B=每进程batch；16=动作horizon；14=动作维数；128=latent patch宽度；3072=DiT隐藏宽度。三个视角拼成一张图，RGB的3是颜色通道。</p><h3>交互模板参考</h3><p class="paper-ref"><a href="https://harnessx-intern-task.app.workbuddy.host/arch.html?sharecode=5DIDP3XKKB" target="_blank" rel="noopener">LingBot-VLA 2.0 训练数据流参考图 ↗</a></p><p class="pbody">本页独立实现了参考图的单画布、小卡片、关系高亮与详情抽屉；模型内容按PatchWAM重新组织。</p>`;openPanel();$('panel').scrollTop=0}
function syncLabelButton(){$('btn-labels').classList.toggle('on',labels);$('btn-labels').setAttribute('aria-pressed',String(labels));$('btn-labels').textContent='边标签：'+(labels?'开':'关')}
$('btn-fit').onclick=()=>{closePanel();fit();save()};$('btn-zoom-in').onclick=()=>zoom(1.2);$('btn-zoom-out').onclick=()=>zoom(1/1.2);$('btn-labels').onclick=()=>{labels=!labels;syncLabelButton();drawEdges();save()};$('btn-reset').onclick=()=>{closePanel();for(const n of NODES){n.x=n.px;n.y=n.py;n.el.style.left=n.x+'px';n.el.style.top=n.y+'px'}drawEdges();fit();save();notify('已恢复初始布局')};$('close-panel').onclick=closePanel;$('btn-help').onclick=help;$('btn-paper').onclick=paperPanel;$('close-source').onclick=()=>$('source-dialog').close();
$('btn-export').onclick=()=>{const d={format:'patchwam-training-flow-reference',version:1,commit:DATA.commit,pos:Object.fromEntries(NODES.map(n=>[n.id,[n.x,n.y]])),view,labels};const u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='patchwam-training-flow-layout.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);notify('布局已导出')};$('btn-import').onclick=()=>$('layout-file').click();$('layout-file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>100000)throw Error('布局文件过大');const d=JSON.parse(await f.text());if(d.format!=='patchwam-training-flow-reference')throw Error('不是本图的布局文件');restore(d);save();closePanel();notify('布局已恢复')}catch(err){notify('导入失败：'+err.message)}finally{e.target.value=''}};

buildNodes();drawEdges();let restored=false;try{const d=JSON.parse(localStorage.getItem(STORE)||'null');if(d){restore(d);restored=true}}catch{}if(!restored)fit();

window.PatchWAMFlow={nodes:NODES,edges:EDGES,getView:()=>({...view}),select,fit,getSelected:()=>selected,sourceCommit:DATA.commit};
