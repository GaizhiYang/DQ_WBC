h.Generator().manual_seed(self.seed + self.epoch)\n        return iter(torch.randperm(self.length, generator=generator).tolist())\n\n\ndef seed_worker(_worker_id):\n    seed = torch.initial_seed() % (2**32)\n    np.random.seed(seed)\n    random.seed(seed)\n\n\ndef _write_json(path: Path, payload):\n    temporary = path.with_suffix(path.suffix + \".tmp\")\n    temporary.write_text(json.dumps(payload, indent=2) + \"\\n\")\n    os.replace(temporary, path)\n\n\nclass OptimizationRun:\n    def __init__(self, model, dataset, settings: RunSettings):\n        settings.validate()\n        self.settings = settings\n        torch.use_deterministic_algorithms(settings.deterministic)\n        if settings.deterministic:\n            torch.backends.cudnn.benchmark = False\n            torch.backends.cudnn.deterministic = True\n            torch.backends.cuda.enable_flash_sdp(False)\n            torch.backends.cuda.enable_mem_efficient_sdp(False)\n            torch.backends.cuda.enable_cudnn_sdp(False)\n            torch.backends.cuda.enable_math_sdp(True)\n        random.seed(settings.seed)\n        np.random.seed(settings.seed)\n        torch.manual_seed(settings.seed)\n        self.accelerator = Accelerator(\n            mixed_precision=settings.precision,\n            gradient_accumulation_steps=settings.accumulation,\n            cpu=settings.cpu,\n        )\n        if self.accelerator.distributed_type not in (\n            DistributedType.NO,\n            DistributedType.MULTI_CPU,\n            DistributedType.MULTI_GPU,\n        ):\n            raise ValueError(\"This engine supports single-process execution and CPU/GPU DDP\")\n        effective_batch = (\n            settings.batch_size * settings.accumulation * self.accelerator.num_processes\n        )\n        if settings.global_batch_size is not None and effective_batch != settings.global_batch_size:\n            raise ValueError(\n                f\"Global batch differs from recipe: {effective_batch} vs {settings.global_batch_size}\",\n            )\n        self.directory = Path(settings.output_dir)\n        self._on_main(\n            \"creating the output directory\",\n            lambda: self.directory.mkdir(parents=True, exist_ok=True),\n        )\n        parameters = [parameter for parameter in model.parameters() if parameter.requires_grad]\n        if not parameters:\n            raise ValueError(\"The model has no trainable parameters\")\n        optimizer = torch.optim.AdamW(\n            parameters,\n            lr=settings.learning_rate,\n            weight_decay=settings.weight_decay,\n            betas=tuple(settings.betas),\n        )\n        self.sampler = EpochPermutation(dataset, settings.seed)\n        self.loader_generator = torch.Generator()\n        loader = DataLoader(\n            dataset,\n            batch_size=settings.batch_size,\n            sampler=self.sampler,\n            num_workers=settings.workers,\n            drop_last=settings.drop_last,\n            worker_init_fn=seed_worker,\n            persistent_workers=settings.workers \u003e 0,\n            pin_memory=torch.cuda.is_available(),\n            generator=self.loader_generator,\n        )\n        self.model, self.optimizer, self.loader = self.accelerator.prepare(model, optimizer, loader)\n        from .checkpoints import register_compact_policy_state\n\n        register_compact_policy_state(self.accelerator)\n        if not len(self.loader):\n            raise ValueError(\"The dataset is too small for this batch size and drop_last setting\")\n        epoch_budget = math.ceil(len(self.loader) / settings.accumulation) * settings.epochs\n        self.total_updates = (\n            min(settings.max_updates, epoch_budget) if settings.max_updates else epoch_budget\n        )\n        warmup = settings.warmup_updates\n        if warmup is None:\n            warmup = int(self.total_updates * settings.warmup_fraction)\n        warmup = min(warmup, self.total_updates - 1)\n        fingerprint = getattr(dataset, \"fingerprint\", None)\n        fingerprint = fingerprint() if callable(fingerprint) else fingerprint\n        self.dataset_signature = {\n            \"type\": type(dataset).__module__ + \".\" + type(dataset).__qualname__,\n            \"length\": len(dataset),\n            \"fingerprint\": fingerprint,\n        }\n        continuation = asdict(settings)\n        for key in (\"output_dir\", \"checkpoint_every\", \"log_every\"):\n            continuation.pop(key)\n        self.run_signature = hashlib.sha256(\n            json.dumps(\n                {\n                    \"settings\": continuation,\n                    \"dataset\": self.dataset_signature,\n                    \"model\": self._model_signature(model),\n                },\n                sort_keys=True,\n            ).encode()\n        ).hexdigest()\n\n        def rate(update):\n            if warmup and update \u003c warmup:\n                start = 1 / warmup\n                return start + (1 - start) * update / warmup\n            progress = (update - warmup) / max(\n                1,\n                self.total_updates - warmup,\n            )\n            cosine = 0.5 * (1 + math.cos(math.pi * min(max(progress, 0.0), 1.0)))\n            return settings.minimum_lr_fraction + (1 - settings.minimum_lr_fraction) * cosine\n\n        self.scheduler = torch.optim.lr_scheduler.LambdaLR(self.optimizer, rate)\n        self.accelerator.register_for_checkpointing(self.scheduler)\n        self.ema = None\n        unwrapped = self.accelerator.unwrap_model(self.model)\n        if settings.ema_decay is not None:\n            from .averaging import PolicyWeightAverage\n\n            self.ema = PolicyWeightAverage(\n                unwrapped,\n                decay=settings.ema_decay,\n                warmup_updates=settings.ema_warmup_updates,\n            )\n            self.accelerator.register_for_checkpointing(self.ema)\n        policy = getattr(unwrapped, \"policy\", unwrapped)\n        if hasattr(policy, \"set_optimizer_updates\"):\n            policy.set_optimizer_updates(0)\n        if getattr(policy, \"self_flow_variant\", 0):\n            if self.ema is None:\n                raise ValueError(\"Self-Flow training requires EMA\")\n            prefix = \"policy.denoiser.\" if policy is not unwrapped else \"denoiser.\"\n            policy.attach_self_flow_teacher(\n                lambda batch, **kwargs: self.ema.call(\n                    unwrapped,\n                    batch,\n                    parameter_prefixes=(prefix,),\n                    submodule=\"policy\" if policy is not unwrapped else None,\n                    **kwargs,\n                )\n            )\n        self.updates = self.start_epoch = self.start_batch = 0\n        self.last_checkpoint = None\n\n        def write_settings():\n            path = self.directory / \"settings.json\"\n            if not path.exists():\n                _write_json(path, asdict(settings))\n\n        self._on_main(\"writing run settings\", write_settings)\n\n    def _propagate_failure(self, error, operation):\n        failed = torch.tensor(int(error is not None), device=self.accelerator.device)\n        if self.accelerator.reduce(failed, reduction=\"sum\").item():\n            if error is not None:\n                raise error\n            raise RuntimeError(f\"Another process failed while {operation}\")\n\n    def _on_main(self, operation, action):\n        error = None\n        if self.accelerator.is_main_process:\n            try:\n                action()\n            except Exception as caught:  # noqa: BLE001 - propagate failures before another rank waits\n                error = caught\n        self._propagate_failure(error, operation)\n\n    def restore(self, directory: str | Path):\n        directory = Path(directory)\n        metadata = json.loads((directory / \"cursor.json\").read_text())\n        if metadata[\"world_size\"] != self.accelerator.num_processes:\n            raise ValueError(\"Exact continuation requires the same world size\")\n        if metadata[\"accumulation\"] != self.settings.accumulation:\n            raise ValueError(\"Exact continuation requires the same gradient accumulation\")\n        if metadata[\"total_updates\"] != self.total_updates:\n            raise ValueError(\"Exact continuation requires the same scheduler duration\")\n        if metadata.get(\"run_signature\") != self.run_signature:\n            raise ValueError(\n                \"Continuation requires unchanged batch, optimizer, seed, dataset, model, and assets\"\n            )\n        cursor = [metadata[\"updates\"], metadata[\"epoch\"], metadata[\"next_batch\"]]\n        if any(type(value) is not int or value \u003c 0 for value in cursor):\n            raise ValueError(\"Invalid continuation cursor\")\n        if cursor[0] \u003e self.total_updates or cursor[1] \u003e self.settings.epochs:\n            raise ValueError(\"Continuation cursor exceeds the training budget\")\n        if cursor[2] \u003e= len(self.loader) or (cursor[1] == self.settings.epochs and cursor[2]):\n            raise ValueError(\"Continuation cursor exceeds the epoch\")\n        if cursor[2] % self.settings.accumulation:\n            raise ValueError(\"Continuation must start at an accumulation boundary\")\n        self.accelerator.load_state(str(directory))\n        if self.ema is not None and self.ema.updates != metadata[\"updates\"]:\n            raise ValueError(\"EMA update count differs from the training continuation cursor\")\n        self.updates = metadata[\"updates\"]\n        unwrapped = self.accelerator.unwrap_model(self.model)\n        policy = getattr(unwrapped, \"policy\", unwrapped)\n        if hasattr(policy, \"set_optimizer_updates\"):\n            policy.set_optimizer_updates(self.updates)\n        self.start_epoch, self.start_batch = metadata[\"epoch\"], metadata[\"next_batch\"]\n        self.last_checkpoint = str(directory)\n\n    @staticmethod\n    def _model_signature(model):\n        policy = getattr(model, \"policy\", model)\n        contract = {\n            \"type\": type(model).__module__ + \".\" + type(model).__qualname__,\n            \"parameters\": [\n                (name, list(value.shape), str(value.dtype), value.requires_grad)\n                for name, value in model.named_parameters()\n            ],\n            \"assets\": getattr(model, \"asset_signature\", None),\n        }\n        if hasattr(policy, \"codec\"):\n            contract[\"codec\"] = asdict(policy.codec)\n            contract[\"flow\"] = {\n                \"shift\": policy.flow.shift,\n                \"weight_normalizer\": policy.flow.weight_normalizer,\n            }\n            contract[\"objective\"] = [\n                policy.video_weight,\n                policy.action_weight,\n                policy.isolate_actions,\n            ]\n            contract[\"policy_features\"] = {\n                name: value\n                for name, value in vars(policy).items()\n                if name == \"condition_dropout\" or name.startswith(\"self_flow_\")\n            }\n        feature_contract = getattr(model, \"checkpoint_contract\", None)\n        if callable(feature_contract):\n            contract[\"conditioning\"] = feature_contract()\n        return contract\n\n    def checkpoint(self, epoch: int, next_batch: int, *, exhausted=False):\n        name = f\"step_{self.updates:07d}\" + (\"_exhausted\" if exhausted else \"\")\n        final = self.directory / name\n        pending = self.directory / f\".{name}.pending\"\n        conflict = torch.tensor(\n            int(self.accelerator.is_main_process and (final.exists() or pending.exists())),\n            device=self.accelerator.device,\n        )\n        if self.accelerator.reduce(conflict, reduction=\"sum\").item():\n            raise FileExistsError(f\"Checkpoint destination already exists: {final}\")\n        self._on_main(\"creating the checkpoint directory\", pending.mkdir)\n        error = None\n        try:\n            self.accelerator.save_state(str(pending), safe_serialization=True)\n        except Exception as caught:  # noqa: BLE001 - every rank must observe a failed state save\n            error = caught\n        self._propagate_failure(error, \"saving checkpoint state\")\n\n        def publish():\n            if self.ema is not None:\n                from .checkpoints import save_policy_average\n\n                save_policy_average(\n                    self.ema,\n                    self.accelerator.unwrap_model(self.model),\n                    pending / \"ema_policy.safetensors\",\n                )\n            _write_json(\n                pending / \"cursor.json\",\n                {\n                    \"updates\": self.updates,\n                    \"epoch\": epoch,\n                    \"next_batch\": next_batch,\n                    \"world_size\": self.accelerator.num_processes,\n                    \"accumulation\": self.settings.accumulation,\n                    \"total_updates\": self.total_updates,\n                    \"run_signature\": self.run_signature,\n                    \"dataset_signature\": self.dataset_signature,\n                    \"exhausted\": exhausted,\n                },\n            )\n            os.replace(pending, final)\n\n        self._on_main(\"publishing the checkpoint\", publish)\n        self.last_checkpoint = str(final)\n        return final\n\n    def _log(self, values):\n        def write():\n            record = {\"update\": self.updates, **values}\n            with (self.directory / \"metrics.jsonl\").open(\"a\") as output:\n                output.write(json.dumps(record) + \"\\n\")\n            print(json.dumps(record), flush=True)\n\n        self._on_main(\"writing training metrics\", write)\n\n    def train(self):\n        self.model.train()\n        # Frozen assets stay in eval mode.\n        unwrapped = self.accelerator.unwrap_model(self.model)\n        policy = getattr(unwrap                            group_metrics[name] = group_metrics.get(name, 0) + detached\n                    group_count += 1\n                    if self.accelerator.sync_gradients:\n                        norm = self.accelerator.clip_grad_norm_(\n                            self.model.parameters(),\n                            self.settings.gradient_clip or float(\"inf\"),\n                        )\n                        if self.accelerator.scaler is None:\n                            invalid_gradient = (~torch.isfinite(norm)).to(torch.int32)\n                            if self.accelerator.reduce(invalid_gradient, reduction=\"sum\").item():\n                                self.optimizer.zero_grad(set_to_none=True)\n                                raise FloatingPointError(\"Non-finite gradient on at least one rank\")\n                    self.optimizer.step()\n                    self.optimizer.zero_grad(set_to_none=True)\n                    if not self.accelerator.sync_gradients:\n                        continue\n                    values = {name: value / group_count for name, value in group_metrics.items()}\n                    group_metrics, group_count = {}, 0\n                    if self.accelerator.optimizer_step_was_skipped:\n                        continue\n                    self.scheduler.step()\n                    self.updates += 1\n                    if self.ema is not None:\n                        # Gradients were checked before the optimizer step.\n                        self.ema.update(\n                            self.accelerator.unwrap_model(self.model), check_finite=False\n                        )\n                    if hasattr(policy, \"set_optimizer_updates\"):\n                        policy.set_optimizer_updates(self.updates)\n                    if self.updates == 1 or self.updates % self.settings.log_every == 0:\n                        values = {\n                            name: self.accelerator.reduce(value, reduction=\"mean\").item()\n                            for name, value in values.items()\n                        }\n                        values[\"learning_rate\"] = self.scheduler.get_last_lr()[0]\n                        self._log(values)\n                    next_epoch, next_batch = epoch, batch_number + 1\n                    if next_batch == len(self.loader):\n                        next_epoch, next_batch = epoch + 1, 0\n                    finished = self.updates \u003e= self.total_updates\n                    if finished or self.updates % self.settings.checkpoint_every == 0:\n                        self.checkpoint(next_epoch, next_batch)\n                    if finished:\n                        return self.last_checkpoint\n        # Skipped fp16 steps can exhaust the epoch budget.\n        self.checkpoint(self.settings.epochs, 0, exhausted=True)\n        return self.last_checkpoint\n","sha256":"3182d169071ece1b7db02ea775a55e566fbe2872d1688eb6aa052506e0bf6d7f"},"external/flux2/model.py":{"text":"import math\nfrom dataclasses import dataclass, field\n\nimport torch\nfrom einops import rearrange\nfrom torch import Tensor, nn\nfrom torch.nn import functional as F\n\n\n@dataclass\nclass Flux2Params:\n    in_channels: int = 128\n    context_in_dim: int = 15360\n    hidden_size: int = 6144\n    num_heads: int = 48\n    depth: int = 8\n    depth_single_blocks: int = 48\n    axes_dim: list[int] = field(default_factory=lambda: [32, 32, 32, 32])\n    theta: int = 2000\n    mlp_ratio: float = 3.0\n    use_guidance_embed: bool = True\n\n\n@dataclass\nclass Klein9BParams:\n    in_channels: int = 128\n    context_in_dim: int = 12288\n    hidden_size: int = 4096\n    num_heads: int = 32\n    depth: int = 8\n    depth_single_blocks: int = 24\n    axes_dim: list[int] = field(default_factory=lambda: [32, 32, 32, 32])\n    theta: int = 2000\n    mlp_ratio: float = 3.0\n    use_guidance_embed: bool = False\n\n\n@dataclass\nclass Klein4BParams:\n    in_channels: int = 128\n    context_in_dim: int = 7680\n    hidden_size: int = 3072\n    num_heads: int = 24\n    depth: int = 5\n    depth_single_blocks: int = 20\n    axes_dim: list[int] = field(default_factory=lambda: [32, 32, 32, 32])\n    theta: int = 2000\n    mlp_ratio: float = 3.0\n    use_guidance_embed: bool = False\n\n\nclass Flux2(nn.Module):\n    def __init__(self, params: Flux2Params):\n        super().__init__()\n\n        self.in_channels = params.in_channels\n        self.out_channels = params.in_channels\n        if params.hidden_size % params.num_heads != 0:\n            raise ValueError(\n                f\"Hidden size {params.hidden_size} must be divisible by num_heads {params.num_heads}\"\n            )\n        pe_dim = params.hidden_size // params.num_heads\n        if sum(params.axes_dim) != pe_dim:\n            raise ValueError(f\"Got {params.axes_dim} but expected positional dim {pe_dim}\")\n        self.hidden_size = params.hidden_size\n        self.num_heads = params.num_heads\n        self.pe_embedder = EmbedND(dim=pe_dim, theta=params.theta, axes_dim=params.axes_dim)\n        self.img_in = nn.Linear(self.in_channels, self.hidden_size, bias=False)\n        self.time_in = MLPEmbedder(in_dim=256, hidden_dim=self.hidden_size, disable_bias=True)\n        self.txt_in = nn.Linear(params.context_in_dim, self.hidden_size, bias=False)\n\n        self.use_guidance_embed = params.use_guidance_embed\n        if self.use_guidance_embed:\n            self.guidance_in = MLPEmbedder(in_dim=256, hidden_dim=self.hidden_size, disable_bias=True)\n\n        self.double_blocks = nn.ModuleList(\n            [\n                DoubleStreamBlock(\n                    self.hidden_size,\n                    self.num_heads,\n                    mlp_ratio=params.mlp_ratio,\n                )\n                for _ in range(params.depth)\n            ]\n        )\n\n        self.single_blocks = nn.ModuleList(\n            [\n                SingleStreamBlock(\n                    self.hidden_size,\n                    self.num_heads,\n                    mlp_ratio=params.mlp_ratio,\n                )\n                for _ in range(params.depth_single_blocks)\n            ]\n        )\n\n        self.double_stream_modulation_img = Modulation(\n            self.hidden_size,\n            double=True,\n            disable_bias=True,\n        )\n        self.double_stream_modulation_txt = Modulation(\n            self.hidden_size,\n            double=True,\n            disable_bias=True,\n        )\n        self.single_stream_modulation = Modulation(self.hidden_size, double=False, disable_bias=True)\n\n        self.final_layer = LastLayer(\n            self.hidden_size,\n            self.out_channels,\n        )\n\n    def forward(\n        self,\n        x: Tensor,\n        x_ids: Tensor,\n        timesteps: Tensor,\n        ctx: Tensor,\n        ctx_ids: Tensor,\n        guidance: Tensor | None,\n    ):\n        num_txt_tokens = ctx.shape[1]\n\n        timestep_emb = timestep_embedding(timesteps, 256)\n        vec = self.time_in(timestep_emb)\n        if self.use_guidance_embed:\n            guidance_emb = timestep_embedding(guidance, 256)\n            vec = vec + self.guidance_in(guidance_emb)\n\n        double_block_mod_img = self.double_stream_modulation_img(vec)\n        double_block_mod_txt = self.double_stream_modulation_txt(vec)\n        single_block_mod, _ = self.single_stream_modulation(vec)\n\n        img = self.img_in(x)\n        txt = self.txt_in(ctx)\n\n        pe_x = self.pe_embedder(x_ids)\n        pe_ctx = self.pe_embedder(ctx_ids)\n\n        for block in self.double_blocks:\n            img, txt, _ = block.forward_kv_extract(\n                img,\n                txt,\n                pe_x,\n                pe_ctx,\n                double_block_mod_img,\n                double_block_mod_txt,\n                num_ref_tokens=0,\n            )\n\n        img = torch.cat((txt, img), dim=1)\n        pe = torch.cat((pe_ctx, pe_x), dim=2)\n\n        for block in self.single_blocks:\n            img, _ = block.forward_kv_extract(\n                img,\n                pe,\n                single_block_mod,\n                num_txt_tokens,\n                num_ref_tokens=0,\n            )\n\n        img = img[:, num_txt_tokens:, ...]\n\n        img = self.final_layer(img, vec)\n        return img\n\n    def forward_kv_extract(\n        self,\n        x: Tensor,\n        x_ids: Tensor,\n        timesteps: Tensor,\n        ctx: Tensor,\n        ctx_ids: Tensor,\n        guidance: Tensor | None,\n        x_seq_concat: Tensor,\n        x_seq_concat_ids: Tensor,\n        ref_fixed_timestep: float = 0.0,\n    ) -\u003e tuple[Tensor, dict]:\n        \"\"\"\n        First denoising step with reference tokens. Runs full forward pass and\n        extracts KV cache for reference tokens to reuse on subsequent steps.\n\n        Input x layout becomes [ref, img] after concatenation.\n        Returns (prediction, kv_cache).\n        \"\"\"\n        num_txt_tokens = ctx.shape[1]\n        num_ref_tokens = x_seq_concat.shape[1]\n\n        x = torch.cat([x_seq_concat, x], dim=1)\n        x_ids = torch.cat([x_seq_concat_ids, x_ids], dim=1)\n\n        # Timestep embeddings\n        timestep_emb = timestep_embedding(timesteps, 256)\n        vec = self.time_in(timestep_emb)\n        ref_vec = self.time_in(timestep_embedding(torch.full_like(timesteps, ref_fixed_timestep), 256))\n\n        if self.use_guidance_embed:\n            guidance_emb = timestep_embedding(guidance, 256)\n            vec = vec + self.guidance_in(guidance_emb)\n            ref_vec = ref_vec + self.guidance_in(guidance_emb)\n\n        # Modulations\n        double_block_mod_img = self.double_stream_modulation_img(vec)\n        double_block_mod_txt = self.double_stream_modulation_txt(vec)\n        single_block_mod, _ = self.single_stream_modulation(vec)\n\n        ref_double_mod = self.double_stream_modulation_img(ref_vec)\n        ref_single_mod, _ = self.single_stream_modulation(ref_vec)\n\n        img = self.img_in(x)\n        txt = self.txt_in(ctx)\n\n        pe_x = self.pe_embedder(x_ids)\n        pe_ctx = self.pe_embedder(ctx_ids)\n\n        # Blend double block modulations: [ref_mod, img_mod]\n        L_img = img.shape[1]\n        double_block_mod_img = _blend_double_mods(double_block_mod_img, ref_double_mod, num_ref_tokens, L_img)\n\n        double_block_cache = []\n        for block in self.double_blocks:\n            img, txt, cache = block.forward_kv_extract(\n                img,\n                txt,\n                pe_x,\n                pe_ctx,\n                double_block_mod_img,\n                double_block_mod_txt,\n                num_ref_tokens,\n            )\n            double_block_cache.append(cache)\n\n        img = torch.cat((txt, img), dim=1)\n        pe = torch.cat((pe_ctx, pe_x), dim=2)\n\n        # Blend single block modulations: [txt_mod, ref_mod, img_mod]\n        L = img.shape[1]\n        single_block_mod = _blend_single_mods(\n            single_block_mod, ref_single_mod, num_txt_tokens, num_ref_tokens, L\n        )\n\n        single_block_cache = []\n        for block in self.single_blocks:\n            img, cache = block.forward_kv_extract(\n                img,\n                pe,\n                single_block_mod,\n                num_txt_tokens,\n                num_ref_tokens,\n            )\n            single_block_cache.append(cache)\n\n        # Strip txt + ref tokens\n        img = img[:, num_txt_tokens + num_ref_tokens :, ...]\n        img = self.final_layer(img, vec)\n\n        kv_cache = {\n            \"double_blocks\": double_block_cache,\n            \"single_blocks\": single_block_cache,\n            \"num_ref_tokens\": num_ref_tokens,\n        }\n        return img, kv_cache\n\n    def forward_kv_cached(\n        self,\n        x: Tensor,\n        x_ids: Tensor,\n        timesteps: Tensor,\n        ctx: Tensor,\n        ctx_ids: Tensor,\n        guidance: Tensor | None,\n        kv_cache: dict,\n    ) -\u003e Tensor:\n        \"\"\"\n        Subsequent denoising steps using cached KV for reference tokens.\n        Input x has layout [img] only (no ref tokens).\n        \"\"\"\n        num_txt_tokens = ctx.shape[1]\n\n        timestep_emb = timestep_embedding(timesteps, 256)\n        vec = self.time_in(timestep_emb)\n\n        if self.use_guidance_embed:\n            guidance_emb = timestep_embedding(guidance, 256)\n            vec = vec + self.guidance_in(guidance_emb)\n\n        double_block_mod_img = self.double_stream_modulation_img(vec)\n        double_block_mod_txt = self.double_stream_modulation_txt(vec)\n        single_block_mod, _ = self.single_stream_modulation(vec)\n\n        img = self.img_in(x)\n        txt = self.txt_in(ctx)\n\n        pe_x = self.pe_embedder(x_ids)\n        pe_ctx = self.pe_embedder(ctx_ids)\n\n        for i, block in enumerate(self.double_blocks):\n            img, txt = block.forward_kv_cached(\n                img,\n                txt,\n                pe_x,\n                pe_ctx,\n                double_block_mod_img,\n                double_block_mod_txt,\n                kv_cache[\"double_blocks\"][i],\n            )\n\n        img = torch.cat((txt, img), dim=1)\n        pe = torch.cat((pe_ctx, pe_x), dim=2)\n\n        for i, block in enumerate(self.single_blocks):\n            img = block.forward_kv_cached(\n                img,\n                pe,\n                single_block_mod,\n                num_txt_tokens,\n                kv_cache[\"single_blocks\"][i],\n            )\n\n        # Strip txt tokens only (no ref tokens in sequence)\n        img = img[:, num_txt_tokens:, ...]\n        img = self.final_layer(img, vec)\n        return img\n\n\ndef _blend_mod_triple(img_m: tuple, ref_m: tuple, num_ref: int, seq_len: int) -\u003e tuple:\n    \"\"\"Blend a (shift, scale, gate) triple: first num_ref positions get ref_m, rest get img_m.\"\"\"\n    blended = []\n    for im, rm in zip(img_m, ref_m):\n        if im.ndim == 2:\n            im = im[:, None, :]\n            rm = rm[:, None, :]\n        B = im.shape[0]\n        blended.append(\n            torch.cat(\n                [rm.expand(B, num_ref, -1), im.expand(B, seq_len, -1)[:, num_ref:, :]],\n                dim=1,\n            )\n        )\n    return tuple(blended)\n\n\ndef _blend_double_mods(img_mod, ref_mod, num_ref: int, seq_len: int):\n    \"\"\"Blend double block modulations (mod1, mod2) for [ref, img] layout.\"\"\"\n    img_mod1, img_mod2 = img_mod\n    ref_mod1, ref_mod2 = ref_mod\n    return (\n        _blend_mod_triple(img_mod1, ref_mod1, num_ref, seq_len),\n        _blend_mod_triple(img_mod2, ref_mod2, num_ref, seq_len),\n    )\n\n\ndef _blend_single_mods(single_mod, ref_mod, num_txt: int, num_ref: int, seq_len: int):\n    \"\"\"Blend single block modulations for [txt, ref, img] layout.\"\"\"\n    blended = []\n    for im, rm in zip(single_mod, ref_mod):\n        if im.ndim == 2:\n            im = im[:, None, :]\n            rm = rm[:, None, :]\n        B = im.shape[0]\n        im_expanded = im.expand(B, seq_len, -1)\n        rm_expanded = rm.expand(B, num_ref, -1)\n        blended.append(\n            torch.cat(\n                [im_expanded[:, :num_txt, :], rm_expanded, im_expanded[:, num_txt + num_ref :, :]],\n                dim=1,\n            )\n        )\n    return tuple(blended)\n\n\nclass SelfAttention(nn.Module):\n    def __init__(\n        self,\n        dim: int,\n        num_heads: int = 8,\n    ):\n        super().__init__()\n        self.num_heads = num_heads\n        head_dim = dim // num_heads\n        self.qkv = nn.Linear(dim, dim * 3, bias=False)\n\n        self.norm = QKNorm(head_dim)\n        self.proj = nn.Linear(dim, dim, bias=False)\n\n\nclass SiLUActivation(nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.gate_fn = nn.SiLU()\n\n    def forward(self, x: Tensor) -\u003e Tensor:\n        x1, x2 = x.chunk(2, dim=-1)\n        return self.gate_fn(x1) * x2\n\n\nclass Modulation(nn.Module):\n    def __init__(self, dim: int, double: bool, disable_bias: bool = False):\n        super().__init__()\n        self.is_double = double\n        self.multiplier = 6 if double else 3\n        self.lin = nn.Linear(dim, self.multiplier * dim, bias=not disable_bias)\n\n    def forward(self, vec: torch.Tensor):\n        out = self.lin(nn.functional.silu(vec))\n        if out.ndim == 2:\n            out = out[:, None, :]\n        out = out.chunk(self.multiplier, dim=-1)\n        return out[:3], out[3:] if self.is_double else None\n\n\nclass LastLayer(nn.Module):\n    def __init__(\n        self,\n        hidden_size: int,\n        out_channels: int,\n    ):\n        super().__init__()\n        self.norm_final = nn.LayerNorm(hidden_size, elementwise_affine=False, eps=1e-6)\n        self.linear = nn.Linear(hidden_size, out_channels, bias=False)\n        self.adaLN_modulation = nn.Sequential(nn.SiLU(), nn.Linear(hidden_size, 2 * hidden_size, bias=False))\n\n    def forward(self, x: torch.Tensor, vec: torch.Tensor) -\u003e torch.Tensor:\n        mod = self.adaLN_modulation(vec)\n        shift, scale = mod.chunk(2, dim=-1)\n        if shift.ndim == 2:\n            shift = shift[:, None, :]\n            scale = scale[:, None, :]\n        x = (1 + scale) * self.norm_final(x) + shift\n        x = self.linear(x)\n        return x\n\n\nclass SingleStreamBlock(nn.Module):\n    def __init__(\n        self,\n        hidden_size: int,\n        num_heads: int,\n        mlp_ratio: float = 4.0,\n    ):\n        super().__init__()\n\n        self.hidden_dim = hidden_size\n        self.num_heads = num_heads\n        head_dim = hidden_size // num_heads\n        self.scale = head_dim**-0.5\n        self.mlp_hidden_dim = int(hidden_size * mlp_ratio)\n        self.mlp_mult_factor = 2\n\n        self.linear1 = nn.Linear(\n            hidden_size,\n            hidden_size * 3 + self.mlp_hidden_dim * self.mlp_mult_factor,\n            bias=False,\n        )\n\n        self.linear2 = nn.Linear(hidden_size + self.mlp_hidden_dim, hidden_size, bias=False)\n\n        self.norm = QKNorm(head_dim)\n\n        self.hidden_size = hidden_size\n        self.pre_norm = nn.LayerNorm(hidden_size, elementwise_affine=False, eps=1e-6)\n\n        self.mlp_act = SiLUActivation()\n\n    def _qkv(self, x: Tensor, mod: tuple[Tensor, Tensor, Tensor]):\n        mod_shift, mod_scale, mod_gate = mod\n        x_mod = (1 + mod_scale) * self.pre_norm(x) + mod_shift\n\n        qkv, mlp = torch.split(\n            self.linear1(x_mod),\n            [3 * self.hidden_size, self.mlp_hidden_dim * self.mlp_mult_factor],\n            dim=-1,\n        )\n\n        q, k, v = rearrange(qkv, \"B L (K H D) -\u003e K B H L D\", K=3, H=self.num_heads)\n        q, k = self.norm(q, k, v)\n        return q, k, v, mlp, mod_gate\n\n    def _out(self, x: Tensor, attn: Tensor, mlp: Tensor, mod_gate: Tensor) -\u003e Tensor:\n        output = self.linear2(torch.cat((attn, self.mlp_act(mlp)), 2))\n        return x + mod_gate * output\n\n    def forward_kv_extract(\n        self,\n        x: Tensor,\n        pe: Tensor,\n        mod: tuple[Tensor, Tensor, Tensor],\n        num_txt_tokens: int,\n        num_ref_tokens: int,\n    ) -\u003e tuple[Tensor, dict]:\n        \"\"\"Forward with causal attention. Extracts and returns ref KV cache.\"\"\"\n        q, k, v, mlp, mod_gate = self._qkv(x, mod)\n        q, k = apply_rope(q, k, pe)\n\n        ref_start = num_txt_tokens\n        ref_end = num_txt_tokens + num_ref_tokens\n        cache = {\n            \"k_ref\": k[:, :, ref_start:ref_end, :].clone(),\n            \"v_ref\": v[:, :, ref_start:ref_end, :].clone(),\n        }\n\n        attn = causal_attn_fn(q, k, v, num_txt_tokens, num_ref_tokens)\n        return self._out(x, attn, mlp, mod_gate), cache\n\n    def forward_kv_cached(\n        self,\n        x: Tensor,\n        pe: Tensor,\n        mod: tuple[Tensor, Tensor, Tensor],\n        num_txt_tokens: int,\n        kv_cache: dict,\n    ) -\u003e Tensor:\n        \"\"\"Forward using cached ref KV. Input x has layout [txt, img] (no ref).\"\"\"\n        q, k, v, mlp, mod_gate = self._qkv(x, mod)\n        q, k = apply_rope(q, k, pe)\n        num_ref_tokens = kv_cache[\"k_ref\"].shape[2]\n        attn = causal_attn_fn(q, k, v, num_txt_tokens, num_ref_tokens, kv_cache)\n        return self._out(x, attn, mlp, mod_gate)\n\n\nclass DoubleStreamBlock(nn.Module):\n    def __init__(\n        self,\n        hidden_size: int,\n        num_heads: int,\n        mlp_ratio: float,\n    ):\n        super().__init__()\n        mlp_hidden_dim = int(hidden_size * mlp_ratio)\n        self.num_heads = num_heads\n        assert hidden_size % num_heads == 0, f\"{hidden_size=} must be divisible by {num_heads=}\"\n\n        self.hidden_size = hidden_size\n        self.img_norm1 = nn.LayerNorm(hidden_size, elementwise_affine=False, eps=1e-6)\n        self.mlp_mult_factor = 2\n\n        self.img_attn = SelfAttention(\n            dim=hidden_size,\n            num_heads=num_heads,\n        )\n\n        self.img_norm2 = nn.LayerNorm(hidden_size, elementwise_affine=False, eps=1e-6)\n        self.img_mlp = nn.Sequential(\n            nn.Linear(hidden_size, mlp_hidden_dim * self.mlp_mult_factor, bias=False),\n            SiLUActivation(),\n            nn.Linear(mlp_hidden_dim, hidden_size, bias=False),\n        )\n\n        self.txt_norm1 = nn.LayerNorm(hidden_size, elementwise_affine=False, eps=1e-6)\n        self.txt_attn = SelfAttention(\n            dim=hidden_size,\n            num_heads=num_heads,\n        )\n\n        self.txt_norm2 = nn.LayerNorm(hidden_size, elementwise_affine=False, eps=1e-6)\n        self.txt_mlp = nn.Sequential(\n            nn.Linear(\n                hidden_size,\n                mlp_hidden_dim * self.mlp_mult_factor,\n                bias=False,\n            ),\n            SiLUActivation(),\n            nn.Linear(mlp_hidden_dim, hidden_size, bias=False),\n        )\n\n    def _prepare_qkv(self, img, txt, pe, pe_ctx, mod_img, mod_txt):\n        img_mod1, img_mod2 = mod_img\n        txt_mod1, txt_mod2 = mod_txt\n\n        img_mod1_shift, img_mod1_scale, img_mod1_gate = img_mod1\n        img_mod2_shift, img_mod2_scale, img_mod2_gate = img_mod2\n        txt_mod1_shift, txt_mod1_scale, txt_mod1_gate = txt_mod1\n        txt_mod2_shift, txt_mod2_scale, txt_mod2_gate = txt_mod2\n\n        # prepare image for attention\n        img_modulated = self.img_norm1(img)\n        img_modulated = (1 + img_mod1_scale) * img_modulated + img_mod1_shift\n\n        img_qkv = self.img_attn.qkv(img_modulated)\n        img_q, img_k, img_v = rearrange(img_qkv, \"B L (K H D) -\u003e K B H L D\", K=3, H=self.num_heads)\n        img_q, img_k = self.img_attn.norm(img_q, img_k, img_v)\n\n        # prepare txt for attention\n        txt_modulated = self.txt_norm1(txt)\n        txt_modulated = (1 + txt_mod1_scale) * txt_modulated + txt_mod1_shift\n\n        txt_qkv = self.txt_attn.qkv(txt_modulated)\n        txt_q, txt_k, txt_v = rearrange(txt_qkv, \"B L (K H D) -\u003e K B H L D\", K=3, H=self.num_heads)\n        txt_q, txt_k = self.txt_attn.norm(txt_q, txt_k, txt_v)\n\n        q = torch.cat((txt_q, img_q), dim=2)\n        k = torch.cat((txt_k, img_k), dim=2)\n        v = torch.cat((txt_v, img_v), dim=2)\n\n        num_txt_tokens = txt_q.shape[2]\n        pe_full = torch.cat((pe_ctx, pe), dim=2)\n\n        mods = (\n            img_mod1_gate,\n            img_mod2_shift,\n            img_mod2_scale,\n            img_mod2_gate,\n            txt_mod1_gate,\n            txt_mod2_shift,\n            txt_mod2_scale,\n            txt_mod2_gate,\n        )\n\n        return q, k, v, pe_full, num_txt_tokens, mods\n\n    def _apply_residuals(self, img, txt, img_attn, txt_attn, mods):\n        (\n            img_mod1_gate,\n            img_mod2_shift,\n            img_mod2_scale,\n            img_mod2_gate,\n            txt_mod1_gate,\n            txt_mod2_shift,\n            txt_mod2_scale,\n            txt_mod2_gate,\n        ) = mods\n\n        img = img + img_mod1_gate * self.img_attn.proj(img_attn)\n        img = img + img_mod2_gate * self.img_mlp(\n            (1 + img_mod2_scale) * (self.img_norm2(img)) + img_mod2_shift\n        )\n\n        txt = txt + txt_mod1_gate * self.txt_attn.proj(txt_attn)\n        txt = txt + txt_mod2_gate * self.txt_mlp(\n            (1 + txt_mod2_scale) * (self.txt_norm2(txt)) + txt_mod2_shift\n        )\n        return img, txt\n\n    def forward_kv_extract(\n        self,\n        img: Tensor,\n        txt: Tensor,\n        pe: Tensor,\n        pe_ctx: Tensor,\n        mod_img: tuple[Tensor, Tensor],\n        mod_txt: tuple[Tensor, Tensor],\n        num_ref_tokens: int,\n    ) -\u003e tuple[Tensor, Tensor, dict]:\n        \"\"\"Forward with causal attention. img has layout [ref, img]. Extracts ref KV cache.\"\"\"\n        q, k, v, pe_full, num_txt_tokens, mods = self._prepare_qkv(img, txt, pe, pe_ctx, mod_img, mod_txt)\n        q, k = apply_rope(q, k, pe_full)\n\n        ref_start = num_txt_tokens\n        ref_end = num_txt_tokens + num_ref_tokens\n        cache = {\n            \"k_ref\": k[:, :, ref_start:ref_end, :].clone(),\n            \"v_ref\": v[:, :, ref_start:ref_end, :].clone(),\n        }\n\n        attn = causal_attn_fn(q, k, v, num_txt_tokens, num_ref_tokens)\n        txt_attn, img_attn = attn[:, :num_txt_tokens], attn[:, num_txt_tokens:]\n        img, txt = self._apply_residuals(img, txt, img_attn, txt_attn, mods)\n        return img, txt, cache\n\n    def forward_kv_cached(\n        self,\n        img: Tensor,\n        txt: Tensor,\n        pe: Tensor,\n        pe_ctx: Tensor,\n        mod_img: tuple[Tensor, Tensor],\n        mod_txt: tuple[Tensor, Tensor],\n        kv_cache: dict,\n    ) -\u003e tuple[Tensor, Tensor]:\n        \"\"\"Forward using cached ref KV. img has layout [img] only (no ref).\"\"\"\n        q, k, v, pe_full, num_txt_tokens, mods = self._prepare_qkv(img, txt, pe, pe_ctx, mod_img, mod_txt)\n        q, k = apply_rope(q, k, pe_full)\n\n        num_ref_tokens = kv_cache[\"k_ref\"].shape[2]\n        attn = causal_attn_fn(q, k, v, num_txt_tokens, num_ref_tokens, kv_cache)\n        txt_attn, img_attn = attn[:, :num_txt_tokens], attn[:, num_txt_tokens:]\n        return self._apply_residuals(img, txt, img_attn, txt_attn, mods)\n\n\nclass MLPEmbedder(nn.Module):\n    def __init__(self, in_dim: int, hidden_dim: int, disable_bias: bool = False):\n        super().__init__()\n        self.in_layer = nn.Linear(in_dim, hidden_dim, bias=not disable_bias)\n        self.silu = nn.SiLU()\n        self.out_layer = nn.Linear(hidden_dim, hidden_dim, bias=not disable_bias)\n\n    def forward(self, x: Tensor) -\u003e Tensor:\n        return self.out_layer(self.silu(self.in_layer(x)))\n\n\nclass EmbedND(nn.Module):\n    def __init__(self, dim: int, theta: int, axes_dim: list[int]):\n        super().__init__()\n        self.dim = dim\n        self.theta = theta\n        self.axes_dim = axes_dim\n\n    def forward(self, ids: Tensor) -\u003e Tensor:\n        emb = torch.cat(\n            [rope(ids[..., i], self.axes_dim[i], self.theta) for i in range(len(self.axes_dim))],\n            dim=-3,\n        )\n\n        return emb.unsqueeze(1)\n\n\ndef timestep_embedding(t: Tensor, dim, max_period=10000, time_factor: float = 1000.0):\n    \"\"\"\n    Create sinusoidal timestep embeddings.\n    :param t: a 1-D Tensor of N indices, one per batch element.\n                      These may be fractional.\n    :param dim: the dimension of the output.\n    :param max_period: controls the minimum frequency of the embeddings.\n    :return: an (N, D) Tensor of positional embeddings.\n    \"\"\"\n    t = time_factor * t\n    half = dim // 2\n    freqs = torch.exp(\n        -math.log(max_period) * torch.arange(start=0, end=half, device=t.device, dtype=torch.float32) / half\n    )\n\n    args = t[:, None].float() * freqs[None]\n    embedding = torch.cat([torch.cos(args), torch.sin(args)], dim=-1)\n    if dim % 2:\n        embedding = torch.cat([embedding, torch.zeros_like(embedding[:, :1])], dim=-1)\n    if torch.is_floating_point(t):\n        embedding = embedding.to(t)\n    return embedding\n\n\nclass RMSNorm(torch.nn.Module):\n    def __init__(self, dim: int):\n        super().__init__()\n        self.scale = nn.Parameter(torch.ones(dim))\n\n    def forward(self, x: Tensor):\n        x_dtype = x.dtype\n        x = x.float()\n        rrms = torch.rsqrt(torch.mean(x**2, dim=-1, keepdim=True) + 1e-6)\n        return (x * rrms).to(dtype=x_dtype) * self.scale\n\n\nclass QKNorm(torch.nn.Module):\n    def __init__(self, dim: int):\n        super().__init__()\n        self.query_norm = RMSNorm(dim)\n        self.key_norm = RMSNorm(dim)\n\n    def forward(self, q: Tensor, k: Tensor, v: Tensor) -\u003e tuple[Tensor, Tensor]:\n        q = self.query_norm(q)\n        k = self.key_norm(k)\n        return q.to(v), k.to(v)\n\n\ndef causal_attn_fn(\n    q: Tensor,\n    k: Tensor,\n    v: Tensor,\n    num_txt_tokens: int,\n    num_ref_tokens: int,\n    kv_cache: dict | None = None,\n) -\u003e Tensor:\n    \"\"\"\n    Causal attention where reference tokens only attend to themselves.\n\n    Without cache: layout is [txt, ref, img]. txt+img attend to all, ref self-attends.\n    With cache: layout is [txt, img]. Cached ref K/V injected into attention.\n    \"\"\"\n    if kv_cache is not None:\n        k_ref = kv_cache[\"k_ref\"]\n        v_ref = kv_cache[\"v_ref\"]\n\n        q_txt = q[:, :, :num_txt_tokens, :]\n        q_img = q[:, :, num_txt_tokens:, :]\n        k_txt = k[:, :, :num_txt_tokens, :]\n        v_txt = v[:, :, :num_txt_tokens, :]\n        k_img = k[:, :, num_txt_tokens:, :]\n        v_img = v[:, :, num_txt_tokens:, :]\n\n        q_txt_img = torch.cat([q_txt, q_img], dim=2)\n        k_all = torch.cat([k_txt, k_ref, k_img], dim=2)\n        v_all = torch.cat([v_txt, v_ref, v_img], dim=2)\n        out = F.scaled_dot_product_attention(q_txt_img, k_all, v_all, is_causal=False)\n\n    else:\n        ref_start = num_txt_tokens\n        ref_end = num_txt_tokens + num_ref_tokens\n\n        q_txt = q[:, :, :ref_start, :]\n        q_ref = q[:, :, ref_start:ref_end, :]\n        q_img = q[:, :, ref_end:, :]\n        k_txt = k[:, :, :ref_start, :]\n        v_txt = v[:, :, :ref_start, :]\n        k_ref = k[:, :, ref_start:ref_end, :]\n        v_ref = v[:, :, ref_start:ref_end, :]\n        k_img = k[:, :, ref_end:, :]\n        v_img = v[:, :, ref_end:, :]\n\n        # txt+img attend to all keys\n        q_txt_img = torch.cat([q_txt, q_img], dim=2)\n        k_all = torch.cat([k_txt, k_ref, k_img], dim=2)\n        v_all = torch.cat([v_txt, v_ref, v_img], dim=2)\n        attn_txt_img = F.scaled_dot_product_attention(q_txt_img, k_all, v_all, is_causal=False)\n        attn_txt = attn_txt_img[:, :, :ref_start, :]\n        attn_img = attn_txt_img[:, :, ref_start:, :]\n\n        # ref only attends to itself\n        attn_ref = F.scaled_dot_product_attention(q_ref, k_ref, v_ref, is_causal=False)\n\n        out = torch.cat([attn_txt, attn_ref, attn_img], dim=2)\n\n    return rearrange(out, \"b h n d -\u003e b n (h d)\")\n\n\ndef rope(pos: Tensor, dim: int, theta: int) -\u003e Tensor:\n    assert dim % 2 == 0\n    scale = torch.arange(0, dim, 2, dtype=pos.dtype, device=pos.device) / dim\n    omega = 1.0 / (theta**scale)\n    out = torch.einsum(\"...n,d-\u003e...nd\", pos, omega)\n    out = torch.stack([torch.cos(out), -torch.sin(out), torch.sin(out), torch.cos(out)], dim=-1)\n    out = rearrange(out, \"b n d (i j) -\u003e b n d i j\", i=2, j=2)\n    return out.float()\n\n\ndef apply_rope(xq: Tensor, xk: Tensor, freqs_cis: Tensor) -\u003e tuple[Tensor, Tensor]:\n    xq_ = xq.float().reshape(*xq.shape[:-1], -1, 1, 2)\n    xk_ = xk.float().reshape(*xk.shape[:-1], -1, 1, 2)\n    xq_out = freqs_cis[..., 0] * xq_[..., 0] + freqs_cis[..., 1] * xq_[..., 1]\n    xk_out = freqs_cis[..., 0] * xk_[..., 0] + freqs_cis[..., 1] * xk_[..., 1]\n    return xq_out.reshape(*xq.shape).type_as(xq), xk_out.reshape(*xk.shape).type_as(xk)\n","sha256":"e062691d789ec80a04a5fbc421b09d3b7e264305be1dfcb6da65d68c259e18c1"},"external/flux2/text_encoder.py":{"text":"from pathlib import Path\n\nimport torch\nimport torch.nn as nn\nfrom einops import rearrange\nfrom PIL import Image\nfrom transformers import (\n    AutoModelForCausalLM,\n    AutoProcessor,\n    AutoTokenizer,\n    Mistral3ForConditionalGeneration,\n    pipeline,\n)\n\nfrom .sampling import cap_pixels, concatenate_images\nfrom .system_messages import (\n    PROMPT_IMAGE_INTEGRITY,\n    PROMPT_IMAGE_INTEGRITY_FOLLOW_UP,\n    PROMPT_TEXT_INTEGRITY,\n    SYSTEM_MESSAGE,\n    SYSTEM_MESSAGE_UPSAMPLING_I2I,\n    SYSTEM_MESSAGE_UPSAMPLING_T2I,\n    SYSTEM_PROMPT_CONTENT_FILTER,\n)\n\nOUTPUT_LAYERS_MISTRAL = [10, 20, 30]\nOUTPUT_LAYERS_QWEN3 = [9, 18, 27]\nMAX_LENGTH = 512\nNSFW_THRESHOLD = 0.85\nUPSAMPLING_MAX_IMAGE_SIZE = 768**2\n\n\nclass Mistral3SmallEmbedder(nn.Module):\n    def __init__(\n        self,\n        model_spec: str = \"mistralai/Mistral-Small-3.2-24B-Instruct-2506\",\n        model_spec_processor: str = \"mistralai/Mistral-Small-3.1-24B-Instruct-2503\",\n        torch_dtype: str = \"bfloat16\",\n    ):\n        super().__init__()\n\n        self.model: Mistral3ForConditionalGeneration = Mistral3ForConditionalGeneration.from_pretrained(\n            model_spec,\n            torch_dtype=getattr(torch, torch_dtype),\n        )\n        self.processor = AutoProcessor.from_pretrained(model_spec_processor, use_fast=False)\n        self.yes_token, self.no_token = self.processor.tokenizer.encode(\n            [\"yes\", \"no\"], add_special_tokens=False\n        )\n\n        self.max_length = MAX_LENGTH\n        self.upsampling_max_image_size = UPSAMPLING_MAX_IMAGE_SIZE\n\n        self.nsfw_classifier = pipeline(\"image-classification\", model=\"Falconsai/nsfw_image_detection\")\n\n    def _validate_and_process_images(\n        self, img: list[list[Image.Image]] | list[Image.Image]\n    ) -\u003e list[list[Image.Image]]:\n        # Simple validation: ensure it's a list of PIL images or list of lists of PIL images\n        if not img:\n            return []\n\n        # Check if it's a list of lists or a list of images\n        if isinstance(img[0], Image.Image):\n            # It's a list of images, convert to list of lists\n            img = [[im] for im in img]\n\n        # potentially concatenate multiple images to reduce the size\n        img = [[concatenate_images(img_i)] if len(img_i) \u003e 1 else img_i for img_i in img]\n\n        # cap the pixels\n        img = [[cap_pixels(img_i, self.upsampling_max_image_size) for img_i in img_i] for img_i in img]\n        return img\n\n    def format_input(\n        self,\n        txt: list[str],\n        system_message: str = SYSTEM_MESSAGE,\n        img: list[Image.Image] | list[list[Image.Image]] | None = None,\n    ) -\u003e list[list[dict]]:\n        \"\"\"\n        Format a batch of text prompts into the conversation format expected by apply_chat_template.\n        Optionally, add images to the input.\n\n        Args:\n            txt: List of text prompts\n            system_message: System message to use (default: CREATIVE_SYSTEM_MESSAGE)\n            img: List of images to add to the input.\n\n        Returns:\n            List of conversations, where each conversation is a list of message dicts\n        \"\"\"\n        # Remove [IMG] tokens from prompts to avoid Pixtral validation issues\n        # when truncation is enabled. The processor counts [IMG] tokens and fails\n        # if the count changes after truncation.\n        cleaned_txt = [prompt.replace(\"[IMG]\", \"\") for prompt in txt]\n\n        if img is None or len(img) == 0:\n            return [\n                [\n                    {\n                        \"role\": \"system\",\n                        \"content\": [{\"type\": \"text\", \"text\": system_message}],\n                    },\n                    {\"role\": \"user\", \"content\": [{\"type\": \"text\", \"text\": prompt}]},\n                ]\n                for prompt in cleaned_txt\n            ]\n        else:\n            assert len(img) == len(txt), \"Number of images must match number of prompts\"\n            img = self._validate_and_process_images(img)\n\n            messages = [\n                [\n                    {\n                        \"role\": \"system\",\n                        \"content\": [{\"type\": \"text\", \"text\": system_message}],\n                    },\n                ]\n                for _ in cleaned_txt\n            ]\n\n            for i, (el, images) in enumerate(zip(messages, img)):\n                # optionally add the images per batch element.\n                if images is not None:\n                    el.append(\n                        {\n                            \"role\": \"user\",\n                            \"content\": [{\"type\": \"image\", \"image\": image_obj} for image_obj in images],\n                        }\n                    )\n                # add the text.\n                el.append(\n                    {\n                        \"role\": \"user\",\n                        \"content\": [{\"type\": \"text\", \"text\": cleaned_txt[i]}],\n                    }\n                )\n\n            return messages\n\n    @torch.no_grad()\n    def upsample_prompt(\n        self,\n        txt: list[str],\n        img: list[Image.Image] | list[list[Image.Image]] | None = None,\n        temperature: float = 0.15,\n    ) -\u003e list[str]:\n        \"\"\"\n        Upsample prompts using the model's generate method.\n\n        Args:\n            txt: List of input prompts to upsample\n            img: Optional list of images or list of lists of images. If None or all None, uses t2i mode, otherwise i2i mode.\n\n        Returns:\n            List of upsampled prompts\n        \"\"\"\n        # Set system message based on whether images are provided\n        if img is None or len(img) == 0 or img[0] is None:\n            system_message = SYSTEM_MESSAGE_UPSAMPLING_T2I\n        else:\n            system_message = SYSTEM_MESSAGE_UPSAMPLING_I2I\n\n        # Format input messages\n        messages_batch = self.format_input(txt=txt, system_message=system_message, img=img)\n\n        # Process all messages at once\n        # with image processing a too short max length can throw an error in here.\n        try:\n            inputs = self.processor.apply_chat_template(\n                messages_batch,\n                add_generation_prompt=True,\n                tokenize=True,\n                return_dict=True,\n                return_tensors=\"pt\",\n                padding=\"max_length\",\n                truncation=True,\n                max_length=2048,\n            )\n        except ValueError as e:\n            print(\n                f\"Error processing input: {e}, your max length is probably too short, when you have images in the input.\"\n            )\n            raise e\n\n        # Move to device\n        inputs[\"input_ids\"] = inputs[\"input_ids\"].to(self.model.device)\n        inputs[\"attention_mask\"] = inputs[\"attention_mask\"].to(self.model.device)\n\n        if \"pixel_values\" in inputs:\n            inputs[\"pixel_values\"] = inputs[\"pixel_values\"].to(self.model.device, self.model.dtype)\n\n        # Generate text using the model's generate method\n        try:\n            generated_ids = self.model.generate(\n                **inputs,\n                max_new_tokens=512,\n                do_sample=True,\n                temperature=temperature,\n                use_cache=True,\n            )\n\n            # Decode only the newly generated tokens (skip input tokens)\n            # Extract only the generated portion\n            input_length = inputs[\"input_ids\"].shape[1]\n            generated_tokens = generated_ids[:, input_length:]\n\n            raw_txt = self.processor.tokenizer.batch_decode(\n                generated_tokens, skip_special_tokens=True, clean_up_tokenization_spaces=True\n            )\n            return raw_txt\n        except Exception as e:\n            print(f\"Error generating upsampled prompt: {e}, returning original prompt\")\n            return txt\n\n    @torch.no_grad()\n    def forward(self, txt: list[str]):\n        # Format input messages\n        messages_batch = self.format_input(txt=txt)\n\n        # Process all messages at once\n        # with image processing a too short max length can throw an error in here.\n        inputs = self.processor.apply_chat_template(\n            messages_batch,\n            add_generation_prompt=False,\n            tokenize=True,\n            return_dict=True,\n            return_tensors=\"pt\",\n            padding=\"max_length\",\n            truncation=True,\n            max_length=self.max_length,\n        )\n\n        # Move to device\n        input_ids = inputs[\"input_ids\"].to(self.model.device)\n        attention_mask = inputs[\"attention_mask\"].to(self.model.device)\n\n        # Forward pass through the model\n        output = self.model(\n            input_ids=input_ids,\n            attention_mask=attention_mask,\n            output_hidden_states=True,\n            use_cache=False,\n        )\n\n        out = torch.stack([output.hidden_states[k] for k in OUTPUT_LAYERS_MISTRAL], dim=1)\n        return rearrange(out, \"b c l d -\u003e b l (c d)\")\n\n    def yes_no_logit_processor(\n        self, input_ids: torch.LongTensor, scores: torch.FloatTensor\n    ) -\u003e torch.FloatTensor:\n        \"\"\"\n        Sets all tokens but yes/no to the minimum.\n        \"\"\"\n        scores_yes_token = scores[:, self.yes_token].clone()\n        scores_no_token = scores[:, self.no_token].clone()\n        scores_min = scores.min()\n        scores[:, :] = scores_min - 1\n        scores[:, self.yes_token] = scores_yes_token\n        scores[:, self.no_token] = scores_no_token\n        return scores\n\n    def test_image(self, image: Image.Image | str | Path | torch.Tensor) -\u003e bool:\n        if isinstance(image, torch.Tensor):\n            image = rearrange(image[0].clamp(-1.0, 1.0), \"c h w -\u003e h w c\")\n            image = Image.fromarray((127.5 * (image + 1.0)).cpu().byte().numpy())\n        elif isinstance(image, (str, Path)):\n            image = Image.open(image)\n\n        classification = next(c for c in self.nsfw_classifier(image) if c[\"label\"] == \"nsfw\")\n        if classification[\"score\"] \u003e NSFW_THRESHOLD:\n            return True\n\n        # 512^2 pixels are enough for checking\n        w, h = image.size\n        f = (512**2 / (w * h)) ** 0.5\n        image = image.resize((int(f * w), int(f * h)))\n\n        chat = [\n            {\n                \"role\": \"system\",\n                \"content\": [\n                    {\n                        \"type\": \"text\",\n                        \"text\": SYSTEM_PROMPT_CONTENT_FILTER,\n                    },\n                ],\n            },\n            {\n                \"role\": \"user\",\n                \"content\": [\n                    {\n                        \"type\": \"text\",\n                        \"text\": PROMPT_IMAGE_INTEGRITY,\n                    },\n                    {\n                        \"type\": \"image\",\n                        \"image\": image,\n                    },\n                    {\n                        \"type\": \"text\",\n                        \"text\": PROMPT_IMAGE_INTEGRITY_FOLLOW_UP,\n                    },\n                ],\n            },\n        ]\n\n        inputs = self.processor.apply_chat_template(\n            chat,\n            add_generation_prompt=True,\n            tokenize=True,\n            return_dict=True,\n            return_tensors=\"pt\",\n        ).to(self.model.device)\n        inputs[\"pixel_values\"] = inputs[\"pixel_values\"].to(dtype=self.model.dtype)\n\n        generate_ids = self.model.generate(\n            **inputs,\n            max_new_tokens=1,\n            logits_processor=[self.yes_no_logit_processor],\n            do_sample=False,\n        )\n\n        return generate_ids[0, -1].item() == self.yes_token\n\n    def test_txt(self, txt: str) -\u003e bool:\n        chat = [\n            {\n                \"role\": \"system\",\n                \"content\": [\n                    {\n                        \"type\": \"text\",\n                        \"text\": SYSTEM_PROMPT_CONTENT_FILTER,\n                    },\n                ],\n            },\n            {\n                \"role\": \"user\",\n                \"content\": [\n                    {\n                        \"type\": \"text\",\n                        \"text\": PROMPT_TEXT_INTEGRITY.format(prompt=txt),\n                    },\n                ],\n            },\n        ]\n\n        inputs = self.processor.apply_chat_template(\n            chat,\n            add_generation_prompt=True,\n            tokenize=True,\n            return_dict=True,\n            return_tensors=\"pt\",\n        ).to(self.model.device)\n\n        generate_ids = self.model.generate(\n            **inputs,\n            max_new_tokens=1,\n            logits_processor=[self.yes_no_logit_processor],\n            do_sample=False,\n        )\n        return generate_ids[0, -1].item() == self.yes_token\n\n\nclass Qwen3Embedder(nn.Module):\n    def __init__(\n        self,\n        model_spec: str,\n        device: str | torch.device = \"cuda\",\n    ):\n        super().__init__()\n\n        self.model = AutoModelForCausalLM.from_pretrained(\n            model_spec,\n            torch_dtype=None,\n            device_map=str(device),\n        )\n\n        self.tokenizer = AutoTokenizer.from_pretrained(model_spec)\n        self.max_length = MAX_LENGTH\n\n    @torch.no_grad()\n    def forward(self, txt: list[str]):\n        all_input_ids = []\n        all_attention_masks = []\n\n        for prompt in txt:\n            messages = [{\"role\": \"user\", \"content\": prompt}]\n            text = self.tokenizer.apply_chat_template(\n                messages,\n                tokenize=False,\n                add_generation_prompt=True,\n                enable_thinking=False,\n            )\n\n            model_inputs = self.tokenizer(\n                text,\n                return_tensors=\"pt\",\n                padding=\"max_length\",\n                truncation=True,\n                max_length=self.max_length,\n            )\n\n            all_input_ids.append(model_inputs[\"input_ids\"])\n            all_attention_masks.append(model_inputs[\"attention_mask\"])\n\n        input_ids = torch.cat(all_input_ids, dim=0).to(self.model.device)\n        attention_mask = torch.cat(all_attention_masks, dim=0).to(self.model.device)\n\n        output = self.model(\n            input_ids=input_ids,\n            attention_mask=attention_mask,\n            output_hidden_states=True,\n            use_cache=False,\n        )\n\n        out = torch.stack([output.hidden_states[k] for k in OUTPUT_LAYERS_QWEN3], dim=1)\n        return rearrange(out, \"b c l d -\u003e b l (c d)\")\n\n    def test_txt(self, txt: str) -\u003e bool:\n        raise NotImplementedError(\"Qwen3Embedder does not support text testing\")\n\n    def test_image(self, image) -\u003e bool:\n        raise NotImplementedError(\"Qwen3Embedder does not support image testing\")\n\n    def upsample_prompt(self, txt: list[str], img=None, **kwargs) -\u003e list[str]:\n        raise NotImplementedError(\"Qwen3Embedder does not support upsampling\")\n\n\ndef load_mistral_small_embedder(device: str | torch.device = \"cuda\") -\u003e Mistral3SmallEmbedder:\n    return Mistral3SmallEmbedder().to(device)\n\n\ndef load_qwen3_embedder(variant: str, device: str | torch.device = \"cuda\"):\n    return Qwen3Embedder(model_spec=f\"Qwen/Qwen3-{variant}-FP8\", device=device)\n","sha256":"72b1f9aa95dbefac5a0fdd2217d7be5b7e7a42966a4c9370ba4adb00c89b4761"},"external/flux2/autoencoder.py":{"text":"import math\nfrom dataclasses import dataclass, field\n\nimport torch\nfrom einops import rearrange\nfrom torch import Tensor, nn\n\n\n@dataclass\nclass AutoEncoderParams:\n    resolution: int = 256\n    in_channels: int = 3\n    ch: int = 128\n    out_ch: int = 3\n    ch_mult: list[int] = field(default_factory=lambda: [1, 2, 4, 4])\n    num_res_blocks: int = 2\n    z_channels: int = 32\n\n\ndef swish(x: Tensor) -\u003e Tensor:\n    return x * torch.sigmoid(x)\n\n\nclass AttnBlock(nn.Module):\n    def __init__(self, in_channels: int):\n        super().__init__()\n        self.in_channels = in_channels\n\n        self.norm = nn.GroupNorm(num_groups=32, num_channels=in_channels, eps=1e-6, affine=True)\n\n        self.q = nn.Conv2d(in_channels, in_channels, kernel_size=1)\n        self.k = nn.Conv2d(in_channels, in_channels, kernel_size=1)\n        self.v = nn.Conv2d(in_channels, in_channels, kernel_size=1)\n        self.proj_out = nn.Conv2d(in_channels, in_channels, kernel_size=1)\n\n    def attention(self, h_: Tensor) -\u003e Tensor:\n        h_ = self.norm(h_)\n        q = self.q(h_)\n        k = self.k(h_)\n        v = self.v(h_)\n\n        b, c, h, w = q.shape\n        q = rearrange(q, \"b c h w -\u003e b 1 (h w) c\").contiguous()\n        k = rearrange(k, \"b c h w -\u003e b 1 (h w) c\").contiguous()\n        v = rearrange(v, \"b c h w -\u003e b 1 (h w) c\").contiguous()\n        h_ = nn.functional.scaled_dot_product_attention(q, k, v)\n\n        return rearrange(h_, \"b 1 (h w) c -\u003e b c h w\", h=h, w=w, c=c, b=b)\n\n    def forward(self, x: Tensor) -\u003e Tensor:\n        return x + self.proj_out(self.attention(x))\n\n\nclass ResnetBlock(nn.Module):\n    def __init__(self, in_channels: int, out_channels: int):\n        super().__init__()\n        self.in_channels = in_channels\n        out_channels = in_channels if out_channels is None else out_channels\n        self.out_channels = out_channels\n\n        self.norm1 = nn.GroupNorm(num_groups=32, num_channels=in_channels, eps=1e-6, affine=True)\n        self.conv1 = nn.Conv2d(in_channels, out_channels, kernel_size=3, stride=1, padding=1)\n        self.norm2 = nn.GroupNorm(num_groups=32, num_channels=out_channels, eps=1e-6, affine=True)\n        self.conv2 = nn.Conv2d(out_channels, out_channels, kernel_size=3, stride=1, padding=1)\n        if self.in_channels != self.out_channels:\n            self.nin_shortcut = nn.Conv2d(in_channels, out_channels, kernel_size=1, stride=1, padding=0)\n\n    def forward(self, x):\n        h = x\n        h = self.norm1(h)\n        h = swish(h)\n        h = self.conv1(h)\n\n        h = self.norm2(h)\n        h = swish(h)\n        h = self.conv2(h)\n\n        if self.in_channels != self.out_channels:\n            x = self.nin_shortcut(x)\n\n        return x + h\n\n\nclass Downsample(nn.Module):\n    def __init__(self, in_channels: int):\n        super().__init__()\n        # no asymmetric padding in torch conv, must do it ourselves\n        self.conv = nn.Conv2d(in_channels, in_channels, kernel_size=3, stride=2, padding=0)\n\n    def forward(self, x: Tensor):\n        pad = (0, 1, 0, 1)\n        x = nn.functional.pad(x, pad, mode=\"constant\", value=0)\n        x = self.conv(x)\n        return x\n\n\nclass Upsample(nn.Module):\n    def __init__(self, in_channels: int):\n        super().__init__()\n        self.conv = nn.Conv2d(in_channels, in_channels, kernel_size=3, stride=1, padding=1)\n\n    def forward(self, x: Tensor):\n        x = nn.functional.interpolate(x, scale_factor=2.0, mode=\"nearest\")\n        x = self.conv(x)\n        return x\n\n\nclass Encoder(nn.Module):\n    def __init__(\n        self,\n        resolution: int,\n        in_channels: int,\n        ch: int,\n        ch_mult: list[int],\n        num_res_blocks: int,\n        z_channels: int,\n    ):\n        super().__init__()\n        self.quant_conv = torch.nn.Conv2d(2 * z_channels, 2 * z_channels, 1)\n        self.ch = ch\n        self.num_resolutions = len(ch_mult)\n        self.num_res_blocks = num_res_blocks\n        self.resolution = resolution\n        self.in_channels = in_channels\n        # downsampling\n        self.conv_in = nn.Conv2d(in_channels, self.ch, kernel_size=3, stride=1, padding=1)\n\n        curr_res = resolution\n        in_ch_mult = (1,) + tuple(ch_mult)\n        self.in_ch_mult = in_ch_mult\n        self.down = nn.ModuleList()\n        block_in = self.ch\n        for i_level in range(self.num_resolutions):\n            block = nn.ModuleList()\n            attn = nn.ModuleList()\n            block_in = ch * in_ch_mult[i_level]\n            block_out = ch * ch_mult[i_level]\n            for _ in range(self.num_res_blocks):\n                block.append(ResnetBlock(in_channels=block_in, out_channels=block_out))\n                block_in = block_out\n            down = nn.Module()\n            down.block = block\n            down.attn = attn\n            if i_level != self.num_resolutions - 1:\n                down.downsample = Downsample(block_in)\n                curr_res = curr_res // 2\n            self.down.append(down)\n\n        # middle\n        self.mid = nn.Module()\n        self.mid.block_1 = ResnetBlock(in_channels=block_in, out_channels=block_in)\n        self.mid.attn_1 = AttnBlock(block_in)\n        self.mid.block_2 = ResnetBlock(in_channels=block_in, out_channels=block_in)\n\n        # end\n        self.norm_out = nn.GroupNorm(num_groups=32, num_channels=block_in, eps=1e-6, affine=True)\n        self.conv_out = nn.Conv2d(block_in, 2 * z_channels, kernel_size=3, stride=1, padding=1)\n\n    def forward(self, x: Tensor) -\u003e Tensor:\n        # downsampling\n        hs = [self.conv_in(x)]\n        for i_level in range(self.num_resolutions):\n            for i_block in range(self.num_res_blocks):\n                h = self.down[i_level].block[i_block](hs[-1])\n                if len(self.down[i_level].attn) \u003e 0:\n                    h = self.down[i_level].attn[i_block](h)\n                hs.append(h)\n            if i_level != self.num_resolutions - 1:\n                hs.append(self.down[i_level].downsample(hs[-1]))\n\n        # middle\n        h = hs[-1]\n        h = self.mid.block_1(h)\n        h = self.mid.attn_1(h)\n        h = self.mid.block_2(h)\n        # end\n        h = self.norm_out(h)\n        h = swish(h)\n        h = self.conv_out(h)\n        h = self.quant_conv(h)\n        return h\n\n\nclass Decoder(nn.Module):\n    def __init__(\n        self,\n        ch: int,\n        out_ch: int,\n        ch_mult: list[int],\n        num_res_blocks: int,\n        in_channels: int,\n        resolution: int,\n        z_channels: int,\n    ):\n        super().__init__()\n        self.post_quant_conv = torch.nn.Conv2d(z_channels, z_channels, 1)\n        self.ch = ch\n        self.num_resolutions = len(ch_mult)\n        self.num_res_blocks = num_res_blocks\n        self.resolution = resolution\n        self.in_channels = in_channels\n        self.ffactor = 2 ** (self.num_resolutions - 1)\n\n        # compute in_ch_mult, block_in and curr_res at lowest res\n        block_in = ch * ch_mult[self.num_resolutions - 1]\n        curr_res = resolution // 2 ** (self.num_resolutions - 1)\n        self.z_shape = (1, z_channels, curr_res, curr_res)\n\n        # z to block_in\n        self.conv_in = nn.Conv2d(z_channels, block_in, kernel_size=3, stride=1, padding=1)\n\n        # middle\n        self.mid = nn.Module()\n        self.mid.block_1 = ResnetBlock(in_channels=block_in, out_channels=block_in)\n        self.mid.attn_1 = AttnBlock(block_in)\n        self.mid.block_2 = ResnetBlock(in_channels=block_in, out_channels=block_in)\n\n        # upsampling\n        self.up = nn.ModuleList()\n        for i_level in reversed(range(self.num_resolutions)):\n            block = nn.ModuleList()\n            attn = nn.ModuleList()\n            block_out = ch * ch_mult[i_level]\n            for _ in range(self.num_res_blocks + 1):\n                block.append(ResnetBlock(in_channels=block_in, out_channels=block_out))\n                block_in = block_out\n            up = nn.Module()\n            up.block = block\n            up.attn = attn\n            if i_level != 0:\n                up.upsample = Upsample(block_in)\n                curr_res = curr_res * 2\n            self.up.insert(0, up)  # prepend to get consistent order\n\n        # end\n        self.norm_out = nn.GroupNorm(num_groups=32, num_channels=block_in, eps=1e-6, affine=True)\n        self.conv_out = nn.Conv2d(block_in, out_ch, kernel_size=3, stride=1, padding=1)\n\n    def forward(self, z: Tensor) -\u003e Tensor:\n        z = self.post_quant_conv(z)\n\n        # get dtype for proper tracing\n        upscale_dtype = next(self.up.parameters()).dtype\n\n        # z to block_in\n        h = self.conv_in(z)\n\n        # middle\n        h = self.mid.block_1(h)\n        h = self.mid.attn_1(h)\n        h = self.mid.block_2(h)\n\n        # cast to proper dtype\n        h = h.to(upscale_dtype)\n        # upsampling\n        for i_level in reversed(range(self.num_resolutions)):\n            for i_block in range(self.num_res_blocks + 1):\n                h = self.up[i_level].block[i_block](h)\n                if len(self.up[i_level].attn) \u003e 0:\n                    h = self.up[i_level].attn[i_block](h)\n            if i_level != 0:\n                h = self.up[i_level].upsample(h)\n\n        # end\n        h = self.norm_out(h)\n        h = swish(h)\n        h = self.conv_out(h)\n        return h\n\n\nclass AutoEncoder(nn.Module):\n    def __init__(self, params: AutoEncoderParams):\n        super().__init__()\n        self.params = params\n        self.encoder = Encoder(\n            resolution=params.resolution,\n            in_channels=params.in_channels,\n            ch=params.ch,\n            ch_mult=params.ch_mult,\n            num_res_blocks=params.num_res_blocks,\n            z_channels=params.z_channels,
