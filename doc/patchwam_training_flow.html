 import Path\nfrom typing import Any\n\nimport torch\n\n\ndef read_statistics(path: str | Path) -\u003e dict[str, Any]:\n    def convert(value):\n        if isinstance(value, dict):\n            return {key: convert(item) for key, item in value.items()}\n        if isinstance(value, list):\n            try:\n                return torch.tensor(value, dtype=torch.float32)\n            except (ValueError, TypeError):\n                return [convert(item) for item in value]\n        return value\n\n    return convert(json.loads(Path(path).expanduser().read_text(encoding=\"utf-8\")))\n\n\ndef write_statistics(stats: dict[str, Any], path: str | Path) -\u003e None:\n    def convert(value):\n        if isinstance(value, torch.Tensor):\n            return value.detach().cpu().tolist()\n        if isinstance(value, dict):\n            return {key: convert(item) for key, item in value.items()}\n        if isinstance(value, (list, tuple)):\n            return [convert(item) for item in value]\n        return value\n\n    Path(path).write_text(json.dumps(convert(stats), indent=2), encoding=\"utf-8\")\n\n\nclass FeatureScaler:\n    \"\"\"Invertible affine map with the original clipping and constant-field rules.\"\"\"\n\n    def __init__(self, statistics: dict[str, Any], mode: str = \"q01/q99\"):\n        self.statistics = {key: torch.as_tensor(value, dtype=torch.float32) for key, value in statistics.items()}\n        if not self.statistics or any(not torch.isfinite(value).all() for value in self.statistics.values()):\n            raise ValueError(\"Feature statistics must be nonempty and finite\")\n        if mode == \"z-score\":\n            if (self.statistics[\"std\"] \u003c 0).any():\n                raise ValueError(\"Feature standard deviations must be nonnegative\")\n            self.scale = (self.statistics[\"std\"] + 1e-8).reciprocal()\n            self.offset = -self.statistics[\"mean\"] * self.scale\n        else:\n            if mode in {\"min/max\", \"q01/q99\"}:\n                low_key, high_key = mode.split(\"/\")\n                low, high = self.statistics[low_key], self.statistics[high_key]\n            else:\n                low_value, high_value = map(float, mode.split(\"/\"))\n                template = next(iter(self.statistics.values()))\n                low, high = torch.full_like(template, low_value), torch.full_like(template, high_value)\n            width = high - low\n            if not torch.isfinite(low).all() or not torch.isfinite(high).all() or not torch.isfinite(width).all() or (width \u003c 0).any():\n                raise ValueError(\"Feature scaling bounds must be finite and ordered\")\n            constant = width \u003c 1e-4\n            self.scale = 2 / torch.where(constant, torch.full_like(width, 2), width)\n            self.offset = torch.where(constant, -low, -1 - low * self.scale)\n        if not torch.isfinite(self.scale).all() or not torch.isfinite(self.offset).all():\n            raise ValueError(\"Feature scaling coefficients must be finite\")\n\n    def encode(self, value: torch.Tensor) -\u003e torch.Tensor:\n        return (value * self.scale.to(value) + self.offset.to(value)).clamp(-5, 5)\n\n    def decode(self, value: torch.Tensor) -\u003e torch.Tensor:\n        return (value - self.offset.to(value)) / self.scale.to(value)\n\n\nclass RobotFeatureCodec:\n    \"\"\"Per-field and optional per-embodiment statistics for actions and states.\"\"\"\n\n    def __init__(self, shape_meta, statistics, mode=\"q01/q99\", exceptions=None, stepwise=False):\n        self.shape_meta = shape_meta\n        self.statistics = statistics\n        self.tables = {}\n        groups = statistics[\"embodiments\"] if statistics.get(\"type\") == \"per_embodiment\" else {\"default\": statistics}\n        for embodiment, group in groups.items():\n            self.tables[embodiment] = {}\n            for field in (\"action\", \"state\"):\n                for meta in shape_meta[field]:\n                    key = meta[\"key\"]\n                    prefix = \"stepwise_\" if field == \"action\" and stepwise else \"global_\"\n                    stats = group[field][key]\n                    selected = {name.removeprefix(prefix): item for name, item in stats.items() if name.startswith(prefix)}\n                    if not selected:\n                        selected = stats\n                    selected_mode = (exceptions or {}).get(field, {}).get(key, mode)\n                    self.tables[embodiment][(field, key)] = FeatureScaler(selected, selected_mode)\n\n    def _table(self, embodiment):\n        if embodiment is None and len(self.tables) == 1:\n            return next(iter(self.tables.values()))\n        if embodiment not in self.tables:\n            raise KeyError(f\"Missing feature statistics for embodiment {embodiment!r}\")\n        return self.tables[embodiment]\n\n    def encode(self, fields, embodiment=None):\n        table = self._table(embodiment)\n        return {field: {key: table[(field, key)].encode(value) for key, value in values.items()} for field, values in fields.items()}\n\n    def decode(self, fields, embodiment=None):\n        table = self._table(embodiment)\n        return {field: {key: table[(field, key)].decode(value) for key, value in values.items()} for field, values in fields.items()}\n","sha256":"7db331cb7aec6fe903d70441590ed682e9622a6f7033626cc1de7889e97ebe71"},"src/patchwam/models/policy.py":{"text":"\"\"\"Joint latent flow objective and action-chunk sampling.\"\"\"\n\nimport math\nfrom collections.abc import Callable, Mapping\nfrom itertools import pairwise\nfrom typing import Any\n\nimport torch\nfrom torch import Tensor, nn\nfrom torch.nn import functional as F\n\nfrom .codec import RepeatedActionCodec\nfrom .flow import ShiftedFlow, masked_sample_mse, weighted_masked_sample_mse\nfrom .geometry import joint_visibility, sequence_coordinates\nfrom .tiny import SmallJointTransformer\n\n\nclass PatchFlowPolicy(nn.Module):\n    \"\"\"Joint flow on encoded observations and normalized actions.\n\n    Inputs: reference_tokens [B,R,128], future_tokens [B,S,128], text_tokens\n    [B,L,C], action [B,H,A], optional proprio [B,P] or [B,H,P]. Use raster IDs\n    for real images.\n    Padding True means invalid: dimensions [A], [B,A], or [B,H,A]; steps [B,H].\n    \"\"\"\n\n    def __init__(\n        self, denoiser: nn.Module, *, action_dim: int, text_dim: int,\n        proprio_dim: int | None = None, token_dim: int = 128, action_scale: float = 1,\n        shift: float = 5, video_weight: float = 0.5, action_weight: float = 1,\n        isolate_actions: bool = False, condition_dropout: float = 0,\n        self_flow_variant: int = 0, self_flow_mask_ratio: float = 0.25,\n        self_flow_representation_weight: float = 0.8,\n        self_flow_student_layer: int | None = None, self_flow_teacher_layer: int | None = None,\n        self_flow_structure_ratio: float = 0.5, self_flow_edge_ratio: float = 0.5,\n        self_flow_pseudo_label_fraction: float = 0.25, self_flow_sampling_steps: int = 8,\n        self_flow_label_warmup: int = 10000, self_flow_pseudo_label_weight: float = 0.5,\n        flow_normalization: str = \"continuous\",\n    ):\n        super().__init__()\n        if video_weight \u003c 0 or action_weight \u003c 0:\n            raise ValueError(\"Loss weights must be nonnegative\")\n        if not 0 \u003c= condition_dropout \u003c= 1:\n            raise ValueError(\"condition_dropout must be in [0,1]\")\n        if self_flow_variant not in (0, 1, 2, 3):\n            raise ValueError(\"self_flow_variant must be 0, 1, 2, or 3\")\n        if not 0 \u003c= self_flow_mask_ratio \u003c= 0.5 or not 0 \u003c= self_flow_pseudo_label_fraction \u003c= 1:\n            raise ValueError(\"Self-Flow mask ratio must be in [0,0.5] and pseudo-label fraction in [0,1]\")\n        if not 0 \u003c= self_flow_structure_ratio \u003c= 1 or not 0 \u003c= self_flow_edge_ratio \u003c= 1:\n            raise ValueError(\"Self-Flow structure and edge ratios must be in [0,1]\")\n        if type(self_flow_label_warmup) is not int or self_flow_label_warmup \u003c 0 or not math.isfinite(self_flow_pseudo_label_weight) or self_flow_pseudo_label_weight \u003c 0:\n            raise ValueError(\"Self-Flow label warmup and pseudo-label weight must be nonnegative\")\n        if not math.isfinite(self_flow_representation_weight) or self_flow_representation_weight \u003c 0 or self_flow_sampling_steps \u003c 1:\n            raise ValueError(\"Self-Flow representation weight must be nonnegative and sampling steps positive\")\n        self.denoiser = denoiser\n        self.codec = RepeatedActionCodec(action_dim, token_dim, action_scale)\n        self.flow = ShiftedFlow(shift, normalization=flow_normalization)\n        self.state_projection = None if proprio_dim is None else nn.Linear(proprio_dim, text_dim)\n        self.text_dim = text_dim\n        self.video_weight, self.action_weight = video_weight, action_weight\n        self.isolate_actions = isolate_actions\n        self.condition_dropout = float(condition_dropout)\n        self.self_flow_variant = self_flow_variant\n        self.self_flow_mask_ratio = self_flow_mask_ratio\n        self.self_flow_representation_weight = self_flow_representation_weight\n        self.self_flow_pseudo_label_fraction = self_flow_pseudo_label_fraction\n        self.self_flow_sampling_steps = self_flow_sampling_steps\n        self.self_flow_structure_ratio, self.self_flow_edge_ratio = self_flow_structure_ratio, self_flow_edge_ratio\n        self.self_flow_label_warmup, self.self_flow_pseudo_label_weight = self_flow_label_warmup, self_flow_pseudo_label_weight\n        self._optimizer_updates = 0\n        self.representation_projection = None\n        if self_flow_variant:\n            depth = getattr(denoiser, \"representation_layers\", 0)\n            width = getattr(denoiser, \"representation_dim\", 0)\n            student = self_flow_student_layer if self_flow_student_layer is not None else max(1, round(0.3 * depth))\n            teacher = self_flow_teacher_layer if self_flow_teacher_layer is not None else min(depth, max(student + 1, round(0.7 * depth)))\n            if not width or not 1 \u003c= student \u003c teacher \u003c= depth:\n                raise ValueError(\"Self-Flow requires a feature-capable denoiser and 1 \u003c= student layer \u003c teacher layer \u003c= depth\")\n            self.self_flow_student_layer, self.self_flow_teacher_layer = student, teacher\n            self.representation_projection = nn.Sequential(nn.Linear(width, width), nn.SiLU(), nn.Linear(width, width))\n        object.__setattr__(self, \"_self_flow_teacher\", None)\n\n    def set_optimizer_updates(self, count: int):\n        \"\"\"Set successful updates for pseudo-label warmup and resume.\"\"\"\n        if type(count) is not int or count \u003c 0:\n            raise ValueError(\"Successful optimizer update count must be a nonnegative integer\")\n        self._optimizer_updates = count\n\n    def attach_self_flow_teacher(self, teacher: Callable):\n        \"\"\"Attach the engine's detached, checkpointed EMA evaluator.\"\"\"\n        if not callable(teacher):\n            raise TypeError(\"Self-Flow teacher must be a callable EMA evaluator\")\n        # Keep the engine-owned teacher outside the policy's module tree.\n        object.__setattr__(self, \"_self_flow_teacher\", teacher)\n\n    def _condition_mask(self, batch, mask, generator):\n        b = batch[\"reference_tokens\"].shape[0]\n        device = batch[\"reference_tokens\"].device\n        if mask is None and self.training and self.condition_dropout:\n            mask = torch.rand(b, device=device, generator=generator) \u003c self.condition_dropout\n        if mask is not None:\n            if mask.shape != (b,):\n                raise ValueError(\"condition_drop_mask must be [B]\")\n            mask = mask.to(device=device, dtype=torch.bool)\n        return mask\n\n    def _context(self, batch: Mapping[str, Any], drop_mask: Tensor | None = None) -\u003e tuple[Tensor, Tensor | None]:\n        context = batch[\"text_tokens\"]\n        if context.ndim != 3 or context.shape[-1] != self.text_dim:\n            raise ValueError(f\"text_tokens must be [B,L,{self.text_dim}]\")\n        valid = batch.get(\"text_valid\")\n        if valid is not None and valid.shape != context.shape[:2]:\n            raise ValueError(\"text_valid shape must match text_tokens\")\n        if drop_mask is not None:\n            valid = torch.ones(context.shape[:2], device=context.device, dtype=torch.bool) if valid is None else valid.to(context.device).bool()\n            valid = valid \u0026 ~drop_mask.to(context.device)[:, None]\n        if valid is not None:\n            valid = valid.to(device=context.device, dtype=torch.bool)\n            # Masked NaN keys still contaminate SDPA.\n            context = torch.where(valid[..., None], context, 0)\n        if self.state_projection is not None:\n            state = batch.get(\"proprio\")\n            if state is None:\n                raise ValueError(\"The configured state projection requires proprio\")\n            if state.ndim == 3:\n                state = state[:, 0]\n            if state.ndim != 2 or state.shape[0] != context.shape[0]:\n                raise ValueError(\"proprio must be [B,P] or [B,H,P]\")\n            projected = self.state_projection(state.to(context)).unsqueeze(1)\n            context = torch.cat((context, projected), 1)\n            if valid is not None:\n                state_valid = torch.ones(context.shape[0], 1, device=valid.device, dtype=torch.bool)\n                valid = torch.cat((valid.bool(), state_valid), 1)\n        return context, valid\n\n    def _padding(self, batch: Mapping[str, Any], actions: Tensor) -\u003e tuple[Tensor, Tensor]:\n        dimensions = batch.get(\"action_dim_is_pad\")\n        if dimensions is None:\n            valid_dimensions = torch.ones_like(actions, dtype=torch.bool)\n        else:\n            dimensions = dimensions.to(device=actions.device, dtype=torch.bool)\n            if dimensions.ndim == 2:\n                dimensions = dimensions[:, None, :]\n            try:\n                valid_dimensions = ~torch.broadcast_to(dimensions.bool(), actions.shape)\n            except RuntimeError as exc:\n                raise ValueError(\"action_dim_is_pad cannot broadcast to [B,H,A]\") from exc\n        steps = batch.get(\"action_is_pad\")\n        if steps is None:\n            valid_steps = torch.ones(actions.shape[:2], device=actions.device, dtype=torch.bool)\n        else:\n            if steps.shape != actions.shape[:2]:\n                raise ValueError(\"action_is_pad must be [B,H]\")\n            valid_steps = ~steps.to(device=actions.device, dtype=torch.bool)\n        return valid_dimensions \u0026 valid_steps[..., None], valid_steps\n\n    def _velocity(\n        self, batch: Mapping[str, Any], noisy_future: Tensor, noisy_action: Tensor, sigma: Tensor,\n        *, condition_drop_mask=None, token_sigma=None, representation_layer=None,\n    ):\n        reference = batch[\"reference_tokens\"]\n        context, text_valid = self._context(batch, condition_drop_mask)\n        b, future_length = noisy_future.shape[:2]\n        if reference.ndim != 3 or reference.shape[0] != b or reference.shape[-1] != self.codec.token_dim:\n            raise ValueError(\"reference_tokens must be [B,R,token_dim]\")\n        if context.shape[0] != b:\n            raise ValueError(\"Text and visual batch sizes differ\")\n        device = reference.device\n        reference_valid = batch.get(\"reference_valid\")\n        if reference_valid is not None:\n            if reference_valid.shape != reference.shape[:2]:\n                raise ValueError(\"reference_valid must match reference_tokens [B,R]\")\n            reference_valid = reference_valid.to(device=device, dtype=torch.bool)\n            reference = torch.where(reference_valid[..., None], reference, 0)\n        # Real images supply raster IDs; synthetic examples use sequence IDs.\n        ref_ids = batch.get(\"reference_ids\")\n        if ref_ids is None:\n            ref_ids = sequence_coordinates(b, reference.shape[1], group=10, device=device)\n        if reference_valid is not None:\n            ref_ids = torch.where(reference_valid[..., None], ref_ids.to(device), 0)\n        future_ids = batch.get(\"future_ids\")\n        if future_ids is None:\n            future_ids = sequence_coordinates(b, future_length, group=0, device=device)\n        action_ids = sequence_coordinates(b, noisy_action.shape[1], group=20, device=device)\n        text_ids = sequence_coordinates(b, context.shape[1], device=device)\n        visibility = joint_visibility(\n            context.shape[1], reference.shape[1], future_length, noisy_action.shape[1],\n            text_valid=text_valid, reference_valid=reference_valid,\n            isolate_actions=self.isolate_actions, device=device,\n        )\n        options = {}\n        if token_sigma is not None:\n            options[\"token_sigma\"] = token_sigma\n        if representation_layer is not None:\n            options[\"representation_layer\"] = representation_layer\n        prediction = self.denoiser(\n            reference, torch.cat((noisy_future, noisy_action), 1), sigma, context,\n            reference_ids=ref_ids, noisy_ids=torch.cat((future_ids, action_ids), 1),\n            context_ids=text_ids, visibility=visibility, **options,\n        )\n        features = None\n        if representation_layer is not None:\n            prediction, features = prediction\n        if prediction.shape != (b, future_length + noisy_action.shape[1], self.codec.token_dim):\n            raise ValueError(\"Denoiser returned an incompatible velocity shape\")\n        velocities = prediction[:, :future_length], prediction[:, future_length:]\n        return velocities if representation_layer is None else (*velocities, features)\n\n    def forward(\n        self, batch: Mapping[str, Any], *, generator=None, sigma: Tensor | None = None,\n        future_noise: Tensor | None = None, action_noise: Tensor | None = None,\n        condition_drop_mask: Tensor | None = None, second_sigma: Tensor | None = None,\n        timestep_mask: Tensor | None = None, pseudo_label_mask: Tensor | None = None,\n        structured_branches: Tensor | None = None, token_sigma: Tensor | None = None,\n        representation_only: bool = False, representation_layer: int | None = None,\n        teacher_sampling: bool = False, sampling_steps: int | None = None,\n        horizon: int = 16, future_length: int | None = None,\n    ) -\u003e dict[str, Tensor]:\n        # EMA calls bypass recursive teacher evaluation.\n        if teacher_sampling:\n            return self.sample_actions_from_future(\n                batch, horizon=horizon, steps=self.self_flow_sampling_steps if sampling_steps is None else sampling_steps,\n                generator=generator,\n            )\n        future, actions = batch[\"future_tokens\"], batch[\"action\"]\n        if future.ndim != 3 or future.shape[-1] != self.codec.token_dim:\n            raise ValueError(\"future_tokens must be [B,S,token_dim]\")\n        if actions.ndim != 3 or actions.shape[0] != future.shape[0]:\n            raise ValueError(\"action must be [B,H,A] with matching batch size\")\n        valid_dimensions, valid_steps = self._padding(batch, actions)\n        drop_mask = self._condition_mask(batch, condition_drop_mask, generator)\n        teacher = self._self_flow_teacher\n        if self.self_flow_variant and not representation_only and teacher is None:\n            raise RuntimeError(\"Self-Flow requires an attached checkpointed EMA teacher\")\n        pseudo_mask = torch.zeros(actions.shape[0], device=actions.device, dtype=torch.bool)\n        labeling_active = self._optimizer_updates \u003e= self.self_flow_label_warmup\n        pseudo_mse = actions.new_zeros((), dtype=torch.float32)\n        if self.self_flow_variant == 3 and not representation_only:\n            if pseudo_label_mask is None:\n                pseudo_mask = torch.rand(actions.shape[0], device=actions.device, generator=generator) \u003c self.self_flow_pseudo_label_fraction\n            else:\n                if pseudo_label_mask.shape != pseudo_mask.shape:\n                    raise ValueError(\"pseudo_label_mask must be [B]\")\n                pseudo_mask = pseudo_label_mask.to(device=actions.device, dtype=torch.bool)\n            if labeling_active and pseudo_mask.any():\n                inference_batch = {key: value for key, value in batch.items() if key not in (\"action\", \"action_is_pad\", \"action_dim_is_pad\")}\n                indices = pseudo_mask.nonzero().flatten().tolist()\n                inference_batch = {\n                    key: value[pseudo_mask] if torch.is_tensor(value) and value.ndim and value.shape[0] == actions.shape[0]\n                    else [value[index] for index in indices] if isinstance(value, (list, tuple)) and len(value) == actions.shape[0]\n                    else value\n                    for key, value in inference_batch.items()\n                }\n                with torch.no_grad():\n                    generated = teacher(inference_batch, teacher_sampling=True,\n                                        sampling_steps=self.self_flow_sampling_steps, horizon=actions.shape[1],\n                                        future_length=future.shape[1], generator=generator)[\"action\"].detach()\n                if generated.shape != actions[pseudo_mask].shape or not torch.isfinite(generated).all():\n                    raise ValueError(\"EMA pseudo-label actions must be finite and match the withheld [B,H,A] subset\")\n                with torch.no_grad():\n                    pseudo_mse = (generated.to(actions).float() - actions.float()[pseudo_mask]).square().mean()\n                actions = actions.clone()\n                actions[pseudo_mask] = generated.to(actions)\n            elif not labeling_active:\n                # Warmup hides labels from both student and teacher inputs.\n                actions = torch.where(pseudo_mask[:, None, None], 0, actions)\n        clean_actions = torch.where(valid_dimensions, actions, 0)\n        action_tokens = self.codec.encode(clean_actions).to(future)\n        teacher_sigma = None\n        if self.self_flow_variant and not representation_only:\n            sigma, token_sigma, teacher_sigma = self.flow.dual_timesteps(\n                future.shape[0], future.shape[1], actions.shape[1], mask_ratio=self.self_flow_mask_ratio,\n                structured=self.self_flow_variant \u003e= 2, device=future.device, generator=generator,\n                first=sigma, second=second_sigma, mask=timestep_mask,\n                structure_ratio=self.self_flow_structure_ratio, edge_ratio=self.self_flow_edge_ratio,\n                branches=structured_branches,\n            )\n            if self.self_flow_variant == 3 and not labeling_active:\n                token_sigma[pseudo_mask, future.shape[1]:] = 1\n                teacher_sigma = token_sigma.min(1).values\n        if sigma is None:\n            sigma = self.flow.sample(future.shape[0], device=future.device, generator=generator)\n        if sigma.shape != (future.shape[0],) or not torch.isfinite(sigma).all() or ((sigma \u003c 0) | (sigma \u003e 1)).any():\n            raise ValueError(\"sigma must be finite [B] values in [0,1]\")\n        sigma = sigma.to(device=future.device, dtype=torch.float32)\n        if future_noise is None:\n            future_noise = torch.randn(future.shape, device=future.device, dtype=future.dtype, generator=generator)\n        if action_noise is None:\n            action_noise = torch.randn(action_tokens.shape, device=future.device, dtype=future.dtype, generator=generator)\n        x_sigma = sigma if token_sigma is None else token_sigma[:, :future.shape[1]]\n        u_sigma = sigma if token_sigma is None else token_sigma[:, future.shape[1]:]\n        x, velocity_x = self.flow.perturb(future, future_noise, x_sigma)\n        u, velocity_u = self.flow.perturb(action_tokens, action_noise, u_sigma)\n        if representation_only:\n            if representation_layer is None:\n                raise ValueError(\"representation_only requires representation_layer\")\n            _, _, features = self._velocity(batch, x, u, sigma, condition_drop_mask=drop_mask,\n                                             token_sigma=token_sigma, representation_layer=representation_layer)\n            return {\"features\": features}\n        if self.self_flow_variant:\n            prediction_x, prediction_u, features = self._velocity(\n                batch, x, u, sigma, condition_drop_mask=drop_mask, token_sigma=token_sigma,\n                representation_layer=self.self_flow_student_layer,\n            )\n        else:\n            prediction_x, prediction_u = self._velocity(batch, x, u, sigma, condition_drop_mask=drop_mask)\n        valid_token_coordinates = (self.codec.coordinate_validity(valid_dimensions) \u0026 valid_steps[..., None]).to(future.device)\n        if token_sigma is None:\n            per_video = masked_sample_mse(prediction_x, velocity_x)\n            per_action = masked_sample_mse(prediction_u, velocity_u, valid_token_coordinates)\n            weight = self.flow.weight(sigma)\n            loss_video, loss_action = (weight * per_video).mean(), (weight * per_action).mean()\n        else:\n            video_weights, action_weights = self.flow.weight(x_sigma), self.flow.weight(u_sigma)\n            video_weights = torch.where(x_sigma == 0, 0, video_weights)\n            action_weights = torch.where(u_sigma == 0, 0, action_weights)\n            if self.self_flow_variant == 3:\n                multiplier = self.self_flow_pseudo_label_weight if labeling_active else 0\n                action_weights = torch.where(pseudo_mask[:, None], action_weights * multiplier, action_weights)\n            loss_video = weighted_masked_sample_mse(prediction_x, velocity_x, video_weights).mean()\n            loss_action = weighted_masked_sample_mse(prediction_u, velocity_u, action_weights, valid_token_coordinates).mean()\n        result = {\n            \"loss\": self.video_weight * loss_video + self.action_weight * loss_action,\n            \"loss_video\": loss_video, \"loss_action\": loss_action,\n            \"sigma_mean\": sigma.float().mean().detach(),\n        }\n        if self.self_flow_variant:\n            teacher_batch = dict(batch, action=clean_actions)\n            teacher_times = None\n            if self.self_flow_variant == 3 and not labeling_active:\n                teacher_times = teacher_sigma[:, None].expand_as(token_sigma).clone()\n                teacher_times[pseudo_mask, future.shape[1]:] = 1\n            with torch.no_grad():\n                target = teacher(teacher_batch, representation_only=True,\n                                 representation_layer=self.self_flow_teacher_layer, sigma=teacher_sigma,\n                                 future_noise=future_noise, action_noise=action_noise,\n                                 condition_drop_mask=drop_mask, token_sigma=teacher_times)[\"features\"].detach()\n            projected = self.representation_projection(features)\n            if target.shape != projected.shape or not torch.isfinite(target).all():\n                raise ValueError(\"EMA representation shape or values are invalid\")\n            valid_features = torch.ones(projected.shape[:2], device=future.device, dtype=torch.bool)\n            if self.self_flow_variant == 3 and not labeling_active:\n                valid_features[pseudo_mask, future.shape[1]:] = False\n            cosine = F.cosine_similarity(projected.float(), target.float(), dim=-1)\n            loss_representation = 1 - torch.where(valid_features, cosine, 0).sum() / valid_features.sum().clamp_min(1)\n            result[\"loss_representation\"] = loss_representation\n            result[\"loss\"] = result[\"loss\"] + self.self_flow_representation_weight * loss_representation\n            result[\"pseudo_label_fraction\"] = pseudo_mask.float().mean().detach()\n            if self.self_flow_variant == 3:\n                result[\"pseudo_mse\"] = pseudo_mse.detach()\n        return result\n\n    def loss(self, batch: Mapping[str, Any], **kwargs) -\u003e dict[str, Tensor]:\n        return self(batch, **kwargs)\n\n    @torch.no_grad()\n    def sample_actions(\n        self, batch: Mapping[str, Any], *, horizon: int = 16, future_length: int | None = None,\n        steps: int = 20, generator=None, initial_future: Tensor | None = None, initial_action: Tensor | None = None,\n        guidance_scale: float = 1, action_guidance_scale: float | None = None,\n    ) -\u003e dict[str, Tensor]:\n        \"\"\"Generate normalized actions and future latent tokens.\"\"\"\n        reference = batch[\"reference_tokens\"]\n        action_guidance_scale = guidance_scale if action_guidance_scale is None else action_guidance_scale\n        if not all(math.isfinite(value) and value \u003e= 0 for value in (guidance_scale, action_guidance_scale)):\n            raise ValueError(\"Guidance scales must be finite and nonnegative\")\n        if horizon \u003c= 0:\n            raise ValueError(\"horizon must be positive\")\n        if future_length is None:\n            future_length = batch[\"future_ids\"].shape[1] if \"future_ids\" in batch else reference.shape[1]\n        if future_length \u003c= 0:\n            raise ValueError(\"future_length must be positive\")\n        b, _, width = reference.shape\n        x = initial_future\n        if x is None:\n            x = torch.randn((b, future_length, width), device=reference.device, dtype=reference.dtype, generator=generator)\n        u = initial_action\n        if u is None:\n            u = torch.randn((b, horizon, width), device=reference.device, dtype=reference.dtype, generator=generator)\n        if x.shape != (b, future_length, width) or u.shape != (b, horizon, width):\n            raise ValueError(\"Initial latent shapes differ from the requested output\")\n        schedule = self.flow.schedule(steps, device=reference.device)\n        for start, end in pairwise(schedule):\n            vx, vu = self._velocity(batch, x, u, start.expand(b))\n            if guidance_scale != 1 or action_guidance_scale != 1:\n                uncond_x, uncond_u = self._velocity(\n                    batch, x, u, start.expand(b),\n                    condition_drop_mask=torch.ones(b, device=reference.device, dtype=torch.bool),\n                )\n                vx = uncond_x + guidance_scale * (vx - uncond_x)\n                vu = uncond_u + action_guidance_scale * (vu - uncond_u)\n            x, u = x + (end - start) * vx, u + (end - start) * vu\n        return {\"action\": self.codec.decode(u), \"future_tokens\": x}\n\n    @torch.no_grad()\n    def sample_actions_from_future(\n        self, batch: Mapping[str, Any], *, horizon: int = 16, steps: int = 20,\n        generator=None, initial_action: Tensor | None = None,\n    ) -\u003e dict[str, Tensor]:\n        \"\"\"Inverse dynamics: clamp future tokens and generate actions.\"\"\"\n        if self.self_flow_variant \u003c 2:\n            raise ValueError(\"Conditional dynamics sampling requires a structured Self-Flow policy\")\n        future = batch[\"future_tokens\"]\n        if future.ndim != 3 or future.shape[-1] != self.codec.token_dim or horizon \u003c 1:\n            raise ValueError(\"Future tokens must be [B,S,token_dim] and horizon positive\")\n        b, length, width = future.shape\n        actions = initial_action\n        if actions is None:\n            actions = torch.randn((b, horizon, width), device=future.device, dtype=future.dtype, generator=generator)\n        if actions.shape != (b, horizon, width):\n            raise ValueError(\"Initial action token shape differs from requested horizon\")\n        schedule = self.flow.schedule(steps, device=future.device)\n        for start, end in pairwise(schedule):\n            levels = torch.cat((torch.zeros(b, length, device=future.device), start.expand(b, horizon)), 1)\n            _, velocity = self._velocity(batch, future, actions, start.expand(b), token_sigma=levels)\n            actions = actions + (end - start) * velocity\n        return {\"action\": self.codec.decode(actions), \"future_tokens\": future}\n\n    @torch.no_grad()\n    def sample_future_from_actions(\n        self, batch: Mapping[str, Any], *, future_length: int | None = None,\n        steps: int = 20, generator=None, initial_future: Tensor | None = None,\n    ) -\u003e dict[str, Tensor]:\n        \"\"\"Forward dynamics: clamp normalized actions and generate future tokens.\"\"\"\n        if self.self_flow_variant \u003c 2:\n            raise ValueError(\"Conditional dynamics sampling requires a structured Self-Flow policy\")\n        actions = batch[\"action\"]\n        valid, _ = self._padding(batch, actions)\n        action_tokens = self.codec.encode(torch.where(valid, actions, 0)).to(batch[\"reference_tokens\"])\n        if future_length is None:\n            future_length = batch[\"future_ids\"].shape[1] if \"future_ids\" in batch else batch[\"reference_tokens\"].shape[1]\n        if future_length \u003c 1:\n            raise ValueError(\"future_length must be positive\")\n        b, horizon, width = action_tokens.shape\n        future = initial_future\n        if future is None:\n            future = torch.randn((b, future_length, width), device=action_tokens.device, dtype=action_tokens.dtype, generator=generator)\n        if future.shape != (b, future_length, width):\n            raise ValueError(\"Initial future token shape differs from requested layout\")\n        schedule = self.flow.schedule(steps, device=future.device)\n        for start, end in pairwise(schedule):\n            levels = torch.cat((start.expand(b, future_length), torch.zeros(b, horizon, device=future.device)), 1)\n            velocity, _ = self._velocity(batch, future, action_tokens, start.expand(b), token_sigma=levels)\n            future = future + (end - start) * velocity\n        return {\"action\": actions, \"future_tokens\": future}\n\n\ndef make_tiny_policy(\n    *, action_dim: int = 14, proprio_dim: int | None = 14, text_dim: int = 32,\n    token_dim: int = 128, width: int = 64, heads: int = 4, depth: int = 2, **policy_options,\n) -\u003e PatchFlowPolicy:\n    denoiser = SmallJointTransformer(token_dim=token_dim, text_dim=text_dim, width=width, heads=heads, depth=depth)\n    return PatchFlowPolicy(\n        denoiser, action_dim=action_dim, token_dim=token_dim, text_dim=text_dim, proprio_dim=proprio_dim, **policy_options,\n    )\n","sha256":"3a38428eadcfd658229badf5d015de99f9e3c912f24eef71071402a3880a0984"},"src/patchwam/models/flux.py":{"text":"\"\"\"Prefix-masked adapter for external Black Forest Labs FLUX.2 weights.\n\nSupports Klein base 4B/9B at revision 50fe5162777813d869182b139e83b10743caef15.\nNative weight loading is strict; standard image-generation attention differs.\n\"\"\"\n\nimport hashlib\nimport importlib\nimport sys\nfrom collections.abc import Mapping\nfrom pathlib import Path\nfrom typing import Any\n\nimport torch\nfrom torch import Tensor, nn\nfrom torch.nn import functional as F\nfrom torch.utils.checkpoint import checkpoint\n\nfrom .geometry import flatten_image_latents, raster_coordinates\nfrom .policy import PatchFlowPolicy\n\n\ndef _asset_file_identity(path: Path) -\u003e dict[str, Any]:\n    path = path.resolve()\n    stat = path.stat()\n    identity = {\"path\": str(path), \"size\": stat.st_size, \"mtime_ns\": stat.st_mtime_ns}\n    # Use metadata for large weights to avoid rereading gigabytes.\n    if stat.st_size \u003c= 8 * 1024 * 1024 and path.suffix not in {\".safetensors\", \".bin\", \".pt\"}:\n        identity[\"sha256\"] = hashlib.sha256(path.read_bytes()).hexdigest()\n    return identity\n\n\ndef _asset_identity(transformer_path, autoencoder_path, text_encoder_path, modules) -\u003e dict[str, Any]:\n    text_root = Path(text_encoder_path)\n    text_files = sorted(path for path in text_root.rglob(\"*\") if path.is_file() and\n                        not any(part.startswith(\".\") for part in path.relative_to(text_root).parts))\n    if not text_files:\n        raise ValueError(\"The local text encoder directory contains no model assets\")\n    return {\n        \"transformer\": _asset_file_identity(Path(transformer_path)),\n        \"autoencoder\": _asset_file_identity(Path(autoencoder_path)),\n        \"text_encoder\": [_asset_file_identity(path) for path in text_files],\n        \"source\": [_asset_file_identity(Path(module.__file__)) for module in modules],\n    }\n\n\nclass OfficialFluxDenoiser(nn.Module):\n    \"\"\"Masked execution with unchanged official parameter names.\"\"\"\n\n    def __init__(self, transformer: nn.Module, *, gradient_checkpointing: bool = False):\n        super().__init__()\n        model_api = importlib.import_module(\"flux2.model\")\n        self._rotate = model_api.apply_rope\n        self._embed_time = model_api.timestep_embedding\n        required = (\n            \"img_in\", \"txt_in\", \"time_in\", \"pe_embedder\", \"double_blocks\", \"single_blocks\",\n            \"double_stream_modulation_img\", \"double_stream_modulation_txt\",\n            \"single_stream_modulation\", \"final_layer\",\n        )\n        missing = [name for name in required if not hasattr(transformer, name)]\n        if missing or getattr(transformer, \"use_guidance_embed\", False):\n            raise ValueError(f\"Expected the official Klein base layer contract; missing={missing}\")\n        self.transformer = transformer\n        self.gradient_checkpointing = gradient_checkpointing\n        self.representation_dim = transformer.hidden_size\n        self.representation_layers = len(transformer.double_blocks) + len(transformer.single_blocks)\n\n    @staticmethod\n    def _split_qkv_heads(projected: Tensor, count: int) -\u003e tuple[Tensor, Tensor, Tensor]:\n        return tuple(projected.unflatten(-1, (3, count, -1)).permute(2, 0, 3, 1, 4).unbind(0))\n\n    def _attend(self, query: Tensor, key: Tensor, value: Tensor, position: Tensor, visibility: Tensor) -\u003e Tensor:\n        query, key = self._rotate(query, key, position)\n        result = F.scaled_dot_product_attention(query, key, value, attn_mask=visibility)\n        return result.transpose(1, 2).flatten(-2)\n\n    def _paired_block(self, block, text, image, modulation_text, modulation_image, position, visibility):\n        ports = ((\"txt\", text, modulation_text), (\"img\", image, modulation_image))\n        projections = []\n        for name, states, (attention_mod, _) in ports:\n            shift, scale, _ = attention_mod\n            normalized = getattr(block, name + \"_norm1\")(states)\n            attention = getattr(block, name + \"_attn\")\n            q, k, v = self._split_qkv_heads(attention.qkv(normalized * (1 + scale) + shift), block.num_heads)\n            q, k = attention.norm(q, k, v)\n            projections.append((q, k, v))\n        q, k, v = (torch.cat(parts, dim=2) for parts in zip(*projections))\n        mixed = self._attend(q, k, v, position, visibility)\n        outputs = []\n        for (name, states, (attention_mod, mlp_mod)), update in zip(ports, mixed.split((text.shape[1], image.shape[1]), 1)):\n            states = states + attention_mod[2] * getattr(block, name + \"_attn\").proj(update)\n            shift, scale, gate = mlp_mod\n            normalized = getattr(block, name + \"_norm2\")(states)\n            outputs.append(states + gate * getattr(block, name + \"_mlp\")(normalized * (1 + scale) + shift))\n        return tuple(outputs)\n\n    def _unified_block(self, block, states, modulation, position, visibility):\n        shift, scale, gate = modulation\n        projected = block.linear1(block.pre_norm(states) * (1 + scale) + shift)\n        attention_input, feedforward_input = projected.split(\n            (3 * block.hidden_size, block.mlp_hidden_dim * block.mlp_mult_factor), dim=-1,\n        )\n        q, k, v = self._split_qkv_heads(attention_input, block.num_heads)\n        q, k = block.norm(q, k, v)\n        attended = self._attend(q, k, v, position, visibility)\n        joint_update = torch.cat((attended, block.mlp_act(feedforward_input)), -1)\n        return states + gate * block.linear2(joint_update)\n\n    def forward(\n        self, reference: Tensor, noisy: Tensor, sigma: Tensor, context: Tensor,\n        *, reference_ids: Tensor, noisy_ids: Tensor, context_ids: Tensor, visibility: Tensor,\n        token_sigma: Tensor | None = None, representation_layer: int | None = None,\n    ) -\u003e Tensor | tuple[Tensor, Tensor]:\n        if representation_layer is not None and not 1 \u003c= representation_layer \u003c= self.representation_layers:\n            raise ValueError(\"representation_layer must be a 1-based transformer layer\")\n        core = self.transformer\n        images = core.img_in(torch.cat((reference, noisy), 1))\n        text = core.txt_in(context)\n        # The official embedding scales sigma by 1000.\n        time = core.time_in(self._embed_time(sigma.to(images), 256))\n        image_time = single_time = final_time = time\n        if token_sigma is not None:\n            if token_sigma.shape != noisy.shape[:2]:\n                raise ValueError(\"token_sigma must match the noisy token shape [B,N]\")\n            generated_time = core.time_in(self._embed_time(token_sigma.to(images).flatten(), 256)).reshape(*token_sigma.shape, -1)\n            image_time = torch.cat((time[:, None].expand(-1, reference.shape[1], -1), generated_time), 1)\n            single_time = torch.cat((time[:, None].expand(-1, text.shape[1], -1), image_time), 1)\n            final_time = generated_time\n        text_mod = core.double_stream_modulation_txt(time)\n        image_mod = core.double_stream_modulation_img(image_time)\n        single_mod, _ = core.single_stream_modulation(single_time)\n        image_positions = core.pe_embedder(torch.cat((reference_ids, noisy_ids), 1))\n        text_positions = core.pe_embedder(context_ids)\n        position = torch.cat((text_positions, image_positions), dim=2)\n        checkpointed = self.gradient_checkpointing and self.training and torch.is_grad_enabled()\n        features = None\n        for index, block in enumerate(core.double_blocks, 1):\n            # Bind this layer for checkpoint recomputation.\n            def execute(t, i, block=block):\n                return self._paired_block(block, t, i, text_mod, image_mod, position, visibility)\n\n            text, images = checkpoint(execute, text, images, use_reentrant=False) if checkpointed else execute(text, images)\n            if index == representation_layer:\n                features = images[:, reference.shape[1]:]\n        states = torch.cat((text, images), 1)\n        for index, block in enumerate(core.single_blocks, len(core.double_blocks) + 1):\n            def execute(s, block=block):\n                return self._unified_block(block, s, single_mod, position, visibility)\n\n            states = checkpoint(execute, states, use_reentrant=False) if checkpointed else execute(states)\n            if index == representation_layer:\n                features = states[:, text.shape[1] + reference.shape[1]:]\n        generated = states[:, text.shape[1] + reference.shape[1]:]\n        velocity = core.final_layer(generated, final_time)\n        return velocity if representation_layer is None else (velocity, features)\n\n\nclass FluxAssetPolicy(nn.Module):\n    \"\"\"Frozen image encoders and optional trainable VL adapters.\n\n    Train video: [B,3,2,H,W] current/future RGB in [-1,1]; infer: [B,3,1,H,W]\n    or [B,3,H,W]. Cached text may replace prompts. Decode normalized actions\n    with the training data processor before controller execution.\n    \"\"\"\n\n    def __init__(self, policy: PatchFlowPolicy, autoencoder: nn.Module, text_encoder: nn.Module,\n                 *, history_pool_size: int = 4):\n        super().__init__()\n        self.policy, self.autoencoder, self.text_encoder = policy, autoencoder, text_encoder\n        if history_pool_size \u003c 1:\n            raise ValueError(\"History pooling size must be positive\")\n        self.history_pool_size = int(history_pool_size)\n        self.autoencoder.requires_grad_(False).eval()\n        if not getattr(self.text_encoder, \"requires_images\", False):\n            self.text_encoder.requires_grad_(False).eval()\n\n    def checkpoint_contract(self):\n        contract = getattr(self.text_encoder, \"checkpoint_contract\", None)\n        return {\"history_pool_size\": self.history_pool_size,\n                \"text_encoder\": contract() if callable(contract) else type(self.text_encoder).__qualname__}\n\n    def train(self, mode: bool = True):\n        super().train(mode)\n        self.autoencoder.eval()\n        if getattr(self.text_encoder, \"requires_images\", False):\n            self.text_encoder.train(mode)\n        else:\n            self.text_encoder.eval()\n        return self\n\n    def _encode(self, batch: Mapping[str, Any], *, target: bool) -\u003e dict[str, Any]:\n        cache_formats = batch.get(\"text_cache_format\")\n        if cache_formats is not None:\n            cache_formats = [cache_formats] if isinstance(cache_formats, str) else cache_formats\n            if getattr(self.text_encoder, \"requires_images\", False):\n                raise ValueError(\"VL conditioning requires current/past images rather than a text-only cache\")\n            if any(value != \"qwen3_flux2\" for value in cache_formats) or \"text_tokens\" not in batch:\n                raise ValueError(\"This policy requires a native Qwen3 FLUX.2 text cache\")\n        result = dict(batch)\n        if \"reference_tokens\" in batch:\n            current = batch[\"reference_tokens\"]\n            if current.ndim != 3:\n                raise ValueError(\"reference_tokens must be [B,R,token_dim]\")\n            parameter = next(self.policy.parameters(), None)\n            current = current if parameter is None else current.to(parameter)\n            result[\"reference_tokens\"] = current\n            b = current.shape[0]\n            channels = current.shape[-1]\n            if target and \"future_tokens\" not in batch:\n                raise ValueError(\"Cached training observations require future_tokens\")\n            if \"future_tokens\" in batch:\n                result[\"future_tokens\"] = batch[\"future_tokens\"].to(current)\n            for name in (\"reference_ids\", \"future_ids\"):\n                if name in batch:\n                    result[name] = batch[name].to(device=current.device)\n        else:\n            video = batch.get(\"camera_video\", batch.get(\"video\"))\n            if video is None:\n                raise KeyError(\"A video or separate camera_video observation is required\")\n            if video.ndim == 4:\n                video = video.unsqueeze(2)\n            if video.ndim == 5:\n                video = video.unsqueeze(1)\n            if video.ndim != 6 or video.shape[2] != 3 or video.shape[3] \u003c (2 if target else 1):\n                raise ValueError(\"Observation video must be [B,V,3,T,H,W], with T\u003e=2 for training\")\n            b, views = video.shape[:2]\n            if not 1 \u003c= views \u003c= 10:\n                raise ValueError(\"Separate camera observations support one to ten views\")\n            encoder_parameter = next(self.autoencoder.parameters())\n            with torch.no_grad():\n                current = self.autoencoder.encode(video[:, :, :, 0].flatten(0, 1).to(encoder_parameter))\n            _, channels, height, width = current.shape\n            if channels != self.policy.codec.token_dim:\n                raise ValueError(\"Official AE must produce already packed 128-channel latents\")\n            result[\"reference_tokens\"] = flatten_image_latents(current).reshape(b, views * height * width, channels)\n            result[\"reference_ids\"] = torch.cat([raster_coordinates(b, height, width, group=10 + view, device=current.device) for view in range(views)], 1)\n            result[\"future_ids\"] = torch.cat([raster_coordinates(b, height, width, group=view, device=current.device) for view in range(views)], 1)\n            if target:\n                with torch.no_grad():\n                    future = self.autoencoder.encode(video[:, :, :, -1].flatten(0, 1).to(encoder_parameter))\n                if future.shape != current.shape:\n                    raise ValueError(\"Current and future raster shapes differ\")\n                result[\"future_tokens\"] = flatten_image_latents(future).reshape(b, views * height * width, channels)\n        history = batch.get(\"history_video\")\n        if history is not None:\n            if history.ndim != 5 or history.shape[0] != b or history.shape[2] != 3:\n                raise ValueError(\"World-model history must be [B,K,3,H,W]\")\n            valid = batch.get(\"history_valid\")\n            if valid is None or valid.shape != history.shape[:2]:\n                raise ValueError(\"History observations require an explicit [B,K] validity mask\")\n            if history.shape[1]:\n                if \"reference_ids\" not in result:\n                    raise ValueError(\"Cached observations need raster reference_ids before adding history\")\n                valid = valid.to(device=current.device, dtype=torch.bool)\n                safe_history = torch.where(valid[..., None, None, None].to(history.device), history, 0)\n                with torch.no_grad():\n                    encoded_history = self.autoencoder.encode(safe_history.flatten(0, 1).to(next(self.autoencoder.parameters())))\n                    pooled = F.adaptive_avg_pool2d(encoded_history, (self.history_pool_size,) * 2)\n                history_tokens = flatten_image_latents(pooled).reshape(b, history.shape[1] * self.history_pool_size**2, channels)\n                token_valid = valid.repeat_interleave(self.history_pool_size**2, dim=1)\n                history_tokens = history_tokens.masked_fill(~token_valid[..., None], 0)\n                history_ids = torch.cat([raster_coordinates(b, self.history_pool_size, self.history_pool_size, group=-(slot + 1), device=current.device) for slot in range(history.shape[1])], 1)\n                reference_valid = result.get(\"reference_valid\", torch.ones(result[\"reference_tokens\"].shape[:2], dtype=torch.bool, device=current.device))\n                result[\"reference_valid\"] = torch.cat((reference_valid.to(current.device), token_valid), 1)\n                result[\"reference_tokens\"] = torch.cat((result[\"reference_tokens\"], history_tokens.to(result[\"reference_tokens\"])), 1)\n                result[\"reference_ids\"] = torch.cat((result[\"reference_ids\"], history_ids), 1)\n        # Pooled history is context; predict only the current raster.\n        if \"future_ids\" in result:\n            result[\"sampling_future_length\"] = result[\"future_ids\"].shape[1]\n        text = batch.get(\"text_tokens\")\n        if text is None:\n            prompt = batch.get(\"prompt\")\n            if not isinstance(prompt, (list, tuple)) or len(prompt) != b:\n                raise ValueError(\"prompt must contain one instruction per sample\")\n            if getattr(self.text_encoder, \"requires_images\", False):\n                vl_current = batch.get(\"vl_current\")\n                if vl_current is None:\n                    raise ValueError(\"VL conditioning requires an unaugmented vl_current observation\")\n                encoded = self.text_encoder(\n                    list(prompt), current=vl_current, history=batch.get(\"vl_history\"),\n                    history_valid=batch.get(\"vl_history_valid\"),\n                    subtasks=batch.get(\"subtask\") if target else None,\n                )\n            else:\n                encoded = self.text_encoder(list(prompt))\n            if isinstance(encoded, tuple):\n                text, result[\"text_valid\"] = encoded\n            elif isinstance(encoded, Mapping):\n                text = encoded[\"text_tokens\"]\n                result[\"text_valid\"] = encoded[\"text_valid\"]\n                if \"auxiliary_loss\" in encoded:\n                    result[\"language_auxiliary_loss\"] = encoded[\"auxiliary_loss\"]\n            else:\n                text = encoded\n        elif getattr(self.text_encoder, \"trainable_adapters\", False):\n            raise ValueError(\"Trainable VL adapters cannot be bypassed with cached text features\")\n        result[\"text_tokens\"] = text.to(current)\n        if result[\"text_tokens\"].ndim != 3 or result[\"text_tokens\"].shape[0] != b or result[\"text_tokens\"].shape[-1] != self.policy.text_dim:\n            raise ValueError(f\"text_tokens must be [B,L,{self.policy.text_dim}]\")\n        if \"text_valid\" in result:\n            result[\"text_valid\"] = result[\"text_valid\"].to(device=current.device, dtype=torch.bool)\n        return result\n\n    def forward(self, batch: Mapping[str, Any], **kwargs) -\u003e dict[str, Tensor]:\n        encoded = self._encode(batch, target=True)\n        result = self.policy(encoded, **kwargs)\n        if \"language_auxiliary_loss\" in encoded and \"loss\" in result:\n            result[\"loss_subtask\"] = encoded[\"language_auxiliary_loss\"]\n            result[\"loss\"] = result[\"loss\"] + self.text_encoder.auxiliary_weight * result[\"loss_subtask\"]\n        return result\n\n    def loss(self, batch: Mapping[str, Any], **kwargs) -\u003e dict[str, Tensor]:\n        return self(batch, **kwargs)\n\n    @torch.no_grad()\n    def sample_actions(self, batch: Mapping[str, Any], **kwargs) -\u003e dict[str, Tensor]:\n        encoded = self._encode(batch, target=False)\n        kwargs.setdefault(\"future_length\", encoded.get(\"sampling_future_length\"))\n        return self.policy.sample_actions(encoded, **kwargs)\n\n    @torch.no_grad()\n    def sample_actions_from_future(self, batch: Mapping[str, Any], **kwargs) -\u003e dict[str, Tensor]:\n        encoded = self._encode({key: value for key, value in batch.items() if key != \"subtask\"}, target=True)\n        return self.policy.sample_actions_from_future(encoded, **kwargs)\n\n    @torch.no_grad()\n    def sample_future_from_actions(self, batch: Mapping[str, Any], **kwargs) -\u003e dict[str, Tensor]:\n        encoded = self._encode(batch, target=False)\n        kwargs.setdefault(\"future_length\", encoded.get(\"sampling_future_length\"))\n        return self.policy.sample_future_from_actions(encoded, **kwargs)\n\n    @classmethod\n    def from_local_assets(\n        cls, transformer_path: str, autoencoder_path: str, text_encoder_path: str,\n        *, action_dim: int = 14, proprio_dim: int | None = 14, variant: str = \"klein-base-4b\",\n        flux_source: str | None = None, device: str = \"cuda\", dtype: str = \"bfloat16\",\n        context_length: int = 128, gradient_checkpointing: bool = False,\n        shift: float = 5, video_weight: float = 0.5, action_weight: float = 1,\n        action_scale: float = 1, isolate_actions: bool = False, text_encoder_kind: str = \"qwen3\",\n        history_pool_size: int = 4, vl_trainable_adapters: bool = False,\n        vl_lora_rank: int = 64, vl_lora_alpha: float = 128, vl_lora_dropout: float = 0.05,\n        vl_instruction_layers=(9, 18, 27), vl_summary_layers=(18, 27, 36),\n        vl_history_pool_size: int = 4, vl_image_size: int = 448,\n        vl_auxiliary_weight: float = 0.1, vl_label_smoothing: float = 0.1,\n        vl_require_subtasks: bool = False, vl_gradient_checkpointing: bool = True,\n        **policy_options,\n    ) -\u003e \"FluxAssetPolicy\":\n        \"\"\"Load local assets without downloads or remote code.\"\"\"\n        if variant not in {\"klein-base-4b\", \"klein-base-9b\"}:\n            raise ValueError(\"variant must be klein-base-4b or klein-base-9b\")\n        if dtype not in {\"float32\", \"float16\", \"bfloat16\"}:\n            raise ValueError(\"Unsupported torch dtype\")\n        if context_length \u003c= 0:\n            raise ValueError(\"context_length must be positive\")\n        for path in (transformer_path, autoencoder_path):\n            if not Path(path).is_file():\n                raise FileNotFoundError(path)\n        if not Path(text_encoder_path).is_dir():\n            raise FileNotFoundError(\"text_encoder_path must be a local Hugging Face model directory\")\n        package_root = None\n        if flux_source is not None:\n            package_root = Path(flux_source).expanduser().resolve() / \"src\"\n            if not (package_root / \"flux2\" / \"model.py\").is_file():\n                raise FileNotFoundError(\"flux_source must be the official FLUX.2 repository root\")\n            sys.path.insert(0, str(package_root))\n        try:\n            model_api = importlib.import_module(\"flux2.model\")\n            ae_api = importlib.import_module(\"flux2.autoencoder\")\n            text_api = importlib.import_module(\"flux2.text_encoder\")\n        except ImportError as exc:\n            raise ImportError(\"Install the official black-forest-labs/flux2 package or supply flux_source\") from exc\n        if package_root is not None and any(\n            not Path(module.__file__).resolve().is_relative_to(package_root / \"flux2\")\n            for module in (model_api, ae_api, text_api)\n        ):\n            raise RuntimeError(\"Another FLUX.2 source is already imported; start a fresh process for flux_source\")\n        from safetensors.torch import load_file\n\n        asset_signature = _asset_identity(transformer_path, autoencoder_path, text_encoder_path,\n                                          (model_api, ae_api, text_api))\n        precision = getattr(torch, dtype)\n        config = model_api.Klein4BParams() if variant.endswith(\"4b\") else model_api.Klein9BParams()\n        with torch.device(\"meta\"):\n            transformer = model_api.Flux2(config).to(dtype=precision)\n            autoencoder = ae_api.AutoEncoder(ae_api.AutoEncoderParams()).to(dtype=precision)\n        transformer.load_state_dict(load_file(transformer_path, device=device), strict=True, assign=True)\n        autoencoder.load_state_dict(load_file(autoencoder_path, device=device), strict=True, assign=True)\n        transformer, autoencoder = transformer.to(device=device, dtype=precision), autoencoder.to(device=device, dtype=precision)\n        if text_encoder_kind == \"qwen3\":\n            text_encoder = LocalInstructionEncoder(text_encoder_path, context_length=context_length, dtype=precision).to(device)\n        elif text_encoder_kind == \"qwen3_vl\":\n            from .vision_language import VisualInstructionEncoder\n            text_encoder = VisualInstructionEncoder(\n                text_encoder_path, dtype=precision, trainable_adapters=vl_trainable_adapters,\n                lora_rank=vl_lora_rank, lora_alpha=vl_lora_alpha, lora_dropout=vl_lora_dropout,\n                instruction_layers=vl_instruction_layers, summary_layers=vl_summary_layers,\n                history_pool_size=vl_history_pool_size, image_size=vl_image_size,\n                auxiliary_weight=vl_auxiliary_weight, label_smoothing=vl_label_smoothing,\n                require_subtasks=vl_require_subtasks,\n                gradient_checkpointing=vl_gradient_checkpointing,\n            ).to(device)\n        else:\n            raise ValueError(\"text_encoder_kind must be qwen3 or qwen3_vl\")\n        if text_encoder.feature_dim != config.context_in_dim:\n            raise ValueError(f\"The text encoder provides {text_encoder.feature_dim} features; {variant} requires {config.context_in_dim}\")\n        denoiser = OfficialFluxDenoiser(transformer, gradient_checkpointing=gradient_checkpointing)\n        policy = PatchFlowPolicy(\n            denoiser, action_dim=action_dim, text_dim=config.context_in_dim, proprio_dim=proprio_dim,\n            action_scale=action_scale, shift=shift, video_weight=video_weight, action_weight=action_weight,\n            isolate_actions=isolate_actions,\n            **policy_options,\n        ).to(device=device, dtype=precision)\n        if asset_signature != _asset_identity(transformer_path, autoencoder_path, text_encoder_path,\n                                              (model_api, ae_api, text_api)):\n            raise RuntimeError(\"Local model assets changed while they were being loaded\")\n        result = cls(policy, autoencoder, text_encoder, history_pool_size=history_pool_size)\n        result.asset_signature = asset_signature\n        return result\n\n\nclass LocalInstructionEncoder(nn.Module):\n    \"\"\"Local Qwen3 embeddings using official FLUX.2 readout layers.\"\"\"\n\n    def __init__(self, model_path: str, *, context_length: int = 128, dtype=torch.bfloat16):\n        super().__init__()\n        from transformers import AutoModelForCausalLM, AutoTokenizer\n\n        self.tokenizer = AutoTokenizer.from_pretrained(model_path, local_files_only=True, trust_remote_code=False)\n        self.encoder = AutoModelForCausalLM.from_pretrained(\n            model_path, torch_dtype=dtype, local_files_only=True, trust_remote_code=False,\n        )\n        # Use the external package's readout layers.\n        self.layers = tuple(importlib.import_module(\"flux2.text_encoder\").OUTPUT_LAYERS_QWEN3)\n        if not self.layers or min(self.layers) \u003c 0 or max(self.layers) \u003e self.encoder.config.num_hidden_layers:\n            raise ValueError(\"The text encoder does not provide the required hidden-state layers\")\n        self.feature_dim = self.encoder.config.hidden_size * len(self.layers)\n        self.context_length = context_length\n\n    def checkpoint_contract(self):\n        return {\"kind\": \"qwen3_text\", \"layers\": self.layers, \"context_length\": self.context_length}\n\n    @torch.no_grad()\n    def forward(self, prompts: list[str]) -\u003e tuple[Tensor, Tensor]:\n        messages = [[{\"role\": \"user\", \"content\": prompt}] for prompt in prompts]\n        formatted = self.tokenizer.apply_chat_template(\n            messages, tokenize=False, add_generation_prompt=True, enable_thinking=False,\n        )\n        inputs = self.tokenizer(\n            formatted, padding=\"max_length\", truncation=True,\n            max_length=self.context_length, return_tensors=\"pt\",\n        ).to(next(self.encoder.parameters()).device)\n        outputs = self.encoder(**inputs, output_hidden_states=True, use_cache=False)\n        features = torch.cat([outputs.hidden_states[index] for index in self.layers], dim=-1)\n        return features, inputs[\"attention_mask\"].bool()\n","sha256":"6070c6823f1c6103f0994ec90d62e905d651ccec49b36d1286ad914045b8ab85"},"src/patchwam/models/geometry.py":{"text":"\"\"\"Token layouts and visibility for the joint world/action prediction.\"\"\"\n\nimport torch\nfrom torch import Tensor\n\n\ndef raster_coordinates(batch: int, height: int, width: int, *, group: float, device=None) -\u003e Tensor:\n    rows, columns = torch.meshgrid(\n        torch.arange(height, device=device), torch.arange(width, device=device), indexing=\"ij\",\n    )\n    coordinates = torch.zeros(height * width, 4, device=device, dtype=torch.float32)\n    coordinates[:, 0] = group\n    coordinates[:, 1] = rows.flatten()\n    coordinates[:, 2] = columns.flatten()\n    return coordinates.unsqueeze(0).expand(batch, -1, -1)\n\n\ndef sequence_coordinates(batch: int, length: int, *, group: float = 0, device=None) -\u003e Tensor:\n    coordinates = torch.zeros(batch, length, 4, device=device, dtype=torch.float32)\n    coordinates[..., 0] = group\n    coordinates[..., 3] = torch.arange(length, device=device)\n    return coordinates\n\n\ndef joint_visibility(\n    text_length: int, reference_length: int, future_length: int, horizon: int,\n    *, text_valid: Tensor | None = None, reference_valid: Tensor | None = None,\n    isolate_actions: bool = False, device=None,\n) -\u003e Tensor:\n    \"\"\"SDPA mask: True permits attention; invalid keys are hidden.\n\n    Layout: [text + state, reference | future, action]. Prefix sees only prefix.\n    \"\"\"\n    lengths = (text_length, reference_length, future_length, horizon)\n    if min(lengths) \u003c 0 or text_length + reference_length == 0:\n        raise ValueError(\"Nonnegative lengths and a nonempty prefix are required\")\n    prefix = text_length + reference_length\n    total = prefix + future_length + horizon\n    allowed = torch.ones(total, total, device=device, dtype=torch.bool)\n    allowed[:prefix, prefix:] = False\n    if isolate_actions:\n        action_start = prefix + future_length\n        allowed[prefix:action_start, action_start:] = False\n        allowed[action_start:, prefix:action_start] = False\n    if text_valid is None and reference_valid is None:\n        return allowed[None, None]\n    if text_valid is not None and (text_valid.ndim != 2 or text_valid.shape[1] != text_length):\n        raise ValueError(\"text_valid must have shape [batch, text_length]\")\n    if reference_valid is not None and (reference_valid.ndim != 2 or reference_valid.shape[1] != reference_length):\n        raise ValueError(\"reference_valid must have shape [batch, reference_length]\")\n    batch = (text_valid if text_valid is not None else reference_valid).shape[0]\n    if text_valid is not None and reference_valid is not None and text_valid.shape[0] != reference_valid.shape[0]:\n        raise ValueError(\"Text and reference valid-mask batch sizes differ\")\n    allowed = allowed[None, None].expand(batch, 1, total, total).clone()\n    if text_valid is not None:\n        allowed[..., :text_length] \u0026= text_valid[:, None, None].to(device=allowed.device, dtype=torch.bool)\n    if reference_valid is not None:\n        allowed[..., text_length:prefix] \u0026= reference_valid[:, None, None].to(device=allowed.device, dtype=torch.bool)\n    return allowed\n\n\ndef flatten_image_latents(latents: Tensor) -\u003e Tensor:\n    \"\"\"Flatten packed FLUX.2 latents [B,128,H,W] to [B,H*W,128].\"\"\"\n    if latents.ndim != 4:\n        raise ValueError(\"Expected [batch, channels, height, width]\")\n    return latents.flatten(2).transpose(1, 2)\n\n\ndef restore_image_latents(tokens: Tensor, height: int, width: int) -\u003e Tensor:\n    if tokens.ndim != 3 or tokens.shape[1] != height * width:\n        raise ValueError(\"Token count does not match the requested raster\")\n    return tokens.transpose(1, 2).reshape(tokens.shape[0], tokens.shape[2], height, width)\n","sha256":"f4c77b743fa4f08de4c21b3dd649e70dddcff82e498508a2bb76975787bf387a"},"src/patchwam/models/codec.py":{"text":"\"\"\"Parameter-free action coordinates in the visual token space.\"\"\"\n\nimport math\nfrom dataclasses import dataclass\n\nimport torch\nfrom torch import Tensor\n\n\n@dataclass(frozen=True)\nclass RepeatedActionCodec:\n    \"\"\"Repeat normalized actions into tokens; decode by group averaging.\n\n    The data processor handles normalization; the codec has no learned weights.\n    \"\"\"\n\n    action_dim: int\n    token_dim: int = 128\n    scale: float = 1.0\n\n    def __post_init__(self):\n        if not 0 \u003c self.action_dim \u003c= self.token_dim:\n            raise ValueError(\"action_dim must be positive and no greater than token_dim\")\n        if not math.isfinite(self.scale) or self.scale \u003c= 0:\n            raise ValueError(\"scale must be finite and positive\")\n\n    @property\n    def copies(self) -\u003e int:\n        return self.token_dim // self.action_dim\n\n    @property\n    def occupied(self) -\u003e int:\n        return self.action_dim * self.copies\n\n    def encode(self, actions: Tensor) -\u003e Tensor:\n        if actions.shape[-1] != self.action_dim:\n            raise ValueError(f\"Expected {self.action_dim} action coordinates\")\n        expanded = actions.unsqueeze(-1).expand(*actions.shape, self.copies)\n        result = actions.new_zeros(*actions.shape[:-1], self.token_dim)\n        result[..., :self.occupied] = expanded.flatten(-2) * self.scale\n        return result\n\n    def decode(self, tokens: Tensor) -\u003e Tensor:\n        if tokens.shape[-1] != self.token_dim:\n            raise ValueError(f\"Expected {self.token_dim} token coordinates\")\n        groups = tokens[..., :self.occupied].unflatten(-1, (self.action_dim, self.copies))\n        return groups.mean(-1) / self.scale\n\n    def coordinate_validity(self, valid_dimensions: Tensor) -\u003e Tensor:\n        \"\"\"Expand valid dimensions; keep fill coordinates supervised.\"\"\"\n        if valid_dimensions.shape[-1] != self.action_dim:\n            raise ValueError(\"Dimension mask does not match action_dim\")\n        result = torch.ones(\n            *valid_dimensions.shape[:-1], self.token_dim,\n            device=valid_dimensions.device, dtype=torch.bool,\n        )\n        result[..., :self.occupied] = valid_dimensions.bool().unsqueeze(-1).expand(\n            *valid_dimensions.shape, self.copies,\n        ).flatten(-2)\n        return result\n","sha256":"1eb10adfaf423c8084a53d911ab399e44e95b07d2a7cb7fe691b1ef6d977bc16"},"src/patchwam/models/flow.py":{"text":"\"\"\"Continuous rectified-flow training and the descending Euler schedule.\"\"\"\n\nimport math\n\nimport torch\nfrom torch import Tensor\n\n\nclass ShiftedFlow:\n    \"\"\"Shifted flow schedule and weights in sigma units [0,1].\"\"\"\n\n    def __init__(self, shift: float = 5.0, *, quadrature_points: int = 16384, normalization: str = \"continuous\"):\n        if not math.isfinite(shift) or shift \u003c= 0:\n            raise ValueError(\"shift must be finite and positive\")\n        if quadrature_points \u003c 2:\n            raise ValueError(\"quadrature_points must be at least two\")\n        self.shift = float(shift)\n        if normalization not in (\"continuous\", \"endpoint_1000\"):\n            raise ValueError(\"normalization must be continuous or endpoint_1000\")\n        self.normalization = normalization\n        # Deterministic weight normalization over the sampling distribution.\n        midpoints = (torch.arange(quadrature_points, dtype=torch.float64) + 0.5) / quadrature_points\n        points = torch.arange(1, 1001, dtype=torch.float64) / 1000 if normalization == \"endpoint_1000\" else midpoints\n        self.weight_normalizer = self._raw_weight(self.warp(points)).mean().item()\n\n    def warp(self, uniform_time: Tensor) -\u003e Tensor:\n        return self.shift * uniform_time / (1 + (self.shift - 1) * uniform_time)\n\n    @staticmethod\n    def _raw_weight(sigma: Tensor) -\u003e Tensor:\n        return (torch.exp(-2 * (sigma - 0.5).square()) - math.exp(-0.5)).clamp_min(0)\n\n    def weight(self, sigma: Tensor) -\u003e Tensor:\n        denominator = self.weight_normalizer + (1e-10 if self.normalization == \"endpoint_1000\" else 0)\n        return self._raw_weight(sigma.float()) / denominator\n\n    def sample(self, batch: int, *, device=None, generator=None) -\u003e Tensor:\n        return self.warp(torch.rand(batch, device=device, generator=generator))\n\n    def dual_timesteps(\n        self, batch: int, future_length: int, horizon: int, *, mask_ratio: float = 0.25,\n        structured: bool = False, structure_ratio: float = 0.5, edge_ratio: float = 0.5,\n        device=None, generator=None, first=None, second=None, mask=None, branches=None,\n    ) -\u003e tuple[Tensor, Tensor, Tensor]:\n        \"\"\"Self-Flow Eq. 4: mixed token times and a cleaner teacher time.\n\n        Structured branches mix random masks, modality planes, and clean edges.\n        \"\"\"\n        if not 0 \u003c= mask_ratio \u003c= 0.5 or batch \u003c 1 or min(future_length, horizon) \u003c 1:\n            raise ValueError(\"Dual timesteps require positive sizes and mask_ratio in [0, 0.5]\")\n        first = self.sample(batch, device=device, generator=generator) if first is None else first.to(device)\n        second = self.sample(batch, device=device, generator=generator) if second is None else second.to(device)\n        for value in (first, second):\n            if value.shape != (batch,) or not torch.isfinite(value).all() or ((value \u003c 0) | (value \u003e 1)).any():\n                raise ValueError(\"Both dual timesteps must be finite [B] values in [0,1]\")\n        length = future_length + horizon\n        if not 0 \u003c= structure_ratio \u003c= 1 or not 0 \u003c= edge_ratio \u003c= 1:\n            raise ValueError(\"Structured and edge ratios must be in [0,1]\")\n        if mask is None:\n            mask = torch.rand((batch, length), device=device, generator=generator) \u003c mask_ratio\n        if mask.shape != (batch, length):\n            raise ValueError(\"Dual-timestep mask must be [B, future_length + horizon]\")\n        token_times = torch.where(mask.to(device=device, dtype=torch.bool), second[:, None], first[:, None])\n        if structured:\n            if branches is None:\n                draw = torch.rand(batch, device=device, generator=generator)\n                thresholds = torch.tensor((1 - structure_ratio, 1 - structure_ratio * edge_ratio,\n                                           1 - structure_ratio * edge_ratio / 2), device=device)\n                branches = (draw[:, None] \u003e= thresholds).sum(1)\n            if branches.shape != (batch,) or ((branches \u003c 0) | (branches \u003e 3)).any():\n                raise ValueError(\"Structured branches must be [B] values 0=random, 1=plane, 2=inverse, 3=forward\")\n            branches = branches.to(device=device)\n            plane = torch.cat((first[:, None].expand(-1, future_length), second[:, None].expand(-1, horizon)), 1)\n            token_times = torch.where((branches != 0)[:, None], plane, token_times)\n            token_times[:, :future_length] = torch.where((branches == 2)[:, None], 0, token_times[:, :future_length])\n            token_times[:, future_length:] = torch.where((branches == 3)[:, None], 0, token_times[:, future_length:])\n            return first, token_times, token_times.min(1).values\n        return first, token_times, torch.minimum(first, second)\n\n    def schedule(self, steps: int, *, device=None) -\u003e Tensor:\n        if steps \u003c= 0:\n            raise ValueError(\"steps must be positive\")\n        return self.warp(torch.linspace(1, 0, steps + 1, device=device))\n\n    @staticmethod\n    def perturb(clean: Tensor, noise: Tensor, sigma: Tensor) -\u003e tuple[Tensor, Tensor]:\n        if noise.shape != clean.shape or sigma.shape not in ((clean.shape[0],), clean.shape[:2]):\n            raise ValueError(\"Noise or sigma shape does not match clean samples\")\n        amount = sigma.to(clean).reshape(*sigma.shape, *([1] * (clean.ndim - sigma.ndim)))\n        return torch.lerp(clean, noise, amount), noise - clean\n\n\ndef weighted_masked_sample_mse(prediction: Tensor, target: Tensor, weight: Tensor, valid: Tensor | None = None) -\u003e Tensor:\n    \"\"\"Weighted token MSE, averaged over each sample's valid coordinates.\"\"\"\n    if prediction.shape != target.shape or weight.shape != prediction.shape[:2]:\n        raise ValueError(\"Expected matching [B,N,C] predictions and [B,N] weights\")\n    valid = torch.ones_like(prediction, dtype=torch.bool) if valid is None else torch.broadcast_to(valid.bool(), prediction.shape)\n    difference = torch.where(valid, prediction.float() - target.float(), 0)\n    count = valid.flatten(1).sum(1).clamp_min(1)\n    return (difference.square() * weight.float()[..., None]).flatten(1).sum(1) / count\n\n\ndef masked_sample_mse(prediction: Tensor, target: Tensor, valid: Tensor | None = None) -\u003e Tensor:\n    \"\"\"Per-sample MSE; fully padded samples have zero loss.\"\"\"\n    if prediction.shape != target.shape:\n        raise ValueError(\"Prediction and target shapes must match\")\n    if valid is None:\n        return (prediction.float() - target.float()).square().flatten(1).mean(1)\n    valid = torch.broadcast_to(valid.bool(), prediction.shape)\n    difference = torch.where(valid, prediction.float() - target.float(), 0)\n    count = valid.flatten(1).sum(1).clamp_min(1)\n    return difference.square().flatten(1).sum(1) / count\n","sha256":"3f68d1e9ead6a6767bf790a5f09d1caa8118953dbb0b206559539fdc5a718e85"},"src/patchwam/engine.py":{"text":"\"\"\"Distributed training and checkpoint resume.\"\"\"\n\nimport hashlib\nimport json\nimport math\nimport os\nimport random\nfrom dataclasses import asdict, dataclass\nfrom pathlib import Path\n\nimport numpy as np\nimport torch\nfrom accelerate import Accelerator\nfrom accelerate.utils import DistributedType\nfrom torch.utils.data import DataLoader, Sampler\n\n\n@dataclass\nclass RunSettings:\n    output_dir: str = \"runs/patchwam\"\n    epochs: int = 5\n    max_updates: int | None = None\n    batch_size: int = 4\n    accumulation: int = 2\n    global_batch_size: int | None = None\n    model_config_hash: str | None = None\n    learning_rate: float = 1e-4\n    weight_decay: float = 1e-2\n    betas: tuple[float, float] = (0.9, 0.95)\n    warmup_updates: int | None = None\n    warmup_fraction: float = 0.05\n    minimum_lr_fraction: float = 0.01\n    precision: str = \"bf16\"\n    cpu: bool = False\n    workers: int = 8\n    gradient_clip: float = 1.0\n    checkpoint_every: int = 5000\n    log_every: int = 10\n    seed: int = 42\n    drop_last: bool = True\n    ema_decay: float | None = None\n    ema_warmup_updates: int = 0\n    deterministic: bool = False\n\n    def validate(self):\n        if type(self.deterministic) is not bool:\n            raise ValueError(\"deterministic must be a boolean\")\n        for key in (\"epochs\", \"batch_size\", \"accumulation\", \"checkpoint_every\", \"log_every\"):\n            if getattr(self, key) \u003c 1:\n                raise ValueError(f\"{key} must be positive\")\n        if self.max_updates is not None and self.max_updates \u003c 1:\n            raise ValueError(\"max_updates must be positive\")\n        if (\n            not math.isfinite(self.learning_rate)\n            or self.learning_rate \u003c= 0\n            or self.workers \u003c 0\n            or (self.warmup_updates is not None and self.warmup_updates \u003c 0)\n        ):\n            raise ValueError(\"Invalid optimizer or loader settings\")\n        if any(\n            not math.isfinite(value) or value \u003c 0\n            for value in (self.weight_decay, self.gradient_clip)\n        ):\n            raise ValueError(\"Weight decay and gradient clipping must be finite and nonnegative\")\n        if len(self.betas) != 2 or any(not 0 \u003c= value \u003c 1 for value in self.betas):\n            raise ValueError(\"AdamW betas must be in [0,1)\")\n        if not 0 \u003c= self.warmup_fraction \u003c 1:\n            raise ValueError(\"warmup_fraction must be in [0,1)\")\n        if not 0 \u003c= self.minimum_lr_fraction \u003c= 1:\n            raise ValueError(\"minimum_lr_fraction must be in [0,1]\")\n        if self.ema_decay is not None and (\n            not math.isfinite(self.ema_decay) or not 0 \u003c= self.ema_decay \u003c 1\n        ):\n            raise ValueError(\"EMA decay must be finite and in [0,1)\")\n        if type(self.ema_warmup_updates) is not int or self.ema_warmup_updates \u003c 0:\n            raise ValueError(\"EMA warmup updates must be a nonnegative integer\")\n        if self.ema_decay is None and self.ema_warmup_updates:\n            raise ValueError(\"EMA warmup requires enabled EMA\")\n\n\nclass EpochPermutation(Sampler):\n    \"\"\"Deterministic per-epoch shuffling for resume.\"\"\"\n\n    def __init__(self, dataset, seed: int):\n        self.length, self.seed, self.epoch = len(dataset), seed, 0\n\n    def set_epoch(self, epoch: int):\n        self.epoch = epoch\n\n    def __len__(self):\n        return self.length\n\n    def __iter__(self):\n        generator = torc
