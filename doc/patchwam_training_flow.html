<script type="application/json" id="diagram-data">{"nodes":[{"id":"dataset","title":"示范轨迹 → 训练窗口","subtitle":"LeRobot episode · 当前与未来端点","note":"17个位置 → 2帧图像 + 16步动作；不跨episode。","shapes":["prompt · RGB · action · proprio","H=16 · A=14"],"detail":"作用：把一整段机器人操作示范切成许多个小练习。每个练习告诉模型“现在看到什么、机器人处于什么状态、接下来怎么动、最后画面怎样”，而不要求一次学完整项任务。\n输入：示范轨迹是按时间保存的记录，含相机图像、机器人状态、动作命令和任务指令。动作是要执行的命令，状态是当时实际测到的情况；两者即使都有14个数，也不是同一种信息。\n处理：RoboTwin基础配置每次取编号0至16的17个逻辑位置，只读取位置0和16的图像，保留位置0至15的16步动作。状态先读取17步，随后裁去末步；模型最终只用窗口开始时的状态作为条件。\n举例：若窗口从手刚接近瓶子时开始，输入是这时的画面，训练答案是示范中的后续16步命令和末端画面。末端可能只是手更靠近瓶子，不保证已经完成任务。16步也不等于16秒。\n输出：数据读取器将这些内容交给图像处理、数值归一化和语言编码等支路。多个练习再组成一批，称为batch，数量记为B；批量动作和状态均为[B,16,14]，分别表示B个样本、16个位置、每位置14个数。\n注意：窗口不会跨到另一条示范。越过末尾时复制末尾内容并标记占位；给动作预测计算误差时会忽略无效动作步。RoboTwin还会先去掉部分停顿记录，因此第16个逻辑位置不保证正好是原视频的第16帧之后。","status":"data","branch":"input","x":0,"y":150,"refs":[["src/patchwam/data/episodes.py",349,372],["src/patchwam/data/episodes.py",428,432],["configs/robotwin.yaml",19,38]],"paper":[["p4 · 式1–2；p26 · 附录F",4,"当前条件、未来端点和16步动作块。"]],"caution":"复制末尾只是把长度补齐，不是新示范。动作占位会被屏蔽；当前源码的视觉损失没有使用image_is_pad，所以重复的末端图像仍参与视觉监督。"},{"id":"images","title":"三视图拼接与图像增广","subtitle":"head 在上 · 左 / 右 wrist 在下","note":"同相机的当前/未来用一致变换，RGB映射至[−1,1]。","shapes":["video [B,3,2,288,256]","3 = RGB · 2 = 当前 / 未来"],"detail":"作用：把三个相机的画面整理成模型能读取的一张彩色拼图，并在训练时添加适量外观变化，帮助模型接触不同的画面条件。当前画面与未来答案都经过这条处理支路。\n输入：每个样本来自头部、左腕和右腕三个相机，每路各有当前与未来两帧。RGB表示红、绿、蓝三个颜色通道；原始像素若是0至255的整数，先除以255，变成0至1的小数。\n处理：先调整各路尺寸，再进行数据增广，即随机改变颜色、亮度、裁剪区域或旋转角度等。基础配置有一半概率进入增广。随后把头部画面缩为高192、宽256，左右腕各缩为96×128，并排放到下方。\n举例：若某一路当前帧从左上角裁掉少量区域，未来帧也使用同一次裁剪参数，避免把裁剪变化误当成物体运动。同一路两帧连添加的随机噪声图也相同；不同相机则独立抽取参数。\n输出：每个样本得到高288、宽256的当前和未来两张拼图，像素从[0,1]映射到[−1,1]，再交给把图片转换成内部数字表示的图像编码器。批量形状[B,3,2,288,256]依次表示样本数、RGB通道数、两帧、图高、图宽；这里的3不是三个视角。\n注意：缩放、拼接和增广都是固定程序，没有需要学习的网络参数。此节点展示RoboTwin基础配置；有些扩展让三路相机分别编码，不能把那种输入理解为先拼图再拆开。","status":"fixed","branch":"input","x":0,"y":445,"refs":[["src/patchwam/data/cameras.py",30,56],["src/patchwam/data/augmentation.py",35,77],["src/patchwam/data/processing.py",85,94],["configs/robotwin.yaml",83,108]],"paper":[["p8 · §4.1；p25–26 · 附录E",26,"RoboTwin三视图画布与18×16 latent网格。"]],"caution":"论文写三路相机共享几何和颜色变化；当前源码按相机分别抽参数，只保证同相机的两帧一致。本图依照源码展示。"},{"id":"normalize","title":"状态 / 动作归一化与掩码","subtitle":"z-score · 14维状态 / 14维动作","note":"状态取当前步作为条件；动作保留16步监督。","shapes":["action [B,16,14]","proprio [B,16,14]"],"detail":"作用：把不同数值范围的状态和动作调整到较接近的尺度，并标明哪些位置是真实数据、哪些只是补位，方便模型一起学习这些控制量。这个过程叫归一化，不会把动作变成图片。\n输入：一批示范中的状态与动作，以及预先从训练数据统计的均值和标准差。状态描述机器人当时的情况，动作描述示范给出的命令；RoboTwin每步各有14个数，包含机械臂和夹爪相关控制量，不能简单说成14个关节。\n处理：基础配置对每个分量做z-score，即减去该量的均值，再除以标准差。标准差表示数值通常波动多大。代码给除数加很小的数，随后把结果限制在[−5,5]；超过边界的数压到边界，不继续放大。\n举例：某个量的训练均值为10、标准差为2，原值12就约变为1。补位标记叫mask，是一张有效性规则表；action_is_pad=True表示整步无效，action_dim_is_pad=True表示某个动作分量无效。\n输出：action和proprio均为[B,16,14]，B是一起处理的样本数，16是时间位置，14是每位置的数值数量。动作保留16步送给固定动作编码和训练监督；状态随后只取每个样本的第0步，交给状态投影层。\n注意：统计量和变换规则在训练期间保持固定，不是需要学习的网络参数。无效维度会清零，无效动作步也会在动作编码前清零，标记继续决定哪些动作位置参与误差评分。归一化中的极端值裁剪可能丢信息，因此不能把整条原始动作处理链称为无损。","status":"fixed","branch":"input","x":0,"y":755,"refs":[["src/patchwam/data/processing.py",74,94],["src/patchwam/data/scaling.py",51,74],["src/patchwam/models/policy.py",121,155],["configs/robotwin.yaml",74,82]],"paper":[["p6 · §3.2；p7 · 式12",6,"已归一化动作编码及有效动作监督。"]],"formula":"归一化值 = (原值 − 训练均值) / (训练标准差 + 10⁻⁸)，随后限制到[−5,5]。"},{"id":"qwen","title":"冻结 Qwen3 编码器","subtitle":"指令模板 → token化 → Qwen3","note":"拼接第9 / 18 / 27层特征","shapes":["[B,128,7680]","text_valid [B,128]"],"detail":"作用：把人写的任务要求变成网络能运算的数字表示。例如“用左手拿起绿色瓶子”需要先编码，后面的动作生成网络才能利用其中的指令信息。此处用Qwen3-4B语言模型，4B指约40亿个参数，也就是网络内部可调整的数字；它不直接输出动作。\n输入：每个样本的一条任务指令。数据层先套入“机器人执行以下指令的视频”等固定模板，语言编码器再加上对话格式。token化是把文字拆成模型使用的基本单元，一个token可能是词的一部分，不能简单等同于一个汉字。\n处理：文本统一占128个位置，较短时补位，较长时截断。Qwen3运行后，每一层都会产生中间数字表示；这里取第9、18、27层，在每个文本位置把三层结果接起来，形成7680个数。\n举例：假设加上模板后的文字只占40个有效位置，剩下88个位置只是为了凑齐长度。编码器同时返回text_valid标记，告诉后续模块哪些位置有效；这些补位不应该被当成额外的任务描述读取。\n输出：文本特征形状为[B,128,7680]，分别表示B个样本、128个文本位置、每位置7680个数；有效性标记为[B,128]。这些特征交给条件组装模块，和一个机器人当前状态表示放到一起。\n注意：冻结表示训练PatchWAM时不修改Qwen3的参数，没有可复用的已保存文本特征时，仍需执行编码计算。这里不会生成回答文字，也不把图像送入Qwen3；需要视觉语言模型的扩展属于另一条可选路径。","status":"frozen","branch":"text","x":280,"y":0,"refs":[["src/patchwam/models/flux.py",421,454],["src/patchwam/models/flux.py",173,175],["src/patchwam/models/policy.py",107,120],["external/flux2/text_encoder.py",26,28]],"paper":[["p4 · 语言编码 T(ℓ)",4,""],["p5 · 冻结Qwen3-4B",5,""]]},{"id":"state","title":"状态线性投影","subtitle":"Linear(14 → 7680)","note":"只投影proprio[:,0]，不是16个状态token。","shapes":["[B,14] → [B,1,7680]"],"detail":"作用：把机器人“自己现在处于什么状态”转换成与语言特征同样宽度的数字表示，让后面的共享网络同时参考任务要求和身体状态。它提供条件，不预测下一步动作。\n输入：已经归一化、即按训练统计调整过数值尺度的当前机器人状态。RoboTwin批量状态数据虽然保存为[B,16,14]，此处只取每个样本的第0个时间位置，得到[B,14]。14是状态分量数量，包含机械臂、夹爪等信息，不应全部称为关节。\n处理：使用Linear(14→7680)，即线性层。它用可学习的乘法与加法，将14个输入数重新组合成7680个输出数，再增加一个位置维度。这叫投影，是改变数据表达方式，没有增加新的传感器测量。\n举例：缩小到两个输入数的教学例子，一个输出位置可以计算“2×第一个数−0.5×第二个数+0.1”。真实层同时计算7680种这样的组合，乘数和常数由训练调整，而不是预先指定某个输出一定表示手臂角度。\n输出：得到[B,1,7680]，依次表示B个样本、每个样本1个状态token、每个token含7680个数。token在这里指网络处理信息的一个单元，不是文字。该状态token随后接在全部文本位置之后。\n注意：此层参与训练；图像与动作预测的总误差会通过反向传播，即从总误差往回计算参数怎样影响误差，告诉它怎样调整参数。它只有一个当前状态输入，不产生16个状态token，也不是动作头。动作头指专门把网络结果转换成动作的可学习输出模块，与这里的条件投影用途不同。","status":"trainable","branch":"text","x":280,"y":205,"refs":[["src/patchwam/models/policy.py",58,58],["src/patchwam/models/policy.py",121,133]],"paper":[["p4 · 式4：hₛ = Wₛs",4,""]],"formula":"当前状态[B,14] → 可学习乘加变换 → [B,7680] → 增加一个token位置 → [B,1,7680]。"},{"id":"ae_current","title":"冻结图像 AE · 当前","subtitle":"与未来分支共用同一个AE","note":"18×16网格展平；当前图像保持干净。","shapes":["[B,3,288,256]","x_ref [B,288,128]"],"detail":"作用：把当前看到的彩色画面压成较小的内部数字表示，为动作生成提供场景条件。可以先把结果理解成“画面的数字摘要”，但它不是文字说明，也不能直接当成小图片看。\n输入：当前时刻的多相机拼图，形状为[B,3,288,256]。B是一批样本的数量，3是RGB的红、绿、蓝颜色通道，高288、宽256是拼图尺寸；三个相机已经合并在每张图里，而不是放在颜色通道维。\n处理：调用冻结的图像AE，即训练时不修改它的参数。AE是自编码器，包含将图片压成内部表示的编码部分，以及把表示恢复成图片的解码部分；这里仅用编码部分。它产生的latent即潜变量，是适合后续网络计算的数字表示。\n举例：这套AE输出[B,128,18,16]，可看作18行、16列的内部网格，每位置128个数。将网格按行列展开，就得到18×16=288个token。图像token是编码后的一个信息单元，不是直接从原图裁下的一块像素。\n输出：当前图像表示x_ref为[B,288,128]，表示B张当前图、每图288个位置、每位置128个数。它交给共享Transformer，也就是让不同信息单元交换信息的主要网络，作为预测未来画面与动作时可参考的条件。\n注意：当前分支和未来分支共用同一个AE，不是训练两套图像模型。AE参数冻结，这里只做固定的编码计算。当前图像表示不参加后面的生成噪声混合；这里说“干净条件”只表示不加那种噪声，训练前的颜色变化、裁剪等图像增广仍可能发生。","status":"frozen","branch":"vision","x":280,"y":390,"refs":[["src/patchwam/models/flux.py",173,175],["src/patchwam/models/flux.py",229,236],["src/patchwam/models/geometry.py",62,66],["external/flux2/autoencoder.py",314,325]],"paper":[["p5 · 图2：Image VAE",5,""],["p26 · 图8：每帧288 tokens",26,""]]},{"id":"ae_future","title":"冻结图像 AE · 未来","subtitle":"与当前分支共用同一个AE","note":"未来端点目标；与当前分支共用冻结AE。","shapes":["[B,3,288,256]","x₀ [B,288,128]"],"detail":"作用：把示范中动作段末尾的真实画面变成训练答案，让模型学习“一段动作完成后，场景的内部表示可能怎样变化”。这张图只在训练时可用，机器人在线执行时不能提前看到它。\n输入：训练窗口最后一个位置的多相机拼图，形状[B,3,288,256]。B是样本数，3是RGB的红、绿、蓝颜色通道，288和256是图高、图宽。基础配置只用当前与末端两帧，不把中间全部视频帧送来作为预测目标。\n处理：未来画面和当前画面共用同一个AE，其参数在训练时保持固定。AE即自编码器，这里使用其图像编码部分；输出latent，也就是图像的内部数字表示。先得到[B,128,18,16]，再把18×16网格展开，成为288个token，即网络处理的信息单元，每个含128个数。\n举例：若末端画面中的夹爪比当前更靠近瓶子，AE会把这个画面转换成一组数字。模型学习的是这组数字的生成规律，并没有显式得到“瓶子距离减少多少”这样的人工描述。一个视觉token也不等于一个物体。\n输出：真实未来表示记为x₀，形状[B,288,128]，三维分别是样本数、图像编码位置数、每位置的数值数量。它分成两路：一路与随机数混合做练习输入，另一路帮助计算正确的变化方向，用来给模型的预测打分。\n注意：AE参数不更新；训练目标是在内部表示空间预测变化方向，常称速度，但不是物体的物理速度。常规训练不调用图像解码器，也不逐像素比较生成图与原图。推理时未来表示从随机数生成，不能把真实未来图当成已知条件。","status":"frozen","branch":"vision","x":280,"y":590,"refs":[["src/patchwam/models/flux.py",238,243],["src/patchwam/models/geometry.py",62,66],["external/flux2/autoencoder.py",314,325]],"paper":[["p5 · 图2：未来目标编码",5,""],["p7 · 式10：clean x₀",7,""]],"caution":"“未来答案参与加噪和计算监督”属于训练流程；在线推理没有真实未来答案，要由模型和动作一起生成未来表示。"},{"id":"codec","title":"无参数 Action-as-Patch","subtitle":"每个坐标连续重复9次","note":"一动作步 = 一patch；α=1，无可学习编码器。","shapes":["[B,16,14] → [B,16,128]"],"detail":"作用：按一条固定规则，把每一步动作写成与图像token（模型处理的信息单元）同样宽度的数字包，使动作可以进入图像网络的同一条计算路径。这就是Action-as-Patch，意为“一步动作按一个视觉块表示的格式来写”。\n输入：按训练统计调整过数值尺度的动作表[B,16,14]，B为样本数，16为动作步数，14为每步控制量数量，包含机械臂和夹爪相关命令。无效动作步和分量先置零；动作不会先画成图片，也不经过图像编码器。\n处理：模型要求每个token含128个数。每个动作分量连续重复9次，14×9=126，再在末尾补2个零；固定缩放系数为1。这里的token是模型处理的一份数字，不是文字，也不是能直接看见的像素块。\n举例：缩小到两个动作数、7个位置时，[0.2,−0.4]可以写成[0.2,0.2,0.2,−0.4,−0.4,−0.4,0]。注意重复的是每个数，不是把[0.2,−0.4]整段重复。真实模型只是按相同规则使用14个分量和128个位置。\n输出：得到[B,16,128]，仍是16步，每步恰好一个token。它交给加噪模块，并与未来图像表示一起训练。编码器本身没有可学习参数，真正学习如何生成合理动作的是后面的共享网络。\n注意：生成动作时，固定解码器对每组9个位置求平均、丢弃末尾2个位置，再由数据处理器恢复物理单位。常规训练直接在128维数字变化方向（称为速度）上计算误差，不先解码；末尾2个填零位置在有效动作步仍参与速度监督。","status":"fixed","branch":"action","x":280,"y":810,"refs":[["src/patchwam/models/codec.py",27,41],["src/patchwam/models/policy.py",267,268]],"paper":[["p6 · 式6–7：固定动作编码",6,""]],"formula":"14个分量各连续重复9次，再补2个零：14×9+2=128；16步动作仍只占16个token。","caution":"重复编码能读回归一化后的原数值，但前面的数值裁剪可能已丢失极端值。固定动作编码不需要学习，不等于生成动作的共享网络不用训练。"},{"id":"context","title":"文本与状态条件","subtitle":"文本之后追加1个state token","note":"无效文本Key保留mask","shapes":["[B,129,7680]"],"detail":"作用：把“要完成什么任务”和“机器人现在是什么状态”排成同一列已知条件，供后面的生成网络读取。这里只整理和拼接已有表示，不产生动作命令。\n输入：语言编码器输出的[B,128,7680]文本特征，即文字的内部数字表示，以及当前状态投影得到的[B,1,7680]。B为一批样本数；第二维是token数量，token指模型处理信息的基本单元；7680是每个单元包含的数值数量。状态token不是一个词。\n处理：先把无效文本补位的特征清零，保留哪些位置有效的标记，再把1个状态token接在完整的128个文本位置后面。这样每个样本都得到129个位置，状态所在的位置不会随指令长短移动。\n举例：假设128个文本位置里有40个有效、88个补位，状态会接在这全部128个位置之后。补位仍占位置，但标记会阻止其他位置把它们当有效信息读取；不能把它误画成40个文本后立刻接状态。\n输出：条件特征为[B,129,7680]，有效性标记为[B,129]，其中状态位置标为有效。它们送入共享网络的文本输入层，再转换成网络内部使用的宽度。当前图像和待生成动作由另外的输入路径进入。\n注意：此处沿位置方向拼接，所以129增加的是信息单元数量，宽度仍为7680；并没有把7680维文本与128维图像直接接成同宽序列。拼接操作本身没有参数，但用于调整参数的训练信号可以经过它传回状态投影层；基础语言编码器的参数仍保持不变。","status":"fixed","branch":"text","x":560,"y":55,"refs":[["src/patchwam/models/policy.py",107,134]],"paper":[["p4 · 式4：条件组成",4,""],["p25 · 附录E：state插入位置",25,""]],"caution":"论文描述把状态放在有效文本后；当前源码把状态放在完整128个文本位置后，包含文本补位。本图依照源码排列。"},{"id":"noise_x","title":"未来视觉加噪","subtitle":"xσ = (1−σ)x₀ + σεx","note":"使用视觉独立高斯噪声；同时保留速度target。","shapes":["xσ [B,288,128]","εx ∼ N(0,I)"],"detail":"作用：把正确的未来画面表示掺入随机数，制作一份需要模型修正的训练输入。这里处理的是未来图像的latent（自编码器把画面转换成的内部数字），不是往当前相机照片上直接撒噪点。\n输入：x₀是正确未来画面的288个token；token可以理解为一个数字包，每包有128个数。另有该样本的混合比例σ，以及独立抽取的εx。εx是标准高斯噪声，即按均值为0、方差（波动大小的度量）为1的钟形分布抽到的随机数。\n处理：每个位置都计算“(1−σ)×正确值 + σ×随机值”。只挑一个数举例：正确值0.2，噪声1.0，σ=0.75，则混合后为0.25×0.2+0.75×1.0=0.8。整个未来图像的所有数字都这样处理，但每个位置有自己的噪声值。\n为什么这样做：模型练习从不同噪声程度的数字中预测变化方向，并借助指令、当前状态和当前画面完成这道题。当前画面不参与此处加噪，继续提供已知场景信息；它和待修正的未来画面承担不同角色。\n输出：带噪结果xσ交给共享视觉输入层img_in，与当前图像和带噪动作一起送入网络。形状[B,288,128]表示一批B个样本、每个样本288个图像位置、每个位置128个数。代码还用这同一份正确值与噪声产生速度答案εx−x₀，送往损失计算。\n注意：本样本的视觉与动作共享σ，但不共享噪声数组。训练只在这个选定比例上做一次前向计算，即让输入经过网络得到一次预测；真正连续执行10轮或20轮去噪，是推理时的工作。","status":"fixed","branch":"flow","x":560,"y":590,"refs":[["src/patchwam/models/policy.py",286,293],["src/patchwam/models/flow.py",85,90]],"paper":[["p7 · 式10：视觉插值",7,""]],"formula":"xσ = (1−σ)x₀ + σεx"},{"id":"noise_u","title":"动作 patch 加噪","subtitle":"uσ = (1−σ)u₀ + σεu","note":"εu与εx独立；2个补零坐标也加噪。","shapes":["uσ [B,16,128]","εu ∼ N(0,I)"],"detail":"作用：给动作的内部数字表示加噪，让模型练习把混乱的数字逐步恢复成可用动作。它发生在Action-as-Patch（AP，把每步动作写成一个数字包）编码之后：16步动作已经被写成16个token（数字包），每包128个数。\n输入：u₀是正确的动作token。RoboTwin每步原有14个控制量，每个量连续重复9次，再补2个零，组成128个数。输入还包括本样本的混合比例σ，以及为动作分支单独抽取的标准高斯噪声εu（围绕0随机波动的数字）。\n处理：每个坐标按“(1−σ)×正确值 + σ×噪声”混合。例如某个动作坐标为−0.4，抽到噪声0.6，σ=0.75，结果为0.25×(−0.4)+0.75×0.6=0.35。这是一个内部数值例子，不表示直接发出0.35的物理控制命令。\n重复位置会怎样：同一个动作分量的9个副本，干净时相同，加噪时却各自使用独立随机数，因此混合后通常不再相同。末尾2个补零位置也加噪：例如正确值0、噪声−0.4，σ=0.75时变为−0.3。\n输出：uσ的形状仍是[B,16,128]，即B个样本、每样本16个动作位置、每位置128个数；它进入共享视觉输入层img_in。对应速度答案εu−u₀送往监督目标。动作和未来图像使用同一个σ，但随机噪声分别抽取。\n注意：超出示范末尾的无效动作步，仍占据输入序列中的位置；它们不会在这里删掉，也不会因此自动被注意力遮住。是否给这些位置计入训练误差，由后面的动作损失mask（有效位置标记）决定。","status":"fixed","branch":"flow","x":560,"y":810,"refs":[["src/patchwam/models/policy.py",286,293],["src/patchwam/models/flow.py",85,90]],"paper":[["p7 · 式10：动作插值",7,""]],"formula":"uσ = (1−σ)u₀ + σεu"},{"id":"sigma","title":"共享噪声强度 σ","subtitle":"τ ∼ U(0,1) · shift = 5","note":"每样本一个σ，送入两路加噪、DiT调制及损失权重。","shapes":["σ = 5τ / (1+4τ)"],"detail":"作用：给每个训练样本选一个“把答案掺入多少随机数”的比例，记作 σ（读作 sigma）。这里的一个样本是一段示范：当前画面、状态、指令，以及未来画面和16步动作。σ不是机器人运行的时间，也不是动作步数。\n怎样理解：σ=0表示全是正确数据，σ=1表示全是随机噪声。中间值按比例混合两者。例如σ=0.75表示混合式中，正确数据占0.25、噪声占0.75。相同比例不保证图像与动作受到的实际影响完全一样，因为两类数据的数值分布不同。\n处理：先在0到1之间均匀抽一个数τ，再算σ=5τ/(1+4τ)。例如τ=0.5会变成σ≈0.833。这个shift=5的变换让高噪声练习出现得更频繁；不是把所有样本都固定在同一个噪声程度。\n共享什么：每个样本分别抽自己的σ。同一样本的未来图像与动作共用这个σ，但两路分别抽取随机噪声。如果一批有4个样本，就有4个σ；第1个样本可以用0.3，第2个可以用0.8，而不是整批只用一个数。[B]中的B就是这批样本的数量。\n输出：σ同时交给未来视觉加噪、动作加噪、网络的时间调制和损失权重计算。时间调制告诉网络当前在处理哪种噪声程度；损失权重决定这次练习对训练评分影响多大。\n注意：抽到某个σ的频率，与它在损失里占多少权重，是两件事。这里负责选练习；w(σ)负责给练习分配权重。此节点只是固定的随机抽样与计算规则，没有需要训练的参数。","status":"random","branch":"flow","x":560,"y":1035,"refs":[["src/patchwam/models/flow.py",26,38],["src/patchwam/models/policy.py",281,285]],"paper":[["p7 · 式11：shifted schedule",7,""]],"formula":"σ = 5τ / (1 + 4τ)"},{"id":"txt_in","title":"txt_in · 条件输入投影","subtitle":"文本 + 状态共用投影","note":"基础Qwen冻结；此投影随DiT训练。","shapes":["[B,129,7680]","↓ [B,129,3072]"],"detail":"作用：把“语言指令和机器人当前状态”转换成负责主要计算的网络方便处理的数字格式。txt_in 是代码中的层名，可以把它理解成条件信息的入口。这里的 token 是模型处理的一包数字；线性投影是用可学习的乘法与加法改变这包数字的长度。\n输入：本图采用 RoboTwin 基础配置。语言编码器已把指令写成 128 个位置，每个位置有 7680 个数；短指令未占满的位置会另行标为无效。当前状态的 14 个数先经过上游状态投影，也变为一包 7680 个数，接在文本后面。\n处理：txt_in 对这 129 包数字逐个使用同一套转换规则，把每包的长度从 7680 变为 3072。它不会把 129 个位置平均成一个位置，也不会在这一层判断哪个词应该对应哪个动作；位置之间交换信息发生在后面的注意力计算中。\n举例：指令中某个位置表达了“绿色瓶子”的相关信息，最后一个位置描述机器人当前姿态。两者在入口处分别转换成 3072 个数，仍保留各自的位置，供后续网络结合画面和待生成动作使用。这个例子不意味着某个数字固定代表某个物体。\n输出：形状从 [B,129,7680] 变为 [B,129,3072]。B 是一次共同处理的样本数，129 是每个样本的条件位置数，最后一维是每个位置的数字个数。结果进入双流网络中的“文本/状态流”，并在允许的范围内与视觉信息交互。\n训练：基础语言编码器被冻结，即本次训练不修改它的参数；txt_in 会随主干网络一起更新。它与视觉入口 img_in 使用不同参数。文本补位的读取权限由另外的注意力规则处理，并不是 txt_in 自动识别并删除这些位置。","status":"trainable","branch":"model","x":840,"y":55,"refs":[["src/patchwam/models/flux.py",118,118]],"paper":[["p4 · 式4：语言、状态条件",4,""],["p5 · 图2：共享DiT",5,""]],"formula":"128 个文本位置 + 1 个状态位置 → 同一条件投影逐位置处理 → 129 个位置，每个 3072 维"},{"id":"img_in","title":"img_in · 共享视觉输入","subtitle":"concat(current, noisy future, noisy action)","note":"当前、未来与动作使用同一输入线性层。","shapes":["288 + 288 + 16 = 592 tokens","128 → 3072"],"detail":"作用：让当前画面、待生成的未来画面和动作使用同一个入口，进入图像生成模型已有的计算路径。img_in 是这个共享输入层的代码名。token 可以理解为模型处理的一包数字；此处每包输入都已整理成 128 个数。\n输入：本图的 RoboTwin 配置包含 288 个当前图像 token、288 个未来图像 token 和 16 个动作 token。图像 token 是图像压缩后的内部表示；动作 token 是将每一步的 14 个控制量逐个重复、补零得到的表示，并没有把动作画成图片。\n处理：先按“当前图像、带噪未来图像、带噪动作”的顺序接成 592 个位置，再对每个位置使用同一个可学习的线性层，也就是同一套乘法与加法，把 128 个数转换为 3072 个数。位置数量和先后顺序在这个过程中保持不变。\n举例：一个表示瓶子附近画面的 token 和一个表示某一步动作的 token，都会经过这同一个转换层。共享的是转换规则，不是说两包数字内容相同，也不是在入口处把它们相加；它们怎样相互影响，要由后面的注意力计算决定。\n输出：输入 [B,592,128] 变为 [B,592,3072]。B 表示一批样本的数量，592 是每个样本的位置数，3072 是每个位置在网络内部的数字个数。结果作为“视觉/动作流”进入 5 个双流模块；语言和状态通过另一个入口进入。\n训练：这个输入层会随主干网络更新，动作复用它的参数，没有额外的动作专用输入层。当前图像在这里仍是未加噪的条件；只有未来图像和动作掺入了随机噪声。共用入口并不意味着把当前图像也当作需要生成的答案。","status":"trainable","branch":"model","x":840,"y":355,"refs":[["src/patchwam/models/policy.py",196,200],["src/patchwam/models/flux.py",117,118]],"paper":[["p5 · 图2与§3.1：共享DiT",5,""]],"formula":"当前图像 288 + 带噪未来图像 288 + 带噪动作 16 → 592 个 token → 同一线性层：128 维转为 3072 维"},{"id":"position","title":"四轴位置坐标 → RoPE","subtitle":"current=10 · future=0 · action=20","note":"图像用二维行列；动作用步号；旋转每层Q/K。","shapes":["current 10 · future 0 · action 20"],"detail":"作用：给每个 token 配一个地址，让模型区分“来自哪一组、在画面哪里、是第几步”。token 是一包用于计算的数字；位置编码则是把地址带入计算的办法。没有这类信息，仅看一串数字包就难以明确它们的排列关系。\n输入：本图每个样本共有 721 个 token，每个配 4 个坐标，可写成 [B,721,4]。B 是样本数，721 是位置总数，4 是地址的长度。四轴依次用于组别、图像行、图像列、序列位置；某一类 token 用不到的坐标保持为零。\n处理：文本和状态写成 (0,0,0,i)，当前图像写成 (10,y,x,0)，未来图像写成 (0,y,x,0)，动作写成 (20,0,0,h)。i 是条件序号，y、x 是图像内部网格的行列，h 是动作序号；这些序号均从 0 开始。\n举例：当前图像行索引为 7、列索引为 4 的内部位置地址为 (10,7,4,0)，未来图像同一网格位置是 (0,7,4,0)；第 3 步动作是 (20,0,0,2)。它们说明位置关系，不表示当前和未来画面中的同一物体必然留在同一个格子。\n输出：地址经过 RoPE，即“旋转位置编码”，形成供每层注意力使用的位置变换。注意力会判断哪些位置的信息更相关；RoPE 按地址旋转 Q（当前要找的信息）和 K（供其他位置判断相关性的标记），让这种比较同时考虑位置。它不向 token 尾部直接追加 4 个数。\n注意：地址规则固定，不靠训练另学一套类别标签。10、0、20 是分组用的坐标值，不是过去或未来多少秒。位置编码本身也不决定谁有权读取谁；读取权限由另一节点的注意力 mask（读取权限表）决定，两者都会送入后续网络。","status":"fixed","branch":"model","x":840,"y":660,"refs":[["src/patchwam/models/geometry.py",7,22],["src/patchwam/models/policy.py",175,185],["src/patchwam/models/flux.py",132,134],["src/patchwam/models/flux.py",72,74]],"paper":[["p7 · §3.4：四轴坐标",7,""],["p26 · 图8：位置与token顺序",26,""]],"formula":"每个 token 的四轴地址 → RoPE 位置变换 → 在每层注意力比较 Q 与 K 时使用"},{"id":"time","title":"时间嵌入与逐流调制","subtitle":"σ → embedding → time_in → modulation","note":"shift / scale / gate 送入每层；干净prefix也受σ调制。","shapes":["[B] → [B,256] → [B,3072]"],"detail":"作用：告诉网络“当前这道去噪题有多难”，让它根据混入噪声的比例调整计算。这里的时间指 σ（读作 sigma）表示的噪声水平：0 是干净数据，1 是纯随机噪声，不是机器人运动的秒数，也不是动作块里的第几步。\n输入：基础训练为每个样本分别抽一个 σ，同一样本的未来图像与动作共用它。形状 [B] 表示一批 B 个样本各有一个数；不同样本可以处在不同噪声水平。图像和动作的随机噪声值仍分别抽取，共享比例不等于共享同一份噪声。\n处理：先按固定规则把每个 σ 转成 256 个正弦、余弦数值，再经过可训练的 time_in 网络变为 3072 个数。可以把这理解为把一个刻度展开成更丰富的数字表达。官方实现会先把 σ 乘以 1000 来计算这组波形，但不改变真正加入数据的噪声比例。\n举例：面对 σ=0.9 的杂乱输入和 σ=0.1 的较清晰输入，网络收到不同的时间表示。后续小网络据此产生平移、缩放和门控系数：分别用于调整内部数值的基准、幅度，以及本层新计算出的修改量有多大。系数随训练学得，并非人为写死的处理策略。\n输出：形状依次为 [B] → [B,256] → [B,3072]，末尾数字表示每个样本的时间表示长度。双流的文本/状态、视觉/动作分别产生调节系数，单流使用另一组；相应类型的各层复用这些系数，最终输出层也接受时间表示。\n训练：正弦和余弦的展开规则固定，后面的转换与调节网络会更新参数。语言、状态和当前图像虽然不掺随机噪声，其内部计算仍会受 σ 调节。因此换一个去噪阶段，条件的中间结果也可能改变，不能直接假定上一步结果可以原样复用。","status":"trainable","branch":"flow","x":840,"y":1035,"refs":[["src/patchwam/models/flux.py",119,131],["src/patchwam/models/flux.py",154,155]],"paper":[["p5 · 图2；p14 · §5.1",14,"prefix随噪声水平调制；算子细节以源码为准。"]],"formula":"每个样本的 σ → 固定 256 维波形表示 → 可学习的 3072 维时间表示 → 调节双流、单流和最终输出层"},{"id":"mask","title":"联合注意力可见性","subtitle":"prefix=129 context + 288 current","note":"行Query / 列Key；生成块内部双向交互。","shapes":["mask [B,1,721,721]"],"detail":"作用：规定模型内部“谁可以读取谁的信息”。注意力是让一个位置按相关程度汇集其他位置内容的计算；mask 是它的读取权限表。它只划定允许访问的范围，具体更重视哪个位置仍由网络计算，并不是直接指定正确动作。\n输入：本图每个样本有 721 个 token，即 721 包待处理的数字。其中 129 个文本/状态位置加 288 个当前图像位置，共 417 个已知条件，称为条件前缀；其后 288 个未来图像位置和 16 个动作位置，共 304 个，是共同生成的部分。\n处理：条件位置只能读取有效条件，不能读取正在生成的未来图像与动作。生成位置可以读取有效条件，也可以读取未来图像和动作彼此的当前表示。矩阵的行代表“正在更新谁”，也叫 Query；列代表“准备读取谁”，也叫 Key。\n举例：更新第 3 步动作时，可以读取第 12 步动作的带噪表示和未来图像的带噪表示，一起调整这段动作。反过来，更新当前图像的条件表示时，不能读取这些生成草稿。这里读取的是去噪过程中的中间结果，不是提前拿到真实的未来答案。\n输出：权限表形状是 [B,1,721,721]。B 是样本数，两个 721 分别是读取方和被读取方；1 表示同一张表供各组并行注意力计算共用。它送给全部双流和单流模块，合并为单一序列后也不会取消限制。\n注意：权限规则不参与训练。为凑足文本长度而补上的无效位置，会对所有读取方隐藏；有效动作位置之间没有只能看过去的限制。动作因越过示范末尾而补位时，其有效性用于后续损失计算，并没有在这里自动变成被隐藏的注意力列。","status":"fixed","branch":"model","x":1120,"y":0,"refs":[["src/patchwam/models/geometry.py",25,59],["src/patchwam/models/policy.py",186,190]],"paper":[["p7 · §3.4：注意力结构",7,""],["p26 · 图8：可见性矩阵",26,""]],"formula":"已知条件 → 只读有效条件\n未来图像 / 动作 → 可读有效条件及彼此的当前带噪表示"},{"id":"double","title":"双流 Transformer ×5","subtitle":"text/state流 + 视觉/动作流","note":"两路QKV拼接做同一次注意力；各自投影和MLP。","shapes":["text/state [B,129,3072]","visual/action [B,592,3072]"],"detail":"作用：先让两类输入分别加工，再在允许范围内交换信息。“双流”是文本/状态一条流、视觉/动作另一条流，并不是图像与动作各一条。Transformer 是通过注意力让位置之间交流的网络；这里连续使用 5 个这样的计算模块。\n输入：本图两路形状分别为 [B,129,3072] 和 [B,592,3072]。B 是样本数，129 是文本加状态的位置数，592 是当前图像、未来图像和动作的位置总数；每个位置用 3072 个数表示。一个位置的这包数字就是一个 token。\n处理：每个模块先分别调整两路数字的尺度，并按噪声水平改变计算方式；然后生成用于判断相关性和汇集内容的数字。两路一起参加注意力计算，即每个位置按相关程度读取获准访问的其他位置，再把结果拆回原来的两条流。\n举例：生成某一步“向瓶子伸手”的动作时，这个位置可以读取指令要求、当前画面以及未来图像的带噪草稿。但条件位置不能反过来读取动作草稿。双流联合计算仍遵守注意力权限表，不意味着所有位置都能无条件相互读取。\n输出：注意力读到的信息先经各自的转换层、门控，再加回原表示；门控系数决定加多少，这叫残差更新。随后再调整已更新表示的尺度、按当前噪声水平调节，经过MLP（逐位置组合数字的前馈网络），再做一次门控相加。两路形状不变；经过5个模块后接成721个位置，送入单流阶段。\n训练：5 个模块的参数彼此独立，都会训练；同一类型的时间调节系数、位置规则和读取权限则复用。动作始终在视觉流中，没有独立动作专家。这 5 层是一次模型计算中的网络深度，不是执行 5 步动作，也不是完整推理的 5 轮去噪。","status":"trainable","branch":"model","x":1120,"y":300,"refs":[["src/patchwam/models/flux.py",77,95],["src/patchwam/models/flux.py",137,145],["external/flux2/model.py",39,49]],"paper":[["p5 · 图2：Shared visual DiT",5,""],["p28 · 附录F：与骨干匹配的5双流/20单流",28,""]],"formula":"两路各自准备信息 → 联合注意力并遵守读取权限 → 拆回两路 → 各自转换并加回原表示；连续经过 5 个模块"},{"id":"single","title":"单流 Transformer ×20","subtitle":"concat(text, image) → 单一序列","note":"attention与FFN并行，拼接后投影并残差更新。","shapes":["[B,721,3072]"],"detail":"作用：在双流阶段之后，让语言、状态、当前图像、未来图像和动作进入同一套后续计算。“单流”表示接成一条序列统一处理，不是把所有内容压成一个数字包。每个 token，也就是一包内部数字，仍保留自己的位置。\n输入：将 129 个文本/状态位置和 592 个视觉/动作位置接起来，得到 [B,721,3072]。B 是一起处理的样本数，721 是每个样本的总位置数，3072 是每个位置的数字个数。进入本阶段前，各类输入已经转成同样宽度，无需再改变位置数量。\n处理：每个模块先调整数字尺度，并依据当前噪声水平调节它们，再同时计算两部分：注意力负责按相关程度汇集其他位置的信息；前馈变换负责组合当前这个位置内部的数字。把两部分为同一个位置算出的数字列表接起来，经过可学习转换，形成本层修改量。\n举例：对一个动作位置而言，注意力部分可以从画面和指令中读取相关线索，前馈部分则进一步变换该位置的表示；两者共同影响新的数字包。这个说明只描述计算通路，不是在认定某层已经理解了具体物体，或证明模型在执行人类式规划。\n输出：修改量乘上时间调节给出的系数，再加回原表示，称为门控残差更新。20 个模块依次执行，每个都有自己的参数，形状始终为 [B,721,3072]。完成后，后续输出节点只取 304 个未来图像和动作位置来预测速度，条件位置不作为生成结果输出。\n训练：20 个模块都参与训练，并继续使用原来的位置编码和注意力权限；已知条件仍不能读取生成部分。20 层不等于 20 轮去噪：一次模型前向就会经过这 20 层，推理的每一轮去噪都会再次执行整套网络。","status":"trainable","branch":"model","x":1120,"y":555,"refs":[["src/patchwam/models/flux.py",97,107],["src/patchwam/models/flux.py",146,152],["external/flux2/model.py",39,49]],"paper":[["p5 · 图2：共享DiT",5,""],["p28 · 附录F：与骨干匹配的5双流/20单流",28,""]],"formula":"两路接成 721 个位置 → 注意力与逐位置前馈变换并行 → 合并修改量并加回原表示；连续经过 20 个模块"},{"id":"targets","title":"两路速度监督目标","subtitle":"与加噪使用同一份clean和noise","note":"由真实数据构造；不属于可学习网络。","shapes":["v*x = εx − x₀","v*u = εu − u₀"],"detail":"作用：为网络准备这道训练题的正确答案。这不是另一个神经网络，而是利用已有示范和刚抽取的噪声直接计算。这里监督的是“内部数字怎样随噪声比例变化”，不是直接监督最终彩色图片或关节速度。\n输入：需要两路加噪时用过的干净数据x₀、u₀，以及完全相同的噪声εx、εu。不能另抽一份噪声来算答案，否则输入对应的是一道题，监督答案却属于另一道题。\n为什么减法这样写：加噪公式是(1−σ)×正确值+σ×噪声。随着σ增大，它沿一条直线从正确值走向噪声，因此速度答案就是“噪声−正确值”。视觉答案为εx−x₀，动作答案为εu−u₀。速度既有正负方向，也有变化幅度。\n举例：某个动作数的正确值是−0.4，噪声是0.6，速度答案就是1.0。σ=0.75时混合值为0.35。若模型恰好预测对了，推理把σ降到0.5，步长为−0.25，便更新成0.35−0.25×1.0=0.1，向−0.4靠近。负步长解释了为什么训练写“噪声减答案”，推理仍然可以去噪。\n输出：两张答案表分别为[B,288,128]和[B,16,128]。B是一批样本数量，其余两项是图像或动作的位置数、每个位置的数字个数。答案只进入视觉与动作损失，用来给网络预测打分，不作为正确答案直接喂进网络。\n注意：上面的演算是假设预测恰好正确的教学例子；真实推理不知道干净未来与真实动作，要由网络估计速度。动作token末尾补零坐标的正确值为0，所以其速度答案就是该坐标抽到的噪声。","status":"fixed","branch":"flow","x":1120,"y":845,"refs":[["src/patchwam/models/flow.py",85,90],["src/patchwam/models/policy.py",292,293]],"paper":[["p7 · 式12：速度匹配目标",7,"训练回归latent velocity，而非直接回归干净图像或动作。"]],"formula":"视觉答案 v*x = εx − x₀   [B,288,128]\n动作答案 v*u = εu − u₀   [B,16,128]\n* 表示训练答案；它们不是机器人关节速度。"},{"id":"output","title":"共享输出层 → 两组速度","subtitle":"仅保留future/action后缀 → final_layer","note":"同一个输出层；按序列288 / 16拆分，无独立动作头。","shapes":["[B,304,3072] → [B,304,128]","v̂x [B,288,128]","v̂u [B,16,128]"],"detail":"作用：把负责主要计算的主干网络算出的内部表示，读成未来图像和动作各自的“速度预测”。这里的速度是这些数字随噪声比例 σ 增大时怎样变化，包含方向和幅度；它不是机器人关节速度，也不是已经可以直接执行的动作命令。\n输入：单流网络输出 [B,721,3072]，其中 B 是样本数，721 是位置数，3072 是每个位置的数字个数。先跳过前 417 个文本、状态和当前图像条件位置，只保留后 304 个未来图像与动作位置，得到 [B,304,3072]。\n处理：final_layer 是共享输出层的代码名。它先调整每个位置内部数字的尺度，再根据当前噪声水平进行平移和缩放，最后用同一个可学习线性层，把每包 3072 个数变成 128 个数。未来图像和动作使用同一套参数，并没有各自独立的输出网络。\n输出：结果为 [B,304,128]，再按顺序拆成视觉速度 [B,288,128] 和动作速度 [B,16,128]。288 和 16 分别是未来画面位置数和动作步数，128 是每个位置的数字个数。训练时，两组结果直接与“所抽噪声减去干净答案”比较，以此计算预测误差。\n举例：如果某个内部数字的预测速度是 0.8，推理将 σ 从 0.75 降到 0.5，便用负步长 −0.25 乘它，使这个数字变化 −0.2。这解释了为何训练速度指向噪声，实际更新却能反向去噪；真实变化是否正确，仍取决于模型预测。\n训练：共享输出层会更新参数。常规训练在这里不先把动作读回物理单位，也不把未来表示还原成彩色图片。推理要反复用速度更新数字，结束后才对动作重复组求平均、恢复原数值尺度；未来图像若需要展示，还要经过图像解码器。","status":"trainable","branch":"model","x":1400,"y":490,"refs":[["src/patchwam/models/flux.py",153,155],["src/patchwam/models/policy.py",201,207]],"paper":[["p5 · 式5：共享vθ",5,""]],"formula":"721 个位置 → 取后 304 个生成位置 → 同一输出层：3072 维转为 128 维 → 拆成 288 个视觉速度 + 16 个动作速度"},{"id":"loss_x","title":"视觉速度匹配损失","subtitle":"每样本视觉MSE × w(σ)","note":"先平均288×128坐标，再按样本加权。","shapes":["Lv = E[w(σ) · MSE(v̂x,v*x)]"],"detail":"作用：给网络预测未来视觉变化的能力打一个误差分。损失（loss）越小，表示预测越接近这批训练题的答案。这里比较的是图像内部表示的速度，不是直接比较两张彩色照片，也不是判断机器人任务是否成功。\n输入：共享输出层给出的视觉速度预测v̂x，以及“速度监督目标”节点算出的正确答案v*x=εx−x₀。两者都是[B,288,128]：B个样本，每个样本288个视觉位置，每位置128个数。符号上的帽子表示预测值，星号表示答案。\n怎么算：先做MSE（均方误差）：每个预测减去答案，平方，再取平均。缩小到两个数字举例，预测[0.3,−0.1]，答案[0.2,−0.3]，误差平方为[0.01,0.04]，平均为0.025。真实计算对每个样本的288×128=36,864个坐标取平均。\n怎样汇总：每个样本先得到自己的MSE，再乘该样本噪声比例对应的w(σ)，最后把一批样本的分数取平均。w(σ)是固定评分权重，σ在中间时权重较高、在0和1时为0；它不会改变预测答案，只调整这道题对总评分的影响。\n输出：结果是一个数Lv，交给联合损失节点，再乘视觉系数0.5。这个节点没有可学习参数，但其误差会通过反向传播，告诉共享网络的参数应怎样调整；反向传播就是由误差往回计算参数影响的过程。\n当前实现：数据会标出哪些未来帧是越过示范末尾后复制的占位帧，标记名为image_is_pad。但这里没有用该标记过滤视觉MSE，因此那些重复末帧仍会参与视觉训练。动作分支的无效位置处理与此不同。","status":"loss","branch":"loss","x":1680,"y":270,"refs":[["src/patchwam/models/policy.py",309,312],["src/patchwam/models/flow.py",103,108],["src/patchwam/models/flow.py",21,35]],"paper":[["p7 · 式12–13：视觉项",7,""]],"formula":"Lv = mean_B[w(σ) · mean_(S,D)((v̂x−v*x)²)]","caution":"论文/源码对照：当前视觉损失没有用image_is_pad排除占位帧。此处的分数是潜空间速度误差，不能当作图像观感评分或机器人任务成功率。"},{"id":"loss_u","title":"掩码动作速度损失","subtitle":"排除无效时间步 / 动作维","note":"无效步/维不监督；2个patch补零坐标仍监督。","shapes":["La = E[w(σ) · MSEvalid]"],"detail":"作用：给动作速度预测打分，同时避免把无效训练标签算进成绩。这里的速度指内部数字随加噪比例增大时的变化方向与幅度，不是关节运动速度。这里的mask是有效位置标记，用来规定哪些数字应计分；它不负责删除网络里的动作token，也不是注意力的读取权限表。\n输入：预测v̂u和答案v*u都是[B,16,128]，即B个样本、每样本16步、每步128个内部数字。另有两种无效标记：动作步越过示范结尾，或某些动作分量本身无效。原始14维动作的有效性，要按AP（固定重复和补零的动作编码）的9份重复扩展到128维中的对应位置。\n哪些位置计分：无效动作步整步不计分；无效动作分量对应的9个副本不计分。但为了把126个动作数字凑到128而补的最后2个零，是编码规则的一部分，在有效步仍计分。若16步和所有动作维都有效，就计16×128=2,048个坐标；若仅12步有效，就计1,536个。\n怎么算：只对有效位置计算MSE（误差平方的平均）。例如一个缩小例子中有3个位置，预测误差分别为1、2、100，但第3个无效，则只算(1²+2²)/2=2.5，不能让那个100污染分数。真实训练仍在128维速度表示中比较，不先还原为14维物理动作。\n怎样汇总：每个样本先按自己的有效坐标数算平均，再乘自己的噪声权重w(σ)，最后对B个样本取平均。不是把全批有效坐标混在一起平均，也不是除以权重之和。所有动作步都无效的样本贡献0，但仍占最后批次平均中的一个样本位置。\n输出：得到一个动作损失数La，送给联合损失，以系数1.0参与训练。有效标签的误差会通过共享网络回传，用来调整网络参数；这个评分节点本身没有需要训练的权重。","status":"loss","branch":"loss","x":1680,"y":610,"refs":[["src/patchwam/models/policy.py",307,312],["src/patchwam/models/codec.py",49,60],["src/patchwam/models/flow.py",103,112]],"paper":[["p7 · 式12：MSEvalid 与填充通道",7,""]],"formula":"La = mean_B[w(σ) · sum(valid·(v̂u−v*u)²) / max(1,sum(valid))]"},{"id":"total","title":"联合流匹配目标","subtitle":"L = 0.5 Lv + 1.0 La","note":"两个模态独立求均值，再进行加权求和。","shapes":["L = 0.5 Lv + 1.0 La"],"detail":"作用：把“未来视觉速度预测得怎样”和“动作速度预测得怎样”合成一个训练总分L。这里的速度是内部数字随加噪比例增大时的变化方向与幅度，不是机器人的运动速度。网络训练的目标是降低这个总误差。它不是任务成功率，也不是把两种模态的预测结果拼成一张图。\n输入：Lv和La分别来自视觉损失与动作损失节点，已经各自包含噪声权重w(σ)，并对该批样本完成平均。因此这里不需要再乘一次w，避免重复加权。\n处理：基础RoboTwin配置使用L=0.5×Lv+1.0×La。例如Lv=1.0、La=0.2，总损失就是0.5×1.0+1.0×0.2=0.7。0.5和1.0是人为设定的评分系数，不是模型学出来的参数。\n为什么先各自平均：视觉有288个token，动作只有16个；token就是模型处理的一包数字。若直接把所有位置的误差堆起来相加，位置多的一路容易占主导。现在像两份题量不同的试卷：先分别算平均错多少，再给两科分配权重。\n噪声权重是什么意思：w(σ)用来调整不同噪声程度练习的影响，在σ=0.5最高、σ=0或1为0。公式中的exp是指数函数，Z是缩放常数，使按训练抽样方式算出的平均权重为1；不代表每个样本的权重都等于1。这一步的作用已经包含在输入Lv、La中。\n输出：总分L交给反向传播与AdamW节点，用它计算参数怎样影响误差、怎样更新。视觉/动作系数为1比2，不代表两者引起的参数变化或最终能力贡献一定为1比2。这张图的基础训练只有这两项，其他扩展配置可能另加辅助损失。","status":"loss","branch":"loss","x":1680,"y":930,"refs":[["src/patchwam/models/policy.py",309,325],["configs/robotwin.yaml",14,17],["src/patchwam/models/flow.py",21,35]],"paper":[["p7 · 式12–13：完整训练目标",7,""]],"formula":"w(σ) = [exp(−2(σ−0.5)²)−exp(−0.5)] / Z\nL = 0.5Lv + La"},{"id":"optimizer","title":"反向传播与 AdamW","subtitle":"更新共享DiT + state projection","note":"更新DiT全部参数与state projection；AE和Qwen冻结。","shapes":["AdamW · lr=1e−4","梯度累积2 · clip norm=1"],"detail":"作用：把前面算出的误差用于修改模型，让它下次预测得更接近示范。这里调整的是网络内部参数（大量可学习的数字），不是直接修改这一轮机器人的控制命令。\n输入与反向传播：输入是联合损失L和本次网络计算留下的关系。反向传播从误差往回计算梯度：也就是某个参数稍微改变时，损失会怎样变。梯度提供局部的修改方向和幅度线索，不等于直接拿“答案减预测”改所有参数。\n更新哪些部分：共享DiT（负责视觉和动作联合生成的Transformer网络）的所有参数都训练，包括输入投影、时间调制、双流/单流块和输出层；当前状态的线性投影也训练。图像AE和基础Qwen文本编码器是冻结的，即参数不修改；AP动作编码只按固定规则重复和补零，本来就没有参数。\nAdamW怎样用：AdamW是一种优化器，即根据梯度实际更新参数的算法，它会参考历史梯度统计，并施加权重衰减。当前学习率为0.0001，用来控制更新步幅；这不表示每个参数都固定加减0.0001。权重衰减0.01会适度缩小参数数值。\n一批与一次更新：配置每个进程一次处理4个样本，并做2次梯度累积：先合计两个小批次的梯度，再更新一次参数。采用32个并行工作进程时，一次更新对应32×4×2=256个样本。进程可以理解为同时运行的训练工作程序。\n稳定计算：更新前使用阈值1.0做梯度裁剪，梯度整体过大时按比例缩小，限制突然的过大更新；不是简单把每个梯度都截成−1到1。更新后的权重用于下一轮训练。图中回到网络的线表示参数更新关系，不是把正确未来答案变成推理输入。","status":"trainable","branch":"param","x":1400,"y":930,"refs":[["src/patchwam/engine.py",148,156],["src/patchwam/engine.py",414,450],["configs/robotwin.yaml",109,126]],"paper":[["p5 · §3.1：可训练参数组成",5,""],["p26 · 附录F：训练设置",26,""]],"formula":"L → 反向传播求梯度 → 梯度累积与裁剪 → AdamW更新参数\nθ表示网络参数；∇θL表示损失对这些参数的梯度。"}],"edges":[{"to":"qwen","label":"instruction","kind":"data","from":"dataset"},{"to":"images","label":"两端RGB","kind":"data","from":"dataset"},{"to":"normalize","label":"action / state","kind":"data","from":"dataset"},{"to":"ae_current","label":"oₜ","kind":"data","from":"images"},{"to":"ae_future","label":"oₜ₊₁₆","kind":"data","from":"images"},{"to":"state","label":"sₜ","kind":"data","from":"normalize"},{"to":"codec","label":"ā","kind":"data","from":"normalize"},{"to":"loss_u","label":"valid masks","kind":"condition","from":"normalize","sides":"bb"},{"to":"context","label":"","kind":"data","from":"qwen"},{"to":"context","label":"","kind":"data","from":"state"},{"to":"txt_in","label":"","kind":"data","from":"context"},{"to":"img_in","label":"clean x_ref","kind":"data","from":"ae_current"},{"to":"ae_future","label":"共用同一AE","kind":"shared","from":"ae_current","sides":"rr"},{"to":"noise_x","label":"x₀","kind":"data","from":"ae_future"},{"to":"noise_u","label":"u₀","kind":"data","from":"codec"},{"to":"img_in","label":"xσ","kind":"data","from":"noise_x"},{"to":"img_in","label":"uσ","kind":"data","from":"noise_u"},{"to":"noise_x","label":"同一σ","kind":"condition","from":"sigma","sides":"rr"},{"to":"noise_u","label":"","kind":"condition","from":"sigma","sides":"rr"},{"to":"time","label":"σ","kind":"condition","from":"sigma"},{"to":"loss_x","label":"w(σ)","kind":"condition","from":"sigma","sides":"br"},{"to":"loss_u","label":"","kind":"condition","from":"sigma","sides":"br"},{"to":"double","label":"text stream","kind":"data","from":"txt_in"},{"to":"double","label":"image stream","kind":"data","from":"img_in"},{"to":"double","label":"visibility","kind":"condition","from":"mask","sides":"bt"},{"to":"single","label":"","kind":"condition","from":"mask","sides":"rr"},{"to":"double","label":"RoPE","kind":"condition","from":"position"},{"to":"single","label":"","kind":"condition","from":"position"},{"to":"double","label":"modulation","kind":"condition","from":"time","sides":"rr"},{"to":"single","label":"","kind":"condition","from":"time","sides":"rt"},{"to":"output","label":"","kind":"condition","from":"time","sides":"rr"},{"to":"single","label":"concat两流","kind":"data","from":"double","sides":"bt"},{"to":"output","label":"只保留304生成tokens","kind":"data","from":"single"},{"to":"targets","label":"εx − x₀","kind":"data","from":"noise_x","sides":"rb"},{"to":"targets","label":"εu − u₀","kind":"data","from":"noise_u"},{"to":"loss_x","label":"v*x","kind":"data","from":"targets","sides":"rr"},{"to":"loss_u","label":"v*u","kind":"data","from":"targets"},{"to":"loss_x","label":"v̂x","kind":"data","from":"output"},{"to":"loss_u","label":"v̂u","kind":"data","from":"output"},{"to":"total","label":"× 0.5","kind":"data","from":"loss_x","sides":"rb"},{"to":"total","label":"× 1.0","kind":"data","from":"loss_u","sides":"bt"},{"to":"optimizer","label":"backward","kind":"data","from":"total","sides":"lr"},{"to":"double","label":"更新共享DiT","kind":"update","from":"optimizer","sides":"rr"},{"to":"state","label":"更新Wₛ","kind":"update","from":"optimizer","sides":"bb"}],"files":{"src/patchwam/data/episodes.py":{"text":"\"\"\"Local LeRobot v2 episode windows.\n\nThe reader is independently implemented against LeRobot's documented on-disk\nformat. ImageWAM's data-window and filtering behavior informed its contract;\nsee PROVENANCE.json for the reviewed source files and their licenses.\n\nSPDX-License-Identifier: MIT\nCopyright (c) 2026 Yuyang \"Alice.L\"\nSource contract attribution: LICENSE-MIT and PROVENANCE.json.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nfrom bisect import bisect_right\nfrom collections.abc import Mapping, Sequence\nfrom dataclasses import dataclass\nfrom functools import lru_cache\nfrom hashlib import sha256\nfrom io import BytesIO\nfrom pathlib import Path\n\nimport numpy as np\nimport torch\nfrom PIL import Image\nfrom torch.utils.data import Dataset\n\nfrom .appearance import AppearanceRandomizer\nfrom .augmentation import ClipAugment\nfrom .cameras import compose_cameras, prepare_rgb, resize_clip\nfrom .history import PastFrameSelector\nfrom .processing import SampleProcessor\nfrom .scaling import read_statistics\n\n\n@dataclass\nclass _Episode:\n    root: Path\n    index: int\n    path: Path\n    info: dict\n    rows: np.ndarray\n    tasks: dict\n    columns: tuple[str, ...]\n\n\ndef _json_lines(path):\n    if not path.exists():\n        return []\n    return [json.loads(line) for line in path.read_text(encoding=\"utf-8\").splitlines() if line.strip()]\n\n\ndef _column_name(meta, field):\n    if meta.get(\"lerobot_key\"):\n        return meta[\"lerobot_key\"]\n    prefix = {\"action\": \"action\", \"state\": \"observation.state\", \"images\": \"observation.images\"}[field]\n    return prefix if meta[\"key\"] == \"default\" else f\"{prefix}.{meta['key']}\"\n\n\ndef _feature_tensor(table, column, indices):\n    if column not in table.column_names:\n        raise KeyError(f\"Missing parquet column {column!r}\")\n    values = table[column].take(indices.tolist()).to_pylist()\n    result = torch.from_numpy(np.asarray(values, dtype=np.float32))\n    return result.unsqueeze(-1) if result.ndim == 1 else result\n\n\nclass EpisodeDataset(Dataset):\n    \"\"\"Endpoint images and action windows with separate padding masks.\n\n    At 17 frames and ratio 1, images are t/t+16 and actions are t..t+15.\n    True marks invalid dimensions or steps. Corrupt samples raise.\n    \"\"\"\n\n    def __init__(self, dataset_dirs, shape_meta, num_frames=17, video_size=(224, 448),\n                 processor=None, pretrained_norm_stats=None, val_set_proportion=0,\n                 is_training_set=True, val_split_level=\"episode\", seed=42,\n                 global_sample_stride=1, sample_index_stride=1,\n                 action_video_freq_ratio=1, endpoint_frames_only=True,\n                 concat_multi_camera=\"horizontal\", robotwin_camera_layout=\"compact_288x256\",\n                 nonidle_filter_path=None, episode_index_filter=None,\n                 require_text_cache=False, text_embedding_cache_dir=None, context_len=128,\n                 qwen_text_cache_dir=None, qwen_context_len=128, qwen_text_cache_format=\"qwen2_5_vl\",\n                 override_instruction=None, prompt_template=\"A video recorded from a robot's point of view executing the following instruction: {task}\",\n                 lerobot_backend=\"v2\", lerobot_tolerance_s=None, video_augmentation=None,\n                 separate_camera_views=False, include_vl_inputs=False, history_slots=0,\n                 history_interval_s=1.0, history_jitter_s=0.4, history_whole_dropout=0.2,\n                 history_slot_dropout=0.2, history_truncate=True, vl_history_jitter_frames=1,\n                 vl_image_size=448, head_camera_key=None, subtask_column=None,\n                 require_subtask_labels=False):\n        if lerobot_backend != \"v2\":\n            raise ValueError(\"EpisodeDataset currently supports local LeRobot v2; v3 merged video files require a separate backend\")\n        if num_frames \u003c 2 or global_sample_stride \u003c 1 or sample_index_stride \u003c 1:\n            raise ValueError(\"Frames must be \u003e=2 and sample strides must be positive\")\n        if action_video_freq_ratio \u003c 1 or (num_frames - 1) % action_video_freq_ratio:\n            raise ValueError(\"Action horizon must divide evenly into the selected video transitions\")\n        if not 0 \u003c= val_set_proportion \u003c 1 or val_split_level not in {\"episode\", \"root\"}:\n            raise ValueError(\"Invalid train/validation split\")\n        if not dataset_dirs:\n            raise ValueError(\"At least one local dataset root is required\")\n        self.shape_meta = shape_meta\n        self.training = bool(is_training_set)\n        self.separate_camera_views = bool(separate_camera_views)\n        self.include_vl_inputs = bool(include_vl_inputs or separate_camera_views or history_slots)\n        self.vl_image_size = int(vl_image_size)\n        if self.vl_image_size \u003c 1:\n            raise ValueError(\"VL image size must be positive\")\n        self.head_camera_key = head_camera_key or shape_meta[\"images\"][0][\"key\"]\n        if self.head_camera_key not in {item[\"key\"] for item in shape_meta[\"images\"]}:\n            raise ValueError(\"The history head camera is missing from shape metadata\")\n        self.history_selector = PastFrameSelector(\n            slots=history_slots, interval_s=history_interval_s, jitter_s=history_jitter_s,\n            whole_dropout=history_whole_dropout, slot_dropout=history_slot_dropout,\n            truncate_recent=history_truncate, vl_jitter_frames=vl_history_jitter_frames,\n        )\n        self.subtask_column, self.require_subtask_labels = subtask_column, bool(require_subtask_labels)\n        if self.require_subtask_labels and not self.subtask_column:\n            raise ValueError(\"Required subtask supervision needs an explicit parquet column\")\n        self.num_frames = int(num_frames)\n        self.horizon = self.num_frames - 1\n        self.frame_stride = int(global_sample_stride)\n        self.sample_stride = int(sample_index_stride)\n        self.image_steps = [0, self.horizon] if endpoint_frames_only else list(range(0, self.num_frames, action_video_freq_ratio))\n        self.video_size, self.layout, self.robotwin_layout = tuple(video_size), concat_multi_camera, robotwin_camera_layout\n        self.require_text_cache, self.text_cache = require_text_cache, text_embedding_cache_dir\n        self.context_len, self.qwen_cache = int(context_len), qwen_text_cache_dir\n        self.qwen_context_len, self.qwen_format = int(qwen_context_len), qwen_text_cache_format\n        self.override_instruction, self.prompt_template = override_instruction, prompt_template\n        self.video_tolerance = 1e-4 if lerobot_tolerance_s is None else float(lerobot_tolerance_s)\n        if not np.isfinite(self.video_tolerance) or self.video_tolerance \u003c= 0:\n            raise ValueError(\"Video timestamp tolerance must be finite and positive\")\n        if isinstance(video_augmentation, dict):\n            appearance_keys = {\"photometric\", \"style\", \"fourier\", \"background\"}\n            augmentation_type = AppearanceRandomizer if appearance_keys \u0026 set(video_augmentation) else ClipAugment\n            video_augmentation = augmentation_type(**video_augmentation)\n        self.video_augmentation = video_augmentation if is_training_set else None\n        roots = [Path(item).expanduser().resolve() for item in dataset_dirs]\n        if val_set_proportion and val_split_level == \"root\":\n            selected = np.arange(len(roots))\n            np.random.default_rng(seed).shuffle(selected)\n            boundary = int(len(selected) * (1 - val_set_proportion))\n            selected = selected[:boundary] if is_training_set else selected[boundary:]\n            roots = [roots[item] for item in sorted(selected)]\n        self.episodes = []\n        fps = set()\n        import pyarrow.parquet as pq\n\n        for root in roots:\n            info = json.loads((root / \"meta/info.json\").read_text(encoding=\"utf-8\"))\n            if str(info.get(\"codebase_version\", \"v2\")).startswith(\"v3\"):\n                raise ValueError(f\"LeRobot v3 root cannot be opened as v2: {root}\")\n            root_fps = float(info[\"fps\"])\n            if not np.isfinite(root_fps) or root_fps \u003c= 0:\n                raise ValueError(f\"Dataset FPS must be finite and positive: {root}\")\n            fps.add(root_fps)\n            chunk_size = int(info.get(\"chunks_size\", 1000))\n            episode_meta = _json_lines(root / \"meta/episodes.jsonl\")\n            indices = sorted(int(item[\"episode_index\"]) for item in episode_meta)\n            if not indices:\n                indices = list(range(int(info[\"total_episodes\"])))\n            cfg = episode_index_filter or {}\n            if cfg.get(\"mode\", \"none\") in {\"periodic_prefix\", \"periodic_first\", \"first_k_per_period\"}:\n                period, first, offset = int(cfg[\"period\"]), int(cfg[\"keep_first\"]), int(cfg.get(\"offset\", 0))\n                if period \u003c= 0 or not 0 \u003c= first \u003c= period:\n                    raise ValueError(\"Invalid periodic episode filter\")\n                indices = [index for index in indices if (index - offset) % period \u003c first]\n            elif cfg.get(\"mode\", \"none\") not in {\"none\", \"all\", \"\"}:\n                raise ValueError(f\"Unknown episode filter: {cfg.get('mode')}\")\n            if val_set_proportion and val_split_level == \"episode\":\n                np.random.default_rng(seed).shuffle(indices)\n                boundary = int(len(indices) * (1 - val_set_proportion))\n                indices = indices[:boundary] if is_training_set else indices[boundary:]\n            tasks = {int(item[\"task_index\"]): item[\"task\"] for item in _json_lines(root / \"meta/tasks.jsonl\")}\n            filter_path = nonidle_filter_path\n            if isinstance(filter_path, dict):\n                if str(root) not in filter_path:\n                    raise KeyError(f\"No nonidle filter configured for root {root}\")\n                filter_path = filter_path[str(root)]\n            ranges = {}\n            if filter_path is not None:\n                payload = json.loads(Path(filter_path).expanduser().read_text(encoding=\"utf-8\"))\n                ranges = payload.get(\"episodes\", payload)\n            for index in indices:\n                template = info.get(\"data_path\", \"data/chunk-{episode_chunk:03d}/episode_{episode_index:06d}.parquet\")\n                path = root / template.format(episode_chunk=index // chunk_size, episode_index=index)\n                parquet = pq.ParquetFile(path)\n                if self.require_subtask_labels and self.subtask_column not in parquet.schema_arrow.names:\n                    raise KeyError(f\"Missing required subtask labels {self.subtask_column!r}: {path}\")\n                length = parquet.metadata.num_rows\n                if \"timestamp\" in parquet.schema_arrow.names:\n                    times = np.asarray(parquet.read(columns=[\"timestamp\"])[\"timestamp\"].to_pylist(), dtype=np.float64)\n                    if not np.isfinite(times).all() or (len(times) \u003e 1 and np.any(np.abs(np.diff(times) - 1 / root_fps) \u003e self.video_tolerance)):\n                        raise ValueError(f\"Episode timestamps do not match dataset FPS: {path}\")\n                if str(index) in ranges:\n                    chosen = set()\n                    for start, end in ranges[str(index)]:\n                        chosen.update(range(max(0, int(start)), min(length, int(end))))\n                    rows = np.array(sorted(chosen), dtype=np.int64)\n                else:\n                    rows = np.arange(length, dtype=np.int64)\n                if len(rows):\n                    self.episodes.append(_Episode(root, index, path, info, rows, tasks, tuple(parquet.schema_arrow.names)))\n        if len(fps) != 1:\n            raise ValueError(f\"Dataset roots must share FPS, received {sorted(fps)}\")\n        if not self.episodes:\n            raise ValueError(\"The selected split and filters contain no episode frames\")\n        self.ends = np.cumsum([len(item.rows) for item in self.episodes]).tolist()\n        self.processor = processor or SampleProcessor(shape_meta)\n        self.processor.train() if is_training_set else self.processor.eval()\n        if pretrained_norm_stats:\n            statistics = read_statistics(pretrained_norm_stats)\n        elif is_training_set:\n            statistics = self.compute_statistics()\n        else:\n            raise ValueError(\"Validation requires training normalization statistics\")\n        self.statistics = statistics\n        self.processor.set_normalizer_from_stats(statistics)\n        self.fingerprint = self._fingerprint()\n\n    def _fingerprint(self):\n        \"\"\"Hash metadata, statistics, selection, and media/cache file metadata.\n\n        Media/cache files use path, size, and mtime; full payloads and paths\n        embedded in image columns are excluded.\n        \"\"\"\n        def canonical(value):\n            if isinstance(value, Path):\n                return str(value)\n            if isinstance(value, torch.Tensor):\n                return value.detach().cpu().tolist()\n            if isinstance(value, np.ndarray):\n                return value.tolist()\n            if isinstance(value, Mapping):\n                return {str(key): canonical(item) for key, item in value.items()}\n            if isinstance(value, Sequence) and not isinstance(value, (str, bytes)):\n                return [canonical(item) for item in value]\n            return value\n\n        roots = {}\n        for episode in self.episodes:\n            if str(episode.root) not in roots:\n                roots[str(episode.root)] = {name: (episode.root / \"meta\" / name).read_text(encoding=\"utf-8\") if (episode.root / \"meta\" / name).exists() else None for name in (\"info.json\", \"episodes.jsonl\", \"tasks.jsonl\")}\n        processor_config = {name: getattr(self.processor, name) for name in (\"action_output_dim\", \"proprio_output_dim\", \"norm_default_mode\", \"norm_exception_mode\", \"stepwise\", \"relative_joint_keys\", \"delta_action_dim_mask\", \"training\")}\n\n        def file_metadata(path):\n            path = Path(path).expanduser().resolve()\n            stat = path.stat()\n            return {\"path\": str(path), \"size\": stat.st_size, \"mtime_ns\": stat.st_mtime_ns}\n\n        videos = [file_metadata(self._video_path(episode, column)) for episode in self.episodes for meta in self.shape_meta[\"images\"] if (column := _column_name(meta, \"images\")) not in episode.columns]\n        cache_directories = []\n        for cache in (self.text_cache if self.require_text_cache else None, self.qwen_cache):\n            if cache is not None:\n                directory = Path(cache).expanduser().resolve()\n                if not directory.is_dir():\n                    raise ValueError(f\"Text cache must be an existing directory: {directory}\")\n                cache_directories.append({\"directory\": str(directory), \"files\": [file_metadata(path) for path in sorted(directory.rglob(\"*.pt\"))]})\n        payload = {\n            \"scope\": \"metadata_statistics_selection_and_media_cache_stat_v2\", \"roots\": roots,\n            \"episodes\": [{\"root\": str(item.root), \"index\": item.index, \"rows\": item.rows.tolist(), \"parquet_size\": item.path.stat().st_size, \"parquet_mtime_ns\": item.path.stat().st_mtime_ns} for item in self.episodes],\n            \"videos\": videos, \"cache_directories\": cache_directories,\n            \"shape_meta\": self.shape_meta, \"statistics\": self.statistics, \"processor\": processor_config,\n            \"frames\": self.num_frames, \"frame_stride\": self.frame_stride, \"sample_stride\": self.sample_stride, \"image_steps\": self.image_steps,\n            \"video_size\": self.video_size, \"layout\": self.layout, \"robotwin_layout\": self.robotwin_layout,\n            \"prompt_template\": self.prompt_template, \"override_instruction\": self.override_instruction,\n            \"text_cache\": self.text_cache, \"require_text_cache\": self.require_text_cache, \"context_len\": self.context_len,\n            \"qwen_cache\": self.qwen_cache, \"qwen_context_len\": self.qwen_context_len, \"qwen_format\": self.qwen_format,\n            \"video_tolerance\": self.video_tolerance, \"augmentation\": vars(self.video_augmentation) if self.video_augmentation else None,\n            \"history\": vars(self.history_selector), \"separate_camera_views\": self.separate_camera_views,\n            \"include_vl_inputs\": self.include_vl_inputs, \"vl_image_size\": self.vl_image_size,\n            \"head_camera_key\": self.head_camera_key, \"subtask_column\": self.subtask_column,\n            \"require_subtask_labels\": self.require_subtask_labels,\n        }\n        return sha256(json.dumps(canonical(payload), sort_keys=True, separators=(\",\", \":\")).encode()).hexdigest()\n\n    def __len__(self):\n        return (self.ends[-1] + self.sample_stride - 1) // self.sample_stride\n\n    @staticmethod\n    def _table(path):\n        path = Path(path)\n        stat = path.stat()\n        return EpisodeDataset._read_table(str(path), stat.st_size, stat.st_mtime_ns)\n\n    @staticmethod\n    @lru_cache(maxsize=4)\n    def _read_table(path, size, mtime_ns):\n        \"\"\"Size and modification time invalidate cached reads after replacement.\"\"\"\n        import pyarrow.parquet as pq\n        return pq.read_table(path)\n\n    @staticmethod\n    def _embedded_frame(value, root):\n        if isinstance(value, dict):\n            source = BytesIO(value[\"bytes\"]) if value.get(\"bytes\") is not None else root / value[\"path\"]\n            with Image.open(source) as image:\n                return torch.from_numpy(np.array(image.convert(\"RGB\"))).permute(2, 0, 1)\n        tensor = torch.as_tensor(np.asarray(value))\n        return tensor.permute(2, 0, 1) if tensor.shape[-1] == 3 else tensor\n\n    def _video_frames(self, episode, column, rows, table):\n        if column in table.column_names:\n            values = table[column].take(rows.tolist()).to_pylist()\n            return torch.stack([self._embedded_frame(value, episode.root) for value in values])\n        path = self._video_path(episode, column)\n        if \"timestamp\" in table.column_names:\n            times = np.asarray(table[\"timestamp\"].take(rows.tolist()).to_pylist(), dtype=np.float64)\n        else:\n            times = rows / float(episode.info[\"fps\"])\n        import av\n\n        targets = sorted(set(times.tolist()))\n        frames = {}\n        tolerance = self.video_tolerance\n        with av.open(str(path)) as container:\n            stream = container.streams.video[0]\n            container.seek(max(0, int((targets[0] - tolerance) * av.time_base)), backward=True)\n            for frame in container.decode(stream):\n                if frame.time is None:\n                    continue\n                current = float(frame.time)\n                for target in targets:\n                    distance = abs(current - target)\n                    if distance \u003c= tolerance and (target not in frames or distance \u003c frames[target][0]):\n                        frames[target] = (distance, torch.from_numpy(frame.to_ndarray(format=\"rgb24\")).permute(2, 0, 1))\n                if current \u003e targets[-1] + tolerance:\n                    break\n        if any(target not in frames for target in targets):\n            raise RuntimeError(f\"Could not decode requested timestamps from {path}\")\n        return torch.stack([frames[float(target)][1] for target in times])\n\n    @staticmethod\n    def _video_path(episode, column):\n        template = episode.info.get(\"video_path\", \"videos/chunk-{episode_chunk:03d}/{video_key}/episode_{episode_index:06d}.mp4\")\n        return episode.root / template.format(episode_chunk=episode.index // int(episode.info.get(\"chunks_size\", 1000)), episode_index=episode.index, video_key=column)\n\n    def _fields(self, episode, table, positions):\n        result = {}\n        for field, steps in ((\"action\", self.horizon), (\"state\", self.num_frames)):\n            raw = episode.rows[np.minimum(positions[:steps], len(episode.rows) - 1)]\n            result[field] = {}\n            for meta in self.shape_meta[field]:\n                value = _feature_tensor(table, _column_name(meta, field), raw)\n                if value.shape[-1] != meta.get(\"raw_shape\", meta[\"shape\"]):\n                    raise ValueError(f\"Raw {field} width differs from shape metadata for {meta['key']}\")\n                result[field][meta[\"key\"]] = value\n        return result\n\n    def __getitem__(self, index):\n        if index \u003c 0:\n            index += len(self)\n        if not 0 \u003c= index \u003c len(self):\n            raise IndexError(index)\n        rank = index * self.sample_stride\n        episode_position = bisect_right(self.ends, rank)\n        episode = self.episodes[episode_position]\n        start = rank - (self.ends[episode_position - 1] if episode_position else 0)\n        positions = start + np.arange(self.num_frames) * self.frame_stride\n        padded = torch.from_numpy(positions \u003e= len(episode.rows))\n        table = self._table(str(episode.path))\n        fields = self._fields(episode, table, positions)\n        image_rows = episode.rows[np.minimum(positions[self.image_steps], len(episode.rows) - 1)]\n        task_index = int(table[\"task_index\"][int(episode.rows[start])].as_py()) if \"task_index\" in table.column_names else 0\n        task = episode.tasks.get(task_index)\n        if task is None and \"task\" in table.column_names:\n            task = table[\"task\"][int(episode.rows[start])].as_py()\n        if task is None and self.override_instruction is None:\n            raise KeyError(f\"Missing task instruction in {episode.root}\")\n        sample = {**fields, \"task\": self.override_instruction or task,\n                  \"images\": {meta[\"key\"]: self._video_frames(episode, _column_name(meta, \"images\"), image_rows, table) for meta in self.shape_meta[\"images\"]},\n                  \"action_is_pad\": padded[:-1], \"state_is_pad\": padded,\n                  \"image_is_pad\": padded[self.image_steps]}\n        for key in (\"action_dim_is_pad\", \"state_dim_is_pad\", \"embodiment\"):\n            if key in table.column_names:\n                sample[key] = table[key][int(episode.rows[start])].as_py()\n        if \"embodiment\" in sample:\n            sample[\"embodiment\"] = str(sample[\"embodiment\"])\n        result = self.processor.preprocess(sample)\n        cameras = result.pop(\"images\")\n        history_clips = []\n        if self.include_vl_inputs:\n            head = next(item for item in self.shape_meta[\"images\"] if item[\"key\"] == self.head_camera_key)\n            clean_current = prepare_rgb(sample[\"images\"][self.head_camera_key][:1])\n            result[\"vl_current\"] = resize_clip(clean_current, (self.vl_image_size,) * 2)[0] * 2 - 1\n            current_row = int(episode.rows[start])\n            fps = float(episode.info[\"fps\"])\n            for vision_language in (False, True):\n                rows, valid = self.history_selector.select(\n                    current_row, fps, training=self.training, vision_language=vision_language,\n                )\n                if len(rows):\n                    frames = prepare_rgb(self._video_frames(episode, _column_name(head, \"images\"), rows, table))\n                else:\n                    frames = clean_current.new_empty((0, *clean_current.shape[1:]))\n                if vision_language:\n                    if len(rows):\n                        frames = resize_clip(frames, (self.vl_image_size,) * 2)\n                    else:\n                        frames = clean_current.new_empty((0, 3, self.vl_image_size, self.vl_image_size))\n                    result[\"vl_history\"] = (frames * 2 - 1).masked_fill(~valid[:, None, None, None], 0)\n                    result[\"vl_history_valid\"] = valid\n                else:\n                    if len(rows):\n                        frames = resize_clip(frames, head[\"shape\"][-2:])\n                    result[\"history_valid\"] = valid\n                    history_clips = [frame.unsqueeze(0) for frame in frames]\n        if self.video_augmentation is not None:\n            augmented = self.video_augmentation(cameras + history_clips)\n            cameras, history_clips = augmented[:len(cameras)], augmented[len(cameras):]\n        if self.separate_camera_views:\n            if len({tuple(camera.shape) for camera in cameras}) != 1:\n                raise ValueError(\"Separate camera views require equal temporal and image shapes\")\n            result[\"camera_video\"] = torch.stack([(camera * 2 - 1).permute(1, 0, 2, 3) for camera in cameras])\n        if self.include_vl_inputs:\n            if history_clips:\n                history = torch.cat(history_clips, 0) * 2 - 1\n            else:\n                history = cameras[0].new_empty((0, 3, *cameras[0].shape[-2:]))\n            result[\"history_video\"] = history.masked_fill(~result[\"history_valid\"][:, None, None, None], 0)\n        if self.subtask_column is not None:\n            label = table[self.subtask_column][int(episode.rows[start])].as_py() if self.subtask_column in table.column_names else None\n            if self.require_subtask_labels and (not isinstance(label, str) or not label.strip()):\n                raise ValueError(f\"Invalid subtask label at row {episode.rows[start]}: {episode.path}\")\n            if label is not None:\n                if not isinstance(label, str):\n                    raise ValueError(\"Subtask labels must be sentence strings\")\n                result[\"subtask\"] = label\n        result[\"video\"] = compose_cameras(cameras, self.layout, self.video_size, self.robotwin_layout)\n        result[\"proprio\"] = result[\"proprio\"][:-1]\n        result[\"proprio_is_pad\"] = result[\"proprio_is_pad\"][:-1]\n        prompt = self.prompt_template.format(task=result[\"instruction\"])\n        result[\"prompt\"] = result[\"instruction\"] = prompt\n        if self.require_text_cache:\n            path = Path(self.text_cache).expanduser() / f\"{sha256(prompt.encode()).hexdigest()}.t5_len{self.context_len}.wan22ti2v5b.pt\"\n            payload = torch.load(path, map_location=\"cpu\", weights_only=True)\n            context, mask = payload[\"context\"].clone(), payload[\"mask\"].bool()\n            if context.ndim != 2 or context.shape[0] != self.context_len or mask.shape != (self.context_len,):\n                raise ValueError(f\"Unexpected text cache shape: {path}\")\n            context[~mask] = 0\n            result.update(context=context, context_mask=torch.ones_like(mask), text_cache_format=\"t5\")\n        if self.qwen_cache:\n            if self.qwen_format not in {\"qwen2_5_vl\", \"qwen3_flux2\"}:\n                raise ValueError(f\"Unsupported text cache format {self.qwen_format}\")\n            path = Path(self.qwen_cache).expanduser() / f\"{sha256(prompt.encode()).hexdigest()}.{self.qwen_format}_len{self.qwen_context_len}.pt\"\n            payload = torch.load(path, map_location=\"cpu\", weights_only=True)\n            text, mask = payload[\"text_hidden_states\"], payload[\"text_attention_mask\"].bool()\n            if text.ndim != 2 or text.shape[0] != self.qwen_context_len or mask.shape != (self.qwen_context_len,):\n                raise ValueError(f\"Unexpected text cache shape: {path}\")\n            if self.qwen_format == \"qwen3_flux2\":\n                result.update(text_tokens=text, text_valid=mask)\n            else:\n                result.update(text_hidden_states=text, text_attention_mask=mask)\n            result[\"text_cache_format\"] = self.qwen_format\n        if \"embodiment\" in sample:\n            result[\"embodiment\"] = sample[\"embodiment\"]\n        return result\n\n    def compute_statistics(self):\n        \"\"\"Preserve equal-episode weighting and the source episode-quantile envelope.\"\"\"\n        grouped = {}\n        for episode in self.episodes:\n            table = self._table(str(episode.path))\n            embodiment = str(table[\"embodiment\"][int(episode.rows[0])].as_py()) if \"embodiment\" in table.column_names else \"default\"\n            group = grouped.setdefault(embodiment, {field: {meta[\"key\"]: [] for meta in self.shape_meta[field]} for field in (\"action\", \"state\")})\n            fields = {field: {meta[\"key\"]: _feature_tensor(table, _column_name(meta, field), episode.rows) for meta in self.shape_meta[field]} for field in (\"action\", \"state\")}\n            actions = {}\n            for key, values in fields[\"action\"].items():\n                offsets = np.arange(len(values))[:, None] + np.arange(self.horizon)[None, :] * self.frame_stride\n                actions[key] = values[np.minimum(offsets, len(values) - 1)]\n            fields = self.processor.transform_fields({\"action\": actions, \"state\": {key: value.unsqueeze(1) for key, value in fields[\"state\"].items()}})\n            for field in group:\n                for key, value in fields[field].items():\n                    mask_name = \"action_dim_is_pad\" if field == \"action\" else \"state_dim_is_pad\"\n                    if mask_name in table.column_names and len(self.shape_meta[field]) == 1:\n                        mask = torch.as_tensor(table[mask_name][int(episode.rows[0])].as_py(), dtype=torch.bool)\n                        value = value.masked_fill(mask, 0)\n                    stats = {}\n                    stats[\"stepwise_mean\"] = value.mean(0)\n                    stats[\"stepwise_var\"] = value.var(0, correction=1) if value.shape[0] \u003e 1 else torch.zeros_like(value.mean(0))\n                    stats[\"stepwise_min\"] = value.amin(0)\n                    stats[\"stepwise_max\"] = value.amax(0)\n                    stats[\"stepwise_q01\"] = torch.quantile(value, 0.01, dim=0)\n                    stats[\"stepwise_q99\"] = torch.quantile(value, 0.99, dim=0)\n                    flattened = value.flatten(0, 1)\n                    stats[\"global_mean\"] = flattened.mean(0)\n                    stats[\"global_var\"] = flattened.var(0, correction=1) if flattened.shape[0] \u003e 1 else torch.zeros_like(flattened.mean(0))\n                    stats[\"global_q01\"] = torch.quantile(flattened, 0.01, dim=0)\n                    stats[\"global_q99\"] = torch.quantile(flattened, 0.99, dim=0)\n                    group[field][key].append(stats)\n        merged = {}\n        per_embodiment = set(grouped) != {\"default\"}\n        for embodiment, group in grouped.items():\n            result = {\"action\": {}, \"state\": {}}\n            for field, features in group.items():\n                for key, episodes in features.items():\n                    stats = {}\n                    means = torch.stack([item[\"stepwise_mean\"] for item in episodes])\n                    variances = torch.stack([item[\"stepwise_var\"] for item in episodes])\n                    mean = means.mean(0)\n                    global_mean = means.mean((0, 1))\n                    stats[\"stepwise_mean\"] = mean\n                    stats[\"stepwise_std\"] = (variances + (means - mean) ** 2).mean(0).sqrt()\n                    stats[\"global_mean\"] = global_mean\n                    stats[\"global_std\"] = (variances + (means - global_mean) ** 2).mean((0, 1)).sqrt()\n                    for name, reduction in ((\"min\", \"amin\"), (\"max\", \"amax\"), (\"q01\", \"amin\"), (\"q99\", \"amax\")):\n                        stepwise = getattr(torch.stack([item[\"stepwise_\" + name] for item in episodes]), reduction)(0)\n                        stats[\"stepwise_\" + name] = stepwise\n                        stats[\"global_\" + name] = getattr(stepwise, reduction)(0)\n                    if per_embodiment:\n                        global_means = torch.stack([item[\"global_mean\"] for item in episodes])\n                        global_variances = torch.stack([item[\"global_var\"] for item in episodes])\n                        global_mean = global_means.mean(0)\n                        stats[\"global_mean\"] = global_mean\n                        stats[\"global_std\"] = (global_variances + (global_means - global_mean) ** 2).mean(0).sqrt()\n                        for name, reduction in ((\"q01\", \"amin\"), (\"q99\", \"amax\")):\n                            stats[\"global_\" + name] = getattr(torch.stack([item[\"global_\" + name] for item in episodes]), reduction)(0)\n                    result[field][key] = stats\n            merged[embodiment] = result\n        metadata = {\"num_episodes\": len(self.episodes), \"num_transition\": self.ends[-1]}\n        return {**metadata, **merged[\"default\"]} if set(merged) == {\"default\"} else {**metadata, \"type\": \"per_embodiment\", \"embodiments\": merged}\n","sha256":"f2dc0594f31360709cd6adf8c07b84a71a3fb558dbcb2fd46b85f500f1bf0a4a"},"configs/robotwin.yaml":{"text":"# Development recipe; GPU parity unverified.\nmodel:\n  _target_: patchwam.models.FluxAssetPolicy.from_local_assets\n  transformer_path: ${oc.env:PATCHWAM_TRANSFORMER}\n  autoencoder_path: ${oc.env:PATCHWAM_AUTOENCODER}\n  text_encoder_path: ${oc.env:PATCHWAM_TEXT_ENCODER}\n  flux_source: ${oc.env:FLUX2_SRC}\n  action_dim: ${data.processor.action_output_dim}\n  proprio_dim: ${data.processor.proprio_output_dim}\n  variant: klein-base-4b\n  dtype: bfloat16\n  device: cuda\n  context_length: 128\n  shift: 5.0\n  video_weight: 0.5\n  action_weight: 1.0\n  action_scale: 1.0\n  gradient_checkpointing: true\ndata:\n  _target_: patchwam.data.EpisodeDataset\n  dataset_dirs:\n  - ${oc.env:PATCHWAM_DATA_ROOT}\n  num_frames: 17\n  endpoint_frames_only: true\n  action_video_freq_ratio: 1\n  global_sample_stride: 1\n  sample_index_stride: 1\n  video_size:\n  - 288\n  - 256\n  concat_multi_camera: robotwin\n  robotwin_camera_layout: compact_288x256\n  val_set_proportion: 0.01\n  is_training_set: true\n  pretrained_norm_stats: ${oc.env:PATCHWAM_NORM_STATS}\n  nonidle_filter_path: ${oc.env:PATCHWAM_NONIDLE_FILTER}\n  shape_meta:\n    images:\n    - key: cam_high\n      raw_shape:\n      - 3\n      - 480\n      - 640\n      shape:\n      - 3\n      - 240\n      - 320\n    - key: cam_left_wrist\n      raw_shape:\n      - 3\n      - 480\n      - 640\n      shape:\n      - 3\n      - 240\n      - 320\n    - key: cam_right_wrist\n      raw_shape:\n      - 3\n      - 480\n      - 640\n      shape:\n      - 3\n      - 240\n      - 320\n    action:\n    - key: default\n      raw_shape: 14\n      shape: 14\n    state:\n    - key: default\n      raw_shape: 14\n      shape: 14\n  processor:\n    _target_: patchwam.data.SampleProcessor\n    shape_meta: ${data.shape_meta}\n    action_output_dim: 14\n    proprio_output_dim: 14\n    norm_default_mode: z-score\n    use_stepwise_action_norm: false\n  video_augmentation:\n    _target_: patchwam.data.ClipAugment\n    p: 0.5\n    augment_types:\n    - corrupt_only\n    - color_only\n    - both\n    color_jitter:\n      brightness: 0.2\n      contrast: 0.2\n      saturation: 0.2\n      hue: 0.03\n    gamma:\n      range:\n      - 0.9\n      - 1.1\n    gaussian_noise:\n      std: 0.01\n    random_resized_crop:\n      scale:\n      - 0.95\n      - 1.0\n      ratio: preserve\n    rotate:\n      degrees: 5.0\n      fill: mean\ntraining:\n  output_dir: runs/robotwin\n  epochs: 5\n  max_updates: null\n  batch_size: 4\n  accumulation: 2\n  learning_rate: 0.0001\n  weight_decay: 0.01\n  precision: bf16\n  workers: 16\n  gradient_clip: 1.0\n  checkpoint_every: 5000\n  log_every: 10\n  seed: 42\n  betas:\n  - 0.9\n  - 0.95\n  warmup_fraction: 0.05\n  minimum_lr_fraction: 0.01\n  global_batch_size: 256\n","sha256":"81b4fae445086125430af711f1f3da697875a2dab652ac88ba42f3497398aea4"},"src/patchwam/data/cameras.py":{"text":"\"\"\"Camera composition and temporally consistent RGB preparation.\n\nSPDX-License-Identifier: MIT\nCopyright (c) 2026 Yuyang \"Alice.L\"\nSource contract attribution: LICENSE-MIT and PROVENANCE.json.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport torch\nimport torch.nn.functional as F\n\n\ndef resize_clip(clip: torch.Tensor, size, mode=\"bilinear\") -\u003e torch.Tensor:\n    \"\"\"Resize a TCHW RGB clip in [0, 1].\"\"\"\n    return F.interpolate(clip, size=tuple(size), mode=mode, align_corners=False, antialias=True)\n\n\ndef prepare_rgb(value) -\u003e torch.Tensor:\n    rgb = torch.as_tensor(value)\n    if rgb.ndim != 4:\n        raise ValueError(f\"Expected TCHW or THWC camera frames, received {tuple(rgb.shape)}\")\n    if rgb.shape[1] != 3 and rgb.shape[-1] == 3:\n        rgb = rgb.permute(0, 3, 1, 2)\n    if rgb.shape[1] != 3:\n        raise ValueError(\"Camera frames must have three RGB channels\")\n    return rgb.float() / 255 if rgb.dtype == torch.uint8 else rgb.float()\n\n\ndef compose_cameras(clips, layout=\"horizontal\", size=(224, 448), robotwin_layout=\"compact_288x256\"):\n    \"\"\"Return CTHW video in [-1, 1], preserving camera order from shape metadata.\"\"\"\n    clips = [prepare_rgb(clip) for clip in clips]\n    if not clips:\n        raise ValueError(\"At least one camera is required\")\n    if layout == \"robotwin\":\n        if len(clips) != 3:\n            raise ValueError(\"RoboTwin composition requires head, left wrist, right wrist cameras\")\n        if robotwin_layout in {\"compact\", \"compact_288x256\", \"288x256\"}:\n            top, wrist = (192, 256), (96, 128)\n        elif robotwin_layout in {\"legacy\", \"legacy_384x320\", \"384x320\"}:\n            top, wrist = (256, 320), (128, 160)\n        else:\n            raise ValueError(f\"Unknown RoboTwin camera layout: {robotwin_layout}\")\n        result = torch.cat((resize_clip(clips[0], top), torch.cat([resize_clip(clip, wrist) for clip in clips[1:]], -1)), -2)\n    elif len(clips) == 1:\n        result = clips[0]\n    elif layout in {\"horizontal\", \"vertical\"}:\n        result = torch.cat(clips, -1 if layout == \"horizontal\" else -2)\n    else:\n        raise ValueError(f\"Unsupported camera layout: {layout!r}\")\n    height, width = result.shape[-2:]\n    scale = max(size[0] / height, size[1] / width)\n    result = resize_clip(result, (int(height * scale + 0.5), int(width * scale + 0.5)), mode=\"bicubic\")\n    offset_h, offset_w = round((result.shape[-2] - size[0]) / 2), round((result.shape[-1] - size[1]) / 2)\n    result = result[..., offset_h:offset_h + size[0], offset_w:offset_w + size[1]]\n    return (result * 2 - 1).permute(1, 0, 2, 3).contiguous()\n","sha256":"5a1912b12bdaaed363335857240272cc70b71114a1295451e2cc608f05c8bf1f"},"src/patchwam/data/augmentation.py":{"text":"\"\"\"Clip augmentation preserving the attributed data-processing recipe.\n\nSPDX-License-Identifier: MIT\nCopyright (c) 2026 Yuyang \"Alice.L\"\nSee LICENSE-MIT and PROVENANCE.json in this directory.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport torch\nfrom torchvision.transforms import RandomResizedCrop\nfrom torchvision.transforms import functional as vision\n\n\nclass ClipAugment:\n    \"\"\"Use one probability draw per sample and shared temporal parameters per view.\"\"\"\n\n    def __init__(self, p=1.0, augment_types=(\"corrupt_only\", \"color_only\", \"both\"),\n                 color_jitter=None, gamma=None, exposure=None, gaussian_noise=None,\n                 random_resized_crop=None, rotate=None):\n        if not 0 \u003c= p \u003c= 1:\n            raise ValueError(\"Augmentation probability must be between 0 and 1\")\n        self.p = p\n        self.types = tuple(augment_types) or (\"both\",)\n        if not set(self.types) \u003c= {\"corrupt_only\", \"color_only\", \"both\"}:\n            raise ValueError(\"Unknown augmentation group\")\n        self.color = color_jitter or {}\n        self.gamma, self.exposure = gamma or {}, exposure or {}\n        self.noise, self.crop, self.rotate = gaussian_noise or {}, random_resized_crop or {}, rotate or {}\n\n    @staticmethod\n    def _uniform(low, high, device):\n        return float(torch.empty((), device=device).uniform_(low, high))\n\n    def _view(self, frames):\n        if frames.ndim != 4 or not frames.is_floating_point() or frames.min() \u003c -1e-6 or frames.max() \u003e 1 + 1e-6:\n            raise ValueError(\"ClipAugment expects float TCHW frames in [0, 1]\")\n        group = self.types[int(torch.randint(len(self.types), ()))]\n        if group in {\"color_only\", \"both\"}:\n            operators = []\n            for key, function in ((\"brightness\", vision.adjust_brightness), (\"contrast\", vision.adjust_contrast), (\"saturation\", vision.adjust_saturation), (\"hue\", vision.adjust_hue)):\n                amount = float(self.color.get(key, 0))\n                if amount \u003e 0:\n                    low, high = (-min(amount, 0.5), min(amount, 0.5)) if key == \"hue\" else (max(0, 1 - amount), 1 + amount)\n                    operators.append((function, self._uniform(low, high, frames.device)))\n            for index in torch.randperm(len(operators)).tolist():\n                function, factor = operators[index]\n                frames = function(frames, factor)\n            if self.gamma:\n                frames = vision.adjust_gamma(frames.clamp(0, 1), self._uniform(*self.gamma.get(\"range\", [0.9, 1.1]), frames.device))\n            if self.exposure:\n                ev = self._uniform(*self.exposure.get(\"ev_range\", self.exposure.get(\"range\", [-0.1, 0.1])), frames.device)\n                frames = frames * 2 ** ev\n        if group in {\"corrupt_only\", \"both\"} and self.noise:\n            noise = torch.randn((1, *frames.shape[1:]), device=frames.device, dtype=frames.dtype)\n            frames = frames + noise * float(self.noise.get(\"std\", 0.01))\n        if self.crop:\n            height, width = frames.shape[-2:]\n            scale, ratio = self.crop.get(\"scale\", [0.95, 1]), self.crop.get(\"ratio\", \"preserve\")\n            if ratio == \"preserve\":\n                fraction = self._uniform(*scale, frames.device)\n                crop_h, crop_w = max(1, min(height, round(height * fraction))), max(1, min(width, round(width * fraction)))\n                top, left = int(torch.randint(height - crop_h + 1, (), device=frames.device)), int(torch.randint(width - crop_w + 1, (), device=frames.device))\n            else:\n                top, left, crop_h, crop_w = RandomResizedCrop.get_params(frames[0], tuple(scale), tuple(ratio))\n            frames = vision.resized_crop(frames, top, left, crop_h, crop_w, [height, width], vision.InterpolationMode.BILINEAR, antialias=True)\n        if self.rotate:\n            degrees = self.rotate.get(\"degrees\", 5.0)\n            bounds = degrees if isinstance(degrees, (list, tuple)) else [-float(degrees), float(degrees)]\n            fill = self.rotate.get(\"fill\", \"mean\")\n            frames = vision.rotate(frames, self._uniform(*bounds, frames.device), vision.InterpolationMode.BILINEAR, fill=float(frames.mean()) if fill == \"mean\" else fill)\n        return frames.clamp(0, 1)\n\n    def __call__(self, views):\n        if float(torch.rand(())) \u003e= self.p:\n            return views\n        return [self._view(view) for view in views]\n","sha256":"5f42bf63b2e5fbcc282409c66f7d2523572bbc0faf16b716cb0a2735f211c617"},"src/patchwam/data/processing.py":{"text":"\"\"\"Robot feature assembly with explicit temporal and dimension validity.\n\nSPDX-License-Identifier: MIT\nCopyright (c) 2026 Yuyang \"Alice.L\"\nSource contract attribution: LICENSE-MIT and PROVENANCE.json.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom copy import deepcopy\n\nimport torch\nimport torch.nn.functional as F\n\nfrom .cameras import prepare_rgb, resize_clip\nfrom .scaling import RobotFeatureCodec\n\n\nclass SampleProcessor:\n    def __init__(self, shape_meta, action_output_dim=None, proprio_output_dim=None,\n                 norm_default_mode=\"q01/q99\", norm_exception_mode=None,\n                 use_stepwise_action_norm=False, relative_joint_keys=None,\n                 delta_action_dim_mask=None):\n        self.shape_meta = deepcopy(shape_meta)\n        self.action_output_dim = action_output_dim or sum(item[\"shape\"] for item in shape_meta[\"action\"])\n        self.proprio_output_dim = proprio_output_dim or sum(item[\"shape\"] for item in shape_meta[\"state\"])\n        self.norm_default_mode = norm_default_mode\n        self.norm_exception_mode = norm_exception_mode\n        self.stepwise = use_stepwise_action_norm\n        self.relative_joint_keys = relative_joint_keys or []\n        self.delta_action_dim_mask = delta_action_dim_mask or {}\n        for key, mask in self.delta_action_dim_mask.items():\n            meta = next((item for item in shape_meta[\"action\"] if item[\"key\"] == key), None)\n            if meta is None or len(mask) != meta[\"shape\"]:\n                raise ValueError(f\"Invalid delta action dimension mask for {key}\")\n        self.codec = None\n        self.training = True\n\n    def train(self):\n        self.training = True\n        return self\n\n    def eval(self):\n        self.training = False\n        return self\n\n    def set_normalizer_from_stats(self, statistics):\n        self.codec = RobotFeatureCodec(self.shape_meta, statistics, self.norm_default_mode, self.norm_exception_mode, self.stepwise)\n        return self\n\n    def transform_fields(self, fields):\n        result = {field: {key: value.clone() for key, value in values.items()} for field, values in fields.items()}\n        for key in self.relative_joint_keys:\n            result[\"action\"][key] -= result[\"state\"][key][..., :1, :]\n        for field, values in result.items():\n            for item in self.shape_meta[field]:\n                if values[item[\"key\"]].shape[-1] != item[\"shape\"]:\n                    raise ValueError(f\"{field}.{item['key']} has unexpected feature width\")\n        return result\n\n    def _assemble(self, fields, field, target, existing_mask=None):\n        value = torch.cat([fields[field][meta[\"key\"]] for meta in self.shape_meta[field]], -1)\n        width = value.shape[-1]\n        if width \u003e target:\n            raise ValueError(f\"{field} width {width} exceeds requested output width {target}\")\n        mask = torch.arange(target, device=value.device) \u003e= width\n        if existing_mask is not None:\n            supplied = torch.as_tensor(existing_mask, dtype=torch.bool, device=value.device)\n            if supplied.ndim != 1 or supplied.numel() \u003e width:\n                raise ValueError(f\"Invalid {field} dimension mask\")\n            mask[:supplied.numel()] |= supplied\n        return F.pad(value, (0, target - width)).masked_fill(mask, 0), mask\n\n    def preprocess(self, sample):\n        fields = {field: {key: value.clone() for key, value in sample[field].items()} for field in (\"action\", \"state\")}\n        for key, mask in self.delta_action_dim_mask.items():\n            action_pad = sample[\"action_is_pad\"].bool().unsqueeze(-1)\n            fields[\"action\"][key] = fields[\"action\"][key].masked_fill(action_pad \u0026 torch.as_tensor(mask).bool(), 0)\n        fields = self.transform_fields(fields)\n        if self.codec is None:\n            raise RuntimeError(\"Set feature statistics before preprocessing\")\n        fields = self.codec.encode(fields, sample.get(\"embodiment\"))\n        action, action_mask = self._assemble(fields, \"action\", self.action_output_dim, sample.get(\"action_dim_is_pad\"))\n        proprio, proprio_mask = self._assemble(fields, \"state\", self.proprio_output_dim, sample.get(\"state_dim_is_pad\"))\n        images = []\n        for item in self.shape_meta[\"images\"]:\n            clip = prepare_rgb(sample[\"images\"][item[\"key\"]])\n            images.append(resize_clip(clip, item[\"shape\"][-2:]))\n        return {\n            \"images\": images, \"action\": action, \"proprio\": proprio,\n            \"action_dim_is_pad\": action_mask, \"proprio_dim_is_pad\": proprio_mask,\n            \"action_is_pad\": sample[\"action_is_pad\"], \"proprio_is_pad\": sample[\"state_is_pad\"],\n            \"image_is_pad\": sample[\"image_is_pad\"], \"instruction\": sample[\"task\"],\n        }\n\n    def decode_actions(self, actions, proprio, embodiment=None):\n        \"\"\"Decode a T/D or B/T/D action tensor without removing horizon steps.\"\"\"\n        if self.codec is None:\n            raise RuntimeError(\"Set feature statistics before decoding actions\")\n        fields = {}\n        for field, value in ((\"action\", actions), (\"state\", proprio)):\n            fields[field] = {}\n            offset = 0\n            for item in self.shape_meta[field]:\n                fields[field][item[\"key\"]] = value[..., offset:offset + item[\"shape\"]]\n                offset += item[\"shape\"]\n        fields = self.codec.decode(fields, embodiment)\n        for key in self.relative_joint_keys:\n            fields[\"action\"][key] += fields[\"state\"][key][..., :1, :]\n        return fields[\"action\"]\n","sha256":"15c6441241cc2f6dd8d44e6f9ed3f032316beb2d115ead15e987b2e4e148808f"},"src/patchwam/data/scaling.py":{"text":"\"\"\"Feature scaling adapted from the attributed data processing implementation.\n\nSPDX-License-Identifier: MIT\nCopyright (c) 2026 Yuyang \"Alice.L\"\nSee LICENSE-MIT and PROVENANCE.json in this directory.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nfrom pathlib
