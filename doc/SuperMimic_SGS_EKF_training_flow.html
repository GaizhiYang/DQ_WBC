<script type="application/json" id="diagram-data">{"title":"DQ 教师策略 · SuperMimic × SGS × EKF","version":"dq-teacher-supermimic-bptt-2026-11-01-v1","date":"2026-11-01","paperFile":"papers/supermimic.pdf","intro":{"title":"保留真实 PPO，让世界模型额外提供动作改进梯度","description":"这是基于当前教师代码与修订方法方案绘制的结构图。已有模块来自 SGS + EKF + PPO；拟新增模块是高层交互世界模型、多步监督和短期 BPTT。真实路径统一指 Isaac Gym 物理仿真。","steps":[{"title":"先看已有的真实训练主线","text":"SGS 决定初态；EKF 参与教师观测；Actor 的高层动作由冻结控制链执行。真实奖励训练 PPO 与 Critic，已完成回合统计更新 SGS。"},{"title":"再看世界模型怎样学动作后果","text":"机器人与物体的真实连续转移进入模型训练。模型以高层动作为条件，自回归预测多步，只更新参数 ω。"},{"title":"重点读短期 BPTT","text":"同一个 Actor 在模型中闭环展开。短期预测奖励与末端真实价值共同给动作提供梯度。本阶段固定模型和 Critic 参数，只更新 θ。"},{"title":"最后检查采样和梯度边界","text":"SGS 重置、模型拟合和想象起点分别采样；真实任务评估检验改进是否有效。冻结不等于 detach，PPO 裁剪也不自动约束额外的 BPTT 更新。"}],"note":"八个视图展示同一方案的不同切面。节点标明已有、拟新增或候选；世界模型宽度、层数、潜变量及想象窗口尚未定型。Actor/Critic 的维度来自当前代码默认配置，不能直接推广到其他开关组合。当前入口仍是普通 PPO；图中拟新增训练路径尚未实现。"},"glossary":[{"id":"policy","term":"Actor / 策略 πθ","plain":"接收当前允许观察的信息，输出高层动作。真实执行和想象展开使用同一套参数 θ。","example":"调整末端的接近方向，同时改变底盘前进或转向。"},{"id":"critic","term":"Critic / 长期价值 Vψ","plain":"估计后续折扣任务回报。主方案通过真实仿真回报训练，并作为短期想象的末端评价。","example":"短期已经抓稳，价值网络评价这个状态离最终成功还有多大回报潜力；数值不是成功概率。"},{"id":"world_model","term":"世界模型 Fω","plain":"预测执行一个高层动作后，机器人、物体及必要历史如何变化。学习的是闭环受控系统的转移。","example":"同一末端命令，在尚未接触和已经夹持物体时会产生不同后果。"},{"id":"bptt","term":"BPTT / 通过时间反向传播","plain":"把多个预测步连接成计算图，将后续收益对前面动作的导数传回 Actor。这里使用短窗口。","example":"预测到两步后物体滑落，梯度可推动第一步调整连续的接近与抬升动作。"},{"id":"frozen","term":"冻结参数与保留输入梯度","plain":"冻结网络自身参数，不等于切断网络输出对输入的导数。策略 BPTT 需要穿过冻结的模型和末端 Critic。","example":"不修改物理预测器，但仍询问它：稍改动作，预测结果会如何改变？"},{"id":"stop","term":"停止梯度 / stop-gradient","plain":"把某个量作为本轮给定条件，不再沿它向过去求导。只用于指定边界。","example":"真实起点和起点前的历史固定；后续预测状态不能逐步 detach。"},{"id":"ppo","term":"PPO / 真实策略优化","plain":"使用近期真实执行轨迹，通过动作概率比、优势和裁剪目标更新策略；价值损失更新 Critic。","example":"真实仿真中物体掉落的结果会影响本轮优势估计。额外 BPTT 梯度不自动受到 PPO 裁剪保护。"},{"id":"gae","term":"GAE / 优势与回报目标","plain":"结合真实奖励和价值估计，衡量一个动作相对当前平均预期的好坏。目标构造后固定。","example":"提前稳定抓住物体并获得更高回报，对应动作可得到正优势。"},{"id":"sgs","term":"SGS / 成功率引导的初态采样","plain":"依据真实已完成回合的成功统计，选择下一批训练初始配置，使训练难度适合当前策略。","example":"full_task、pregrasp、near_goal 是重置类别，不是回合内强制切换的控制阶段。"},{"id":"ekf","term":"EKF / 因果目标预测","plain":"当前教师已有的观测预测器。由截至当前时刻的历史产生目标未来位姿特征，并不以当前动作作为动力学输入。","example":"想象第 2 步的 EKF 输入只能来自起点历史及前两步预测，不可读取真实轨迹的未来答案。"},{"id":"gfm","term":"GFM / 候选抓取注意力","plain":"编码后的物体特征与当前位姿构成查询，对 30 个抓取候选作注意力聚合。Actor 与 Critic 各自拥有一套。","example":"得到 6 维连续聚合结果，不是硬选一个抓取候选编号。"},{"id":"replay","term":"Replay / 真实转移回放","plain":"保存执行动作前后状态及上下文的历史数据，用于世界模型拟合和选择想象起点。","example":"静态 SGS 初态文件只说明从哪里开始，不能替代动作造成了什么变化的数据。"},{"id":"autoregressive","term":"自回归多步预测","plain":"从真实窗口起点开始，后续模型步使用上一步预测状态；真实后续状态只用作监督答案。","example":"第 2 步用第 1 步的预测位置继续推算，才能暴露滚动预测误差。"},{"id":"reparameterization","term":"重参数化连续动作","plain":"把连续动作写成均值加标准差乘固定噪声，使梯度可穿过采样计算。","example":"8 个连续通道在固定噪声下展开；符号阈值夹爪需单独处理。"},{"id":"gripper","term":"夹爪符号动作","plain":"现有第 7 个动作分量通过符号决定开闭。主方案在一次短期 BPTT 中固定模式或短序列。","example":"负值表示闭爪；更负不等于夹得更紧。共享参数更新仍可能间接改变夹爪输出。"},{"id":"distribution","term":"三种采样分布","plain":"真实重置 q_reset、模型拟合窗口 q_fit、可信想象起点 q_imag 是不同用途的分布。","example":"模型暂时预测不准的难场景，仍可保留真实采样来补充数据；暂不用于策略反传。"},{"id":"survival","term":"终止与存活权重","plain":"用每步终止结果决定后续奖励和尾值是否继续累加，同时保留发生终止那一步的奖励。","example":"失败步的惩罚仍计入目标；之后的虚构收益应屏蔽。时间截断与任务终止分开处理。"},{"id":"context","term":"上下文 ξ 与完整状态 x","plain":"固定上下文包括物体属性、物理条件和步长；递推状态包括物理量、控制记忆及必要任务与观测历史。","example":"相同位姿但不同速度、上一条控制命令或保持计数，可能具有不同的后续结果。"}],"views":[{"id":"overview","title":"01 · 训练总览","subtitle":"保留 SGS＋EKF＋真实 PPO，新增高层世界模型和短期策略 BPTT。","summary":"三条学习路径：真实转移训练 ω；真实 PPO 训练 θ、ψ；可信短期 BPTT 只辅助 θ。","formula":"真实 PPO：θ, ψ　＋　真实转移拟合：ω　＋　短期 BPTT：θ（ω/ψ 参数冻结）","formulaNote":"真实＝Isaac Gym 物理执行，不是实机；Critic 主线只使用真实回报学习。","nodes":[{"id":"ov_sgs","title":"SGS 选择真实初态","subtitle":"已有课程，主线继续保留","x":0,"y":0,"branch":"input","status":"random","shapes":["full_task / pregrasp","near_goal"],"note":"通过初态覆盖，提前获得接触与保持经验。","detail":"角色：选择下一回合从哪里开始。\\n作用：为策略与世界模型共同提供有价值的实际交互机会。\\n边界：静态初态库仅提供起点，本身不是状态转移数据。","caution":"主方案不直接用模型可信度删掉 SGS 难例；模型不可靠的区域可能更需要真实采样。","sources":[{"label":"教师入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"},{"label":"方案第 5 节 · 三种采样","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#5-数据从哪里来三种采样如何分工"}],"beginner":{"title":"SGS 选择真实初态","summary":"通过初态覆盖，提前获得接触与保持经验。","receives":"初态配置库与真实完成回合的成功历史。","does":"按现有 SGS 规则选择实际仿真起点。","sends":"把初态交给真实仿真执行链。","why":"不必等策略从完整起点成功，才能采到接触和保持数据。","example":"从 pregrasp 开始可以较早看到夹取、夹偏和滑落。","learning":"只更新课程统计与采样概率，不直接更新网络。","terms":["policy","world_model","ppo","bptt"]},"provenance":"已有","jump":"rollout","provenanceDetail":"已有"},{"id":"ov_sim","title":"Isaac Gym 真实执行","subtitle":"共享 Actor＋冻结控制链","x":340,"y":0,"branch":"sim","status":"fixed","shapes":["动作 → 物理结果","无需仿真器梯度"],"note":"让当前教师实际试动作，产生可信的物理标签。","detail":"系统：高层动作经现有低层控制、IK 与机器人—物体接触后，形成真实仿真状态转移。\\n真实含义：指 Isaac Gym 执行结果，并非实机数据。","caution":"不通过 Isaac Gym 反向传播；主方案也不要求更换为 MuJoCo Warp。","sources":[{"label":"教师入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"},{"label":"高层环境执行链","href":"../DQ_high-level/envs/b1z1_base.py"}],"beginner":{"title":"Isaac Gym 真实执行","summary":"让当前教师实际试动作，产生可信的物理标签。","receives":"SGS 初态、当前 Actor 及物理环境条件。","does":"按当前教师策略和现有执行链推进仿真。","sends":"输出真实状态、奖励、终止与回合结果。","why":"模型只能从实际动作后果学习，而不能把预测当作真值。","example":"同一个闭爪命令可能夹住物体，也可能夹空，结果由仿真产生。","learning":"执行采集不训练物理引擎或冻结低层策略。","terms":["policy","world_model","ppo","bptt"]},"provenance":"已有","jump":"rollout","provenanceDetail":"已有"},{"id":"ov_real","title":"真实经验分流","subtitle":"同一采集，不同训练用途","x":680,"y":0,"branch":"input","status":"data","shapes":["转移 / 真实奖励","动作概率 / 回合边界"],"note":"真实转移教模型，真实回报教策略与价值。","detail":"分流：近期带旧策略概率的轨迹用于 PPO；连续转移进入模型 replay；完整真实中间状态可作想象起点。\\n信息：额外记录必要状态、历史、条件和动作持续时间。","caution":"模型 replay 可保留历史数据；未经处理的旧数据不能直接当 PPO on-policy 批次。","sources":[{"label":"方法提案 · 整体学习循环","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#13-一个完整的学习循环"}],"beginner":{"title":"真实经验分流","summary":"真实转移教模型，真实回报教策略与价值。","receives":"Isaac Gym 的连续实际执行记录。","does":"按三条学习路径的需求组织经验。","sends":"送入真实 PPO、模型回放与真实完成统计。","why":"共享数据来源不等于所有目标使用相同采样分布。","example":"一次失抓同时说明动力学预测应如何修正，以及真实任务回报有多差。","learning":"此处组织数据；不独立更新网络。","terms":["policy","world_model","ppo","bptt"]},"provenance":"已有＋扩展","jump":"boundaries","provenanceDetail":"已有＋扩展"},{"id":"ov_stats","title":"SGS 只接收真实回合结果","subtitle":"模型想象不进入成功历史","x":1020,"y":0,"branch":"input","status":"fixed","shapes":["真实 success / failure","完成回合后更新"],"note":"保持 SGS 统计对应实际任务表现。","detail":"统计：依据真实完成回合及原任务成功判定更新配置历史。\\n禁止混用：预测成功概率、想象保持成功或模型奖励不进入真实成功率。","caution":"任务成功判据是现有抓取代理和连续保持标准，不等同于独立测量的真实接触标签。","sources":[{"label":"SGS 实现","href":"../DQ_high-level/utils/sgs.py"},{"label":"成功判定","href":"../DQ_high-level/utils/pick_success.py"}],"beginner":{"title":"SGS 只接收真实回合结果","summary":"保持 SGS 统计对应实际任务表现。","receives":"实际完成回合的配置编号和成功结果。","does":"更新真实成功历史。","sends":"反馈给下轮 SGS 初态采样。","why":"课程不能被模型虚构的成功误导。","example":"模型预测已稳定保持，但实际物体掉落，应记真实失败。","learning":"更新 SGS 统计；不更新 θ、ω、ψ。","terms":["policy","world_model","ppo","bptt"]},"provenance":"已有","provenanceDetail":"已有"},{"id":"ov_replay","title":"世界模型真实 replay","subtitle":"近期＋历史，成功＋失败","x":0,"y":340,"branch":"input","status":"data","shapes":["连续窗口 → 拟合","完整中间状态 → 想象"],"note":"保存模型学习与想象起点所需的完整经验。","detail":"模型拟合：按阶段、接触结果和条件选择连续窗口。\\n想象：选择有控制记忆与任务进度的真实起点。\\n历史：适度保留接触和保持经验，降低遗忘。","caution":"窗口不能跨回合重置；SGS bank 不能替代真实连续 replay。","sources":[{"label":"方法提案 · 整体学习循环","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#13-一个完整的学习循环"}],"beginner":{"title":"世界模型真实 replay","summary":"保存模型学习与想象起点所需的完整经验。","receives":"真实状态、实际动作、环境条件、时长与回合边界。","does":"保留近期与历史经验，并为不同用途分别采样。","sends":"提供模型监督窗口和候选想象起点。","why":"世界模型需要复用多个初态阶段的交互规律。","example":"近期重点练接近时，仍可用已有滑落数据巩固接触预测。","learning":"回放本身不更新网络。","terms":["policy","world_model","ppo","bptt"]},"provenance":"拟新增","jump":"model_fit","provenanceDetail":"拟新增"},{"id":"ov_wm","title":"路径 A · 拟合世界模型","subtitle":"真实转移监督更新 ω","x":340,"y":340,"branch":"world","status":"trainable","shapes":["多步状态预测","只更新 ω"],"note":"学习高层动作如何改变机器人与物体状态。","detail":"过程：从真实起点沿日志动作自回归预测，比较后续物理真值和抓取相对关系。\\n输出：共享可微高层交互模型 Fω。\\n参数：只更新 ω。","caution":"预测状态误差小，不自动意味着模型动作梯度有效。","sources":[{"label":"方法提案 · 整体学习循环","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#13-一个完整的学习循环"}],"beginner":{"title":"路径 A · 拟合世界模型","summary":"学习高层动作如何改变机器人与物体状态。","receives":"真实连续窗口、实际执行动作、条件与真值。","does":"最小化多步预测误差。","sends":"向短期 BPTT 提供模型，并接受持续可靠性诊断。","why":"把多次交互经验转化为可复用的动作后果预测。","example":"学会闭爪后抬升过快会造成滑落。","learning":"更新世界模型 ω；不更新 Actor θ 或 Critic ψ。","terms":["policy","world_model","ppo","bptt"]},"provenance":"拟新增","jump":"model_fit","provenanceDetail":"拟新增"},{"id":"ov_trust","title":"选择可信想象范围","subtitle":"起点、物理时间窗口与权重","x":680,"y":340,"branch":"input","status":"fixed","shapes":["可信起点 qimag","H 与 w 固定于本次更新"],"note":"仅在模型与尾值有数据支持的范围使用梯度。","detail":"诊断：检查多步预测、实际动作效果及末端价值支持。\\n控制：决定想象起点、窗口和辅助强度。\\n边界：在最后可信状态接尾值，而非进入错误状态再补救。","caution":"可信度不是 Actor 奖励；不能据此剔除真实 SGS 难例。","sources":[{"label":"方法提案 · 整体学习循环","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#13-一个完整的学习循环"}],"beginner":{"title":"选择可信想象范围","summary":"仅在模型与尾值有数据支持的范围使用梯度。","receives":"候选真实起点、当前模型和独立动作效果诊断。","does":"选择可信短窗口，并在本次策略更新中固定选择条件。","sends":"把完整起点及使用范围交给策略 BPTT。","why":"模型可能在接近阶段可靠，在接触转换阶段仍不可靠。","example":"先使用稳定抬升阶段的梯度，继续真实采集难预测的首次夹取。","learning":"选择与权重不通过 Actor 回报反向优化。","terms":["policy","world_model","ppo","bptt"]},"provenance":"拟新增","jump":"boundaries","provenanceDetail":"拟新增"},{"id":"ov_bptt","title":"路径 C · 短期策略 BPTT","subtitle":"回报梯度穿过模型传回 Actor","x":1020,"y":340,"branch":"loss","status":"trainable","shapes":["短期收益＋γᴴ Vψ","只更新 θ；ω/ψ 冻结"],"note":"用可信的动作后果导数辅助改进连续动作。","detail":"闭环：Actor 基于预测状态和历史重新选动作；预测未来回报与终点价值。\\n反传：梯度经模型状态、动作、观测映射和价值输入传回 Actor。\\n夹爪：短期模式作为固定条件，初版辅助连续动作。","caution":"冻结参数不等于 no_grad；二值夹爪不虚构可微抓力；混合更新属于待验证设计。","sources":[{"label":"方法提案 · 整体学习循环","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#13-一个完整的学习循环"}],"beginner":{"title":"路径 C · 短期策略 BPTT","summary":"用可信的动作后果导数辅助改进连续动作。","receives":"可信起点、当前 Actor、固定参数世界模型和真实回报 Critic。","does":"展开短时预测并通过时间反向传播求策略辅助梯度。","sends":"向同一教师 θ 提供受约束的更新。","why":"让策略利用动作如何影响未来的方向信息。","example":"末端稍微改变抬升方向，模型预测相对滑移减少且尾值提高。","learning":"只更新 θ；保留对模型与 Critic 输入的导数，不更新 ω、ψ。","terms":["policy","world_model","ppo","bptt"]},"provenance":"拟新增","jump":"bptt","provenanceDetail":"拟新增"},{"id":"ov_ppo","title":"路径 B · 真实 PPO 学习","subtitle":"继续提供实际任务反馈","x":0,"y":680,"branch":"actor","status":"trainable","shapes":["完整 9 维动作学习","更新 θ 与 ψ"],"note":"真实优势更新策略，真实回报训练长期价值。","detail":"Actor：用近期实际经验与优势更新动作分布。\\nCritic：真实奖励与 bootstrap 构造价值目标。\\n主线：普通 SGS＋EKF 入口继续保留 PPO。","caution":"想象轨迹不直接混入当前 PPO 批次；该主线不使用原文想象 λ-return 训练 Critic。","sources":[{"label":"教师入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"},{"label":"教师 PPO 训练","href":"../DQ_high-level/train_multistate_DQ_teacher.py"}],"beginner":{"title":"路径 B · 真实 PPO 学习","summary":"真实优势更新策略，真实回报训练长期价值。","receives":"近期真实轨迹、旧动作概率、奖励与终止信息。","does":"构造优势和价值目标，执行现有 PPO 学习。","sends":"分别更新 Actor θ 与 Critic ψ。","why":"模型辅助需要持续受到实际任务结果的检验。","example":"真实失抓会降低该动作的优势，并影响后续价值估计。","learning":"更新 θ 和 ψ；不更新 ω。","terms":["policy","world_model","ppo","bptt"]},"provenance":"已有","jump":"ppo","provenanceDetail":"已有"},{"id":"ov_critic","title":"真实回报 Critic Vψ","subtitle":"为短窗口提供长期尾值","x":340,"y":680,"branch":"critic","status":"data","shapes":["长期任务回报","不是成功概率"],"note":"评价预测终点之后的保持与完成前景。","detail":"训练：只从真实 PPO 回报目标学习。\\n使用：策略 BPTT 中参数冻结，Vψ 对预测输入的梯度仍保留。\\n输入：先沿用当前 Critic 观测；特权输入增强单独研究。","caution":"真实数据训练不保证对离分布想象状态的梯度可靠；奖励尺度与终止语义必须一致。","sources":[{"label":"方法提案 · 整体学习循环","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#13-一个完整的学习循环"}],"beginner":{"title":"真实回报 Critic Vψ","summary":"评价预测终点之后的保持与完成前景。","receives":"真实价值更新；在想象时接收终点可用价值输入。","does":"估计当前策略后续能够获得的折扣任务回报。","sends":"为短期 BPTT 提供末端价值及其输入导数。","why":"短时抬升需要同时考虑未来能否继续保持。","example":"高度较低但稳定的抓持可能优于即将掉落的高位抓持。","learning":"真实 PPO 更新 ψ；BPTT 只借用其固定参数计算。","terms":["policy","world_model","ppo","bptt"]},"provenance":"已有＋扩展","jump":"ppo","provenanceDetail":"已有＋扩展"},{"id":"ov_actor","title":"同一个教师 Actor πθ","subtitle":"PPO 与 BPTT 共同改进","x":680,"y":680,"branch":"actor","status":"data","shapes":["真实 PPO ＋模型 BPTT","共享 θ"],"note":"改进后的策略返回 Isaac Gym，继续产生新经验。","detail":"共享：真实 PPO 与可信模型 BPTT 作用于同一个教师，不是两个互不相关的策略。\\n观测：保留现有 EKF 接口及部署可用信息。\\n约束：辅助梯度与整体策略偏移需要控制。","caution":"PPO clipping 不自动限制新增模型梯度；论文未证明本混合方案的收益。","sources":[{"label":"方法提案 · 整体学习循环","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#13-一个完整的学习循环"}],"beginner":{"title":"同一个教师 Actor πθ","summary":"改进后的策略返回 Isaac Gym，继续产生新经验。","receives":"真实 PPO 更新与受约束的模型梯度更新。","does":"形成当前教师策略并用于下一轮实际采集。","sends":"送回真实执行链，并参与独立固定任务评估。","why":"最终目标是改进实际执行的同一个教师。","example":"模型建议调整接近方向，下一轮真实运行检验它是否有效。","learning":"θ 由真实 PPO 和策略 BPTT 更新；低层策略仍冻结。","terms":["policy","world_model","ppo","bptt"]},"provenance":"已有＋扩展","jump":"bptt","provenanceDetail":"已有＋扩展"},{"id":"ov_eval","title":"独立完整任务评估","subtitle":"验证真实收益和总成本","x":1020,"y":680,"branch":"sim","status":"fixed","shapes":["固定完整起点","原连续保持成功标准"],"note":"以实际任务表现判断模型辅助是否有价值。","detail":"评价：固定完整初态分布、原成功规则及多个种子。\\n成本：分别匹配真实样本预算和包含模型/想象的计算预算。\\n边界：评估本身不参与梯度，固定评估样本不作为拟合数据。","caution":"想象回报上升或 near_goal 更容易成功，都不足以证明完整任务提高。","sources":[{"label":"方法提案 · 整体学习循环","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#13-一个完整的学习循环"}],"beginner":{"title":"独立完整任务评估","summary":"以实际任务表现判断模型辅助是否有价值。","receives":"当前共享教师与独立固定完整任务起点。","does":"在真实仿真中比较保持成功率和训练效率。","sends":"报告收益、成本和失败类型。","why":"避免策略利用模型误差取得虚假进展。","example":"模型内预测成功更多，但真实完整起点成功下降，方案需要调整。","learning":"评估不直接更新 θ、ω、ψ。","terms":["policy","world_model","ppo","bptt"]},"provenance":"评价设计","jump":"boundaries","provenanceDetail":"评价设计"}],"edges":[{"to":"ov_sim","label":"真实初态","kind":"data","beginnerLabel":"真实初态","from":"ov_sgs"},{"to":"ov_sim","label":"当前教师","kind":"condition","beginnerLabel":"当前教师","from":"ov_actor"},{"to":"ov_real","label":"实际结果","kind":"data","beginnerLabel":"实际结果","from":"ov_sim"},{"to":"ov_stats","label":"完成回合结果","kind":"data","beginnerLabel":"完成回合结果","from":"ov_real"},{"to":"ov_sgs","label":"真实成功历史","kind":"supervision","beginnerLabel":"真实成功历史","from":"ov_stats"},{"to":"ov_replay","label":"完整连续经验","kind":"data","beginnerLabel":"完整连续经验","from":"ov_real"},{"to":"ov_wm","label":"监督窗口","kind":"data","beginnerLabel":"监督窗口","from":"ov_replay"},{"to":"ov_trust","label":"候选真实起点","kind":"data","beginnerLabel":"候选真实起点","from":"ov_replay"},{"to":"ov_bptt","label":"Fω：冻结参数","kind":"condition","beginnerLabel":"Fω：冻结参数","from":"ov_wm"},{"to":"ov_bptt","label":"可信起点 / H / w","kind":"condition","beginnerLabel":"可信起点 / H / w","from":"ov_trust"},{"to":"ov_ppo","label":"近期真实轨迹","kind":"data","beginnerLabel":"近期真实轨迹","from":"ov_real"},{"to":"ov_actor","label":"PPO 更新 θ","kind":"update","beginnerLabel":"PPO 更新 θ","from":"ov_ppo"},{"to":"ov_critic","label":"真实回报更新 ψ","kind":"update","beginnerLabel":"真实回报更新 ψ","from":"ov_ppo"},{"to":"ov_bptt","label":"尾值 Vψ：冻结参数","kind":"condition","beginnerLabel":"尾值 Vψ：冻结参数","from":"ov_critic"},{"to":"ov_actor","label":"辅助梯度更新 θ","kind":"update","beginnerLabel":"辅助梯度更新 θ","from":"ov_bptt"},{"to":"ov_eval","label":"当前共享教师","kind":"condition","beginnerLabel":"当前共享教师","from":"ov_actor"},{"from":"ov_actor","to":"ov_bptt","label":"同一 Actor 闭环展开","kind":"condition"}],"beginner":{"title":"01 · 训练总览","subtitle":"已有教师继续真实练习，新模型学习动作后果并提供辅助梯度。","summary":"先理解三条路径如何复用经验和同一个教师，再展开各页细节。","steps":["ov_sgs","ov_sim","ov_real","ov_stats","ov_replay","ov_wm","ov_trust","ov_bptt","ov_ppo","ov_critic","ov_actor","ov_eval"]}},{"id":"rollout","title":"02 · 真实采样与执行","subtitle":"SGS 重置 → 因果 EKF 观测 → 9 维高层动作 → 冻结控制链 → Isaac Gym。","summary":"真实指仿真执行。近期 PPO 批次、模型 replay 与 SGS 成功统计有不同数据要求。","formula":"xₜ → oₜ（含 EKF）→ πθ → aₜ → 冻结低层/IK → Isaac Gym → xₜ₊₁, rₜ₊₁","formulaNote":"世界模型不靠静态 bank 获得转移；Actor 观测与训练侧完整状态保持明确边界。","nodes":[{"id":"ro_sgs","title":"SGS 初态与任务配置","subtitle":"真实练习的开始位置","x":0,"y":0,"branch":"input","status":"random","shapes":["配置类别与编号","回合级物理条件"],"note":"初态决定从哪里练习，实际执行才产生转移。","detail":"初态：full_task、pregrasp、near_goal 及对应配置。\\n条件：保留影响转移的已知环境参数和任务条件。\\n边界：bank 中姿态本身不是世界模型监督数据。","caution":"此页沿用当前 SGS；历史困难复习属于独立增强。","sources":[{"label":"教师入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"},{"label":"SGS 实现","href":"../DQ_high-level/utils/sgs.py"}],"beginner":{"title":"SGS 初态与任务配置","summary":"初态决定从哪里练习，实际执行才产生转移。","receives":"初态 bank、配置成功历史及本回合条件。","does":"选择并恢复真实回合起点。","sends":"初始化完整状态及执行环境。","why":"让不同学习阶段有机会进入真实采样。","example":"从 near_goal 开始可以采到保持成功与滑落。","learning":"只进行重置与采样，不训练网络。","terms":["sgs","ekf","gripper","replay"]},"provenance":"已有","provenanceDetail":"已有"},{"id":"ro_state","title":"完整真实状态与历史","subtitle":"仿真真值只在训练侧使用","x":340,"y":0,"branch":"input","status":"data","shapes":["机器人 / 物体物理状态","控制记忆 / 任务进度"],"note":"记录充分状态，同时保持 Actor 信息边界。","detail":"训练侧：机器人、物体状态、速度、执行目标、低层历史、任务计数、观测历史与时间信息。\\n闭环：下一步真实状态仍回到本节点。\\n观测：只有策略接口允许的信息进入 Actor。","caution":"紧凑的末端与物体姿态未必足以决定下一步；不能把训练侧真值直接灌给 Actor。","sources":[{"label":"方法提案 · 整体学习循环","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#13-一个完整的学习循环"}],"beginner":{"title":"完整真实状态与历史","summary":"记录充分状态，同时保持 Actor 信息边界。","receives":"初始配置或上一步仿真结果，以及相应控制与观测历史。","does":"组织真实物理状态和必要记忆，供观测构造与数据记录。","sends":"送给因果观测接口和模型 replay；物理真值提供监督。","why":"世界模型要区分不同低层历史和任务进度造成的后果。","example":"相同物体高度，已保持 9 步和刚抬起的后续任务价值不同。","learning":"状态读取不更新参数。","terms":["sgs","ekf","gripper","replay"]},"provenance":"已有＋扩展","jump":"actor_network","provenanceDetail":"已有＋扩展"},{"id":"ro_obs","title":"因果观测与滚动 EKF","subtitle":"保持现有教师信息接口","x":680,"y":0,"branch":"input","status":"fixed","shapes":["目标历史 → 0.60/0.90 s 预测","现有观测 oₜ"],"note":"由当前可用信息构造 Actor 观测。","detail":"EKF：使用物体历史位姿与时间外推目标运动。\\n输入边界：不向 Actor 暴露未定义的训练侧真实速度、物理参数或未来状态。\\n模型训练：EKF 输出不作为真实物理标签。","caution":"真实采集可使用现有 EKF；想象时需要因果观测递推和相应梯度支持，不能直接假定已有实现可微。","sources":[{"label":"教师入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"},{"label":"EKF 预测模块","href":"../DQ_high-level/modules/pose_prediction.py"}],"beginner":{"title":"因果观测与滚动 EKF","summary":"由当前可用信息构造 Actor 观测。","receives":"当前策略允许的传感信息与已有目标历史。","does":"构造教师观测并加入现有 EKF 预测。","sends":"把 oₜ 输入 Actor，同时保存 PPO 所需观测。","why":"策略必须在其实际可用信息条件下学习。","example":"在物体接触前，根据过去位置估计后续运动趋势。","learning":"观测和 EKF 本身不通过真实 PPO 训练动力学参数。","terms":["sgs","ekf","gripper","replay"]},"provenance":"已有","provenanceDetail":"已有"},{"id":"ro_actor","title":"当前教师 Actor πθ","subtitle":"真实采集阶段的随机策略","x":1020,"y":0,"branch":"actor","status":"frozen","shapes":["πθ(a|oₜ)","采集时记录旧动作概率"],"note":"接收现有观测，产生当前实际执行动作。","detail":"采集：在一个 rollout 内保存动作采集时概率，供 PPO 概率比使用。\\n共享：参数来自前一轮真实 PPO 和模型辅助更新。\\n阶段：本节点的冻结指采集时不反向训练。","caution":"不能把采集期冻结误解为 Actor 永久不学习。","sources":[{"label":"教师训练","href":"../DQ_high-level/train_multistate_DQ_teacher.py"}],"beginner":{"title":"当前教师 Actor πθ","summary":"接收现有观测，产生当前实际执行动作。","receives":"当前观测 oₜ 与采集策略参数。","does":"按当前随机策略生成动作，并记录 log πold。","sends":"向动作接口提供高层命令；动作概率进入近期 PPO 批次。","why":"PPO 需要知道真实动作是在什么分布下采到的。","example":"同一接近状态可能采到略不同的末端位移，形成不同实际结果。","learning":"采集阶段不更新 θ；参数更新发生在 PPO/BPTT 学习阶段。","terms":["sgs","ekf","gripper","replay"]},"provenance":"已有","jump":"ppo","provenanceDetail":"已有"},{"id":"ro_action","title":"9 维高层动作接口","subtitle":"8 个连续量＋夹爪符号开闭","x":1020,"y":340,"branch":"input","status":"fixed","shapes":["连续：末端与底盘命令","夹爪：按符号转换"],"note":"区分策略输出、实际执行映射和物理后果。","detail":"动作：8 个连续控制量描述末端与底盘命令，另一个标量经符号转为夹爪开闭。\\n记录：保存 PPO 动作概率对应的采样动作，并明确实际执行的命令映射。\\n模型：依据实际动作条件学习状态转移。","caution":"二值开闭不等价于连续抓力；更负的策略标量不代表闭爪更紧。","sources":[{"label":"高层动作与夹爪执行","href":"../DQ_high-level/envs/b1z1_base.py"}],"beginner":{"title":"9 维高层动作接口","summary":"区分策略输出、实际执行映射和物理后果。","receives":"Actor 产生的高层动作向量。","does":"按当前控制接口处理连续动作和夹爪符号。","sends":"向冻结控制链发送实际执行命令，并记录动作。","why":"世界模型和 PPO 必须各自对应正确的动作语义。","example":"两次负值夹爪输出可能对应同样闭爪模式，而不是两种抓力。","learning":"本节点的映射规则固定；夹爪决策继续由真实 PPO 学习。","terms":["sgs","ekf","gripper","replay"]},"provenance":"已有","provenanceDetail":"已有"},{"id":"ro_control","title":"冻结低层控制＋IK","subtitle":"执行高层命令的已有闭环","x":680,"y":340,"branch":"actor","status":"frozen","shapes":["累积目标 / 历史 / 低层","IK 与关节执行目标"],"note":"把高层命令转换为实际机器人运动控制。","detail":"执行：包含末端目标累积、机械臂控制、冻结低层策略及其历史。\\n时间：一个高层动作执行 7/8 个低层周期，对应 0.14/0.16 秒。\\n模型对象：Fω 学习该整段闭环的等效结果。","caution":"高层世界模型不要求重训低层；其必要内部状态需要记录或由历史状态表示。","sources":[{"labe "branch":"input","status":"data","shapes":["o,a,logπold,r,done","GAE / 价值学习所需信息"],"note":"按真实采集轮次构造策略与价值训练材料。","detail":"保存：采集时观测、动作、旧策略概率、价值信息、奖励和回合边界。\\n用途：真实 PPO 更新 θ、ψ。\\n分布：区别于跨时间保留的模型 replay。","caution":"模型想象轨迹与未经处理的旧策略经验不直接作为这份 on-policy 批次。","sources":[{"label":"教师 PPO 训练","href":"../DQ_high-level/train_multistate_DQ_teacher.py"}],"beginner":{"title":"近期真实 PPO 批次","summary":"按真实采集轮次构造策略与价值训练材料。","receives":"近期实际采集的观测、动作、旧概率和真实奖励/终止。","does":"形成当前 PPO 的学习批次。","sends":"提供给优势、价值目标和 PPO 更新。","why":"真实 PPO 依赖采集策略与更新策略的正确关系。","example":"实际闭爪失败对应低优势，策略据此调整动作分布。","learning":"后续 PPO 更新 θ、ψ；存储本身不更新。","terms":["sgs","ekf","gripper","replay"]},"provenance":"已有","jump":"ppo","provenanceDetail":"已有"},{"id":"ro_replay","title":"世界模型真实回放库","subtitle":"完整转移与连续历史","x":340,"y":680,"branch":"input","status":"data","shapes":["xₜ,aₜ,xₜ₊₁","ξ,Δt,回合边界"],"note":"为模型拟合与可信想象准备充分经验。","detail":"存储：完整状态与历史、实际执行命令、下一状态、条件、实际时长和边界。\\n来源：同一真实采集链，允许保留有用历史转移。\\n标签：状态真值来自仿真，不来自 EKF。","caution":"只保存 Actor 观测可能不足以建模；连续窗口不得跨越 reset。","sources":[{"label":"方法提案 · 整体学习循环","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#13-一个完整的学习循环"}],"beginner":{"title":"世界模型真实回放库","summary":"为模型拟合与可信想象准备充分经验。","receives":"当前完整状态、实际动作、物理下一状态和上下文。","does":"组织连续转移，并覆盖成功、失抓和保持阶段。","sends":"送入模型拟合及可信起点选择。","why":"需要知道动作如何导致实际变化。","example":"保留物体刚离台、随后滑落的整段记录。","learning":"回放不更新网络；模型拟合阶段再更新 ω。","terms":["sgs","ekf","gripper","replay"]},"provenance":"拟新增","jump":"model_fit","provenanceDetail":"拟新增"},{"id":"ro_stats","title":"真实完成统计回到 SGS","subtitle":"只在实际回合完成后记结果","x":680,"y":680,"branch":"input","status":"fixed","shapes":["配置 ID＋真实结果","不收想象成功"],"note":"用实际表现更新下轮初态采样。","detail":"依据：原实际成功规则与对应配置编号。\\n排除：模型预测成功、辅助事件概率和想象回报。","caution":"独立评估结果与训练课程统计应明确分开；不要把测试集用于模型拟合。","sources":[{"label":"SGS 实现","href":"../DQ_high-level/utils/sgs.py"}],"beginner":{"title":"真实完成统计回到 SGS","summary":"用实际表现更新下轮初态采样。","receives":"训练回合真实完成结果。","does":"更新每个配置的近期真实成功历史。","sends":"反馈给 SGS 采样下一回合。","why":"采样课程需要反映真实策略能力。","example":"模型认为已经抓稳 an_norm","title":"观测归一化与分块","subtitle":"RunningStandardScaler → 读取各字段","x":340,"y":300,"branch":"input","status":"fixed","shapes":["特征1024 / 候选30×6","任务 d_task / 上步动作9"],"note":"两套网络读取同一接口，编码参数彼此独立。","detail":"输入归一化后，网络分别读取1024维物体特征、当前物体局部位姿6维、30×6候选及其余状态。当前入口移除底盘线速度3维和相对物体速度2维，但仍保留关节速度。BPTT使用时固定归一化统计，并保留所需输入导数。","provenance":"已有 · 已核对代码","sources":[{"label":"当前 Actor / Critic 定义","href":"../DQ_high-level/train_multistate_DQ_teacher.py"},{"label":"GFM 注意力定义","href":"../DQ_high-level/modules/predictattention.py"}],"beginner":{"title":"观测归一化与分块","summary":"两套网络读取同一接口，编码参数彼此独立。","receives":"完整教师观测oₜ。","does":"使用与训练一致的尺度处理观测，然后把特征、候选抓取位姿和普通状态送到相应分支。","sends":"为Actor与Critic各自的特征编码器、GFM和融合模块提供输入。","why":"统一数值尺度，并保证真实与想象观测进入同一策略接口。","example":"当前物体6维位姿同时属于普通状态，也作为各自GFM的查询条件。","learning":"统计量由真实训练维护；模型辅助策略更新时不靠改变统计量提高分数。","terms":["policy","critic","gfm"]},"provenanceDetail":"当前仓库已核对"},{"id":"an_aenc","title":"Actor 特征编码器","subtitle":"资产几何特征 → 可训练表示","x":0,"y":0,"branch":"actor","status":"trainable","shapes":["1024 → 512 → 128","ELU 位于两层之间"],"note":"Actor拥有自己的特征编码参数。","detail":"输入是资产预存的1024维几何特征，实际结构为Linear(1024,512)、ELU、Linear(512,128)。输出128维表示一方面参与最终融合，另一方面与当前物体6维局部位姿构成GFM查询。Actor与Critic各建一套，并非共享编码器。","provenance":"已有 · 已核对代码","sources":[{"label":"当前 Actor / Critic 定义","href":"../DQ_high-level/train_multistate_DQ_teacher.py"},{"label":"GFM 注意力定义","href":"../DQ_high-level/modules/predictattention.py"}],"beginner":{"title":"Actor 特征编码器","summary":"Actor拥有自己的特征编码参数。","receives":"归一化观测中的1024维物体特征。","does":"将物体几何信息压缩成128维、适合当前学习目标的表示。","sends":"同时交给本网络的GFM查询与最终特征融合。","why":"几何信息帮助网络区分物体形状和候选抓取条件。","example":"同样的末端位置，对不同形状物体可能意味着不同的抓取机会。","learning":"真实PPO与模型BPTT均可更新这组Actor参数。","terms":["policy","critic","gfm"]},"provenanceDetail":"当前仓库已核对"},{"id":"an_agfm","title":"Actor GFM 注意力","subtitle":"30个候选 → 6维聚合抓取表示","x":340,"y":0,"branch":"actor","status":"trainable","shapes":["Q:134 → 64","K,V:6 → 64","softmax(QKᵀ/√64)V → 6"],"note":"特征与当前位姿构成查询，输出连续抓取表示。","detail":"GFM读取30×6候选抓取位姿。查询Q由128维编码特征和6维当前物体局部位姿投影到64维，候选分别形成K和V，经缩放点积、softmax和加权聚合后由64维投影到6维。EKF未来位姿不直接进入这个查询，而进入后续融合向量。","provenance":"已有 · 已核对代码","sources":[{"label":"当前 Actor / Critic 定义","href":"../DQ_high-level/train_multistate_DQ_teacher.py"},{"label":"GFM 注意力定义","href":"../DQ_high-level/modules/predictattention.py"}],"beginner":{"title":"Actor GFM 注意力","summary":"特征与当前位姿构成查询，输出连续抓取表示。","receives":"本网络编码特征、当前物体局部位姿以及30个候选抓取位姿。","does":"计算各候选与当前物体情况的关联，并形成连续的6维抓取表示。","sends":"输出给本网络的融合模块。","why":"让策略和价值分别利用候选抓取几何，避免只依靠物体中心位置。","example":"靠近物体侧面时，注意力可以对当前更相关的抓取候选赋予不同权重。","learning":"GFM属于θ，由真实PPO及允许的BPTT梯度学习。","terms":["policy","critic","gfm"]},"provenanceDetail":"当前仓库已核对"},{"id":"an_afuse","title":"Actor 输入融合","subtitle":"任务状态 + 上步动作 + 编码特征 + GFM","x":680,"y":0,"branch":"actor","status":"fixed","shapes":["d_f=d_o−1024−180+128+6","当前默认推导 d_f=214"],"note":"EKF预测进入普通状态部分，随其它信息一起融合。","detail":"实际拼接保留物体与机器人状态、EKF预测和上一步9维动作，去掉原始1024维特征与180维候选，改用128维编码特征和6维GFM输出。当前入口默认推导融合维度为214，但图中以d_f表示可配置维度。Actor与Critic拼接规则相同，前面的可训练参数独立。","provenance":"已有 · 已核对代码","sources":[{"label":"当前 Actor / Critic 定义","href":"../DQ_high-level/train_multistate_DQ_teacher.py"},{"label":"GFM 注意力定义","href":"../DQ_high-level/modules/predictattention.py"}],"beginner":{"title":"Actor 输入融合","summary":"EKF预测进入普通状态部分，随其它信息一起融合。","receives":"本网络的128维特征、6维GFM表示，以及观测中的普通状态和上步动作。","does":"将各路信息拼成一个向量，交给后续MLP。","sends":"发送d_f维融合向量给Actor主干。","why":"让几何、当前状态、目标运动趋势和动作历史共同影响判断。","example":"物体未来会向右移动，GFM给出可用抓取几何，主干据此决定怎样跟随。","learning":"拼接本身没有参数，梯度可继续传到前面的编码器和GFM。","terms":["policy","critic","gfm"]},"provenanceDetail":"当前仓库已核对"},{"id":"an_amlp","title":"Actor 独立 MLP","subtitle":"三层隐藏网络 + 输出层","x":1020,"y":0,"branch":"actor","status":"trainable","shapes":["d_f → 512 → 256 → 128","128 → 9","隐藏层 ELU"],"note":"将融合信息映射为9维动作均值。","detail":"当前主干依次使用512、256、128个隐藏单元，每层后接ELU，最后输出9维动作均值。另有与状态无关的9维可学习log标准差，构成Gaussian策略。默认入口没有启用tanh动作头。主干层宽是已核对的现有结构。","provenance":"已有 · 已核对代码","sources":[{"label":"当前 Actor / Critic 定义","href":"../DQ_high-level/train_multistate_DQ_teacher.py"},{"label":"GFM 注意力定义","href":"../DQ_high-level/modules/predictattention.py"}],"beginner":{"title":"Actor 独立 MLP","summary":"将融合信息映射为9维动作均值。","receives":"本网络融合后的状态向量。","does":"计算9个高层动作的均值。","sends":"交给Gaussian采样和动作命令处理。","why":"让同一套策略参数兼顾抓取与底盘运动。","example":"即将夹住物体时，网络决定末端怎样微调和底盘如何配合。","learning":"PPO和BPTT共同服务于θ；额外模型更新不自动受PPO clipping保护。","terms":["policy","critic","gfm"]},"provenanceDetail":"当前仓库已核对"},{"id":"an_aout","title":"Gaussian 高层动作","subtitle":"8维连续命令 + 1维阈值夹爪","x":1360,"y":0,"branch":"actor","status":"data","shapes":["μ, logσ ∈ R⁹","a=μ+σ⊙ε","夹爪由 a[6] 符号决定"],"note":"真实PPO训练全部动作；BPTT先辅助连续动作。","detail":"动作0:3是末端位置目标增量，3:6是姿态目标增量，6控制夹爪开闭，7为前进速度，8为偏航角速度。实际命令还要处理限幅和历史目标累加。想象使用连续动作重参数化，夹爪模式作为给定条件；共享主干更新仍可能间接影响夹爪输出。","provenance":"已有 · 已核对代码","sources":[{"label":"当前 Actor / Critic 定义","href":"../DQ_high-level/train_multistate_DQ_teacher.py"},{"label":"GFM 注意力定义","href":"../DQ_high-level/modules/predictattention.py"}],"beginner":{"title":"Gaussian 高层动作","summary":"真实PPO训练全部动作；BPTT先辅助连续动作。","receives":"动作均值与可学习标准差。","does":"真实采集时采样全部动作；模型辅助阶段对连续动作保留所定义的梯度路径。","sends":"送真实命令执行，或送给高层世界模型。","why":"使BPTT研究与真实控制动作语义对应。","example":"固定短期闭爪条件，比较不同抬升方向是否更稳定。","learning":"动作由θ产生；固定夹爪条件不等于夹爪对应参数完全不受间接变化。","terms":["policy","critic","gfm"]},"provenanceDetail":"当前仓库已核对"},{"id":"an_cenc","title":"Critic 特征编码器","subtitle":"资产几何特征 → 可训练表示","x":0,"y":600,"branch":"critic","status":"trainable","shapes":["1024 → 512 → 128","ELU 位于两层之间"],"note":"Critic拥有自己的特征编码参数。","detail":"输入是资产预存的1024维几何特征，实际结构为Linear(1024,512)、ELU、Linear(512,128)。输出128维表示一方面参与最终融合，另一方面与当前物体6维局部位姿构成GFM查询。Actor与Critic各建一套，并非共享编码器。","provenance":"已有 · 已核对代码","sources":[{"label":"当前 Actor / Critic 定义","href":"../DQ_high-level/train_multistate_DQ_teacher.py"},{"label":"GFM 注意力定义","href":"../DQ_high-level/modules/predictattention.py"}],"beginner":{"title":"Critic 特征编码器","summary":"Critic拥有自己的特征编码参数。","receives":"归一化观测中的1024维物体特征。","does":"将物体几何信息压缩成128维、适合当前学习目标的表示。","sends":"同时交给本网络的GFM查询与最终特征融合。","why":"几何信息帮助网络区分物体形状和候选抓取条件。","example":"同样的末端位置，对不同形状物体可能意味着不同的抓取机会。","learning":"真实价值学习更新；Actor的BPTT阶段冻结这组参数，保留输入梯度。","terms":["policy","critic","gfm"]},"provenanceDetail":"当前仓库已核对"},{"id":"an_cgfm","title":"Critic GFM 注意力","subtitle":"30个候选 → 6维聚合抓取表示","x":340,"y":600,"branch":"critic","status":"trainable","shapes":["Q:134 → 64","K,V:6 → 64","softmax(QKᵀ/√64)V → 6"],"note":"价值网络拥有独立GFM，不复用Actor参数。","detail":"GFM读取30×6候选抓取位姿。查询Q由128维编码特征和6维当前物体局部位姿投影到64维，候选分别形成K和V，经缩放点积、softmax和加权聚合后由64维投影到6维。EKF未来位姿不直接进入这个查询，而进入后续融合向量。","provenance":"已有 · 已核对代码","sources":[{"label":"当前 Actor / Critic 定义","href":"../DQ_high-level/train_multistate_DQ_teacher.py"},{"label":"GFM 注意力定义","href":"../DQ_high-level/modules/predictattention.py"}],"beginner":{"title":"Critic GFM 注意力","summary":"价值网络拥有独立GFM，不复用Actor参数。","receives":"本网络编码特征、当前物体局部位姿以及30个候选抓取位姿。","does":"计算各候选与当前物体情况的关联，并形成连续的6维抓取表示。","sends":"输出给本网络的融合模块。","why":"让策略和价值分别利用候选抓取几何，避免只依靠物体中心位置。","example":"靠近物体侧面时，注意力可以对当前更相关的抓取候选赋予不同权重。","learning":"GFM属于ψ，仅由真实价值目标学习；在Actor的BPTT中冻结参数。","terms":["policy","critic","gfm"]},"provenanceDetail":"当前仓库已核对"},{"id":"an_cfuse","title":"Critic 输入融合","subtitle":"任务状态 + 上步动作 + 编码特征 + GFM","x":680,"y":600,"branch":"critic","status":"fixed","shapes":["d_f=d_o−1024−180+128+6","当前默认推导 d_f=214"],"note":"EKF预测进入普通状态部分，随其它信息一起融合。","detail":"实际拼接保留物体与机器人状态、EKF预测和上一步9维动作，去掉原始1024维特征与180维候选，改用128维编码特征和6维GFM输出。当前入口默认推导融合维度为214，但图中以d_f表示可配置维度。Actor与Critic拼接规则相同，前面的可训练参数独立。","provenance":"已有 · 已核对代码","sources":[{"label":"当前 Actor / Critic 定义","href":"../DQ_high-level/train_multistate_DQ_teacher.py"},{"label":"GFM 注意力定义","href":"../DQ_high-level/modules/predictattention.py"}],"beginner":{"title":"Critic 输入融合","summary":"EKF预测进入普通状态部分，随其它信息一起融合。","receives":"本网络的128维特征、6维GFM表示，以及观测中的普通状态和上步动作。","does":"将各路信息拼成一个向量，交给后续MLP。","sends":"发送d_f维融合向量给Critic主干。","why":"让几何、当前状态、目标运动趋势和动作历史共同影响判断。","example":"物体未来会向右移动，GFM给出可用抓取几何，主干据此决定怎样跟随。","learning":"拼接本身没有参数，梯度可继续传到前面的编码器和GFM。","terms":["policy","critic","gfm"]},"provenanceDetail":"当前仓库已核对"},{"id":"an_cmlp","title":"Critic 独立 MLP","subtitle":"三层隐藏网络 + 输出层","x":1020,"y":600,"branch":"critic","status":"trainable","shapes":["d_f → 512 → 256 → 128","128 → 1","隐藏层 ELU"],"note":"将融合信息映射为累计任务回报估计。","detail":"当前主干依次使用512、256、128个隐藏单元，每层后接ELU，最后输出1维价值。Critic使用自己的特征编码器和GFM，输出的是预期累计奖励，并不直接等于最终成功概率。主干层宽是已核对的现有结构。","provenance":"已有 · 已核对代码","sources":[{"label":"当前 Actor / Critic 定义","href":"../DQ_high-level/train_multistate_DQ_teacher.py"},{"label":"GFM 注意力定义","href":"../DQ_high-level/modules/predictattention.py"}],"beginner":{"title":"Critic 独立 MLP","summary":"将融合信息映射为累计任务回报估计。","receives":"本网络融合后的状态向量。","does":"计算当前策略继续执行时的长期任务价值。","sends":"交给真实PPO价值学习，以及想象终点的价值评价。","why":"为短期模型窗口之外的保持与失败后果提供评价。","example":"物体已抬起但正在滑动时，价值应低于能够稳定保持的状态。","learning":"真实PPO价值目标更新ψ；BPTT冻结ψ但保留对输入的导数。","terms":["policy","critic","gfm"]},"provenanceDetail":"当前仓库已核对"},{"id":"an_cout","title":"真实任务价值 V_real","subtitle":"真实回报监督；在预测终点调用","x":1360,"y":600,"branch":"critic","status":"data","shapes":["V ∈ R¹","v̂_H 为兼容的价值输入"],"note":"相同ψ用于真实状态估值和预测终点估值。","detail":"该标量估计当前策略的累计任务奖励，训练目标来自真实仿真回报。短期想象终点使用同一价值函数评价后续前景，必须保持输入接口和奖励尺度一致。价值预测准确不保证模型状态上的输入梯度准确，仍需独立验证。","provenance":"已有 · 已核对代码","sources":[{"label":"当前 Actor / Critic 定义","href":"../DQ_high-level/train_multistate_DQ_teacher.py"},{"label":"GFM 注意力定义","href":"../DQ_high-level/modules/predictattention.py"}],"beginner":{"title":"真实任务价值 V_real","summary":"相同ψ用于真实状态估值和预测终点估值。","receives":"独立Critic主干给出的价值估计。","does":"将长期回报评价提供给PPO和模型短期目标，并使用一致的回报尺度。","sends":"送真实优势计算，或作为短期想象目标的末端价值。","why":"无需让世界模型一直预测到整段保持任务结束。","example":"两种动作短期都能抬升，价值评价区分后续能否获得更高保持回报。","learning":"输出参与Actor BPTT时不更新ψ，也不能把输出detach成常量。","terms":["policy","critic","gfm"]},"provenanceDetail":"当前仓库已核对"},{"id":"an_separate","title":"参数关系与基线边界","subtitle":"同接口；Actor θ 与 Critic ψ 完全独立","x":1020,"y":300,"branch":"param","status":"fixed","shapes":["θ ≠ ψ","世界模型结构另页说明"],"note":"已有结构与新方案分开标注，特权Critic仍是候选。","detail":"当前代码分别实例化Policy和Value，因此编码器、GFM和MLP均不共享参数。同一个Actor在真实执行与各想象步重复使用θ，同一个Critic使用ψ。额外特权状态Critic、世界模型网络宽度和独立事件头尚未作为该入口的现有结构实现，不能在本页暗示已经存在。","provenance":"已有 · 已核对代码","sources":[{"label":"当前 Actor / Critic 定义","href":"../DQ_high-level/train_multistate_DQ_teacher.py"},{"label":"GFM 注意力定义","href":"../DQ_high-level/modules/predictattention.py"}],"beginner":{"title":"参数关系与基线边界","summary":"已有结构与新方案分开标注，特权Critic仍是候选。","receives":"两套网络的结构与参数归属。","does":"明确区分相同架构、相同观测接口与真正的参数共享。","sends":"供读者核对真实PPO和BPTT各自更新哪些网络。","why":"防止把原论文架构、当前实现和新方案混为一谈。","example":"Actor的GFM学习动作选择，Critic的GFM学习价值判断，权重无需相同。","learning":"这里是结构说明，没有更新操作。","terms":["policy","critic","gfm"]},"provenanceDetail":"当前仓库已核对"}],"edges":[{"from":"an_obs","to":"an_norm","label":"原有观测接口","kind":"data"},{"from":"an_norm","to":"an_aenc","label":"物体特征1024","kind":"data"},{"from":"an_aenc","to":"an_agfm","label":"特征128","kind":"data"},{"from":"an_norm","to":"an_agfm","label":"当前位姿6 + 候选30×6","kind":"data"},{"from":"an_agfm","to":"an_afuse","label":"抓取表示6","kind":"data"},{"from":"an_aenc","to":"an_afuse","label":"特征128","kind":"data"},{"from":"an_norm","to":"an_afuse","label":"任务状态 + EKF + 上步动作","kind":"data"},{"from":"an_afuse","to":"an_amlp","label":"融合向量 d_f","kind":"data"},{"from":"an_amlp","to":"an_aout","label":"动作均值9","kind":"data"},{"from":"an_norm","to":"an_cenc","label":"物体特征1024","kind":"data"},{"from":"an_cenc","to":"an_cgfm","label":"特征128","kind":"data"},{"from":"an_norm","to":"an_cgfm","label":"当前位姿6 + 候选30×6","kind":"data"},{"from":"an_cgfm","to":"an_cfuse","label":"抓取表示6","kind":"data"},{"from":"an_cenc","to":"an_cfuse","label":"特征128","kind":"data"},{"from":"an_norm","to":"an_cfuse","label":"任务状态 + EKF + 上步动作","kind":"data"},{"from":"an_cfuse","to":"an_cmlp","label":"融合向量 d_f","kind":"data"},{"from":"an_cmlp","to":"an_cout","label":"价值标量","kind":"data"}],"beginner":{"title":"03 · Actor / Critic 网络","subtitle":"策略与价值使用相似结构，但学习各自的判断。","summary":"从同一观测分别走上、下两条支路；上支路输出动作，下支路预测长期回报。","steps":["an_obs","an_norm","an_aenc","an_agfm","an_afuse","an_amlp","an_aout","an_cenc","an_cgfm","an_cfuse","an_cmlp","an_cout","an_separate"]}},{"id":"world_structure","title":"04 · 世界模型结构","subtitle":"高层等效闭环模型：明确预测语义和状态充分性，不预设新网络层宽。","summary":"输入真实或预测状态、动作、条件与历史；输出四组物理量，并补全下一步策略需要的控制记忆与观测。","formula":"x̂ₜ₊₁ = Fω(x̂ₜ, (uₜ,b̄ₜ), ξₜ, Δtₜ)\nôₜ₊₁ = O(x̂ₜ₊₁)，âₜ₊₁ = πθ(ôₜ₊₁)","formulaNote":"四组输出是语义分组；历史编码器、层数、宽度、事件头均未定型。想象不用真实未来数据。","nodes":[{"id":"ws_state","title":"当前物理状态","subtitle":"底盘、机械臂、夹爪、物体","x":0,"y":0,"branch":"input","status":"data","shapes":["sₜ：仿真真值用于模型训练","局部一致参考系"],"note":"Actor观测以外的训练侧信息也可帮助预测。","detail":"模型输入需要描述动作执行前的物理条件，包括底盘、关节或末端、夹爪、物体及必要支撑环境状态。输出可以围绕任务保持紧凑，但输入必须有足够信息解释下一步变化。不能把无速度的原Actor观测直接当成已经充分的动力学状态。","provenance":"拟新增 · 结构候选","sources":[{"label":"方法方案 §6–10","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"},{"label":"SuperMimic 原文","href":"papers/supermimic.pdf"}],"beginner":{"title":"当前物理状态","summary":"Actor观测以外的训练侧信息也可帮助预测。","receives":"真实回放起点的物理状态，或上一想象步预测并递推的状态。","does":"整理为一致的坐标和量纲，区分Actor可观测部分与训练侧额外信息。","sends":"送入共享高层动力学。","why":"同样的位置在不同速度和关节构型下，会产生不同接触结果。","example":"夹爪与物体位置相同，但相对速度不同，下一步可能稳定夹取或推偏。","learning":"真实状态作为监督和起点；BPTT起点以前的历史固定。","terms":["world_model","context","ekf"]},"provenanceDetail":"方法方案候选；世界模型尚未实现或定型"},{"id":"ws_history","title":"必要历史与控制记忆","subtitle":"显式状态 + 候选历史隐状态","x":340,"y":0,"branch":"input","status":"data","shapes":["累计末端目标 / 低层历史","EKF历史 / 保持进度"],"note":"紧凑物理输出不自动构成完整状态。","detail":"历史项包括冻结低层控制器的记忆、步态、累计末端目标、前序动作以及任务和观测历史。方案允许使用历史隐状态补充显式变量，但没有选定RNN、编码器层宽或隐状态维度。连续预测必须能够递推这些信息，不能只在第一个预测步读取真实历史。","provenance":"拟新增 · 结构候选","sources":[{"label":"方法方案 §6–10","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"},{"label":"SuperMimic 原文","href":"papers/supermimic.pdf"}],"beginner":{"title":"必要历史与控制记忆","summary":"紧凑物理输出不自动构成完整状态。","receives":"真实轨迹中与起点同步的控制记忆、观测历史和任务进度。","does":"显式保留可解释变量，并在需要时研究历史编码表示。","sends":"作为动力学输入，同时交给确定性记忆更新。","why":"避免模型把来自不同内部控制状态的转移错误地平均。","example":"实际末端相同，但累计目标不同，低层控制下一步仍可能向不同方向运动。","learning":"历史网络若被采用属于模型参数；该结构与维度仍待验证。","terms":["world_model","context","ekf"]},"provenanceDetail":"方法方案候选；世界模型尚未实现或定型"},{"id":"ws_context","title":"物理条件与实际步长","subtitle":"上下文 ξₜ 与本次持续时间 Δtₜ","x":680,"y":0,"branch":"input","status":"data","shapes":["摩擦 / 质量 / 执行器条件","Δt≈0.14或0.16秒"],"note":"环境随机条件和控制持续时间需要分别记录。","detail":"同一高层动作在不同摩擦、质量或执行器条件下产生不同转移。当前rand_control还让动作持续7或8个低层周期，因此Δt必须作为本次转移的条件，而不能只保留一个固定回合参数。想象时按真实机制处理这些条件，不让Actor随意改变物理参数。","provenance":"拟新增 · 结构候选","sources":[{"label":"方法方案 §6–10","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"},{"label":"SuperMimic 原文","href":"papers/supermimic.pdf"}],"beginner":{"title":"物理条件与实际步长","summary":"环境随机条件和控制持续时间需要分别记录。","receives":"随真实轨迹记录的环境参数、外部运动条件和实际动作持续时间。","does":"为模型消除能够解释的状态转移差异。","sends":"作为共享动力学与已知更新规则的给定条件。","why":"减少把确定但未观测的条件差异误学成随机误差。","example":"相同抬升指令持续0.14秒或0.16秒，末端和物体位移可能不同。","learning":"条件不是Actor的优化变量，模型拟合使用它们解释实际结果。","terms":["world_model","context","ekf"]},"provenanceDetail":"方法方案候选；世界模型尚未实现或定型"},{"id":"ws_action","title":"高层动作条件","subtitle":"连续动作 uₜ 与固定夹爪条件 b̄ₜ","x":1020,"y":0,"branch":"actor","status":"data","shapes":["uₜ ∈ R⁸","b̄ₜ：开 / 闭"],"note":"拟合用实际执行动作；想象用当前Actor连续动作。","detail":"真实模型拟合读取与状态转移一致的已执行高层动作。策略想象阶段每一步重新调用同一Actor，连续动作可用固定噪声重参数化；夹爪开闭模式先作为给定条件。模型必须理解动作的真实限幅和目标增量语义，不能虚构更负的夹爪数值意味着更大抓力。","provenance":"拟新增 · 结构候选","sources":[{"label":"方法方案 §6–10","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"},{"label":"SuperMimic 原文","href":"papers/supermimic.pdf"}],"beginner":{"title":"高层动作条件","summary":"拟合用实际执行动作；想象用当前Actor连续动作。","receives":"真实轨迹中的已执行动作，或当前Actor在预测观测上的动作。","does":"区分8个连续通道和二值夹爪语义。","sends":"送入高层世界模型与已知命令更新。","why":"使模型导数与实际控制接口保持一致。","example":"固定短期闭爪序列，只比较连续抬升和底盘配合的效果。","learning":"拟合时更新ω；BPTT时沿连续动作导数更新θ。","terms":["world_model","context","ekf"]},"provenanceDetail":"方法方案候选；世界模型尚未实现或定型"},{"id":"ws_model","title":"共享高层动力学 Fω","subtitle":"覆盖冻结低层、控制与接触的等效结果","x":680,"y":300,"branch":"world","status":"trainable","shapes":["x̂ₜ₊₁=Fω(xₜ,aₜ,ξₜ,Δtₜ)","层数 / 宽度 / 隐状态维度未定"],"note":"同一模型跨初态与阶段复用，四组输出是语义分组。","detail":"世界模型学习一个高层动作执行后的闭环转移，包含冻结低层、机械臂控制以及机器人—物体接触的综合效果。无需在想象中再次调用真实仿真器。下方四组输出是语义分组，不承诺必须实现四个独立神经网络头。多步拟合时更新ω，策略BPTT时冻结ω并保留输入导数。","provenance":"拟新增 · 结构候选","sources":[{"label":"方法方案 §6–10","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"},{"label":"SuperMimic 原文","href":"papers/supermimic.pdf"}],"beginner":{"title":"共享高层动力学 Fω","summary":"同一模型跨初态与阶段复用，四组输出是语义分组。","receives":"当前状态、必要历史、实际动作、物理条件和持续时间。","does":"预测下一步物理状态及连续递推所需的内部信息。","sends":"输出底盘、末端、夹爪、物体状态，并参与下一步完整状态重建。","why":"把实际交互经验转化成可重复查询和可求导的动作后果预测。","example":"同一个模型学习接近、接触、抬升和滑落，而非为每个SGS family单独训练一个模型。","learning":"多步预测误差训练ω；Actor BPTT保持ω固定。","terms":["world_model","context","ekf"]},"provenanceDetail":"方法方案候选；世界模型尚未实现或定型","paper":[["对照：原文网络及训练算法",15,"原论文的人形机器人网络宽度仅作对照；本方案未确定世界模型层数、宽度或潜变量维度。"]]},{"id":"ws_base","title":"底盘状态输出","subtitle":"运动与稳定性","x":0,"y":600,"branch":"world","status":"data","shapes":["位姿 / 速度","高度 / 倾斜"],"note":"四组输出共同描述物理后果，具体网络头尚未定型。","detail":"预测底盘的运动增量、姿态及速度，保留高度和重力方向信息。底盘转动会改变局部坐标，需与末端和物体表达一致。这些量帮助评价接近效果与失稳风险；若显式预测全部关节，也可结合运动学重建其它身体信息。","provenance":"拟新增 · 结构候选","sources":[{"label":"方法方案 §6–10","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"},{"label":"SuperMimic 原文","href":"papers/supermimic.pdf"}],"beginner":{"title":"底盘状态输出","summary":"四组输出共同描述物理后果，具体网络头尚未定型。","receives":"共享高层动力学产生的相应状态预测。","does":"形成可解释的物理量，供相对关系、奖励和观测重建使用。","sends":"送入下一步状态组装。","why":"让模型误差与实际抓取需要对应，而不是只看总平均误差。","example":"抬升动作使物体更高，但同时导致底盘倾斜，需要在预测中体现。","learning":"这些量通过真实仿真状态监督模型；本节点不代表另一个独立优化器。","terms":["world_model","context","ekf"]},"provenanceDetail":"方法方案候选；世界模型尚未实现或定型"},{"id":"ws_ee","title":"末端状态输出","subtitle":"实际运动，而非仅控制目标","x":340,"y":600,"branch":"world","status":"data","shapes":["位姿 / 线速度 / 角速度","或由关节预测做运动学"],"note":"四组输出共同描述物理后果，具体网络头尚未定型。","detail":"预测末端实际到达的位置、姿态与运动速度，区分目标命令和真实响应。若采用完整关节状态模型，则末端由运动学推导，避免独立输出相互矛盾。该选择仍属于候选状态表示，应以闭环预测和任务判断能力验证。","provenance":"拟新增 · 结构候选","sources":[{"label":"方法方案 §6–10","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"},{"label":"SuperMimic 原文","href":"papers/supermimic.pdf"}],"beginner":{"title":"末端状态输出","summary":"四组输出共同描述物理后果，具体网络头尚未定型。","receives":"共享高层动力学产生的相应状态预测。","does":"形成可解释的物理量，供相对关系、奖励和观测重建使用。","sends":"送入下一步状态组装。","why":"让模型误差与实际抓取需要对应，而不是只看总平均误差。","example":"相同目标增量下，底盘移动与控制误差可能让实际末端轨迹不同。","learning":"这些量通过真实仿真状态监督模型；本节点不代表另一个独立优化器。","terms":["world_model","context","ekf"]},"provenanceDetail":"方法方案候选；世界模型尚未实现或定型"},{"id":"ws_grip","title":"夹爪状态输出","subtitle":"实际开度及必要运动信息","x":680,"y":600,"branch":"world","status":"data","shapes":["实际开度","必要时开合速度"],"note":"四组输出共同描述物理后果，具体网络头尚未定型。","detail":"实际开度是连续物理状态，命令开闭却由动作符号决定。两者不能混淆。模型需要预测命令经过执行与接触后夹爪处于什么状态，但不把闭爪命令等同于稳定抓持；辅助接触头需要独立可信标签，不作为本方案默认已实现部件。","provenance":"拟新增 · 结构候选","sources":[{"label":"方法方案 §6–10","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"},{"label":"SuperMimic 原文","href":"papers/supermimic.pdf"}],"beginner":{"title":"夹爪状态输出","summary":"四组输出共同描述物理后果，具体网络头尚未定型。","receives":"共享高层动力学产生的相应状态预测。","does":"形成可解释的物理量，供相对关系、奖励和观测重建使用。","sends":"送入下一步状态组装。","why":"让模型误差与实际抓取需要对应，而不是只看总平均误差。","example":"夹爪完全闭合可能是夹空；中间开度也可能是被物体阻挡。","learning":"这些量通过真实仿真状态监督模型；本节点不代表另一个独立优化器。","terms":["world_model","context","ekf"]},"provenanceDetail":"方法方案候选；世界模型尚未实现或定型"},{"id":"ws_obj","title":"物体状态输出","subtitle":"接触后运动、抬升、滑移和掉落","x":1020,"y":600,"branch":"world","status":"data","shapes":["位置 / 姿态","线速度 / 角速度"],"note":"四组输出共同描述物理后果，具体网络头尚未定型。","detail":"物体位姿与速度是交互建模的核心。可直接预测转移，也可将EKF运动外推作为先验再学习动作条件修正；后者属于独立候选结构。位置修正和旋转组合需各自尊重几何，不能把接触后物体强制固定在接触前外推轨迹上。","provenance":"拟新增 · 结构候选","sources":[{"label":"方法方案 §6–10","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"},{"label":"SuperMimic 原文","href":"papers/supermimic.pdf"}],"beginner":{"title":"物体状态输出","summary":"四组输出共同描述物理后果，具体网络头尚未定型。","receives":"共享高层动力学产生的相应状态预测。","does":"形成可解释的物理量，供相对关系、奖励和观测重建使用。","sends":"送入下一步状态组装。","why":"让模型误差与实际抓取需要对应，而不是只看总平均误差。","example":"模型需要区分物体被带起、从夹爪滑出，以及被碰撞推离。","learning":"这些量通过真实仿真状态监督模型；本节点不代表另一个独立优化器。","terms":["world_model","context","ekf"]},"provenanceDetail":"方法方案候选；世界模型尚未实现或定型"},{"id":"ws_rules","title":"已知规则递推","subtitle":"目标、任务记忆、外部运动与历史","x":1020,"y":300,"branch":"world","status":"fixed","shapes":["目标累加 / 保持计数","已知台面运动 / 历史窗口"],"note":"能由规则计算的部分不必全部自由回归。","detail":"累积末端目标、历史最近距离、最高抬升、保持进度及已知台面运动可以按规则更新。需要用到下一物理状态的规则与预测结果结合后完成。硬阈值若参与策略梯度，需要明确可微代理或截断边界；不能把代理成功当作真实SGS成功。","provenance":"拟新增 · 结构候选","sources":[{"label":"方法方案 §6–10","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"},{"label":"SuperMimic 原文","href":"papers/supermimic.pdf"}],"beginner":{"title":"已知规则递推","summary":"能由规则计算的部分不必全部自由回归。","receives":"历史状态、动作条件、实际步长，以及下一步预测物理状态。","does":"按已有语义递推已知控制与任务变量；需要可微近似时明确范围。","sends":"送入下一步完整状态组装和奖励、终止计算。","why":"减少模型自由度，并保持时间、目标和任务进度一致。","example":"物体满足抓取代理后保持次数增加，失去条件时按原规则重置。","learning":"规则本身没有可训练参数；相应梯度是否保留需与声明的BPTT目标一致。","terms":["world_model","context","ekf"]},"provenanceDetail":"方法方案候选；世界模型尚未实现或定型"},{"id":"ws_pack","title":"下一步完整状态 x̂ₜ₊₁","subtitle":"物理预测 + 递推历史 + 已知条件","x":1360,"y":600,"branch":"world","status":"data","shapes":["任务紧凑输出 ≠ 完整充分状态","缺失关节 / 记忆需补充"],"note":"必须足以递推下一动作、价值、奖励与终止。","detail":"四组物理输出与必要关节信息、历史隐状态和已知规则结果共同组成下一步状态。不能只预测几项任务指标，就宣称能够闭环训练策略。对当前Actor仍需要的关节位置速度等字段，必须通过充分的预测状态或合法映射提供，不能从真实未来取回。","provenance":"拟新增 · 结构候选","sources":[{"label":"方法方案 §6–10","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"},{"label":"SuperMimic 原文","href":"papers/supermimic.pdf"}],"beginner":{"title":"下一步完整状态 x̂ₜ₊₁","summary":"必须足以递推下一动作、价值、奖励与终止。","receives":"各组物理预测与控制、任务、观测历史的递推结果。","does":"检查并组成可继续递推的状态表示。","sends":"送往观测重建，并在下一想象步再次送入同一个Fω。","why":"保证模型能连续闭环运行，而非只做一次任务指标预测。","example":"只知道末端和物体位置还不够，下一步Actor需要的关节状态也必须有合法来源。","learning":"BPTT窗口内部保持连续连接，不逐步detach状态。","terms":["world_model","context","ekf"]},"provenanceDetail":"方法方案候选；世界模型尚未实现或定型"},{"id":"ws_observation","title":"派生关系与观测重建 O","subtitle":"由预测状态构造下一步合法输入","x":1360,"y":300,"branch":"world","status":"fixed","shapes":["物体—末端相对位姿 / 速度","预测历史 → 因果EKF观测"],"note":"静态几何可复用，候选与EKF随预测历史更新。","detail":"计算物体—末端相对运动、物体相对台面高度等派生量，并重建原Actor与Critic输入。资产几何特征可复用，候选抓取位姿需随预测物体和机器人状态变换。EKF使用已有历史加预测轨迹因果推进，不能读取真实未来或每步重复起点预报。","provenance":"拟新增 · 结构候选","sources":[{"label":"方法方案 §6–10","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"},{"label":"SuperMimic 原文","href":"papers/supermimic.pdf"}],"beginner":{"title":"派生关系与观测重建 O","summary":"静态几何可复用，候选与EKF随预测历史更新。","receives":"完整下一步预测状态、物体静态特征、抓取候选模板及递推历史。","does":"构造与真实接口一致的下一步观测，并保留声明所需的可微路径。","sends":"送给下一步Actor、末端Critic及任务目标计算。","why":"真实训练的网络只有在输入语义一致时，才能用于模型中的状态。","example":"底盘转向以后，相同世界位置的物体在教师局部坐标中的表示也会改变。","learning":"映射本身可解析；现有EKF代码不自动具有所需梯度，方案需要明确可微实现或近似边界。","terms":["world_model","context","ekf"]},"provenanceDetail":"方法方案候选；世界模型尚未实现或定型"},{"id":"ws_consumers","title":"下一步 Actor 与任务评价","subtitle":"闭环调用相同θ；终点调用相同ψ","x":1360,"y":0,"branch":"actor","status":"fixed","shapes":["ôₜ₊₁ → πθ","r̂ / d̂ / V_real"],"note":"每步重新调用当前策略；真实结果才更新SGS。","detail":"每个想象步都让同一个Actor根据最新预测观测输出动作。预测奖励、终止代理和末端真实价值共同构成短期目标。Critic继续由真实经验训练；在Actor BPTT中固定ψ、保留输入梯度。可信度控制使用范围，实际成功统计仍由真实仿真回合给出。","provenance":"拟新增 · 结构候选","sources":[{"label":"方法方案 §6–10","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"},{"label":"SuperMimic 原文","href":"papers/supermimic.pdf"}],"beginner":{"title":"下一步 Actor 与任务评价","summary":"每步重新调用当前策略；真实结果才更新SGS。","receives":"合法重建的预测观测和奖励、终止所需状态。","does":"继续闭环产生动作，或在窗口终点评价后续任务回报。","sends":"交给下一想象步和短期BPTT目标。","why":"模型应描述策略持续响应状态变化的后果。","example":"物体开始滑动后，下一步策略可以根据预测的新状态调整抬升方向。","learning":"Actor BPTT更新θ；模型ω和价值ψ参数固定，但输入梯度仍传播。","terms":["world_model","context","ekf"]},"provenanceDetail":"方法方案候选；世界模型尚未实现或定型"}],"edges":[{"from":"ws_state","to":"ws_model","label":"物理状态","kind":"data"},{"from":"ws_history","to":"ws_model","label":"必要历史","kind":"data"},{"from":"ws_context","to":"ws_model","label":"ξ 与 Δt","kind":"condition"},{"from":"ws_action","to":"ws_model","label":"连续动作 + 夹爪条件","kind":"data"},{"from":"ws_history","to":"ws_rules","label":"控制与任务记忆","kind":"data"},{"from":"ws_action","to":"ws_rules","label":"命令更新","kind":"data"},{"from":"ws_context","to":"ws_rules","label":"步长与外部运动","kind":"condition"},{"from":"ws_model","to":"ws_base","label":"下一步物理预测","kind":"data"},{"from":"ws_base","to":"ws_pack","label":"状态分量","kind":"data"},{"from":"ws_model","to":"ws_ee","label":"下一步物理预测","kind":"data"},{"from":"ws_ee","to":"ws_pack","label":"状态分量","kind":"data"},{"from":"ws_model","to":"ws_grip","label":"下一步物理预测","kind":"data"},{"from":"ws_grip","to":"ws_pack","label":"状态分量","kind":"data"},{"from":"ws_model","to":"ws_obj","label":"下一步物理预测","kind":"data"},{"from":"ws_obj","to":"ws_pack","label":"状态分量","kind":"data"},{"from":"ws_model","to":"ws_pack","label":"所需辅助状态 / 隐状态","kind":"data"},{"from":"ws_rules","to":"ws_pack","label":"已知变量递推","kind":"data"},{"from":"ws_pack","to":"ws_observation","label":"完整预测状态","kind":"data"},{"from":"ws_observation","to":"ws_consumers","label":"观测 / 任务评价输入","kind":"data"},{"from":"ws_model","to":"ws_rules","kind":"data","label":"预测物理结果 → 历史与保持计数","beginnerLabel":"根据新结果递推任务历史"}],"beginner":{"title":"04 · 世界模型结构","subtitle":"物理输出要与控制记忆和观测重建一起闭合。","summary":"先看输入，再看共享模型与四组输出，最后检查是否能继续让原策略作出下一动作。","steps":["ws_state","ws_history","ws_context","ws_action","ws_model","ws_base","ws_ee","ws_grip","ws_obj","ws_rules","ws_pack","ws_observation","ws_consumers"]}},{"id":"model_fit","title":"05 · 世界模型拟合","subtitle":"回放真实动作，多步预测物理结果；这里只更新模型参数 ω。","summary":"真值仅作监督；第 2 步用第 1 步预测。图示 2 步代表可选 K 步，并非规定预测窗口。","formula":"x̂ⱼ₊₁ = Fω(x̂ⱼ,aⱼ,ξ,Δtⱼ)；ω ← ω − η ∇ω LWM","formulaNote":"模型拟合反传更新 ω；与回报穿过冻结模型更新 θ 的策略 BPTT 分开。","nodes":[{"id":"wm_window","title":"真实连续轨迹窗口","subtitle":"来自 Isaac Gym 执行记录","x":0,"y":0,"branch":"input","status":"data","shapes":["同一回合","K 步窗口"],"note":"保留成功与失败片段，训练模型理解实际动作后果。","detail":"来源：当前和历史教师在同一受控系统中的真实仿真转移。\\n内容：起点、实际执行动作、后续物理真值、环境条件、实际步长和回合边界。\\n采样：兼顾近期策略与历史接触/保持阶段。","caution":"片段不能跨回合重置；静态 SGS bank 不是动力学转移数据。","sources":[{"label":"方案第 8 节 · 世界模型如何学习","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"真实连续轨迹窗口","summary":"保留成功与失败片段，训练模型理解实际动作后果。","receives":"真实仿真轨迹与必要控制、观测历史。","does":"抽取长度 K 的连续窗口，区分起点、输入条件和监督答案。","sends":"分别提供给起点恢复、动作回放、条件和真值节点。","why":"世界模型需要学习执行动作造成的状态变化。","example":"从第一次闭爪之前开始，连续记录触碰、抬升与滑落。","learning":"此处只选数据；Actor、Critic 和世界模型均不在抽样时更新。","terms":["autoregressive","replay","world_model"]},"provenance":"拟新增","provenanceDetail":"拟新增"},{"id":"wm_init","title":"恢复完整窗口起点","subtitle":"物理状态＋必要记忆","x":340,"y":0,"branch":"input","status":"fixed","shapes":["x̂₀ = x₀","固定真实起点"],"note":"用真实起点初始化，后续步骤使用模型自己的预测。","detail":"起点：包括物理状态、必要低层/控制记忆、任务进度和观测历史；可由历史编码形成部分隐状态。\\n规则：已知目标、计数和外部运动可按已知规则推进。","caution":"不能把同一姿态视为唯一状态；历史编码可训练时应归入世界模型参数并明确边界。","sources":[{"label":"方案第 8 节 · 世界模型如何学习","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"恢复完整窗口起点","summary":"用真实起点初始化，后续步骤使用模型自己的预测。","receives":"窗口中的真实起点以及对应历史。","does":"构造支持连续预测的状态 x₀；不向起点之前反传。","sends":"把 x̂₀ 交给第一个共享世界模型。","why":"相同末端位置可能对应不同步态、目标积累与控制历史。","example":"两次夹爪位置相同，但低层腿部历史不同，底盘下一步可能不同。","learning":"固定日志起点；如含学习的状态编码器，其训练属于模型学习。","terms":["autoregressive","replay","world_model"]},"provenance":"拟新增","provenanceDetail":"拟新增"},{"id":"wm_step1","title":"共享世界模型 · 第 1 步","subtitle":"高层闭环转移 Fω","x":680,"y":0,"branch":"world","status":"trainable","shapes":["Fω(x̂₀,a₀,ξ,Δt₀)","输出 x̂₁"],"note":"预测机器人、夹爪与物体下一步的联合状态。","detail":"模型：学习高层动作经固定低层控制、机械臂控制及物理接触后的等效结果。\\n输出：物理输出加能继续递归的历史/规则状态。\\n共享：此处与下一步是同一个 Fω 的时间展开。","caution":"不是重新运行可微 Isaac Gym；也不是独立训练另一个低层策略。","sources":[{"label":"方案第 8 节 · 世界模型如何学习","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"共享世界模型 · 第 1 步","summary":"预测机器人、夹爪与物体下一步的联合状态。","receives":"完整起点、日志动作 a₀、环境条件 ξ 和本步时长 Δt₀。","does":"预测第一步物理转移，并推进必要记忆与已知规则。","sends":"向下一时间步发送 x̂₁，同时提供用于误差比较的物理输出。","why":"用可微映射表达机器人动作如何影响自身与物体。","example":"预测闭爪与底盘前进后，物体是被带动还是被推偏。","learning":"本阶段可更新 ω；Actor 和 Critic 不参与参数学习。","terms":["autoregressive","replay","world_model"]},"provenance":"拟新增","provenanceDetail":"拟新增","paper":[["借鉴：多步自回归世界模型拟合",5,"借鉴训练原则；本方案的机器人、物体状态和控制接口另行定义。"]]},{"id":"wm_step2","title":"共享世界模型 · 第 2 步","subtitle":"继续展开至第 K 步","x":1020,"y":0,"branch":"world","status":"trainable","shapes":["Fω(x̂₁,a₁,ξ,Δt₁)","ω 跨时间共享"],"note":"使用前一步预测和下一条日志动作，检验误差累积。","detail":"自回归：第 2 步输入 x̂₁，而不是日志中的真实 x₁。\\n动作：仍沿实际记录动作序列推进，不由当前 Actor 重新选择。\\n窗口：图示 2 步，实际 K 应根据高层控制物理时间与误差选择。","caution":"后续真值仅用于监督；不能把真实未来状态注入自回归输入。原文的 8 步不作为本方案固定值。","sources":[{"label":"方案第 8 节 · 世界模型如何学习","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"共享世界模型 · 第 2 步","summary":"使用前一步预测和下一条日志动作，检验误差累积。","receives":"模型预测的 x̂₁、日志动作 a₁、同一回合条件与本步时长。","does":"调用同一个 Fω，继续预测 x̂₂，并可扩展到 K 步。","sends":"输出连续预测供物理与相对关系误差比较。","why":"单步拟合准确仍可能连续滚动失真。","example":"第一步略微高估抓持稳定性，第二步是否会错误预测物体继续跟随。","learning":"与第 1 步共同更新同一组 ω；无需新增第二套网络。","terms":["autoregressive","replay","world_model"]},"provenance":"拟新增","provenanceDetail":"拟新增"},{"id":"wm_actions","title":"回放实际执行动作","subtitle":"包含连续命令与夹爪模式","x":0,"y":300,"branch":"input","status":"data","shapes":["a₀,…,aK₋₁","日志中的实际动作"],"note":"回放日志动作，当前 Actor 不改写这段经验。","detail":"动作：记录真正送入高层执行链的命令，以及会影响转移的执行处理。\\n用途：作为每一步世界模型输入；日志视为常量。","caution":"不能拿当前策略重新产生的动作去配对旧轨迹的下一状态。","sources":[{"label":"方案第 8 节 · 世界模型如何学习","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"回放实际执行动作","summary":"回放日志动作，当前 Actor 不改写这段经验。","receives":"同一窗口实际执行的高层动作。","does":"逐步读取对应动作，区分连续部分与二值夹爪开闭。","sends":"将 a₀、a₁ 等分别输入对应时间步 Fω。","why":"同一状态执行不同动作，预测答案应不同。","example":"日志第二步是继续闭爪，就不能换成当前策略提出的开爪再对旧结果求误差。","learning":"日志动作不更新；模型损失不会训练 Actor。","terms":["autoregressive","replay","world_model"]},"provenance":"拟新增","provenanceDetail":"拟新增"},{"id":"wm_context","title":"物理条件与实际步长","subtitle":"固定回合条件／逐步时长","x":340,"y":300,"branch":"input","status":"data","shapes":["ξ：回合条件","Δt₀, Δt₁, …"],"note":"让模型区分不同物理条件和不同动作执行时长。","detail":"条件：尽可能记录影响动力学的随机化及已知外部运动条件。\\n时间：本入口高层动作持续时间为 0.14/0.16 秒；逐步记录，不混作固定一步。\\n噪声：观测噪声与物理真值分开。","caution":"训练侧物理条件不因此成为 Actor 可用观测；无法观测的随机扰动不保证能确定预测。","sources":[{"label":"方案第 8 节 · 世界模型如何学习","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"物理条件与实际步长","summary":"让模型区分不同物理条件和不同动作执行时长。","receives":"窗口内物理参数、外部运动与每步实际持续时间。","does":"向各步提供相应条件，并保持回合级参数一致。","sends":"条件输入到第 1、2 及后续模型步骤。","why":"同样命令执行时间不同，机器人与物体位移就可能不同。","example":"动作执行 0.16 秒与 0.14 秒，应由模型明确区分。","learning":"条件为输入数据，不通过训练改变物理参数。","terms":["autoregressive","replay","world_model"]},"provenance":"拟新增","provenanceDetail":"拟新增"},{"id":"wm_physical","title":"统一物理输出","subtitle":"底盘／末端／夹爪／物体","x":680,"y":300,"branch":"world","status":"fixed","shapes":["ŝ₁,…,ŝK","统一参考系与旋转表示"],"note":"保留速度、姿态和底盘稳定性，不能只预测距离。","detail":"输出：底盘运动与稳定性、实际末端位姿及速度、夹爪实际开度、物体位姿与速度。\\n闭环：还必须能够构造下一步观测、奖励和终止所需状态。\\n候选：若使用全关节状态，末端通过运动学派生，避免独立预测矛盾。","caution":"紧凑物理输出不等于充分状态；必要记忆仍在 x 内。","sources":[{"label":"方案第 8 节 · 世界模型如何学习","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"统一物理输出","summary":"保留速度、姿态和底盘稳定性，不能只预测距离。","receives":"连续模型输出的各步状态。","does":"提取并统一表达可解释的基本物理量。","sends":"送到物理损失，并用于计算抓取相对关系。","why":"相同位置、不同速度，可能对应稳定跟随或即将碰撞。","example":"物体高度增加但相对夹爪速度变大，可能预示即将滑落。","learning":"此节点是输出组织与固定映射，梯度可继续流回 ω。","terms":["autoregressive","replay","world_model"]},"provenance":"拟新增","provenanceDetail":"拟新增"},{"id":"wm_relative","title":"派生抓取相对关系","subtitle":"共享物理预测，保持一致","x":1020,"y":300,"branch":"world","status":"fixed","shapes":["末端↔物体相对位姿/速度","物体↔台面高度"],"note":"强调决定抓取成败的几何与运动关系。","detail":"派生：由同一组基本状态计算末端—物体相对位姿、速度及物体相对台面高度。\\n监督：与真实状态派生的对应量比较。","caution":"相对量不必单独预测；避免其与基本状态互相矛盾。","sources":[{"label":"方案第 8 节 · 世界模型如何学习","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"派生抓取相对关系","summary":"强调决定抓取成败的几何与运动关系。","receives":"预测底盘、末端、物体与台面状态。","does":"计算抓取对准、相对运动和抬升量。","sends":"把这些关系送入相对误差项。","why":"整体平均误差小，仍可能掩盖足以导致夹空的小相对误差。","example":"整体平移预测略有偏差，但必须检查末端与物体是否真的对准。","learning":"通过这些可微关系把误差传回模型，不训练独立策略。","terms":["autoregressive","replay","world_model"]},"provenance":"拟新增","provenanceDetail":"拟新增"},{"id":"wm_truth","title":"真实后续状态 · 仅监督","subtitle":"Isaac Gym 物理真值","x":0,"y":600,"branch":"input","status":"data","shapes":["s₁,…,sK","不是 EKF 预测"],"note":"真实未来只用来核对答案，不进入预测递归。","detail":"标签：真实仿真执行后得到的机器人和物体状态。\\n监督：基本物理量及由真值计算的相对关系。\\n辅助：接触/滑移事件只有可信独立标签时才作为学习目标。","caution":"SGS 的任务成功代理不等于真实接触标签；EKF 预测也不是动力学真值。","sources":[{"label":"方案第 8 节 · 世界模型如何学习","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"真实后续状态 · 仅监督","summary":"真实未来只用来核对答案，不进入预测递归。","receives":"与日志动作严格对齐的真实下一状态序列。","does":"提供每个预测时刻的监督目标。","sends":"通过监督边进入模型损失，不流向 Fω 的下一步输入。","why":"模型需要学习实际发生的结果，而非复现另一个预测器。","example":"闭爪后真实物体落回台面，就应把掉落状态作为答案。","learning":"真实标签固定，不反向更新仿真器或日志。","terms":["autoregressive","replay","world_model"]},"provenance":"拟新增","provenanceDetail":"拟新增"},{"id":"wm_boundary","title":"与策略 BPTT 的区别","subtitle":"这里学习“预测得准”","x":340,"y":600,"branch":"loss","status":"fixed","shapes":["模型拟合 → 更新 ω","策略 BPTT → 更新 θ"],"note":"两者都可多步反传，但目标与参数完全不同。","detail":"本页：沿记录动作自回归，最小化预测误差，更新 ω。\\n策略页：当前 Actor 闭环选动作，最大化想象回报，冻结 ω/ψ、更新 θ。","caution":"只训练多步预测模型，不等于已经采用 SuperMimic 的策略 BPTT。","sources":[{"label":"方案第 8 节与第 10.3 节 · 两种时间反传","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"与策略 BPTT 的区别","summary":"两者都可多步反传，但目标与参数完全不同。","receives":"本页模型误差目标与策略 BPTT 的不同定义。","does":"明确反传对象和目标，避免把两条学习路径混同。","sends":"作为本页阅读边界；策略回报梯度见 BPTT 视图。","why":"即使二者都使用时间反向传播，得到的学习能力不同。","example":"预测掉落更准确属于模型学习；学会调整抬升动作属于策略学习。","learning":"本页只更新世界模型；策略 BPTT 才更新 Actor。","terms":["autoregressive","replay","world_model"]},"provenance":"拟新增","provenanceDetail":"拟新增"},{"id":"wm_loss","title":"多步状态预测损失","subtitle":"物理误差＋相对关系误差","x":680,"y":600,"branch":"loss","status":"loss","shapes":["物理误差＋相对误差","事件项：有标签才启用"],"note":"按物理量尺度和抓取重要性比较连续预测与真值。","detail":"目标：逐步比较基本物理状态与相对关系；旋转使用合适几何误差。\\n可选：可靠事件标签可增加事件误差，初版不强制事件预测头。\\n验证：多步误差小不自动意味着动作梯度可靠。","caution":"不同量纲不能未经处理直接堆积；权重与 K 是待验证设计，不照搬原文参数。","sources":[{"label":"方案第 8 节 · 世界模型如何学习","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"多步状态预测损失","summary":"按物理量尺度和抓取重要性比较连续预测与真值。","receives":"每一步预测状态、派生相对关系及相应真值。","does":"汇总 K 步预测误差，保留跨时间的模型计算图。","sends":"梯度沿各步模型回传，用于更新共享 ω。","why":"让模型既预测整体运动，也重视夹取与滑移的关键误差。","example":"物体位置略错导致相对夹爪关系错误，应在任务相关误差中体现。","learning":"仅优化模型预测误差；不最大化回报，不训练 Actor 或 Critic。","terms":["autoregressive","replay","world_model"]},"formula":"LWM = Σⱼ [λs ℓphysical(ŝⱼ,sⱼ) + λr ℓrelative(ŝⱼ,sⱼ)]","provenance":"拟新增","provenanceDetail":"拟新增"},{"id":"wm_update","title":"更新共享模型参数 ω","subtitle":"两个时间步共享同一组权重","x":1020,"y":600,"branch":"param","status":"trainable","shapes":["ω ← ω − η ∇ω LWM","θ、ψ 保持不变"],"note":"把所有预测步的误差信号合并，改进同一个世界模型。","detail":"更新：所有展开节点贡献到同一组参数 ω。\\n阶段边界：训练后再在策略 BPTT 阶段冻结 ω，保留输入导数。","caution":"拟合模型时的梯度不能误流向日志动作对应的旧 Actor。","sources":[{"label":"方案第 8 节 · 世界模型如何学习","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"更新共享模型参数 ω","summary":"把所有预测步的误差信号合并，改进同一个世界模型。","receives":"多步模型损失对共享参数的梯度。","does":"执行模型参数更新；可训练的状态编码属于相应模型参数集合。","sends":"更新后的 Fω 用于后续拟合、诊断与可信短期想象。","why":"多种初态和动作经验能够共同塑造共享的交互规律。","example":"一次滑落轨迹修正后，其他相近抓持状态也可能预测得更准确。","learning":"更新 ω；不更新 θ 或 ψ。","terms":["autoregressive","replay","world_model"]},"provenance":"拟新增","provenanceDetail":"拟新增"}],"edges":[{"to":"wm_init","label":"起点与历史","kind":"data","beginnerLabel":"起点与历史","from":"wm_window"},{"to":"wm_actions","label":"真实动作序列","kind":"data","beginnerLabel":"真实动作序列","from":"wm_window"},{"to":"wm_context","label":"环境条件/步长","kind":"data","beginnerLabel":"环境条件/步长","from":"wm_window"},{"to":"wm_truth","label":"真实结果","kind":"data","beginnerLabel":"真实结果","from":"wm_window"},{"to":"wm_step1","label":"x̂₀","kind":"data","beginnerLabel":"x̂₀","from":"wm_init"},{"to":"wm_step1","label":"a₀","kind":"condition","beginnerLabel":"a₀","from":"wm_actions"},{"to":"wm_step2","label":"a₁","kind":"condition","beginnerLabel":"a₁","from":"wm_actions"},{"to":"wm_step1","label":"ξ, Δt₀","kind":"condition","beginnerLabel":"ξ, Δt₀","from":"wm_context"},{"to":"wm_step2","label":"ξ, Δt₁","kind":"condition","beginnerLabel":"ξ, Δt₁","from":"wm_context"},{"to":"wm_step2","label":"x̂₁（不替换为真值）","kind":"data","beginnerLabel":"x̂₁（不替换为真值）","from":"wm_step1"},{"to":"wm_physical","label":"ŝ₁","kind":"data","beginnerLabel":"ŝ₁","from":"wm_step1"},{"to":"wm_physical","label":"ŝ₂…ŝK","kind":"data","beginnerLabel":"ŝ₂…ŝK","from":"wm_step2"},{"to":"wm_relative","label":"统一物理状态","kind":"data","beginnerLabel":"统一物理状态","from":"wm_physical"},{"to":"wm_loss","label":"物理预测","kind":"data","beginnerLabel":"物理预测","from":"wm_physical"},{"to":"wm_loss","label":"相对关系","kind":"data","beginnerLabel":"相对关系","from":"wm_relative"},{"to":"wm_loss","label":"对齐真值","kind":"supervision","beginnerLabel":"对齐真值","from":"wm_truth"},{"to":"wm_step1","label":"∂L/∂x̂₁","kind":"gradient","beginnerLabel":"∂L/∂x̂₁","from":"wm_loss"},{"to":"wm_step2","label":"∂L/∂x̂₂","kind":"gradient","beginnerLabel":"∂L/∂x̂₂","from":"wm_loss"},{"to":"wm_step1","label":"时间反传","kind":"gradient","beginnerLabel":"时间反传","from":"wm_step2"},{"to":"wm_update","label":"∇ω LWM","kind":"gradient","beginnerLabel":"∇ω LWM","from":"wm_loss"},{"to":"wm_step1","label":"共享 ω 更新","kind":"update","beginnerLabel":"共享 ω 更新","from":"wm_update"},{"to":"wm_step2","label":"同一 ω 更新","kind":"update","beginnerLabel":"同一 ω 更新","from":"wm_update"}],"beginner":{"title":"05 · 世界模型拟合","subtitle":"用真实仿真记录对答案，教模型理解动作后果。","summary":"先固定起点与实际动作，再连续预测；后续真值只用于比较误差。","steps":["wm_window","wm_init","wm_step1","wm_step2","wm_actions","wm_context","wm_physical","wm_relative","wm_truth","wm_boundary","wm_loss","wm_update"]}},{"id":"ppo","title":"06 · PPO 与长期价值","subtitle":"真实轨迹更新 θ 和 ψ；模型历史 replay 不直接充当 PPO 采样批次。","summary":"PPO 学习完整动作；Critic 从真实回报学习长期价值，再供想象终点使用。","formula":"真实轨迹 → GAE / 回报目标 → PPO 更新 θ ＋ 价值拟合更新 ψ","formulaNote":"末端价值是累计任务回报，不是成功概率。世界模型 BPTT 是另一条 Actor 更新路径。","nodes":[{"id":"ppo_rollout","title":"近期真实仿真 rollout","subtitle":"由采集策略 πθold 产生","x":0,"y":0,"branch":"sim","status":"data","shapes":["oₜ, aₜ, rₜ₊₁","log πold(aₜ|oₜ), V旧, done"],"note":"PPO 使用本轮按策略采集的实际执行结果。","detail":"SGS 选择初态，采集策略在 Isaac Gym 中执行，记录观测、实际动作、奖励、终止与旧动作概率。\\n真实指物理仿真执行结果，不是实机数据。模型历史 replay 不能不加修正地直接作为 PPO 的 on-policy 批次。","provenance":"已有","sources":[{"label": 。","does":"由优化过程调整当前教师的参数。","sends":"向后续真实采样和想象展开提供同一更新后 Actor。","why":"两种学习信号共同服务一个教师，而非两个彼此独立的策略。","example":"真实经验纠正模型建议，模型梯度补充连续动作的局部改进方向。","learning":"θ 可以由两条路径更新；其他网络按各自阶段更新。","terms":["ppo","gae","critic"]},"provenanceDetail":"已有"},{"id":"ppo_critic","title":"真实回报 Critic Vψ","subtitle":"基线兼容输入 v = o","x":0,"y":620,"branch":"critic","status":"trainable","shapes":["Vψ(vₜ)","当前策略的累计任务回报"],"note":"先沿用现有观测；特权输入是可选扩展。","detail":"基线 Actor 和 Critic 使用相同观测空间。图中 v 表示 Critic 实际输入，不能默认等同完整仿真状态 x。\\n若另行增加保持进度、真实速度等特权信息，需要独立对照。回报归一化应与模型终点评价保持单位一致。","provenance":"已有","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"}],"beginner":{"title":"真实回报 Critic Vψ","summary":"先沿用现有观测；特权输入是可选扩展。","receives":"接收真实轨迹中的 Critic 输入。","does":"估计从当前信息继续执行策略的未来累计任务回报。","sends":"输出价值预测给价值拟合。","why":"短期窗口之外仍可能发生保持成功或失抓，需要长期评价。","example":"同样已经抬升，一个状态稳定、另一个很快掉落，价值应有区别。","learning":"真实价值损失更新 ψ。","terms":["ppo","gae","critic"]},"provenanceDetail":"已有"},{"id":"ppo_valueloss","title":"真实价值拟合损失","subtitle":"Vψ 对齐固定真实回报目标","x":340,"y":620,"branch":"loss","status":"loss","shapes":["Lvalue(Vψ(vₜ), R̂ₜ)","真实监督，不用想象 λ-return"],"note":"训练长期价值的答案来自实际轨迹。","detail":"主方案用真实奖励与 bootstrap 构造价值目标。与原版 SuperMimic 的想象 λ-return 训练 Critic 不同。\\n来自模型的高分不会在此被直接当作真实价值标签，模型终点只是读取当前 Critic。","provenance":"已有","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"}],"beginner":{"title":"真实价值拟合损失","summary":"训练长期价值的答案来自实际轨迹。","receives":"接收当前价值预测与固定真实回报目标。","does":"计算估值与本轮参考回报的差异。","sends":"输出价值网络更新信号。","why":"防止把模型中的虚构收益直接写成价值监督。","example":"预测能保持很久，真实却立即失抓，价值会被修正。","learning":"本路径只更新 Critic ψ。","terms":["ppo","gae","critic"]},"provenanceDetail":"已有"},{"id":"ppo_psi","title":"Critic 参数 ψ","subtitle":"真实训练；想象时冻结参数","x":680,"y":620,"branch":"param","status":"trainable","shape er":{"title":"06 · PPO 与长期价值","subtitle":"实际执行提供策略和价值的共同依据。","summary":"先从真实经验制作参考答案，再分别修改动作策略和长期评分器。","steps":["ppo_rollout","ppo_boundary","ppo_gae","ppo_targets","ppo_actor","ppo_ratio","ppo_actorloss","ppo_theta","ppo_critic","ppo_valueloss","ppo_psi"]}},{"id":"bptt","title":"07 · 短期 BPTT 展开","subtitle":"同一 Actor 沿时间展开；冻结模型与 Critic 参数，保留它们对输入的导数。","summary":"两步示意前向预测，再从短期奖励和末端价值反向追踪动作影响。最终只更新 θ。","formula":"ĴH = Σₖ₌₀ᴴ⁻¹ γᵏ ĉₖ r̂ₖ₊₁ + γᴴ ĉH Vψ(v̂H)；gBPTT = ∇θ ĴH","formulaNote":"H 按预测可信度与物理时间选择。二值夹爪作为固定条件，PPO 继续学习开闭决策；模型梯度不等于真实任务的无偏梯度。","nodes":[{"id":"bt_seed","title":"真实起点 x̂₀ = xₜ","subtitle":"可信经验状态，起点停止梯度","x":0,"y":0,"branch":"input","status":"stop","shapes":["物理状态 + 控制记忆","任务进度 + 因果观测历史"],"note":"只向未来展开，不反传回过去的仿真。","detail":"起点从真实经验中按 qimag 选择，须包含对应控制历史、任务进度和观测历史。不能只恢复机器人静态姿态。\\n起点和此前历史作为给定条件，不对采样选择或历史仿真反向传播。","provenance":"拟新增","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"}],"beginner":{"title":"真实起点 x̂₀ = xₜ","summary":"只向未来展开，不反传回过去的仿真。","receives":"接收可信真实轨迹中的完整中间状态。","does":"固定本次想象起点。","sends":"向观测构造和第一个世界模型步骤提供 x̂₀。","why":"正确历史决定同一动作接下来会发生什么。","example":"从物体接近夹爪但尚未接触的真实状态开始短期推演。","learning":"不更新任何参数。","terms":["bptt","frozen","stop","gripper"]},"provenanceDetail":"拟新增"},{"id":"bt_obs0","title":"因果观测 O(x̂₀)","subtitle":"沿用 Actor 的 EKF 接口","x":340,"y":0,"branch":"world","status":"stop","shapes":["ô₀ = O(x̂₀)","不把训练真值直接交给 Actor"],"note":"起点观测作为给定条件；未来观测保留输入导数。","detail":"O 包含策略需要的观测及 EKF 历史处理。主方案保持 Actor 的信息条件；训练侧特权参数不自动成为 Actor 输入。\\n连续想象中的观测映射必须支持所声明的梯度路径；近似或截断需明确。不得读取真实未来。\\n起点状态及此前历史固定，因此初始观测不对采样起点求导；后续观测由预测状态产生，相关导数保留。","provenance":"拟新增","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"}],"beginner":{"title":"因果观测 O(x̂₀)","summary":"起点观测作为给定条件；未来观测保留输入导数。","receives":"接收起点状态及起点前真实历史。","does":"构造当前可用观测和 EKF 未来位姿特征。","sends":"向 Actor 提供 ô₀。","why":"模型训练可以看真值，策略仍应遵循原有感知条件。","example":"根据目前物体运动历史判断它可能朝哪里移动。","learning":"观测规则不更新参数；窗口内相关输入导数须保留。","terms":["bptt","frozen","stop","gripper"]},"provenanceDetail":"拟新增"},{"id":"bt_actor0","title":"Actor πθ · 第 0 步","subtitle":"同一组可训练参数 θ","x":680,"y":0,"branch":"actor","status":"trainable","shapes":["û₀ = πθᶜ(ô₀; ε₀)","连续动作路径可微"],"note":"选择连续动作；夹爪模式作为给定条件。","detail":"连续动作采样与当前策略对应，例如固定采样噪声后重参数化。若只用均值动作，需要明确这是另一近似。\\n固定夹爪序列使辅助梯度只覆盖部分动作效应，不能宣称是完整混合动作策略的精确梯度。","provenance":"已有","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"}],"beginner":{"title":"Actor πθ · 第 0 步","summary":"选择连续动作；夹爪模式作为给定条件。","receives":"接收当前观测和给定动作采样噪声。","does":"产生末端增量、底盘命令等连续动作。","sends":"将 û₀ 交给世界模型。","why":"模型梯度需要经过策略输出，才能修改产生动作的规则。","example":"稍微改变末端接近方向，观察模型预测的后续抓取条件。","learning":"BPTT 允许更新 θ。","terms":["bptt","frozen","stop","gripper"]},"provenanceDetail":"已有"},{"id":"bt_world0","title":"世界模型 Fω · 第 0 步","subtitle":"参数冻结，输入导数保留","x":1020,"y":0,"branch":"world","status":"frozen","shapes":["x̂₁ = Fω(x̂₀, û₀, b̄₀, ξ₀, Δt₀)","∂F/∂x 与 ∂F/∂u 保留"],"note":"预测动作后的机器人—物体状态。","detail":"此阶段冻结 ω，但不能把整个 F 放入 no-grad。动作与输入状态的导数用于把后续回报传回前面的策略。\\n动力学模型包含高层命令、冻结低层控制和接触交互的等效结果；这里不调用物理仿真推进。","provenance":"拟新增 · BPTT 时冻结","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"}],"beginner":{"title":"世界模型 Fω · 第 0 步","summary":"预测动作后的机器人—物体状态。","receives":"接收当前状态、连续动作和本步给定条件。","does":"推算一个高层动作执行后的结果。","sends":"向下一步观测构造输出 x̂₁，并提供奖励评价所需转移。","why":"把动作变化与未来机器人、物体变化联系起来。","example":"预测末端接近后是否会推偏物体。","learning":"不更新 ω；梯度可以穿过 F 回到 θ。","terms":["bptt","frozen","stop","gripper"]},"provenanceDetail":"拟新增世界模型；监督拟合时训练 ω，本视图策略 BPTT 阶段冻结 ω 并保留输入梯度。"},{"id":"bt_condition","title":"本次固定条件","subtitle":"夹爪模式、随机条件与采样噪声","x":0,"y":310,"branch":"input","status":"fixed","shapes":["b̄₀:H−1, ξ₀:H−1, Δt₀:H−1","固定本次 ε；条件不求导"],"note":"二值开闭不走虚构的连续强度梯度。","detail":"夹爪模式或短期开闭序列作为给定条件，开闭决策主要由真实 PPO 学习。连续动作更新可能经共享参数间接改变夹爪输出，仍需约束整体策略。\\n回合物理参数在轨迹内保持对应一致；逐步时长等随机量按真实过程采样。图省略条件通往每步的重复边。","provenance":"拟新增","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"}],"beginner":{"title":"本次固定条件","summary":"二值开闭不走虚构的连续强度梯度。","receives":"接收实际分布下的物理上下文、动作时长及本次固定夹爪序列。","does":"为多步想象提供一致条件。","sends":"向所有想象步骤提供对应条件。","why":"不应让 Actor 利用模型捏造的更大闭爪力度改善分数。","example":"本次短窗口固定闭爪，只研究怎样抬升更稳定。","learning":"不对这些给定条件更新或反传。","terms":["bptt","frozen","stop","gripper"]},"provenanceDetail":"拟新增"},{"id":"bt_world1","title":"世界模型 Fω · 第 1 步","subtitle":"与上一步共享同一 ω","x":1020,"y":310,"branch":"world","status":"frozen","shapes":["x̂₂ = Fω(x̂₁, û₁, b̄₁, ξ₁, Δt₁)","不是用真值替换 x̂₁"],"note":"连续使用自身预测，窗口内状态链不断开。","detail":"第二步使用上一预测状态与当前 Actor 根据预测观测产生的动作。若中途替换真值或逐步 detach，就改变了这里所定义的闭环多步梯度。\\n图用两步示意 H 步窗口，不预设实际 H。窗口按物理时间和可信度选择。","provenance":"拟新增 · BPTT 时冻结","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"}],"beginner":{"title":"世界模型 Fω · 第 1 步","summary":"连续使用自身预测，窗口内状态链不断开。","receives":"接收 x̂₁、û₁ 及本步条件。","does":"继续推算下一状态。","sends":"向窗口终点与回报评价提供预测结果。","why":"后面结果必须能够通过动力学链影响前面动作。","example":"第一步推偏了物体，第二步动作也应基于偏移后的预测状态。","learning":"仍不更新 ω；保留跨时间输入梯度。","terms":["bptt","frozen","stop","gripper"]},"provenanceDetail":"拟新增世界模型；监督拟合时训练 ω，本视图策略 BPTT 阶段冻结 ω 并保留输入梯度。"},{"id":"bt_actor1","title":"Actor πθ · 第 1 步","subtitle":"再次调用同一 Actor θ","x":1360,"y":310,"branch":"actor","status":"trainable","shapes":["û₁ = πθᶜ(ô₁; ε₁)","所有时刻共享 θ"],"note":"后续动作由预测观测重新决定。","detail":"不是预先生成一串互不相关的固定动作。前序状态变化会改变本步观测和动作，该间接效应参与 BPTT。\\n两个 Actor 卡片是时间展开中的同一网络，并非两个独立策略。","provenance":"已有","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"}],"beginner":{"title":"Actor πθ · 第 1 步","summary":"后续动作由预测观测重新决定。","receives":"接收第一步之后的预测观测。","does":"根据预测情况重新计算连续动作。","sends":"输出 û₁ 给第二步世界模型。","why":"让模型训练反映策略真正闭环执行的方式。","example":"预测物体被轻微推偏后，策略调整下一次末端移动方向。","learning":"本时刻与其他时刻共同向 θ 累积梯度。","terms":["bptt","frozen","stop","gripper"]},"provenanceDetail":"已有"},{"id":"bt_obs1","title":"因果观测 O(x̂₁)","subtitle":"更新预测历史与 EKF","x":1360,"y":0,"branch":"world","status":"fixed","shapes":["ô₁ = O(x̂₁)","窗口内保留 ∂O/∂x"],"note":"下一观测从预测轨迹构造。","detail":"使用已有历史加预测状态更新观测，不在每步重复起点的一次 EKF 预报，也不使用仿真未来真值。\\n若既有 EKF 或观测路径不可微，需明确可微替代或梯度近似；本图表示方法要求，不声称现有实现已满足。","provenance":"拟新增","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"}],"beginner":{"title":"因果观测 O(x̂₁)","summary":"下一观测从预测轨迹构造。","receives":"接收第一步预测状态与因果历史。","does":"更新历史并构造下一 Actor 观测。","sends":"向同一 Actor 发送 ô₁。","why":"后续决策须反映前面动作产生的状态变化。","example":"模型预测物体开始随末端运动，后续观测也要体现这一变化。","learning":"参数规则固定，相关输入导数保留。","terms":["bptt","frozen","stop","gripper"]},"provenanceDetail":"拟新增"},{"id":"bt_terminal","title":"窗口终点 x̂H","subtitle":"示意 H=2；实际窗口待验证","x":680,"y":310,"branch":"world","status":"data","shapes":["由预测历史得到 v̂H","只在仍可信状态接尾值"],"note":"短窗口结束，不代表真实回合结束。","detail":"预测和动作效果失去可信度前停止展开，并在可信终点接价值。不能先进入明显错误状态，再指望 Critic 补救。\\nH 依据物理时间与真实验证选择，不照搬原文 32 步，也不要求覆盖完整保持 10 步。","provenance":"拟新增","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"}],"beginner":{"title":"窗口终点 x̂H","summary":"短窗口结束，不代表真实回合结束。","receives":"接收最后一步预测状态及历史。","does":"构造基线兼容的末端 Critic 输入 v̂H。","sends":"将 v̂H 送入冻结参数的价值网络。","why":"用短期模型承接局部动作效果，用价值承接窗口后结果。","example":"模型只推演一小段抬升，后续能否保持由价值评估。","learning":"终点状态梯度继续连回前面步骤。","terms":["bptt","frozen","stop","gripper"]},"provenanceDetail":"拟新增"},{"id":"bt_value","title":"末端真实回报 Critic Vψ","subtitle":"冻结 ψ，保留 ∂V / ∂v","x":340,"y":310,"branch":"critic","status":"frozen","shapes":["Vψ(v̂H)","真实回报单位保持一致"],"note":"真实经验训练的长期评价进入想象目标。","detail":"ψ 在真实 PPO 价值阶段学习，本阶段固定。不能 detach 末端价值，否则失去终点状态改善的直接梯度。\\n价值是累计任务回报，不是成功概率。真实数据上的拟合准确也不保证模型终点处输入梯度可靠。","provenance":"训练时冻结","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"}],"beginner":{"title":"末端真实回报 Critic Vψ","summary":"真实经验训练的长期评价进入想象目标。","receives":"接收由预测状态构造的基线兼容 Critic 输入。","does":"估计窗口以后按当前策略执行的剩余任务回报。","sends":"向总目标提供可对输入求导的尾值。","why":"短期快速抬升不应掩盖随后失抓的长期后果。","example":"两种抬升高度类似，但更稳的抓持状态应有更好的后续前景。","learning":"ψ 不更新；∂V/∂v 经预测状态传回 θ。","terms":["bptt","frozen","stop","gripper"]},"provenanceDetail":"训练时冻结"},{"id":"bt_objective","title":"短期想象总目标 ĴH","subtitle":"短期奖励 + 折扣末端价值","x":1020,"y":620,"branch":"loss","status":"loss","shapes":["Σ γᵏ ĉₖ r̂ₖ₊₁ + γᴴ ĉH Vψ(v̂H)","模型代理回报，不是真实成功统计"],"note":"评分在前向计算，随后反向追踪动作影响。","detail":"结束动作奖励乘 ĉₖ，尾值乘 ĉH。成功、失败、超时保持各自语义。\\n模型目标是可微代理，不保证其梯度等于真实接触任务的改进方向。想象高分不能直接更新 SGS 成功率。","provenance":"拟新增","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"}],"beginner":{"title":"短期想象总目标 ĴH","summary":"评分在前向计算，随后反向追踪动作影响。","receives":"接收预测奖励、存活权重和末端长期价值。","does":"将短期与长期收益合成一次想象的评价。","sends":"把总目标交给 BPTT 求 θ 的梯度。","why":"评价局部动作时同时考虑后续保持前景。","example":"一个动作抬升快但容易掉落，可能不如抬得稍慢而稳定的动作。","learning":"本阶段优化目标用于更新 θ，不通过修改评分网络参数抬高分数。","terms":["bptt","frozen","stop","gripper"]},"provenanceDetail":"拟新增"},{"id":"bt_rewards","title":"预测奖励与终止权重","subtitle":"状态规则 / 经验证的可微代理","x":1360,"y":620,"branch":"world","status":"fixed","shapes":["ĉ₀ = 1; ĉₖ₊₁ = ĉₖ(1−d̂ₖ₊₁)","结束当步奖励仍计入"],"note":"区分任务规则与必要的可微近似。","detail":"根据各步预测转移计算奖励与终止。可解析部分沿原任务规则；硬阈值如需可微代理，需验证偏差。独立事件头不是必需组件。\\n原始连续保持规则用于真实评估。预测软成功既不作为真实成功率，也不写回 SGS。\\n直接动作路径：原奖励中的action_rate依赖当前与上一步动作。BPTT同时保留奖励对当前连续动作的直接导数，以及经预测状态和历史返回的间接导数；不是所有奖励梯度都必须经过Fω。","provenance":"拟新增","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"},{"label":"现有动作变化奖励","href":"../DQ_high-level/envs/reward_vec_task.py"}],"beginner":{"title":"预测奖励与终止权重","summary":"区分任务规则与必要的可微近似。","receives":"接收所有想象步的预测状态与动作。","does":"计算任务收益、软终止及后续有效权重。","sends":"把每步奖励和 ĉ 提供给总目标。","why":"已经终止后的高分不应继续累加，但成功结束动作的奖励不能被抹掉。","example":"预测已完成任务时保留本步成功收益，停止计入之后的尾值。","learning":"规则或代理参数在 Actor BPTT 时固定，相关输入导数保留。","terms":["bptt","frozen","stop","gripper"]},"provenanceDetail":"拟新增"},{"id":"bt_boundary","title":"梯度边界说明","subtitle":"只有 θ 在本路径更新","x":0,"y":620,"branch":"input","status":"stop","shapes":["起点之前：停止","窗口内部：状态链保持连接"],"note":"冻结参数与切断输入导数是两回事。","detail":"停止：起点以前历史、真实仿真器、本次固定夹爪序列、采样条件与可信度权重。\\n保留：∂F/∂x、∂F/∂u、观测和历史的输入导数、奖励与终止代理输入导数、∂V/∂v。世界模型 ω 与 Critic ψ 不更新。","provenance":"拟新增","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"}],"beginner":{"title":"梯度边界说明","summary":"冻结参数与切断输入导数是两回事。","receives":"接收本路径的参数和输入依赖定义。","does":"规定哪些链路可传梯度、哪些量视为给定。","sends":"为 BPTT 提供明确的求导范围。","why":"错误 detach 会让后面的评分无法指导前面的动作。","example":"冻结评价器的参数，但仍允许它告诉策略终点往哪变更好。","learning":"本节点只解释边界，不是一个额外网络。","terms":["bptt","frozen","stop","gripper"]},"provenanceDetail":"拟新增"},{"id":"bt_bptt","title":"BPTT · 跨时间梯度汇总","subtitle":"沿红色反向链路，累加共享 θ 的贡献","x":340,"y":620,"branch":"loss","status":"loss","shapes":["gBPTT = ∇θ ĴH","经过 V输入、F输入及各时刻Actor"],"note":"后续收益同时影响前面与后面的动作。","detail":"图中前向链经过多次共享 Actor、世界模型和观测更新。BPTT 沿完整计算图反向，各时刻对同一 θ 的贡献累加。\\n不是仅给最后一步动作反传，也不是只用模型评分生成 PPO 优势。该路径直接使用动力学输入导数。\\n图示：红色反向链路同时包含状态递推、闭环观测与各步Actor。各时刻参数贡献累加为同一θ的梯度；不存在每步独立的Actor。","provenance":"拟新增","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"}],"beginner":{"title":"BPTT · 跨时间梯度汇总","summary":"后续收益同时影响前面与后面的动作。","receives":"接收想象总目标及前向保留的可微计算图。","does":"反向计算哪些连续动作变化会提高预测综合回报。","sends":"输出模型辅助的 Actor 参数梯度。","why":"实现世界模型直接提供动作改进方向的研究目标。","example":"末端状态更稳定的得分可以追溯到前面接近方向的调整。","learning":"只对 θ 形成参数更新；ω、ψ 的输入导数参与计算。","terms":["bptt","frozen","stop","gripper"]},"provenanceDetail":"拟新增","paper":[["借鉴：通过世界模型进行策略梯度回传",5,"本方案保留真实 PPO，并从真实回报训练尾值 Critic；并非照搬原文全部学习流程。"]]},{"id":"bt_theta","title":"共享 Actor 参数 θ","subtitle":"真实 PPO + 可信模型梯度","x":680,"y":620,"branch":"param","status":"trainable","shapes":["gθ = gPPO + β E[w · gBPTT]","qimag、w 作为本次给定条件"],"note":"同一个教师接受两条互补学习信号。","detail":"这是概念性混合方向，不预设联合还是交替优化。模型辅助强度及整体策略偏移需要约束，额外模型梯度不自动受 PPO clipping 保护。\\n模型只是训练工具，部署不默认加入规划器。可信度不能被当作 Actor 可操纵的额外奖励。","provenance":"拟新增","sources":[{"label":"方法提案 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md#103-三条学习路径以及参数冻结的含义"},{"label":"教师训练入口","href":"../DQ_high-level/train_teacher_sgs_ekf.sh"}],"beginner":{"title":"共享 Actor 参数 θ","summary":"同一个教师接受两条互补学习信号。","receives":"接收本视图模型梯度，以及真实 PPO 视图的实际经验梯度。","does":"小幅改进同一教师策略。","sends":"将改进后策略用于真实采样，验证是否提高完整任务成功率。","why":"最终收益必须回到实际仿真中确认，不能只提高想象得分。","example":"若模型建议抬升更稳，下一轮真实执行检验是否真的减少掉落。","learning":"更新 θ；共享参数可能间接改变夹爪输出，需检查整体变化。","terms":["bptt","frozen","stop","gripper"]},"provenanceDetail":"拟新增"}],"edges":[{"to":"bt_obs0","label":"起点状态 / 历史","kind":"data","beginnerLabel":"起点状态 / 历史","from":"bt_seed"},{"to":"bt_actor0","label":"ô₀","kind":"data","beginnerLabel":"ô₀","from":"bt_obs0"},{"to":"bt_world0","label":"û₀","kind":"data","beginnerLabel":"û₀","from":"bt_actor0"},{"to":"bt_obs1","label":"x̂₁","kind":"data","beginnerLabel":"x̂₁","from":"bt_world0"},{"to":"bt_actor1","label":"ô₁","kind":"data","beginnerLabel":"ô₁","from":"bt_obs1"},{"to":"bt_world1","lab
