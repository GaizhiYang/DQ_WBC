"from":"bt_actor1","to":"bt_obs1","label":"经 ∂π / ∂o₁","kind":"gradient","beginnerLabel":"经 ∂π / ∂o₁"},{"from":"bt_obs1","to":"bt_world0","label":"经 ∂O / ∂x₁","kind":"gradient","beginnerLabel":"经 ∂O / ∂x₁"},{"from":"bt_world0","to":"bt_actor0","label":"经 ∂F / ∂u₀","kind":"gradient","beginnerLabel":"经 ∂F / ∂u₀"},{"from":"bt_actor1","to":"bt_bptt","label":"第 1 步对 θ 的贡献","kind":"gradient","beginnerLabel":"第 1 步对 θ 的贡献"},{"from":"bt_actor0","to":"bt_bptt","label":"第 0 步对 θ 的贡献","kind":"gradient","beginnerLabel":"第 0 步对 θ 的贡献"},{"from":"bt_actor0","to":"bt_rewards","label":"û0：直接动作代价","kind":"data"},{"from":"bt_rewards","to":"bt_actor0","label":"直接 ∂r̂ / ∂û0","kind":"gradient"},{"from":"bt_actor1","to":"bt_rewards","label":"û1：直接动作代价","kind":"data"},{"from":"bt_rewards","to":"bt_actor1","label":"直接 ∂r̂ / ∂û1","kind":"gradient"}],"beginner":{"title":"07 · 短期 BPTT 展开","subtitle":"先往前推演，再沿预测过程往回追踪影响。","summary":"机器人不在仿真器中倒放。训练程序追踪动作如何影响预测收益，把方向传回同一个策略。","steps":["bt_seed","bt_condition","bt_obs0","bt_actor0","bt_world0","bt_obs1","bt_actor1","bt_world1","bt_terminal","bt_rewards","bt_value","bt_objective","bt_boundary","bt_bptt","bt_theta"]}},{"id":"boundaries","title":"08 · 参数边界与采样","subtitle":"三条学习路径各更新谁；三种采样分布各决定什么。","summary":"矩阵：模型拟合只更新 ω；真实 PPO 更新 θ、ψ；策略 BPTT 只更新 θ。Critic 主线只使用真实回报。","formula":"A：ω ✓ / θ × / ψ ×　　B：ω × / θ ✓ / ψ ✓　　C：ω × / θ ✓ / ψ ×","formulaNote":"C 中固定 ω、ψ 参数，但保留 F 对状态/动作以及 V 对输入的导数。","nodes":[{"id":"bd_real","title":"真实仿真经验","subtitle":"共同数据来源，学习用途不同","x":0,"y":0,"branch":"sim","status":"data","shapes":["真实状态转移","真实奖励与回合结果"],"note":"模型学转移，策略与价值学真实任务结果。","detail":"来源：SGS 初态下，当前 Actor 经冻结控制链在 Isaac Gym 执行。\\n分流：转移进入世界模型拟合；近期真实轨迹进入 PPO；可信完整起点用于想象。","caution":"旧转移可用于模型拟合，但不能不加处理混入当前 PPO 的 on-policy 更新。","sources":[{"label":"方案第 10.3—10.4 节 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"真实仿真经验","summary":"模型学转移，策略与价值学真实任务结果。","receives":"真实动作、状态、奖励、终止与配置结果。","does":"按用途形成不同训练材料，保留时间与信息边界。","sends":"送到模型拟合、真实 PPO 和想象起点选择。","why":"共享采集不代表三个训练目标可以混用标签。","example":"同一次滑落既能修正物体预测，也能降低真实任务回报估计。","learning":"此节点只提供数据。","terms":["frozen","distribution","critic"]},"provenance":"融合方案","provenanceDetail":"融合方案"},{"id":"bd_wm","title":"路径 A · 世界模型学习","subtitle":"真实转移 → 预测误差","x":340,"y":0,"branch":"world","status":"trainable","shapes":["更新 ω","θ ×　ψ ×"],"note":"用真实状态转移训练动作后果预测。","detail":"输入：模型拟合分布选取的连续真实窗口。\\n目标：物理与相对关系多步误差。\\n更新矩阵：ω 更新；θ、ψ 不更新。","caution":"模型拟合中多步反传不等于策略 BPTT。","sources":[{"label":"方案第 10.3—10.4 节 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"路径 A · 世界模型学习","summary":"用真实状态转移训练动作后果预测。","receives":"真实起点、日志动作、条件和后续真值。","does":"沿记录动作预测，并最小化预测误差。","sends":"只向世界模型参数 ω 发出更新。","why":"先让预测器有能力描述真实动作后果。","example":"把模型错误预测的稳定抓持修正为真实发生的滑落。","learning":"只更新 ω。","terms":["frozen","distribution","critic"]},"provenance":"融合方案","provenanceDetail":"融合方案"},{"id":"bd_ppo","title":"路径 B · 真实 PPO","subtitle":"真实奖励 → 优势与价值目标","x":680,"y":0,"branch":"actor","status":"trainable","shapes":["更新 θ、ψ","ω ×"],"note":"保留当前 PPO 的策略与长期价值学习。","detail":"Actor：真实优势指导动作概率更新。\\nCritic：真实奖励与 bootstrap 构造 GAE/λ-return 对应目标。\\n价值：累计任务回报，不等于成功概率。","caution":"主方案 Critic 只由真实回报训练；不要接入原版 SuperMimic 的想象 λ-return 学习支路。","sources":[{"label":"方案第 9 节与第 10.3 节 · 真实价值来源","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"路径 B · 真实 PPO","summary":"保留当前 PPO 的策略与长期价值学习。","receives":"近期真实轨迹、动作概率与真实奖励/终止。","does":"构造实际策略与价值学习目标。","sends":"更新共享教师 Actor θ 和 Critic ψ。","why":"持续用实际执行结果锚定任务学习。","example":"抬升后马上掉落的真实回报，会影响动作与状态评价。","learning":"更新 θ、ψ；不更新 ω。","terms":["frozen","distribution","critic"]},"provenance":"融合方案","provenanceDetail":"融合方案"},{"id":"bd_bptt","title":"路径 C · 策略 BPTT","subtitle":"短期想象回报＋末端价值","x":1020,"y":0,"branch":"loss","status":"trainable","shapes":["更新 θ","ω 冻结　ψ 冻结"],"note":"回报梯度穿过世界模型和末端价值，只改进 Actor。","detail":"输入：可信真实起点和本次固定的采样条件。\\n闭环：Actor 每步从预测观测重新产生连续动作。\\n更新矩阵：θ 更新；ω、ψ 参数固定，但保留其输入导数。","caution":"该混合更新属于新设计；模型梯度不自动受 PPO clipping 保护。","sources":[{"label":"方案第 10.3—10.4 节 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"路径 C · 策略 BPTT","summary":"回报梯度穿过世界模型和末端价值，只改进 Actor。","receives":"可信起点、已训练世界模型及真实回报 Critic。","does":"短时闭环想象，求回报对连续策略参数的路径梯度。","sends":"向同一个 Actor θ 发出辅助更新。","why":"利用动作如何改变未来的导数，补充真实经验梯度。","example":"调整末端运动以降低预测滑移，并提高预测终点长期价值。","learning":"只更新 θ；二值夹爪路径按方案固定，不虚构连续抓力梯度。","terms":["frozen","distribution","critic"]},"provenance":"融合方案","provenanceDetail":"融合方案","paper":[["对照：SuperMimic 三阶段循环",4,"原论文使用模型内策略梯度。本方案新增这条梯度路径，与当前真实 PPO 配合。"]]},{"id":"bd_frozen","title":"冻结参数 ≠ 切断输入梯度","subtitle":"冻结对象随学习阶段变化","x":0,"y":300,"branch":"input","status":"fixed","shapes":["BPTT 保留 ∂F/∂x, ∂F/∂a","保留 ∂V/∂v"],"note":"参数保持不变，仍可传回输入的改进方向。","detail":"冻结：策略 BPTT 不修改 ω 和 ψ。\\n保留：状态、连续动作、观测历史与末端价值输入的导数仍可进入 θ 的梯度。\\n截断：起点之前的真实经验固定，窗口内不逐步断开状态。","caution":"把整个模型或 Critic 包入 no_grad，或把所有预测状态 detach，会破坏所声称的 BPTT 路径。","sources":[{"label":"方案第 10.3—10.4 节 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"冻结参数 ≠ 切断输入梯度","summary":"参数保持不变，仍可传回输入的改进方向。","receives":"策略 BPTT 的模型与价值计算图。","does":"明确参数梯度与输入梯度的区别。","sends":"约束三条学习路径各自能够更新的对象。","why":"Actor 不能通过修改预测器或评分器来抬高想象分数。","example":"价值网络自己不变，但“终点姿态变好导致价值提高”的信号仍回到动作。","learning":"本节点是训练边界说明，不引入新网络。","terms":["frozen","distribution","critic"]},"provenance":"融合方案","provenanceDetail":"融合方案"},{"id":"bd_omega","title":"世界模型参数 ω","subtitle":"同一模型跨时间与阶段复用","x":340,"y":300,"branch":"param","status":"data","shapes":["A 更新","C 固定参数"],"note":"在真实转移上学习，在策略想象中提供可微预测。","detail":"来源：只有路径 A 的预测监督更新 ω。\\n复用：路径 C 调用同一模型，保留动作/状态导数。","caution":"C 中模型参数固定不是永久冻结；返回 A 后继续学习新数据。","sources":[{"label":"方案第 10.3—10.4 节 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"世界模型参数 ω","summary":"在真实转移上学习，在策略想象中提供可微预测。","receives":"来自真实转移模型损失的参数更新。","does":"保存当前预测能力并供短期想象调用。","sends":"以固定参数模型身份参与策略 BPTT。","why":"避免不同初态各自重学一套交互模型。","example":"SGS 新采到失抓数据后，模型修正再用于下一轮想象。","learning":"A 更新 ω；B、C 不更新 ω。","terms":["frozen","distribution","critic"]},"provenance":"融合方案","provenanceDetail":"融合方案"},{"id":"bd_theta","title":"共享教师 Actor 参数 θ","subtitle":"两条更新路径作用于同一个教师","x":680,"y":300,"branch":"param","status":"data","shapes":["B：真实 PPO","C：辅助 BPTT"],"note":"真实经验与模型动作梯度共同改进同一个策略。","detail":"更新：PPO 提供真实数据上的 PPO 更新方向；BPTT 提供可信短窗口的连续动作辅助梯度。\\n约束：固定可信度权重与起点选择，不让 Actor 通过操纵可靠性获得奖励。\\n顺序：方案不强制联合或交替更新。","caution":"模型辅助强度与整体策略偏移需要控制；不是简单增加越多梯度越好。","sources":[{"label":"方案第 10.3—10.4 节 · 三条学习路径","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"共享教师 Actor 参数 θ","summary":"真实经验与模型动作梯度共同改进同一个策略。","receives":"真实 PPO 更新与受约束的模型 BPTT 更新。","does":"形成当前共享教师策略，并回到真实仿真执行。","sends":"服务于下一轮采集与固定完整任务评估。","why":"最终改进必须体现在同一个实际执行策略上。","example":"模型建议微调末端接近方向，真实执行检验是否更容易抓住。","learning":"B 与 C 更新同一组 θ；A 不更新 θ。","terms":["frozen","distribution","critic"]},"provenance":"融合方案","provenanceDetail":"融合方案"},{"id":"bd_psi","title":"长期价值参数 ψ","subtitle":"由真实回报学习的 Critic","x":1020,"y":300,"branch":"critic","status":"data","shapes":["B 更新 ψ","C 保留输入梯度"],"note":"评价预测终点之后的任务前景，不充当成功概率标签。","detail":"学习来源：路径 B 的真实奖励与价值目标。\\nBPTT 用法：在预测终点输入 v̂H 上计算 Vψ，并保留对 v̂H 的导数。\\n信息：基线使用现有 Critic 观测；特权状态增强是独立实验。","caution":"真实训练不保证离分布预测上的价值梯度可靠；回报尺度与终止语义必须一致。","sources":[{"label":"方案第 9 节 · 长期价值；第 10.3 节 · 参数边界","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"长期价值参数 ψ","summary":"评价预测终点之后的任务前景，不充当成功概率标签。","receives":"真实 PPO 的价值更新，以及想象终点的价值输入。","does":"学习真实长期回报，再为短期想象提供尾值。","sends":"以参数固定、输入可导的形式参与策略 BPTT。","why":"短期抬升收益需要结合后续保持前景。","example":"较慢但稳定的抓持状态可能比即将滑落的高位状态更有价值。","learning":"只有 B 更新 ψ；C 不用想象回报训练 ψ。","terms":["frozen","distribution","critic"]},"provenance":"融合方案","provenanceDetail":"融合方案"},{"id":"bd_reset","title":"分布 1 · SGS 真实重置","subtitle":"选择实际练习从哪里开始","x":0,"y":600,"branch":"input","status":"random","shapes":["full_task / pregrasp / near_goal","真实成功历史"],"note":"维持策略学习边界，不因模型暂时不准就丢掉困难配置。","detail":"选择：下一回合真实起点。\\n统计：只根据真实完成回合更新成功历史。\\n主线：先保留原 SGS；历史复习和不确定性课程作为独立增强。","caution":"想象成功不得写入 SGS；不直接用模型可信度过滤真实难例。","sources":[{"label":"方案第 5、11 节 · 三种采样分布","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"},{"label":"SGS 采样实现","href":"../DQ_high-level/utils/sgs.py"}],"beginner":{"title":"分布 1 · SGS 真实重置","summary":"维持策略学习边界，不因模型暂时不准就丢掉困难配置。","receives":"SGS 配置库与真实回合结果。","does":"决定下一回合在哪个配置执行。","sends":"向真实仿真采集提供初始状态。","why":"模型还不会预测的接触区域可能最需要真实练习。","example":"pregrasp 成功率居中时继续采集触碰与失抓数据。","learning":"只更新 SGS 统计与采样概率，不直接更新网络参数。","terms":["frozen","distribution","critic"]},"provenance":"融合方案","provenanceDetail":"融合方案"},{"id":"bd_fitdist","title":"分布 2 · 模型拟合窗口","subtitle":"覆盖阶段、结果与物理条件","x":340,"y":600,"branch":"input","status":"random","shapes":["近期分布＋历史经验","连续且不跨重置"],"note":"从已有经验中选择适合学习动力学的连续片段。","detail":"覆盖：接近、接触、抬升、保持、失抓与成功。\\n历史：适度保留旧接触经验，防止随课程推进遗忘。\\n独立：不要求等于真实 SGS 重置分布。","caution":"只保留成功轨迹会削弱成败边界学习；数据变化与策略变强应区分。","sources":[{"label":"方案第 5、8 节 · 模型数据分布","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"分布 2 · 模型拟合窗口","summary":"从已有经验中选择适合学习动力学的连续片段。","receives":"真实轨迹库及阶段/条件信息。","does":"选取连续监督窗口，平衡近期与历史数据。","sends":"把实际转移窗口交给路径 A。","why":"模型应理解多个阶段，而不是只拟合最近常见的状态。","example":"近期主要练习接近时，仍保留部分稳定保持与滑落轨迹。","learning":"只选模型监督数据，不产生策略更新。","terms":["frozen","distribution","critic"]},"provenance":"融合方案","provenanceDetail":"融合方案"},{"id":"bd_imagine","title":"分布 3 · 可信想象起点","subtitle":"同时检查模型与尾值支持","x":680,"y":600,"branch":"input","status":"random","shapes":["完整真实中间状态","固定可信度 w 与短窗口 H"],"note":"可信度控制模型使用范围，不改变真实成功目标。","detail":"选择：从真实轨迹的完整中间状态开始想象。\\n可靠性：检查多步误差、动作效果和末端价值支持，不能只看平均状态误差。\\n边界：即将进入不可信区域时，应在最后可信状态接尾值。","caution":"可信度不作为 Actor 奖励；取样权重在本次策略更新中视为给定条件。","sources":[{"label":"方案第 11 节 · 模型可信度与课程","href":"SuperMimic_SGS_EKF_teacher_method_proposal.md"}],"beginner":{"title":"分布 3 · 可信想象起点","summary":"可信度控制模型使用范围，不改变真实成功目标。","receives":"真实完整状态、模型诊断和真实动作效果验证。","does":"确定想象起点、物理时间窗口和辅助更新强度。","sends":"向路径 C 提供可信的短时学习范围。","why":"不是所有真实难例都已适合用模型梯度优化。","example":"模型不会判断接触转换时，继续真实 <script type="application/json" id="paper-data">{"pages":{"4":{"page":4,"title":"方法总览与三阶段训练循环","text":"                                                            next iteration\n\n (1) Collect data                       (2) Fit world model                  (3) Improve policy\n                                                                                                       ˆ¯ot+ηt\n     gt      πθ                    LWM (Eq. 1)                  gt      πθ\n\n              at+ϵt  ot+1              ∇ω                  ∇θ   at\n                                                                                            ˆrt+1\n            Sim                          fω             ˆsj           ˆJ(θ)      fω              ˆst\n\n                                                                                              (Eq. 2)\n\n                   (st, at+ϵt, ξ)           sj        (s0, a0:k−1, ξ)                     (s0, ξ)\n\n                                        Replay buffer B\n\nFigure 2: SuperMimic training loop.  (1) The current policy πθ collects transitions in simula-\ntion into a fixed-size replay buffer B, where new transitions replace the oldest. (2) The differen-\ntiable world model is fit to k-step windows sampled from B (§3.2). (3) The policy is improved by\nbackpropagation-through-time through the frozen world model over H imagined steps; a critic Vψ,\ntrained in the same phase, bootstraps the return beyond H (§3.3). Dashed arrows are gradients;\n  = frozen,   = trained. Symbols: goal gt (e.g., reference motion), action at, action noise ϵt,\nobservation ot, state s and predicted state ˆs, and sim context ξ (domain-randomization parameters).\nLWM is the world-model loss, ˆ¯ot the predicted noise-free observation, ηt the sensor noise, ˆrt+1 the\npredicted reward, and ˆJ(θ) the policy objective.\n\n\nfollowing. SONIC [1] jointly trains goal encoders with its tracker using tracking rewards and latent-\nalignment losses. ControlVAE [6] optimizes downstream task policies through its learned model\nwhile freezing the skill controller. SuperMimic jointly trains goal-specific encoders and a shared\ndecoder through the same dynamics model (Appendix B). Goal interfaces can optimize either a\nreference-tracking reward or their own task reward. Our preliminary study trains a velocity interface\nconcurrently with the motion-tracking interface, once on each objective (§4.5).\n\n3  Method\n\n3.1  SuperMimic training loop\n\nSuperMimic trains one goal-conditioned whole-body controller across a multi-skill motion library\nand supports multiple goal interfaces. It captures the shared humanoid dynamics in a differentiable\nworld model and improves the policy through short imagined rollouts. Training alternates between\nthree phases in one loop (Figure 2).  First, the current policy collects simulator transitions into a\nreplay buffer. Second, we fit the differentiable world model to short replay windows. Third, the\npolicy is improved by backpropagating an imagined return through the frozen world model, with\neach rollout seeded from a replay-buffer state in the Dyna style [23, 24]. The buffer, model, and\npolicy are updated throughout training, so dynamics learning and control improve together rather\nthan in separate stages (Algorithm A.1, Appendix D). Transitions from earlier policies remain valid\nfor fitting the world model, because the dynamics do not depend on the policy that collected them.\n\nWe denote the goal-conditioned partially observable Markov decision process (POMDP) by M\nand use compact notation with state st, goal gt, and action at. State st gives the proprioceptive\nobservation ot and the termination dt, which is 1 if st is terminal. Action at in state st yields\nthe reward rt+1 and the next state st+1. The policy is deterministic, at = πθ(ot, gt), and at\nparameterizes a normalized joint setpoint; for motion tracking, gt is read from a reference motion.\nDuring data collection, the simulator executes the noisy action at + ϵt with action noise ϵt ∼ρϵ,\nand the replay buffer stores this executed noisy action. The noise widens the range of actions on\nwhich the world model is fit; it serves only the model fit and is optional. Returns use a soft survival\nweight, c0 = 1 and ct+1 = ct(1−dt+1), giving J(θ) = E[Pt≥0 γtctrt+1] with discount γ ∈[0, 1).\nThe simulator logs hard terminations, while the learned model predicts a termination probability\nˆdt ∈[0, 1], which keeps the survival weight differentiable in imagined rollouts.  Throughout, a\nhat marks the world-model counterpart of a simulator quantity. We also factor the observation as\n\n\n                                       4","image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQgJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wgARCAVPBBoDAREAAhEBAxEB/8QAGgABAAMBAQEAAAAAAAAAAAAAAAQDAgUBBv/EABoBAQEBAQEBAQAAAAAAAAAAAAABAgMEBQb/2gAMAwEAAhADEAAAAfvwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA ).\n\n3.2  Learning a differentiable world model\n\nThe simulator’s articulated multi-rigid-body dynamics are known, but the simulator need not provide\ngradients, so SuperMimic learns a differentiable surrogate to obtain policy gradients: it supplies the\npredictions and Jacobians for the BPTT update in §3.3. The resulting analytic policy gradient is the\ngradient of a surrogate for the expected return in simulation. Since the simulator’s randomness has\nknown sources, the world model stays deterministic: it conditions on the per-episode sim context ξ\n(friction, calibration offsets, and torso center-of-mass) and predicts the noise-free observation ¯ot.\n\nThe world model contains a learned dynamics model and reward, observation, and termination\nheads; each head is either learned or computed analytically,\n    ˆst+1 = fω(ˆst, at, ξ),      ˆrt+1 = rω(ˆst, at, gt),          ˆ¯ot = gω(ˆst, ξ),        ˆdt = dω(ˆst, gt).\n\nWe fit the network weights ω on k-step autoregressive replay windows (k=8), seeded at the logged\nstate ˆs0 = s0 and rolled forward on logged actions, by minimizing\n\n                          k\n       LWM(ω) = EB X h ∥ˆsj −sj∥2 + (ˆrj −rj)2 + ∥ˆ¯oj −¯oj∥2 + BCE(ˆdj, dj)i ,        (1)\n                       j=1\n\nwhere an analytic head has no loss term. Here rj is the simulator reward, dj ∈{0, 1} is the simulator\ntermination label, and BCE is the binary cross-entropy.\n\n3.3  Learning the policy through the world model\n\nDuring each policy update, we hold the world-model weights ω fixed and optimize πθ and Vψ on\nimagined rollouts of H=32 steps. The critic Vψ estimates the return beyond step H, so the model\nmust be accurate only within these H steps. This imagination horizon exceeds the k-step replay\nwindows on which we fit the model (§3.2).  In practice, the learned model remains stable over\nindefinitely long rollouts, because the k-step autoregressive fit trains it to correct its own prediction\nerrors.\n\nEach imagined rollout starts from a replay-buffer state s0 ∼ρ0 with its recorded sim context ξ.\nAt step t, the model emits ˆ¯ot, we re-add sensor noise, and the policy acts: at = πθ(ˆ¯ot + ηt, gt),\nηt ∼ρη. The policy objective over imagined rollouts is\n\n                           H−1\n                   ˆJ(θ) = Es0∼ρ0, πθ h X γtˆct ˆrt+1 + γHˆcH Vψ(ˆsH, gH, ξ)i .                (2)\n                                   t=0\nFor motion tracking, the reward rt+1 is the BeyondMimic motion-tracking reward [3] without its\nself-collision penalty (Appendix A).\nThe world model is differentiable, so BPTT computes a first-order gradient ∇θ ˆJ through the H\nimagined steps via the world model’s Jacobians with respect to ˆst and at. In contrast, PPO treats\nthe dynamics as a black box: it weights the score ∇θ log πθ of a stochastic policy by the advantages\nof sampled actions, a likelihood-ratio estimate. BPTT instead differentiates the return with respect\nto each action, so over short horizons its gradient has much lower variance.\n\nThe critic Vψ is fit to generalized advantage estimation returns [25] computed backward in time over\nthe imagined transitions only,\n\n             H−1\n     LV (ψ) = E X  Vt −ˆRt 2,      ˆRt = ˆrt+1 + γ(1 −ˆdt+1) (1 −λ)Vt+1 + λ ˆRt+1  ,    (3)\n                  t=0\nwith Vt = Vψ(ˆst, gt, ξ). The recursion starts from ˆRH = VH, the critic’s estimate of the return\nbeyond the horizon. The targets ˆRt are computed once per rollout and remain fixed while ψ is fit.\n\n\n                                       5","image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQgJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wgARCAVPBBoDAREAAhEBAxEB/8QAGgABAAMBAQEAAAAAAAAAAAAAAAQDAgUBBv/EABcBAQEBAQAAAAAAAAAAAAAAAAABAgP/2gAMAwEAAhADEAAAAfvwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA  only inside the policy’s backward pass. For a downstream interface, ˆJi updates only its\nencoder encθ,i.\nRequire: world model fω; policy πθ shared across interfaces {Mi}i∈I; replay buffer B\n 1: for each iteration do\n 2:     ▷Collect. Roll out πθ with action noise in simulation; push transitions to B, replacing the oldest\n 3:      Draw reset start points by return-based sampling                           ▷Appendix D.1\n 4:    ▷Fit world model. Sample a logged k-step window from B, roll fω out autoregressively on the logged\n     actions, and step ω ←ω −αω∇ωLWM                                             ▷Eq. 1\n 5:    ▷Improve policy. Sample an interface i ∼p(I) and a start state from B\n 6:       Imagine H steps on-policy through the fixed fω: ˆst+1 = fω  ˆst, πi(ˆ¯ot + ηt, gt), ξ\n 7:       Step θ ←θ + αθ∇θ ˆJi                     ▷Eq. 2; analytic gradients through fω; critic Vψi\n 8:        Fit the critic Vψi to the GAE targets of the imagined rollout                         ▷Eq. 3\n 9: end for\n\nD  Training loop and hyperparameters\n\nD.1  Algorithm\n\nAlgorithm A.1 summarizes the SuperMimic training loop of §3.1; its three steps correspond one-to-\none to the panels of Figure 2.\n\n\nReturn-based reset sampling.  Simulator episodes reset to points of the motion library, favor-\ning those where the policy currently earns low return. The motion timeline is divided into 1 s\nbins, and each bin b keeps a running estimate Gb of the discounted return from it, updated on\nthe policy’s own rollouts.  Resets mix three distributions: 50% uniform over bins, 40% from\nsoftmaxb(−25 Gb/Gmax), where Gmax is the largest attainable discounted return, and 10% in pro-\nportion to each bin’s past softmax weight, so a hard motion keeps some practice after it is learned.\n\nD.2  Hyperparameters\n\nTable A.5 lists the hyperparameters. Where they differ, values are given for the one-GPU and the\ntwo-GPU run of Table A.8.\n\nE  Motion data filtering\n\nWe train on the publicly available G1-retargeted BONES-SEED motion set [27]. The raw release\ncontains 142,220 clips, but many interact with terrain or objects the robot cannot use (stairs, boxes,\nladders, chairs) or carry retargeting artifacts that make them infeasible for a free-standing humanoid\non flat ground. We remove these in two passes and keep 129,514 clips (Table A.7).\n\n\nName filter.  Each clip is named by its action. We drop any clip whose name contains a term\ndenoting contact with terrain or an object the robot cannot use—e.g. stair, ladder, box, chair,\n\n\n                                       15","image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQgJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wgARCAVPBBoDAREAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAQDAgUBBgf/xAAYAQEBAQEBAAAAAAAAAAAAAAAAAQIDBP/aAAwDAQACEAMQAAAB+/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABCIwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA <script>
'use strict';
const DATA=JSON.parse(document.getElementById('diagram-data').textContent),PAPER=JSON.parse(document.getElementById('paper-data').textContent);
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS={input:['#726a53','#f3eee1','数据 / 条件'],sim:['#527666','#eaf1e9','刚体仿真'],world:['#71618b','#f0ecf6','世界模型'],actor:['#416e8d','#eaf1f7','策略网络'],critic:['#ad8042','#f7f0e3','价值网络'],loss:['#aa5e58','#f9eeea','训练目标'],param:['#86607c','#f4eaf1','参数更新']};
const STATUS={data:'数据 / 张量',fixed:'固定运算',random:'随机采样',trainable:'本阶段训练',frozen:'参数冻结',loss:'训练目标',stop:'停止梯度'};
const KIND={data:'数据流',condition:'条件',supervision:'监督标签',gradient:'反向梯度',update:'参数更新'};
const NS='http://www.w3.org/2000/svg',svg=(tag,attrs={})=>{const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e};
const STORE='dq-teacher-supermimic-flow-layout-v1',FORMAT='dq-teacher-supermimic-flow-layout';
let current=null,NODES=[],EDGES=[],byId={},view={x:0,y:0,k:1},layouts={},selected=null,hover=null,drag=null,edgeObjects=[],labels=true,gradients=true,gradientsOnly=false,toastTimer,activePaper=null,paperMode='image',ready=false;
let beginner=false,guided=false,panelKind='node';
const PLAIN_STATUS={data:'资料数据',fixed:'固定的计算',random:'随机选取',trainable:'本步会学习',frozen:'本步参数不改',loss:'评判好坏',stop:'在这里停止传回'};
const PLAIN_KIND={data:'资料流向',condition:'额外条件',supervision:'用来对答案',gradient:'传回修改方向',update:'真正改网络参数'};
const terms=Object.fromEntries((DATA.glossary||[]).map(t=>[t.id,t]));
const nodeTitle=n=>beginner?(n.beginner?.title||n.title):n.title;
const viewTitle=v=>beginner?(v.beginner?.title||v.title):v.title;
const edgeTitle=e=>beginner?(e.beginnerLabel||e.label):e.label;
const kindTitle=k=>(beginner?PLAIN_KIND:KIND)[k]||'资料流向';
const original=Object.fromEntries(DATA.views.map(v=>[v.id,Object.fromEntries(v.nodes.map(n=>[n.id,[n.x,n.y]]))]));
$('app-title').textContent=DATA.title||'DQ 教师策略 · SuperMimic × SGS × EKF';document.title=DATA.title||document.title;
function notify(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2800)}
function color(n){return COLORS[n.branch]||COLORS.input}
function buildLegend(){let h=beginner?'':Object.entries(COLORS).map(([k,c])=>`<span class="branch-item"><i style="background:${c[0]}"></i>${esc(c[2])}</span>`).join('');h+=Object.entries(beginner?PLAIN_KIND:KIND).filter(([k])=>gradients||!['gradient','update'].includes(k)).map(([k,v])=>`<span><i class="sample ${k}"></i>${v}</span>`).join('');h+=`<span class="frozen-legend">${beginner?'虚线框：这一步不修改它的参数':'虚线框：参数冻结，仍可传递输入梯度'}</span>`;$('legend').innerHTML=h}
function snapshot(){if(current)layouts[current.id]={pos:Object.fromEntries(NODES.map(n=>[n.id,[n.x,n.y]])),view:{...view}}}
function save(){snapshot();try{localStorage.setItem(STORE,JSON.stringify({format:FORMAT,version:1,dataVersion:DATA.version,current:current?.id,layouts,labels,gradients,gradientsOnly,beginner}))}catch{}}
function validLayout(d){if(!d||d.format!==FORMAT||d.version!==1||typeof d.layouts!=='object'||!d.layouts)throw Error('不是本图的有效布局');for(const v of DATA.views){const l=d.layouts[v.id];if(!l)continue;if(!l.pos||typeof l.pos!=='object')throw Error('缺少节点布局');for(const n of v.nodes){const p=l.pos[n.id];if(!Array.isArray(p)||p.length!==2||p.some(x=>!Number.isFinite(x)||Math.abs(x)>15000))throw Error('节点坐标不合法：'+n.id)}const q=l.view;if(q&&(!Number.isFinite(q.x)||!Number.isFinite(q.y)||Math.abs(q.x)>100000||Math.abs(q.y)>100000||!Number.isFinite(q.k)||q.k<.12||q.k>2.5))throw Error('缩放或平移范围无效')}return d}
function applyView(){$('world').style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;$('zoom').textContent=Math.round(view.k*100)+'%'}
function measure(){NODES.forEach(n=>n.h=n.el.offsetHeight)}
function fit(){if(!NODES.length)return;const pad=28,minX=Math.min(...NODES.map(n=>n.x))-pad,minY=Math.min(...NODES.map(n=>n.y))-pad,maxX=Math.max(...NODES.map(n=>n.x+n.w))+pad,maxY=Math.max(...NODES.map(n=>n.y+n.h))+pad,w=maxX-minX,h=maxY-minY,sw=$('stage').clientWidth,sh=Math.max(80,$('stage').clientHeight-(beginner?35:92));view.k=Math.min(1,sw/w,sh/h);view.k=Math.max(.12,view.k);view.x=(sw-w*view.k)/2-minX*view.k;view.y=(sh-h*view.k)/2-minY*view.k;applyView()}
function zoom(f,mx=$('stage').clientWidth/2,my=$('stage').clientHeight/2){const k=Math.max(.12,Math.min(2.5,view.k*f));view.x=mx-(mx-view.x)*k/view.k;view.y=my-(my-view.y)*k/view.k;view.k=k;applyView();save()}
function syncButtons(){for(const[id,v,txt]of[['btn-labels',labels,beginner?'箭头说明':'边标签'],['btn-gradients',gradients,'梯度/更新']]){$(id).classList.toggle('on',v);$(id).setAttribute('aria-pressed',String(v));$(id).textContent=txt+'：'+(v?'开':'关')}$('btn-gradient-only').classList.toggle('on',gradientsOnly);$('btn-gradient-only').setAttribute('aria-pressed',String(gradientsOnly));$('btn-mode').setAttribute('aria-pressed',String(beginner));$('btn-mode').textContent=beginner?'入门阅读 · 切换进阶':'进阶视图 · 返回入门';document.body.classList.toggle('beginner',beginner);buildLegend()}
function setView(id){const v=DATA.views.find(x=>x.id===id);if(!v)return false;snapshot();closePanel();guided=false;current=v;NODES=v.nodes.map(n=>({...n,w:246,x:original[id][n.id][0],y:original[id][n.id][1]}));EDGES=v.edges;byId=Object.fromEntries(NODES.map(n=>[n.id,n]));const l=layouts[id];if(l)for(const n of NODES){if(l.pos[n.id])[n.x,n.y]=l.pos[n.id]}$('nodes').replaceChildren();renderHeading();buildNodes();drawEdges();if(l?.view){view={...l.view};applyView()}else fit();syncReading();save();return true}
function renderHeading(){const v=current;if(!v)return;$('view-title').textContent=viewTitle(v);$('view-subtitle').textContent=(beginner?v.beginner?.subtitle:v.subtitle)||v.subtitle||'';$('view-summary').textContent=(beginner?v.beginner?.summary:v.summary)||v.summary||'';$('formula-title').textContent=v.title+' · 关键关系';$('formula-expression').textContent=v.formula||'';$('formula-note').textContent=v.formulaNote||'';$('formula').hidden=beginner||!v.formula;document.querySelectorAll('#tabs button').forEach(b=>{const target=DATA.views.find(v=>v.id===b.dataset.view);b.textContent=viewTitle(target);b.classList.toggle('on',b.dataset.view===v.id);b.setAttribute('aria-current',b.dataset.view===v.id?'page':'false')})}
function readingSteps(){return(current?.beginner?.steps||NODES.map(n=>n.id)).filter(id=>byId[id])}
function syncReading(){const steps=readingSteps(),index=steps.indexOf(selected);$('btn-read').textContent=guided?'退出跟读':'按步骤跟读';$('btn-prev').hidden=$('btn-next').hidden=!guided;$('btn-prev').disabled=index<=0;$('btn-next').disabled=index>=steps.length-1;$('read-counter').textContent=guided?'节点 '+Math.max(1,index+1)+' / '+steps.length:'';$('read-progress').textContent=guided?viewTitle(current)+' · '+(index>=0?nodeTitle(byId[steps[index]]):'从第一个节点开始')+' · 编号是阅读顺序':'编号只代表阅读顺序。点开卡片看“输入 → 处理 → 输出”。';for(const n of NODES){n.el?.classList.toggle('current-step',guided&&n.id===selected)}}
function startReading(){guided=true;const steps=readingSteps();if(steps.length)select(steps[0]);syncReading()}

function help(){selected=null;hover=null;guided=false;panelKind='guide';highlight();syncReading();const intro=DATA.intro||{},steps=intro.steps||[{title:'先看总览：整个训练循环在做什么',text:'机器人先在物理仿真里试动作，把实际结果存起来；世界模型根据这些记录学习预测；策略再利用世界模型练习动作。'},{title:'再逐个点开节点',text:'每个节点按“输入是什么 → 在这里做什么 → 输出给谁”说明。例子帮助你把抽象名词对应到机器人动作。'},{title:'最后再看公式和梯度',text:'默认先显示资料怎么流动。等你理解数据流后，再开启“梯度/更新”，追踪网络怎么学习。'}];let h='<h2>'+esc(intro.title||'从这里开始，先理解谁在做什么')+'</h2><div class="panel-subtitle lead">'+esc(intro.description||'不需要先懂强化学习。可以先把它看成“机器人收集经历 → 学一个预测器 → 借助预测器改进动作”的反复过程。')+'</div>';h+='<button class="guide-start" id="guide-start">从第 1 页开始，按顺序跟读 →</button>';h+=steps.map((s,i)=>'<section class="guide-step"><strong>'+String(i+1)+' · '+esc(s.title)+'</strong><p>'+esc(s.text)+'</p></section>').join('');h+='<h3>这张图怎么操作</h3><p class="detail-p">点击节点看解释；点击“按步骤跟读”，依照编号逐步阅读。遇到生词，点节点下的术语或打开右上角词典。</p><p class="detail-p">拖动空白可移动画布，滚轮或 ＋ / − 可缩放；“适应屏幕”回到全图。节点也可以拖动重排，布局会保存在当前浏览器。</p><h3>先看资料流动，再看网络学习</h3><p class="detail-p">默认显示数据、反向梯度与参数更新。可关闭“梯度/更新”专注看前向数据；“只看梯度”专门看学习路径。两种路径不能混为一谈。</p><h3>“参数不改”是什么意思</h3><p class="detail-p">它表示这一步不修改某个网络自己的设置。网络仍能参与计算，也可能继续把“输入该怎么调整”的信息传给前面的网络。不同训练阶段，冻结的对象会改变。</p><p class="pnote">'+esc(intro.note||'编号是为了帮助阅读而设计的顺序，并不代表所有节点都只执行一次。很多步骤会重复循环，具体看各页说明。')+'</p><p class="mode-note">入门阅读把公式放进折叠补充。切换进阶视图可恢复技术名称、张量维度与完整说明。依据当前教师代码与方法方案 · 新增训练路径尚未实现。</p>';$('panel-body').innerHTML=h;$('guide-start').onclick=()=>{setView(DATA.views[0].id);startReading()};openPanel();$('panel').scrollTop=0}
$('stage').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.node'))return;const sx=e.clientX,sy=e.clientY,ox=view.x,oy=view.y;closePanel();$('stage').classList.add('panning');$('stage').setPointerCapture(e.pointerId);const move=ev=>{view.x=ox+ev.clientX-sx;view.y=oy+ev.clientY-sy;applyView()};const end=()=>{$('stage').classList.remove('panning');$('stage').removeEventListener('pointermove',move);$('stage').removeEventListener('pointerup',end);$('stage').removeEventListener('pointercancel',end);save()};$('stage').addEventListener('pointermove',move);$('stage').addEventListener('pointerup',end);$('stage').addEventListener('pointercancel',end)});
$('stage').addEventListener('wheel',e=>{e.preventDefault();const r=$('stage').getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0012),e.clientX-r.left,e.clientY-r.top)},{passive:false});
$('btn-mode').onclick=()=>setMode(beginner?'advanced':'beginner');$('btn-glossary').onclick=()=>openGlossary();$('btn-read').onclick=()=>{if(guided){guided=false;syncReading();if(selected)select(selected)}else startReading()};$('btn-prev').onclick=()=>readingMove(-1);$('btn-next').onclick=()=>readingMove(1);
$('btn-fit').onclick=()=>{closePanel();fit();save()};$('btn-zoom-in').onclick=()=>zoom(1.2);$('btn-zoom-out').onclick=()=>zoom(1/1.2);$('btn-labels').onclick=()=>{labels=!labels;syncButtons();highlight();save()};$('btn-gradients').onclick=()=>{gradients=!gradients;if(!gradients)gradientsOnly=false;syncButtons();drawEdges();save()};$('btn-gradient-only').onclick=()=>{gradientsOnly=!gradientsOnly;if(gradientsOnly)gradients=true;syncButtons();drawEdges();save()};$('btn-reset').onclick=()=>{closePanel();delete layouts[current.id];for(const n of NODES){[n.x,n.y]=original[current.id][n.id];n.el.style.left=n.x+'px';n.el.style.top=n.y+'px'}drawEdges();fit();save();notify('已恢复当前视图布局')};$('close-panel').onclick=closePanel;$('btn-help').onclick=help;$('close-paper').onclick=()=>$('paper-dialog').close();$('paper-image').onclick=()=>{paperMode='image';renderPaper()};$('paper-text').onclick=()=>{paperMode='text';renderPaper()};
$('btn-export').onclick=()=>{save();for(const v of DATA.views)if(!layouts[v.id])layouts[v.id]={pos:JSON.parse(JSON.stringify(original[v.id])),view:null};const d={format:FORMAT,version:1,dataVersion:DATA.version,current:current.id,layouts,labels,gradients,gradientsOnly,beginner},u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='dq-teacher-supermimic-flow-layout.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);notify('全部视图布局已导出')};$('btn-import').onclick=()=>$('layout-file').click();$('layout-file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>1000000)throw Error('布局文件过大');const d=validLayout(JSON.parse(await f.text()));layouts=d.layouts;if(typeof d.labels==='boolean')labels=d.labels;if(typeof d.gradients==='boolean')gradients=d.gradients;if(typeof d.gradientsOnly==='boolean')gradientsOnly=d.gradientsOnly;if(typeof d.beginner==='boolean')beginner=d.beginner;current=null;syncButtons();setView(DATA.views.some(v=>v.id===d.current)?d.current:DATA.views[0].id);notify('全部视图布局已恢复')}catch(err){notify('导入失败：'+err.message)}finally{e.target.value=''}};
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('paper-dialog').open)closePanel();if(e.key==='0'&&!e.target.matches('input,textarea')&&!$('paper-dialog').open){fit();save()}});
let resizeTimer,lastSize=null;new ResizeObserver(()=>{if(!ready)return;const now={w:$('stage').clientWidth,h:$('stage').clientHeight};if(!lastSize){lastSize=now;return}if(now.w===lastSize.w&&now.h===lastSize.h)return;lastSize=now;clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(!drag){measure();drawEdges();fit();save()}},100)}).observe($('stage'));
buildLegend();for(const v of DATA.views){const b=document.createElement('button');b.textContent=viewTitle(v);b.dataset.view=v.id;b.onclick=()=>setView(v.id);$('tabs').append(b)}let initial=DATA.views[0].id,restored=false;try{const d=validLayout(JSON.parse(localStorage.getItem(STORE)||'null'));layouts=d.layouts;if(typeof d.labels==='boolean')labels=d.labels;if(typeof d.gradients==='boolean')gradients=d.gradients;if(typeof d.gradientsOnly==='boolean')gradientsOnly=d.gradientsOnly;if(typeof d.beginner==='boolean')beginner=d.beginner;if(DATA.views.some(v=>v.id===d.current))initial=d.current;restored=true}catch{}syncButtons();setView(initial);ready=true;
window.DQTeacherFlow={get views(){return DATA.views},get nodes(){return NODES},get edges(){return EDGES},select,setView,fit,getView:()=>({...view}),getSelected:()=>selected,getCurrentView:()=>current.id,setMode,getMode:()=>beginner?'beginner':'advanced',openGlossary,openGuide:help,startReading,readingMove,isGuided:()=>guided};
