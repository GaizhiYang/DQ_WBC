env:
  numEnvs: 4096
  numAgents: 1
  envSpacing: 3
  terrainType: plane # Flat ground; use trimesh to load rough terrain instead
  enableDebugVis: False
  isFlagrun: False
  maxEpisodeLength: 100 
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 4
  controlFrequencyLow: 8
  imgDelayFrame: 4
  D1_bench_task_level : "Level02"
  robotStartDistanceRange: [2.0, 2.0] # Horizontal distance from robot base to object [m]
  cameraVisibilityReset: False # Keep termination rules consistent with visual distillation

  liftedSuccessThreshold: 0.2
  liftedInitThreshold: 0.05
  baseObjectDisThreshold: 0.2
  holdSteps: 10
  lastCommands: False
  noVelocityObs: False # Set --no_velocity_obs to remove 3D robot + 2D relative object velocity
  criticTimeObs: False # Set --critic_time_obs to give the critic step/maxEpisodeLength; the actor ignores it
  actorHistoryFrames: 1 # SGS+EKF launcher overrides to 4: current + 3 past frames
  actionScaling: legacy # legacy: clip raw outputs at physical limits; normalized (--action_scaling normalized): clip to [-1, 1], then scale
  successMode: hold # legacy/hold are compatibility aliases for the shared training/evaluation rule
  sgs:
    mode: disabled # disabled / uniform / sgs; enabled modes require a validated bank
    bank_path: ""
    bank_size: null # Read the loaded bank size; an explicit integer enforces an exact match
    history_size: 100
    target_success: 0.5
    kappa: 1.0
    temperature: 2.0
    epsilon: 0.0001
    p_init: 0.0
  # Scout & Relay (doc/SGS_SAPG_scout_relay_design.md); requires sgs.mode sgs/uniform.
  # These defaults are the single-policy SGS teacher: one branch, no relay bank.
  sapg:
    branches: 1 # --sapg_branches; branch 0 is the deployed leader, 1..M-1 are scouts
    leader_fraction: 0.5 # leader's share of environments; scouts split the rest
    latent_dim: 16 # learned per-branch condition vector (actor and critic)
    off_policy_coef: 1.0 # SAPG lambda for the leader's IS term; 0 = no IS channel
    entropy_coef: 0.0 # scout j adds entropy_coef * j * entropy; the leader never does
    mu_max: 0.0 # optional IS-weight truncation; 0 = untruncated (SAPG)
    chunk_size: 16384
    scout_need_beta: 1.0 # scout curriculum (w(p_S)+eps)(1-p_L+eps)^beta; 0 = per-branch SGS
    scout_target_success: null # null: leader's SGS target; list: one value per scout
  relay:
    enabled: False # --relay
    source: scouts # scouts (method) / leader (self-relay baselines)
    trigger: success # success (method) / failure (ablation)
    capacity: 4096
    alpha_max: 0.3 # cap on the relay share of leader resets; 1.0 = no cap
    tau_need: 0.3 # create chains only where leader success <= tau_need
    max_chains_per_config: 2
    fractions: [0.2, 0.4, 0.6, 0.8] # of the pre-hold horizon
    snapshot_interval: 5 # high-level steps between snapshots
    sampling: sgs # sgs (method) / uniform within the relay bank (ablation)
    history_size: 50
    master_rate: 0.9 # retire when success >= master_rate over >= master_count episodes
    master_count: 20
    useless_count: 40 # retire after this many episodes without a success
    quarantine_steps: 3 # physical failure within this many steps removes an entry
    max_new_chains_per_reset: 32
    controller_state: False # ablation: also restore gait/history controller buffers
  posePrediction:
    enabled: False # Enable with --future_pose_obs; original checkpoints keep their original observation size
    gfmFuturePoses: True # Feed forecast poses (excluding validity) into Actor/Critic GFM Query; absent in legacy configs means False
    horizons: [0.30, 0.60] # Seconds from the current observation, independent of control frequency
    history: 5
    qScale: 1.0
    rScale: 0.01

  low_policy_path: "data/low_model/model_44000.pt"
  taskddescription: "023"

