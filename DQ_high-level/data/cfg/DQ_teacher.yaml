env:
  numEnvs: 4096
  numAgents: 1
  envSpacing: 3
  terrainType: plane # Flat ground; use trimesh to load rough terrain instead
  enableDebugVis: False
  isFlagrun: False
  maxEpisodeLength: 100 
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 4
  controlFrequencyLow: 8
  imgDelayFrame: 4
  D1_bench_task_level : "Level02"
  robotStartDistanceRange: [2.0, 2.0] # Horizontal distance from robot base to object [m]
  cameraVisibilityReset: False # Keep termination rules consistent with visual distillation

  liftedSuccessThreshold: 0.2
  liftedInitThreshold: 0.05
  baseObjectDisThreshold: 0.2
  holdSteps: 10
  lastCommands: False
  noVelocityObs: False # Set --no_velocity_obs to remove 3D robot + 2D relative object velocity
  criticTimeObs: False # Set --critic_time_obs to give the critic step/maxEpisodeLength; the actor ignores it
  criticRewardStateObs: False # Set --critic_reward_state to give the critic the hidden reward state (7 channels); the actor ignores it
  actorHistoryFrames: 1 # SGS+EKF launcher overrides to 4: current + 3 past frames
  actionScaling: legacy # legacy: clip raw outputs at physical limits; normalized (--action_scaling normalized): clip to [-1, 1], then scale
  eeDeltaPositionLimit: 0.05 # m per axis per step, EE-goal increment (actions 0-2); runs without this key used 0.02
  eeDeltaRotationLimit: 0.1 # rad per RPY channel per step (actions 3-5); runs without this key used 0.06
  successMode: hold # legacy/hold are compatibility aliases for the shared training/evaluation rule
  sgs:
    mode: disabled # disabled / uniform / sgs; enabled modes require a validated bank
    bank_path: ""
    bank_size: null # Read the loaded bank size; an explicit integer enforces an exact match
    history_size: 100
    target_success: 0.5
    kappa: 1.0
    temperature: 2.0
    epsilon: 0.0001
    p_init: 0.0
  margin: # Main line A (doc/主线A_实现说明.md): learned time-to-reach T and interception margin M; off unless reachModel is set
    reachModel: "" # --reach_model: train_reachability.py output, analytic (baseline B3), or new:mlp/new:quasimetric with online
    horizonStep: 0.3 # seconds between margin horizons; the first horizon is 0
    horizonCount: 16 # 0.0, 0.3, ..., 4.5 s
    clip: 2.0 # seconds; clips the token margins and the slack potential
    chunkEnvs: 1024 # environments per T evaluation chunk (GPU memory)
    candidates: 30 # grasp candidates per object
    reward: False # --margin_reward: potential-based shaping (reward.scales.margin_shaping)
    potential: intercept # --margin_potential: intercept (Phi = 1 - tau*/8 s, 1 once lifted) / slack (clipped M, ablation)
    keepTracking: True # --no_margin_keep_tracking: zero approaching/base_approaching with the margin reward (ablation)
    tokens: False # --margin_tokens: actor/critic GFM attend to per-horizon best-grasp tokens (world-frame EKF)
    curriculum: disabled # --margin_curriculum: disabled / prior (M0 prior in SGS) / frontier (prior + faster tables)
    priorStrength: 4.0 # pseudo-episodes of the M0 prior
    priorTemperature: 0.5 # seconds
    deltaStart: 0.5 # seconds; curriculum threshold delta, linear over training ...
    deltaEnd: 0.0 # ... to this value
    frontierProbability: 0.25 # fraction of full_task resets offered a faster table
    frontierMaxSpeedScale: 1.6 # 0.30 m/s x 1.6 = 0.48 m/s at most
    frontierCandidates: 8
    online: False # --reach_online: refine T during training (EMA target, checkpointed)
    onlineInterval: 24 # environment steps between updates
    onlineUpdates: 8
    onlineBatch: 8192
    onlineLearningRate: 0.0003
    onlineEmaDecay: 0.99
    onlineFreezeFraction: 0.5 # T stops changing after this fraction of training
    window: 48 # hindsight window, environment steps
    maxPairSteps: 32 # longest hindsight pair, environment steps
    expectile: 0.1 # low expectile: lower envelope of the observed reach times
  posePrediction:
    enabled: False # Enable with --future_pose_obs; original checkpoints keep their original observation size
    gfmFuturePoses: True # Feed forecast poses (excluding validity) into Actor/Critic GFM Query; absent in legacy configs means False
    horizons: [0.30, 0.60] # Seconds from the current observation, independent of control frequency
    history: 5
    qScale: 1.0
    rScale: 0.01

  low_policy_path: "data/low_model/model_44000.pt"
  taskddescription: "023"

