# Level03 专用配置；full_task 沿用普通 reset，课程家族保留既有几何范围。
# 运动参数读取 teacher YAML 的 env.level03Motion；构建时加 --motion-level Level03。
# SGS 配置库构建参数。修改后需要重新构建 .pt 配置库，训练直接读取构建后的库。
# 单位：距离为米，角度为度；每个范围均写成 [最小值, 最大值]。
# 课程家族的 base 位置定义一致（世界坐标系、有符号）；full_task 沿用普通 reset：
#   x = 物体中心 world_x - 机器人底盘中心 world_x
#   y = 物体中心 world_y - 机器人底盘中心 world_y
# heading_reference: object_motion 时，heading_offset_range_deg 是底盘前向与物体
# 预期水平运动方向的无符号夹角范围；0 度表示同向，90 度表示正交。
# 直接均匀采样夹角，在运动方向两侧的对称朝向中选更面向物体的一侧。
# 课程家族仍要求夹角小于 90 度；可设 [75, 90]，但实际不接受恰好 90 度。
# Level03 从静止起步；课程家族朝向按保存的初始行驶方向计算（XY 模式合成两个轴方向）。
# 每个配置保存完整运动状态，训练重置后平滑加速；课程家族保存已采样的遥控意图。
# full_task 保留普通 reset 的未初始化 driver 与零滤波状态，下个控制步重新采样行驶方向。
# 缺省 heading_reference 或设为 object_bearing 时保留旧定义：
#   heading_offset = wrap(机器人 yaw - atan2(y, x))，有符号，正值逆时针。
# 范围约束用于最终状态验收，不只约束摆放目标。
# 课程家族均匀采样目标，再检查可达性、碰撞和足底大致接地；入库分布不保证均匀。
# 课程家族不要求稳定站立；pregrasp / at_grasp 做几何检查，near_goal 额外执行闭爪、抬升与保持。
# [a, a] 表示固定目标；仅这种零宽范围允许 5 mm / 1 度的物理验收容差。
# 不可达的范围会降低有效样本数，严重时导致构建失败；不会自动放宽到范围外。
schema_version: 6
heading_reference: object_motion

# 课程家族的物体朝向扰动，绕世界 z 轴，相对于正常 reset 的物体姿态。
# 不改变物体的支撑面；full_task 直接保留普通 reset 的物体姿态采样。
object:
  yaw_offset_range_deg: [-15, 15]

# 课程家族的连续短时物理检查，最后保存真实状态；不要求底盘静止或持续承重。
# 位移上限相对于本次候选物体初始位置；接触力上限用于拒绝明显冲击。
validation:
  physics_steps: 5
  max_object_displacement_m: 0.02
  max_contact_force_n: 5000.0

# 完整任务起步：直接保存普通 reset 的起点分布。
# 位置/姿态/关节/物体/桌面初始化由 teacher 环境决定；不再摆放、接地或按运动方向筛选。
# full_task 的行驶方向按普通 reset 在每回合重新抽取，不绑定为该配置的固定方向。
# source 模式不接受 base / arm_pose 覆盖，避免这些参数被静默忽略。
full_task:
  source: ordinary_reset

# 临近抓取：夹爪打开，末端位于候选抓取位姿的 local -x 一侧。
# 距离仍是到候选原点的欧氏距离 d；横向 y 和上下 z 偏差均在候选局部坐标系。
# x = -sqrt(d^2-y^2-z^2)，因此叠加 y/z 偏差不会自动扩大所设距离。
# d/y/z 分别均匀采样；若 y^2+z^2 >= d^2，该组合记为 sample_geometry 拒绝。
# 不会缩小所设范围；只在整个参数范围没有任何可行组合时提前报错。
# 姿态在候选坐标系中追加 roll/pitch/yaw 扰动，每轴限制在 [-45, 45] 度。
pregrasp:
  base:
    x_range_m: [0.80, 0.95]
    y_range_m: [-0.2, 0.2]
    heading_offset_range_deg: [45.0, 75.0]
  ee_approach_distance_range_m: [0.05, 0.15]
  ee_lateral_offset_range_m: [-0.05, 0.05]
  ee_vertical_offset_range_m: [-0.05, 0.05]
  ee_rotation_offset_range_deg:
    roll: [-5, 5]
    pitch: [-5, 5]
    yaw: [-5, 5]

# 已到抓取位姿：末端精确对齐所选候选，夹爪未完全闭合；其余条件沿用 pregrasp。
# base 引用保证修改 pregrasp 底盘范围时两类同步；不沿用其接近距离和末端姿态扰动。
# 开度 0=完全闭合、1=完全张开；schema 6 要求下限严格大于 0。
at_grasp:
  base:
    same_as: pregrasp
  gripper_opening_range: [0.2, 1.0]

# Near-Goal：真实夹住物体并抬升 5–10 cm，尚未达到任务成功高度。
# 高度 = object_z - table_height - init_height；不是物体中心到桌面的绝对距离。
# 只在离线构库时运行闭爪、抬升与保持，训练直接恢复保存的抓持状态。
near_goal:
  base:
    x_range_m: [0.68, 0.85]
    y_range_m: [-0.1, 0.1]
    heading_offset_range_deg: [45.0, 75.0]
  object_lift_height_range_m: [0.05, 0.10]
  close_time_s: 1.50
  lift_time_s: 0.60
  hold_time_s: 0.20 # 至少 0.1 s；过短窗口可能把尚未落下的物体误判为抓住
  max_relative_slip_m: 0.01 # 保持阶段物体相对末端的最大位置变化
  max_relative_rotation_deg: 10.0 # 保持阶段物体相对末端的最大旋转变化
  min_finger_contact_force_n: 0.2 # 单指接触力范数下限
  min_contact_fraction: 0.8 # 保持阶段两指同时达到接触力下限的帧比例
  max_object_speed_m_s: 0.10 # 保存前物体线速度上限，排除正在明显滑落的状态
